        run: |
          grep -F 'rootProject.name = "TomTomKiszolgaloV006"' settings.gradle.kts
          grep -F 'versionCode = 6' app/build.gradle.kts
          grep -F 'versionName = "006"' app/build.gradle.kts
          grep -F 'TomTom Kiszolgáló V006' app/src/main/AndroidManifest.xml
          grep -F 'private static final String VERSION = "V006";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java
          grep -F 'private static final String VERSION = "V006";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'getLaunchIntentForPackage(TOMTOM_PACKAGE)' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'AccessibilityNodeInfo.ACTION_SET_TEXT' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
