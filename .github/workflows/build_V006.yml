name: Build TomTom Kiszolgalo V006

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create TomTom Kiszolgalo V006 one-tap project
        run: |
          mkdir -p app/src/main/java/hu/pocsaji/tomtomkiszolgalo
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TomTomKiszolgaloV006"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins {
              id("com.android.application")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }

          android {
              namespace = "hu.pocsaji.tomtomkiszolgalo"
              compileSdk = 36

              defaultConfig {
                  applicationId = "hu.pocsaji.tomtomkiszolgalo"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 6
                  versionName = "006"
              }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2C74D6</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">TomTom Kiszolgáló V006</string>
              <string name="accessibility_service_description">A képernyőn látható szállítási cím felismerése, a TomTom GO megnyitása, majd a cím automatikus beírása és a találat kiválasztása.</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_map.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#17365F"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,29L43,21L65,29L84,21L84,78L65,86L43,78L24,86ZM43,29L31,34L31,75L43,70ZM50,30L50,70L62,76L62,36ZM69,35L69,76L77,73L77,32Z" />
              <path
                  android:fillColor="#E53935"
                  android:pathData="M63,22C52,22 44,30 44,41C44,55 63,74 63,74C63,74 82,55 82,41C82,30 74,22 63,22ZM63,48A7,7 0,1 1,63 34A7,7 0,1 1,63 48Z" />
          </vector>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.tomtom.gplay.navapp" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="TomTom Kiszolgáló V006"
                  android:icon="@drawable/ic_launcher_map"
                  android:roundIcon="@drawable/ic_launcher_map"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TomTomAccessibilityService"
                      android:exported="false"
                      android:label="TomTom Kiszolgáló V006"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class MainActivity extends Activity {
              private static final String VERSION = "V006";
              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(24), dp(40), dp(24), dp(24));
                  root.setBackgroundColor(Color.rgb(16, 19, 24));

                  TextView title = new TextView(this);
                  title.setText("TomTom Kiszolgáló " + VERSION);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(title.getTypeface(), android.graphics.Typeface.BOLD);
                  root.addView(title, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView description = new TextView(this);
                  description.setText(
                          "Napi használat: nyisd meg a fuvarfeladatot, majd nyomd meg az egyetlen lebegő TT gombot.\n\n" +
                          "A program kiolvassa a látható SZÁLLÍTÁS címet, megnyitja a TomTom GO alkalmazást, majd automatikusan beírja a címet a keresőbe és kiválasztja a találatot.\n\n" +
                          "Nincs gépelés, másolás, beillesztés, Chrome vagy weboldal.");
                  description.setTextColor(Color.rgb(220, 225, 232));
                  description.setTextSize(19);
                  description.setLineSpacing(0f, 1.15f);
                  description.setPadding(0, dp(28), 0, dp(28));
                  root.addView(description, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  statusText = new TextView(this);
                  statusText.setTextSize(18);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(dp(12), dp(18), dp(12), dp(18));
                  root.addView(statusText, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  Button settingsButton = new Button(this);
                  settingsButton.setText("EGYSZERI BEÁLLÍTÁS MEGNYITÁSA");
                  settingsButton.setTextSize(18);
                  settingsButton.setTextColor(Color.WHITE);
                  settingsButton.setBackgroundColor(Color.rgb(44, 116, 214));
                  settingsButton.setMinHeight(dp(72));
                  settingsButton.setOnClickListener(v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  LinearLayout.LayoutParams buttonParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(72));
                  buttonParams.topMargin = dp(14);
                  root.addView(settingsButton, buttonParams);

                  TextView note = new TextView(this);
                  note.setText(
                          "A beállításokban egyszer kapcsold be a „TomTom Kiszolgáló V006” szolgáltatást. " +
                          "Ezután megjelenik a kis lebegő TT gomb, és a napi használat egyetlen érintés.");
                  note.setTextColor(Color.rgb(170, 178, 190));
                  note.setTextSize(15);
                  note.setPadding(0, dp(24), 0, 0);
                  root.addView(note, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateStatus();
              }

              private void updateStatus() {
                  boolean enabled = isAccessibilityServiceEnabled();
                  statusText.setText(enabled
                          ? "AKTÍV – a lebegő TT gomb használható"
                          : "NINCS BEKAPCSOLVA – egyszeri beállítás szükséges");
                  statusText.setTextColor(enabled
                          ? Color.rgb(85, 210, 120)
                          : Color.rgb(255, 170, 70));
              }

              private boolean isAccessibilityServiceEnabled() {
                  ComponentName expected = new ComponentName(this, TomTomAccessibilityService.class);
                  String enabledServices = Settings.Secure.getString(
                          getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (TextUtils.isEmpty(enabledServices)) return false;

                  TextUtils.SimpleStringSplitter splitter =
                          new TextUtils.SimpleStringSplitter(':');
                  splitter.setString(enabledServices);
                  while (splitter.hasNext()) {
                      ComponentName enabled = ComponentName.unflattenFromString(splitter.next());
                      if (expected.equals(enabled)) return true;
                  }
                  return false;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
          EOF

          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.HardwareBuffer;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import android.widget.TextView;
          import android.widget.Toast;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

          import java.text.Normalizer;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class TomTomAccessibilityService extends AccessibilityService {
              private static final String VERSION = "V006";
              private static final String TOMTOM_PACKAGE = "com.tomtom.gplay.navapp";
              private static final Pattern POSTAL_CODE = Pattern.compile("(?<!\\d)\\d{4,5}(?!\\d)");
              private static final Pattern HOUSE_NUMBER = Pattern.compile("\\b\\d{1,5}[A-Za-z]?\\b");
              private static final Set<String> COUNTRY_CODES = new HashSet<>(Arrays.asList(
                      "AT", "BE", "BG", "CH", "CZ", "DE", "DK", "EE", "ES", "FI", "FR",
                      "GR", "HR", "HU", "IE", "IT", "LT", "LU", "LV", "NL", "NO", "PL",
                      "PT", "RO", "RS", "SE", "SI", "SK", "UK"));
              private static final List<String> DELIVERY_MARKERS = Arrays.asList(
                      "SZALLITAS", "DELIVERY", "LIVRAISON", "LIEFERUNG", "CONSEGNA",
                      "LEVERING", "ENTREGA", "DOSTAWA");

              private static final int STAGE_NONE = 0;
              private static final int STAGE_OPEN_SEARCH = 1;
              private static final int STAGE_ENTER_ADDRESS = 2;
              private static final int STAGE_SELECT_RESULT = 3;

              private WindowManager windowManager;
              private TextView floatingButton;
              private WindowManager.LayoutParams floatingParams;
              private TextRecognizer textRecognizer;
              private final AtomicBoolean processing = new AtomicBoolean(false);
              private final Handler handler = new Handler(Looper.getMainLooper());

              private String pendingAddress;
              private String pendingPostalCode;
              private List<String> pendingAddressTokens = Collections.emptyList();
              private int automationStage = STAGE_NONE;
              private int automationAttempts;
              private long automationDeadline;
              private boolean automationScheduled;
              private boolean imeEnterSent;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (pendingAddress != null) {
                      scheduleAutomationStep(220);
                  }
              }

              @Override
              public void onInterrupt() {
                  cancelAutomation(null);
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  textRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                  showFloatingButton();
                  Toast.makeText(this,
                          "TomTom Kiszolgáló " + VERSION + " aktív.",
                          Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  removeFloatingButton();
                  if (textRecognizer != null) {
                      textRecognizer.close();
                      textRecognizer = null;
                  }
                  super.onDestroy();
              }

              private void showFloatingButton() {
                  if (floatingButton != null) return;

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  floatingButton = new TextView(this);
                  floatingButton.setText("TT");
                  floatingButton.setContentDescription("Szállítási cím küldése a TomTomnak");
                  floatingButton.setTextColor(Color.WHITE);
                  floatingButton.setTextSize(20);
                  floatingButton.setGravity(Gravity.CENTER);
                  floatingButton.setTypeface(
                          floatingButton.getTypeface(),
                          android.graphics.Typeface.BOLD);
                  floatingButton.setElevation(dp(12));
                  setButtonColor(Color.rgb(0, 150, 75));

                  floatingParams = new WindowManager.LayoutParams(
                          dp(64),
                          dp(64),
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  floatingParams.gravity = Gravity.TOP | Gravity.END;
                  floatingParams.x = dp(10);
                  floatingParams.y = dp(180);

                  floatingButton.setOnTouchListener(new FloatingTouchListener());
                  windowManager.addView(floatingButton, floatingParams);
              }

              private void setButtonColor(int color) {
                  if (floatingButton == null) return;
                  GradientDrawable background = new GradientDrawable();
                  background.setShape(GradientDrawable.OVAL);
                  background.setColor(color);
                  background.setStroke(dp(2), Color.WHITE);
                  floatingButton.setBackground(background);
              }

              private void removeFloatingButton() {
                  if (windowManager != null && floatingButton != null) {
                      try {
                          windowManager.removeView(floatingButton);
                      } catch (RuntimeException ignored) {
                      }
                  }
                  floatingButton = null;
                  floatingParams = null;
              }

              private void processVisibleDeliveryAddress() {
                  if (!processing.compareAndSet(false, true)) return;
                  floatingButton.setText("…");
                  setButtonColor(Color.rgb(230, 145, 35));
                  Toast.makeText(this, "Cím felismerése…", Toast.LENGTH_SHORT).show();

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      processAccessibilityFallback("A képernyőkép-felismeréshez Android 11 vagy újabb szükséges.");
                      return;
                  }

                  takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          getMainExecutor(),
                          new TakeScreenshotCallback() {
                              @Override
                              public void onSuccess(ScreenshotResult screenshot) {
                                  recognizeScreenshot(screenshot);
                              }

                              @Override
                              public void onFailure(int errorCode) {
                                  processAccessibilityFallback(
                                          "A képernyőkép nem olvasható (hiba: " + errorCode + ").");
                              }
                          });
              }

              private void recognizeScreenshot(ScreenshotResult screenshot) {
                  HardwareBuffer buffer = screenshot.getHardwareBuffer();
                  Bitmap hardwareBitmap = null;
                  Bitmap bitmap = null;
                  try {
                      hardwareBitmap = Bitmap.wrapHardwareBuffer(buffer, screenshot.getColorSpace());
                      if (hardwareBitmap != null) {
                          bitmap = hardwareBitmap.copy(Bitmap.Config.ARGB_8888, false);
                      }
                  } catch (RuntimeException ignored) {
                  } finally {
                      if (hardwareBitmap != null) hardwareBitmap.recycle();
                      buffer.close();
                  }

                  if (bitmap == null) {
                      processAccessibilityFallback("A képernyő képe nem alakítható szöveggé.");
                      return;
                  }

                  final Bitmap finalBitmap = bitmap;
                  InputImage image = InputImage.fromBitmap(finalBitmap, 0);
                  textRecognizer.process(image)
                          .addOnSuccessListener(this::handleRecognizedText)
                          .addOnFailureListener(error ->
                                  processAccessibilityFallback("A szövegfelismerés nem sikerült."))
                          .addOnCompleteListener(task -> finalBitmap.recycle());
              }

              private void handleRecognizedText(Text visionText) {
                  List<OcrLine> positionedLines = new ArrayList<>();
                  for (Text.TextBlock block : visionText.getTextBlocks()) {
                      for (Text.Line line : block.getLines()) {
                          String value = line.getText() == null ? "" : line.getText().trim();
                          Rect box = line.getBoundingBox();
                          if (!value.isEmpty() && box != null) {
                              positionedLines.add(new OcrLine(value, box.top, box.left));
                          }
                      }
                  }

                  positionedLines.sort((a, b) -> {
                      int verticalTolerance = dp(12);
                      if (Math.abs(a.top - b.top) <= verticalTolerance) {
                          return Integer.compare(a.left, b.left);
                      }
                      return Integer.compare(a.top, b.top);
                  });

                  List<String> lines = new ArrayList<>();
                  for (OcrLine line : positionedLines) lines.add(line.text);
                  String address = AddressExtractor.findDeliveryAddress(lines);

                  if (address == null || address.isBlank()) {
                      processAccessibilityFallback(
                              "Nem találtam használható SZÁLLÍTÁS címet ezen a képernyőn.");
                      return;
                  }

                  startTomTomAutomation(address);
              }

              private void processAccessibilityFallback(String failureMessage) {
                  List<String> visibleLines = readVisibleLinesSafely();
                  String address = AddressExtractor.findDeliveryAddress(visibleLines);
                  if (address != null && !address.isBlank()) {
                      startTomTomAutomation(address);
                  } else {
                      Toast.makeText(this, failureMessage, Toast.LENGTH_LONG).show();
                      finishProcessing();
                  }
              }

              private void startTomTomAutomation(String address) {
                  pendingAddress = address;
                  pendingPostalCode = extractPostalCode(address);
                  pendingAddressTokens = buildAddressTokens(address);
                  automationStage = STAGE_OPEN_SEARCH;
                  automationAttempts = 0;
                  automationDeadline = SystemClock.uptimeMillis() + 18000L;
                  automationScheduled = false;
                  imeEnterSent = false;

                  floatingButton.setText("→");
                  setButtonColor(Color.rgb(45, 105, 205));
                  Toast.makeText(this, "TomTom megnyitása: " + address, Toast.LENGTH_LONG).show();

                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(TOMTOM_PACKAGE);
                  if (launchIntent == null) {
                      cancelAutomation("A TomTom GO nincs telepítve vagy nem indítható.");
                      return;
                  }

                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  try {
                      startActivity(launchIntent);
                      scheduleAutomationStep(850);
                  } catch (RuntimeException error) {
                      cancelAutomation("A TomTom GO nem nyitható meg.");
                  }
              }

              private void scheduleAutomationStep(long delayMs) {
                  if (pendingAddress == null || automationScheduled) return;
                  automationScheduled = true;
                  handler.postDelayed(() -> {
                      automationScheduled = false;
                      runAutomationStep();
                  }, delayMs);
              }

              private void runAutomationStep() {
                  if (pendingAddress == null) return;
                  if (SystemClock.uptimeMillis() > automationDeadline) {
                      cancelAutomation("A TomTom keresőmezője nem volt elérhető. A cím nem került be.");
                      return;
                  }

                  AccessibilityNodeInfo root = findTomTomRoot();
                  if (root == null) {
                      scheduleAutomationStep(450);
                      return;
                  }

                  automationAttempts++;
                  try {
                      if (automationStage == STAGE_OPEN_SEARCH) {
                          AccessibilityNodeInfo editable = findBestEditable(root);
                          if (editable != null) {
                              automationStage = STAGE_ENTER_ADDRESS;
                              scheduleAutomationStep(80);
                              return;
                          }

                          AccessibilityNodeInfo searchControl = findSearchControl(root);
                          if (searchControl != null && clickNodeOrAncestor(searchControl)) {
                              automationStage = STAGE_ENTER_ADDRESS;
                              scheduleAutomationStep(650);
                              return;
                          }

                          if (automationAttempts >= 4) {
                              tapTomTomSearchArea();
                              automationStage = STAGE_ENTER_ADDRESS;
                              scheduleAutomationStep(700);
                              return;
                          }
                      } else if (automationStage == STAGE_ENTER_ADDRESS) {
                          AccessibilityNodeInfo editable = findBestEditable(root);
                          if (editable != null && setNodeText(editable, pendingAddress)) {
                              automationStage = STAGE_SELECT_RESULT;
                              automationAttempts = 0;
                              Toast.makeText(this, "Cím beírva, találat kiválasztása…", Toast.LENGTH_SHORT).show();
                              scheduleAutomationStep(900);
                              return;
                          }

                          AccessibilityNodeInfo searchControl = findSearchControl(root);
                          if (searchControl != null) clickNodeOrAncestor(searchControl);
                          if (automationAttempts >= 4) tapTomTomSearchArea();
                      } else if (automationStage == STAGE_SELECT_RESULT) {
                          AccessibilityNodeInfo result = findBestAddressResult(root);
                          if (result != null && clickNodeOrAncestor(result)) {
                              completeAutomation();
                              return;
                          }

                          AccessibilityNodeInfo editable = findBestEditable(root);
                          if (!imeEnterSent && automationAttempts >= 3 && editable != null) {
                              imeEnterSent = performImeEnter(editable);
                              if (imeEnterSent) {
                                  scheduleAutomationStep(900);
                                  return;
                              }
                          }

                          if (imeEnterSent && automationAttempts >= 6 && editable == null) {
                              completeAutomation();
                              return;
                          }
                      }
                  } finally {
                      root.recycle();
                  }

                  scheduleAutomationStep(450);
              }

              private AccessibilityNodeInfo findTomTomRoot() {
                  try {
                      List<AccessibilityWindowInfo> windows = new ArrayList<>(getWindows());
                      windows.sort(Comparator.comparingInt(AccessibilityWindowInfo::getLayer).reversed());
                      for (AccessibilityWindowInfo window : windows) {
                          AccessibilityNodeInfo root = window.getRoot();
                          if (root == null) continue;
                          CharSequence packageName = root.getPackageName();
                          if (packageName != null && TOMTOM_PACKAGE.contentEquals(packageName)) {
                              return root;
                          }
                          root.recycle();
                      }
                  } catch (RuntimeException ignored) {
                  }
                  return null;
              }

              private AccessibilityNodeInfo findBestEditable(AccessibilityNodeInfo root) {
                  List<AccessibilityNodeInfo> nodes = new ArrayList<>();
                  collectNodes(root, nodes, 0);
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MIN_VALUE;
                  for (AccessibilityNodeInfo node : nodes) {
                      if (!node.isVisibleToUser()) continue;
                      String className = textOf(node.getClassName());
                      boolean editable = node.isEditable() || className.contains("EditText") ||
                              node.getActionList().contains(AccessibilityNodeInfo.AccessibilityAction.ACTION_SET_TEXT);
                      if (!editable) continue;

                      String descriptor = normalize(nodeDescriptor(node));
                      int score = 10;
                      if (containsAny(descriptor, "SEARCH", "KERES", "DESTINATION", "PLACE", "WHERE", "HOVA", "CIM")) score += 12;
                      if (node.isFocused()) score += 6;
                      if (node.isClickable()) score += 2;
                      if (score > bestScore) {
                          bestScore = score;
                          best = node;
                      }
                  }
                  return best;
              }

              private AccessibilityNodeInfo findSearchControl(AccessibilityNodeInfo root) {
                  List<AccessibilityNodeInfo> nodes = new ArrayList<>();
                  collectNodes(root, nodes, 0);
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MIN_VALUE;
                  for (AccessibilityNodeInfo node : nodes) {
                      if (!node.isVisibleToUser()) continue;
                      String descriptor = normalize(nodeDescriptor(node));
                      if (descriptor.isEmpty()) continue;

                      int score = 0;
                      if (containsAny(descriptor,
                              "SEARCH", "KERES", "HELY KERESE", "HOVA", "DESTINATION", "WHERE TO",
                              "PLACE", "ZOEK", "RECHERCH", "SUCH", "CERCA", "BUSCAR")) score += 15;
                      String viewId = textOf(node.getViewIdResourceName()).toLowerCase(Locale.ROOT);
                      if (viewId.contains("search")) score += 12;
                      if (node.isClickable()) score += 4;
                      if (hasClickableAncestor(node)) score += 2;
                      if (score > bestScore) {
                          bestScore = score;
                          best = node;
                      }
                  }
                  return bestScore >= 12 ? best : null;
              }

              private AccessibilityNodeInfo findBestAddressResult(AccessibilityNodeInfo root) {
                  List<AccessibilityNodeInfo> nodes = new ArrayList<>();
                  collectNodes(root, nodes, 0);
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MIN_VALUE;
                  for (AccessibilityNodeInfo node : nodes) {
                      if (!node.isVisibleToUser() || node.isEditable()) continue;
                      String descriptor = normalize(nodeDescriptor(node));
                      if (descriptor.length() < 3) continue;

                      int score = 0;
                      if (pendingPostalCode != null && descriptor.contains(pendingPostalCode)) score += 30;
                      for (String token : pendingAddressTokens) {
                          if (descriptor.contains(token)) score += token.matches("\\d{4,5}") ? 12 : 4;
                      }
                      if (node.isClickable()) score += 6;
                      if (hasClickableAncestor(node)) score += 3;
                      if (containsAny(descriptor, "RECENT", "LEGUTOBBI", "CURRENT LOCATION", "AKTUALIS HELY")) score -= 20;

                      if (score > bestScore) {
                          bestScore = score;
                          best = node;
                      }
                  }
                  return bestScore >= 12 ? best : null;
              }

              private void collectNodes(AccessibilityNodeInfo node, List<AccessibilityNodeInfo> output, int depth) {
                  if (node == null || depth > 70) return;
                  output.add(node);
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) collectNodes(child, output, depth + 1);
                  }
              }

              private boolean setNodeText(AccessibilityNodeInfo node, String value) {
                  try {
                      node.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                      node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      Bundle arguments = new Bundle();
                      arguments.putCharSequence(
                              AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                              value);
                      return node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments);
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }

              private boolean performImeEnter(AccessibilityNodeInfo editable) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return false;
                  try {
                      return editable.performAction(
                              AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId());
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }

              private boolean clickNodeOrAncestor(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node;
                  for (int level = 0; current != null && level < 8; level++) {
                      try {
                          if (current.isVisibleToUser() && current.isClickable() &&
                                  current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                              return true;
                          }
                          AccessibilityNodeInfo parent = current.getParent();
                          if (current != node) current.recycle();
                          current = parent;
                      } catch (RuntimeException ignored) {
                          break;
                      }
                  }
                  if (current != null && current != node) current.recycle();
                  return false;
              }

              private boolean hasClickableAncestor(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node.getParent();
                  for (int level = 0; current != null && level < 6; level++) {
                      if (current.isClickable()) {
                          current.recycle();
                          return true;
                      }
                      AccessibilityNodeInfo parent = current.getParent();
                      current.recycle();
                      current = parent;
                  }
                  return false;
              }

              private void tapTomTomSearchArea() {
                  if (windowManager == null) return;
                  android.util.DisplayMetrics metrics = new android.util.DisplayMetrics();
                  windowManager.getDefaultDisplay().getRealMetrics(metrics);
                  float x = metrics.widthPixels * 0.50f;
                  float y = Math.max(dp(76), metrics.heightPixels * 0.085f);
                  dispatchTap(x, y);
              }

              private void dispatchTap(float x, float y) {
                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(path, 0, 80);
                  GestureDescription gesture = new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();
                  dispatchGesture(gesture, null, null);
              }

              private String nodeDescriptor(AccessibilityNodeInfo node) {
                  StringBuilder builder = new StringBuilder();
                  append(builder, node.getText());
                  append(builder, node.getContentDescription());
                  append(builder, node.getHintText());
                  append(builder, node.getPaneTitle());
                  append(builder, node.getViewIdResourceName());
                  return builder.toString();
              }

              private void append(StringBuilder builder, CharSequence value) {
                  if (value == null || value.length() == 0) return;
                  if (builder.length() > 0) builder.append(' ');
                  builder.append(value);
              }

              private String textOf(CharSequence value) {
                  return value == null ? "" : value.toString();
              }

              private boolean containsAny(String value, String... needles) {
                  for (String needle : needles) {
                      if (value.contains(needle)) return true;
                  }
                  return false;
              }

              private String extractPostalCode(String address) {
                  Matcher matcher = POSTAL_CODE.matcher(address);
                  return matcher.find() ? matcher.group() : null;
              }

              private List<String> buildAddressTokens(String address) {
                  String normalized = normalize(address);
                  List<String> tokens = new ArrayList<>();
                  for (String token : normalized.split("[^A-Z0-9]+")) {
                      if (token.length() >= 3 && !COUNTRY_CODES.contains(token)) tokens.add(token);
                  }
                  return tokens;
              }

              private void completeAutomation() {
                  Toast.makeText(this, "A cím bekerült a TomTom keresésébe.", Toast.LENGTH_LONG).show();
                  pendingAddress = null;
                  pendingPostalCode = null;
                  pendingAddressTokens = Collections.emptyList();
                  automationStage = STAGE_NONE;
                  automationAttempts = 0;
                  imeEnterSent = false;
                  finishProcessing();
              }

              private void cancelAutomation(String message) {
                  pendingAddress = null;
                  pendingPostalCode = null;
                  pendingAddressTokens = Collections.emptyList();
                  automationStage = STAGE_NONE;
                  automationAttempts = 0;
                  automationScheduled = false;
                  imeEnterSent = false;
                  if (message != null && !message.isBlank()) {
                      Toast.makeText(this, message, Toast.LENGTH_LONG).show();
                  }
                  finishProcessing();
              }

              private void finishProcessing() {
                  processing.set(false);
                  if (floatingButton != null) {
                      floatingButton.setText("TT");
                      setButtonColor(Color.rgb(0, 150, 75));
                  }
              }

              private List<String> readVisibleLinesSafely() {
                  try {
                      List<AccessibilityWindowInfo> windows = new ArrayList<>(getWindows());
                      windows.sort(Comparator.comparingInt(AccessibilityWindowInfo::getLayer).reversed());
                      for (AccessibilityWindowInfo window : windows) {
                          AccessibilityNodeInfo root = window.getRoot();
                          if (root == null) continue;
                          try {
                              CharSequence packageName = root.getPackageName();
                              String packageText = packageName == null ? "" : packageName.toString();
                              if (getPackageName().equals(packageText) ||
                                      "com.android.systemui".equals(packageText) ||
                                      TOMTOM_PACKAGE.equals(packageText)) {
                                  continue;
                              }
                              List<String> lines = new ArrayList<>();
                              collectVisibleText(root, lines, 0);
                              if (!lines.isEmpty()) return deduplicateAdjacent(lines);
                          } finally {
                              root.recycle();
                          }
                      }
                  } catch (RuntimeException ignored) {
                  }
                  return Collections.emptyList();
              }

              private void collectVisibleText(AccessibilityNodeInfo node, List<String> output, int depth) {
                  if (node == null || depth > 80) return;
                  if (node.isVisibleToUser()) {
                      addText(node.getText(), output);
                      if (node.getText() == null || node.getText().length() == 0) {
                          addText(node.getContentDescription(), output);
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          try {
                              collectVisibleText(child, output, depth + 1);
                          } finally {
                              child.recycle();
                          }
                      }
                  }
              }

              private void addText(CharSequence value, List<String> output) {
                  if (value == null) return;
                  String text = value.toString().replace('\u00A0', ' ').trim();
                  if (text.isEmpty()) return;
                  for (String part : text.split("\\r?\\n")) {
                      String clean = part.replaceAll("\\s+", " ").trim();
                      if (!clean.isEmpty()) output.add(clean);
                  }
              }

              private List<String> deduplicateAdjacent(List<String> source) {
                  List<String> result = new ArrayList<>();
                  String previous = null;
                  for (String value : source) {
                      if (!value.equals(previous)) result.add(value);
                      previous = value;
                  }
                  return result;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private static String normalize(String value) {
                  if (value == null) return "";
                  String decomposed = Normalizer.normalize(
                          value.toUpperCase(Locale.ROOT),
                          Normalizer.Form.NFD);
                  return decomposed.replaceAll("\\p{M}+", "")
                          .replaceAll("\\s+", " ")
                          .trim();
              }

              private final class FloatingTouchListener implements View.OnTouchListener {
                  private int startX;
                  private int startY;
                  private float startRawX;
                  private float startRawY;
                  private long downTime;
                  private boolean dragging;

                  @Override
                  public boolean onTouch(View view, MotionEvent event) {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              startX = floatingParams.x;
                              startY = floatingParams.y;
                              startRawX = event.getRawX();
                              startRawY = event.getRawY();
                              downTime = SystemClock.uptimeMillis();
                              dragging = false;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - startRawX;
                              float dy = event.getRawY() - startRawY;
                              long held = SystemClock.uptimeMillis() - downTime;
                              if (!dragging && held >= 450 &&
                                      (Math.abs(dx) > dp(24) || Math.abs(dy) > dp(24))) {
                                  dragging = true;
                              }
                              if (dragging) {
                                  floatingParams.x = Math.max(0, startX - Math.round(dx));
                                  floatingParams.y = Math.max(0, startY + Math.round(dy));
                                  windowManager.updateViewLayout(floatingButton, floatingParams);
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                              if (!dragging) processVisibleDeliveryAddress();
                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              dragging = false;
                              return true;

                          default:
                              return true;
                      }
                  }
              }

              private static final class OcrLine {
                  final String text;
                  final int top;
                  final int left;

                  OcrLine(String text, int top, int left) {
                      this.text = text;
                      this.top = top;
                      this.left = left;
                  }
              }

              private static final class AddressExtractor {
                  private AddressExtractor() {
                  }

                  static String findDeliveryAddress(List<String> originalLines) {
                      if (originalLines == null || originalLines.isEmpty()) return null;

                      List<String> lines = new ArrayList<>();
                      for (String line : originalLines) {
                          String clean = clean(line);
                          if (!clean.isEmpty() && !"TT".equalsIgnoreCase(clean)) lines.add(clean);
                      }
                      if (lines.isEmpty()) return null;

                      int deliveryIndex = -1;
                      for (int i = 0; i < lines.size(); i++) {
                          String normalized = normalize(lines.get(i));
                          for (String marker : DELIVERY_MARKERS) {
                              if (normalized.equals(marker) || normalized.startsWith(marker + " ")) {
                                  deliveryIndex = i;
                              }
                          }
                      }

                      Candidate best = null;
                      int start = deliveryIndex >= 0 ? deliveryIndex + 1 : 0;
                      int end = deliveryIndex >= 0
                              ? Math.min(lines.size(), deliveryIndex + 16)
                              : lines.size();

                      for (int i = start; i < end; i++) {
                          for (int count = 1; count <= 3 && i + count <= end; count++) {
                              String joined = joinAddressLines(lines, i, count);
                              Candidate candidate = score(joined, deliveryIndex >= 0, i - start);
                              if (candidate != null && (best == null || candidate.score > best.score)) {
                                  best = candidate;
                              }
                          }
                      }

                      if (best == null && deliveryIndex >= 0) {
                          for (int i = 0; i < lines.size(); i++) {
                              for (int count = 1; count <= 3 && i + count <= lines.size(); count++) {
                                  Candidate candidate = score(joinAddressLines(lines, i, count), false, i);
                                  if (candidate != null && (best == null || candidate.score > best.score)) {
                                      best = candidate;
                                  }
                              }
                          }
                      }

                      return best == null ? null : best.address;
                  }

                  private static String joinAddressLines(List<String> lines, int start, int count) {
                      int first = start;
                      int end = start + count;
                      while (first < end - 1 && isLikelyCompanyName(lines.get(first))) first++;
                      StringBuilder builder = new StringBuilder();
                      for (int i = first; i < end; i++) {
                          String line = clean(lines.get(i));
                          if (line.isEmpty() || isNoise(normalize(line))) continue;
                          if (builder.length() > 0) builder.append(", ");
                          builder.append(line);
                      }
                      return builder.toString();
                  }

                  private static boolean isLikelyCompanyName(String value) {
                      String normalized = normalize(value);
                      return !POSTAL_CODE.matcher(value).find() &&
                              !HOUSE_NUMBER.matcher(value).find() &&
                              !containsStreetHint(normalized) &&
                              !containsCountryCode(normalized);
                  }

                  private static Candidate score(String raw, boolean afterDelivery, int distance) {
                      String value = clean(raw);
                      if (value.length() < 8 || value.length() > 180) return null;

                      String normalized = normalize(value);
                      if (isNoise(normalized)) return null;

                      Matcher postalMatcher = POSTAL_CODE.matcher(value);
                      boolean hasPostal = postalMatcher.find();
                      boolean hasCountry = containsCountryCode(normalized);
                      boolean hasHouse = HOUSE_NUMBER.matcher(value).find();
                      boolean hasStreetHint = containsStreetHint(normalized);

                      if (!hasPostal || (!hasCountry && !hasStreetHint)) return null;

                      int score = 0;
                      if (afterDelivery) score += 10;
                      if (hasPostal) score += 7;
                      if (hasCountry) score += 6;
                      if (hasHouse) score += 4;
                      if (hasStreetHint) score += 5;
                      if (value.contains(",")) score += 2;
                      score -= Math.min(distance, 8);

                      return new Candidate(normalizeAddress(value), score);
                  }

                  private static boolean containsCountryCode(String normalized) {
                      for (String token : normalized.split("[^A-Z]+")) {
                          if (COUNTRY_CODES.contains(token)) return true;
                      }
                      return false;
                  }

                  private static boolean containsStreetHint(String normalized) {
                      String padded = " " + normalized + " ";
                      String[] hints = {
                              " RUE ", " AVENUE ", " ROUTE ", " CHEMIN ", " QUAI ",
                              " STRASSE ", " STR. ", " WEG ", " PLATZ ", " GASSE ",
                              " UTCA ", " UT ", " TER ", " KORUT ",
                              " STREET ", " ROAD ", " LANE ", " DRIVE ",
                              " KAAI ", " LAAN ", " STRAAT "
                      };
                      for (String hint : hints) {
                          if (padded.contains(hint)) return true;
                      }
                      return false;
                  }

                  private static boolean isNoise(String normalized) {
                      return (normalized.matches(".*\\b(20\\d{2}|19\\d{2})\\.?.*") &&
                              normalized.matches(".*\\b\\d{1,2}:\\d{2}\\b.*")) ||
                              normalized.contains("BEFEJEZETT") ||
                              normalized.contains("FOLYAMATBAN") ||
                              normalized.contains("BEGYUJTES") ||
                              normalized.contains("COMPTE") ||
                              normalized.contains("TEL ") ||
                              normalized.contains("MAIS") ||
                              normalized.contains("AUTRE");
                  }

                  private static String normalizeAddress(String value) {
                      return value
                              .replaceAll("\\s*,\\s*", ", ")
                              .replaceAll("\\s+", " ")
                              .replaceAll("^[,;: -]+|[,;: -]+$", "")
                              .trim();
                  }

                  private static String clean(String value) {
                      if (value == null) return "";
                      return value.replace('\u00A0', ' ')
                              .replaceAll("\\s+", " ")
                              .trim();
                  }

                  private static final class Candidate {
                      final String address;
                      final int score;

                      Candidate(String address, int score) {
                          this.address = address;
                          this.score = score;
                      }
                  }
              }
          }
          EOF

