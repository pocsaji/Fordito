                  try {
                      List<MicrophoneInfo> list = r.getActiveMicrophones();
                      if(list == null || list.isEmpty()) return "üres";
                      ArrayList<String> out = new ArrayList<>();
                      for(MicrophoneInfo m : list) {
                          out.add(m.getDescription() + "/" + deviceTypeLabel(m.getType()) + "/loc=" + m.getLocation() + "/dir=" + m.getDirectionality());
                      }
                      return android.text.TextUtils.join("; ", out);
                  } catch(Exception e) { return "hiba: " + e.getClass().getSimpleName(); }
              }
          
              String preprocessingLabel(int sessionId) {
                  try {
                      Class<?> cls = Class.forName("android.media.audiofx.AudioEffect");
                      Method method = cls.getMethod("queryPreProcessings", int.class);
                      Object value = method.invoke(null, sessionId);
                      if(!(value instanceof Object[])) return "nincs adat";
                      Object[] array = (Object[])value;
                      if(array.length == 0) return "nincs aktív előfeldolgozó";
                      ArrayList<String> names = new ArrayList<>();
                      for(Object descriptor : array) {
                          try {
                              Field name = descriptor.getClass().getField("name");
                              names.add(String.valueOf(name.get(descriptor)));
                          } catch(Exception e) { names.add(descriptor.toString()); }
                      }
                      return android.text.TextUtils.join(", ", names);
                  } catch(Exception e) { return "nem lekérdezhető"; }
              }
          
              String formatLabel(AudioFormat f) {
                  if(f == null) return "—";
                  return f.getSampleRate() + "Hz/" + f.getChannelCount() + "ch/enc" + f.getEncoding();
              }
          
              String dbfsLabel(double rms) {
                  if(rms <= 0.0) return "−∞";
                  return String.format(Locale.US, "%.1f", 20.0 * Math.log10(rms / 32768.0));
              }
          
              String audioModeLabel(int mode) {
                  if(mode == AudioManager.MODE_NORMAL) return "NORMAL";
                  if(mode == AudioManager.MODE_RINGTONE) return "RINGTONE";
                  if(mode == AudioManager.MODE_IN_CALL) return "IN_CALL";
                  if(mode == AudioManager.MODE_IN_COMMUNICATION) return "IN_COMMUNICATION";
                  if(Build.VERSION.SDK_INT >= 30 && mode == AudioManager.MODE_CALL_SCREENING) return "CALL_SCREENING";
                  return String.valueOf(mode);
              }
          
              String sourceLabel(int source) {
                  if(source == MediaRecorder.AudioSource.MIC) return "MIC";
                  if(source == MediaRecorder.AudioSource.VOICE_RECOGNITION) return "VOICE_RECOGNITION";
                  if(source == MediaRecorder.AudioSource.VOICE_COMMUNICATION) return "VOICE_COMMUNICATION";
                  if(source == MediaRecorder.AudioSource.CAMCORDER) return "CAMCORDER";
                  if(source == MediaRecorder.AudioSource.UNPROCESSED) return "UNPROCESSED";
                  return String.valueOf(source);
              }
          
              String deviceLabel(AudioDeviceInfo d) {
                  if(d == null) return "—";
                  String name;
                  try { name = String.valueOf(d.getProductName()); } catch(Exception e) { name = "eszköz"; }
                  return name + " / " + deviceTypeLabel(d.getType()) + " / id=" + d.getId();
              }
          
              String deviceTypeLabel(int type) {
                  if(type == AudioDeviceInfo.TYPE_BUILTIN_MIC) return "BUILTIN_MIC";
                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) return "BT_SCO";
                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) return "BT_A2DP";
                  if(type == AudioDeviceInfo.TYPE_WIRED_HEADSET) return "WIRED_HEADSET";
                  if(type == AudioDeviceInfo.TYPE_USB_HEADSET) return "USB_HEADSET";
                  if(type == AudioDeviceInfo.TYPE_USB_DEVICE) return "USB_DEVICE";
                  if(type == AudioDeviceInfo.TYPE_HEARING_AID) return "HEARING_AID";
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_HEADSET) return "BLE_HEADSET";
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_SPEAKER) return "BLE_SPEAKER";
                  return "TYPE_" + type;
              }
          
              void logEvent(String message) {
                  String line = timeNow() + "  " + message;
                  synchronized(events) {
                      events.addFirst(line);
                      while(events.size() > 18) events.removeLast();
                  }
                  android.util.Log.i("BtMicDiag", message);
              }
          
              void logError(String where, Throwable error) {
                  String msg = where + ": " + (error == null ? "ismeretlen" : error.getClass().getSimpleName() + " — " + error.getMessage());
                  lastError = msg;
                  logEvent(msg);
                  android.util.Log.e("BtMicDiag", where, error);
              }
          
              String timeNow() {
                  return new SimpleDateFormat("HH:mm:ss.SSS", Locale.getDefault()).format(new Date());
              }
          
              @Override public void onDestroy() {
                  main.removeCallbacks(diagnosticsTicker);
                  stopCapture(false);
                  clearCommunicationRoute();
                  closeSilero();
                  if(deviceCallback != null && audioManager != null && Build.VERSION.SDK_INT >= 23) {
                      try { audioManager.unregisterAudioDeviceCallback(deviceCallback); } catch(Exception ignored) {}
                  }
                  audioExec.shutdownNow();
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/BT_Mic_Diag_V1.0.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/BT_Mic_Diag_V1.0.aab
          ls -lah artifact

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: BT_Mic_Diag_V1.0
          path: |
            artifact/*.apk
            artifact/*.aab
          if-no-files-found: error
