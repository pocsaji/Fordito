          package com.attila.forditokonzol;
          
          import java.util.ArrayList;
          import java.util.List;
          import java.util.TreeMap;
          
          final class SttRequestCoordinator {
              static final class Order {
                  final long sessionId;
                  final int sequence;
                  Order(long sessionId, int sequence) {
                      this.sessionId = sessionId;
                      this.sequence = sequence;
                  }
              }
          
              private long sessionId = 1L;
              private int requestSequence = 0;
              private int deliverSequence = 1;
              private int requestsInFlight = 0;
              private final TreeMap<Integer, SttResult> pending = new TreeMap<>();
          
              synchronized Order allocate(boolean active) {
                  if(!active) return null;
                  requestsInFlight++;
                  return new Order(sessionId, ++requestSequence);
              }
          
              synchronized List<SttResult> complete(long requestSession, int sequence, SttResult result) {
                  ArrayList<SttResult> ready = new ArrayList<>();
                  if(requestSession != sessionId) return ready;
                  requestsInFlight = Math.max(0, requestsInFlight - 1);
                  pending.put(sequence, result);
                  while(true) {
                      SttResult next = pending.remove(deliverSequence);
                      if(next == null) break;
                      deliverSequence++;
                      ready.add(next);
                  }
                  return ready;
              }
          
              synchronized void reset() {
                  sessionId++;
                  requestSequence = 0;
                  deliverSequence = 1;
                  requestsInFlight = 0;
                  pending.clear();
              }
          
              synchronized long sessionId() { return sessionId; }
              synchronized int requestsInFlight() { return requestsInFlight; }
          }
