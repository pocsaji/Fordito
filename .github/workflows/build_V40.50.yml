          package com.attila.forditokonzol;
          
          import java.util.Locale;
          
          /** A TTS nyelv- és sebességszabályai egyetlen helyen. */
          final class TtsPolicy {
              private TtsPolicy() {}
          
              static Locale localeFor(String language) {
                  String value = language == null ? "" : language.toLowerCase(Locale.ROOT);
                  if (value.equals("hu")) return new Locale("hu", "HU");
                  if (value.equals("fr")) return Locale.FRANCE;
                  if (value.equals("en")) return Locale.ENGLISH;
                  if (value.equals("de")) return Locale.GERMAN;
                  if (value.equals("it")) return Locale.ITALIAN;
                  if (value.equals("es")) return new Locale("es", "ES");
                  if (value.equals("ro")) return new Locale("ro", "RO");
                  if (value.equals("hr")) return new Locale("hr", "HR");
                  if (value.equals("sk")) return new Locale("sk", "SK");
                  if (value.equals("sl")) return new Locale("sl", "SI");
                  return Locale.getDefault();
              }
          
              static float speechRateFor(String language) {
                  String value = language == null ? "" : language.toLowerCase(Locale.ROOT);
                  return value.equals("hu") || value.equals("fr") ? 1.17f : 1.10f;
              }
          }
