          cat > app/src/main/java/com/attila/forditokonzol/TtsController.java <<'EOF'
          package com.attila.forditokonzol;
          
          import android.app.Activity;
          import android.media.AudioAttributes;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.util.Log;
          import android.widget.Toast;
          
          import java.util.LinkedHashMap;
          
          /**
           * A teljes TTS-életciklus, sor, revízióvédelem és fél-duplex mikrofonkapu.
           * A vezérlő nem ismeri a képernyő felépítését, csak a Host által adott állapotot.
           */
          final class TtsController {
              interface Host {
                  Activity activity();
                  String logTag();
                  boolean interpreterMode();
                  boolean speechOutputEnabled();
                  boolean communicationFallbackActive();
                  boolean halfDuplexSpeakerRoute();
                  boolean containsConversationBlock(TextBlock block);
                  void beginHalfDuplexGuard();
              }
          
              private final Host host;
              private final SpeechTextProcessor textProcessor;
              private final LinkedHashMap<String, TtsJob> jobs = new LinkedHashMap<>();
          
              private TextToSpeech engine;
              private boolean ready;
              private boolean playbackActive;
              private int sequence;
              private String currentUtteranceId = "";
              private int queuedUtterances;
              private volatile long muteUntilMs;
          
              TtsController(Host host, SpeechTextProcessor textProcessor) {
                  this.host = host;
                  this.textProcessor = textProcessor;
              }
          
              void init() {
                  try {
                      engine = new TextToSpeech(host.activity(), status -> {
                          ready = status == TextToSpeech.SUCCESS;
                          if(ready && engine != null) {
                              engine.setSpeechRate(1.0f);
                              engine.setPitch(1.0f);
                              refreshAudioAttributes();
                              engine.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override public void onStart(String utteranceId) {
                                      host.activity().runOnUiThread(() -> handleStart(utteranceId));
                                  }
                                  @Override public void onDone(String utteranceId) {
                                      host.activity().runOnUiThread(() -> finishUtterance(utteranceId, true, false));
                                  }
                                  @Override public void onStop(String utteranceId, boolean interrupted) {
                                      host.activity().runOnUiThread(() -> finishUtterance(utteranceId, false, true));
                                  }
                                  @Override public void onError(String utteranceId) {
                                      host.activity().runOnUiThread(() -> finishUtterance(utteranceId, false, false));
                                  }
                                  @Override public void onError(String utteranceId, int errorCode) {
                                      host.activity().runOnUiThread(() -> finishUtterance(utteranceId, false, false));
                                  }
                              });
                          } else {
                              Log.e(host.logTag(), "TTS initialization failed, status=" + status);
                          }
                      });
                  } catch(Exception error) {
                      Log.e(host.logTag(), "TTS creation failed", error);
                      ready = false;
                  }
              }
          
              void refreshAudioAttributes() {
                  if(engine == null) return;
                  try {
                      int usage = host.communicationFallbackActive()
                              ? AudioAttributes.USAGE_VOICE_COMMUNICATION
                              : AudioAttributes.USAGE_MEDIA;
                      AudioAttributes attributes = new AudioAttributes.Builder()
                              .setUsage(usage)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build();
                      int result = engine.setAudioAttributes(attributes);
                      if(result != TextToSpeech.SUCCESS) Log.w(host.logTag(), "TTS audio attributes rejected: " + result);
                  } catch(Exception error) {
                      Log.w(host.logTag(), "TTS audio attributes failed", error);
                  }
              }
          
              synchronized void markFinalTranslationReadyAndSpeak(TextBlock block, String translatedText, String targetLang) {
                  if(block == null || translatedText == null) return;
                  String finalText = translatedText.trim();
                  if(finalText.isEmpty()) return;
                  block.finalRevision++;
                  block.finalTranslation = finalText;
                  block.finalTargetLang = targetLang == null ? "" : targetLang;
                  block.finalTranslationHash = textProcessor.normalizeHash(finalText).trim();
                  block.finalReady = block.translatedOk && block.pendingSourceText.trim().isEmpty()
                          && !block.finalTranslationHash.isEmpty();
                  if(block.finalReady) speakFinalBlockOnce(block);
              }
          
              synchronized void speakManualOnce(String translatedText, String targetLang) {
                  TextBlock block = new TextBlock();
                  block.translatedOk = true;
                  block.pendingSourceText = "";
                  markFinalTranslationReadyAndSpeak(block, translatedText, targetLang);
              }
          
              synchronized void stop() {
                  try { if(engine != null) engine.stop(); }
                  catch(Exception error) { Log.w(host.logTag(), "TTS stop failed", error); }
                  clearState();
                  resetMuteGuard();
              }
          
              synchronized void shutdown() {
                  try {
                      if(engine != null) {
                          engine.stop();
                          engine.shutdown();
                      }
                  } catch(Exception ignored) {}
                  engine = null;
                  ready = false;
                  clearState();
                  resetMuteGuard();
              }
          
              void resetMuteGuard() { muteUntilMs = 0L; }
          
              boolean shouldMuteMicrophone() {
                  return playbackActive || System.currentTimeMillis() < muteUntilMs;
              }
          
              private synchronized void speakFinalBlockOnce(TextBlock block) {
                  try {
                      if(block == null || !host.interpreterMode() || !host.speechOutputEnabled() || !ready || engine == null) return;
                      if(!block.finalReady || !block.translatedOk || !block.pendingSourceText.trim().isEmpty()) return;
                      int revision = block.finalRevision;
                      if(revision <= 0 || block.finalTranslation.trim().isEmpty() || block.finalTranslationHash.isEmpty()) return;
                      if(block.ttsCompletedRevision >= revision || block.ttsQueuedRevision == revision) return;
          
                      try { engine.setLanguage(TtsPolicy.localeFor(block.finalTargetLang)); }
                      catch(Exception error) { Log.w(host.logTag(), "TTS language selection failed", error); }
                      try { engine.setSpeechRate(TtsPolicy.speechRateFor(block.finalTargetLang)); }
                      catch(Exception error) { Log.w(host.logTag(), "TTS speech rate failed", error); }
                      refreshAudioAttributes();
          
                      String utteranceId = "fordito_tts_" + (++sequence) + "_b" + block.speechSeq + "_r" + revision;
                      TtsJob job = new TtsJob(block, revision, block.finalTranslation, block.finalTargetLang, block.finalTranslationHash);
                      int result = engine.speak(job.text, TextToSpeech.QUEUE_ADD, new Bundle(), utteranceId);
                      if(result == TextToSpeech.SUCCESS) {
                          block.ttsQueuedRevision = revision;
                          jobs.put(utteranceId, job);
                          queuedUtterances++;
                      } else {
                          Log.e(host.logTag(), "TTS queue rejected: " + result);
                          block.ttsQueuedRevision = 0;
                      }
                  } catch(Exception error) {
                      Log.e(host.logTag(), "TTS queue failed", error);
                      if(block != null) block.ttsQueuedRevision = 0;
                  }
              }
          
              private void handleStart(String utteranceId) {
                  TtsJob job = jobs.get(utteranceId);
                  if(job == null) return;
                  if(job.block == null || !job.block.finalReady || job.block.finalRevision != job.revision
                          || !job.textHash.equals(job.block.finalTranslationHash)
                          || (job.block.speechSeq > 0 && !host.containsConversationBlock(job.block))) {
                      Log.w(host.logTag(), "Stale TTS job blocked: " + utteranceId);
                      stop();
                      return;
                  }
                  job.started = true;
                  job.block.ttsStartedRevision = job.revision;
                  currentUtteranceId = utteranceId;
                  playbackActive = true;
                  if(host.halfDuplexSpeakerRoute()) host.beginHalfDuplexGuard();
              }
          
              private void finishUtterance(String utteranceId, boolean completed, boolean stopped) {
                  try {
                      TtsJob job = jobs.remove(utteranceId);
                      if(queuedUtterances > 0) queuedUtterances--;
                      if(job != null && job.block != null) {
                          if(completed && job.started && job.block.finalRevision == job.revision
                                  && job.textHash.equals(job.block.finalTranslationHash)) {
                              job.block.ttsCompletedRevision = job.revision;
                              job.block.ttsQueuedRevision = 0;
                              job.block.ttsSpoken = true;
                          } else if(job.block.ttsQueuedRevision == job.revision) {
                              job.block.ttsQueuedRevision = 0;
                          }
                      }
          
                      if(utteranceId != null && utteranceId.equals(currentUtteranceId)) {
                          currentUtteranceId = "";
                          playbackActive = false;
                          if(host.halfDuplexSpeakerRoute()) muteUntilMs = System.currentTimeMillis() + 450L;
                      }
          
                      if(queuedUtterances <= 0 || jobs.isEmpty()) {
                          queuedUtterances = 0;
                          playbackActive = false;
                      }
          
                      if(!completed && !stopped && job != null) {
                          Log.e(host.logTag(), "TTS playback error: " + utteranceId);
                          Toast.makeText(host.activity(), "A kész fordítás felolvasása nem sikerült.", Toast.LENGTH_SHORT).show();
                      }
                  } catch(Exception error) {
                      Log.e(host.logTag(), "TTS completion handling failed", error);
                  }
              }
          
              private void clearState() {
                  for(TtsJob job : jobs.values()) {
                      if(job != null && job.block != null && job.block.ttsQueuedRevision == job.revision) {
                          job.block.ttsQueuedRevision = 0;
                      }
                  }
                  jobs.clear();
                  currentUtteranceId = "";
                  queuedUtterances = 0;
                  playbackActive = false;
              }
          }
