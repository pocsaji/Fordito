              private String trimRecentOverlap(String block) {
                  if (block == null) return "";
                  String raw = block.trim().replaceAll("\\s+", " ");
                  String hash = normalizeHash(raw);
                  if (hash.length() < 8) return raw;
                  String[] newWords = hash.split("\\s+");
                  String[] rawWords = raw.split("\\s+");
          
                  for (String old : recentHashOrder) {
                      if (old == null || old.length() < 8) continue;
                      String[] oldWords = old.split("\\s+");
                      if (oldWords.length < 2 || newWords.length < 2) continue;
          
                      int fullOld = Math.min(oldWords.length, newWords.length);
                      if (fullOld >= 3) {
                          boolean oldAtStart = true;
                          for (int i = 0; i < fullOld; i++) {
                              if (!oldWords[i].equals(newWords[i])) {
                                  oldAtStart = false;
                                  break;
                              }
                          }
                          if (oldAtStart && fullOld < rawWords.length) return joinWords(rawWords, fullOld);
                      }
          
                      int maximumOverlap = Math.min(10, Math.min(oldWords.length, newWords.length));
                      for (int overlap = maximumOverlap; overlap >= 2; overlap--) {
                          boolean suffixPrefix = true;
                          for (int i = 0; i < overlap; i++) {
                              if (!oldWords[oldWords.length - overlap + i].equals(newWords[i])) {
                                  suffixPrefix = false;
                                  break;
                              }
                          }
                          if (suffixPrefix) {
                              if (overlap >= rawWords.length) return "";
                              return joinWords(rawWords, overlap);
                          }
                      }
                  }
                  return raw;
              }
          
              private String joinWords(String[] words, int start) {
                  StringBuilder output = new StringBuilder();
                  for (int i = start; i < words.length; i++) {
                      if (output.length() > 0) output.append(' ');
                      output.append(words[i]);
                  }
                  return output.toString().trim();
              }
          
              private int smartLinguisticCut(String text) {
                  int length = text.length();
                  if (length < 85) return -1;
          
                  String lower = text.toLowerCase(Locale.ROOT);
                  int preferredEnd = Math.min(length, 185);
                  int preferredStart = Math.min(length, 75);
          
                  int cut = lastConnectorCut(lower, preferredStart, preferredEnd, new String[]{
                          ", de ", ", viszont ", ", hanem ", ", tehát ", ", ezért ",
                          ", aztán ", ", majd ", ", utána ", "; ", ": ", " - "
                  });
                  if (cut > 0) return cut;
          
                  cut = lastConnectorCut(lower, 90, preferredEnd, new String[]{
                          ", és akkor ", ", akkor ", ", hogyha ", ", ha ", ", amikor ",
                          ", ahol ", ", amíg ", ", miközben ", ", vagy ", ", illetve "
                  });
                  if (cut > 0) return cut;
          
                  cut = lastCommaCut(text, 90, Math.min(length, 175));
                  if (cut > 0) return cut;
          
                  cut = lastSoftWordCut(lower, 110, Math.min(length, 185), new String[]{
                          " de ", " viszont ", " akkor ", " utána ", " majd ",
                          " és akkor ", " hogyha ", " ha ", " amikor ", " illetve ",
                          " mindenhol ", " szinte ", " na most ", " pedig "
                  });
                  if (cut > 0) return cut;
          
                  if (length >= 190) {
                      int space = text.lastIndexOf(' ', Math.min(length, 170));
                      if (space >= 115) return space + 1;
                  }
                  return -1;
              }
          
              private int lastConnectorCut(String lower, int minPosition, int maxPosition, String[] connectors) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPosition);
                  for (String connector : connectors) {
                      int position = lower.lastIndexOf(connector, end);
                      if (position >= minPosition && position > best) best = position;
                  }
                  return best < 0 ? -1 : best + 1;
              }
          
              private int lastCommaCut(String text, int minPosition, int maxPosition) {
                  int position = text.lastIndexOf(',', Math.min(text.length(), maxPosition));
                  return position >= minPosition ? position + 1 : -1;
              }
          
              private int lastSoftWordCut(String lower, int minPosition, int maxPosition, String[] words) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPosition);
                  for (String word : words) {
                      int position = lower.lastIndexOf(word, end);
                      if (position >= minPosition && position > best) best = position;
                  }
                  return best < 0 ? -1 : best + 1;
              }
          }
