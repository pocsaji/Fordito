                        applyTranslationConfigurationChange(() -> apiKey = input.getText().toString().trim(), false))
                    .setNeutralButton("Kulcs törlése", null)
                    .setNegativeButton("Mégse", null)
                    .create();
                  dlg.setOnShowListener(di -> {
                      input.requestFocus();
                      input.selectAll();
                      android.view.Window w = dlg.getWindow();
                      if(w != null) w.setLayout((int)(getResources().getDisplayMetrics().widthPixels * 0.96f), -2);
                      dlg.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(v -> {
                          input.setText("");
                          applyTranslationConfigurationChange(() -> apiKey = "", false);
                          Toast.makeText(this, "API kulcs törölve.", Toast.LENGTH_SHORT).show();
                      });
                  });
                  dlg.show();
              }
          
              void applyTranslationConfigurationChange(Runnable change, boolean refreshProfileButton) {
                  boolean restartMicrophone = streaming;
                  if(restartMicrophone) stop(false);
                  else resetSttOrderingForNewSession();
                  change.run();
                  save();
                  if(refreshProfileButton) refreshOpenProfileMenuButton();
                  updateButtons();
                  if(restartMicrophone) new Handler(Looper.getMainLooper()).postDelayed(this::startMicrophone, 500L);
              }
          
              void chooseProfile() {
                  chooseFrom("Beszélgetési profil", profiles, profile,
                      selected -> applyTranslationConfigurationChange(() -> profile = selected, true));
              }
          
              void chooseMode() {
                  chooseFrom("Fordítás stílusa", modes, mode,
                      selected -> applyTranslationConfigurationChange(() -> mode = selected, false));
              }
              String interpreterLabel() {
                  if(!interpreterMode) return "kikapcsolva – csak szöveges fordítás";
                  if(!interpreterSpeechOutputEnabled) return "Automatikus tolmács – felolvasás kikapcsolva, mikrofon változatlan";
                  if("headset_output_phone_mic".equals(activeInterpreterRoute)) return "Automatikus tolmács – headset kimenet, telefon mikrofon";
                  if("headset_direct".equals(activeInterpreterRoute)) return "Automatikus tolmács – headset, közvetlen normál bemenet";
                  if("headset_communication_fallback".equals(activeInterpreterRoute)) return "Automatikus tolmács – headset, kommunikációs tartalék út";
                  if("speaker_half_duplex".equals(activeInterpreterRoute)) return "Automatikus tolmács – hangszóró, TTS alatt mikrofonkapu";
                  return "Automatikus tolmács – audioút előkészítés";
              }
          
              String displayModeLabel() {
                  return mirrorBottomMode ? "tükör mód – felső ablak fejjel lefelé" : "normál mód – mindkét ablak egy irányba";
              }
          
              void applyDisplayMode() {
                  try {
                      if(topBox != null) topBox.setRotation(mirrorBottomMode ? 180f : 0f);
                      if(bottomBox != null) bottomBox.setRotation(0f);
                  } catch(Exception ignored) {}
              }
          
              interface Setter { void set(String v); }
          
              void chooseFrom(String title, String[][] data, String current, Setter setter) {
                  CharSequence[] labels = new CharSequence[data.length];
                  for(int i=0;i<data.length;i++) labels[i] = menuItem(data[i][0], data[i][1].equals(current) ? "kiválasztva" : "", data[i][1].equals(current));
                  showCenteredMenu(title, labels, (d,w) -> {
                      setter.set(data[w][1]);
                      updateButtons();
                  });
              }
          
              void chooseLang(boolean top) {
                  if(finalizingStop) return;
                  String current = top ? topLang : bottomLang;
                  CharSequence[] labels = new CharSequence[langs.length];
                  for(int i=0;i<langs.length;i++) labels[i] = menuItem(langs[i][0], langs[i][1] + (langs[i][2].equals(current) ? " • kiválasztva" : ""), langs[i][2].equals(current));
                  showCenteredMenu(top ? "Felső nyelv" : "Alsó nyelv", labels, (d,w) ->
                      applyTranslationConfigurationChange(() -> {
                          if(top) topLang = langs[w][2];
                          else bottomLang = langs[w][2];
                          topBox.clearFocus();
                          bottomBox.clearFocus();
                      }, false));
              }
          
          
          
              void styleUiState() {
                  try {
                      int active = Color.rgb(30,140,70);
                      int inactive = Color.rgb(60,95,150);
                      int disabled = Color.rgb(55,58,65);
                      int green = Color.rgb(20,190,70);
                      int red = Color.rgb(220,35,35);
                      int orange = Color.rgb(170,105,30);
          
                      if(topLangBtn != null) setOvalButtonColor(topLangBtn, topActive ? active : inactive);
                      if(bottomLangBtn != null) setOvalButtonColor(bottomLangBtn, !topActive ? active : inactive);
                      setOvalButtonColor(centerLangBtn, inactive);
                      
                      if(arrangeBtn != null) setOvalButtonColor(arrangeBtn, inactive);
                      if(translateBtn != null) setOvalButtonColor(translateBtn, inactive);
                      if(menuBtn != null) setOvalButtonColor(menuBtn, inactive);
          
                      if(micBtn != null) {
                          micBtn.setEnabled(true);
                          if(finalizingStop) {
                              micBtn.setText("VÁRJ");
                              setOvalButtonColor(micBtn, orange);
                          } else if(streaming) {
                              micBtn.setText("STOP");
                              setOvalButtonColor(micBtn, green);
                          } else {
                              micBtn.setText("MIKROFON");
                              setOvalButtonColor(micBtn, red);
                          }
                      }
                  } catch(Exception ignored) {}
              }
          
              void updateButtons() {
                  if(finalizingStop) {
                      micBtn.setText("VÁRJ");
                      setOvalButtonColor(micBtn, Color.rgb(170,105,30));
                  } else if(microphoneStarting) {
                      micBtn.setText("VÁRJ");
                      setOvalButtonColor(micBtn, Color.rgb(170,105,30));
                  } else {
                      micBtn.setText(streaming ? "STOP" : "MIKROFON");
                      setOvalButtonColor(micBtn, streaming ? Color.rgb(20,190,70) : Color.rgb(220,35,35));
                  }
                  setOvalButtonColor(arrangeBtn, Color.rgb(55,60,70));
                  setOvalButtonColor(translateBtn, Color.rgb(55,60,70));
                  setOvalButtonColor(menuBtn, hasKey() ? Color.rgb(55,60,70) : Color.rgb(140,80,30));
                  topLangBtn.setText("FELSŐ: " + AppCatalog.code(topLang));
                  bottomLangBtn.setText("ALSÓ: " + AppCatalog.code(bottomLang));
                  setOvalButtonColor(topLangBtn, topActive ? Color.rgb(30,140,70) : Color.rgb(60,95,150));
                  setOvalButtonColor(bottomLangBtn, !topActive ? Color.rgb(30,140,70) : Color.rgb(60,95,150));
                  setOvalButtonColor(centerLangBtn, Color.rgb(55,60,70));
                  styleUiState();
                  refreshInterpreterFloatingButton();
              }
          
              @Override public void onBackPressed() {
                  if(keyboardEditMode) {
                      hideKeyboardEditor();
                      return;
                  }
                  if(floatingTranslatorEnabled) {
                      moveTaskToBack(true);
                      new Handler().postDelayed(() -> ensureFloatingTranslator(), 250);
                      return;
                  }
                  super.onBackPressed();
              }
          
              @Override public void onPause() {
                  activityInForeground = false;
                  super.onPause();
                  if(floatingTranslatorEnabled) new Handler().postDelayed(() -> ensureFloatingTranslator(), 250); if(interpreterMode) new Handler().postDelayed(() -> ensureInterpreterFloatingButton(), 250);
              }
          
              @Override public void onResume() {
                  super.onResume();
                  activityInForeground = true;
                  if(!streaming && !finalizingStop) {
                      styleUiState();
                      updateButtons();
                  }
                  if(interpreterMode && !streaming && !finalizingStop) configureInterpreterAudioRoute(false);
                  if(floatingTranslatorEnabled) new Handler().postDelayed(() -> ensureFloatingTranslator(), 250); if(interpreterMode) new Handler().postDelayed(() -> ensureInterpreterFloatingButton(), 250);
              }
          
              @Override public void onDestroy() {
                  if(rootLayout != null && keyboardLayoutListener != null) {
                      try { rootLayout.getViewTreeObserver().removeOnGlobalLayoutListener(keyboardLayoutListener); } catch(Exception ignored) {}
                      keyboardLayoutListener = null;
                  }
                  cancelMicLifeSignal();
                  unregisterInterpreterAudioDeviceCallback();
                  hideFloatingTranslator();
                  hideInterpreterFloatingButton();
                  if(streaming || finalizingStop) stop(false);
                  else {
                      resetSttOrderingForNewSession();
                      stopBackgroundForegroundService();
                  }
                  ttsController.shutdown();
                  restoreNormalAudioRoute();
                  audioExec.shutdownNow();
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/V40.50.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/V40.50.aab
          ls -lah artifact

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: V40.50
          path: |
            artifact/*.apk
            artifact/*.aab
          if-no-files-found: error
