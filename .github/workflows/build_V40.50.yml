              };
          
              static final String[][] MODELS = {
                  {"GPT-4o mini / alapértelmezett","gpt-4o-mini"},
                  {"GPT-4o / kézi nagy modell","gpt-4o"}
              };
          
              static final String[][] PROFILES = {
                  {"Általános beszélgetés","general"},
                  {"Turizmus / utazás","tourism"},
                  {"Étterem","restaurant"},
                  {"Szállás","hotel"},
                  {"Kamion – általános","truck_general"},
                  {"Kamion – ponyvás","truck_tarp"},
                  {"Kamion – ömlesztett áru","truck_bulk"},
                  {"Kamion – tartány","truck_tank"},
                  {"Logisztika / rakodás","logistics"},
                  {"Vám / határ","customs"},
                  {"Orvos","medical"},
                  {"Gyógyszertár","pharmacy"},
                  {"Bank","bank"},
                  {"Hivatal","office"},
                  {"Rendőrség","police"},
                  {"Közösségi média / chat","social_media"},
                  {"Autószerviz / gépjavítás","service"}
              };
          
              static final String[][] TRANSLATION_MODES = {
                  {"Pontos / szöveghű","precise"},
                  {"Általános / természetes","natural"},
                  {"Tolmács / beszélt nyelv","interpreter"}
              };
          
              static final String[][] MIC_LIFE_SIGNAL_MODES = {
                  {"Kikapcsolva","0"},
                  {"2 perc","2"},
                  {"5 perc","5"},
                  {"10 perc","10"},
                  {"20 perc","20"},
                  {"30 perc","30"}
              };
          
              private AppCatalog() {}
          
              static String labelOf(String[][] values, String key) {
                  if(values != null) {
                      for(String[] item : values) {
                          if(item.length > 1 && item[1].equals(key)) return item[0];
                      }
                  }
                  return key == null ? "" : key;
              }
          
              static String code(String value) {
                  if(value == null || value.isEmpty()) return "AUTO";
                  for(String[] item : LANGUAGES) {
                      if(item[2].equals(value)) return item[1];
                  }
                  return value.toUpperCase(Locale.ROOT);
              }
          
              static String speechBcp47Tag(String langCode) {
                  String lc = langCode == null ? "" : langCode.trim().toLowerCase(Locale.ROOT);
                  if("hu".equals(lc)) return "hu-HU";
                  if("fr".equals(lc)) return "fr-FR";
                  if("en".equals(lc)) return "en-US";
                  if("de".equals(lc)) return "de-DE";
                  if("it".equals(lc)) return "it-IT";
                  if("es".equals(lc)) return "es-ES";
                  if("ro".equals(lc)) return "ro-RO";
                  if("hr".equals(lc)) return "hr-HR";
                  if("sk".equals(lc)) return "sk-SK";
                  if("sl".equals(lc)) return "sl-SI";
                  return lc;
              }
          
              static String apiCode(String value) {
                  if(value == null || value.isEmpty() || "AUTO".equalsIgnoreCase(value)) return "";
                  for(String[] item : LANGUAGES) {
                      if(item[1].equalsIgnoreCase(value) || item[2].equalsIgnoreCase(value)) return item[2];
                  }
                  return value.toLowerCase(Locale.ROOT);
              }
          }
