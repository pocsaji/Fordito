              void applyAdaptiveEditorLayout(Configuration configuration) {
                  if(editorHost == null || topBox == null || bottomBox == null || editorDivider == null) return;
                  boolean newSideBySide = configuration != null
                      // Use the current app window width, not physical device size: a tablet in
                      // split-screen can become narrow and should fall back to the phone layout.
                      && configuration.screenWidthDp >= 600
                      && configuration.orientation == Configuration.ORIENTATION_LANDSCAPE;
                  sideBySideEditors = newSideBySide;
                  editorHost.removeAllViews();
                  editorHost.setOrientation(sideBySideEditors ? LinearLayout.HORIZONTAL : LinearLayout.VERTICAL);
                  editorHost.addView(topBox, editorBoxLayoutParams());
                  editorHost.addView(editorDivider, editorDividerLayoutParams());
                  editorHost.addView(bottomBox, editorBoxLayoutParams());
                  if(keyboardEditMode) {
                      EditText active = keyboardEditTop ? topBox : bottomBox;
                      EditText inactive = keyboardEditTop ? bottomBox : topBox;
                      inactive.setVisibility(View.GONE);
                      active.setVisibility(View.VISIBLE);
                      editorDivider.setVisibility(View.GONE);
                  } else {
                      topBox.setVisibility(View.VISIBLE);
                      bottomBox.setVisibility(View.VISIBLE);
                      editorDivider.setVisibility(View.VISIBLE);
                  }
                  editorHost.requestLayout();
              }
          
              @Override public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  applyAdaptiveEditorLayout(newConfig);
              }
          
              int dp(int value) {
