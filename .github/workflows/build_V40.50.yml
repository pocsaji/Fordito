              void startMicrophone() {
                  if(!hasKey()) { showApi(); return; }
                  if(Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) { reqMic(); return; }
                  startBackgroundForegroundServiceIfAllowed();
          
                  client = new OkHttpClient.Builder()
                      .connectTimeout(25, TimeUnit.SECONDS)
                      .readTimeout(90, TimeUnit.SECONDS)
                      .writeTimeout(90, TimeUnit.SECONDS)
                      .build();
                  if(interpreterMode) configureInterpreterAudioRoute(false);
                  else restoreNormalAudioRoute();
                  showPlannedInputRoute();
                  resetAudioModeState();
                  microphoneStarting = true;
                  microphonePcmReady = false;
                  microphoneStartUiEarliestMs = android.os.SystemClock.elapsedRealtime() + 200L;
                  state.setText("mikrofon előkészítés – élő átirat");
                  updateButtons();
                  startRealtimeTranscriptionOrFallback();
              }
          
              void startRealtimeTranscriptionOrFallback() {
                  final long session = sttCoordinator.sessionId();
                  realtimeBatchFallback = false;
                  realtimeSttReady = false;
                  audioLoopStarted = false;
                  liveCurrentTurnSeq = 1;
                  liveCurrentTurnAudioMs = 0;
                  clearHardTurnOverlap();
                  liveTurnBlockIds.clear();
                  liveTurnPartials.clear();
                  liveTurnCompleted.clear();
                  final long startToken = ++realtimeStartToken;
          
                  realtimeStt = new RealtimeTranscriptionClient(
                      client, apiKey, transcriptionLanguageHints(), promptFactory.transcriptionKeywords(),
                      promptFactory.realtimeTranscriptionPrompt(),
                      new RealtimeTranscriptionClient.Listener() {
                          @Override public void onReady() {
                              runOnUiThread(() -> {
                                  if(session != sttCoordinator.sessionId() || finalizingStop) return;
                                  realtimeSttReady = true;
                                  realtimeStartToken++;
                                  state.setText("mikrofon előkészítés – realtime kész");
                                  startAudioLoopOnce();
                              });
                          }
                          @Override public void onTurnCommitted(int turnSeq, String itemId) {
                              runOnUiThread(() -> {
                                  if(session != sttCoordinator.sessionId()) return;
                                  TextBlock b = ensureLiveTurnDraft(turnSeq);
                                  b.sttItemId = itemId == null ? "" : itemId;
                              });
                          }
                          @Override public void onDelta(int turnSeq, String itemId, String delta) {
                              runOnUiThread(() -> {
                                  if(session != sttCoordinator.sessionId()) return;
                                  handleRealtimeTranscriptDelta(turnSeq, itemId, delta);
                              });
                          }
                          @Override public void onCompleted(int turnSeq, String itemId, String transcript) {
                              runOnUiThread(() -> {
                                  if(session != sttCoordinator.sessionId()) return;
                                  handleRealtimeTranscriptCompleted(turnSeq, itemId, transcript);
                                  maybeFinishStop();
                              });
                          }
                          @Override public void onTurnFailed(int turnSeq, String itemId, String message) {
                              runOnUiThread(() -> {
                                  if(session != sttCoordinator.sessionId()) return;
                                  handleRealtimeTranscriptFailed(turnSeq, itemId, message);
                                  maybeFinishStop();
                              });
                          }
                          @Override public void onError(String message, boolean fatal) {
                              runOnUiThread(() -> {
                                  if(session != sttCoordinator.sessionId()) return;
                                  android.util.Log.e(LOG_TAG, message == null ? "Realtime STT hiba" : message);
                                  if(fatal) {
                                      if(!audioLoopStarted) {
                                          // Conservative compatibility path: if the websocket cannot be established,
                                          // the proven V40.49 file/batch recognizer still starts instead of losing speech.
                                          realtimeBatchFallback = true;
                                          realtimeSttReady = false;
                                          closeRealtimeStt();
                                          state.setText("mikrofon előkészítés – STT tartalék mód");
                                          startAudioLoopOnce();
                                      } else if(streaming) {
                                          state.setText("mikrofon aktív – realtime STT kapcsolat megszakadt");
                                          stop(false);
                                      }
                                  } else if(streaming) {
                                      state.setText("mikrofon aktív – realtime STT figyelmeztetés");
                                  }
                              });
                          }
                          @Override public void onClosed() { }
                      }
                  );
                  realtimeStt.connect();
                  // WebSocket open alone is not enough: wait for session.updated. If the API,
                  // mobile network, or configuration stalls, retain the proven batch path instead
                  // of leaving a dead microphone screen indefinitely.
                  realtimeStartHandler.postDelayed(() -> {
                      if(startToken != realtimeStartToken || session != sttCoordinator.sessionId()) return;
                      if(realtimeSttReady || audioLoopStarted || finalizingStop) return;
                      realtimeBatchFallback = true;
                      closeRealtimeStt();
                      state.setText("mikrofon előkészítés – STT tartalék mód");
                      startAudioLoopOnce();
                  }, 8000L);
              }
          
              void startAudioLoopOnce() {
                  if(audioLoopStarted || finalizingStop) return;
                  audioLoopStarted = true;
                  audioLoop();
              }
          
              void closeRealtimeStt() {
                  realtimeStartToken++;
                  RealtimeTranscriptionClient old = realtimeStt;
                  realtimeStt = null;
                  realtimeSttReady = false;
                  if(old != null) old.close();
              }
          
              String[] transcriptionLanguageHints() {
                  java.util.LinkedHashSet<String> hints = new java.util.LinkedHashSet<>();
                  String top = AppCatalog.apiCode(topLang);
                  String bottom = AppCatalog.apiCode(bottomLang);
                  if(top != null && !top.trim().isEmpty()) hints.add(top.trim().toLowerCase(Locale.ROOT));
                  if(bottom != null && !bottom.trim().isEmpty()) hints.add(bottom.trim().toLowerCase(Locale.ROOT));
                  return hints.toArray(new String[0]);
              }
          
              void clearPreRollAudio() {
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.clear();
                      preRollAudioBytes = 0;
                  }
              }
          
              void rememberPreRollAudio(byte[] data, int len) {
                  if(data == null || len <= 0) return;
                  byte[] copy = Arrays.copyOf(data, len);
                  int maxBytes = Math.max(1, AUDIO_SAMPLE_RATE * 2 * PRE_ROLL_AUDIO_MS / 1000);
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.add(copy);
                      preRollAudioBytes += copy.length;
                      while(preRollAudioBytes > maxBytes && !preRollAudioChunks.isEmpty()) {
                          byte[] old = preRollAudioChunks.poll();
                          if(old != null) preRollAudioBytes -= old.length;
                      }
                  }
              }
          
              ArrayList<byte[]> takePreRollAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(preRollAudioChunks) {
                      while(!preRollAudioChunks.isEmpty()) {
                          byte[] b = preRollAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      preRollAudioBytes = 0;
                  }
                  return out;
              }
          
              int pcm16Mono16kMs(int bytes) {
                  if(bytes <= 0) return 0;
                  return Math.max(1, (int)Math.round(bytes * 1000.0 / (AUDIO_SAMPLE_RATE * 2.0)));
              }
          
              void clearPendingSpeechAudio() {
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.clear();
                      pendingSpeechAudioMs = 0;
                  }
              }
          
              void rememberPendingSpeechAudio(byte[] data, int len) {
                  if(data == null || len <= 0) return;
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.add(Arrays.copyOf(data, len));
                      pendingSpeechAudioMs += pcm16Mono16kMs(len);
                  }
              }
          
              int pendingSpeechAudioDurationMs() {
                  synchronized(pendingSpeechAudioChunks) { return pendingSpeechAudioMs; }
              }
          
              ArrayList<byte[]> takePendingSpeechAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(pendingSpeechAudioChunks) {
                      while(!pendingSpeechAudioChunks.isEmpty()) {
                          byte[] b = pendingSpeechAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      pendingSpeechAudioMs = 0;
                  }
                  return out;
              }
          
              void closeExternalVad() {
                  try {
                      if(speechVadInstance instanceof AutoCloseable) ((AutoCloseable)speechVadInstance).close();
                      else if(speechVadInstance != null) speechVadInstance.getClass().getMethod("close").invoke(speechVadInstance);
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "VAD close failed", e);
