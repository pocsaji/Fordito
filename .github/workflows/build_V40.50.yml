          package com.attila.forditokonzol;
          
          import java.util.Locale;
          
          final class AppCatalog {
              static final String[][] LANGUAGES = {
                  {"Automatikus","AUTO",""},
                  {"Magyar","HU","hu"},
                  {"Francia","FR","fr"},
                  {"Angol","EN","en"},
                  {"Német","DE","de"},
                  {"Olasz","IT","it"},
                  {"Spanyol","ES","es"},
