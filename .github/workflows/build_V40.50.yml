                      terminalItems.add(itemId);
                      pendingFinals = Math.max(0, pendingFinals - 1);
                      terminalResults.put(seq, new TerminalResult(seq, itemId, payload, failed));
                      while(true) {
                          TerminalResult next = terminalResults.remove(nextTerminalDeliverySeq);
                          if(next == null) break;
                          ready.add(next);
                          nextTerminalDeliverySeq++;
                      }
                  }
                  // Listener calls happen outside the lock. This guarantees T1 -> T2 -> T3 final
                  // processing even if the API completes T2 before T1, as its docs explicitly allow.
                  if(listener != null) {
                      for(TerminalResult result : ready) {
                          if(result.failed) listener.onTurnFailed(result.turnSeq, result.itemId, result.payload);
                          else listener.onCompleted(result.turnSeq, result.itemId, result.payload);
                      }
                  }
              }
          
              private void notifyError(String message, boolean fatal) {
                  if(listener != null) listener.onError(message == null ? "Realtime hiba" : message, fatal);
              }
          }
