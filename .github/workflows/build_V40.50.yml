              void installKeyboardEditMode() {
                  if(rootLayout == null || keyboardLayoutListener != null) return;
                  keyboardLayoutListener = () -> {
                      if(rootLayout == null) return;
                      android.graphics.Rect visible = new android.graphics.Rect();
                      rootLayout.getWindowVisibleDisplayFrame(visible);
                      int fullHeight = rootLayout.getRootView().getHeight();
                      int obscuredHeight = Math.max(0, fullHeight - visible.bottom);
                      boolean keyboardVisible = obscuredHeight > Math.max(dp(160), fullHeight / 5);
                      EditText focusedEditor = topBox != null && topBox.hasFocus() ? topBox
                          : (bottomBox != null && bottomBox.hasFocus() ? bottomBox : null);
                      if(keyboardVisible && focusedEditor != null) {
                          enterKeyboardEditMode(focusedEditor == topBox);
                      } else if(!keyboardVisible) {
                          exitKeyboardEditMode();
                      }
                  };
                  rootLayout.getViewTreeObserver().addOnGlobalLayoutListener(keyboardLayoutListener);
              }
          
              void enterKeyboardEditMode(boolean top) {
                  if(rootLayout == null || topBox == null || bottomBox == null) return;
                  if(keyboardEditMode && keyboardEditTop == top) return;
                  keyboardEditMode = true;
                  keyboardEditTop = top;
                  rootLayout.setPadding(8, 62, 8, 8);
                  if(headerBar != null) headerBar.setVisibility(View.GONE);
                  if(controlsBar != null) controlsBar.setVisibility(View.GONE);
                  if(editorDivider != null) editorDivider.setVisibility(View.GONE);
                  EditText active = top ? topBox : bottomBox;
                  EditText inactive = top ? bottomBox : topBox;
                  inactive.setVisibility(View.GONE);
                  active.setVisibility(View.VISIBLE);
                  active.setLayoutParams(editorBoxLayoutParams());
                  active.post(() -> {
                      int cursor = Math.max(0, active.getSelectionStart());
                      try { active.bringPointIntoView(cursor); } catch(Exception ignored) {}
                  });
              }
          
              void exitKeyboardEditMode() {
                  if(!keyboardEditMode || rootLayout == null) return;
                  keyboardEditMode = false;
                  rootLayout.setPadding(8, 62, 8, 190);
                  if(headerBar != null) headerBar.setVisibility(View.VISIBLE);
                  if(controlsBar != null) controlsBar.setVisibility(View.VISIBLE);
                  if(editorDivider != null) editorDivider.setVisibility(View.VISIBLE);
                  topBox.setVisibility(View.VISIBLE);
                  bottomBox.setVisibility(View.VISIBLE);
                  topBox.setLayoutParams(editorBoxLayoutParams());
                  bottomBox.setLayoutParams(editorBoxLayoutParams());
                  rootLayout.requestLayout();
              }
          
              void hideKeyboardEditor() {
                  View focused = getCurrentFocus();
                  if(focused != null) {
                      InputMethodManager imm = (InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);
