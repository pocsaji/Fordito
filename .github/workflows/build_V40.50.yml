                  text = text.replaceAll("(?iu)\\bs[íi]r[íi]\\s+csend\\b", "síri csend");
                  text = text.replaceAll("(?iu)\\bs[íi]li\\s+csend\\b", "síri csend");
                  text = text.replaceAll("(?iu)\\bs[íi]r[íi]ts?en\\b", "síri csend");
