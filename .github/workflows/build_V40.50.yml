                  String normalized = text.replace("\r\n", "\n").replace('\r', '\n');
                  StringBuilder out = new StringBuilder();
                  for(String line : normalized.split("\n", -1)) {
                      String trimmed = line.trim();
                      if(trimmed.length() == 0) continue;
                      if(out.length() > 0) out.append("\n");
                      out.append(trimmed);
                  }
