              void resetCapturedFrameState() {
                  synchronized(capturedFrameLock) { capturedFrameBuffer.reset(); }
                  vadFallbackActive = false;
                  vadFallbackReported = false;
                  fallbackNoiseRms = 180.0;
                  fallbackSpeechHangoverMs = 0;
              }
          
              Object enumConst(String cls, String name) throws Exception {
                  Class<?> c = Class.forName(cls);
                  return Enum.valueOf((Class<Enum>)c.asSubclass(Enum.class), name);
              }
          
              Object buildVadByReflection() throws Exception {
                  Class<?> vadClass = Class.forName("com.konovalov.vad.silero.Vad");
                  Object builder = vadClass.getMethod("builder").invoke(null);
                  builder.getClass().getMethod("setContext", android.content.Context.class).invoke(builder, this);
                  builder.getClass().getMethod("setSampleRate", Class.forName("com.konovalov.vad.silero.config.SampleRate"))
                      .invoke(builder, enumConst("com.konovalov.vad.silero.config.SampleRate", "SAMPLE_RATE_16K"));
                  builder.getClass().getMethod("setFrameSize", Class.forName("com.konovalov.vad.silero.config.FrameSize"))
                      .invoke(builder, enumConst("com.konovalov.vad.silero.config.FrameSize", "FRAME_SIZE_512"));
                  builder.getClass().getMethod("setMode", Class.forName("com.konovalov.vad.silero.config.Mode"))
                      .invoke(builder, enumConst("com.konovalov.vad.silero.config.Mode", "NORMAL"));
                  builder.getClass().getMethod("setSilenceDurationMs", int.class).invoke(builder, VAD_SPEECH_END_SILENCE_MS);
                  builder.getClass().getMethod("setSpeechDurationMs", int.class).invoke(builder, VAD_SPEECH_START_MS);
                  return builder.getClass().getMethod("build").invoke(builder);
              }
          
              void activateVadFallback(String reason, Throwable error) {
                  vadFallbackActive = true;
                  closeExternalVad();
                  if(!vadFallbackReported) {
                      vadFallbackReported = true;
                      if(error == null) android.util.Log.e(LOG_TAG, reason);
                      else android.util.Log.e(LOG_TAG, reason, error);
                      runOnUiThread(() -> state.setText("mikrofon aktív – VAD tartalék mód"));
                  }
              }
          
              boolean ensureExternalVadReady() {
                  if(vadFallbackActive) return true;
                  if(speechVadInstance != null && FIXED_VAD_ENGINE.equals(speechVadInstanceMode)) return true;
                  closeExternalVad();
                  try {
                      speechVadInstance = buildVadByReflection();
                      speechVadInstanceMode = FIXED_VAD_ENGINE;
                      if(speechVadInstance == null) activateVadFallback("Silero VAD builder returned null", null);
                      return true;
                  } catch(Exception e) {
                      activateVadFallback("Silero VAD initialization failed", e);
                      return true;
                  }
              }
          
              int activeVadFrameBytes() {
                  return SILERO_FRAME_BYTES;
              }
          
              int frameDurationMs(int frameBytes) {
                  return Math.max(1, pcm16Mono16kMs(frameBytes));
              }
          
              boolean invokeVadOnExactFrame(byte[] frame) throws Exception {
                  if(speechVadInstance == null) throw new IllegalStateException("VAD instance is null");
                  try {
                      Object r = speechVadInstance.getClass().getMethod("isSpeech", byte[].class).invoke(speechVadInstance, (Object)frame);
                      return Boolean.TRUE.equals(r);
                  } catch(NoSuchMethodException nsme) {
                      short[] sf = new short[frame.length / 2];
                      for(int i=0;i<sf.length;i++) {
                          int lo = frame[i*2] & 0xff;
                          int hi = frame[i*2+1];
                          sf[i] = (short)((hi << 8) | lo);
                      }
                      Object r = speechVadInstance.getClass().getMethod("isSpeech", short[].class).invoke(speechVadInstance, (Object)sf);
                      return Boolean.TRUE.equals(r);
                  }
              }
          
              boolean fallbackEnergyIsSpeech(byte[] frame) {
                  if(frame == null || frame.length < 2) return false;
                  double sum = 0.0;
                  int samples = frame.length / 2;
                  for(int i=0;i<samples;i++) {
                      int lo = frame[i*2] & 0xff;
                      int hi = frame[i*2+1];
                      short v = (short)((hi << 8) | lo);
                      sum += (double)v * (double)v;
                  }
                  double rms = Math.sqrt(sum / Math.max(1, samples));
                  double threshold = Math.max(220.0, fallbackNoiseRms * 2.6);
                  boolean rawSpeech = rms >= threshold;
                  int frameMs = frameDurationMs(frame.length);
                  if(rawSpeech) {
                      fallbackSpeechHangoverMs = VAD_SPEECH_END_SILENCE_MS;
                  } else {
                      fallbackSpeechHangoverMs = Math.max(0, fallbackSpeechHangoverMs - frameMs);
                      if(!voiceSendActive) fallbackNoiseRms = fallbackNoiseRms * 0.96 + Math.min(rms, 1800.0) * 0.04;
                  }
                  return rawSpeech || fallbackSpeechHangoverMs > 0;
              }
          
              boolean externalVadOverGate(byte[] exactFrame) {
                  ensureExternalVadReady();
                  if(vadFallbackActive) return fallbackEnergyIsSpeech(exactFrame);
                  try {
                      return invokeVadOnExactFrame(exactFrame);
                  } catch(Exception e) {
                      activateVadFallback("Silero VAD runtime failure", e);
                      return fallbackEnergyIsSpeech(exactFrame);
                  }
              }
          
              void processVadFrame(byte[] frame) throws Exception {
                  if(frame == null || frame.length == 0) return;
                  if(shouldMuteMicForSpeakerTts()) {
                      voiceSendActive = false;
                      clearPendingSpeechAudio();
                      clearPreRollAudio();
                      return;
                  }
          
                  long now = System.currentTimeMillis();
                  boolean overGate = externalVadOverGate(frame);
                  if(overGate) {
                      if(!voiceSendActive) {
                          rememberPendingSpeechAudio(frame, frame.length);
                          if(pendingSpeechAudioDurationMs() < MIN_TRUE_SPEECH_AUDIO_MS) return;
                          if(firstSpeechHeardAt == 0L) firstSpeechHeardAt = now;
                          for(byte[] pr : takePreRollAudio()) sendAudioChunk(pr);
                          for(byte[] ps : takePendingSpeechAudio()) sendAudioChunk(ps);
                      } else {
                          sendAudioChunk(frame);
                      }
                      voiceSendActive = true;
                      return;
                  }
          
                  if(voiceSendActive) {
                      voiceSendActive = false;
                      if(realtimeSttReady && !realtimeBatchFallback) commitRealtimeTurn(false);
                      else flushSpeechAudioWindow(true);
                  }
                  clearPendingSpeechAudio();
                  rememberPreRollAudio(frame, frame.length);
              }
          
              void processCapturedAudio(byte[] data, int len) throws Exception {
                  if(data == null || len <= 0) return;
                  ArrayList<byte[]> frames = new ArrayList<>();
                  synchronized(capturedFrameLock) {
                      capturedFrameBuffer.write(data, 0, len);
                      byte[] all = capturedFrameBuffer.toByteArray();
                      int frameBytes = activeVadFrameBytes();
                      int pos = 0;
                      while(pos + frameBytes <= all.length) {
                          frames.add(Arrays.copyOfRange(all, pos, pos + frameBytes));
                          pos += frameBytes;
                      }
                      capturedFrameBuffer.reset();
                      if(pos < all.length) capturedFrameBuffer.write(all, pos, all.length - pos);
                  }
                  for(byte[] frame : frames) processVadFrame(frame);
              }
          
              byte[] takeCapturedRemainder() {
                  synchronized(capturedFrameLock) {
                      byte[] out = capturedFrameBuffer.toByteArray();
                      capturedFrameBuffer.reset();
                      return out;
                  }
              }
          
              void clearSpeechAudioWindow() {
                  synchronized(speechAudioWindowLock) {
                      speechAudioWindow.reset();
                  }
              }
          
              void appendSpeechAudioChunk(byte[] chunk) {
                  if(chunk == null || chunk.length == 0 || client == null) return;
                  byte[] ready = null;
                  synchronized(speechAudioWindowLock) {
                      speechAudioWindow.write(chunk, 0, chunk.length);
                      int needBytes = AUDIO_SAMPLE_RATE * 2 * BLOCK_WINDOW_MS / 1000;
                      if(speechAudioWindow.size() >= needBytes) {
                          byte[] all = speechAudioWindow.toByteArray();
                          ready = Arrays.copyOf(all, needBytes);
                          int keepBytes = AUDIO_SAMPLE_RATE * 2 * BLOCK_OVERLAP_MS / 1000;
                          speechAudioWindow.reset();
                          int start = Math.max(0, needBytes - keepBytes);
                          speechAudioWindow.write(all, start, needBytes - start);
                          if(all.length > needBytes) {
                              speechAudioWindow.write(all, needBytes, all.length - needBytes);
                          }
                      }
                  }
                  if(ready != null) transcribeAudioWindow(ready, false);
              }
          
              void flushSpeechAudioWindow(boolean force) {
                  byte[] ready = null;
                  synchronized(speechAudioWindowLock) {
                      int minBytes = AUDIO_SAMPLE_RATE * 2 * (force ? MIN_TRUE_SPEECH_AUDIO_MS : 1200) / 1000;
                      if(speechAudioWindow.size() >= minBytes) {
                          ready = speechAudioWindow.toByteArray();
                          speechAudioWindow.reset();
                      }
                  }
                  if(ready != null) transcribeAudioWindow(ready, true);
              }
          
              byte[] wavFromPcm16k(byte[] pcm) throws Exception {
                  int dataLen = pcm == null ? 0 : pcm.length;
                  ByteArrayOutputStream out = new ByteArrayOutputStream(44 + dataLen);
                  writeAscii(out, "RIFF"); writeIntLE(out, 36 + dataLen); writeAscii(out, "WAVE");
                  writeAscii(out, "fmt "); writeIntLE(out, 16); writeShortLE(out, 1); writeShortLE(out, 1);
                  writeIntLE(out, AUDIO_SAMPLE_RATE); writeIntLE(out, AUDIO_SAMPLE_RATE * 2); writeShortLE(out, 2); writeShortLE(out, 16);
                  writeAscii(out, "data"); writeIntLE(out, dataLen);
                  if(pcm != null) out.write(pcm);
                  return out.toByteArray();
              }
          
              void writeAscii(ByteArrayOutputStream out, String v) throws Exception { out.write(v.getBytes("US-ASCII")); }
              void writeIntLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); out.write((v >> 16) & 255); out.write((v >> 24) & 255); }
              void writeShortLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); }
          
              SttRequestCoordinator.Order allocateSttRequestOrder() {
                  return sttCoordinator.allocate(streaming || finalizingStop);
              }
          
              void completeSttRequest(long session, int seq, String transcript, boolean finalFlush, String error) {
                  for(SttResult ready : sttCoordinator.complete(session, seq, new SttResult(transcript, finalFlush, error))) {
                      if(ready.transcript.trim().length() > 0) {
                          handleTranscriptCompleted(ready.transcript.trim(), ready.finalFlush);
                      } else if(ready.error.length() > 0) {
                          android.util.Log.e(LOG_TAG, "STT request failed: " + ready.error);
                          state.setText(streaming ? "mikrofon aktív – STT hiba" : "STT hiba – az előző átiratok megmaradtak");
                      }
                  }
                  maybeFinishStop();
              }
          
              void resetSttOrderingForNewSession() {
                  requestRegistry.cancelAll();
                  realtimeStartToken++;
                  closeRealtimeStt();
                  audioLoopStarted = false;
                  realtimeBatchFallback = false;
                  liveCurrentTurnSeq = 1;
                  liveCurrentTurnAudioMs = 0;
                  clearHardTurnOverlap();
                  liveTurnBlockIds.clear();
                  liveTurnPartials.clear();
                  liveTurnCompleted.clear();
                  sttCoordinator.reset();
                  conversation.invalidateRequestsOnly();
                  conversation.finishTranslation();
                  pendingSpeechBlockId = -1L;
                  speechTranslateMode = false;
                  responseInProgress = false;
              }
          
              void transcribeAudioWindow(byte[] pcm, boolean finalFlush) {
                  if(pcm == null || pcm.length == 0 || client == null || !hasKey()) return;
                  // Belső, azonnali leállítás után a még futó audio-szál nem indíthat
                  // új STT-kérést. Graceful STOP alatt viszont a maradék még elküldhető.
                  SttRequestCoordinator.Order requestOrder = allocateSttRequestOrder();
                  if(requestOrder == null) return;
                  final long session = requestOrder.sessionId;
                  final int seq = requestOrder.sequence;
                  try {
                      byte[] wav = wavFromPcm16k(pcm);
                      MultipartBody.Builder bodyBuilder = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("model", TRANSCRIPTION_MODEL)
                          .addFormDataPart("response_format", "json")
                          .addFormDataPart("temperature", "0");
          
                      // GPT-Transcribe natívan támogat több lehetséges nyelvet és domain-kulcsszavakat.
                      // Így nem egy hosszú, angol STT-prompttal próbáljuk terelni a magyar/francia felismerést.
                      for(String langHint : transcriptionLanguageHints()) {
                          bodyBuilder.addFormDataPart("languages[]", langHint);
                      }
                      for(String keyword : promptFactory.transcriptionKeywords()) {
                          bodyBuilder.addFormDataPart("keywords[]", keyword);
                      }
                      MultipartBody body = bodyBuilder
                          .addFormDataPart("file", "speech.wav", RequestBody.create(MediaType.parse("audio/wav"), wav))
                          .build();
                      Request req = new Request.Builder().url("https://api.openai.com/v1/audio/transcriptions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .post(body).build();
                      final Call trackedCall = requestRegistry.track(client.newCall(req));
                      trackedCall.enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              requestRegistry.complete(call);
                              if(call.isCanceled()) return;
                              runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "kapcsolat: " + e.getMessage()));
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              requestRegistry.complete(call);
                              if(call.isCanceled()) return;
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "HTTP " + response.code()));
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String tr = obj.optString("text", "").trim();
                                  runOnUiThread(() -> completeSttRequest(session, seq, tr, finalFlush, ""));
                              } catch(Exception e) {
                                  runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "válasz nem értelmezhető"));
                              }
                          }
                      });
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "STT preparation failed", e);
                      runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "előkészítés: " + e.getMessage()));
                  }
              }
          
              void sendAudioChunk(byte[] chunk) throws Exception {
                  if(chunk == null || chunk.length == 0) return;
                  if(realtimeSttReady && !realtimeBatchFallback && realtimeStt != null) {
                      realtimeStt.appendPcm16k(chunk);
                      liveCurrentTurnAudioMs += pcm16Mono16kMs(chunk.length);
                      rememberHardTurnOverlap(chunk);
                      if(liveCurrentTurnAudioMs >= MAX_CONTINUOUS_SPEECH_BLOCK_MS) commitRealtimeTurn(true);
                  } else {
                      appendSpeechAudioChunk(chunk);
                  }
              }
          
              TextBlock findLiveTurnBlock(int turnSeq) {
                  Long id = liveTurnBlockIds.get(turnSeq);
                  return id == null ? null : conversation.find(id.longValue());
              }
          
              TextBlock ensureLiveTurnDraft(int turnSeq) {
                  TextBlock existing = findLiveTurnBlock(turnSeq);
                  if(existing != null) return existing;
                  TextBlock b = new TextBlock();
                  b.speechSeq = ++speechSourceBlockSeq;
                  b.liveTurnSeq = turnSeq;
                  b.sourceTop = topActive;
                  b.translatedOk = false;
                  b.pendingSourceText = "";
                  conversation.add(b);
                  liveTurnBlockIds.put(turnSeq, b.id);
                  return b;
              }
          
              void handleRealtimeTranscriptDelta(int turnSeq, String itemId, String delta) {
                  if(turnSeq <= 0 || delta == null || delta.length() == 0 || liveTurnCompleted.contains(turnSeq)) return;
                  TextBlock b = ensureLiveTurnDraft(turnSeq);
                  if(itemId != null && !itemId.isEmpty()) b.sttItemId = itemId;
                  StringBuilder partial = liveTurnPartials.get(turnSeq);
                  if(partial == null) { partial = new StringBuilder(); liveTurnPartials.put(turnSeq, partial); }
                  partial.append(delta);
                  String raw = userVisibleSpeechTextOrEmpty(partial.toString());
                  if(raw.length() == 0) return;
                  b.pendingSourceText = raw;
                  b.sttRevision++;
                  String visible = raw;
                  b.topText = b.sourceTop ? visible : "";
                  b.bottomText = b.sourceTop ? "" : visible;
                  renderBlocksKeepView();
              }
          
              void handleRealtimeTranscriptCompleted(int turnSeq, String itemId, String transcript) {
                  if(turnSeq <= 0 || liveTurnCompleted.contains(turnSeq)) return;
                  liveTurnCompleted.add(turnSeq);
                  TextBlock b = ensureLiveTurnDraft(turnSeq);
                  if(itemId != null && !itemId.isEmpty()) b.sttItemId = itemId;
                  String candidate = transcript == null ? "" : transcript.trim();
                  if(candidate.length() == 0) {
                      StringBuilder partial = liveTurnPartials.get(turnSeq);
                      if(partial != null) candidate = partial.toString();
                  }
                  String normalized = speechTextProcessor.normalizeAndDeduplicate(candidate);
                  if(normalized.length() == 0) normalized = userVisibleSpeechTextOrEmpty(candidate);
                  liveTurnPartials.remove(turnSeq);
                  b.sttFinal = true;
                  b.sttRevision++;
                  if(normalized.length() == 0) {
                      b.translatedOk = false;
                      renderBlocksKeepView();
                      return;
                  }
                  b.pendingSourceText = normalized;
                  b.topText = b.sourceTop ? normalized : "";
                  b.bottomText = b.sourceTop ? "" : normalized;
                  renderBlocksKeepView();
                  firstSpeechBlockReleased = true;
                  conversation.enqueue(b.id);
                  processNextSpeechTranslation();
              }
          
              void handleRealtimeTranscriptFailed(int turnSeq, String itemId, String message) {
                  if(turnSeq <= 0 || liveTurnCompleted.contains(turnSeq)) return;
                  liveTurnCompleted.add(turnSeq);
                  TextBlock b = ensureLiveTurnDraft(turnSeq);
                  if(itemId != null && !itemId.isEmpty()) b.sttItemId = itemId;
                  StringBuilder partial = liveTurnPartials.remove(turnSeq);
                  String candidate = partial == null ? "" : partial.toString();
                  String normalized = speechTextProcessor.normalizeAndDeduplicate(candidate);
                  if(normalized.length() == 0) normalized = userVisibleSpeechTextOrEmpty(candidate);
                  b.sttFinal = true;
                  b.sttRevision++;
                  if(normalized.length() > 0) {
                      // If the final STT event fails after useful deltas already arrived, keep the
                      // visible partial rather than losing the user's speech; GPT cleanup can still
                      // repair that text in the normal single translation call.
                      b.pendingSourceText = normalized;
                      b.topText = b.sourceTop ? normalized : "";
                      b.bottomText = b.sourceTop ? "" : normalized;
                      renderBlocksKeepView();
                      firstSpeechBlockReleased = true;
                      conversation.enqueue(b.id);
                      processNextSpeechTranslation();
                  } else {
                      b.translatedOk = false;
                      renderBlocksKeepView();
                  }
                  android.util.Log.e(LOG_TAG, "Realtime STT turn failed " + turnSeq + ": " + (message == null ? "" : message));
                  state.setText(streaming ? "mikrofon aktív – egy STT blokk hibás" : "STT blokk hiba");
              }
          
              void rememberHardTurnOverlap(byte[] chunk) {
                  if(chunk == null || chunk.length == 0) return;
                  int maxBytes = AUDIO_SAMPLE_RATE * 2 * HARD_TURN_OVERLAP_MS / 1000;
                  byte[] copy = Arrays.copyOf(chunk, chunk.length);
                  hardTurnOverlapChunks.add(copy);
                  hardTurnOverlapBytes += copy.length;
                  while(hardTurnOverlapBytes > maxBytes && !hardTurnOverlapChunks.isEmpty()) {
                      byte[] old = hardTurnOverlapChunks.poll();
                      if(old != null) hardTurnOverlapBytes -= old.length;
                  }
              }
          
              ArrayList<byte[]> snapshotHardTurnOverlap() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  for(byte[] b : hardTurnOverlapChunks) if(b != null) out.add(Arrays.copyOf(b, b.length));
                  return out;
              }
          
              void clearHardTurnOverlap() {
                  hardTurnOverlapChunks.clear();
                  hardTurnOverlapBytes = 0;
              }
          
              void commitRealtimeTurn(boolean hardLimit) {
                  if(realtimeStt == null || !realtimeSttReady || liveCurrentTurnAudioMs <= 0) return;
                  ArrayList<byte[]> overlap = hardLimit ? snapshotHardTurnOverlap() : new ArrayList<>();
                  int committed = realtimeStt.commitTurn();
                  if(committed < 0) return;
                  liveCurrentTurnSeq = committed + 1;
                  liveCurrentTurnAudioMs = 0;
                  clearHardTurnOverlap();
                  if(hardLimit && !overlap.isEmpty()) {
                      // Only the forced 30 s boundary receives a short overlap. Normal VAD turns do not.
                      // The existing textual overlap-deduper removes a repeated boundary word if needed.
                      for(byte[] b : overlap) {
                          realtimeStt.appendPcm16k(b);
                          liveCurrentTurnAudioMs += pcm16Mono16kMs(b.length);
                          rememberHardTurnOverlap(b);
                      }
                  }
              }
          
              int selectedAudioSource() {
                  return AudioPipelineConfig.SOURCE;
              }
          
              String audioSourceLabel(int source) {
                  if(source == MediaRecorder.AudioSource.VOICE_RECOGNITION) return "VOICE_RECOGNITION";
                  if(source == MediaRecorder.AudioSource.VOICE_COMMUNICATION) return "VOICE_COMMUNICATION";
                  if(source == MediaRecorder.AudioSource.UNPROCESSED) return "UNPROCESSED";
                  if(source == MediaRecorder.AudioSource.MIC) return "MIC";
                  return "source=" + source;
              }
          
              AudioRecord createInitializedAudioRecord(int source, int sampleRate, int requestedBufferBytes) {
                  return createInitializedAudioRecord(source, sampleRate, requestedBufferBytes, AudioFormat.CHANNEL_IN_MONO);
              }
          
              AudioRecord createInitializedAudioRecord(int source, int sampleRate, int requestedBufferBytes, int channelMask) {
                  AudioRecord candidate = null;
                  try {
                      int min = AudioRecord.getMinBufferSize(
                          sampleRate,
                          channelMask,
                          AudioFormat.ENCODING_PCM_16BIT
                      );
                      int channelCount = channelMask == AudioFormat.CHANNEL_IN_STEREO ? 2 : 1;
                      int safeMin = min > 0 ? min : SILERO_FRAME_BYTES * 8 * channelCount;
                      int bufferBytes = Math.max(requestedBufferBytes, safeMin);
                      // Legalább több teljes 32 ms-os keret férjen a rendszerpufferbe.
                      bufferBytes = Math.max(bufferBytes, SILERO_FRAME_BYTES * 8 * channelCount);
          
                      AudioFormat format = new AudioFormat.Builder()
                          .setSampleRate(sampleRate)
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setChannelMask(channelMask)
                          .build();
          
                      candidate = new AudioRecord.Builder()
                          .setAudioSource(source)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(bufferBytes)
                          .build();
          
                      if(candidate.getState() == AudioRecord.STATE_INITIALIZED) {
                          android.util.Log.i(LOG_TAG, "AudioRecord initialized with " + audioSourceLabel(source) +
                              ", sampleRate=" + sampleRate + ", channels=" + channelCount + ", buffer=" + bufferBytes);
                          return candidate;
                      }
                      android.util.Log.w(LOG_TAG, "AudioRecord remained uninitialized with " + audioSourceLabel(source));
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "AudioRecord creation failed with " + audioSourceLabel(source), e);
                  }
                  if(candidate != null) {
                      try { candidate.release(); }
                      catch(Exception e) { android.util.Log.w(LOG_TAG, "Failed AudioRecord candidate release", e); }
                  }
                  return null;
              }
          
              AudioRecord tryPreferredAudioRecord(int source, int sampleRate, int requestedBufferBytes, AudioDeviceInfo preferredDevice) {
                  return tryPreferredAudioRecord(source, sampleRate, requestedBufferBytes, preferredDevice, AudioFormat.CHANNEL_IN_MONO);
              }
          
              AudioRecord tryPreferredAudioRecord(int source, int sampleRate, int requestedBufferBytes,
                                                   AudioDeviceInfo preferredDevice, int channelMask) {
                  AudioRecord candidate = createInitializedAudioRecord(source, sampleRate, requestedBufferBytes, channelMask);
                  if(candidate == null) return null;
                  if(preferredDevice == null) return candidate;
                  boolean accepted = false;
                  try {
                      accepted = candidate.setPreferredDevice(preferredDevice);
                      android.util.Log.i(LOG_TAG, "Preferred input " + audioDeviceLabel(preferredDevice) +
                          " accepted=" + accepted + ", source=" + audioSourceLabel(source) + ", sampleRate=" + sampleRate +
                          ", channels=" + (channelMask == AudioFormat.CHANNEL_IN_STEREO ? 2 : 1));
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Preferred input selection failed", e);
                  }
                  if(accepted) return candidate;
                  try { candidate.release(); } catch(Exception ignored) {}
                  return null;
              }
          
              AudioRecord tryAudioRecordCandidates(int sampleRate, int requestedBufferBytes, AudioDeviceInfo preferredDevice) {
                  LinkedHashSet<Integer> candidates = new LinkedHashSet<>();
                  candidates.add(selectedAudioSource());
                  candidates.add(MediaRecorder.AudioSource.VOICE_RECOGNITION);
                  candidates.add(MediaRecorder.AudioSource.MIC);
          
                  for(Integer source : candidates) {
                      if(source == null) continue;
                      AudioRecord candidate = tryPreferredAudioRecord(source, sampleRate, requestedBufferBytes, preferredDevice);
                      if(candidate != null) return candidate;
                  }
                  return null;
              }
          
              boolean isBleHeadsetInput(AudioDeviceInfo device) {
                  return device != null && Build.VERSION.SDK_INT >= 31 && device.getType() == AudioDeviceInfo.TYPE_BLE_HEADSET;
              }
          
              boolean deviceAdvertisesSampleRate(AudioDeviceInfo device, int sampleRate) {
                  if(device == null) return false;
                  try {
                      int[] rates = device.getSampleRates();
                      if(rates == null || rates.length == 0) return true;
                      for(int rate : rates) if(rate == sampleRate) return true;
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Input sample-rate query failed", e);
                      return true;
                  }
                  return false;
              }
          
              int preferredBleChannelMask(AudioDeviceInfo device) {
                  if(device == null) return AudioFormat.CHANNEL_IN_MONO;
                  try {
                      int[] counts = device.getChannelCounts();
                      if(counts == null || counts.length == 0) return AudioFormat.CHANNEL_IN_MONO;
                      boolean stereo = false;
                      for(int count : counts) if(count >= 2) stereo = true;
                      // A BLE Audio útmutató szerint támogatott kétcsatornás bemenetnél
                      // sztereót kérünk, majd a beszédfeldolgozás előtt monóra keverjük.
                      if(stereo) return AudioFormat.CHANNEL_IN_STEREO;
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Input channel-count query failed", e);
                  }
                  return AudioFormat.CHANNEL_IN_MONO;
              }
          
              AudioRecord makeBestAudioRecord(int sampleRate, int requestedBufferBytes) {
                  activeCaptureSampleRate = AUDIO_SAMPLE_RATE;
                  activeCaptureChannelCount = 1;
                  directBleCaptureActive = false;
                  directBleDigitalSilenceMs = 0L;
                  directBleFallbackRequested = false;
                  synchronized(captureRateRemainder) { captureRateRemainder.reset(); }
          
                  // V40.11: tolmács módban a headset marad a TTS kimenete, de a külső beszélőt
                  // a telefon mikrofonja veszi. A Buds mikrofonja közelbeszélő/nyalábformált bemenet,
                  // ezért a távolabbi beszédet és a hangszóróból érkező hangot háttérzajként elnyomhatja.
                  if(interpreterMode && "headset_output_phone_mic".equals(activeInterpreterRoute) && preferredInterpreterInputDevice != null) {
                      AudioRecord phoneMic = tryAudioRecordCandidates(sampleRate, requestedBufferBytes, preferredInterpreterInputDevice);
                      if(phoneMic != null) return phoneMic;
                      android.util.Log.w(LOG_TAG, "Built-in interpreter microphone preference was rejected; using normal system input");
                  }
          
                  if(interpreterMode && "headset_direct".equals(activeInterpreterRoute) && preferredInterpreterInputDevice != null) {
                      AudioRecord direct = null;
                      if(isBleHeadsetInput(preferredInterpreterInputDevice)) {
                          // Az Android BLE Audio rögzítési útmutatója MIC + 32 kHz felvételt használ.
                          // A 16 kHz-es VOICE_RECOGNITION közvetlen BLE út Samsung/Buds eszközön
                          // elfogadott útvonal mellett is néma PCM-et adhat.
                          int bleChannelMask = preferredBleChannelMask(preferredInterpreterInputDevice);
                          int bleChannels = bleChannelMask == AudioFormat.CHANNEL_IN_STEREO ? 2 : 1;
                          if(deviceAdvertisesSampleRate(preferredInterpreterInputDevice, 32000)) {
                              direct = tryPreferredAudioRecord(MediaRecorder.AudioSource.MIC, 32000,
                                  Math.max(requestedBufferBytes * 2 * bleChannels, SILERO_FRAME_BYTES * 16 * bleChannels),
                                  preferredInterpreterInputDevice, bleChannelMask);
                              if(direct != null) {
                                  activeCaptureSampleRate = 32000;
                                  activeCaptureChannelCount = bleChannels;
                                  directBleCaptureActive = true;
                                  return direct;
                              }
                          }
                          direct = tryPreferredAudioRecord(MediaRecorder.AudioSource.MIC, AUDIO_SAMPLE_RATE,
                              Math.max(requestedBufferBytes * bleChannels, SILERO_FRAME_BYTES * 8 * bleChannels),
                              preferredInterpreterInputDevice, bleChannelMask);
                          if(direct != null) {
                              activeCaptureSampleRate = AUDIO_SAMPLE_RATE;
                              activeCaptureChannelCount = bleChannels;
                              directBleCaptureActive = true;
                              return direct;
                          }
                      } else {
                          direct = tryAudioRecordCandidates(sampleRate, requestedBufferBytes, preferredInterpreterInputDevice);
                          if(direct != null) return direct;
                      }
          
                      rejectedInterpreterInputDeviceId = preferredInterpreterInputDevice.getId();
                      android.util.Log.w(LOG_TAG, "Direct headset input was rejected; trying communication fallback, deviceId=" + rejectedInterpreterInputDeviceId);
                      if(activateInterpreterCommunicationFallback()) {
                          waitForCommunicationDeviceActivation(1800L);
                          AudioRecord fallback = tryAudioRecordCandidates(sampleRate, requestedBufferBytes, null);
                          if(fallback != null) return fallback;
                      } else {
                          activeInterpreterRoute = "speaker_half_duplex";
                          activeCommunicationDeviceLabel = "telefon mikrofon";
                          interpreterCommunicationFallbackActive = false;
                          activeCommunicationDeviceId = -1;
                          ttsController.refreshAudioAttributes();
                      }
                  }
          
                  AudioRecord regular = tryAudioRecordCandidates(sampleRate, requestedBufferBytes, null);
                  if(regular != null) return regular;
                  android.util.Log.e(LOG_TAG, "No supported AudioRecord source could be initialized");
                  return null;
              }
          
              boolean isHeadsetOutputDeviceType(int type) {
                  return type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                      type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP ||
                      type == AudioDeviceInfo.TYPE_WIRED_HEADSET ||
                      type == AudioDeviceInfo.TYPE_WIRED_HEADPHONES ||
                      type == AudioDeviceInfo.TYPE_USB_HEADSET ||
                      type == AudioDeviceInfo.TYPE_USB_DEVICE ||
                      type == AudioDeviceInfo.TYPE_HEARING_AID ||
                      (Build.VERSION.SDK_INT >= 31 && (type == AudioDeviceInfo.TYPE_BLE_HEADSET || type == AudioDeviceInfo.TYPE_BLE_SPEAKER));
              }
          
              String audioDeviceLabel(AudioDeviceInfo d) {
                  if(d == null) return "rendszer alapértelmezett";
                  CharSequence name = d.getProductName();
                  String n = name == null ? "" : name.toString().trim();
                  return n.length() > 0 ? n : ("audioeszköz " + d.getType());
              }
          
              String audioDeviceTypeShortLabel(int type) {
                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) return "BT-SCO";
                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) return "BT-A2DP";
                  if(type == AudioDeviceInfo.TYPE_WIRED_HEADSET) return "vezetékes";
                  if(type == AudioDeviceInfo.TYPE_USB_HEADSET || type == AudioDeviceInfo.TYPE_USB_DEVICE) return "USB";
                  if(type == AudioDeviceInfo.TYPE_HEARING_AID) return "hallókészülék";
                  if(type == AudioDeviceInfo.TYPE_BUILTIN_MIC) return "telefon mikrofon";
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_HEADSET) return "BLE headset";
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_SPEAKER) return "BLE hangszóró";
                  return "típus " + type;
              }
          
              String compactAudioDeviceLabel(AudioDeviceInfo d) {
                  if(d == null) return "ismeretlen";
                  String name = audioDeviceLabel(d);
                  String type = audioDeviceTypeShortLabel(d.getType());
                  if(name.equalsIgnoreCase(type)) return name;
                  return name + " / " + type;
              }
          
              void setInputRouteHeader(String text) {
                  if(inputRouteState == null) return;
                  Runnable update = () -> inputRouteState.setText(text == null || text.trim().isEmpty() ? "BEMENET: —" : text);
                  if(Looper.myLooper() == Looper.getMainLooper()) update.run();
                  else runOnUiThread(update);
              }
          
              void showPlannedInputRoute() {
                  if(preferredInterpreterInputDevice != null && "headset_output_phone_mic".equals(activeInterpreterRoute)) {
                      setInputRouteHeader("BEMENET: " + compactAudioDeviceLabel(preferredInterpreterInputDevice) +
                          " • kimenet: " + activeCommunicationDeviceLabel);
                  } else if(preferredInterpreterInputDevice != null && "headset_direct".equals(activeInterpreterRoute)) {
                      setInputRouteHeader("BEMENET: " + compactAudioDeviceLabel(preferredInterpreterInputDevice) + "…");
                  } else if(interpreterCommunicationFallbackActive) {
                      setInputRouteHeader("BEMENET: kommunikációs tartalék…");
                  } else {
                      setInputRouteHeader("BEMENET: rendszer…");
                  }
              }
          
              void refreshActualInputRoute(AudioRecord recorder) {
                  if(recorder == null) {
                      setInputRouteHeader("BEMENET: —");
                      return;
                  }
                  try {
                      AudioDeviceInfo routed = recorder.getRoutedDevice();
                      if(routed != null) {
                          String suffix;
                          if("headset_output_phone_mic".equals(activeInterpreterRoute)) {
                              suffix = " • kimenet: " + activeCommunicationDeviceLabel;
                          } else if(directBleCaptureActive && activeCaptureSampleRate == 32000) {
                              suffix = activeCaptureChannelCount > 1 ? " • 32k sztereó→16k" : " • 32→16 kHz";
                          } else {
                              suffix = interpreterCommunicationFallbackActive ? " • kommunikációs" : "";
                          }
                          setInputRouteHeader("BEMENET: " + compactAudioDeviceLabel(routed) + suffix);
                      } else setInputRouteHeader("BEMENET: útvonal ellenőrzés…");
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Actual input route query failed", e);
                      setInputRouteHeader("BEMENET: ismeretlen");
                  }
              }
          
              void registerActualInputRouteUpdates(AudioRecord recorder) {
                  if(recorder == null || Build.VERSION.SDK_INT < 24) return;
                  try {
                      recorder.addOnRoutingChangedListener(new AudioRouting.OnRoutingChangedListener() {
                          @Override public void onRoutingChanged(AudioRouting router) {
                              if(rec == recorder) refreshActualInputRoute(recorder);
                          }
                      }, new Handler(Looper.getMainLooper()));
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "AudioRecord route listener registration failed", e);
                  }
              }
          
              List<AudioDeviceInfo> availableInputDevicesCompat() {
                  ArrayList<AudioDeviceInfo> out = new ArrayList<>();
                  if(audioManager == null || Build.VERSION.SDK_INT < 23) return out;
                  try { out.addAll(Arrays.asList(audioManager.getDevices(AudioManager.GET_DEVICES_INPUTS))); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "Input device query failed", e); }
                  return out;
              }
          
