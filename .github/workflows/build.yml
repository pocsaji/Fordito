              void pasteClipboardAtCursor() {
                  String clip = getClipboardText();
                  if(clip == null || clip.length() == 0) {
                      Toast.makeText(this, "A vágólap üres.", Toast.LENGTH_SHORT).show();
                      return;
                  }
          
                  EditText target;
                  if(topBox != null && topBox.hasFocus()) target = topBox;
                  else if(bottomBox != null && bottomBox.hasFocus()) target = bottomBox;
                  else target = manualTopSource ? topBox : bottomBox;
                  if(target == null) return;
          
                  int start = Math.max(0, target.getSelectionStart());
                  int end = Math.max(0, target.getSelectionEnd());
                  if(start > end) { int t = start; start = end; end = t; }
                  start = Math.min(start, target.getText().length());
                  end = Math.min(end, target.getText().length());
          
                  programmaticChange = true;
                  try {
                      target.getText().replace(start, end, clip);
                      int cursor = Math.min(start + clip.length(), target.getText().length());
                      target.setSelection(cursor);
                      target.requestFocus();
                      manualTopSource = (target == topBox);
                      topActive = manualTopSource;
                  } finally {
                      programmaticChange = false;
                  }
                  updateButtons();
              }
          
