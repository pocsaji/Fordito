              void applyInputProfileValues() {
                  // V240: egyetlen valódi hanglánc-blokk.
                  // A mikrofon/STT értékeket nem több külön menü és nem régi mentés darabjai vezérlik,
                  // hanem a kiválasztott hangprofil. Így nincs placebo-érzés és nincs egymás ellen dolgozó beállítás.
                  if("truck_noisy".equals(soundProfile)) {
                      vadMode = "high";              // gyorsabb mondatzárás, ne várja meg a teljes monológot
                      delayMode = "medium";          // nem xhigh: kisebb késleltetés, még nem túl kapkodó
                      micGateMode = "sensitive";     // helyi kapu ki: ne itt vesszen el a halk beszéd
                      audioSourceMode = "recognition";
                      androidEffectsMode = "recommended"; // NS+AGC, AEC nélkül
                      openAiNoiseMode = "off";       // Buds/headset mellett ez eddig rontott
                  } else {
                      soundProfile = "general";
                      vadMode = "medium";
                      delayMode = "medium";
                      micGateMode = "sensitive";
                      audioSourceMode = "recognition";
                      androidEffectsMode = "recommended";
                      openAiNoiseMode = "off";
                  }
              }

