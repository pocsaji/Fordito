                  programmaticChange=true;
                  topBox.setText("");
                  programmaticChange=false;
                  topManualStart=-1;
                  textBlocks.clear();
                  Toast.makeText(this, "Felső ablak törölve.", Toast.LENGTH_SHORT).show();
              }

              void clearBottomBox() {
                  programmaticChange=true;
                  bottomBox.setText("");
                  programmaticChange=false;
                  bottomManualStart=-1;
                  textBlocks.clear();
                  Toast.makeText(this, "Alsó ablak törölve.", Toast.LENGTH_SHORT).show();
              }

              void clearBothBoxes() {
                  programmaticChange=true;
                  topBox.setText("");
                  bottomBox.setText("");
                  programmaticChange=false;
                  topManualStart=-1;
                  bottomManualStart=-1;
