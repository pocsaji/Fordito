              void showFloatingResultWindow(String text) {
                  if(!canDrawOverlayNow()) { Toast.makeText(this, text, Toast.LENGTH_LONG).show(); return; }
                  try {
                      if(floatingWindowManager == null) floatingWindowManager = (android.view.WindowManager)getSystemService(WINDOW_SERVICE);
                      hideFloatingResultWindow();
                      LinearLayout lay = new LinearLayout(this);
                      lay.setOrientation(LinearLayout.VERTICAL);
                      lay.setPadding(18, 14, 18, 14);
                      lay.setBackgroundColor(Color.rgb(35,38,44));
                      TextView tv = label(text);
                      tv.setTextSize(16);
                      tv.setTextColor(Color.WHITE);
                      tv.setMaxLines(12);
                      lay.addView(tv, new LinearLayout.LayoutParams(-1, -2));
                      LinearLayout row = row();
                      Button copy = btn("MÁSOL");
                      Button close = btn("BEZÁR");
                      copy.setOnClickListener(v -> { setClipboardText(tv.getText().toString()); Toast.makeText(this, "Vágólapra másolva.", Toast.LENGTH_SHORT).show(); });
                      close.setOnClickListener(v -> hideFloatingResultWindow());
                      row.addView(copy, new LinearLayout.LayoutParams(0,70,1));
                      row.addView(close, new LinearLayout.LayoutParams(0,70,1));
                      lay.addView(row);
                      floatingResultView = lay;
                      android.view.WindowManager.LayoutParams lp = floatingParams(-1, -2, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                      lp.x = 0; lp.y = 60;
                      floatingWindowManager.addView(floatingResultView, lp);
                  } catch(Exception e) {
                      Toast.makeText(this, text, Toast.LENGTH_LONG).show();
                  }
              }

              void hideFloatingResultWindow() {
                  try { if(floatingWindowManager != null && floatingResultView != null) floatingWindowManager.removeView(floatingResultView); } catch(Exception ignored) {}
                  floatingResultView = null;
              }


