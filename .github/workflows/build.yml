              void pasteClipboardToLanguageBoxAfterForeground() {
                  String s = getClipboardText().trim();
                  if(s.length() == 0) { Toast.makeText(this, "A vágólap üres vagy Android háttérből nem adta át.", Toast.LENGTH_SHORT).show(); return; }
                  boolean sourceTop = clipboardTextBelongsToTopBox(s);
          
                  programmaticChange = true;
                  topBox.setText("");
                  bottomBox.setText("");
                  EditText box = sourceTop ? topBox : bottomBox;
                  box.setText(s);
                  box.setSelection(box.getText().length());
                  programmaticChange = false;
          
                  topManualStart = -1;
                  bottomManualStart = -1;
                  textBlocks.clear();
