                  // V318: kattintás, fókusz és gépelés miatt nem állítjuk le a mikrofont.
                  // Kézi FORDÍT gombnál külön útvonal dolgozik, ezért nem kell itt élő
                  // mikrofon-stop. Csak a régi kézi válasz maradékát takarítjuk, ha volt.
                  if(!streaming) {
