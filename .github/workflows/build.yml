              void enableAndroidAudioEffects() {
                  try {
                      if(rec == null || "off".equals(androidEffectsMode)) return;
                      int sid = rec.getAudioSessionId();

                      boolean useNs = "recommended".equals(androidEffectsMode) || "full".equals(androidEffectsMode) || "ns_only".equals(androidEffectsMode);
                      boolean useAgc = "recommended".equals(androidEffectsMode) || "full".equals(androidEffectsMode);
                      boolean useAec = "full".equals(androidEffectsMode);

                      if(useNs && NoiseSuppressor.isAvailable()) {
                          noiseSuppressor = NoiseSuppressor.create(sid);
                          if(noiseSuppressor != null) noiseSuppressor.setEnabled(true);
                      }

                      if(useAgc && AutomaticGainControl.isAvailable()) {
                          automaticGainControl = AutomaticGainControl.create(sid);
                          if(automaticGainControl != null) automaticGainControl.setEnabled(true);
                      }

                      if(useAec && AcousticEchoCanceler.isAvailable()) {
                          acousticEchoCanceler = AcousticEchoCanceler.create(sid);
                          if(acousticEchoCanceler != null) acousticEchoCanceler.setEnabled(true);
                      }
                  } catch(Exception ignored) {}
              }

              void releaseAndroidAudioEffects() {
                  try {
                      if(noiseSuppressor != null) noiseSuppressor.release();
                  } catch(Exception ignored) {}
                  try {
                      if(automaticGainControl != null) automaticGainControl.release();
                  } catch(Exception ignored) {}
                  try {
                      if(acousticEchoCanceler != null) acousticEchoCanceler.release();
                  } catch(Exception ignored) {}

                  noiseSuppressor = null;
                  automaticGainControl = null;
                  acousticEchoCanceler = null;
              }

              int selectedAudioSource() {
                  if("recognition".equals(audioSourceMode)) return MediaRecorder.AudioSource.VOICE_RECOGNITION;
                  if("communication".equals(audioSourceMode)) return MediaRecorder.AudioSource.VOICE_COMMUNICATION;
                  if("unprocessed".equals(audioSourceMode)) return MediaRecorder.AudioSource.UNPROCESSED;
                  return MediaRecorder.AudioSource.MIC;
              }

              AudioRecord makeAudioRecord(int source, int sr, int bs) {
                  try {
                      AudioRecord r = new AudioRecord(source, sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bs);
                      if(r.getState() == AudioRecord.STATE_INITIALIZED) return r;
                      try { r.release(); } catch(Exception ignored) {}
                  } catch(Exception ignored) {}
                  return null;
              }

              AudioRecord makeBestAudioRecord(int sr, int bs) {
                  AudioRecord r = makeAudioRecord(selectedAudioSource(), sr, bs);
                  if(r != null) return r;
                  r = makeAudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION, sr, bs);
                  if(r != null) return r;
                  r = makeAudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sr, bs);
                  if(r != null) return r;
                  return makeAudioRecord(MediaRecorder.AudioSource.MIC, sr, bs);
              }

              void audioLoop() {
                  int sr = 24000;
                  int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  int bs = Math.max(min, 4800);

                  // V109: 24 kHz PCM16 mono marad. Buffer cél kb. 100 ms.
                  // Hangforrás és Android/OpenAI zajszűrés menüből tesztelhető.
                  rec = makeBestAudioRecord(sr, bs);
                  if(rec == null) { runOnUiThread(() -> state.setText("mikrofon hiba")); return; }
                  enableAndroidAudioEffects();
                  streaming = true;
                  setLiveUiLocked(false);
                  rec.startRecording();
                  updateButtons();

                  audioExec.submit(() -> {
                      byte[] buf = new byte[bs];
                      clearPreRollAudio();
                      voiceSendActive = false;
                      trailingSilenceOpen = false;
                      lastVoiceChunkSentAtMs = 0L;
                      while(streaming && connected && ws != null && rec != null) {
                          int read = rec.read(buf, 0, buf.length);
                          if(read > 0) {
                              try {
                                  if("speaker".equals(interpreterAudioMode) && (ttsSpeaking || System.currentTimeMillis() < ttsMuteUntilMs)) {
                                      trailingSilenceOpen = false;
                                      voiceSendActive = false;
                                      clearPreRollAudio();
                                      continue;
                                  }

                                  int threshold = micGateThreshold();
                                  long now = System.currentTimeMillis();
                                  if(threshold <= 0) {
                                      clearPreRollAudio();
                                      voiceSendActive = true;
                                      trailingSilenceOpen = true;
                                      lastVoiceChunkSentAtMs = now;
                                      sendAudioChunk(Arrays.copyOf(buf, read));
                                      continue;
                                  }

                                  boolean overGate = avgAbsPcm16(buf, read) >= threshold;
                                  if(overGate) {
                                      if(!voiceSendActive) {
                                          for(byte[] pr : takePreRollAudio()) sendAudioChunk(pr);
                                      }
                                      voiceSendActive = true;
                                      trailingSilenceOpen = true;
                                      lastVoiceChunkSentAtMs = now;
                                      sendAudioChunk(Arrays.copyOf(buf, read));
                                      continue;
                                  }

                                  if(voiceSendActive) {
                                      byte[] tail = prepareTrailingSilenceChunk(buf, read);
                                      if(tail != null) {
                                          sendAudioChunk(tail);
                                          continue;
                                      }
                                  }

                                  rememberPreRollAudio(buf, read);
                              } catch(Exception ignored) {}
                          }
                      }
                  });
              }

              void handleConnectionFailure(Throwable t) {
                  String msg = t == null ? "ismeretlen hiba" : String.valueOf(t.getMessage());

                  // V180: lebegő vágólap-fordításnál nincs blokkállapot, csak mini ablak/toast.
                  if(clipboardResponseMode) {
                      clipboardResponseMode = false;
                      pendingClipboardText = "";
                      Toast.makeText(this, "Kapcsolat hiba vágólap-fordítás közben.", Toast.LENGTH_LONG).show();
                      stop();
                      return;
                  }

                  // V77: kézi fordításnál nincs blokkállapot. Hiba esetén nem írunk semmit az ablakokba.
                  if(manualResponseMode) {
                      manualResponseMode = false;
                      pendingManualText = "";
                      Toast.makeText(this, "Kapcsolat hiba kézi fordítás közben. Próbáld újra a FORDÍT gombbal.", Toast.LENGTH_LONG).show();
                      stop();
                      return;
                  }

                  // Normál beszéd/élő fordításnál se írjunk hibaüzenetet a fordítási ablakba.
                  Toast.makeText(this, "Kapcsolat hiba: " + msg, Toast.LENGTH_LONG).show();
                  stop();
              }

              void stop() {
                  streaming = false;
                  connected = false;
                  ttsMuteUntilMs = 0L;
                  lastVoiceChunkSentAtMs = 0L;
                  trailingSilenceOpen = false;
                  voiceSendActive = false;
                  pendingAudioStartAfterSessionUpdate = false;
                  clearPreRollAudio();
                  releaseAndroidAudioEffects();
                  try { if(rec != null) { rec.stop(); rec.release(); } } catch(Exception ignored) {}
                  rec = null;
                  liveTranscriptBuffer = "";
                  liveHadTranscriptDelta = false;
                  firstSpeechHeardAt = 0L;
                  liveBufferStartedAt = 0L;
                  liveLastTranscriptDeltaAt = 0L;
                  liveIdleFlushToken++;
                  lastLiveBlockReleasedAt = 0L;
                  liveDeltaReleasedSinceLastCompleted = false;
                  firstSpeechBlockReleased = false;
                  liveTranslateMode = false;
                  pendingLiveBlockId = -1;
                  liveTranslateQueue.clear();
                  recentLiveBlockHashes.clear();
                  recentLiveBlockHashOrder.clear();
                  try { if(ws != null) ws.close(1000, "stop"); } catch(Exception ignored) {}
                  ws = null;
                  stopBackgroundForegroundService();
                  runOnUiThread(() -> {
                      state.setText("készenlét");
                      updateButtons();
                  });
              }

              void event(String s) {
                  try {
                      JSONObject o = new JSONObject(s);
                      String type = o.optString("type", "");

                      if(type.equals("session.updated")) {
                          if(pendingAudioStartAfterSessionUpdate && connected && ws != null && !streaming) {
                              pendingAudioStartAfterSessionUpdate = false;
                              runOnUiThread(() -> audioLoop());
                          }
                      }

                      if(type.equals("response.created")) {
                          responseInProgress = true;
                      }

                      if(type.equals("response.done")) {
                          responseInProgress = false;
                          // V77: ha egy live fordítás válasz nélkül zárult, a blokk nem számít késznek; később pótolható.
                          if(liveTranslateMode && pendingLiveBlockId >= 0 && pendingOutput.trim().length() == 0) {
                              int missId = pendingLiveBlockId;
                              pendingLiveBlockId = -1;
                              liveTranslateMode = false;
                              runOnUiThread(() -> renderBlocksKeepView());
                          }
                          // V55: élő fordítási sor csak akkor induljon tovább,
                          // amikor az előző response ténylegesen lezárult a szerver szerint.
                          // Különben a következő response.create könnyen "response in progress" hibára fut,
                          // és a fordítás az első blokk után megáll.
                          if(!liveTranslateMode && !liveTranslateQueue.isEmpty()) {
                              runOnUiThread(() -> processNextLiveTranslation());
                          }
                      }

                      if(type.equals("conversation.item.input_audio_transcription.delta")) {
                          String d = o.optString("delta", "");
                          if(!d.isEmpty()) runOnUiThread(() -> handleTranscriptDelta(d));
                      }

                      if(type.equals("conversation.item.input_audio_transcription.completed")) {
                          String tr = o.optString("transcript", "");
                          if(!tr.isEmpty()) runOnUiThread(() -> handleTranscriptCompleted(tr));
                      }

                      if(type.equals("response.text.delta") || type.equals("response.output_text.delta")) {
                          String d = o.optString("delta", "");
                          if(!d.isEmpty()) pendingOutput += d;
                      }

                      if(type.equals("response.output_text.done") || type.equals("response.text.done")) {
                          String out = pendingOutput.trim();
                          pendingOutput = "";
                          if(!out.isEmpty()) runOnUiThread(() -> routeAiOutput(out));
                      }

                      if(type.equals("error")) {
                          JSONObject er = o.optJSONObject("error");
                          String msg = er == null ? o.toString() : er.optString("message", er.toString());
                          if(msg.contains("response in progress")) {
                              responseInProgress = true;
                              // V55: ha live fordítás közben túl korán próbáltunk új választ indítani,
                              // ne nyeljük le végleg a sort: röviden visszarakjuk a blokkot és újrapróbáljuk.
                              if(liveTranslateMode && pendingLiveBlockId >= 0) {
                                  int retryId = pendingLiveBlockId;
                                  pendingLiveBlockId = -1;
                                  liveTranslateMode = false;
                                  liveTranslateQueue.add(retryId);
                                  new Handler().postDelayed(() -> processNextLiveTranslation(), 700);
                              }
                          }
                          if(manualResponseMode) {
                              runOnUiThread(() -> handleConnectionFailure(new RuntimeException(msg)));
                          } else {
                              runOnUiThread(() -> Toast.makeText(this, "API hiba: " + msg, Toast.LENGTH_LONG).show());
                          }
                      }
                  } catch(Exception e) {
                      runOnUiThread(() -> append("\n[event hiba] " + e.getMessage()));
                  }
              }

              void manualTranslate() {
                  if(uiLockedForLive || finalizingStop) return;
                  EditText source = manualTopSource ? topBox : bottomBox;
                  source.clearFocus();
                  try {
                      InputMethodManager imm = (InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);
                      imm.hideSoftInputFromWindow(source.getWindowToken(), 0);
                  } catch(Exception ignored) {}

                  String sourceText = source.getText().toString().trim();
                  if(sourceText.length() == 0) {
                      Toast.makeText(this, manualTopSource ? "A felső ablak üres." : "Az alsó ablak üres.", Toast.LENGTH_LONG).show();
                      return;
                  }

                  if(!hasKey()) { showApi(); return; }

                  String srcCode = manualTopSource ? code(topLang) : code(bottomLang);
                  String tgtCode = manualTopSource ? code(bottomLang) : code(topLang);
                  String payload = "SOURCE_LANG: " + srcCode + "\n"
                       + "TARGET_LANG: " + tgtCode + "\n"
                       + "TEXT:\n" + sourceText;

                  if(ws == null || !connected) {
                      pendingManualText = payload;
                      start(false);
                  } else {
                      sendManualText(payload);
                  }
              }

              void sendManualText(String text) {
                  topActive = manualTopSource;
                  liveTranslateMode = false;
                  pendingLiveBlockId = -1;
                  liveTranslateQueue.clear();
                  pendingOutput = "";
                  updateButtons();
                  if(responseInProgress && ws != null) {
                      try {
                          JSONObject cancel = new JSONObject();
                          cancel.put("type", "response.cancel");
                          ws.send(cancel.toString());
                          responseInProgress = false;
                      } catch(Exception ignored) {}
                  }
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "conversation.item.create");
                      JSONObject item = new JSONObject();
                      item.put("type", "message");
                      item.put("role", "user");
                      JSONArray content = new JSONArray();
                      JSONObject c = new JSONObject();
                      c.put("type", "input_text");
                      manualResponseMode = true;
                      c.put("text", "MANUAL_FULL_WINDOW_TRANSLATION\n" + text + "\n\nReturn ONLY the translated full text. Preserve paragraphs and line breaks where reasonable. Do not write SOURCE_LANG, TARGET_LANG, ORIGINAL, TEXT, TRANSLATION, markdown, quotes or explanation. Do not censor, mask, soften, sanitize, label, bracket, star out, or replace profanity, vulgarity, insults, sexual words, slang, or rude wording.");
                      content.put(c);
                      item.put("content", content);
                      msg.put("item", item);
                      ws.send(msg.toString());

                      JSONObject resp = new JSONObject();
                      resp.put("type", "response.create");
                      JSONObject response = new JSONObject();
                      response.put("instructions", manualBlockInstructions());
                      resp.put("response", response);
                      responseInProgress = true;
                      ws.send(resp.toString());
                  } catch(Exception e) {
                      manualResponseMode = false;
                      Toast.makeText(this, "Kézi fordítás hiba. Próbáld újra.", Toast.LENGTH_LONG).show();
                  }
              }

              void handleTranscriptDelta(String delta) {
                  if(delta == null || delta.length() == 0) return;
                  liveHadTranscriptDelta = true;
                  long now = System.currentTimeMillis();
                  liveLastTranscriptDeltaAt = now;
                  if(firstSpeechHeardAt == 0L) firstSpeechHeardAt = now;
                  if(liveTranscriptBuffer.trim().length() == 0) liveBufferStartedAt = now;
                  liveTranscriptBuffer += delta;
                  int released = flushReadyTranscriptBlocks(false);
                  if(released > 0) {
                      liveDeltaReleasedSinceLastCompleted = true;
                      // V156: a már kiadott delta-blokkhoz tartozó korábbi idle flush ne futhasson rá később.
                      liveIdleFlushToken++;
                  }

                  // V75/V156: csak akkor ütemezünk utóflush-t, ha tényleg maradt pufferben szöveg.
                  // Ez nem lassítás: nincs plusz várakozás, csak a régi tokenek érvénytelenítése.
                  if(liveTranscriptBuffer.trim().length() > 0) {
                      final int token = ++liveIdleFlushToken;
                      topBox.postDelayed(() -> {
                          if(token == liveIdleFlushToken && streaming && liveTranscriptBuffer.trim().length() > 0) {
                              flushReadyTranscriptBlocks(true);
                          }
                      }, 1400);
                  }
              }

              void handleTranscriptCompleted(String transcript) {
                  // V51 duplázás-javítás:
                  // A completed esemény sokszor ugyanazt a teljes mondatot küldi újra,
                  // amit a delta eseményekből már kiírtunk és fordítottunk.
                  // Ha volt delta ebben a körben, NEM töltjük vissza a teljes transcriptet,
                  // csak a bufferben maradt befejezetlen részt zárjuk le.
                  boolean completedIsOnlyAlreadyReleased = false;
                  if(!liveHadTranscriptDelta && liveTranscriptBuffer.trim().length() == 0 && transcript != null && transcript.trim().length() > 0) {
                      completedIsOnlyAlreadyReleased = isAlreadyReleasedTranscript(transcript);
                      if(!completedIsOnlyAlreadyReleased) {
                          liveBufferStartedAt = System.currentTimeMillis();
                          liveTranscriptBuffer = transcript;
                      }
                  }
                  // V156: completed nem írhatja ki újra azt, amit a delta útvonal már kiadott.
                  // Ha viszont valódi maradék van a pufferben, azonnal kiengedjük; nincs lassítás.
                  int released = completedIsOnlyAlreadyReleased ? 0 : flushReadyTranscriptBlocks(true);
                  if(released > 0) lastLiveBlockReleasedAt = System.currentTimeMillis();
                  liveIdleFlushToken++;
                  liveHadTranscriptDelta = false;
                  liveDeltaReleasedSinceLastCompleted = false;
              }

              void resetLiveRecognitionTimingState() {
                  // V156: beszédfelismerési időzítés váltásakor nem várunk és nem építünk új kaput.
                  // Csak az élő, még le nem zárt transcript állapotot nullázzuk, hogy a régi mód
                  // puffer/időzítője ne zárhasson rá az új mód szabályaira. A már kiadott blokkok
                  // dedupe-cache-e szándékosan megmarad, így egy későn érkező régi completed esemény
                  // nem tudja újra behozni ugyanazt a mondatot.
                  liveTranscriptBuffer = "";
                  liveHadTranscriptDelta = false;
                  firstSpeechHeardAt = 0L;
                  liveBufferStartedAt = 0L;
                  liveLastTranscriptDeltaAt = 0L;
                  liveIdleFlushToken++;
                  lastLiveBlockReleasedAt = 0L;
                  liveDeltaReleasedSinceLastCompleted = false;
              }

              void applyRecognitionTimingChange() {
                  resetLiveRecognitionTimingState();
                  sessionUpdateIfConnected();
              }

              int flushReadyTranscriptBlocks(boolean flushAll) {
                  int releasedCount = 0;
                  // V74: az első élő blokkot nem engedjük ki azonnal 1-2 bizonytalan szóból.
                  // Ez szűri a kezdő "Microfoonprobe / Kazakhstan / UFO" jellegű félrehallást,
                  // de nem nyúl az audiohoz és nem épít új nyelvfelismerőt.
                  if(!firstSpeechBlockReleased && !initialSpeechGateOpen()) return 0;
                  while(true) {
                      String b = popReadySpeechBlock(flushAll);
                      if(b == null || b.trim().length() == 0) break;

                      // V151: egyetlen beviteli normalizáló blokk.
                      // Itt történik a tisztítás, a közvetlen ismétlés összehúzása,
                      // az előző blokk végével való átfedés levágása és a biztos duplázás kiszűrése.
                      // Alapelv: ha bizonytalan, átengedjük, nem nyeljük el a beszédet.
                      b = normalizeAndDeduplicateLiveBlock(b);
                      if(b.length() == 0) continue;
                      // V117: nyelvpár-zárás a BEVITELI oldalon.
                      // A fordító csak akkor kap blokkot, ha az átirat nem tűnik harmadik nyelvű zajnak.
                      if(!passesSelectedPairInputGate(b)) continue;
                      // V71: nem a helyi/fókusz heurisztika dönti el véglegesen a forrásoldalt.
                      // A blokk ideiglenesen az utolsó aktív oldalra kerül, majd a fordító AI
                      // a kiválasztott két nyelv közül címkézi a valódi SOURCE_LANG-et,
                      // és applyLiveTranslation() a blokkot a megfelelő ablakba rendezi.
                      int id = addSourceOnlyBlock(topActive, b);
                      if(id < 0) continue;
                      firstSpeechBlockReleased = true;
                      liveTranslateQueue.add(id);
                      releasedCount++;
                      lastLiveBlockReleasedAt = System.currentTimeMillis();
                  }
                  if(releasedCount > 0) {
                      // V156: sikeres kiírás után a régi idle flush már nem zárhat ugyanarra.
                      liveIdleFlushToken++;
                  }
                  processNextLiveTranslation();
                  return releasedCount;
              }

              boolean initialSpeechGateOpen() {
                  String s = liveTranscriptBuffer == null ? "" : liveTranscriptBuffer.trim();
                  if(s.length() == 0) return false;
                  int words = s.split("\\s+").length;
                  long age = firstSpeechHeardAt > 0L ? System.currentTimeMillis() - firstSpeechHeardAt : 0L;

                  // V74: az első blokkot nem engedjük át pusztán azért, mert a bizonytalan STT
                  // tett a végére pontot. Ez fogta meg a Microfoonprobe/Kazakhstan jellegű kezdést.
                  // Ugyanakkor ha a felhasználó tényleg csak 2-3 szót mond és utána hosszú csend van,
                  // 2 mp után fordítjuk, nem nyeljük el.
                  if(age >= 2000 && words >= 2) return true;
                  if(looksLikeObviousThirdLanguageNoise(s) && words < 5) return false;
                  if(firstHardSentenceEnd(s) >= 0 && words >= 3) return true;
                  if(s.length() >= 42 && words >= 4) return true;
                  return false;
              }

              boolean isAlreadyReleasedTranscript(String transcript) {
                  if(transcript == null) return false;
                  String b = cleanTranscriptForSelectedPair(transcript);
                  b = collapseAdjacentRepeatedPhrase(b);
                  b = finalizeSpeechBlockText(b);
                  b = applyTinyHungarianTermFixes(b);
                  b = b.trim().replaceAll("\\s+", " ");
                  if(b.length() == 0) return false;
                  String h = normalizeLiveBlockHash(b);
                  if(h.length() < 8) return false;
                  return matchesVeryRecentReleasedBlock(h);
              }

              boolean matchesVeryRecentReleasedBlock(String h) {
                  if(h == null || h.length() < 8) return false;
                  if(recentLiveBlockHashes.contains(h)) return true;
                  int checked = 0;
                  Iterator<String> it = recentLiveBlockHashOrder.descendingIterator();
                  while(it.hasNext() && checked < 8) {
                      String old = it.next();
                      checked++;
                      if(old == null || old.length() < 8) continue;
                      int min = Math.min(h.length(), old.length());
                      int max = Math.max(h.length(), old.length());
                      if(min >= 18 && (h.contains(old) || old.contains(h)) && (min * 100 / Math.max(1, max)) >= 82) return true;
                  }
                  return false;
              }

              String normalizeAndDeduplicateLiveBlock(String raw) {
                  if(raw == null) return "";
                  String b = cleanTranscriptForSelectedPair(raw);

                  // V151: egyetlen beviteli normalizáló lánc, nem új kapu.
                  // Előbb a blokkon belüli közvetlen ismétlést húzzuk össze bárhol,
                  // nem csak a blokk elején. Ez fogja meg a mondat közepén jelentkező
                  // közvetlen ismétlést is.
                  b = collapseAdjacentRepeatedPhrase(b);
                  b = finalizeSpeechBlockText(b);
                  b = applyTinyHungarianTermFixes(b);

                  // Utána csak az előző kész blokk végéből az új blokk elejére átcsúszó
                  // biztos átfedést vágjuk le. Ha bizonytalan, átengedjük.
                  b = trimRecentLiveBlockOverlap(b);
                  if(b == null) return "";
                  b = b.trim().replaceAll("\\s+", " ");
                  if(b.length() == 0) return "";

                  String h = normalizeLiveBlockHash(b);
                  if(h.length() < 3) return "";

                  // V156: legutolsó lépésként, minden tisztítás után hasonlítunk a közvetlenül
                  // frissen kiadott blokkokhoz. Nem új kapu: ugyanennek a normalizáló blokknak
                  // a vége. Csak teljes vagy majdnem teljes ismétlést dobunk el.
                  if(matchesVeryRecentReleasedBlock(h)) return "";

                  rememberLiveBlockHash(h);
                  return b;
              }

              String collapseAdjacentRepeatedPhrase(String raw) {
                  if(raw == null) return "";
                  String t = raw.trim().replaceAll("\\s+", " ");
                  if(t.length() == 0) return t;
                  String[] w = t.split("\\s+");
                  if(w.length < 6) return t;

                  ArrayList<String> out = new ArrayList<>();
                  int i = 0;
                  while(i < w.length) {
                      boolean collapsed = false;
                      int maxN = Math.min(10, (w.length - i) / 2);
                      for(int n=maxN; n>=3; n--) {
                          boolean same = true;
                          for(int j=0; j<n; j++) {
                              String a = normalizeLiveBlockHash(w[i+j]);
                              String b = normalizeLiveBlockHash(w[i+n+j]);
                              if(a.length() == 0 || !a.equals(b)) { same = false; break; }
                          }
                          if(same) {
                              for(int j=0; j<n; j++) out.add(w[i+j]);
                              i += n * 2;
                              collapsed = true;
                              break;
                          }
                      }
                      if(!collapsed) {
                          out.add(w[i]);
                          i++;
                      }
                  }

                  StringBuilder sb = new StringBuilder();
                  for(String x : out) {
                      if(sb.length() > 0) sb.append(' ');
                      sb.append(x);
                  }
                  return sb.toString().trim();
              }

              void rememberLiveBlockHash(String h) {
                  if(h == null || h.length() < 3) return;
                  recentLiveBlockHashes.add(h);
                  recentLiveBlockHashOrder.add(h);
                  while(recentLiveBlockHashOrder.size() > 80) {
                      String old = recentLiveBlockHashOrder.poll();
                      if(old != null) recentLiveBlockHashes.remove(old);
                  }
              }

              String finalizeSpeechBlockText(String raw) {
                  if(raw == null) return "";
                  String t = raw.trim().replaceAll("\\s+", " ");
                  while(t.startsWith(",") || t.startsWith(";") || t.startsWith(":")) t = t.substring(1).trim();
                  if(t.length() == 0) return "";
                  // V151: vesszőből / pontosvesszőből / kettőspontból nem gyártunk pontot.
                  // Ezek sokszor folytatást jelölnek, a hamis pont pedig rossz blokk- és
                  // nagybetűs mondatkezdést okozott.
                  return t;
              }

              boolean isAllowedShortReply(String text) {
                  if(text == null) return false;
                  String x = text.toLowerCase(Locale.ROOT)
                      .replaceAll("[^a-z0-9áéíóöőúüűàâçèéêëîïôùûüÿñæœß\\s]", " ")
                      .replaceAll("\\s+", " ").trim();
                  if(x.length() == 0) return false;

                  String[] one = {
                      "igen","nem","jó","jo","ok","oké","oke","rendben","persze","talán","talan",
                      "ma","holnap","tegnap","reggel","este","itt","ott","köszönöm","koszonom",
                      "oui","non","bon","merci","demain","hier","matin","soir",
                      "yes","no","okay","thanks","tomorrow","yesterday"
                  };
                  for(String w: one) if(x.equals(w)) return true;

                  String[] two = {
                      "nem tudom","jó lesz","jo lesz","ma este","holnap reggel","holnap este",
                      "igen köszönöm","igen koszonom","nem köszönöm","nem koszonom",
                      "oui merci","non merci","d accord","daccord","yes thanks","no thanks"
                  };
                  for(String w: two) if(x.equals(w)) return true;
                  return false;
              }

              String applyTinyHungarianTermFixes(String raw) {
                  if(raw == null) return "";
                  String x = raw.trim().replaceAll("\\s+", " ");
                  if(x.length() == 0) return x;

                  // V145: NEM általános szótár. Csak pár, tesztben sokszor félrehallott fix kifejezés.
                  x = x.replaceAll("(?iu)\\bblu\\s*t[uú]+t[h]?\\b", "Bluetooth");
                  x = x.replaceAll("(?iu)\\bbluetooth[- ]?ot\\b", "Bluetoothot");
                  x = x.replaceAll("(?iu)\\bbluetooth[- ]?on\\b", "Bluetoothon");
                  x = x.replaceAll("(?iu)\\bblutus\\b", "Bluetooth");
                  x = x.replaceAll("(?iu)\\bblut[uú]sz\\b", "Bluetooth");
                  x = x.replaceAll("(?iu)\\bblue\\s*tooth\\b", "Bluetooth");

                  x = x.replaceAll("(?iu)\\bs[íi]r[íi]\\s+csend\\b", "síri csend");
                  x = x.replaceAll("(?iu)\\bs[íi]li\\s+csend\\b", "síri csend");
                  x = x.replaceAll("(?iu)\\bs[íi]r[íi]ts?en\\b", "síri csend");
                  x = x.replaceAll("(?iu)\\bs[íi]ri\\s+csendes\\b", "síri csendes");

                  return x.trim().replaceAll("\\s+", " ");
              }

              boolean passesSelectedPairInputGate(String block) {
                  if(block == null) return false;
                  String t = block.trim();
                  if(t.length() == 0) return false;
                  int words = t.split("\\s+").length;
                  if(words <= 2 && isAllowedShortReply(t)) return true;
                  if(words <= 1) return false;

                  // Először a régi, óvatos harmadik-nyelv/zaj szűrő.
                  if(looksLikeObviousThirdLanguageNoise(t)) return false;
                  if(isLikelyNoisyTranscriptBlock(t)) return false;

                  // V117: ha FR/HU pár fut, a leggyakoribb kamionos zaj-hallucinációkat
                  // már a bevitelnél eldobjuk. Ez nem teljes nyelvdetektor, csak kapu.
                  String top = code(topLang).toLowerCase(Locale.ROOT);
                  String bottom = code(bottomLang).toLowerCase(Locale.ROOT);
                  boolean frHu = (top.equals("fr") && bottom.equals("hu")) || (top.equals("hu") && bottom.equals("fr"));
                  if(frHu && looksLikeNonFrHuNoise(t)) return false;

                  return true;
              }

              boolean looksLikeNonFrHuNoise(String text) {
                  if(text == null) return false;
                  String x = " " + text.toLowerCase(Locale.ROOT)
                          .replaceAll("[^a-záéíóöőúüűàâçèéêëîïôùûüÿñæœß\\s]", " ")
                          .replaceAll("\\s+", " ").trim() + " ";
                  int words = x.trim().length() == 0 ? 0 : x.trim().split("\\s+").length;
                  int hits = 0;

                  String[] nl = {" het ", " een ", " niet ", " geen ", " maar ", " jullie ", " microfoon", " spuit", " gevonden", " gewoon", " wordt ", " bij ", " adidas"};
                  String[] en = {" and ", " the ", " that ", " that's ", " this ", " your ", " hair ", " would ", " good ", " microphone ", " environment "};
                  String[] de = {" ich ", " nicht ", " und ", " oder ", " bitte ", " danke ", " aber ", " wasser "};
                  String[] es = {" entonces ", " ahora ", " puede ", " funciona ", " pantalla ", " bloqueada "};
                  String[] it = {" allora ", " questo ", " questa ", " funziona ", " schermo "};
                  String[] sv = {" jag ", " och ", " inte ", " men jag ", " det ", " är ", " till "};
                  for(String w: nl) if(x.contains(w)) hits++;
                  for(String w: en) if(x.contains(w)) hits++;
                  for(String w: de) if(x.contains(w)) hits++;
                  for(String w: es) if(x.contains(w)) hits++;
                  for(String w: it) if(x.contains(w)) hits++;
                  for(String w: sv) if(x.contains(w)) hits++;

                  if(words <= 6 && hits >= 1) return true;
                  return hits >= 2;
              }

              boolean isLikelyNoisyTranscriptBlock(String block) {
                  if(block == null) return true;
                  String t = block.trim();
                  if(t.length() == 0) return true;
                  String lower = " " + t.toLowerCase(Locale.ROOT)
                          .replaceAll("[^a-záéíóöőúüűàâçèéêëîïôùûüÿñæœß\\s]", " ")
                          .replaceAll("\\s+", " ").trim() + " ";
                  int words = lower.trim().length() == 0 ? 0 : lower.trim().split("\\s+").length;
                  if(words <= 1) return true;

                  int foreignHits = 0;
                  if(!selectedContains("nl")) {
                      String[] nl = {" het ", " een ", " wel ", " geen ", " niet ", " maar ", " jullie ", " reserver ", " gereserveerd ", "wasergadas"};
                      for(String w: nl) if(lower.contains(w)) foreignHits++;
                  }
                  if(!selectedContains("de")) {
                      String[] de = {" ich ", " nicht ", " und ", " oder ", " danke ", " bitte ", " aber ", " wasser "};
                      for(String w: de) if(lower.contains(w)) foreignHits++;
                  }
                  if(!selectedContains("en")) {
                      String[] en = {" allò ", " hello ", " that ", " this ", " would ", " reserved ", " microphone "};
                      for(String w: en) if(lower.contains(w)) foreignHits++;
                  }
                  if(foreignHits >= 3) return true;
                  if(words < 6 && foreignHits >= 1) return true;
                  return false;
              }

              String trimRecentLiveBlockOverlap(String block) {
                  if(block == null) return "";
                  String raw = block.trim().replaceAll("\\s+", " ");
                  String h = normalizeLiveBlockHash(raw);
                  if(h.length() < 8) return raw;
                  String[] nw = h.split("\\s+");
                  String[] rawWords = raw.split("\\s+");

                  for(String old : recentLiveBlockHashOrder) {
                      if(old == null || old.length() < 8) continue;
                      String[] ow = old.split("\\s+");
                      if(ow.length < 2 || nw.length < 2) continue;

                      // Ha a régi blokk teljes egészében az új blokk elején ismétlődik,
                      // csak ezt az eleji ismétlést vágjuk le, az új folytatást megtartjuk.
                      int fullOld = Math.min(ow.length, nw.length);
                      if(fullOld >= 3) {
                          boolean oldAtStart = true;
                          for(int i=0; i<fullOld; i++) {
                              if(!ow[i].equals(nw[i])) { oldAtStart = false; break; }
                          }
                          if(oldAtStart && fullOld < rawWords.length) {
                              StringBuilder sb = new StringBuilder();
                              for(int i=fullOld; i<rawWords.length; i++) {
                                  if(sb.length() > 0) sb.append(' ');
                                  sb.append(rawWords[i]);
                              }
                              return sb.toString().trim();
                          }
                      }

                      int maxN = Math.min(10, Math.min(ow.length, nw.length));
                      for(int n=maxN; n>=2; n--) {
                          boolean suffixPrefix = true;
                          for(int i=0; i<n; i++) {
                              if(!ow[ow.length-n+i].equals(nw[i])) { suffixPrefix = false; break; }
                          }
                          if(suffixPrefix) {
                              if(n >= rawWords.length) return "";
                              StringBuilder sb = new StringBuilder();
                              for(int i=n; i<rawWords.length; i++) {
                                  if(sb.length() > 0) sb.append(' ');
                                  sb.append(rawWords[i]);
                              }
                              return sb.toString().trim();
                          }
                      }
                  }
                  return raw;
              }

              boolean markLiveBlockQueued(String block) {
                  String h = normalizeLiveBlockHash(block);
                  if(h.length() < 3) return false;
                  if(recentLiveBlockHashes.contains(h)) return false;
                  rememberLiveBlockHash(h);
                  return true;
              }

              boolean isRecentlySimilarLiveBlock(String h) {
                  if(h == null || h.length() < 8) return false;
                  String[] a = h.split("\\s+");

                  for(String old : recentLiveBlockHashOrder) {
                      if(old == null || old.length() < 8) continue;
                      int min = Math.min(h.length(), old.length());
                      int max = Math.max(h.length(), old.length());

                      // V144: gyors mondatzárásnál a delta és a completed/flush sokszor átfedő blokkot ad.
                      // Nem hanghoz nyúlunk, csak az utolsó blokkokkal való szöveg-átfedést fogjuk meg.
                      if(min >= 10 && (h.contains(old) || old.contains(h)) && (min * 100 / Math.max(1, max)) >= 58) return true;

                      String[] b = old.split("\\s+");

                      // Az új blokk eleje sokszor az előző blokk vége. Ez tipikus duplázási minta.
                      if(a.length >= 2 && b.length >= 2) {
                          int maxN = Math.min(5, Math.min(a.length, b.length));
                          for(int n=maxN; n>=2; n--) {
                              boolean suffixPrefix = true;
                              for(int i=0; i<n; i++) {
                                  if(!b[b.length-n+i].equals(a[i])) { suffixPrefix = false; break; }
                              }
                              if(suffixPrefix) continue;

                              boolean prefixSuffix = true;
                              for(int i=0; i<n; i++) {
                                  if(!a[a.length-n+i].equals(b[i])) { prefixSuffix = false; break; }
                              }
                              if(prefixSuffix) return true;
                          }
                      }

                      if(a.length >= 3 && b.length >= 3) {
                          HashSet<String> sa = new HashSet<>(Arrays.asList(a));
                          HashSet<String> sb = new HashSet<>(Arrays.asList(b));
                          int common = 0;
                          for(String w : sa) if(sb.contains(w)) common++;
                          int small = Math.min(sa.size(), sb.size());
                          int large = Math.max(sa.size(), sb.size());
                          if(small >= 3 && common * 100 / Math.max(1, small) >= 80 && small * 100 / Math.max(1, large) >= 65) return true;
                      }
                  }
                  return false;
              }

              String normalizeLiveBlockHash(String block) {
                  if(block == null) return "";
                  return block.toLowerCase(Locale.ROOT)
                          .replaceAll("[\\p{Punct}\\s]+", " ")
                          .trim();
              }

              String popReadySpeechBlock(boolean flushAll) {
                  String s = liveTranscriptBuffer == null ? "" : liveTranscriptBuffer;
                  if(s.trim().length() == 0) { liveTranscriptBuffer = ""; return null; }

                  int cut = findLiveBlockCut(s, flushAll);
                  if(cut < 0) return null;

                  String out = s.substring(0, cut).trim();
                  liveTranscriptBuffer = s.substring(cut).trim();
                  liveBufferStartedAt = liveTranscriptBuffer.length() > 0 ? System.currentTimeMillis() : 0L;
                  return out;
              }

              int findLiveBlockCut(String s, boolean flushAll) {
                  if(s == null) return -1;
                  String t = s.trim();
                  if(t.length() == 0) return -1;

                  // V156: egyszerűsített, egyirányú blokkhatár-döntés.
                  // Delta közben csak biztos mondatvégnél vagy természetes hosszú vágásnál adunk ki.
                  // Completed/idle esetén viszont nincs nyelvtani várakoztatás: ami bent maradt,
                  // azt kiadjuk. A rövid puffer nem ragadhat bent és nem kell szótár hozzá.
                  int cut = firstHardSentenceEnd(s);
                  if(cut >= 0) return cut;

                  cut = smartLinguisticCut(s);
                  if(cut >= 0) return cut;

                  if(flushAll) return safeWholeBufferFlushCut(s);

                  return -1;
              }

              int safeWholeBufferFlushCut(String s) {
                  if(s == null) return -1;
                  String t = s.trim();
                  if(t.length() == 0) return -1;

                  int words = t.split("\\s+").length;
                  long sinceDelta = liveLastTranscriptDeltaAt > 0L ? System.currentTimeMillis() - liveLastTranscriptDeltaAt : 99999L;

                  // V156: 1-5 szavas puffer esetén nincs szótár, nincs nyelvtani kapu,
                  // nincs "hátha majd mondat lesz" várakozás. A meglévő completed/idle esemény
                  // kiadja, ami bent van. Ez javítja az igen/nem/működik jellegű beragadást.
                  if(words <= 5) return s.length();

                  // Hosszabb blokknál maradhat az utolsó friss token védelme, de csak itt.
                  // Így a fél szó elleni védelem nem fogja meg a rövid válaszokat.
                  if(sinceDelta <= 700 && hasPossiblyUnstableTrailingToken(t)) {
                      int cut2 = lastWhitespaceBeforeLastToken(s);
                      if(cut2 > 0) {
                          String prefix = s.substring(0, cut2).trim();
                          int prefixWords = prefix.length() == 0 ? 0 : prefix.split("\\s+").length;
                          if(prefixWords >= 3) return cut2;
                          return -1;
                      }
                  }
                  return s.length();
              }

              int lastWhitespaceBeforeLastToken(String s) {
                  if(s == null) return -1;
                  int end = s.length() - 1;
                  while(end >= 0 && Character.isWhitespace(s.charAt(end))) end--;
                  if(end < 0) return -1;
                  int i = end;
                  while(i >= 0 && !Character.isWhitespace(s.charAt(i))) i--;
                  return i >= 0 ? i + 1 : -1;
              }

              boolean hasPossiblyUnstableTrailingToken(String text) {
                  if(text == null) return false;
                  String t = text.trim();
                  if(t.length() == 0) return false;
                  char lastCh = t.charAt(t.length() - 1);
                  if(lastCh == '.' || lastCh == '!' || lastCh == '?' || lastCh == '…' || lastCh == ',' || lastCh == ';' || lastCh == ':') return false;
                  int sp = Math.max(Math.max(t.lastIndexOf(' '), t.lastIndexOf('\n')), t.lastIndexOf('\t'));
                  if(sp < 0) return false;
                  String last = t.substring(sp + 1).replaceAll("[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰàâçèéêëîïôùûüÿñæœßÀÂÇÈÉÊËÎÏÔÙÛÜŸÑÆŒ]", "");
                  if(last.length() == 0) return false;
                  if(last.length() <= 2) return true;
                  // A szóköz nélküli Realtime szófolytatások tipikusan rövid/közepes tokenként
                  // érkeznek. Nem nyelvi szótár, csak az utolsó, friss token védelme.
                  return last.length() <= 8;
              }

              boolean shouldFlushShortIdleBlock(String s) {
                  // V156: kompatibilitási segédfüggvény. A blokkzárás fő döntése már a
                  // findLiveBlockCut(flushAll) ágban történik, ezért itt nincs szótár és nincs
                  // nyelvtani visszatartás. Rövid puffer idle esetén kiadható.
                  if(s == null) return false;
                  String t = s.trim();
                  if(t.length() == 0) return false;
                  int words = t.split("\\s+").length;
                  long started = liveBufferStartedAt > 0L ? liveBufferStartedAt : firstSpeechHeardAt;
                  long age = started > 0L ? System.currentTimeMillis() - started : 0L;
                  return age >= 1000 && words <= 5;
              }

              boolean shouldForceFlushWholeBuffer(String s) {
                  // V156: nincs külön nyelvtani kapu. Completed/idle esetén a központi
                  // safeWholeBufferFlushCut dönt, ezért ez csak régi hívásokhoz marad egyszerűen.
                  return s != null && s.trim().length() > 0;
              }

              boolean looksLikeDanglingSpeechFragment(String text) {
                  if(text == null) return true;
                  String x = text.trim();
                  if(x.length() == 0) return true;
                  String l = x.toLowerCase(Locale.ROOT).replaceAll("\\s+", " ").trim();
                  if(l.endsWith(",") || l.endsWith(";") || l.endsWith(":")) return true;
                  String[] dangling = {
                      " a", " az", " egy", " hogy", " ha", " amikor", " akkor", " majd", " és", " vagy", " illetve", " de", " mert", " tehát", " szerint", " lehet", " kellene", " annak", " arra", " ezt", " azt", " ne", " be", " ki", " fel", " le",
                      " le", " la", " les", " de", " des", " du", " que", " qui", " qu", " si", " alors", " mais", " puis", " lorsque", " parce", " pour", " dans", " à", " au", " aux",
                      " the", " a", " an", " to", " of", " for", " and", " or", " but", " if", " when", " because", " with"
                  };
                  for(String d: dangling) if(l.endsWith(d)) return true;
                  String last = l;
                  int sp = l.lastIndexOf(' ');
                  if(sp >= 0) last = l.substring(sp + 1);
                  if(last.length() <= 2) return true;
                  return false;
              }

              int firstHardSentenceEnd(String s) {
                  for(int i=0;i<s.length();i++) {
                      char ch = s.charAt(i);
                      if(ch == '.' || ch == '!' || ch == '?' || ch == '…' || ch == '\n') return i + 1;
                  }
                  return -1;
              }

              int smartLinguisticCut(String s) {
                  int len = s.length();
                  if(len < 85) return -1;

                  String lower = s.toLowerCase(Locale.ROOT);
                  int preferredEnd = Math.min(len, 185);
                  int preferredStart = Math.min(len, 75);

                  // V56: V55 alap, de kevésbé engedékeny hosszú blokkoknál.
                  // Nem audio, nem VAD, nem időzítő. Csak a már beérkezett szöveg stabil elejét vágjuk le,
                  // hogy hosszú folyamatos beszédnél se legyen egyetlen óriás blokk.

                  // 1) Erős gondolatváltók. Itt az előző rész általában önállóan is érthető.
                  int cut = lastConnectorCut(lower, preferredStart, preferredEnd, new String[]{
                          ", de ", ", viszont ", ", hanem ", ", tehát ", ", ezért ",
                          ", aztán ", ", majd ", ", utána ", "; ", ": ", " - "
                  });
                  if(cut > 0) return cut;

                  // 2) Feltételes / következő gondolat kezdete. V52-höz képest kicsit bátrabb,
                  // mert a beszélt nyelvben sokszor nincs pont, csak új gondolat kezdődik.
                  cut = lastConnectorCut(lower, 90, preferredEnd, new String[]{
                          ", és akkor ", ", akkor ", ", hogyha ", ", ha ", ", amikor ",
                          ", ahol ", ", amíg ", ", miközben ", ", vagy ", ", illetve "
                  });
                  if(cut > 0) return cut;

                  // 3) Felsorolás vagy hosszú mellékmondat. Vágás vessző után, de csak akkor,
                  // ha már van érdemi hosszúságú, önmagában is olvasható blokk.
                  cut = lastCommaCut(s, 90, Math.min(len, 175));
                  if(cut > 0) return cut;

                  // 4) Ha nincs vessző, de már hosszú a blokk, természetes kötőszavaknál is vágunk.
                  // Ez javítja a hosszú folyamatos monológokat, de továbbra sem időalapú.
                  cut = lastSoftWordCut(lower, 110, Math.min(len, 185), new String[]{
                          " de ", " viszont ", " akkor ", " utána ", " majd ",
                          " és akkor ", " hogyha ", " ha ", " amikor ", " illetve ",
                          " mindenhol ", " szinte ", " na most ", " pedig "
                  });
                  if(cut > 0) return cut;

                  // 5) Stabil prefix vágás: ha a beszéd hosszúra nő és nincs biztos írásjel,
                  // a puffer elejét lezárjuk szóhatáron. A maradék a pufferben marad tovább épülni.
                  // Ez szöveg-alapú biztonsági szelep, nem másodperc- vagy szünetalapú döntés.
                  if(len >= 190) {
                      int spc = s.lastIndexOf(' ', Math.min(len, 170));
                      if(spc >= 115) return spc + 1;
                  }

                  return -1;
              }

              int lastConnectorCut(String lower, int minPos, int maxPos, String[] connectors) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String sep: connectors) {
                      int pos = lower.lastIndexOf(sep, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1; // a vessző/írásjel az előző blokk végén marad
              }

              int lastCommaCut(String s, int minPos, int maxPos) {
                  int end = Math.min(s.length(), maxPos);
                  int pos = s.lastIndexOf(',', end);
                  if(pos >= minPos) return pos + 1;
                  return -1;
              }

              int lastSoftWordCut(String lower, int minPos, int maxPos, String[] words) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String w: words) {
                      int pos = lower.lastIndexOf(w, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1;
              }

              void setDetectedSourceSide(boolean sourceIsTop) {
                  topActive = sourceIsTop;
                  manualTopSource = sourceIsTop;
                  updateButtons();
              }

              String cleanTranscriptForSelectedPair(String text) {
                  if(text == null) return "";
                  // V74: ez továbbra sem saját nagy nyelvfelismerő. Csak biztonsági tisztítás:
                  // idegen írásrendszeres STT-szemét nem kerülhet ki az ablakokba vagy fordításba.
                  String x = text.replaceAll("[^A-Za-z0-9\\u00C0-\\u024F\\p{Punct}\\s]", " ");
                  return x.replaceAll("\\s+", " ").trim();
              }

              boolean selectedContains(String langCode) {
                  String lc = langCode == null ? "" : langCode.toLowerCase(Locale.ROOT);
                  return code(topLang).equalsIgnoreCase(lc) || code(bottomLang).equalsIgnoreCase(lc);
              }

              boolean looksLikeObviousThirdLanguageNoise(String text) {
                  if(text == null) return false;
                  String x = text.toLowerCase(Locale.ROOT).replaceAll("[^a-záéíóöőúüűàâçèéêëîïôùûüÿñæœß\\s]", " ");
                  x = " " + x.replaceAll("\\s+", " ").trim() + " ";
                  // Csak nagyon tipikus, korábbi tesztekben is látott hamis kezdéseket fogunk meg.
                  // Nem általános szótárazás, nem új nyelvdetektor.
                  if(!selectedContains("nl") && (x.contains(" microfoon") || x.contains(" microfoonprobe") || x.contains(" foneprover"))) return true;
                  if(!selectedContains("en") && (x.contains(" that s ") || x.contains(" that's ") || x.contains(" like it was ") || x.contains(" like it "))) return true;
                  if(!selectedContains("de") && (x.contains(" danke ") || x.contains(" bitte ") || x.contains(" nicht "))) return true;
                  if(!selectedContains("tr") && (x.contains(" kazan ") || x.contains(" büyük ") || x.contains(" odul ") || x.contains(" ödül ") || x.contains(" ütü ") || x.contains(" her zaman "))) return true;
                  return false;
              }

              boolean isSelectedSourceLang(String sourceLang) {
                  if(sourceLang == null) return false;
                  String s = sourceLang.trim().toLowerCase(Locale.ROOT);
                  String top = code(topLang).toLowerCase(Locale.ROOT);
                  String bottom = code(bottomLang).toLowerCase(Locale.ROOT);
                  return s.equals(top) || s.equals(bottom);
              }

              boolean isStrictValidTriple(String[] trp) {
                  if(trp == null || trp.length < 3) return false;
                  if(!isSelectedSourceLang(trp[0])) return false;
                  String original = trp[1] == null ? "" : cleanTranscriptForSelectedPair(trp[1]).trim();
                  String translation = trp[2] == null ? "" : cleanTranscriptForSelectedPair(cleanOneBlockTranslation(trp[2])).trim();
                  return original.length() > 0 && translation.length() > 0;
              }

              boolean sourceIsTopFromAi(String sourceLang, boolean fallback) {
                  if(sourceLang == null) return fallback;
                  String s = sourceLang.trim().toUpperCase(Locale.ROOT);
                  String top = code(topLang).toUpperCase(Locale.ROOT);
                  String bottom = code(bottomLang).toUpperCase(Locale.ROOT);
                  if(s.equals(top) || s.contains("SOURCE_LANG: " + top) || s.contains("LANG: " + top)) return true;
                  if(s.equals(bottom) || s.contains("SOURCE_LANG: " + bottom) || s.contains("LANG: " + bottom)) return false;
                  return fallback;
              }

              int addSourceOnlyBlock(boolean sourceIsTop, String original) {
                  // V151: végső, nagyon óvatos UI-szintű duplázásvédelem.
                  // Nem nyúl a blokkdaraboláshoz és nem épít új logikát; csak azt akadályozza meg,
                  // hogy ugyanaz a kész mondat egymás után kétszer bekerüljön az ablakba.
                  if(isRecentlyDisplayedSourceDuplicate(sourceIsTop, original)) return -1;

                  TextBlock b = new TextBlock();
                  b.sourceTop = sourceIsTop;
                  b.translatedOk = false;
                  if(sourceIsTop) b.topText = original;
                  else b.bottomText = original;
                  textBlocks.add(b);
                  renderBlocksKeepView();
                  return textBlocks.size() - 1;
              }

              boolean isRecentlyDisplayedSourceDuplicate(boolean sourceIsTop, String original) {
                  if(original == null) return true;
                  String h = normalizeLiveBlockHash(original);
                  if(h.length() < 8) return false;

                  int checked = 0;
                  for(int i=textBlocks.size()-1; i>=0 && checked<5; i--) {
                      TextBlock b = textBlocks.get(i);
                      if(b == null || b.sourceTop != sourceIsTop) continue;
                      checked++;
                      String oldText = sourceIsTop ? b.topText : b.bottomText;
                      String oh = normalizeLiveBlockHash(oldText);
                      if(oh.length() < 8) continue;
                      if(h.equals(oh)) return true;

                      int min = Math.min(h.length(), oh.length());
                      int max = Math.max(h.length(), oh.length());
                      // V151: csak majdnem teljes azonosságot fogunk meg.
                      // A hasonló, de eltérő blokk ne essen ki, mert az beszédvesztéshez vezetett.
                      if(min >= 24 && (h.contains(oh) || oh.contains(h)) && (min * 100 / Math.max(1, max)) >= 92) return true;
                  }
                  return false;
              }

              void processNextLiveTranslation() {
                  // V49: a live fordítást nem szabad a globális responseInProgress flag miatt megállítani.
                  // A Realtime transcription közben nem fordítási válasz, ezért ez a flag itt könnyen beragadhat.
                  // Élő beszédnél csak a saját liveTranslateMode zárja ki a párhuzamos blokkfordítást.
                  if(liveTranslateMode) return;
                  if(ws == null || !connected) return;
                  responseInProgress = false;
                  Integer idObj = liveTranslateQueue.poll();
                  if(idObj == null) return;
                  int id = idObj.intValue();
                  if(id < 0 || id >= textBlocks.size()) { processNextLiveTranslation(); return; }
                  TextBlock b = textBlocks.get(id);
                  boolean sourceIsTop = b.sourceTop;
                  String src = sourceIsTop ? b.topText : b.bottomText;
                  if(src == null || src.trim().length() == 0) { processNextLiveTranslation(); return; }

                  try {
                      pendingLiveBlockId = id;
                      liveTranslateMode = true;

                      JSONObject msg = new JSONObject();
                      msg.put("type", "conversation.item.create");
                      JSONObject item = new JSONObject();
                      item.put("type", "message");
                      item.put("role", "user");
                      JSONArray content = new JSONArray();
                      JSONObject c = new JSONObject();
                      c.put("type", "input_text");
                      String topCode = code(topLang);
                      String bottomCode = code(bottomLang);
                      c.put("text", "LIVE_PAIR_CLASSIFY_AND_TRANSLATE\nSELECTED_TOP_LANG: " + topCode + "\nSELECTED_BOTTOM_LANG: " + bottomCode + "\nTEXT:\n" + src.trim());
                      content.put(c);
                      item.put("content", content);
                      msg.put("item", item);
                      ws.send(msg.toString());

                      JSONObject resp = new JSONObject();
                      resp.put("type", "response.create");
                      JSONObject response = new JSONObject();
                      response.put("instructions", liveBlockInstructions(sourceIsTop));
                      resp.put("response", response);
                      responseInProgress = true;
                      ws.send(resp.toString());
                  } catch(Exception e) {
                      liveTranslateMode = false;
                      pendingLiveBlockId = -1;
                  }
              }

              void applyLiveTranslation(String out) {
                  int id = pendingLiveBlockId;
                  String speakText = null;
                  String speakLang = null;
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      ArrayList<String[]> triples = parseTriples(out);
                      String[] trp = null;
                      for(String[] cand: triples) {
                          if(isStrictValidTriple(cand)) { trp = cand; break; }
                      }
                      if(trp != null) {
                          String sourceLang = trp[0].trim().toUpperCase(Locale.ROOT);
                          String original = cleanTranscriptForSelectedPair(trp[1].trim());
                          String translation = cleanTranscriptForSelectedPair(cleanOneBlockTranslation(trp[2]));
                          boolean sourceIsTop = sourceIsTopFromAi(sourceLang, b.sourceTop);

                          b.sourceTop = sourceIsTop;
                          if(sourceIsTop) {
                              b.topText = original;
                              b.bottomText = translation;
                              speakText = translation;
                              speakLang = bottomLang;
                          } else {
                              b.bottomText = original;
                              b.topText = translation;
                              speakText = translation;
                              speakLang = topLang;
                          }
                          b.translatedOk = true;
                          b.retryCount = 0;
                          setDetectedSourceSide(sourceIsTop);
                      } else {
                          // V74: live módban nincs laza fallback. Ha a modell nem ad szabályos,
                          // kiválasztott nyelvpárba illeszkedő választ, a blokk marad újrafordítható.
                          b.translatedOk = false;
                          b.retryCount++;
                      }
                      renderBlocksKeepView();
                      enqueueSpeak(speakText, speakLang);
                  }
                  pendingLiveBlockId = -1;
                  liveTranslateMode = false;
                  // V55: nem indítjuk azonnal a következő live fordítást itt.
                  // Megvárjuk a response.done eseményt, mert a text.done után
                  // a szerver oldalon még lehet aktív válasz, és a következő
                  // response.create különben megakaszthatja a sort.
              }

              void routeAiOutput(String out) {
                  if(clipboardResponseMode) {
                      clipboardResponseMode = false;
                      applyClipboardTranslation(out);
                      return;
                  }

                  if(manualResponseMode) {
                      manualResponseMode = false;
                      applyManualFullWindowTranslation(out);
                      return;
                  }

                  if(liveTranslateMode || pendingLiveBlockId >= 0) {
                      applyLiveTranslation(out);
                      return;
                  }

                  ArrayList<String[]> triples = parseTriples(out);
                  if(!triples.isEmpty()) {
                      boolean any = false;
                      for(String[] trp: triples) {
                          if(!isStrictValidTriple(trp)) continue;
                          String sourceLang = trp[0].trim().toUpperCase(Locale.ROOT);
                          String original = cleanTranscriptForSelectedPair(trp[1]);
                          String translation = cleanTranscriptForSelectedPair(trp[2]);
                          boolean sourceIsTop = sourceIsTopFromAi(sourceLang, manualTopSource);
                          addBlock(sourceIsTop, original, translation);
                          enqueueSpeak(translation, sourceIsTop ? bottomLang : topLang);
                          any = true;
                      }
                      if(any) return;
                  }

                  // V74: nincs laza fallback új blokkra. Címke nélküli vagy rossz nyelvű válasz
                  // nem kerülhet be, mert ez hozta vissza korábban a káoszt.
                  Toast.makeText(this, "Nem szabályos AI-válasz érkezett, a blokk újrafordítható.", Toast.LENGTH_SHORT).show();
              }

              boolean isCleanManualTranslation(String tr) {
                  if(tr == null) return false;
                  String t = tr.trim();
                  if(t.length() == 0) return false;
                  String low = t.toLowerCase(Locale.ROOT);
                  if(low.contains("source_lang") || low.contains("target_lang") || low.contains("original") || low.contains("translation:")) return false;
                  if(low.contains("error") || low.contains("hiba") || low.contains("cannot translate") || low.contains("nem tudom lefordítani")) return false;
                  // Ha az UFO-szűrés mindent kiszedett, ne számítson kész fordításnak.
                  return cleanTranscriptForSelectedPair(t).trim().length() > 0;
              }

              void applyManualFullWindowTranslation(String out) {
                  try {
                      String tr = cleanOneBlockTranslation(out);
                      if(!isCleanManualTranslation(tr)) {
                          Toast.makeText(this, "Nem tiszta fordítás érkezett. Nyomd meg újra a FORDÍT gombot.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      programmaticChange = true;
                      try {
                          if(manualTopSource) bottomBox.setText(tr);
                          else topBox.setText(tr);
                      } finally {
                          programmaticChange = false;
                      }

                      rebuildBlocksFromCurrentBoxes();
                      renderBlocksKeepView();
                      enqueueSpeak(tr, manualTopSource ? bottomLang : topLang);
                      Toast.makeText(this, "Teljes ablak újrafordítva.", Toast.LENGTH_SHORT).show();
                  } catch(Exception e) {
                      Toast.makeText(this, "Kézi fordítás feldolgozási hiba. Próbáld újra.", Toast.LENGTH_LONG).show();
                  }
              }

              void rebuildBlocksFromCurrentBoxes() {
                  TextBlock b = new TextBlock();
                  b.topText = topBox.getText().toString().trim();
                  b.bottomText = bottomBox.getText().toString().trim();
                  b.sourceTop = manualTopSource;
                  b.translatedOk = true;
                  b.retryCount = 0;
                  textBlocks.clear();
                  textBlocks.add(b);
              }

              String cleanOneBlockTranslation(String out) {
                  if(out == null) return "";
                  String s = out.trim();
                  if(s.startsWith("```")) s = s.replace("```", "").trim();

                  String upper = s.toUpperCase(Locale.ROOT);
                  int trPos = upper.lastIndexOf("TRANSLATION:");
                  if(trPos >= 0) {
                      s = s.substring(trPos + "TRANSLATION:".length()).trim();
                  }
                  if(s.toUpperCase(Locale.ROOT).startsWith("FORDÍTÁS:")) s = s.substring("FORDÍTÁS:".length()).trim();

                  // Biztonsági tisztítás: ha a modell mégis címkéket adott vissza,
                  // ne írjuk be őket a fordítási ablakba.
                  StringBuilder clean = new StringBuilder();
                  String[] lines = s.split("\n");
                  for(String line: lines) {
                      String t = line.trim();
                      String u = t.toUpperCase(Locale.ROOT);
                      if(u.startsWith("SOURCE_LANG:") || u.startsWith("TARGET_LANG:") ||
                         u.startsWith("ORIGINAL:") || u.equals("TEXT:") || u.startsWith("TEXT:")) {
                          continue;
                      }
                      if(clean.length() > 0) clean.append("\n");
                      clean.append(line);
                  }
                  return cleanTranscriptForSelectedPair(clean.toString().trim());
              }

              ArrayList<String[]> parseTriples(String out) {
                  ArrayList<String[]> list = new ArrayList<>();
                  if(out == null) return list;
                  String marker = "SOURCE_LANG:";
                  int pos = 0;
                  while(true) {
                      int start = out.indexOf(marker, pos);
                      if(start < 0) break;
                      int next = out.indexOf(marker, start + marker.length());
                      String part = next >= 0 ? out.substring(start, next) : out.substring(start);
                      String sourceLang = extractAfter(part, "SOURCE_LANG:");
                      String original = extractAfter(part, "ORIGINAL:");
                      String translation = extractAfter(part, "TRANSLATION:");
                      if(original.length() > 0 || translation.length() > 0) {
                          list.add(new String[]{sourceLang, original, translation});
                      }
                      if(next < 0) break;
                      pos = next;
                  }
                  return list;
              }

              String extractAfter(String out, String key) {
                  int i = out.indexOf(key);
                  if(i < 0) return "";
                  int start = i + key.length();
                  int end = out.length();
                  String[] keys = {"SOURCE_LANG:", "ORIGINAL:", "TRANSLATION:"};
                  for(String k: keys) {
                      int n = out.indexOf(k, start);
                      if(n >= 0) end = Math.min(end, n);
                  }
                  return out.substring(start, end).trim();
              }

              void appendTo(EditText target, String s) {
                  if(s == null || s.length() == 0) return;
                  programmaticChange = true;
                  try {
                      String old = target.getText().toString();
                      if(old.length() > 0 && !old.endsWith("\n")) target.append("\n");
                      target.append(s);
                      target.setSelection(target.getText().length());
                  } finally {
                      programmaticChange = false;
                  }
              }

              void appendDelta(String s) {
                  EditText target = topActive ? bottomBox : topBox;
                  appendTo(target, s);
              }

              void append(String s) {
                  EditText target = topActive ? bottomBox : topBox;
                  appendTo(target, s);
              }

