                  if(!"minimal".equals(delayMode) && !"low".equals(delayMode) && !"medium".equals(delayMode) && !"high".equals(delayMode) && !"xhigh".equals(delayMode)) delayMode = "low";
                  vadEngineMode = sp.getString("vadEngineMode", "silero");
                  // V40.21: csak Silero NORMAL vagy kézzel választott AGGRESSIVE maradhat.
                  if(!"silero".equals(vadEngineMode) && !"silero_medium".equals(vadEngineMode)) vadEngineMode = "silero";
                  // A bemeneti forrás nem választható: mindig a telefon mikrofonja + VOICE_RECOGNITION/MIC.
                  audioSourceMode = "recognition";
                  interpreterMode = sp.getBoolean("interpreterMode", false);
                  String storedInterpreterMode = sp.getString("interpreterAudioMode", interpreterMode ? "auto" : "off");
                  interpreterMode = interpreterMode && !"off".equals(storedInterpreterMode);
                  interpreterAudioMode = interpreterMode ? "auto" : "off";
                  lastInterpreterAudioMode = "auto";
                  interpreterSpeechOutputEnabled = sp.getBoolean("interpreterSpeechOutputEnabled", true);
                  mirrorBottomMode = sp.getBoolean("mirrorBottomMode", false);
                  floatingTranslatorEnabled = sp.getBoolean("floatingTranslatorEnabled", false);
                  micLifeSignalMinutes = sp.getInt("micLifeSignalMinutes", 2);
                  if(micLifeSignalMinutes != 0 && micLifeSignalMinutes != 2 && micLifeSignalMinutes != 5 && micLifeSignalMinutes != 10 && micLifeSignalMinutes != 20 && micLifeSignalMinutes != 30) micLifeSignalMinutes = 0;
                  floatingButtonX = sp.getInt("floatingButtonX", 24);
