name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/attila/forditokonzol app/src/main/res/values
          cat > settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ForditoKonzol"
          include(":app")
          EOT
          cat > build.gradle.kts <<'EOT'
          plugins { id("com.android.application") version "8.6.1" apply false }
          EOT
          cat > app/build.gradle.kts <<'EOT'
          plugins { id("com.android.application") }
          android { namespace="com.attila.forditokonzol"; compileSdk=35
              defaultConfig { applicationId="com.attila.forditokonzol"; minSdk=26; targetSdk=35; versionCode=7; versionName="0.7" }
          }
          dependencies { implementation("com.squareup.okhttp3:okhttp:4.12.0"); implementation("org.json:json:20240303") }
          EOT
          cat > app/src/main/res/values/styles.xml <<'EOT'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:navigationBarColor">#101318</item><item name="android:statusBarColor">#101318</item><item name="android:windowBackground">#101318</item><item name="android:windowNoTitle">true</item></style></resources>
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="false" android:label="Fordító Konzol" android:supportsRtl="true" android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOT
          cat > app/src/main/java/com/attila/forditokonzol/MainActivity.java <<'EOT'
          package com.attila.forditokonzol;
          import android.Manifest;import android.app.*;import android.content.*;import android.content.pm.PackageManager;import android.graphics.Color;import android.media.*;import android.os.*;import android.util.Base64;import android.view.Gravity;import android.widget.*;import org.json.*;import java.util.*;import java.util.concurrent.*;import okhttp3.*;
          public class MainActivity extends Activity{
            TextView state; EditText top,bottom; Button mic,trans,menu,lt,lb; SharedPreferences sp; OkHttpClient client; WebSocket ws; AudioRecord rec; ExecutorService audio=Executors.newSingleThreadExecutor(); boolean streaming=false,connected=false,topActive=true; long sessionStart=0; String key="",model="gpt-realtime-2",profile="truck_bulk",topLang="hu",bottomLang="fr"; int silence=900;
            String[][] langs={{"Automatikus","AUTO",""},{"Magyar","HU","hu"},{"Francia","FR","fr"},{"Angol","EN","en"},{"Német","DE","de"},{"Olasz","IT","it"},{"Spanyol","ES","es"},{"Román","RO","ro"},{"Horvát","HR","hr"},{"Szlovák","SK","sk"},{"Szlovén","SL","sl"}};
            String[][] models={{"Ajánlott: GPT-Realtime-2","gpt-realtime-2"},{"Fordítás: GPT-Realtime-Translate","gpt-realtime-translate"},{"Átirat: GPT-Realtime-Whisper","gpt-realtime-whisper"}};
            String[][] profiles={{"Általános","general"},{"Turizmus","tourism"},{"Étterem","restaurant"},{"Szállás","hotel"},{"Kamion általános","truck_general"},{"Kamion ponyvás","truck_tarp"},{"Kamion ömlesztett","truck_bulk"},{"Kamion tartány","truck_tank"},{"Logisztika/rakodás","logistics"},{"Vám/határ","customs"},{"Orvos","medical"},{"Gyógyszertár","pharmacy"},{"Bank","bank"},{"Hivatal","office"},{"Rendőrség","police"},{"Szerviz","service"}};
            public void onCreate(Bundle b){super.onCreate(b);sp=getSharedPreferences("settings",0);load();ui();reqMic();}
            void load(){key=sp.getString("key","");model=sp.getString("model","gpt-realtime-2");profile=sp.getString("profile","truck_bulk");topLang=sp.getString("topLang","hu");bottomLang=sp.getString("bottomLang","fr");silence=sp.getInt("silence",900);} void save(){sp.edit().putString("key",key).putString("model",model).putString("profile",profile).putString("topLang",topLang).putString("bottomLang",bottomLang).putInt("silence",silence).apply();}
            void ui(){LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(12,34,12,110);root.setBackgroundColor(Color.rgb(16,19,24));setContentView(root);LinearLayout bar=row();TextView title=tv("Fordító Konzol v0.7 Realtime");state=tv("készenlét");state.setGravity(Gravity.RIGHT);bar.addView(title,new LinearLayout.LayoutParams(0,42,1));bar.addView(state,new LinearLayout.LayoutParams(0,42,1));root.addView(bar);LinearLayout r=row();mic=btn("MIKROFON");trans=btn("FORDÍT");menu=btn("MENÜ");r.addView(mic,new LinearLayout.LayoutParams(0,64,1));r.addView(trans,new LinearLayout.LayoutParams(0,64,1));r.addView(menu,new LinearLayout.LayoutParams(0,64,1));root.addView(r);LinearLayout lr=row();lt=btn("FELSŐ");lb=btn("ALSÓ");lr.addView(lt,new LinearLayout.LayoutParams(0,64,1));lr.addView(lb,new LinearLayout.LayoutParams(0,64,1));root.addView(lr);top=box("FELSŐ ABLAK");bottom=box("ALSÓ ABLAK");root.addView(top,new LinearLayout.LayoutParams(-1,0,1));root.addView(bottom,new LinearLayout.LayoutParams(-1,0,1));top.setOnClickListener(v->{topActive=true;upd();});bottom.setOnClickListener(v->{topActive=false;upd();});mic.setOnClickListener(v->{if(streaming)stop();else start();});trans.setOnClickListener(v->manualResponse());menu.setOnClickListener(v->showMenu());lt.setOnClickListener(v->chooseLang(true));lb.setOnClickListener(v->chooseLang(false));mic.setOnLongClickListener(v->{chooseSilence();return true;});upd();}
            TextView tv(String s){TextView t=new TextView(this);t.setText(s);t.setTextColor(Color.LTGRAY);t.setTextSize(13);return t;} LinearLayout row(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.HORIZONTAL);return l;} Button btn(String s){Button b=new Button(this);b.setText(s);b.setTextColor(Color.WHITE);b.setAllCaps(false);b.setTextSize(15);return b;} EditText box(String h){EditText e=new EditText(this);e.setHint(h);e.setHintTextColor(Color.GRAY);e.setTextColor(Color.WHITE);e.setTextSize(16);e.setGravity(Gravity.TOP|Gravity.START);e.setSingleLine(false);e.setMinLines(5);e.setBackgroundColor(Color.rgb(27,32,41));e.setPadding(14,14,14,14);return e;}
            void reqMic(){if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},1001);} boolean hasKey(){return key!=null&&key.trim().startsWith("sk-");}
            void start(){if(!hasKey()){apiDialog();return;} if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED){reqMic();return;} if(sessionStart==0)sessionStart=System.currentTimeMillis(); if(System.currentTimeMillis()-sessionStart>20L*60L*1000L){confirm();return;} state.setText("kapcsolódás");client=new OkHttpClient.Builder().readTimeout(0,TimeUnit.MILLISECONDS).build();Request req=new Request.Builder().url("wss://api.openai.com/v1/realtime?model="+model).addHeader("Authorization","Bearer "+key.trim()).addHeader("OpenAI-Beta","realtime=v1").build();ws=client.newWebSocket(req,new WebSocketListener(){public void onOpen(WebSocket w,Response r){connected=true;runOnUiThread(()->{sessionUpdate();audioLoop();upd();});}public void onMessage(WebSocket w,String s){event(s);}public void onFailure(WebSocket w,Throwable t,Response r){runOnUiThread(()->{append("\n[kapcsolat hiba] "+t.getMessage());stop();});}public void onClosed(WebSocket w,int c,String rs){connected=false;runOnUiThread(()->{state.setText("lezárva");upd();});}});}
            void sessionUpdate(){try{JSONObject session=new JSONObject();session.put("instructions",instructions());session.put("modalities",new JSONArray().put("text"));session.put("input_audio_format","pcm16");JSONObject vad=new JSONObject();vad.put("type","server_vad");vad.put("silence_duration_ms",silence);vad.put("prefix_padding_ms",300);vad.put("threshold",0.5);session.put("turn_detection",vad);JSONObject e=new JSONObject();e.put("type","session.update");e.put("session",session);ws.send(e.toString());}catch(Exception ex){append("\n[session hiba] "+ex.getMessage());}}
            String instructions(){String src=topActive?code(topLang):code(bottomLang), tgt=topActive?code(bottomLang):code(topLang);return "Te élő tolmács vagy. Csak kijelzőre írható szöveget adj, hangos választ ne. Forrásnyelv: "+src+". Célnyelv: "+tgt+". Ha AUTO, ismerd fel. Profil: "+profilePrompt()+" Szűrd a háttérzajt és a mondatba nem illő bekiabálásokat. Ne magyarázz. A cél természetes, pontos fordítás.";}
            void audioLoop(){int sr=24000;int min=AudioRecord.getMinBufferSize(sr,AudioFormat.CHANNEL_IN_MONO,AudioFormat.ENCODING_PCM_16BIT);int bs=Math.max(min,4096);rec=new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION,sr,AudioFormat.CHANNEL_IN_MONO,AudioFormat.ENCODING_PCM_16BIT,bs);streaming=true;rec.startRecording();state.setText("realtime aktív");audio.submit(()->{byte[] buf=new byte[bs];while(streaming&&rec!=null&&connected&&ws!=null){int n=rec.read(buf,0,buf.length);if(n>0){try{JSONObject e=new JSONObject();e.put("type","input_audio_buffer.append");e.put("audio",Base64.encodeToString(Arrays.copyOf(buf,n),Base64.NO_WRAP));ws.send(e.toString());}catch(Exception ignored){}}}});}
            void stop(){streaming=false;connected=false;try{if(rec!=null){rec.stop();rec.release();}}catch(Exception ignored){}rec=null;try{if(ws!=null)ws.close(1000,"stop");}catch(Exception ignored){}ws=null;state.setText("készenlét");upd();}
            void event(String s){try{JSONObject o=new JSONObject(s);String type=o.optString("type","");if(type.contains("response.text.delta")||type.contains("response.output_text.delta")){String d=o.optString("delta","");if(!d.isEmpty())runOnUiThread(()->append(d));} if(type.contains("conversation.item.input_audio_transcription.completed")){String tr=o.optString("transcript","");if(!tr.isEmpty())runOnUiThread(()->append("\n[átirat] "+tr));} if(type.contains("error"))runOnUiThread(()->append("\n[hiba] "+o.toString()));}catch(Exception ex){runOnUiThread(()->append("\n[event hiba] "+ex.getMessage()));}}
            void manualResponse(){if(ws==null||!connected){Toast.makeText(this,"Előbb indítsd a mikrofont.",Toast.LENGTH_LONG).show();return;}try{JSONObject e=new JSONObject();e.put("type","response.create");JSONObject r=new JSONObject();r.put("modalities",new JSONArray().put("text"));r.put("instructions","Az eddig hallottakból adj tiszta fordítást. Ne magyarázz.");e.put("response",r);ws.send(e.toString());}catch(Exception ex){append("\n[fordítás hiba] "+ex.getMessage());}}
            void append(String s){EditText t=topActive?top:bottom;t.append(s);t.setSelection(t.length());}
            void confirm(){new AlertDialog.Builder(this).setTitle("Folyik még?").setMessage("20 perce aktív.").setPositiveButton("Igen",(d,w)->{sessionStart=System.currentTimeMillis();start();}).setNegativeButton("Leállítás",(d,w)->{sessionStart=0;stop();}).show();new Handler().postDelayed(()->{if(!streaming&&sessionStart!=0&&System.currentTimeMillis()-sessionStart>20L*60L*1000L){sessionStart=0;stop();}},10000);}
            void showMenu(){String[] it={"OpenAI API kulcs","AI modell: "+modelLabel(),"Beszélgetési profil: "+profileLabel(),"Csendhatár: "+silence+" ms","Felső törlése","Alsó törlése","Mindkettő törlése"};new AlertDialog.Builder(this).setTitle("Menü").setItems(it,(d,w)->{if(w==0)apiDialog();if(w==1)chooseModel();if(w==2)chooseProfile();if(w==3)chooseSilence();if(w==4)top.setText("");if(w==5)bottom.setText("");if(w==6){top.setText("");bottom.setText("");}upd();}).show();}
            void apiDialog(){EditText in=new EditText(this);in.setSingleLine(true);in.setText(key);in.setHint("sk-...");new AlertDialog.Builder(this).setTitle("OpenAI API kulcs").setView(in).setPositiveButton("Mentés",(d,w)->{key=in.getText().toString().trim();save();upd();}).setNegativeButton("Mégse",null).show();}
            void chooseModel(){String[] l=new String[models.length];for(int i=0;i<models.length;i++)l[i]=models[i][0]+(models[i][1].equals(model)?" ✓":"");new AlertDialog.Builder(this).setTitle("AI modell").setItems(l,(d,w)->{model=models[w][1];save();if(streaming){stop();new Handler().postDelayed(()->start(),600);}upd();}).show();}
            void chooseProfile(){String[] l=new String[profiles.length];for(int i=0;i<profiles.length;i++)l[i]=profiles[i][0]+(profiles[i][1].equals(profile)?" ✓":"");new AlertDialog.Builder(this).setTitle("Beszélgetési profil").setItems(l,(d,w)->{profile=profiles[w][1];save();if(ws!=null&&connected)sessionUpdate();upd();}).show();}
            void chooseSilence(){String[] l={"500","700","900","1200","1500","2000"};int[] v={500,700,900,1200,1500,2000};new AlertDialog.Builder(this).setTitle("Csendhatár ms").setItems(l,(d,w)->{silence=v[w];save();if(ws!=null&&connected)sessionUpdate();upd();}).show();}
            void chooseLang(boolean topb){String[] l=new String[langs.length];for(int i=0;i<langs.length;i++)l[i]=langs[i][0]+" ("+langs[i][1]+")";new AlertDialog.Builder(this).setTitle(topb?"Felső nyelv":"Alsó nyelv").setItems(l,(d,w)->{if(topb){topLang=langs[w][2];topActive=true;}else{bottomLang=langs[w][2];topActive=false;}save();if(ws!=null&&connected)sessionUpdate();upd();}).show();}
            String profilePrompt(){if(profile.equals("truck_bulk"))return "két kamionsofőr beszélget ömlesztett áruszállításról, silóról, rakodásról, mérlegről, telephelyről és logisztikáról.";if(profile.equals("truck_tarp"))return "kamionos ponyvás fuvarozás, rakodás, ponyva, heveder, raklap, CMR, telephely.";if(profile.equals("truck_general"))return "kamionos munka, fuvarozás, rakodás, útvonal, diszpécser, telephely.";if(profile.equals("medical"))return "orvos-beteg beszélgetés.";if(profile.equals("restaurant"))return "étterem, rendelés, ételek, italok, fizetés.";if(profile.equals("tourism"))return "turizmus, utazás, útbaigazítás.";if(profile.equals("hotel"))return "szállás, foglalás, érkezés, távozás.";if(profile.equals("bank"))return "banki ügyintézés.";if(profile.equals("office"))return "hivatali ügyintézés.";if(profile.equals("customs"))return "vám, határ, okmányok, fuvar.";if(profile.equals("service"))return "autószerviz vagy gépjavítás.";if(profile.equals("pharmacy"))return "gyógyszertár.";return "általános beszélgetés.";}
            String modelLabel(){for(String[] m:models)if(m[1].equals(model))return m[0];return model;}String profileLabel(){for(String[] p:profiles)if(p[1].equals(profile))return p[0];return profile;}String code(String c){if(c==null||c.isEmpty())return "AUTO";for(String[] l:langs)if(l[2].equals(c))return l[1];return c.toUpperCase(Locale.ROOT);}void upd(){mic.setText(streaming?"STOP":"MIKROFON");mic.setBackgroundColor(streaming?Color.rgb(30,130,70):Color.rgb(90,50,50));menu.setBackgroundColor(hasKey()?Color.rgb(55,60,70):Color.rgb(140,80,30));trans.setBackgroundColor(Color.rgb(55,60,70));lt.setText("FELSŐ: "+code(topLang));lb.setText("ALSÓ: "+code(bottomLang));lt.setBackgroundColor(topActive?Color.rgb(60,95,150):Color.rgb(55,60,70));lb.setBackgroundColor(!topActive?Color.rgb(60,95,150):Color.rgb(55,60,70));}
            public void onPause(){super.onPause();if(streaming)stop();} public void onDestroy(){if(streaming)stop();audio.shutdownNow();super.onDestroy();}
          }
          EOT
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Find APK
        run: |
          mkdir -p artifact
          cp $(find app/build/outputs -name "*.apk" -type f | head -n 1) artifact/ForditoKonzol-Realtime-v08.apk
          ls -lah artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForditoKonzol-Realtime-v08-apk
          path: artifact/*.apk
          if-no-files-found: error
