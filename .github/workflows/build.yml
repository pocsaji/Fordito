                      if(lang.equals(apiCode(topLang))) return true;
                      if(lang.equals(apiCode(bottomLang))) return false;
                  }
                  return topActive;
              }

              String guessClipboardSelectedLanguage(String s) {
                  String t = s == null ? "" : s.toLowerCase(Locale.ROOT).replaceAll("\\s+", " ").trim();
                  if(t.length() == 0) return "";
                  int hu = 0;
                  int fr = 0;

                  if(t.matches(".*[áéíóöőúüű].*")) hu += 5;
                  if(t.matches(".*[àâæçéèêëîïôœùûüÿ].*")) fr += 4;

                  String padded = " " + t + " ";
                  String[] huWords = {" hogy "," nem "," igen "," vagy "," és "," egy "," ezt "," azt "," akkor "," amikor "," mert "," szeretnék "," kell "," kérem "," köszönöm "," délután "," órakor "," lerakó "," rakodás "};
                  String[] frWords = {" je "," tu "," vous "," nous "," il "," elle "," le "," la "," les "," des "," un "," une "," et "," est "," pas "," pour "," avec "," dans "," alors "," merci "," bonjour "," monsieur "," aujourd'hui "};
                  for(String w: huWords) if(padded.contains(w)) hu += 2;
                  for(String w: frWords) if(padded.contains(w)) fr += 2;

                  if(hu >= fr + 2) return "hu";
                  if(fr >= hu + 2) return "fr";
                  return "";
              }

