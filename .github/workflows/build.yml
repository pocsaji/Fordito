              AudioDeviceInfo findBuiltInInterpreterMic() {
                  for(AudioDeviceInfo d : availableInputDevicesCompat()) {
                      if(d != null && d.isSource() && d.getType() == AudioDeviceInfo.TYPE_BUILTIN_MIC) return d;
