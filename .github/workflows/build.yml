              boolean isBuiltInPhoneMicrophone(AudioDeviceInfo device) {
                  return device != null && device.isSource() && device.getType() == AudioDeviceInfo.TYPE_BUILTIN_MIC;
              }
          
              boolean verifyBuiltInMicrophoneRoute(AudioRecord recorder, long timeoutMs) {
                  if(recorder == null) return false;
                  long deadline = SystemClock.elapsedRealtime() + Math.max(250L, timeoutMs);
                  while(SystemClock.elapsedRealtime() < deadline) {
                      try {
                          AudioDeviceInfo routed = recorder.getRoutedDevice();
                          if(isBuiltInPhoneMicrophone(routed)) return true;
                          if(routed != null && !isBuiltInPhoneMicrophone(routed)) {
                              android.util.Log.e(LOG_TAG, "Forbidden input route: " + compactAudioDeviceLabel(routed));
                              return false;
                          }
                      } catch(Exception e) {
                          android.util.Log.w(LOG_TAG, "Input route verification failed", e);
                      }
                      SystemClock.sleep(60L);
                  }
                  android.util.Log.e(LOG_TAG, "Built-in microphone route was not confirmed");
                  return false;
              }
          
              void handleUnexpectedInputRoute(AudioDeviceInfo routed) {
                  if(wrongInputRouteDetected || !streaming || routed == null || isBuiltInPhoneMicrophone(routed)) return;
                  wrongInputRouteDetected = true;
                  android.util.Log.e(LOG_TAG, "Input switched away from phone microphone: " + compactAudioDeviceLabel(routed));
                  runOnUiThread(() -> {
                      state.setText("hiba – csak telefon mikrofon engedélyezett");
                      setInputRouteHeader("BEMENET: TILTOTT " + compactAudioDeviceLabel(routed));
                      stop(false);
                  });
              }
          
              void refreshActualInputRoute(AudioRecord recorder) {
                  if(recorder == null) {
                      setInputRouteHeader("BEMENET: —");
                      return;
                  }
                  try {
                      AudioDeviceInfo routed = recorder.getRoutedDevice();
                      if(routed != null) {
                          if(!isBuiltInPhoneMicrophone(routed)) {
                              handleUnexpectedInputRoute(routed);
                              return;
                          }
                          String conversion = activeCaptureSampleRate == REALTIME_SAMPLE_RATE ? " • 24k→16/24k" : " • 48k→16/24k";
                          String output = interpreterMode ? " • kimenet: " + activeCommunicationDeviceLabel : "";
                          setInputRouteHeader("BEMENET: telefon mikrofon" + conversion + output);
                      } else setInputRouteHeader("BEMENET: telefon mikrofon ellenőrzés…");
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Actual input route query failed", e);
                      setInputRouteHeader("BEMENET: ellenőrzési hiba");
                  }
              }
          
              void registerActualInputRouteUpdates(AudioRecord recorder) {
                  if(recorder == null || Build.VERSION.SDK_INT < 24) return;
                  try {
                      recorder.addOnRoutingChangedListener(new AudioRouting.OnRoutingChangedListener() {
                          @Override public void onRoutingChanged(AudioRouting router) {
                              if(rec == recorder) refreshActualInputRoute(recorder);
                          }
                      }, new Handler(Looper.getMainLooper()));
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "AudioRecord route listener registration failed", e);
                  }
              }
          
              List<AudioDeviceInfo> availableInputDevicesCompat() {
                  ArrayList<AudioDeviceInfo> out = new ArrayList<>();
                  if(audioManager == null || Build.VERSION.SDK_INT < 23) return out;
                  try { out.addAll(Arrays.asList(audioManager.getDevices(AudioManager.GET_DEVICES_INPUTS))); }
