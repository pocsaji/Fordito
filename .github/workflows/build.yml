              void updatePlannedInterpreterOutputRoute() {
                  AudioDeviceInfo target = resolveRequestedInterpreterOutputDevice();
                  if(target != null && interpreterHeadsetOutputPriority(target) >= 0) {
                      activeInterpreterRoute = "headset_output_phone_mic";
                      activeInterpreterOutputLabel = compactAudioDeviceLabel(target);
                  } else {
                      activeInterpreterRoute = "speaker_half_duplex";
                      activeInterpreterOutputLabel = target == null ? "telefon hangszóró" : compactAudioDeviceLabel(target);
                  }
