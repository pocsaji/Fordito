                  text = text.replaceAll("(?iu)\\bbluetooth[- ]?ot\\b", "Bluetoothot");
                  text = text.replaceAll("(?iu)\\bbluetooth[- ]?on\\b", "Bluetoothon");
                  text = text.replaceAll("(?iu)\\bblutus\\b", "Bluetooth");
                  text = text.replaceAll("(?iu)\\bblut[uú]sz\\b", "Bluetooth");
                  text = text.replaceAll("(?iu)\\bblue\\s*tooth\\b", "Bluetooth");
                  text = text.replaceAll("(?iu)\\bs[íi]r[íi]\\s+csend\\b", "síri csend");
                  text = text.replaceAll("(?iu)\\bs[íi]li\\s+csend\\b", "síri csend");
                  text = text.replaceAll("(?iu)\\bs[íi]r[íi]ts?en\\b", "síri csend");
                  text = text.replaceAll("(?iu)\\bs[íi]ri\\s+csendes\\b", "síri csendes");
