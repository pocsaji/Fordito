              void refreshMenuButton(Button b, String title, String subtitle, boolean active) {
                  String sub = subtitle == null ? "" : subtitle.trim();
                  String text = title + (sub.length() == 0 ? "" : "\n" + sub);
                  SpannableString ss = new SpannableString(text);
                  ss.setSpan(new AbsoluteSizeSpan(15, true), 0, title.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  ss.setSpan(new StyleSpan(android.graphics.Typeface.BOLD), 0, title.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  if(sub.length() > 0) {
                      int st = title.length() + 1;
                      ss.setSpan(new AbsoluteSizeSpan(12, true), st, text.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      ss.setSpan(new ForegroundColorSpan(Color.rgb(230,230,230)), st, text.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  }
                  b.setText(ss);
                  b.setBackgroundColor(active ? Color.rgb(30,140,70) : Color.rgb(95,95,95));
              }

              void refreshInterpreterMenuButton(Button b) {
                  String title = "Tolmács mód";
                  String sub = interpreterQuickLabel();
                  String text = title + "\n" + sub;
                  SpannableString ss = new SpannableString(text);
                  ss.setSpan(new AbsoluteSizeSpan(15, true), 0, title.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  ss.setSpan(new StyleSpan(android.graphics.Typeface.BOLD), 0, title.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  int st = title.length() + 1;
                  ss.setSpan(new AbsoluteSizeSpan(12, true), st, text.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  ss.setSpan(new ForegroundColorSpan(Color.RED), st, text.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  b.setText(ss);
                  if(!interpreterMode) b.setBackgroundColor(Color.rgb(95,95,95));
                  else if("speaker".equals(interpreterAudioMode)) b.setBackgroundColor(Color.rgb(30,140,70));
                  else b.setBackgroundColor(Color.rgb(35,85,150));
              }


