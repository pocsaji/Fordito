                                      JSONObject msg = choices.getJSONObject(0).optJSONObject("message");
                                      if(msg != null) out = msg.optString("content", "");
                                  }
                                  final String result = cleanClipboardApiText(out);
                                  runOnUiThread(() -> applyClipboardTranslationOnly(preparedText, result));
                              } catch(Exception ex) {
