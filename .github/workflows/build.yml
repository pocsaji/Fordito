              void clearPreRollAudio() {
                  synchronized(preRollAudioFrames) {
                      preRollAudioFrames.clear();
                      preRollAudioMs = 0;
                  }
              }
          
              PcmFramePair copyFramePair(PcmFramePair frame) {
                  if(frame == null) return new PcmFramePair(new byte[0], new byte[0]);
                  return new PcmFramePair(Arrays.copyOf(frame.pcm16k, frame.pcm16k.length), Arrays.copyOf(frame.pcm24k, frame.pcm24k.length));
              }
          
              void rememberPreRollAudio(PcmFramePair frame) {
                  if(frame == null || frame.pcm16k.length == 0) return;
                  synchronized(preRollAudioFrames) {
                      preRollAudioFrames.add(copyFramePair(frame));
                      preRollAudioMs += SILERO_FRAME_MS;
                      while(preRollAudioMs > PRE_ROLL_AUDIO_MS && !preRollAudioFrames.isEmpty()) {
                          preRollAudioFrames.poll();
                          preRollAudioMs = Math.max(0, preRollAudioMs - SILERO_FRAME_MS);
                      }
                  }
              }
          
              ArrayList<PcmFramePair> takePreRollAudio() {
                  ArrayList<PcmFramePair> out = new ArrayList<>();
                  synchronized(preRollAudioFrames) {
                      while(!preRollAudioFrames.isEmpty()) {
                          PcmFramePair b = preRollAudioFrames.poll();
                          if(b != null) out.add(b);
                      }
                      preRollAudioMs = 0;
                  }
                  return out;
              }
          
              int pcm16Mono16kMs(int bytes) {
                  if(bytes <= 0) return 0;
                  return Math.max(1, (int)Math.round(bytes * 1000.0 / (AUDIO_SAMPLE_RATE * 2.0)));
              }
          
