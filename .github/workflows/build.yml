name: Build Android APK v17 LANGUAGE PAIRS

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/attila/forditokonzolga17 app/src/main/res/values
          cat > settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ForditoKonzol"
          include(":app")
          EOT
          cat > build.gradle.kts <<'EOT'
          plugins { id("com.android.application") version "8.6.1" apply false }
          EOT
          cat > app/build.gradle.kts <<'EOT'
          plugins { id("com.android.application") }
          android { namespace="com.attila.forditokonzolga17"; compileSdk=35
              defaultConfig { applicationId="com.attila.forditokonzolga17"; minSdk=26; targetSdk=35; versionCode=17; versionName="1.7" }
          }
          dependencies { implementation("com.squareup.okhttp3:okhttp:4.12.0"); implementation("org.json:json:20240303") }
          EOT
          cat > app/src/main/res/values/styles.xml <<'EOT'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:navigationBarColor">#101318</item><item name="android:statusBarColor">#101318</item><item name="android:windowBackground">#101318</item><item name="android:windowNoTitle">true</item></style></resources>
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="false" android:label="Fordító Konzol" android:supportsRtl="true" android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOT
          cat > app/src/main/java/com/attila/forditokonzolga17/MainActivity.java <<'EOT'
          package com.attila.forditokonzolga17;
          import android.Manifest;import android.app.*;import android.content.*;import android.content.pm.PackageManager;import android.graphics.Color;import android.media.*;import android.os.*;import android.text.method.ScrollingMovementMethod;import android.util.Base64;import android.view.Gravity;import android.widget.*;import org.json.*;import java.util.*;import java.util.concurrent.*;import okhttp3.*;
          public class MainActivity extends Activity{
            TextView state; EditText top,bottom; Button mic,dir,menu,clear; SharedPreferences sp; OkHttpClient client; WebSocket ws; AudioRecord rec; ExecutorService audio=Executors.newSingleThreadExecutor(); boolean streaming=false,connected=false,sourceTop=true; long sessionStart=0; String key="",model="gpt-realtime-2",profile="truck_bulk",topLang="hu",bottomLang="fr"; int silence=900,pairIndex=0;
            StringBuilder topFinal=new StringBuilder(),bottomFinal=new StringBuilder(); String srcPartial="",trPartial=""; long lastRouteChange=0;
            String[][] pairs={{"Magyar ⇄ Francia","FR","fr"},{"Magyar ⇄ Angol","EN","en"},{"Magyar ⇄ Német","DE","de"},{"Magyar ⇄ Olasz","IT","it"},{"Magyar ⇄ Spanyol","ES","es"},{"Magyar ⇄ Horvát","HR","hr"},{"Magyar ⇄ Szerb","SR","sr"},{"Magyar ⇄ Román","RO","ro"},{"Magyar ⇄ Szlovák","SK","sk"},{"Magyar ⇄ Szlovén","SL","sl"}};
            String[][] langs={{"Magyar","HU","hu"},{"Francia","FR","fr"},{"Angol","EN","en"},{"Német","DE","de"},{"Olasz","IT","it"},{"Spanyol","ES","es"},{"Horvát","HR","hr"},{"Szerb","SR","sr"},{"Román","RO","ro"},{"Szlovák","SK","sk"},{"Szlovén","SL","sl"}};
            String[][] profiles={{"Általános","general"},{"Turizmus","tourism"},{"Étterem","restaurant"},{"Szállás","hotel"},{"Kamion általános","truck_general"},{"Kamion ponyvás","truck_tarp"},{"Kamion ömlesztett","truck_bulk"},{"Kamion tartány","truck_tank"},{"Logisztika/rakodás","logistics"},{"Vám/határ","customs"},{"Orvos","medical"},{"Gyógyszertár","pharmacy"},{"Bank","bank"},{"Hivatal","office"},{"Rendőrség","police"},{"Szerviz","service"}};
            public void onCreate(Bundle b){super.onCreate(b);sp=getSharedPreferences("settings",0);load();ui();reqMic();}
            void load(){key=sp.getString("key","");profile=sp.getString("profile","truck_bulk");topLang="hu";bottomLang=sp.getString("bottomLang","fr");pairIndex=findPair(bottomLang);sourceTop=sp.getBoolean("sourceTop",true);silence=sp.getInt("silence",900);} void save(){sp.edit().putString("key",key).putString("profile",profile).putString("topLang","hu").putString("bottomLang",bottomLang).putInt("pairIndex",pairIndex).putBoolean("sourceTop",sourceTop).putInt("silence",silence).apply();}
            void ui(){LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(8,72,8,112);root.setBackgroundColor(Color.rgb(16,19,24));setContentView(root);
              LinearLayout head=row();TextView title=tv("Fordító Konzol v1.7 LANG PAIRS");state=tv("készenlét");state.setGravity(Gravity.RIGHT|Gravity.CENTER_VERTICAL);head.addView(title,new LinearLayout.LayoutParams(0,32,1));head.addView(state,new LinearLayout.LayoutParams(0,32,1));root.addView(head);
              LinearLayout buttons=row();mic=btn("MIKROFON");dir=btn("HU → "+code(bottomLang));clear=btn("TÖRLÉS");menu=btn("MENÜ");buttons.addView(mic,new LinearLayout.LayoutParams(0,88,1));buttons.addView(dir,new LinearLayout.LayoutParams(0,88,1));buttons.addView(clear,new LinearLayout.LayoutParams(0,88,1));buttons.addView(menu,new LinearLayout.LayoutParams(0,88,1));root.addView(buttons);
              top=box("MAGYAR ABLAK");bottom=box(code(bottomLang)+" ABLAK");root.addView(top,new LinearLayout.LayoutParams(-1,0,1));TextView sep=new TextView(this);sep.setText("━━━━━━━━━━━━━━━━━━━━");sep.setTextColor(Color.rgb(170,170,170));sep.setGravity(Gravity.CENTER);sep.setTextSize(10);sep.setBackgroundColor(Color.rgb(35,40,50));root.addView(sep,new LinearLayout.LayoutParams(-1,36));root.addView(bottom,new LinearLayout.LayoutParams(-1,0,1));
              mic.setOnClickListener(v->{if(streaming)stop();else start();});dir.setOnClickListener(v->{sourceTop=!sourceTop;save();clearPartials();sessionUpdateSafe();upd();render();});dir.setOnLongClickListener(v->{choosePair();return true;});clear.setOnClickListener(v->{topFinal.setLength(0);bottomFinal.setLength(0);clearPartials();render();});menu.setOnClickListener(v->showMenu());top.setOnLongClickListener(v->{choosePair();return true;});bottom.setOnLongClickListener(v->{choosePair();return true;});mic.setOnLongClickListener(v->{chooseSilence();return true;});upd();render();}
            TextView tv(String s){TextView t=new TextView(this);t.setText(s);t.setTextColor(Color.LTGRAY);t.setTextSize(12);t.setSingleLine(true);return t;} LinearLayout row(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.HORIZONTAL);return l;} Button btn(String s){Button b=new Button(this);b.setText(s);b.setTextColor(Color.WHITE);b.setAllCaps(false);b.setTextSize(17);b.setGravity(Gravity.CENTER);b.setMinHeight(82);b.setPadding(4,8,4,8);return b;} EditText box(String h){EditText e=new EditText(this);e.setHint(h);e.setHintTextColor(Color.GRAY);e.setTextColor(Color.WHITE);e.setTextSize(13);e.setGravity(Gravity.TOP|Gravity.START);e.setSingleLine(false);e.setMinLines(5);e.setVerticalScrollBarEnabled(true);e.setMovementMethod(new ScrollingMovementMethod());e.setBackgroundColor(Color.rgb(27,32,41));e.setPadding(10,8,10,52);return e;}
            void reqMic(){if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},1001);} boolean hasKey(){return key!=null&&key.trim().startsWith("sk-");}
            void start(){if(!hasKey()){apiDialog();return;} if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED){reqMic();return;} if(sessionStart==0)sessionStart=System.currentTimeMillis(); if(System.currentTimeMillis()-sessionStart>20L*60L*1000L){confirm();return;} clearPartials();lastRouteChange=0;state.setText("kapcsolódás");client=new OkHttpClient.Builder().readTimeout(0,TimeUnit.MILLISECONDS).build();Request req=new Request.Builder().url("wss://api.openai.com/v1/realtime?model="+model).addHeader("Authorization","Bearer "+key.trim()).addHeader("OpenAI-Safety-Identifier","forditokonzol-android").build();ws=client.newWebSocket(req,new WebSocketListener(){public void onOpen(WebSocket w,Response r){connected=true;runOnUiThread(()->{sessionUpdate();audioLoop();upd();});}public void onMessage(WebSocket w,String s){event(s);}public void onFailure(WebSocket w,Throwable t,Response r){runOnUiThread(()->{state.setText("kapcsolat hiba");stop();});}public void onClosed(WebSocket w,int c,String rs){connected=false;runOnUiThread(()->{state.setText("lezárva");upd();});}});}
            void sessionUpdateSafe(){if(ws!=null&&connected)sessionUpdate();}
            void sessionUpdate(){try{JSONObject session=new JSONObject();session.put("type","realtime");session.put("model",model);session.put("instructions",instructions());JSONArray outs=new JSONArray();outs.put("text");session.put("output_modalities",outs);JSONObject audioCfg=new JSONObject();JSONObject input=new JSONObject();JSONObject format=new JSONObject();format.put("type","audio/pcm");format.put("rate",24000);input.put("format",format);JSONObject tr=new JSONObject();tr.put("model","gpt-realtime-whisper");String sl=sourceLang();if(!sl.isEmpty())tr.put("language",sl);input.put("transcription",tr);JSONObject vad=new JSONObject();vad.put("type","server_vad");vad.put("threshold",0.5);vad.put("prefix_padding_ms",300);vad.put("silence_duration_ms",silence);vad.put("create_response",true);vad.put("interrupt_response",false);input.put("turn_detection",vad);audioCfg.put("input",input);session.put("audio",audioCfg);JSONObject e=new JSONObject();e.put("type","session.update");e.put("session",session);ws.send(e.toString());}catch(Exception ex){state.setText("session hiba");}}
            String instructions(){return "Feladatod kizárólag élő kétirányú tolmácsolás a HU és "+code(bottomLang)+" nyelv között. Más nyelvet ne használj és ne találgass. A beszéd felismerésénél is kizárólag ezt a két nyelvet tekintsd érvényesnek: magyar és "+langName(bottomLang)+". Ha magyarul beszélnek, fordítsd "+langName(bottomLang)+" nyelvre. Ha "+langName(bottomLang)+" nyelven beszélnek, fordítsd magyarra. Török, japán, kínai, üzbég vagy bármely más nyelvnek tűnő zajt ne értelmezz idegen nyelvként; próbáld a kiválasztott két nyelv egyikeként kezelni, vagy hagyd figyelmen kívül. Csak a fordított szöveget add vissza, magyarázat, bevezető, kommentár és idézőjel nélkül. Őrizd meg a jelentést, számokat, neveket, címeket, rakodási adatokat. Profil: "+profilePrompt()+" Ha zajt vagy félbeszakadt mondatot hallasz, csak az értelmes részt fordítsd.";}
            String sourceCode(){return sourceTop?code(topLang):code(bottomLang);} String targetCode(){return sourceTop?code(bottomLang):code(topLang);} String sourceLang(){return sourceTop?topLang:bottomLang;} String sourceName(){return sourceTop?"FELSŐ":"ALSÓ";} String targetName(){return sourceTop?"ALSÓ":"FELSŐ";}
            void audioLoop(){int sr=24000;int min=AudioRecord.getMinBufferSize(sr,AudioFormat.CHANNEL_IN_MONO,AudioFormat.ENCODING_PCM_16BIT);int bs=Math.max(min,4096);rec=new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION,sr,AudioFormat.CHANNEL_IN_MONO,AudioFormat.ENCODING_PCM_16BIT,bs);streaming=true;rec.startRecording();state.setText("realtime aktív");audio.submit(()->{byte[] buf=new byte[bs];while(streaming&&rec!=null&&connected&&ws!=null){int n=rec.read(buf,0,buf.length);if(n>0){try{JSONObject e=new JSONObject();e.put("type","input_audio_buffer.append");e.put("audio",Base64.encodeToString(Arrays.copyOf(buf,n),Base64.NO_WRAP));ws.send(e.toString());}catch(Exception ignored){}}}});}
            void stop(){streaming=false;connected=false;clearPartials();try{if(rec!=null){rec.stop();rec.release();}}catch(Exception ignored){}rec=null;try{if(ws!=null){ws.close(1000,"stop");}}catch(Exception ignored){}ws=null;state.setText("készenlét");upd();render();}
            void event(String s){try{JSONObject o=new JSONObject(s);String type=o.optString("type","");if(type.equals("conversation.item.input_audio_transcription.delta")){String d=o.optString("delta","");if(!d.isEmpty())runOnUiThread(()->{srcPartial+=d;render();});}else if(type.equals("conversation.item.input_audio_transcription.completed")){String d=o.optString("transcript","");if(!d.isEmpty())runOnUiThread(()->{srcPartial="";autoRoute(d);appendFinal(sourceTop,d);render();});}else if(type.equals("response.output_text.delta")||type.equals("response.text.delta")){String d=o.optString("delta","");if(!d.isEmpty())runOnUiThread(()->{trPartial+=d;render();});}else if(type.equals("response.done")){runOnUiThread(()->{if(srcPartial.trim().length()>0){autoRoute(srcPartial);appendFinal(sourceTop,srcPartial);srcPartial="";}if(trPartial.trim().length()>0){appendFinal(!sourceTop,trPartial);trPartial="";}render();});}else if(type.contains("error")){runOnUiThread(()->state.setText("API hiba"));}}catch(Exception ex){runOnUiThread(()->state.setText("event hiba"));}}
            void autoRoute(String text){String d=detectLang(text);if(d.isEmpty())return;long now=System.currentTimeMillis();if(now-lastRouteChange<700)return;if(d.equals(topLang)&&!sourceTop){sourceTop=true;lastRouteChange=now;save();clearPartials();sessionUpdateSafe();upd();}else if(d.equals(bottomLang)&&sourceTop){sourceTop=false;lastRouteChange=now;save();clearPartials();sessionUpdateSafe();upd();}}
            String detectLang(String t){String x=(" "+t.toLowerCase(Locale.ROOT)+" ").replace('\n',' ');int a=scoreLang(x,topLang),b=scoreLang(x,bottomLang);if(a>=b+2)return topLang;if(b>=a+2)return bottomLang;return "";}
            int scoreLang(String x,String lang){int s=0;if(lang.equals("hu")){if(x.matches(".*[áíóöőúüű].*"))s+=4;String[] w={" hogy "," vagy "," nem "," igen "," kérek "," köszönöm "," szeretnék "," beszélek "," magyar "," akkor "," egy "," van "," nincs "," működik "," próbáljuk "," ablak "," nyelv "," kellene "," most "," csak "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("fr")){if(x.matches(".*[àâçèêëîïôùûüÿœ].*"))s+=4;String[] w={" bonjour "," merci "," monsieur "," madame "," je "," vous "," voudrais "," plaît "," café "," avec "," dans "," oui "," non "," alors "," maintenant "," comment "," français "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("en")){String[] w={" hello "," thank "," please "," yes "," no "," i "," you "," would "," want "," need "," good "," morning "," english "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("de")){if(x.matches(".*[äöüß].*"))s+=4;String[] w={" hallo "," danke "," bitte "," ja "," nein "," ich "," sie "," möchte "," brauche "," guten "," deutsch "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("it")){String[] w={" buongiorno "," grazie "," prego "," sì "," no "," io "," lei "," vorrei "," bisogno "," italiano "," ciao "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("es")){if(x.matches(".*[áéíóúñ].*"))s+=3;String[] w={" hola "," gracias "," por favor "," sí "," no "," yo "," usted "," quiero "," necesito "," español "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("ro")){if(x.matches(".*[ăâîșţț].*"))s+=4;String[] w={" bună "," multumesc "," mulțumesc "," va rog "," vă rog "," da "," nu "," vreau "," trebuie "," română "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("hr")){String[] w={" dobar "," hvala "," molim "," da "," ne "," želim "," trebam "," hrvatski "," govorim "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("sr")){String[] w={" dobar "," hvala "," molim "," da "," ne "," želim "," trebam "," srpski "," govorim "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("sk")){if(x.matches(".*[áäčďéíĺľňóôŕšťúýž].*"))s+=3;String[] w={" dobrý "," ďakujem "," prosím "," áno "," nie "," chcem "," potrebujem "," slovenský "};for(String z:w)if(x.contains(z))s++;}else if(lang.equals("sl")){if(x.matches(".*[čšž].*"))s+=3;String[] w={" dober "," hvala "," prosim "," da "," ne "," želim "," potrebujem "," slovenski "};for(String z:w)if(x.contains(z))s++;}return s;}
            void appendFinal(boolean toTop,String s){String clean=s.trim().replaceAll("\\s+"," ");if(clean.isEmpty())return;StringBuilder b=toTop?topFinal:bottomFinal;String last=lastBlock(b);String nc=norm(clean),nl=norm(last);if(nc.equals(nl))return;if(clean.length()>10&&last.length()>10&&(nc.contains(nl)||nl.contains(nc)))return;if(b.length()>0)b.append("\n");b.append(clean);} String norm(String s){return s.toLowerCase(Locale.ROOT).replaceAll("[^\\p{L}0-9]+","").trim();} String lastBlock(StringBuilder b){if(b.length()==0)return "";String all=b.toString().trim();int i=all.lastIndexOf("\n");return (i>=0?all.substring(i+1):all).trim();} void clearPartials(){srcPartial="";trPartial="";} String compose(boolean isTop){StringBuilder b=isTop?topFinal:bottomFinal;StringBuilder out=new StringBuilder(b.toString());if(isTop==sourceTop&&srcPartial.length()>0){if(out.length()>0)out.append("\n");out.append(srcPartial);}if(isTop!=sourceTop&&trPartial.length()>0){if(out.length()>0)out.append("\n");out.append(trPartial);}return out.toString();}
            void render(){top.setHint(label(true));bottom.setHint(label(false));top.setText(compose(true));bottom.setText(compose(false));top.post(()->top.setSelection(top.length()));bottom.post(()->bottom.setSelection(bottom.length()));} String label(boolean isTop){return (isTop?"FELSŐ ":"ALSÓ ")+code(isTop?topLang:bottomLang)+(isTop==sourceTop?"  • beszéd":"  • fordítás");}
            void confirm(){new AlertDialog.Builder(this).setTitle("Folyik még?").setMessage("20 perce aktív.").setPositiveButton("Igen",(d,w)->{sessionStart=System.currentTimeMillis();start();}).setNegativeButton("Leállítás",(d,w)->{sessionStart=0;stop();}).show();}
            void showMenu(){String[] it={"OpenAI API kulcs","Nyelvpár: Magyar ⇄ "+langName(bottomLang),"Beszélgetési profil: "+profileLabel(),"Csendhatár: "+silence+" ms","Mindkettő törlése"};new AlertDialog.Builder(this).setTitle("Menü").setItems(it,(d,w)->{if(w==0)apiDialog();if(w==1)choosePair();if(w==2)chooseProfile();if(w==3)chooseSilence();if(w==4){topFinal.setLength(0);bottomFinal.setLength(0);clearPartials();render();}upd();}).show();}
            void apiDialog(){EditText in=new EditText(this);in.setSingleLine(true);in.setText(key);in.setHint("sk-...");new AlertDialog.Builder(this).setTitle("OpenAI API kulcs").setView(in).setPositiveButton("Mentés",(d,w)->{key=in.getText().toString().trim();save();upd();}).setNegativeButton("Mégse",null).show();}
            void chooseProfile(){String[] l=new String[profiles.length];for(int i=0;i<profiles.length;i++)l[i]=profiles[i][0]+(profiles[i][1].equals(profile)?" ✓":"");new AlertDialog.Builder(this).setTitle("Beszélgetési profil").setItems(l,(d,w)->{profile=profiles[w][1];save();sessionUpdateSafe();upd();}).show();}
            void chooseSilence(){String[] l={"500","700","900","1200","1500","2000"};int[] v={500,700,900,1200,1500,2000};new AlertDialog.Builder(this).setTitle("Csendhatár ms").setItems(l,(d,w)->{silence=v[w];save();sessionUpdateSafe();upd();}).show();}
            void choosePair(){String[] l=new String[pairs.length];for(int i=0;i<pairs.length;i++)l[i]=pairs[i][0]+(pairs[i][2].equals(bottomLang)?" ✓":"");new AlertDialog.Builder(this).setTitle("Nyelvpár választása").setItems(l,(d,w)->{pairIndex=w;topLang="hu";bottomLang=pairs[w][2];clearPartials();save();sessionUpdateSafe();upd();render();}).show();}
            int findPair(String lang){for(int i=0;i<pairs.length;i++)if(pairs[i][2].equals(lang))return i;return 0;}
            String profilePrompt(){if(profile.equals("truck_bulk"))return "két kamionsofőr beszélget ömlesztett áruszállításról, silóról, rakodásról, mérlegről, telephelyről és logisztikáról.";if(profile.equals("truck_tarp"))return "kamionos ponyvás fuvarozás, rakodás, ponyva, heveder, raklap, CMR, telephely.";if(profile.equals("truck_general"))return "kamionos munka, fuvarozás, rakodás, útvonal, diszpécser, telephely.";if(profile.equals("medical"))return "orvos-beteg beszélgetés.";if(profile.equals("restaurant"))return "étterem, rendelés, ételek, italok, fizetés.";if(profile.equals("tourism"))return "turizmus, utazás, útbaigazítás.";if(profile.equals("hotel"))return "szállás, foglalás, érkezés, távozás.";if(profile.equals("bank"))return "banki ügyintézés.";if(profile.equals("office"))return "hivatali ügyintézés.";if(profile.equals("customs"))return "vám, határ, okmányok, fuvar.";if(profile.equals("service"))return "autószerviz vagy gépjavítás.";if(profile.equals("pharmacy"))return "gyógyszertár.";return "általános beszélgetés.";}
            String profileLabel(){for(String[] p:profiles)if(p[1].equals(profile))return p[0];return profile;} String langName(String c){for(String[] l:langs)if(l[2].equals(c))return l[0];return c;} String code(String c){if(c==null||c.isEmpty())return "AUTO";for(String[] l:langs)if(l[2].equals(c))return l[1];return c.toUpperCase(Locale.ROOT);}void upd(){mic.setText(streaming?"STOP":"MIKROFON");mic.setBackgroundColor(streaming?Color.rgb(30,130,70):Color.rgb(90,50,50));menu.setBackgroundColor(hasKey()?Color.rgb(55,60,70):Color.rgb(140,80,30));dir.setText(sourceCode()+" → "+targetCode());dir.setBackgroundColor(Color.rgb(60,95,150));clear.setBackgroundColor(Color.rgb(55,60,70));state.setText(streaming?"aktív: "+sourceCode()+"→"+targetCode():"készenlét");}
            public void onPause(){super.onPause();if(streaming)stop();} public void onDestroy(){if(streaming)stop();audio.shutdownNow();super.onDestroy();}
          }
          }
          EOT
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Hard validation - GA standard realtime, no old/beta/translate-only path
        run: |
          ! grep -R "OpenAI-Beta" -n app || (echo "HIBÁS: OpenAI-Beta maradt a kódban" && exit 1)
          ! grep -R "v0.7" -n app || (echo "HIBÁS: v0.7 maradt a kódban" && exit 1)
          ! grep -R "gpt-realtime-translate" -n app || (echo "HIBÁS: magyar célnyelvre nem jó translate-only modell maradt" && exit 1)
          ! grep -R "realtime/translations" -n app || (echo "HIBÁS: magyar célnyelvre nem jó translation endpoint maradt" && exit 1)
          grep -R "Fordító Konzol v1.7 LANG PAIRS" -n app/src/main/java || (echo "HIBÁS: nem a v1.6 cím van a kódban" && exit 1)
          grep -R "wss://api.openai.com/v1/realtime?model=" -n app/src/main/java || (echo "HIBÁS: nem GA /v1/realtime URL van" && exit 1)
          grep -R "gpt-realtime-2" -n app/src/main/java || (echo "HIBÁS: nem gpt-realtime-2 modell van" && exit 1)
          grep -R "output_modalities" -n app/src/main/java || (echo "HIBÁS: GA output_modalities hiányzik" && exit 1)
          grep -R "input_audio_buffer.append" -n app/src/main/java || (echo "HIBÁS: GA audio append hiányzik" && exit 1)
          grep -R "response.output_text.delta" -n app/src/main/java || (echo "HIBÁS: válasz delta feldolgozás hiányzik" && exit 1)
          grep -R "MAGYAR ABLAK" -n app/src/main/java || (echo "HIBÁS: fix felső ablak hiányzik" && exit 1)
          grep -R "FRANCIA ABLAK" -n app/src/main/java || (echo "HIBÁS: fix alsó ablak hiányzik" && exit 1)
          grep -R "sourceTop" -n app/src/main/java || (echo "HIBÁS: iránylogika hiányzik" && exit 1)
          grep -R "choosePair" -n app/src/main/java || (echo "HIBÁS: nyelvpár-választó hiányzik" && exit 1)
          grep -R "Nyelvpár választása" -n app/src/main/java || (echo "HIBÁS: hosszú nyomásos nyelvpár menü hiányzik" && exit 1)
          grep -R "tr.put(\"language\"" -n app/src/main/java || (echo "HIBÁS: bemeneti nyelv paraméter hiányzik" && exit 1)
          grep -R "ScrollingMovementMethod" -n app/src/main/java || (echo "HIBÁS: görgetéskezelés hiányzik" && exit 1)
          grep -R "lastBlock" -n app/src/main/java || (echo "HIBÁS: ismétlésvédő hiányzik" && exit 1)
          grep -R "━━━━━━━━━━━━━━━━━━━━" -n app/src/main/java || (echo "HIBÁS: ablakelválasztó hiányzik" && exit 1)
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Find APK
        run: |
          mkdir -p artifact
          cp $(find app/build/outputs -name "*.apk" -type f | head -n 1) artifact/ForditoKonzol-GA-v17-LANG-PAIRS.apk
          ls -lah artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForditoKonzol-GA-v17-LANG-PAIRS-apk
          path: artifact/*.apk
          if-no-files-found: error
