              double vadThreshold() {
                  if("high".equals(vadMode)) return 0.50;     // gyors/érzékeny: halk beszédnél könnyebben indul
                  if("medium".equals(vadMode)) return 0.58;   // V240 alap: kamionban is ne kelljen ordítani
                  if("auto".equals(vadMode)) return 0.58;
                  return 0.64;                                // várakozó: hosszabb, óvatosabb blokkzárás
              }

              int vadSilenceMs() {
                  // V240: a szerver VAD mondatzárása sehol nem várhat tovább 500 ms-nál,
                  // mert a helyi küldési kapu legfeljebb 600 ms lezáró csendet enged fel.
                  if("high".equals(vadMode)) return 450;
                  if("medium".equals(vadMode)) return 650;
                  if("auto".equals(vadMode)) return 650;
                  return 800;
              }

              int micGateThreshold() {
                  // V240: a kapu már nem csak nulláz, hanem üresjáratban a küldést is megfogja.
                  // sensitive = kikapcsolva: minden hangcsomag megy, a régi folyamatos stream viselkedéshez.
                  if("sensitive".equals(micGateMode)) return 0;
                  if("gate_low".equals(micGateMode)) return 100;
                  if("normal".equals(micGateMode)) return 150;
                  if("gate_high".equals(micGateMode)) return 220;
                  return 100;
              }

              int avgAbsPcm16(byte[] data, int len) {
                  if(data == null || len < 2) return 0;
                  long sum = 0;
                  int samples = 0;
                  for(int i=0; i+1<len; i+=2) {
                      int lo = data[i] & 0xff;
                      int hi = data[i+1];
                      int v = (hi << 8) | lo;
                      sum += Math.abs(v);
                      samples++;
                  }
                  if(samples == 0) return 0;
                  return (int)(sum / samples);
              }

              void clearPreRollAudio() {
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.clear();
                      preRollAudioBytes = 0;
                  }
              }

              void rememberPreRollAudio(byte[] data, int len) {
                  if(data == null || len <= 0) return;
                  byte[] copy = Arrays.copyOf(data, len);
                  int maxBytes = Math.max(1, 24000 * 2 * PRE_ROLL_AUDIO_MS / 1000);
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.add(copy);
                      preRollAudioBytes += copy.length;
                      while(preRollAudioBytes > maxBytes && !preRollAudioChunks.isEmpty()) {
                          byte[] old = preRollAudioChunks.poll();
                          if(old != null) preRollAudioBytes -= old.length;
                      }
                  }
              }

              ArrayList<byte[]> takePreRollAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(preRollAudioChunks) {
                      while(!preRollAudioChunks.isEmpty()) {
                          byte[] b = preRollAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      preRollAudioBytes = 0;
                  }
                  return out;
              }

              int pcm16Mono24kMs(int bytes) {
                  if(bytes <= 0) return 0;
                  return Math.max(1, (int)Math.round(bytes * 1000.0 / (24000.0 * 2.0)));
              }

              void clearPendingSpeechAudio() {
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.clear();
                      pendingSpeechAudioMs = 0;
                  }
              }

              void rememberPendingSpeechAudio(byte[] data, int len) {
                  if(data == null || len <= 0) return;
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.add(Arrays.copyOf(data, len));
                      pendingSpeechAudioMs += pcm16Mono24kMs(len);
                  }
              }

              int pendingSpeechAudioDurationMs() {
                  synchronized(pendingSpeechAudioChunks) { return pendingSpeechAudioMs; }
              }

              ArrayList<byte[]> takePendingSpeechAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(pendingSpeechAudioChunks) {
                      while(!pendingSpeechAudioChunks.isEmpty()) {
                          byte[] b = pendingSpeechAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      pendingSpeechAudioMs = 0;
                  }
                  return out;
              }

              void closeExternalVad() {
                  try {
                      if(liveVadInstance instanceof AutoCloseable) ((AutoCloseable)liveVadInstance).close();
                      else if(liveVadInstance != null) liveVadInstance.getClass().getMethod("close").invoke(liveVadInstance);
                  } catch(Exception ignored) {}
                  liveVadInstance = null;
                  liveVadInstanceMode = "";
                  vadFrameBuffer.reset();
              }

              Object enumConst(String cls, String name) throws Exception {
                  Class<?> c = Class.forName(cls);
                  return Enum.valueOf((Class<Enum>)c.asSubclass(Enum.class), name);
              }

              Object buildVadByReflection(String mode) throws Exception {
                  if("webrtc".equals(mode)) {
                      Class<?> vadClass = Class.forName("com.konovalov.vad.webrtc.Vad");
                      Object b = vadClass.getMethod("builder").invoke(null);
                      b.getClass().getMethod("setSampleRate", Class.forName("com.konovalov.vad.webrtc.config.SampleRate")).invoke(b, enumConst("com.konovalov.vad.webrtc.config.SampleRate", "SAMPLE_RATE_16K"));
                      b.getClass().getMethod("setFrameSize", Class.forName("com.konovalov.vad.webrtc.config.FrameSize")).invoke(b, enumConst("com.konovalov.vad.webrtc.config.FrameSize", "FRAME_SIZE_320"));
                      b.getClass().getMethod("setMode", Class.forName("com.konovalov.vad.webrtc.config.Mode")).invoke(b, enumConst("com.konovalov.vad.webrtc.config.Mode", "VERY_AGGRESSIVE"));
                      b.getClass().getMethod("setSilenceDurationMs", int.class).invoke(b, 300);
                      b.getClass().getMethod("setSpeechDurationMs", int.class).invoke(b, 50);
                      return b.getClass().getMethod("build").invoke(b);
                  }
                  if("silero".equals(mode)) {
                      Class<?> vadClass = Class.forName("com.konovalov.vad.silero.Vad");
                      Object b = vadClass.getMethod("builder").invoke(null);
                      b.getClass().getMethod("setContext", android.content.Context.class).invoke(b, this);
                      b.getClass().getMethod("setSampleRate", Class.forName("com.konovalov.vad.silero.config.SampleRate")).invoke(b, enumConst("com.konovalov.vad.silero.config.SampleRate", "SAMPLE_RATE_16K"));
                      b.getClass().getMethod("setFrameSize", Class.forName("com.konovalov.vad.silero.config.FrameSize")).invoke(b, enumConst("com.konovalov.vad.silero.config.FrameSize", "FRAME_SIZE_512"));
                      b.getClass().getMethod("setMode", Class.forName("com.konovalov.vad.silero.config.Mode")).invoke(b, enumConst("com.konovalov.vad.silero.config.Mode", "NORMAL"));
                      b.getClass().getMethod("setSilenceDurationMs", int.class).invoke(b, 300);
                      b.getClass().getMethod("setSpeechDurationMs", int.class).invoke(b, 50);
                      return b.getClass().getMethod("build").invoke(b);
                  }
                  return null;
              }

              boolean ensureExternalVadReady() {
                  if(!"webrtc".equals(vadEngineMode) && !"silero".equals(vadEngineMode)) return false;
                  if(liveVadInstance != null && vadEngineMode.equals(liveVadInstanceMode)) return true;
                  closeExternalVad();
                  try {
                      liveVadInstance = buildVadByReflection(vadEngineMode);
                      liveVadInstanceMode = vadEngineMode;
                      return liveVadInstance != null;
                  } catch(Exception e) {
                      final String msg = "VAD nem indult: " + vadEngineMode;
                      runOnUiThread(() -> state.setText(msg));
                      vadEngineMode = "server";
                      save();
                      return false;
                  }
              }

              byte[] downsample24kTo16kPcm16(byte[] data, int len) {
                  if(data == null || len < 6) return new byte[0];
                  int inSamples = len / 2;
                  int outSamples = (inSamples * 2) / 3;
                  byte[] out = new byte[outSamples * 2];
                  for(int i=0;i<outSamples;i++) {
                      int srcSample = (i * 3) / 2;
                      int si = srcSample * 2;
                      int oi = i * 2;
                      if(si + 1 >= len) break;
                      out[oi] = data[si];
                      out[oi+1] = data[si+1];
                  }
                  return out;
              }

              boolean vadIsSpeechOn16k(byte[] pcm16k) {
                  if(liveVadInstance == null || pcm16k == null || pcm16k.length == 0) return false;
                  try {
                      int frameBytes = "silero".equals(vadEngineMode) ? 1024 : 640; // 16 kHz: Silero 512 samples, WebRTC 320 samples
                      vadFrameBuffer.write(pcm16k, 0, pcm16k.length);
                      byte[] all = vadFrameBuffer.toByteArray();
                      int pos = 0;
                      boolean speech = false;
                      while(pos + frameBytes <= all.length) {
                          byte[] frame = Arrays.copyOfRange(all, pos, pos + frameBytes);
                          Object r;
                          try {
                              r = liveVadInstance.getClass().getMethod("isSpeech", byte[].class).invoke(liveVadInstance, (Object)frame);
                          } catch(NoSuchMethodException nsme) {
                              short[] sf = new short[frame.length / 2];
                              for(int i=0;i<sf.length;i++) {
                                  int lo = frame[i*2] & 0xff;
                                  int hi = frame[i*2+1];
                                  sf[i] = (short)((hi << 8) | lo);
                              }
                              r = liveVadInstance.getClass().getMethod("isSpeech", short[].class).invoke(liveVadInstance, (Object)sf);
                          }
                          if(Boolean.TRUE.equals(r)) speech = true;
                          pos += frameBytes;
                      }
                      vadFrameBuffer.reset();
                      if(pos < all.length) vadFrameBuffer.write(all, pos, all.length - pos);
                      return speech;
                  } catch(Exception e) {
                      vadEngineMode = "server";
                      save();
                      return false;
                  }
              }

              boolean externalVadOverGate(byte[] data, int len) {
                  if("raw".equals(vadEngineMode)) return true;
                  if("server".equals(vadEngineMode)) return avgAbsPcm16(data, len) >= micGateThreshold();
                  if(!ensureExternalVadReady()) return avgAbsPcm16(data, len) >= micGateThreshold();
                  return vadIsSpeechOn16k(downsample24kTo16kPcm16(data, len));
              }

              void sendAudioChunk(byte[] chunk) throws Exception {
                  if(chunk == null || chunk.length == 0 || ws == null) return;

                  JSONObject evt = new JSONObject();
                  evt.put("type", "input_audio_buffer.append");
                  evt.put("audio", Base64.encodeToString(chunk, Base64.NO_WRAP));
                  ws.send(evt.toString());
              }

              byte[] prepareTrailingSilenceChunk(byte[] data, int len) {
                  long now = System.currentTimeMillis();
                  if(trailingSilenceOpen && lastVoiceChunkSentAtMs > 0L && now - lastVoiceChunkSentAtMs <= MAX_TRAILING_SILENCE_SEND_MS) {
                      return new byte[len];
                  }
                  trailingSilenceOpen = false;
                  voiceSendActive = false;
                  return null;
              }

