              boolean isClipboardSystemMessage(String s) {
                  if(s == null) return true;
                  String x = s.trim();
                  if(x.length() == 0) return true;
                  if(x.equalsIgnoreCase("vágólap szövege")) return true;
                  if(x.equalsIgnoreCase("fordítás")) return true;
                  if(x.equalsIgnoreCase("javított vagy fordítandó szöveg")) return true;
                  if(x.startsWith("Nincs fordítható szöveg")) return true;
                  if(x.startsWith("Vágólap-fordítási hiba")) return true;
                  if(x.equalsIgnoreCase("Fordítás folyamatban…")) return true;
                  if(x.equalsIgnoreCase("Értelmezés folyamatban…")) return true;
                  return false;
              }
          
