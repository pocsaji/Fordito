              String cleanClipboardApiText(String out) {
                  String t = out == null ? "" : out.trim();
                  if(t.startsWith("```")) {
                      t = t.replaceFirst("^```[a-zA-Z]*\\s*", "");
                      t = t.replaceFirst("\\s*```$", "");
                  }
                  t = t.trim();
                  if(t.startsWith("\"") && t.endsWith("\"") && t.length() >= 2) t = t.substring(1, t.length() - 1).trim();
                  return t;
              }

              void applyClipboardFullResult(String source, String out) {
                  String prepared = "";
                  String translation = "";
                  try {
                      String cleaned = out == null ? "" : out.trim();
                      int a = cleaned.indexOf('{');
                      int b = cleaned.lastIndexOf('}');
                      if(a >= 0 && b > a) cleaned = cleaned.substring(a, b + 1);
                      JSONObject jo = new JSONObject(cleaned);
                      prepared = cleanClipboardApiText(jo.optString("prepared", ""));
                      translation = cleanClipboardApiText(jo.optString("translation", ""));
                  } catch(Exception ignored) {
                      prepared = source == null ? "" : source.trim();
                      translation = cleanClipboardApiText(out);
                  }
                  boolean huSource = clipboardResponseMode || isClipboardHungarian(source);
                  if(!huSource) prepared = "";
                  else if(prepared.length() == 0) prepared = source == null ? "" : source.trim();
                  if(translation.length() == 0) {
                      showClipboardTranslatorPanel(source, prepared, "Vágólap-fordítási hiba: üres válasz érkezett.");
                      return;
                  }
                  clipboardCurrentPrepared = prepared;
                  clipboardForceFieldUpdate = true;
                  showClipboardTranslatorPanel(source, prepared, translation);
                  Toast.makeText(this, "Fordítás elkészült.", Toast.LENGTH_SHORT).show();
              }

              void applyClipboardTranslationOnly(String prepared, String tr) {
                  String clean = cleanClipboardApiText(tr);
                  if(clean.length() == 0) {
                      showClipboardTranslatorPanel(clipboardCurrentSource, prepared, "Vágólap-fordítási hiba: üres válasz érkezett.");
                      return;
                  }
                  showClipboardTranslatorPanel(clipboardCurrentSource, prepared, clean);
                  Toast.makeText(this, "Fordítás elkészült.", Toast.LENGTH_SHORT).show();
              }

