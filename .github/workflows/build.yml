              void startSynthesizedTtsPlayback(TtsJob job, File file) {
                  MediaPlayer player = new MediaPlayer();
                  ttsPlayer = player;
                  AudioDeviceInfo requested = resolveRequestedInterpreterOutputDevice();
                  try {
                      player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build());
                      player.setDataSource(file.getAbsolutePath());
                      final boolean routeSelectionAccepted;
                      if(Build.VERSION.SDK_INT >= 28 && requested != null) {
                          routeSelectionAccepted = player.setPreferredDevice(requested);
                          if(!routeSelectionAccepted) android.util.Log.w(LOG_TAG, "MediaPlayer preferred output rejected: " + compactAudioDeviceLabel(requested));
                      } else {
                          routeSelectionAccepted = false;
                      }
                      player.setOnPreparedListener(mp -> {
                          synchronized(MainActivity.this) {
                              if(mp != ttsPlayer || activeTtsJob != job || !isCurrentTtsJobValid(job)) {
                                  finishActiveTtsJob(false, true, "");
                                  return;
                              }
                              job.started = true;
                              job.block.ttsStartedRevision = job.revision;
                              ttsPlaybackActive = true;
                                      activeTtsSpeakerRoute = requested == null || requested.getType() == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER || !routeSelectionAccepted;
                              if(activeTtsSpeakerRoute) beginHalfDuplexTtsGuard();
                              try {
                                  mp.start();
                                  ttsRouteHandler.postDelayed(() -> updateInterpreterRouteFromPlayer(mp, requested), 140L);
                              } catch(Exception e) {
                                  android.util.Log.e(LOG_TAG, "TTS MediaPlayer start failed", e);
                                  finishActiveTtsJob(false, false, "A kész fordítás lejátszása nem sikerült.");
                              }
                          }
                      });
                      player.setOnCompletionListener(mp -> {
                          synchronized(MainActivity.this) { finishActiveTtsJob(true, false, ""); }
                      });
                      player.setOnErrorListener((mp, what, extra) -> {
                          synchronized(MainActivity.this) {
                              android.util.Log.e(LOG_TAG, "TTS MediaPlayer error: " + what + "/" + extra);
                              finishActiveTtsJob(false, false, "A kész fordítás lejátszása nem sikerült.");
                          }
                          return true;
                      });
                      player.prepareAsync();
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "TTS MediaPlayer preparation failed", e);
                      finishActiveTtsJob(false, false, "A kész fordítás lejátszása nem készíthető elő.");
                  }
              }
          
              synchronized void finishActiveTtsJob(boolean completed, boolean stopped, String errorMessage) {
                  TtsJob job = activeTtsJob;
                  if(job != null && job.block != null) {
                      if(completed && job.started && job.block.finalRevision == job.revision && job.textHash.equals(job.block.finalTranslationHash)) {
                          job.block.ttsCompletedRevision = job.revision;
                          job.block.ttsQueuedRevision = 0;
                          job.block.ttsSpoken = true;
                      } else if(job.block.ttsQueuedRevision == job.revision) {
                          job.block.ttsQueuedRevision = 0;
                      }
                  }
                  if(activeTtsSpeakerRoute && ttsPlaybackActive) ttsMuteUntilMs = System.currentTimeMillis() + POST_TTS_SPEAKER_GUARD_MS;
                  clearActiveTtsResources(true);
                  if(!completed && !stopped && errorMessage != null && !errorMessage.isEmpty()) {
                      Toast.makeText(this, errorMessage, Toast.LENGTH_SHORT).show();
                  }
                  pumpTtsQueue();
              }
          
              void clearActiveTtsResources(boolean releasePlayer) {
                  ttsRouteHandler.removeCallbacksAndMessages(null);
                  MediaPlayer player = ttsPlayer;
                  ttsPlayer = null;
                  if(player != null && releasePlayer) {
                      try { player.stop(); } catch(Exception ignored) {}
                      try { player.reset(); } catch(Exception ignored) {}
                      try { player.release(); } catch(Exception ignored) {}
                  } else if(player != null) {
                      try { player.release(); } catch(Exception ignored) {}
                  }
                  File file = activeTtsFile;
                  activeTtsFile = null;
                  if(file != null) try { if(file.exists() && !file.delete()) file.deleteOnExit(); } catch(Exception ignored) {}
                  activeTtsJob = null;
                  activeTtsSynthesisId = "";
                  activeTtsSpeakerRoute = false;
                  ttsPlaybackActive = false;
              }
          
