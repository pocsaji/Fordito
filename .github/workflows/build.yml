              void updateInterpreterRouteFromPlayer(MediaPlayer player, AudioDeviceInfo requested) {
                  if(player == null || player != ttsPlayer || !interpreterMode) return;
                  AudioDeviceInfo routed = null;
                  try { if(Build.VERSION.SDK_INT >= 23) routed = player.getRoutedDevice(); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "MediaPlayer routed device query failed", e); }
                  AudioDeviceInfo actual = routed != null ? routed : requested;
                  boolean wasSpeakerRoute = activeTtsSpeakerRoute;
                  if(actual != null && interpreterHeadsetOutputPriority(actual) >= 0) {
                      activeInterpreterRoute = "headset_output_phone_mic";
                      activeInterpreterOutputLabel = compactAudioDeviceLabel(actual);
                      activeTtsSpeakerRoute = false;
                  } else {
                      activeInterpreterRoute = "speaker_half_duplex";
                      activeInterpreterOutputLabel = actual == null ? "telefon hangszóró" : compactAudioDeviceLabel(actual);
                      activeTtsSpeakerRoute = true;
                  }
                  if(!wasSpeakerRoute && activeTtsSpeakerRoute && ttsPlaybackActive) beginHalfDuplexTtsGuard();
                  showPlannedInputRoute();
                  refreshInterpreterFloatingButton();
                  refreshOpenInterpreterMenuButton();
              }
          
              void rerouteActiveTtsPlayer() {
                  MediaPlayer player = ttsPlayer;
                  if(player == null || Build.VERSION.SDK_INT < 28) return;
                  AudioDeviceInfo target = resolveRequestedInterpreterOutputDevice();
                  if(target == null) return;
                  boolean targetIsSpeaker = target.getType() == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER;
                  if(targetIsSpeaker && ttsPlaybackActive && !activeTtsSpeakerRoute) {
                      activeTtsSpeakerRoute = true;
                      beginHalfDuplexTtsGuard();
                  }
                  try {
                      boolean accepted = player.setPreferredDevice(target);
                      if(!accepted) android.util.Log.w(LOG_TAG, "Active TTS route change rejected: " + compactAudioDeviceLabel(target));
                      ttsRouteHandler.postDelayed(() -> updateInterpreterRouteFromPlayer(player, target), 140L);
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Active TTS route change failed", e);
                  }
              }
          
              void configureInterpreterAudioRoute(boolean announce) {
                  if(!interpreterMode) { restoreNormalAudioRoute(); return; }
                  if(audioManager == null) audioManager = (AudioManager)getSystemService(AUDIO_SERVICE);
                  interpreterRouteReconfiguring = true;
                  try {
                      // Régi kommunikációs/SCO kényszerítés maradványait elengedjük. A mikrofon továbbra is
                      // külön AudioRecordon, fix TYPE_BUILTIN_MIC preferenciával működik.
                      clearLegacyCommunicationRoute();
                      preferredInterpreterInputDevice = findBuiltInInterpreterMic();
                      updatePlannedInterpreterOutputRoute();
                      rerouteActiveTtsPlayer();
                      showPlannedInputRoute();
                      refreshInterpreterFloatingButton();
                      refreshOpenInterpreterMenuButton();
                      if(announce) Toast.makeText(this, interpreterLabel(), Toast.LENGTH_SHORT).show();
                  } finally {
                      interpreterRouteReconfiguring = false;
                  }
              }
          
              void restoreNormalAudioRoute() {
                  clearLegacyCommunicationRoute();
