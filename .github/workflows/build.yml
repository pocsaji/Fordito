              boolean hasKey() {
                  return apiKey != null && apiKey.trim().startsWith("sk-");
              }

              void start(boolean withAudio) {
                  clipboardResponseMode = false;
                  if(!hasKey()) { showApi(); return; }
                  if(withAudio && (apiCode(topLang).length() == 0 || apiCode(bottomLang).length() == 0)) {
                      Toast.makeText(this, "A mikrofonhoz két konkrét nyelvet válassz; Automatikus nyelv nem használható.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if(withAudio && apiCode(topLang).equalsIgnoreCase(apiCode(bottomLang))) {
                      Toast.makeText(this, "A felső és alsó nyelv nem lehet azonos.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if(withAudio && Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) { reqMic(); return; }
                  if(withAudio) startBackgroundForegroundServiceIfAllowed();

                  connected = true;
                  client = new OkHttpClient.Builder()
                      .connectTimeout(25, TimeUnit.SECONDS)
                      .readTimeout(90, TimeUnit.SECONDS)
                      .writeTimeout(90, TimeUnit.SECONDS)
                      .build();
                  if(withAudio) {
                      // V355: minden mikrofonindítás pontosan egyszer teljesen újranyitja
                      // az AudioRecordot, a VAD-ot és a kapcsolódó puffereket.
                      resetAudioModeState();
                      state.setText("mikrofon előkészítés");
                      audioLoop();
                  } else {
                      state.setText("fordítás");
                      if(pendingManualText.length() > 0) {
                          String p = pendingManualText;
                          pendingManualText = "";
                          sendManualText(p);
                      }
                  }
                  updateButtons();
              }

              int pcm16Mono48kMs(int bytes) {
                  if(bytes <= 0) return 0;
                  return Math.max(1, (int)Math.round(bytes * 1000.0 / (AUDIO_SAMPLE_RATE * 2.0)));
              }

              String deepFilterRootCause(Throwable e) {
                  Throwable root = e;
                  while(root.getCause() != null && root.getCause() != root) root = root.getCause();
                  String message = root.getMessage();
                  if(message == null || message.trim().length() == 0) message = root.getClass().getSimpleName();
                  return message;
              }

              boolean initDeepFilterNet() {
                  synchronized(deepFilterLock) {
                      releaseDeepFilterNet();
                      deepFilterFailureShown = false;
                      lastDeepFilterFailure = "";
                      try {
                          runOnUiThread(() -> state.setText("DeepFilterNet modell betöltése"));

                          deepFilterNetInstance = DeepFilterNetBridge.createReady(getApplicationContext());
                          deepFilterNetInstance.setAttenuationLimit(DEEP_FILTER_ATTENUATION_DB);

                          deepFilterFrameBytes = (int)deepFilterNetInstance.getFrameLength();
                          if(deepFilterFrameBytes <= 0 || (deepFilterFrameBytes & 1) != 0) {
                              throw new IllegalStateException(
                                  "Érvénytelen DeepFilterNet frame: " + deepFilterFrameBytes
                              );
                          }

                          deepFilterFrameBuffer = ByteBuffer.allocateDirect(deepFilterFrameBytes)
                              .order(ByteOrder.LITTLE_ENDIAN);
                          deepFilterPending.reset();
                          runOnUiThread(() -> state.setText("DeepFilterNet aktív – 48 kHz"));
                          return true;
                      } catch(Throwable e) {
                          lastDeepFilterFailure = deepFilterRootCause(e);
                          releaseDeepFilterNet();
                          runOnUiThread(() -> {
                              state.setText("DeepFilterNet hiba");
                              if(!deepFilterFailureShown) {
                                  deepFilterFailureShown = true;
                                  Toast.makeText(
                                      MainActivity.this,
                                      "DeepFilterNet nem indult; nyers hang tartalék következik: " + lastDeepFilterFailure,
                                      Toast.LENGTH_LONG
                                  ).show();
                              }
                          });
                          return false;
                      }
                  }
              }

              void releaseDeepFilterNet() {
                  synchronized(deepFilterLock) {
                      try {
                          if(deepFilterNetInstance != null) deepFilterNetInstance.release();
                      } catch(Throwable ignored) {}
                      deepFilterNetInstance = null;
                      deepFilterFrameBytes = 0;
                      deepFilterFrameBuffer = null;
                      deepFilterPending.reset();
                  }
              }

              byte[] filterWithDeepFilterNet(byte[] data, int len) {
                  if(data == null || len <= 0) return new byte[0];
                  synchronized(deepFilterLock) {
                      if(deepFilterNetInstance == null || deepFilterFrameBytes <= 0 || deepFilterFrameBuffer == null) {
                          throw new IllegalStateException("DeepFilterNet nincs inicializálva");
                      }
                      try {
                          deepFilterPending.write(data, 0, len);
                          byte[] all = deepFilterPending.toByteArray();
                          int completeBytes = (all.length / deepFilterFrameBytes) * deepFilterFrameBytes;
                          if(completeBytes <= 0) return new byte[0];

                          ByteArrayOutputStream filtered = new ByteArrayOutputStream(completeBytes);
                          for(int pos = 0; pos < completeBytes; pos += deepFilterFrameBytes) {
                              deepFilterFrameBuffer.clear();
                              deepFilterFrameBuffer.put(all, pos, deepFilterFrameBytes);
                              deepFilterFrameBuffer.flip();

                              deepFilterNetInstance.processFrame(deepFilterFrameBuffer);

                              deepFilterFrameBuffer.position(0);
                              deepFilterFrameBuffer.limit(deepFilterFrameBytes);
                              byte[] frame = new byte[deepFilterFrameBytes];
                              deepFilterFrameBuffer.get(frame);
                              filtered.write(frame);
                          }

                          deepFilterPending.reset();
                          if(completeBytes < all.length) {
                              deepFilterPending.write(all, completeBytes, all.length - completeBytes);
                          }
                          return filtered.toByteArray();
                      } catch(Throwable e) {
                          lastDeepFilterFailure = deepFilterRootCause(e);
                          releaseDeepFilterNet();
                          runOnUiThread(() -> {
                              state.setText("DeepFilterNet feldolgozási hiba");
                              if(!deepFilterFailureShown) {
                                  deepFilterFailureShown = true;
                                  Toast.makeText(
                                      MainActivity.this,
                                      "DeepFilterNet feldolgozási hiba; nyers hang tartalék következik: " + lastDeepFilterFailure,
                                      Toast.LENGTH_LONG
                                  ).show();
                              }
                          });
                          throw new IllegalStateException("DeepFilterNet feldolgozási hiba: " + lastDeepFilterFailure, e);
                      }
                  }
              }



              static class AudioWindowPacket {
                  byte[] pcm;
                  boolean hasLeadingOverlap;
                  String languageCode;
                  boolean sourceTop;
                  String topLangCode;
                  String bottomLangCode;
                  AudioWindowPacket(byte[] pcm, boolean hasLeadingOverlap, String languageCode,
                                    boolean sourceTop, String topLangCode, String bottomLangCode) {
                      this.pcm = pcm;
                      this.hasLeadingOverlap = hasLeadingOverlap;
                      this.languageCode = languageCode == null ? "" : languageCode;
                      this.sourceTop = sourceTop;
                      this.topLangCode = topLangCode == null ? "" : topLangCode;
                      this.bottomLangCode = bottomLangCode == null ? "" : bottomLangCode;
                  }
              }

              void resetVadSegmentationState() {
                  rawVadFrameBuffer.reset();
                  filteredVadFrameBuffer.reset();
                  rawVadDecisionQueue.clear();
                  pendingSpeechEvidenceMs = 0;
                  pendingSpeechGapMs = 0;
                  trailingSilenceMs = 0;
                  clearPendingSpeechAudio();
              }

              void closeSpeechVad() {
                  try { if(speechVadInstance != null) speechVadInstance.close(); } catch(Exception ignored) {}
                  speechVadInstance = null;
                  resetVadSegmentationState();
              }

              boolean ensureSpeechVadReady() {
                  if(speechVadInstance != null) return true;
                  closeSpeechVad();
                  try {
                      speechVadInstance = Vad.builder()
                          .setSampleRate(SampleRate.SAMPLE_RATE_48K)
                          .setFrameSize(FrameSize.FRAME_SIZE_960)
                          .setMode(Mode.NORMAL)
                          .setSilenceDurationMs(100)
                          .setSpeechDurationMs(40)
                          .build();
                      return speechVadInstance != null;
                  } catch(Exception e) {
                      closeSpeechVad();
                      final String reason = deepFilterRootCause(e);
                      runOnUiThread(() -> state.setText("WebRTC VAD hiba: " + reason));
                      return false;
                  }
              }

              void queueRawVadDecisions(byte[] raw48k) {
                  if(speechVadInstance == null || raw48k == null || raw48k.length == 0) return;
                  try {
                      rawVadFrameBuffer.write(raw48k, 0, raw48k.length);
                      byte[] all = rawVadFrameBuffer.toByteArray();
                      int pos = 0;
                      while(pos + VAD_FRAME_BYTES <= all.length) {
                          byte[] frame = Arrays.copyOfRange(all, pos, pos + VAD_FRAME_BYTES);
                          rawVadDecisionQueue.add(speechVadInstance.isSpeech(frame));
                          pos += VAD_FRAME_BYTES;
                      }
                      rawVadFrameBuffer.reset();
                      if(pos < all.length) rawVadFrameBuffer.write(all, pos, all.length - pos);
                  } catch(Exception e) {
                      throw new IllegalStateException("WebRTC VAD feldolgozási hiba: " + deepFilterRootCause(e), e);
                  }
              }

              void movePendingSpeechToPreRoll() {
                  for(byte[] part : takePendingSpeechAudio()) rememberPreRollAudio(part);
                  pendingSpeechEvidenceMs = 0;
                  pendingSpeechGapMs = 0;
              }

              void handleSynchronizedVadFrame(byte[] filteredFrame, boolean speech) {
                  if(filteredFrame == null || filteredFrame.length == 0) return;
                  final int frameMs = pcm16Mono48kMs(filteredFrame.length);

                  if(voiceSendActive) {
                      appendSpeechAudioChunk(filteredFrame);
                      if(speech) {
                          trailingSilenceMs = 0;
                      } else {
                          trailingSilenceMs += frameMs;
                          if(trailingSilenceMs >= END_SILENCE_MS) {
                              voiceSendActive = false;
                              trailingSilenceMs = 0;
                              flushSpeechAudioWindow(true);
                              clearPendingSpeechAudio();
                          }
                      }
                      return;
                  }

                  if(speech) {
                      rememberPendingSpeechAudio(filteredFrame);
                      pendingSpeechEvidenceMs += frameMs;
                      pendingSpeechGapMs = 0;
                      if(pendingSpeechEvidenceMs >= SPEECH_CONFIRM_MS) {
                          for(byte[] pre : takePreRollAudio()) appendSpeechAudioChunk(pre);
                          for(byte[] pending : takePendingSpeechAudio()) appendSpeechAudioChunk(pending);
                          voiceSendActive = true;
                          pendingSpeechEvidenceMs = 0;
                          pendingSpeechGapMs = 0;
                          trailingSilenceMs = 0;
                      }
                      return;
                  }

                  if(pendingSpeechEvidenceMs > 0) {
                      rememberPendingSpeechAudio(filteredFrame);
                      pendingSpeechGapMs += frameMs;
                      if(pendingSpeechGapMs > SPEECH_CONFIRM_MAX_GAP_MS) movePendingSpeechToPreRoll();
                  } else {
                      rememberPreRollAudio(filteredFrame);
                  }
              }

              void consumeFilteredVadFrames(byte[] filtered48k) {
                  if(filtered48k == null || filtered48k.length == 0) return;
                  filteredVadFrameBuffer.write(filtered48k, 0, filtered48k.length);
                  byte[] all = filteredVadFrameBuffer.toByteArray();
                  int pos = 0;
                  while(pos + VAD_FRAME_BYTES <= all.length && !rawVadDecisionQueue.isEmpty()) {
                      byte[] frame = Arrays.copyOfRange(all, pos, pos + VAD_FRAME_BYTES);
                      boolean speech = Boolean.TRUE.equals(rawVadDecisionQueue.poll());
                      handleSynchronizedVadFrame(frame, speech);
                      pos += VAD_FRAME_BYTES;
                  }
                  filteredVadFrameBuffer.reset();
                  if(pos < all.length) filteredVadFrameBuffer.write(all, pos, all.length - pos);
              }

              void clearPreRollAudio() {
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.clear();
                      preRollAudioBytes = 0;
                  }
              }

              void rememberPreRollAudio(byte[] data) {
                  if(data == null || data.length == 0) return;
                  byte[] copy = Arrays.copyOf(data, data.length);
                  int maxBytes = AUDIO_SAMPLE_RATE * 2 * PRE_ROLL_AUDIO_MS / 1000;
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.add(copy);
                      preRollAudioBytes += copy.length;
                      while(preRollAudioBytes > maxBytes && !preRollAudioChunks.isEmpty()) {
                          byte[] old = preRollAudioChunks.poll();
                          if(old != null) preRollAudioBytes -= old.length;
                      }
                  }
              }

              ArrayList<byte[]> takePreRollAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(preRollAudioChunks) {
                      while(!preRollAudioChunks.isEmpty()) {
                          byte[] b = preRollAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      preRollAudioBytes = 0;
                  }
                  return out;
              }

              void clearPendingSpeechAudio() {
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.clear();
                      pendingSpeechAudioMs = 0;
                  }
              }

              void rememberPendingSpeechAudio(byte[] data) {
                  if(data == null || data.length == 0) return;
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.add(Arrays.copyOf(data, data.length));
                      pendingSpeechAudioMs += pcm16Mono48kMs(data.length);
                  }
              }

              int pendingSpeechAudioDurationMs() {
                  synchronized(pendingSpeechAudioChunks) { return pendingSpeechAudioMs; }
              }

              ArrayList<byte[]> takePendingSpeechAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(pendingSpeechAudioChunks) {
                      while(!pendingSpeechAudioChunks.isEmpty()) {
                          byte[] b = pendingSpeechAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      pendingSpeechAudioMs = 0;
                  }
                  return out;
              }

              void clearSpeechAudioWindow() {
                  synchronized(speechAudioWindowLock) {
                      speechAudioWindow.reset();
                      speechAudioWindowStartsWithOverlap = false;
                      speechAudioWindowTopLangCode = "";
                      speechAudioWindowBottomLangCode = "";
                      speechAudioWindowSourceTop = true;
                  }
              }

              int speechAudioWindowMs() {
                  synchronized(speechAudioWindowLock) { return pcm16Mono48kMs(speechAudioWindow.size()); }
              }

              void captureSpeechAudioWindowIdentityIfNeeded() {
                  if(speechAudioWindow.size() > 0) return;
                  speechAudioWindowSourceTop = topActive;
                  speechAudioWindowTopLangCode = code(topLang).toUpperCase(Locale.ROOT);
                  speechAudioWindowBottomLangCode = code(bottomLang).toUpperCase(Locale.ROOT);
              }

              void appendSpeechAudioChunk(byte[] chunk) {
                  if(chunk == null || chunk.length == 0 || client == null) return;
                  ArrayList<AudioWindowPacket> readyWindows = new ArrayList<>();
                  synchronized(speechAudioWindowLock) {
                      captureSpeechAudioWindowIdentityIfNeeded();
                      speechAudioWindow.write(chunk, 0, chunk.length);
                      final int windowBytes = AUDIO_SAMPLE_RATE * 2 * STT_WINDOW_MS / 1000;
                      final int overlapBytes = AUDIO_SAMPLE_RATE * 2 * STT_OVERLAP_MS / 1000;
                      final int stepBytes = windowBytes - overlapBytes;

                      while(speechAudioWindow.size() >= windowBytes) {
                          byte[] all = speechAudioWindow.toByteArray();
                          readyWindows.add(new AudioWindowPacket(
                              Arrays.copyOfRange(all, 0, windowBytes),
                              speechAudioWindowStartsWithOverlap,
                              "",
                              speechAudioWindowSourceTop,
                              speechAudioWindowTopLangCode,
                              speechAudioWindowBottomLangCode
                          ));
                          speechAudioWindow.reset();
                          if(all.length > stepBytes) {
                              speechAudioWindow.write(all, stepBytes, all.length - stepBytes);
                          }
                          speechAudioWindowStartsWithOverlap = true;
                      }
                  }
                  for(AudioWindowPacket ready : readyWindows) {
                      transcribeAudioWindow(ready.pcm, ready.hasLeadingOverlap, audioSessionId,
                          "", ready.sourceTop, ready.topLangCode, ready.bottomLangCode);
                  }
              }

              boolean flushSpeechAudioWindow(boolean force) {
                  byte[] ready = null;
                  boolean hasLeadingOverlap = false;
                  boolean sourceTop = true;
                  String topLangCode = "";
                  String bottomLangCode = "";
                  synchronized(speechAudioWindowLock) {
                      int minMs = force ? 120 : 1200;
                      int minBytes = AUDIO_SAMPLE_RATE * 2 * minMs / 1000;
                      if(speechAudioWindow.size() >= minBytes) {
                          ready = speechAudioWindow.toByteArray();
                          hasLeadingOverlap = speechAudioWindowStartsWithOverlap;
                          sourceTop = speechAudioWindowSourceTop;
                          topLangCode = speechAudioWindowTopLangCode;
                          bottomLangCode = speechAudioWindowBottomLangCode;
                      }
                      if(ready != null || force) {
                          speechAudioWindow.reset();
                          speechAudioWindowStartsWithOverlap = false;
                          speechAudioWindowTopLangCode = "";
                          speechAudioWindowBottomLangCode = "";
                          speechAudioWindowSourceTop = true;
                      }
                  }
                  if(ready != null) {
                      transcribeAudioWindow(ready, hasLeadingOverlap, audioSessionId,
                          "", sourceTop, topLangCode, bottomLangCode);
                      return true;
                  }
                  return false;
              }

              byte[] wavFromPcm48k(byte[] pcm) throws Exception {
                  int dataLen = pcm == null ? 0 : pcm.length;
                  ByteArrayOutputStream out = new ByteArrayOutputStream(44 + dataLen);
                  writeAscii(out, "RIFF"); writeIntLE(out, 36 + dataLen); writeAscii(out, "WAVE");
                  writeAscii(out, "fmt "); writeIntLE(out, 16); writeShortLE(out, 1); writeShortLE(out, 1);
                  writeIntLE(out, AUDIO_SAMPLE_RATE); writeIntLE(out, AUDIO_SAMPLE_RATE * 2); writeShortLE(out, 2); writeShortLE(out, 16);
                  writeAscii(out, "data"); writeIntLE(out, dataLen);
                  if(pcm != null) out.write(pcm);
                  return out.toByteArray();
              }

              void writeAscii(ByteArrayOutputStream out, String v) throws Exception { out.write(v.getBytes("US-ASCII")); }
              void writeIntLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); out.write((v >> 16) & 255); out.write((v >> 24) & 255); }
              void writeShortLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); }

              int sttWordCount(String text) {
                  String t = text == null ? "" : text.trim();
                  return t.length() == 0 ? 0 : t.split("\\s+").length;
              }

              boolean sttCandidateUsable(SttCandidate candidate, int audioMs) {
                  if(candidate == null || !candidate.requestOk || audioMs < 120) return false;
                  String text = candidate.text == null ? "" : candidate.text.trim();
                  if(text.length() == 0 || text.length() > 4000) return false;

                  // Csak a szélsőségesen bizonytalan eredményt dobjuk el. A V380 túl szigorú
                  // logprob- és hosszkorlátai valódi, rövid vagy zajban elmondott mondatokat is töröltek.
                  if(candidate.tokenCount > 0
                          && candidate.averageLogprob < -2.40
                          && candidate.lowLogprobRatio > 0.90) return false;
                  int words = sttWordCount(text);
                  int maxWords = Math.max(8, (int)Math.ceil(audioMs / 1000.0 * 8.0) + 8);
                  int maxChars = Math.max(60, (int)Math.ceil(audioMs / 1000.0 * 48.0) + 60);
                  return words <= maxWords && text.length() <= maxChars;
              }

              double sttCandidateScore(SttCandidate c) {
                  if(c == null) return -999.0;
                  return c.averageLogprob - (c.lowLogprobRatio * 0.45);
              }

              String normalizedCandidateText(String text) {
                  if(text == null) return "";
                  return java.text.Normalizer.normalize(text, java.text.Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "")
                      .toLowerCase(Locale.ROOT)
                      .replaceAll("[^a-z0-9]+", " ")
                      .trim();
              }

              SttCandidate chooseSttCandidate(SttPairResult pair) {
                  if(pair == null) return null;
                  return sttCandidateUsable(pair.top, pair.audioMs) ? pair.top : null;
              }

              void queueCompletedSttPair(int requestSeq, int requestGeneration, SttPairResult pair) {
                  synchronized(sttOrderLock) {
                      if(requestGeneration != sttGeneration) return;
                      pendingSttRequests = Math.max(0, pendingSttRequests - 1);
                      completedSttPairs.put(requestSeq, pair);
                  }
                  runOnUiThread(() -> drainCompletedSttPairs());
              }

              void trackSttCall(Call call) {
                  if(call == null) return;
                  synchronized(sttCallLock) { activeSttCalls.add(call); }
              }

              void untrackSttCall(Call call) {
                  if(call == null) return;
                  synchronized(sttCallLock) { activeSttCalls.remove(call); }
              }

              void cancelActiveSttCallsAndResetOrder() {
                  synchronized(sttOrderLock) {
                      sttGeneration++;
                      completedSttPairs.clear();
                      nextSttRequestSeq = 1;
                      nextSttDeliverySeq = 1;
                      pendingSttRequests = 0;
                  }
                  ArrayList<Call> calls;
                  synchronized(sttCallLock) {
                      calls = new ArrayList<>(activeSttCalls);
                      activeSttCalls.clear();
                  }
                  for(Call call : calls) {
                      try { call.cancel(); } catch(Throwable ignored) {}
                  }
              }


              void drainCompletedSttPairs() {
                  while(true) {
                      SttPairResult pair;
                      synchronized(sttOrderLock) {
                          pair = completedSttPairs.remove(nextSttDeliverySeq);
                          if(pair == null) return;
                          nextSttDeliverySeq++;
                      }
                      handleSttPairCompleted(pair);
                  }
              }

              void updateSpeechWorkState() {
                  int pending;
                  synchronized(sttOrderLock) { pending = pendingSttRequests; }
                  if(!streaming && pending == 0 && !responseInProgress && !speechTranslateMode && speechTranslateQueue.isEmpty()) {
                      state.setText("készenlét");
                  }
              }

              void handleSttPairCompleted(SttPairResult pair) {
                  if(pair == null) return;
                  SttCandidate candidate = chooseSttCandidate(pair);
                  if(candidate == null) {
                      if(streaming) state.setText("mikrofon aktív – bizonytalan blokk eldobva");
                      else updateSpeechWorkState();
                      return;
                  }

                  String transcript = prepareSttTranscript(candidate.text, pair.audioSessionId, pair.hasAudioOverlap);
                  if(transcript.length() == 0) {
                      updateSpeechWorkState();
                      return;
                  }
                  if(clearlyOutsideSelectedLanguages(transcript, pair.captureTopLangCode, pair.captureBottomLangCode)) {
                      if(streaming) state.setText("mikrofon aktív – idegen/hibás rövid blokk eldobva");
                      else updateSpeechWorkState();
                      return;
                  }

                  TextBlock b = new TextBlock();
                  b.speechSeq = ++speechSourceBlockSeq;
                  String deterministicSource = deterministicSelectedSourceLanguage(
                      transcript, pair.captureTopLangCode, pair.captureBottomLangCode);
                  b.sourceTop = deterministicSource.length() > 0
                      ? deterministicSource.equals(pair.captureTopLangCode)
                      : pair.sourceTop;
                  b.autoSttText = transcript;
                  b.sttLanguageCode = "";
                  b.captureTopLangCode = pair.captureTopLangCode;
                  b.captureBottomLangCode = pair.captureBottomLangCode;
                  b.audioSessionId = pair.audioSessionId;
                  textBlocks.add(b);
                  speechTranslateQueue.add(textBlocks.size() - 1);
                  processNextSpeechTranslation();
              }

              String overlapWord(String word) {
                  if(word == null) return "";
                  return java.text.Normalizer.normalize(word, java.text.Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "")
                      .toLowerCase(Locale.ROOT)
                      .replaceAll("[^a-z0-9]", "");
              }

              String trimSingleSttOverlap(String previous, String current) {
                  String prev = previous == null ? "" : previous.trim().replaceAll("\\s+", " ");
                  String now = current == null ? "" : current.trim().replaceAll("\\s+", " ");
                  if(prev.length() == 0 || now.length() == 0) return now;
                  String[] pw = prev.split("\\s+");
                  String[] nw = now.split("\\s+");
                  int max = Math.min(16, Math.min(pw.length, nw.length));
                  for(int n=max; n>=2; n--) {
                      boolean same = true;
                      for(int i=0; i<n; i++) {
                          String a = overlapWord(pw[pw.length - n + i]);
                          String b = overlapWord(nw[i]);
                          if(a.length() == 0 || !a.equals(b)) { same = false; break; }
                      }
                      if(same) {
                          if(n >= nw.length) return "";
                          StringBuilder out = new StringBuilder();
                          for(int i=n; i<nw.length; i++) {
                              if(out.length() > 0) out.append(' ');
                              out.append(nw[i]);
                          }
                          return out.toString().trim();
                      }
                  }
                  return now;
              }

              String prepareSttTranscript(String raw, int sessionId, boolean hasAudioOverlap) {
                  String current = cleanTranscriptForSelectedPair(raw).trim().replaceAll("\\s+", " ");
                  if(current.length() == 0) return "";
                  if(lastSttOverlapSessionId != sessionId) {
                      lastSttOverlapSessionId = sessionId;
                      lastSttTranscriptForOverlap = "";
                  }
                  String result = hasAudioOverlap
                      ? trimSingleSttOverlap(lastSttTranscriptForOverlap, current)
                      : current;
                  lastSttTranscriptForOverlap = current;
                  return result;
              }


              void requestSttCandidate(byte[] wav, String languageCode, int index, SttCandidateCallback callback) {
                  SttCandidate failed = new SttCandidate();
                  failed.language = "";
                  try {
                      MultipartBody.Builder builder = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("model", "gpt-4o-transcribe")
                          .addFormDataPart("response_format", "json")
                          .addFormDataPart("temperature", "0")
                          .addFormDataPart("chunking_strategy", "auto")
                          .addFormDataPart("include[]", "logprobs");
                      String apiLanguage = apiCode(languageCode);
                      if(apiLanguage.length() > 0) builder.addFormDataPart("language", apiLanguage);
                      builder.addFormDataPart("file", "speech.wav", RequestBody.create(MediaType.parse("audio/wav"), wav));
                      MultipartBody body = builder.build();
                      Request req = new Request.Builder().url("https://api.openai.com/v1/audio/transcriptions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .post(body).build();
                      final Call[] callRef = new Call[1];
                      callRef[0] = client.newCall(req);
                      trackSttCall(callRef[0]);
                      callRef[0].enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              untrackSttCall(call);
                              callback.done(index, failed);
                          }
                          @Override public void onResponse(Call call, Response response) {
                              untrackSttCall(call);
                              SttCandidate candidate = new SttCandidate();
                              candidate.language = "";
                              try {
                                  String raw = response.body() == null ? "" : response.body().string();
                                  if(response.isSuccessful()) {
                                      JSONObject obj = new JSONObject(raw);
                                      candidate.text = obj.optString("text", "").trim();
                                      JSONArray logprobs = obj.optJSONArray("logprobs");
                                      if(logprobs != null && logprobs.length() > 0) {
                                          double sum = 0.0;
                                          int low = 0;
                                          int count = 0;
                                          for(int i = 0; i < logprobs.length(); i++) {
                                              JSONObject token = logprobs.optJSONObject(i);
                                              if(token == null || !token.has("logprob")) continue;
                                              double lp = token.optDouble("logprob", -99.0);
                                              if(!Double.isFinite(lp)) continue;
                                              sum += lp;
                                              if(lp < -1.25) low++;
                                              count++;
                                          }
                                          candidate.tokenCount = count;
                                          if(count > 0) {
                                              candidate.averageLogprob = sum / count;
                                              candidate.lowLogprobRatio = low / (double)count;
                                          }
                                      }
                                      candidate.requestOk = candidate.text.length() > 0;
                                  }
                              } catch(Exception ignored) {
                                  candidate.requestOk = false;
                              }
                              callback.done(index, candidate);
                          }
                      });
                  } catch(Exception e) {
                      callback.done(index, failed);
                  }
              }

              void transcribeAudioWindow(byte[] pcm, boolean hasAudioOverlap, int sessionId,
                                         String languageCode, boolean sourceTop,
                                         String topLangCode, String bottomLangCode) {
                  if(pcm == null || pcm.length == 0 || client == null || !hasKey()) return;
                  try {
                      final byte[] wav = wavFromPcm48k(pcm);
                      final int audioMs = pcm16Mono48kMs(pcm.length);
                      final int requestSeq;
                      final int requestGeneration;
                      synchronized(sttOrderLock) {
                          requestSeq = nextSttRequestSeq++;
                          requestGeneration = sttGeneration;
                          pendingSttRequests++;
                      }

                      // Egyetlen, nyelvre nem kényszerített STT-kérés. A V380 ugyanazt a hangot
                      // kétszer, két külön nyelvre kényszerítve küldte el, majd közeli pontszámnál
                      // a teljes blokkot eldobta. Ez okozta a hiányzó mondatok jelentős részét.
                      requestSttCandidate(wav, "", 0, (index, candidate) -> {
                          SttPairResult pair = new SttPairResult();
                          pair.top = candidate;
                          pair.bottom = null;
                          pair.hasAudioOverlap = hasAudioOverlap;
                          pair.audioMs = audioMs;
                          pair.audioSessionId = sessionId;
                          pair.sourceTop = sourceTop;
                          pair.captureTopLangCode = topLangCode;
                          pair.captureBottomLangCode = bottomLangCode;
                          queueCompletedSttPair(requestSeq, requestGeneration, pair);
                      });
                  } catch(Exception e) {
                      runOnUiThread(() -> Toast.makeText(this, "STT előkészítési hiba: " + deepFilterRootCause(e), Toast.LENGTH_LONG).show());
                  }
              }



