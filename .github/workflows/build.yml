                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String cleaned = normalizeSentenceLineLayout(restoreGlossaryTerms(
                                      obj.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", ""), arrangeProtection
                                  ));
                                  if(cleaned.length() == 0) throw new JSONException("Empty cleanup response");
                                  String sourceForLengthCheck = sourceText.replaceAll("\\s+", "");
                                  String cleanedForLengthCheck = cleaned.replaceAll("\\s+", "");
                                  if(sourceForLengthCheck.length() >= 80 && cleanedForLengthCheck.length() * 5 < sourceForLengthCheck.length())
                                      throw new JSONException("Suspiciously incomplete cleanup response");
                                  runOnUiThread(() -> {
                                      if(!isManualWindowRequestCurrent(requestToken)) return;
                                      if(!source.getText().toString().equals(arrangeSourceSnapshot)) {
                                          finishManualWindowRequest(requestToken);
                                          Toast.makeText(MainActivity.this, "A forrásszöveg közben megváltozott; a régi rendezést nem írtam be.", Toast.LENGTH_LONG).show();
                                          updateButtons();
                                          return;
                                      }
                                      finishManualWindowRequest(requestToken);
                                      programmaticChange = true;
                                      try {
                                          source.setText(cleaned);
                                          source.setSelection(source.getText().length());
                                      } finally {
                                          programmaticChange = false;
                                      }
                                      rebuildBlocksFromCurrentBoxes(arrangeSourceTop);
                                      try {
                                          android.content.ClipboardManager cm = (android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                                          cm.setPrimaryClip(ClipData.newPlainText("rendezett_szoveg", cleaned));
                                      } catch(Exception ignored) {}
                                      updateButtons();
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(() -> {
                                      if(!isManualWindowRequestCurrent(requestToken)) return;
                                      finishManualWindowRequest(requestToken);
                                      updateButtons();
                                      Toast.makeText(MainActivity.this, "Rendezés válasz hiba.", Toast.LENGTH_LONG).show();
                                  });
                              }
                          }
                      });
                  } catch(Exception e) {
                      if(isManualWindowRequestCurrent(requestToken)) finishManualWindowRequest(requestToken);
                      updateButtons();
                      Toast.makeText(this, "Rendezés hiba.", Toast.LENGTH_LONG).show();
                  }
              }
          
