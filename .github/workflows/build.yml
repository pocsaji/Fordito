name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/attila/forditokonzol
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ForditoKonzol"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.attila.forditokonzol"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.attila.forditokonzol"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Fordító Konzol"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/attila/forditokonzol/MainActivity.java <<'EOF'
          package com.attila.forditokonzol;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private TextView stateView;
              private EditText topText;
              private EditText bottomText;
              private Button micButton;
              private Button pauseButton;
              private Button translateButton;
              private Button topLangButton;
              private Button bottomLangButton;

              private SpeechRecognizer speechRecognizer;
              private Intent speechIntent;

              private boolean listening = false;
              private boolean paused = false;
              private boolean topIsActive = true;

              private String topLangCode = "hu-HU";
              private String bottomLangCode = "fr-FR";

              private final String[][] languages = {
                      {"Magyar", "HU", "hu-HU"},
                      {"Francia", "FR", "fr-FR"},
                      {"Angol", "EN", "en-US"},
                      {"Német", "DE", "de-DE"},
                      {"Olasz", "IT", "it-IT"},
                      {"Spanyol", "ES", "es-ES"},
                      {"Román", "RO", "ro-RO"},
                      {"Horvát", "HR", "hr-HR"},
                      {"Szlovák", "SK", "sk-SK"},
                      {"Szlovén", "SL", "sl-SI"}
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUserInterface();
                  requestMicrophonePermissionIfNeeded();
                  initializeSpeechRecognizer();
              }

              private void buildUserInterface() {
                  int background = Color.rgb(16, 19, 24);
                  int panel = Color.rgb(27, 32, 41);
                  int text = Color.rgb(242, 244, 248);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(14, 28, 14, 90);
                  root.setBackgroundColor(background);
                  setContentView(root);

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("Fordító Konzol v0.2");
                  title.setTextColor(Color.LTGRAY);
                  title.setTextSize(13);
                  title.setSingleLine(true);

                  stateView = new TextView(this);
                  stateView.setText("készenlét");
                  stateView.setTextColor(Color.LTGRAY);
                  stateView.setGravity(Gravity.RIGHT);
                  stateView.setTextSize(13);
                  stateView.setSingleLine(true);

                  topBar.addView(title, new LinearLayout.LayoutParams(0, 36, 1));
                  topBar.addView(stateView, new LinearLayout.LayoutParams(0, 36, 1));
                  root.addView(topBar);

                  topText = createTextBox("FELSŐ ABLAK", panel, text);
                  bottomText = createTextBox("ALSÓ ABLAK", panel, text);

                  root.addView(topText, new LinearLayout.LayoutParams(-1, 0, 1));
                  root.addView(bottomText, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout controlRow = new LinearLayout(this);
                  controlRow.setOrientation(LinearLayout.HORIZONTAL);

                  micButton = createButton("MIKROFON");
                  pauseButton = createButton("SZÜNET");
                  translateButton = createButton("FORDÍT");

                  controlRow.addView(micButton, new LinearLayout.LayoutParams(0, 60, 1));
                  controlRow.addView(pauseButton, new LinearLayout.LayoutParams(0, 60, 1));
                  controlRow.addView(translateButton, new LinearLayout.LayoutParams(0, 60, 1));
                  root.addView(controlRow);

                  LinearLayout languageRow = new LinearLayout(this);
                  languageRow.setOrientation(LinearLayout.HORIZONTAL);

                  topLangButton = createButton("FELSŐ: HU");
                  bottomLangButton = createButton("ALSÓ: FR");

                  languageRow.addView(topLangButton, new LinearLayout.LayoutParams(0, 60, 1));
                  languageRow.addView(bottomLangButton, new LinearLayout.LayoutParams(0, 60, 1));
                  root.addView(languageRow);

                  topText.setOnFocusChangeListener((v, hasFocus) -> {
                      if (hasFocus) {
                          topIsActive = true;
                          setPaused(true);
                      }
                      updateButtons();
                  });

                  bottomText.setOnFocusChangeListener((v, hasFocus) -> {
                      if (hasFocus) {
                          topIsActive = false;
                          setPaused(true);
                      }
                      updateButtons();
                  });

                  topText.setOnClickListener(v -> { topIsActive = true; setPaused(true); updateButtons(); });
                  bottomText.setOnClickListener(v -> { topIsActive = false; setPaused(true); updateButtons(); });

                  topText.setOnEditorActionListener((v, actionId, event) -> handleEditorDone(actionId));
                  bottomText.setOnEditorActionListener((v, actionId, event) -> handleEditorDone(actionId));

                  topLangButton.setOnClickListener(v -> chooseLanguage(true));
                  bottomLangButton.setOnClickListener(v -> chooseLanguage(false));

                  micButton.setOnClickListener(v -> startSingleRecognition());

                  pauseButton.setOnClickListener(v -> setPaused(!paused));

                  translateButton.setOnClickListener(v ->
                          Toast.makeText(this, "Ez még mikrofonteszt. A fordítás a következő verzió.", Toast.LENGTH_LONG).show()
                  );

                  updateButtons();
              }

              private EditText createTextBox(String hint, int panelColor, int textColor) {
                  EditText box = new EditText(this);
                  box.setHint(hint);
                  box.setTextColor(textColor);
                  box.setHintTextColor(Color.GRAY);
                  box.setTextSize(22);
                  box.setGravity(Gravity.TOP | Gravity.START);
                  box.setSingleLine(false);
                  box.setMinLines(5);
                  box.setBackgroundColor(panelColor);
                  box.setPadding(14, 14, 14, 14);
                  box.setImeOptions(EditorInfo.IME_ACTION_DONE);
                  return box;
              }

              private Button createButton(String label) {
                  Button button = new Button(this);
                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setAllCaps(false);
                  button.setTextSize(13);
                  button.setPadding(2, 2, 2, 2);
                  return button;
              }

              private void requestMicrophonePermissionIfNeeded() {
                  if (Build.VERSION.SDK_INT >= 23 &&
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1001);
                  }
              }

              private void initializeSpeechRecognizer() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      stateView.setText("nincs beszédfelismerő");
                      return;
                  }

                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);

                  speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);

                  speechRecognizer.setRecognitionListener(new RecognitionListener() {
                      @Override public void onReadyForSpeech(Bundle params) {
                          stateView.setText("hallgat");
                          listening = true;
                          updateButtons();
                      }

                      @Override public void onBeginningOfSpeech() {
                          stateView.setText("beszéd");
                      }

                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}

                      @Override public void onEndOfSpeech() {
                          stateView.setText("feldolgozás");
                      }

                      @Override public void onError(int error) {
                          listening = false;
                          stateView.setText("áll");
                          updateButtons();
                      }

                      @Override public void onResults(Bundle results) {
                          listening = false;
                          ArrayList<String> recognized = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (recognized != null && !recognized.isEmpty()) {
                              appendRecognizedText(recognized.get(0));
                          }
                          stateView.setText("készenlét");
                          updateButtons();
                      }

                      @Override public void onPartialResults(Bundle partialResults) {
                          ArrayList<String> recognized = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (recognized != null && !recognized.isEmpty()) {
                              stateView.setText(shorten(recognized.get(0)));
                          }
                      }

                      @Override public void onEvent(int eventType, Bundle params) {}
                  });
              }

              private void startSingleRecognition() {
                  if (paused) {
                      Toast.makeText(this, "Szünet aktív. Előbb nyomd meg: SZÜNET", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  if (speechRecognizer == null) {
                      Toast.makeText(this, "Nincs elérhető beszédfelismerő motor.", Toast.LENGTH_LONG).show();
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 23 &&
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestMicrophonePermissionIfNeeded();
                      return;
                  }

                  if (listening) {
                      speechRecognizer.stopListening();
                      listening = false;
                      stateView.setText("leállítva");
                      updateButtons();
                      return;
                  }

                  String activeLanguage = topIsActive ? topLangCode : bottomLangCode;
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, activeLanguage);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, activeLanguage);

                  try {
                      speechRecognizer.startListening(speechIntent);
                  } catch (Exception ex) {
                      listening = false;
                      stateView.setText("indítási hiba");
                      updateButtons();
                  }
              }

              private void appendRecognizedText(String text) {
                  EditText target = topIsActive ? topText : bottomText;
                  String old = target.getText().toString().trim();

                  if (old.isEmpty()) target.setText(text);
                  else target.setText(old + "\n" + text);

                  target.setSelection(target.getText().length());
              }

              private void setPaused(boolean value) {
                  paused = value;
                  if (paused && listening && speechRecognizer != null) {
                      speechRecognizer.stopListening();
                      listening = false;
                  }
                  stateView.setText(paused ? "szünet / javítás" : "készenlét");
                  updateButtons();
              }

              private boolean handleEditorDone(int actionId) {
                  if (actionId == EditorInfo.IME_ACTION_DONE) {
                      topText.clearFocus();
                      bottomText.clearFocus();
                      setPaused(false);
                      return true;
                  }
                  return false;
              }

              private void chooseLanguage(boolean top) {
                  String[] labels = new String[languages.length];
                  for (int i = 0; i < languages.length; i++) labels[i] = languages[i][0] + " (" + languages[i][1] + ")";

                  new AlertDialog.Builder(this)
                          .setTitle(top ? "Felső ablak nyelve" : "Alsó ablak nyelve")
                          .setItems(labels, (dialog, which) -> {
                              if (top) {
                                  topLangCode = languages[which][2];
                                  topIsActive = true;
                              } else {
                                  bottomLangCode = languages[which][2];
                                  topIsActive = false;
                              }
                              updateButtons();
                          })
                          .show();
              }

              private void updateButtons() {
                  micButton.setText(listening ? "STOP" : "MIKROFON");
                  micButton.setBackgroundColor(listening ? Color.rgb(30, 130, 70) : Color.rgb(90, 50, 50));

                  pauseButton.setText(paused ? "FOLYTAT" : "SZÜNET");
                  pauseButton.setBackgroundColor(paused ? Color.rgb(160, 90, 30) : Color.rgb(55, 60, 70));

                  translateButton.setBackgroundColor(Color.rgb(55, 60, 70));

                  topLangButton.setText("FELSŐ: " + codeOf(topLangCode));
                  bottomLangButton.setText("ALSÓ: " + codeOf(bottomLangCode));

                  topLangButton.setBackgroundColor(topIsActive ? Color.rgb(60, 95, 150) : Color.rgb(55, 60, 70));
                  bottomLangButton.setBackgroundColor(!topIsActive ? Color.rgb(60, 95, 150) : Color.rgb(55, 60, 70));
              }

              private String codeOf(String langCode) {
                  for (String[] lang : languages) {
                      if (lang[2].equals(langCode)) return lang[1];
                  }
                  return langCode.toUpperCase(Locale.ROOT);
              }

              private String shorten(String text) {
                  if (text == null) return "";
                  if (text.length() <= 16) return text;
                  return text.substring(0, 16) + "...";
              }

              @Override
              protected void onDestroy() {
                  if (speechRecognizer != null) speechRecognizer.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForditoKonzol-MicTest-v02-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
