                    .setPositiveButton("Igen", (d,w) -> { sessionStart = System.currentTimeMillis(); start(true); })
                    .setNegativeButton("Leállítás", (d,w) -> { sessionStart = 0L; stop(); })
                    .show();
              }

              void menu() {
                  CharSequence[] items = {
                      menuItem("OpenAI API kulcs", "", false),
                      menuItem("AI modell", modelLabel(), false),
                      menuItem("Beszélgetési profil", profileLabel(), false),
                      menuItem("Fordítási mód", modeLabel(), false),
                      menuItem("Semantic VAD", vadLabel(), false),
