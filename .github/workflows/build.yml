              int scoreTextForSelectedLang(String text, String lang) {
                  if(text == null || text.trim().isEmpty()) return 0;
                  String l = lang == null ? "" : lang.toLowerCase(Locale.ROOT);
                  String normalized = normalizedLanguageText(text);
                  if(normalized.isEmpty()) return 0;
                  int score = scoreShortReplyForSelectedLang(text, l);
                  HashSet<String> common = commonLanguageWords(l);
                  String[] tokens = normalized.split("\\s+");
                  int matched = 0;
                  for(String token : tokens) {
                      if(token.length() >= 2 && common.contains(token)) { score += 3; matched++; }
                  }
                  String original = text.toLowerCase(Locale.ROOT);
                  if("hu".equals(l)) {
                      if(original.matches(".*[őű].*")) score += 5;
                      for(String token : tokens) if(token.matches(".*(ban|ben|nak|nek|val|vel|rol|rol|bol|bol|kent|unk|unk)$")) score++;
                  } else if("fr".equals(l)) {
                      if(original.matches(".*[àâçèéêëîïôùûüÿœ].*")) score += 4;
                      if(original.contains("l'") || original.contains("d'") || original.contains("qu'")) score += 2;
                      for(String token : tokens) if(token.matches(".*(tion|ment|euse|eux|ais|ait|ez|ons)$")) score++;
                  } else if("de".equals(l) && original.matches(".*[äöüß].*")) score += 5;
                  else if("ro".equals(l) && original.matches(".*[ăâîșşțţ].*")) score += 5;
                  else if("hr".equals(l) && original.matches(".*[čćđšž].*")) score += 5;
                  else if("sk".equals(l) && original.matches(".*[äčďĺľňôŕšťýž].*")) score += 5;
                  else if("sl".equals(l) && original.matches(".*[čšž].*")) score += 4;
                  if(tokens.length >= 4 && matched >= 2) score += 2;
                  return score;
              }
          
              String selectedPairLanguageCode(String text) {
                  String top = code(topLang).toLowerCase(Locale.ROOT);
                  String bottom = code(bottomLang).toLowerCase(Locale.ROOT);
                  int topScore = scoreTextForSelectedLang(text, top);
                  int bottomScore = scoreTextForSelectedLang(text, bottom);
                  if(topScore >= 5 && topScore >= bottomScore + 3) return top;
                  if(bottomScore >= 5 && bottomScore >= topScore + 3) return bottom;
                  if(topScore >= 3 && bottomScore == 0) return top;
                  if(bottomScore >= 3 && topScore == 0) return bottom;
                  return "";
              }
          
              boolean sourceIsTopBySelectedPair(String text, boolean fallback) {
                  String detected = selectedPairLanguageCode(text);
                  if(detected.isEmpty()) return fallback;
                  return detected.equalsIgnoreCase(code(topLang));
              }
          
              boolean looksLikeProperNameOrNumberFragment(String text) {
                  if(text == null) return false;
                  String raw = text.trim();
                  if(raw.length() == 0) return false;
                  String[] words = raw.split("\\s+");
                  if(words.length > 4) return false;
                  boolean hasNameSignal = false;
                  for(String word : words) {
                      String letters = word.replaceAll("[^\\p{L}0-9]", "");
                      if(letters.length() == 0) continue;
                      if(letters.matches(".*\\d.*") || Character.isUpperCase(letters.charAt(0)) || letters.equals(letters.toUpperCase(Locale.ROOT)))
                          hasNameSignal = true;
                      else return false;
                  }
                  return hasNameSignal;
              }
          
              boolean locallySupportsLanguageCode(String text, String languageCode) {
                  if(text == null || languageCode == null) return false;
                  String ai = languageCode.toLowerCase(Locale.ROOT);
                  String detected = selectedPairLanguageCode(text);
                  if(!detected.isEmpty()) return detected.equalsIgnoreCase(ai);
                  if(looksLikeObviousThirdLanguageNoise(text)) return false;
          
                  int aiScore = scoreTextForSelectedLang(text, ai);
                  if(aiScore >= 3) return true;
                  if(looksLikeProperNameOrNumberFragment(text)) return true;
          
                  String normalized = normalizedLanguageText(text);
                  int words = normalized.isEmpty() ? 0 : normalized.split("\\s+").length;
                  int otherBest = 0;
                  String[] supported = {"hu","fr","en","de","it","es","ro","hr","sk","sl"};
                  for(String lang : supported) {
                      if(lang.equals(ai)) continue;
                      otherBest = Math.max(otherBest, scoreTextForSelectedLang(text, lang));
                  }
                  // Az UNKNOWN menekülőutat tartalmazó AI-nyelvdöntést két vagy több szónál
                  // elfogadjuk, ha nincs másik ismert nyelvre utaló helyi bizonyíték. Egyetlen
                  // ismeretlen közszó továbbra is túl bizonytalan; név/szám külön ágon engedhető.
                  return words >= 2 && otherBest < 3;
              }
          
              boolean looksLikeNonFrHuNoise(String text) { return looksLikeObviousThirdLanguageNoise(text); }
          
              boolean isLikelyNoisyTranscriptBlock(String block) {
                  if(block == null) return true;
                  String t = cleanTranscriptForSelectedPair(block).trim();
                  if(t.isEmpty() || looksLikeInternalLeak(t)) return true;
                  int letters = 0;
                  int symbols = 0;
                  for(int i=0;i<t.length();i++) {
                      char c = t.charAt(i);
                      if(Character.isLetterOrDigit(c)) letters++;
                      else if(!Character.isWhitespace(c)) symbols++;
                  }
                  if(letters == 0 || (symbols > 8 && symbols > letters)) return true;
                  String normalized = normalizedLanguageText(t);
                  if(normalized.isEmpty()) return true;
                  String[] tokens = normalized.split("\\s+");
                  int oneChar = 0;
                  int longestRepeat = 1;
                  int currentRepeat = 1;
                  for(int i=0;i<tokens.length;i++) {
                      if(tokens[i].length() == 1) oneChar++;
                      if(i > 0 && tokens[i].equals(tokens[i-1])) currentRepeat++;
                      else currentRepeat = 1;
                      longestRepeat = Math.max(longestRepeat, currentRepeat);
                  }
                  if(longestRepeat >= 4) return true;
                  if(tokens.length >= 6 && oneChar * 2 >= tokens.length) return true;
                  return looksLikeObviousThirdLanguageNoise(t);
              }
          
              String trimRecentSpeechBlockOverlap(String block) {
                  if(block == null) return "";
                  String raw = block.trim().replaceAll("\\s+", " ");
                  String h = normalizeSpeechBlockHash(raw);
                  if(h.length() < 8) return raw;
                  String[] nw = h.split("\\s+");
                  String[] rawWords = raw.split("\\s+");
          
                  for(String old : recentSpeechBlockHashOrder) {
                      if(old == null || old.length() < 8) continue;
                      String[] ow = old.split("\\s+");
                      if(ow.length < 2 || nw.length < 2) continue;
          
                      // Ha a régi blokk teljes egészében az új blokk elején ismétlődik,
                      // csak ezt az eleji ismétlést vágjuk le, az új folytatást megtartjuk.
                      int fullOld = Math.min(ow.length, nw.length);
                      if(fullOld >= 3) {
                          boolean oldAtStart = true;
                          for(int i=0; i<fullOld; i++) {
                              if(!ow[i].equals(nw[i])) { oldAtStart = false; break; }
                          }
                          if(oldAtStart && fullOld < rawWords.length) {
                              StringBuilder sb = new StringBuilder();
                              for(int i=fullOld; i<rawWords.length; i++) {
                                  if(sb.length() > 0) sb.append(' ');
                                  sb.append(rawWords[i]);
                              }
                              return sb.toString().trim();
                          }
                      }
          
                      int maxN = Math.min(10, Math.min(ow.length, nw.length));
                      for(int n=maxN; n>=2; n--) {
                          boolean suffixPrefix = true;
                          for(int i=0; i<n; i++) {
                              if(!ow[ow.length-n+i].equals(nw[i])) { suffixPrefix = false; break; }
                          }
                          if(suffixPrefix) {
                              if(n >= rawWords.length) return "";
                              StringBuilder sb = new StringBuilder();
                              for(int i=n; i<rawWords.length; i++) {
                                  if(sb.length() > 0) sb.append(' ');
                                  sb.append(rawWords[i]);
                              }
                              return sb.toString().trim();
                          }
                      }
                  }
                  return raw;
              }
          
              boolean markSpeechBlockQueued(String block) {
                  String h = normalizeSpeechBlockHash(block);
                  if(h.length() < 3) return false;
                  if(recentSpeechBlockHashes.contains(h)) return false;
                  rememberSpeechBlockHash(h);
                  return true;
              }
          
              boolean isRecentlySimilarSpeechBlock(String h) {
                  if(h == null || h.length() < 8) return false;
                  String[] a = h.split("\\s+");
          
                  for(String old : recentSpeechBlockHashOrder) {
                      if(old == null || old.length() < 8) continue;
                      int min = Math.min(h.length(), old.length());
                      int max = Math.max(h.length(), old.length());
          
                      // Nem hanghoz nyúlunk, csak az utolsó blokkokkal való szöveg-átfedést fogjuk meg.
                      if(min >= 10 && (h.contains(old) || old.contains(h)) && (min * 100 / Math.max(1, max)) >= 58) return true;
          
                      String[] b = old.split("\\s+");
          
                      // Az új blokk eleje sokszor az előző blokk vége. Ez tipikus duplázási minta.
                      if(a.length >= 2 && b.length >= 2) {
                          int maxN = Math.min(5, Math.min(a.length, b.length));
                          for(int n=maxN; n>=2; n--) {
                              boolean suffixPrefix = true;
                              for(int i=0; i<n; i++) {
                                  if(!b[b.length-n+i].equals(a[i])) { suffixPrefix = false; break; }
                              }
                              if(suffixPrefix) continue;
          
                              boolean prefixSuffix = true;
                              for(int i=0; i<n; i++) {
                                  if(!a[a.length-n+i].equals(b[i])) { prefixSuffix = false; break; }
                              }
                              if(prefixSuffix) return true;
                          }
                      }
          
                      if(a.length >= 3 && b.length >= 3) {
                          HashSet<String> sa = new HashSet<>(Arrays.asList(a));
                          HashSet<String> sb = new HashSet<>(Arrays.asList(b));
                          int common = 0;
                          for(String w : sa) if(sb.contains(w)) common++;
                          int small = Math.min(sa.size(), sb.size());
                          int large = Math.max(sa.size(), sb.size());
                          if(small >= 3 && common * 100 / Math.max(1, small) >= 80 && small * 100 / Math.max(1, large) >= 65) return true;
                      }
                  }
                  return false;
              }
          
              String normalizeSpeechBlockHash(String block) {
                  if(block == null) return "";
                  return block.toLowerCase(Locale.ROOT)
                          .replaceAll("[\\p{Punct}\\s]+", " ")
                          .trim();
              }
          
              String popReadySpeechBlock(boolean flushAll) {
                  String s = speechTranscriptBuffer == null ? "" : speechTranscriptBuffer;
                  if(s.trim().length() == 0) { speechTranscriptBuffer = ""; return null; }
          
                  int cut = findSpeechBlockCut(s, flushAll);
                  if(cut < 0) return null;
          
                  String out = s.substring(0, cut).trim();
                  speechTranscriptBuffer = s.substring(cut).trim();
                  speechBufferStartedAt = speechTranscriptBuffer.length() > 0 ? System.currentTimeMillis() : 0L;
                  firstSpeechHeardAt = speechTranscriptBuffer.length() > 0 ? System.currentTimeMillis() : 0L;
                  return out;
              }
          
              int findSpeechBlockCut(String s, boolean flushAll) {
                  if(s == null) return -1;
                  String t = s.trim();
                  if(t.length() == 0) return -1;
          
                  // V318: egyszerű blokkhatár-döntés.
                  // Ha van kész mondatvég, azonnal zár.
                  // Ha nincs, 2 mp folyamatos puffer után szóhatáron zár.
                  // Nincs karakter-, vessző-, szótár- vagy többágú monológlogika.
                  int cut = firstHardSentenceEnd(s);
                  if(cut >= 0) return cut;
          
                  cut = smartLinguisticCut(s);
                  if(cut >= 0) return cut;
          
                  long age = firstSpeechHeardAt > 0L ? System.currentTimeMillis() - firstSpeechHeardAt : 0L;
                  if(age >= FALLBACK_TEXT_MAX_WAIT_MS) {
                      int forced = safeWholeBufferFlushCut(s);
                      return forced >= 0 ? forced : s.length();
                  }
          
                  if(flushAll) return safeWholeBufferFlushCut(s);
          
                  return -1;
              }
          
              int safeWholeBufferFlushCut(String s) {
                  if(s == null) return -1;
                  String t = s.trim();
                  if(t.length() == 0) return -1;
          
                  int words = t.split("\\s+").length;
          
                  // V318: 1-5 szavas puffer esetén nincs szótár, nincs nyelvtani kapu,
                  // nincs "hátha majd mondat lesz" várakozás. A meglévő completed/idle esemény
                  // kiadja, ami bent van. Ez javítja az igen/nem/működik jellegű beragadást.
                  if(words <= 5) return s.length();
                  return s.length();
              }
          
              int lastWhitespaceBeforeLastToken(String s) {
                  if(s == null) return -1;
                  int end = s.length() - 1;
                  while(end >= 0 && Character.isWhitespace(s.charAt(end))) end--;
                  if(end < 0) return -1;
                  int i = end;
                  while(i >= 0 && !Character.isWhitespace(s.charAt(i))) i--;
                  return i >= 0 ? i + 1 : -1;
              }
          
              boolean hasPossiblyUnstableTrailingToken(String text) {
                  if(text == null) return false;
                  String t = text.trim();
                  if(t.length() == 0) return false;
                  char lastCh = t.charAt(t.length() - 1);
                  if(lastCh == '.' || lastCh == '!' || lastCh == '?' || lastCh == '…' || lastCh == ',' || lastCh == ';' || lastCh == ':') return false;
                  int sp = Math.max(Math.max(t.lastIndexOf(' '), t.lastIndexOf('\n')), t.lastIndexOf('\t'));
                  if(sp < 0) return false;
                  String last = t.substring(sp + 1).replaceAll("[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰàâçèéêëîïôùûüÿñæœßÀÂÇÈÉÊËÎÏÔÙÛÜŸÑÆŒ]", "");
                  if(last.length() == 0) return false;
                  if(last.length() <= 2) return true;
                  // A szóköz nélküli Blokkos szófolytatások tipikusan rövid/közepes tokenként
                  // érkeznek. Nem nyelvi szótár, csak az utolsó, friss token védelme.
                  return last.length() <= 8;
              }
          
              boolean shouldFlushShortIdleBlock(String s) {
                  // V318: kompatibilitási segédfüggvény. A blokkzárás fő döntése már a
                  // findSpeechBlockCut(flushAll) ágban történik, ezért itt nincs szótár és nincs
                  // nyelvtani visszatartás. Rövid puffer idle esetén kiadható.
                  if(s == null) return false;
                  String t = s.trim();
                  if(t.length() == 0) return false;
                  int words = t.split("\\s+").length;
                  long age = firstSpeechHeardAt > 0L ? System.currentTimeMillis() - firstSpeechHeardAt : 0L;
                  return age >= 1000 && words <= 5;
              }
          
              boolean shouldForceFlushWholeBuffer(String s) {
                  // V318: nincs külön nyelvtani kapu. Completed/idle esetén a központi
                  // safeWholeBufferFlushCut dönt, ezért ez csak régi hívásokhoz marad egyszerűen.
                  return s != null && s.trim().length() > 0;
              }
          
              boolean looksLikeDanglingSpeechFragment(String text) {
                  if(text == null) return true;
                  String x = text.trim();
                  if(x.length() == 0) return true;
                  String l = x.toLowerCase(Locale.ROOT).replaceAll("\\s+", " ").trim();
                  if(l.endsWith(",") || l.endsWith(";") || l.endsWith(":")) return true;
                  String[] dangling = {
                      " a", " az", " egy", " hogy", " ha", " amikor", " akkor", " majd", " és", " vagy", " illetve", " de", " mert", " tehát", " szerint", " lehet", " kellene", " annak", " arra", " ezt", " azt", " ne", " be", " ki", " fel", " le",
                      " le", " la", " les", " de", " des", " du", " que", " qui", " qu", " si", " alors", " mais", " puis", " lorsque", " parce", " pour", " dans", " à", " au", " aux",
                      " the", " a", " an", " to", " of", " for", " and", " or", " but", " if", " when", " because", " with"
                  };
                  for(String d: dangling) if(l.endsWith(d)) return true;
                  String last = l;
                  int sp = l.lastIndexOf(' ');
                  if(sp >= 0) last = l.substring(sp + 1);
                  if(last.length() <= 2) return true;
                  return false;
              }
          
              int firstHardSentenceEnd(String s) {
                  for(int i=0;i<s.length();i++) {
                      char ch = s.charAt(i);
                      if(ch == '.' || ch == '!' || ch == '?' || ch == '…' || ch == '\n') return i + 1;
                  }
                  return -1;
              }
          
              int smartLinguisticCut(String s) {
                  int len = s.length();
                  if(len < 85) return -1;
          
                  String lower = s.toLowerCase(Locale.ROOT);
                  int preferredEnd = Math.min(len, 185);
                  int preferredStart = Math.min(len, 75);
          
                  // V318: V318 alap, de kevésbé engedékeny hosszú blokkoknál.
                  // Nem audio, nem VAD, nem időzítő. Csak a már beérkezett szöveg stabil elejét vágjuk le,
                  // hogy hosszú folyamatos beszédnél se legyen egyetlen óriás blokk.
          
                  // 1) Erős gondolatváltók. Itt az előző rész általában önállóan is érthető.
                  int cut = lastConnectorCut(lower, preferredStart, preferredEnd, new String[]{
                          ", de ", ", viszont ", ", hanem ", ", tehát ", ", ezért ",
                          ", aztán ", ", majd ", ", utána ", "; ", ": ", " - "
                  });
                  if(cut > 0) return cut;
          
                  // 2) Feltételes / következő gondolat kezdete. V318-höz képest kicsit bátrabb,
                  // mert a beszélt nyelvben sokszor nincs pont, csak új gondolat kezdődik.
                  cut = lastConnectorCut(lower, 90, preferredEnd, new String[]{
                          ", és akkor ", ", akkor ", ", hogyha ", ", ha ", ", amikor ",
                          ", ahol ", ", amíg ", ", miközben ", ", vagy ", ", illetve "
                  });
                  if(cut > 0) return cut;
          
                  // 3) Felsorolás vagy hosszú mellékmondat. Vágás vessző után, de csak akkor,
                  // ha már van érdemi hosszúságú, önmagában is olvasható blokk.
                  cut = lastCommaCut(s, 90, Math.min(len, 175));
                  if(cut > 0) return cut;
          
                  // 4) Ha nincs vessző, de már hosszú a blokk, természetes kötőszavaknál is vágunk.
                  // Ez javítja a hosszú folyamatos monológokat, de továbbra sem időalapú.
                  cut = lastSoftWordCut(lower, 110, Math.min(len, 185), new String[]{
                          " de ", " viszont ", " akkor ", " utána ", " majd ",
                          " és akkor ", " hogyha ", " ha ", " amikor ", " illetve ",
                          " mindenhol ", " szinte ", " na most ", " pedig "
                  });
                  if(cut > 0) return cut;
          
                  // 5) Stabil prefix vágás: ha a beszéd hosszúra nő és nincs biztos írásjel,
                  // a puffer elejét lezárjuk szóhatáron. A maradék a pufferben marad tovább épülni.
                  // Ez szöveg-alapú biztonsági szelep, nem másodperc- vagy szünetalapú döntés.
                  if(len >= 190) {
                      int spc = s.lastIndexOf(' ', Math.min(len, 170));
                      if(spc >= 115) return spc + 1;
                  }
          
                  return -1;
              }
          
              int lastConnectorCut(String lower, int minPos, int maxPos, String[] connectors) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String sep: connectors) {
                      int pos = lower.lastIndexOf(sep, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1; // a vessző/írásjel az előző blokk végén marad
              }
          
              int lastCommaCut(String s, int minPos, int maxPos) {
                  int end = Math.min(s.length(), maxPos);
                  int pos = s.lastIndexOf(',', end);
                  if(pos >= minPos) return pos + 1;
                  return -1;
              }
          
              int lastSoftWordCut(String lower, int minPos, int maxPos, String[] words) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String w: words) {
                      int pos = lower.lastIndexOf(w, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1;
              }
          
              void setDetectedSourceSide(boolean sourceIsTop) {
                  topActive = sourceIsTop;
                  manualTopSource = sourceIsTop;
                  updateButtons();
              }
          
              String cleanTranscriptForSelectedPair(String text) {
                  if(text == null) return "";
                  // V318: ez továbbra sem saját nagy nyelvfelismerő. Csak biztonsági tisztítás:
                  // idegen írásrendszeres STT-szemét nem kerülhet ki az ablakokba vagy fordításba.
                  String x = text.replaceAll("[^A-Za-z0-9\\u00C0-\\u024F\\p{Punct}\\s]", " ");
                  return x.replaceAll("\\s+", " ").trim();
              }
          
              boolean selectedContains(String langCode) {
                  String lc = langCode == null ? "" : langCode.toLowerCase(Locale.ROOT);
                  return code(topLang).equalsIgnoreCase(lc) || code(bottomLang).equalsIgnoreCase(lc);
              }
          
              boolean looksLikeObviousThirdLanguageNoise(String text) {
                  if(text == null) return false;
                  String normalized = normalizedLanguageText(text);
                  if(normalized.isEmpty()) return true;
                  int wordCount = normalized.split("\\s+").length;
                  String top = code(topLang).toLowerCase(Locale.ROOT);
                  String bottom = code(bottomLang).toLowerCase(Locale.ROOT);
                  int selectedBest = Math.max(scoreTextForSelectedLang(text, top), scoreTextForSelectedLang(text, bottom));
                  String[] supported = {"hu","fr","en","de","it","es","ro","hr","sk","sl"};
                  int otherBest = 0;
                  for(String lang : supported) {
                      if(lang.equals(top) || lang.equals(bottom)) continue;
                      otherBest = Math.max(otherBest, scoreTextForSelectedLang(text, lang));
                  }
                  // Rövid idegen válasz sem bújhat át csak azért, mert egy-két szóból áll.
                  // Ismeretlen tulajdonnév viszont nem kap automatikus tiltást.
                  if(wordCount <= 2) return otherBest >= 3 && otherBest >= selectedBest + 3;
                  return otherBest >= 8 && otherBest >= selectedBest + 5;
              }
          
              boolean isUsableSpeechTriple(String[] trp) {
                  if(trp == null || trp.length < 3) return false;
                  // 2026-07-09: visszaállítva az egykörös elfogadás.
                  // SOURCE_LANG címkeformátum miatt nem dobunk el teljes, használható ORIGINAL+TRANSLATION választ,
                  // ezért nem indítunk felesleges második AI-kört.
                  String original = trp[1] == null ? "" : cleanTranscriptForSelectedPair(trp[1]).trim();
                  String translation = trp[2] == null ? "" : cleanTranscriptForSelectedPair(cleanOneBlockTranslation(trp[2])).trim();
                  if(original.length() == 0 || translation.length() == 0) return false;
                  String no = normalizeSpeechBlockHash(original);
                  String nt = normalizeSpeechBlockHash(translation);
                  if(no.length() >= 12 && no.equals(nt)) return false;
                  return true;
              }
          
              String normalizeAiSourceLangCode(String sourceLang) {
                  if(sourceLang == null) return "";
                  String s = java.text.Normalizer.normalize(sourceLang, java.text.Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "")
                      .toLowerCase(Locale.ROOT).replace('_', '-')
                      .replaceAll("[^a-z-]", "").trim();
                  if(s.length() == 0) return "";
                  if(s.equals("unknown") || s.equals("other") || s.equals("unintelligible") || s.equals("noise")) return "UNKNOWN";
                  if(s.equals("hu") || s.equals("hun") || s.equals("hu-hu") || s.equals("hungarian") || s.equals("magyar")) return "HU";
                  if(s.equals("fr") || s.equals("fra") || s.equals("fre") || s.equals("fr-fr") || s.equals("french") || s.equals("francais")) return "FR";
                  if(s.equals("en") || s.equals("eng") || s.equals("en-us") || s.equals("en-gb") || s.equals("english")) return "EN";
                  if(s.equals("de") || s.equals("deu") || s.equals("ger") || s.equals("de-de") || s.equals("german") || s.equals("deutsch")) return "DE";
                  if(s.equals("it") || s.equals("ita") || s.equals("it-it") || s.equals("italian") || s.equals("italiano")) return "IT";
                  if(s.equals("es") || s.equals("spa") || s.equals("es-es") || s.equals("spanish") || s.equals("espanol")) return "ES";
                  if(s.equals("ro") || s.equals("ron") || s.equals("rum") || s.equals("ro-ro") || s.equals("romanian") || s.equals("romana")) return "RO";
                  if(s.equals("hr") || s.equals("hrv") || s.equals("hr-hr") || s.equals("croatian") || s.equals("hrvatski")) return "HR";
                  if(s.equals("sk") || s.equals("slk") || s.equals("slo") || s.equals("sk-sk") || s.equals("slovak") || s.equals("slovencina")) return "SK";
                  if(s.equals("sl") || s.equals("slv") || s.equals("sl-si") || s.equals("slovenian") || s.equals("slovenscina")) return "SL";
                  return "";
              }
          
              boolean sourceIsTopFromAi(String sourceLang, boolean fallback) {
                  String normalized = normalizeAiSourceLangCode(sourceLang);
                  if(normalized.length() == 0) return fallback;
                  String top = code(topLang).toUpperCase(Locale.ROOT);
                  String bottom = code(bottomLang).toUpperCase(Locale.ROOT);
                  if(normalized.equals(top)) return true;
                  if(normalized.equals(bottom)) return false;
                  return fallback;
              }
          
              int addSourceOnlyBlock(boolean sourceIsTop, String original) {
                  String raw = original == null ? "" : original.trim();
                  if(!passesSelectedPairInputGate(raw) || looksLikeObviousThirdLanguageNoise(raw)) return -1;
          
                  String detected = selectedPairLanguageCode(raw);
                  boolean locallyConfirmed = !detected.isEmpty();
                  if(locallyConfirmed) sourceIsTop = detected.equalsIgnoreCase(code(topLang));
                  if(isRecentlyDisplayedSourceDuplicate(sourceIsTop, raw)) return -1;
          
                  TextBlock b = new TextBlock();
                  b.speechSeq = ++speechSourceBlockSeq;
                  b.sourceTop = sourceIsTop;
                  b.translatedOk = false;
                  b.provisional = true;
                  b.pendingSourceText = raw;
                  // Bizonytalan nyelvű STT nem kerül egyik nyelvi oldalra sem. A blokk rejtve várja
                  // az egyetlen szigorú nyelvazonosító+fordító választ; csak igazolt TOP/BOTTOM eredmény jelenhet meg.
                  String visibleSource = locallyConfirmed ? userVisibleSpeechTextOrEmpty(raw) : "";
                  b.topText = sourceIsTop ? visibleSource : "";
                  b.bottomText = sourceIsTop ? "" : visibleSource;
                  textBlocks.add(b);
                  renderBlocksKeepView();
                  return textBlocks.size() - 1;
              }
          
              String userVisibleSpeechTextOrEmpty(String text) {
                  if(text == null) return "";
                  String cleaned = cleanTranscriptForSelectedPair(text).trim();
                  if(cleaned.length() == 0) return "";
                  if(looksLikeInternalLeak(cleaned)) return "";
                  return cleaned;
              }
          
              boolean looksLikeInternalLeak(String text) {
                  if(text == null) return false;
                  String l = text.toLowerCase(Locale.ROOT).replaceAll("\\s+", " ").trim();
                  if(l.length() == 0) return false;
                  String[] bad = {
                      "speech_pair_classify_and_translate", "selected_top_lang", "selected_bottom_lang", "source_lang:",
                      "original:", "translation:", "instructions", "system prompt", "developer message", "context profile:",
                      "domain glossary", "audio_transcription", "chat.completions", "chat.completions", "api request",
                      "api response", "metadata", "metaadat", "prompt", "cannot translate", "can't translate",
                      "nem tudom lefordítani", "nem fordíthatom", "tartalom miatt", "abusive content", "policy"
                  };
                  for(String b: bad) if(l.contains(b)) return true;
                  return false;
              }
          
              boolean isRecentlyDisplayedSourceDuplicate(boolean sourceIsTop, String original) {
                  if(original == null) return true;
                  String h = normalizeSpeechBlockHash(original);
                  if(h.length() < 8) return false;
          
                  int checked = 0;
                  for(int i=textBlocks.size()-1; i>=0 && checked<5; i--) {
                      TextBlock b = textBlocks.get(i);
                      if(b == null || b.sourceTop != sourceIsTop) continue;
                      checked++;
                      String oldText = b.pendingSourceText != null && b.pendingSourceText.trim().length() > 0
                              ? b.pendingSourceText
                              : (sourceIsTop ? b.topText : b.bottomText);
                      String oh = normalizeSpeechBlockHash(oldText);
                      if(oh.length() < 8) continue;
                      if(h.equals(oh)) return true;
          
                      int min = Math.min(h.length(), oh.length());
                      int max = Math.max(h.length(), oh.length());
                      // V318: csak majdnem teljes azonosságot fogunk meg.
                      // A hasonló, de eltérő blokk ne essen ki, mert az beszédvesztéshez vezetett.
                      if(min >= 24 && (h.contains(oh) || oh.contains(h)) && (min * 100 / Math.max(1, max)) >= 92) return true;
                  }
                  return false;
              }
          
              String speechPreviousContextHint() {
                  // V40.9: az előző blokk csak semleges terminológiai támpont.
                  // A korábbi SOURCE_LANG címke hibásan a következő, akár ellenkező nyelvű
                  // mondat felé billentette a nyelvdöntést, ezért irányjelzés nélkül adjuk át.
                  String original = lastSureSpeechOriginal == null ? "" : lastSureSpeechOriginal.trim();
                  String translated = lastSureSpeechTranslation == null ? "" : lastSureSpeechTranslation.trim();
                  if(original.length() == 0) return "";
                  if(original.length() > 320) original = original.substring(original.length() - 320);
                  if(translated.length() > 320) translated = translated.substring(translated.length() - 320);
                  return "PREVIOUS_CONFIRMED_CONTEXT (terminology reference only; it does not indicate the language direction of the new block and must never be copied):\n" +
                      "PREVIOUS_ORIGINAL_TEXT: " + original + "\n" +
                      (translated.length() == 0 ? "" : "PREVIOUS_TRANSLATED_TEXT: " + translated + "\n");
              }
          
              void processNextSpeechTranslation() {
                  clipboardResponseMode = false;
                  if(speechTranslateMode || responseInProgress) return;
                  if(client == null) client = new OkHttpClient.Builder().connectTimeout(25, TimeUnit.SECONDS).readTimeout(90, TimeUnit.SECONDS).writeTimeout(45, TimeUnit.SECONDS).build();
                  Integer idObj = speechTranslateQueue.poll();
                  if(idObj == null) { maybeFinishStop(); return; }
                  int id = idObj.intValue();
                  if(id < 0 || id >= textBlocks.size()) { processNextSpeechTranslation(); return; }
                  TextBlock b = textBlocks.get(id);
                  boolean sourceIsTop = b.sourceTop;
                  String src = b.pendingSourceText != null && b.pendingSourceText.trim().length() > 0
                      ? b.pendingSourceText
                      : (sourceIsTop ? b.topText : b.bottomText);
                  if(src == null || src.trim().length() == 0) { processNextSpeechTranslation(); return; }
          
                  try {
                      pendingSpeechBlockId = id;
                      speechTranslateMode = true;
                      responseInProgress = true;
                      final int requestSession = sttSessionId;
                      JSONObject root = new JSONObject();
                      root.put("model", model);
                      root.put("temperature", 0.1);
                      JSONArray messages = new JSONArray();
                      messages.put(new JSONObject().put("role", "system").put("content", speechBlockInstructions()));
                      String topCode = code(topLang).toUpperCase(Locale.ROOT);
                      String bottomCode = code(bottomLang).toUpperCase(Locale.ROOT);
                      messages.put(new JSONObject().put("role", "user").put("content",
                          "SELECTED_TOP_LANG: " + topCode + "\n" +
                          "SELECTED_BOTTOM_LANG: " + bottomCode + "\n" +
                          speechPreviousContextHint() +
                          "RAW_SPEECH_TEXT (the only text to clean and translate):\n" + src.trim()));
                      root.put("messages", messages);
          
                      // V40.21: UNKNOWN kötelező menekülőút. A modell nem kényszerül harmadik nyelvet
                      // vagy értelmetlen STT-zajt tévesen a felső/alsó nyelvhez sorolni.
                      JSONObject properties = new JSONObject();
                      properties.put("source_lang", new JSONObject().put("type", "string")
                          .put("enum", new JSONArray().put(topCode).put(bottomCode).put("UNKNOWN"))
                          .put("description", "Use TOP_LANG or BOTTOM_LANG only when the fragment is clearly in that language. Use UNKNOWN for clear third-language, mixed, unintelligible or nonsensical recognition output."));
                      properties.put("clean_source", new JSONObject().put("type", "string")
                          .put("description", "Corrected transcription entirely in source_lang. No ordinary words from a third language and no target-language mixture; only genuine proper names may retain their real spelling."));
                      properties.put("translation", new JSONObject().put("type", "string")
                          .put("description", "Translation entirely in the other selected language, without source-language or third-language mixture except genuine proper names."));
                      JSONObject schema = new JSONObject()
                          .put("type", "object").put("properties", properties)
                          .put("required", new JSONArray().put("source_lang").put("clean_source").put("translation"))
                          .put("additionalProperties", false);
                      JSONObject jsonSchema = new JSONObject()
                          .put("name", "speech_clean_and_translate").put("strict", true).put("schema", schema);
                      root.put("response_format", new JSONObject()
                          .put("type", "json_schema").put("json_schema", jsonSchema));
                      Request req = new Request.Builder().url("https://api.openai.com/v1/chat/completions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .addHeader("Content-Type", "application/json")
                          .post(RequestBody.create(MediaType.parse("application/json; charset=utf-8"), root.toString())).build();
                      client.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> {
                                  if(requestSession != sttSessionId || pendingSpeechBlockId != id) return;
                                  responseInProgress = false;
                                  retrySpeechBlockOrRender(id);
                              });
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> {
                                      if(requestSession != sttSessionId || pendingSpeechBlockId != id) return;
                                      responseInProgress = false;
                                      retrySpeechBlockOrRender(id);
                                  });
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String out = obj.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "").trim();
                                  runOnUiThread(() -> {
                                      if(requestSession != sttSessionId || pendingSpeechBlockId != id) return;
                                      pendingOutput = out;
                                      responseInProgress = false;
                                      applySpeechTranslation(out);
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(() -> {
                                      if(requestSession != sttSessionId || pendingSpeechBlockId != id) return;
                                      responseInProgress = false;
                                      retrySpeechBlockOrRender(id);
                                  });
                              }
                          }
                      });
                  } catch(Exception e) {
                      retrySpeechBlockOrRender(id);
                  }
              }
          
              void retrySpeechBlockOrRender(int id) {
                  // Nincs automatikus újrakérés. Hibás/hiányos válaszból nem maradhat tévesen
                  // végleges forrásszöveg a magyar vagy a másik nyelvi oldalon.
                  responseInProgress = false;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  pendingOutput = "";
          
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      b.topText = "";
                      b.bottomText = "";
                      b.pendingSourceText = "";
                      b.translatedOk = false;
                      b.provisional = false;
                      b.finalReady = false;
                      b.retryCount = 0;
                  }
          
                  renderBlocksKeepView();
                  state.setText(streaming ? "mikrofon aktív – hibás rész kihagyva" : "hibás rész kihagyva");
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else maybeFinishStop();
              }
          
              void suppressSpeechBlock(int id, String statusText) {
                  responseInProgress = false;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  pendingOutput = "";
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      b.topText = "";
                      b.bottomText = "";
                      b.pendingSourceText = "";
                      b.provisional = false;
                      b.translatedOk = false;
                      b.finalReady = false;
                  }
                  renderBlocksKeepView();
                  state.setText(streaming ? "mikrofon aktív – " + statusText : statusText);
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else maybeFinishStop();
              }
          
              void applySpeechTranslation(String out) {
                  int id = pendingSpeechBlockId;
                  String speakText = null;
                  String speakLang = null;
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      String sourceLang = "";
                      String original = b.pendingSourceText == null ? "" : b.pendingSourceText.trim();
                      String translation = "";
                      boolean sourceIsTop = b.sourceTop;
          
                      try {
                          JSONObject structured = new JSONObject(out);
                          sourceLang = structured.optString("source_lang", "");
                          original = structured.optString("clean_source", "");
                          translation = structured.optString("translation", "");
                      } catch(Exception parseError) {
                          // Strict válasznál nincs találgatás és nincs új AI-kör.
                          retrySpeechBlockOrRender(id);
                          return;
                      }
          
                      String normalizedSource = normalizeAiSourceLangCode(sourceLang);
                      String topCode = code(topLang).toUpperCase(Locale.ROOT);
                      String bottomCode = code(bottomLang).toUpperCase(Locale.ROOT);
                      if("UNKNOWN".equals(normalizedSource)) {
                          suppressSpeechBlock(id, "idegen vagy érthetetlen rész kihagyva");
                          return;
                      }
                      if(!normalizedSource.equals(topCode) && !normalizedSource.equals(bottomCode)) {
                          retrySpeechBlockOrRender(id);
                          return;
                      }
                      sourceIsTop = normalizedSource.equals(topCode);
          
                      original = cleanTranscriptForSelectedPair(original);
                      translation = cleanTranscriptForSelectedPair(cleanOneBlockTranslation(translation));
          
                      if(looksLikeInternalLeak(original) || looksLikeInternalLeak(translation)) {
                          retrySpeechBlockOrRender(id);
                          return;
                      }
          
                      // A modell SOURCE_LANG címkéje önmagában nem írhatja felül a helyi, erős
                      // nyelvi bizonyítékot. Ez akadályozza meg, hogy egy egyértelműen francia/angol
                      // vagy más nyelvű eredmény a magyar oldalra kerüljön csak azért, mert a séma
                      // egyik kiválasztott nyelvet várta.
                      if(!locallySupportsLanguageCode(original, normalizedSource)) {
                          suppressSpeechBlock(id, "idegen vagy bizonytalan nyelvű rész kihagyva");
                          return;
                      }
                      String expectedTargetCode = sourceIsTop ? bottomCode : topCode;
                      if(!locallySupportsLanguageCode(translation, expectedTargetCode)) {
                          retrySpeechBlockOrRender(id);
                          return;
                      }
          
                      if(original.length() == 0 || translation.length() == 0) {
                          retrySpeechBlockOrRender(id);
                          return;
                      }
          
                      String no = normalizeSpeechBlockHash(original);
                      String nt = normalizeSpeechBlockHash(translation);
                      if(no.length() >= 12 && no.equals(nt)) {
                          retrySpeechBlockOrRender(id);
                          return;
                      }
          
                      b.sourceTop = sourceIsTop;
                      b.pendingSourceText = "";
                      // 2026-07-09: csak az aktuális blokk saját ideiglenes maradványát takarítjuk.
                      // Nem nyúlunk más blokkokhoz és nem törlünk teljes ablakot. Előbb ürítjük ennek
                      // a TextBlocknak mindkét oldalát, majd az AI által eldöntött SOURCE_LANG szerint
                      // azonnal visszaírjuk az eredetit és a fordítást a helyes két oldalra.
                      b.topText = "";
                      b.bottomText = "";
                      if(sourceIsTop) {
                          b.topText = original;
                          b.bottomText = translation;
                          speakText = translation;
                          speakLang = bottomLang;
                      } else {
                          b.bottomText = original;
                          b.topText = translation;
                          speakText = translation;
                          speakLang = topLang;
                      }
                      b.translatedOk = true;
                      b.provisional = false;
                      b.retryCount = 0;
                      lastSureSpeechOriginal = original;
                      lastSureSpeechTranslation = translation;
                      setDetectedSourceSide(sourceIsTop);
                      renderBlocksKeepView();
                      if(speakText != null && speakLang != null) {
                          markFinalTranslationReadyAndSpeak(b, speakText, speakLang);
                      }
                  }
                  pendingSpeechBlockId = -1;
                  speechTranslateMode = false;
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else maybeFinishStop();
              }
          
              void routeAiOutput(String out) {
                  if(clipboardResponseMode && clipboardDialog != null && clipboardDialog.isShowing()) {
                      clipboardResponseMode = false;
                      applyClipboardTranslation(out);
                      return;
                  } else {
                      clipboardResponseMode = false;
                  }
          
                  if(manualResponseMode) {
                      manualResponseMode = false;
                      applyManualFullWindowTranslation(out);
                      return;
                  }
          
                  if(speechTranslateMode || pendingSpeechBlockId >= 0) {
                      applySpeechTranslation(out);
                      return;
                  }
          
                  // V318: állapot nélküli / késve érkező AI-válasz nem hibaüzenet a felhasználónak.
                  // Nem hozunk létre belőle új blokkot, de nem is zavarjuk meg az aktív mikrofonos munkát toasttal.
                  android.util.Log.w("Fordito", "Állapot nélküli AI-válasz figyelmen kívül hagyva: " + out);
                  if(streaming) state.setText("mikrofon aktív");
              }
          
              boolean isCleanManualTranslation(String tr) {
                  if(tr == null) return false;
                  String t = tr.trim();
                  if(t.length() == 0) return false;
                  String low = t.toLowerCase(Locale.ROOT);
                  if(low.contains("source_lang") || low.contains("target_lang") || low.contains("original") || low.contains("translation:")) return false;
                  if(low.contains("error") || low.contains("hiba") || low.contains("cannot translate") || low.contains("nem tudom lefordítani")) return false;
                  // Ha az UFO-szűrés mindent kiszedett, ne számítson kész fordításnak.
                  return cleanTranscriptForSelectedPair(t).trim().length() > 0;
              }
          
              void applyManualFullWindowTranslation(String out) {
                  try {
                      JSONObject structured = new JSONObject(out);
                      String cleanSource = normalizeSentenceLineLayout(structured.optString("clean_source", ""));
                      String tr = normalizeSentenceLineLayout(structured.optString("translation", ""));
                      if(cleanSource.length() == 0 || tr.length() == 0) throw new Exception("empty manual result");
          
                      programmaticChange = true;
                      try {
                          if(manualTopSource) {
                              topBox.setText(cleanSource);
                              bottomBox.setText(tr);
                          } else {
                              bottomBox.setText(cleanSource);
                              topBox.setText(tr);
                          }
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      } finally {
                          programmaticChange = false;
                      }
                      speakManualOnce(tr, manualTopSource ? bottomLang : topLang);
                  } catch(Exception e) {
                      Toast.makeText(this, "Kézi fordítás válasz hiba.", Toast.LENGTH_LONG).show();
                  }
              }
          
              void rebuildBlocksFromCurrentBoxes() {
                  TextBlock b = new TextBlock();
                  b.topText = topBox.getText().toString().trim();
                  b.bottomText = bottomBox.getText().toString().trim();
                  b.sourceTop = manualTopSource;
                  b.pendingSourceText = "";
