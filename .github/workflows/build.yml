              int scoreShortReplyForSelectedLang(String text, String lang) {
                  String x = normalizedLanguageText(text);
                  if(x.isEmpty() || x.contains(" ")) return 0;
                  String compact = x.replace("'", "");
                  String l = lang == null ? "" : lang.toLowerCase(Locale.ROOT);
                  if("hu".equals(l) && Arrays.asList("igen","nem","jo","oke","rendben","persze","koszonom").contains(compact)) return 6;
                  if("fr".equals(l) && Arrays.asList("oui","non","bon","merci","daccord").contains(compact)) return 6;
                  if("en".equals(l) && Arrays.asList("yes","no","okay","thanks").contains(compact)) return 6;
                  if("de".equals(l) && Arrays.asList("ja","nein","danke","bitte").contains(compact)) return 6;
                  if("it".equals(l) && Arrays.asList("si","no","grazie","prego").contains(compact)) return 6;
                  if("es".equals(l) && Arrays.asList("si","no","gracias").contains(compact)) return 6;
                  if("ro".equals(l) && Arrays.asList("da","nu","multumesc").contains(compact)) return 6;
                  if("hr".equals(l) && Arrays.asList("da","ne","hvala").contains(compact)) return 6;
                  if("sk".equals(l) && Arrays.asList("ano","nie","dakujem").contains(compact)) return 6;
                  if("sl".equals(l) && Arrays.asList("da","ne","hvala").contains(compact)) return 6;
