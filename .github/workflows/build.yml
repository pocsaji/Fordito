              void startBackgroundForegroundServiceIfAllowed() {
                  if(!backgroundScreenAllowed) return;
                  try {
                      Intent i = new Intent(this, VoiceForegroundService.class);
                      if(Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                      else startService(i);
                  } catch(Exception e) {
                      Toast.makeText(this, "Háttér mód nem indult: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      backgroundScreenAllowed = false;
                  }
              }

