              String getClipboardText() {
                  try {
                      android.content.ClipboardManager cm = (android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                      if(cm == null || !cm.hasPrimaryClip()) return "";
                      ClipData cd = cm.getPrimaryClip();
                      if(cd == null || cd.getItemCount() == 0) return "";
                      StringBuilder sb = new StringBuilder();
                      for(int i = 0; i < cd.getItemCount(); i++) {
                          CharSequence cs = cd.getItemAt(i).coerceToText(this);
                          if(cs != null) {
                              String part = cs.toString().trim();
                              if(part.length() > 0) {
                                  if(sb.length() > 0) sb.append("\n");
                                  sb.append(part);
                              }
                          }
                      }
                      return sb.toString().trim();
                  } catch(Exception e) {
                      return "";
                  }
              }
              String clipboardTargetCode(String text) {
                  // V180: vágólapos ág saját iránylogikája.
                  // Magyar bemenet: a másik (nem HU) beállított nyelvre fordít.
                  // Idegen bemenet: mindig magyarra fordít, a középső mező üres marad.
                  String bottom = code(bottomLang);
                  String top = code(topLang);
                  String guessed = guessClipboardLangCode(text);
                  if(guessed.length() > 0 && !guessed.equalsIgnoreCase("HU")) return "HU";
                  if(guessed.equalsIgnoreCase("HU")) {
                      if(bottom.equalsIgnoreCase("HU") && !top.equalsIgnoreCase("HU")) return top;
                      if(top.equalsIgnoreCase("HU") && !bottom.equalsIgnoreCase("HU")) return bottom;
                  }
                  return bottom;
              }

              boolean isClipboardHungarian(String text) {
                  return "HU".equalsIgnoreCase(guessClipboardLangCode(text));
              }

              String guessClipboardLangCode(String text) {
                  String t = (text == null ? "" : text).toLowerCase(Locale.ROOT);
                  if(t.trim().length() == 0) return "";
                  int hu = 0, fr = 0, de = 0, en = 0, it = 0;
                  for(int i=0;i<t.length();i++) {
                      char ch = t.charAt(i);
                      if("áéíóöőúüű".indexOf(ch) >= 0) hu += 3;
                      if("àâçéèêëîïôùûüÿœæ".indexOf(ch) >= 0) fr += 2;
                      if("äöüß".indexOf(ch) >= 0) de += 3;
                      if("ìòàèù".indexOf(ch) >= 0) it += 2;
                  }
                  String pad = " " + t.replaceAll("[^\\p{L}]+", " ") + " ";
                  String[] huWords = {" hogy "," vagy "," nem "," igen "," ezt "," azt "," akkor "," most "," lehet "," kérlek "," szeretném "," miért "," mert "," tehát "," van "," lesz "," volt "};
                  String[] frWords = {" je "," tu "," vous "," nous "," est "," pas "," que "," pour "," avec "," dans "," une "," des "," les "," mais "," donc "," alors "," pourquoi "};
                  String[] deWords = {" ich "," du "," sie "," wir "," nicht "," und "," oder "," dass "," mit "," für "," ein "," eine "," der "," die "," das "," warum "};
                  String[] enWords = {" i "," you "," we "," they "," the "," and "," or "," not "," with "," for "," this "," that "," why "," because "};
                  String[] itWords = {" io "," tu "," noi "," non "," che "," per "," con "," una "," gli "," sono "," perché "," allora "};
                  for(String w: huWords) if(pad.contains(w)) hu += 2;
                  for(String w: frWords) if(pad.contains(w)) fr += 2;
                  for(String w: deWords) if(pad.contains(w)) de += 2;
                  for(String w: enWords) if(pad.contains(w)) en += 2;
                  for(String w: itWords) if(pad.contains(w)) it += 2;
                  int max = hu; String lang = "HU";
                  if(fr > max) { max = fr; lang = "FR"; }
                  if(de > max) { max = de; lang = "DE"; }
                  if(en > max) { max = en; lang = "EN"; }
                  if(it > max) { max = it; lang = "IT"; }
                  return max >= 2 ? lang : "";
              }


              void sendClipboardTextToTranslate(String text) {
                  clipboardResponseMode = true;
                  manualResponseMode = false;
                  liveTranslateMode = false;
                  pendingLiveBlockId = -1;
                  liveTranslateQueue.clear();
                  pendingOutput = "";
                  updateButtons();
                  if(responseInProgress && ws != null) {
                      try {
                          JSONObject cancel = new JSONObject();
                          cancel.put("type", "response.cancel");
                          ws.send(cancel.toString());
                          responseInProgress = false;
                      } catch(Exception ignored) {}
                  }
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "conversation.item.create");
                      JSONObject item = new JSONObject();
                      item.put("type", "message");
                      item.put("role", "user");
                      JSONArray content = new JSONArray();
                      JSONObject c = new JSONObject();
                      c.put("type", "input_text");
                      c.put("text", "CLIPBOARD_FLOATING_TRANSLATION\n" + text + "\n\nReturn ONLY the translated text. Preserve practical meaning and tone. Do not write labels, markdown, quotes or explanation.");
                      content.put(c);
                      item.put("content", content);
                      msg.put("item", item);
                      ws.send(msg.toString());

                      JSONObject resp = new JSONObject();
                      resp.put("type", "response.create");
                      JSONObject response = new JSONObject();
                      response.put("instructions", clipboardTranslationInstructions());
                      resp.put("response", response);
                      responseInProgress = true;
                      ws.send(resp.toString());
                  } catch(Exception e) {
                      clipboardResponseMode = false;
                      showFloatingResultWindow("Vágólap-fordítás hiba. Próbáld újra.");
                  }
              }

              String clipboardFullInstructions() {
                  return clipboardContextPrompt() + "Never censor, mask, redact, soften, sanitize or replace any word, including profanity, vulgarity, insults, sexual language, slang or rude wording. Preserve every such word in full, with its original spelling and meaning. Never use asterisks, partial masking, euphemisms, square-bracket placeholders or category labels. " + "You are a standalone clipboard text repair and translation engine. The user message contains SOURCE_LANG, TARGET_LANG and TEXT fields. This clipboard branch is independent from the live speech translator. " +
                    "Return ONLY valid JSON with exactly two string fields: prepared and translation. No markdown, no labels outside JSON. " +
                    "Detect the source language from TEXT. If the source is Hungarian, prepared must be a corrected Hungarian version of TEXT: add punctuation, sentence boundaries and capitalization; correct obvious typos, missing accents, broken words, accidental repeated words and grammar when the intended meaning is clear from context. Be context-aware but conservative: do NOT invent new content and do NOT replace strange, test-like or unclear words with a different meaning. If a word is odd but could be intentional, keep it. Then translate prepared to TARGET_LANG. " +
                    "If the source is NOT Hungarian, prepared must be an empty string, and translation must be a natural Hungarian translation/interpretation of TEXT. Do not return the foreign source text as the translation. " +
                    "Keep the user's practical meaning, tone, register, emotional intensity and context. Friendly stays friendly; official stays official; direct work messages stay direct; intimate or sexual text stays intimate or sexual instead of being made formal. Make the result natural and native-sounding. " +
                    "Do not censor, mask, soften, sanitize, label, bracket, star out, or replace profanity, vulgarity, insults, sexual words, slang, or rude wording.";
              }

              String clipboardTranslationInstructions() {
                  return clipboardContextPrompt() + "Never censor, mask, redact, soften, sanitize or replace any word, including profanity, vulgarity, insults, sexual language, slang or rude wording. Preserve every such word in full, with its original spelling and meaning. Never use asterisks, partial masking, euphemisms, square-bracket placeholders or category labels. " + "You are a standalone clipboard translation engine. The user message contains SOURCE_LANG, TARGET_LANG and TEXT fields. This clipboard branch is independent from the live speech translator. " +
                    "If SOURCE_LANG is AUTO, detect the source language from TEXT. Translate the entire TEXT to TARGET_LANG. If TARGET_LANG is HU, the answer must be Hungarian. " +
                    "Return ONLY the translated text. Preserve paragraphs where reasonable. No labels, no markdown, no quotes, no explanation. Preserve the original style, register and emotional tone: friendly stays friendly, official stays official, intimate or sexual stays intimate or sexual, and practical work messages stay natural and direct. " +
                    "Do not censor, mask, soften, sanitize, label, bracket, star out, or replace profanity, vulgarity, insults, sexual words, slang, or rude wording. Keep meaning, context and tone.";
              }

