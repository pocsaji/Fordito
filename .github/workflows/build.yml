              double vadThreshold() {
                  if("high".equals(vadMode)) return 0.70;     // gyors: könnyebben indul, csendesebb helyre
                  if("medium".equals(vadMode)) return 0.74;   // V107 alap: normál, nem vágja túl a beszédet
                  if("auto".equals(vadMode)) return 0.74;
                  return 0.76;                                // várakozó: hosszabb, óvatosabb blokkzárás
              }

              int vadSilenceMs() {
                  // V140: a szerver VAD mondatzárása sehol nem várhat tovább 500 ms-nál,
                  // mert a helyi küldési kapu legfeljebb 600 ms lezáró csendet enged fel.
                  if("high".equals(vadMode)) return 300;
                  if("medium".equals(vadMode)) return 450;
                  if("auto".equals(vadMode)) return 450;
                  return 500;
              }

              int micGateThreshold() {
                  // V140: a kapu már nem csak nulláz, hanem üresjáratban a küldést is megfogja.
                  // sensitive = kikapcsolva: minden hangcsomag megy, a régi folyamatos stream viselkedéshez.
                  if("sensitive".equals(micGateMode)) return 0;
                  if("gate_low".equals(micGateMode)) return 100;
                  if("normal".equals(micGateMode)) return 150;
                  if("gate_high".equals(micGateMode)) return 220;
                  return 100;
              }

              int avgAbsPcm16(byte[] data, int len) {
                  if(data == null || len < 2) return 0;
                  long sum = 0;
                  int samples = 0;
                  for(int i=0; i+1<len; i+=2) {
                      int lo = data[i] & 0xff;
                      int hi = data[i+1];
                      int v = (hi << 8) | lo;
                      sum += Math.abs(v);
                      samples++;
                  }
                  if(samples == 0) return 0;
                  return (int)(sum / samples);
              }

              void clearPreRollAudio() {
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.clear();
                      preRollAudioBytes = 0;
                  }
              }

              void rememberPreRollAudio(byte[] data, int len) {
                  if(data == null || len <= 0) return;
                  byte[] copy = Arrays.copyOf(data, len);
                  int maxBytes = Math.max(1, 24000 * 2 * PRE_ROLL_AUDIO_MS / 1000);
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.add(copy);
                      preRollAudioBytes += copy.length;
                      while(preRollAudioBytes > maxBytes && !preRollAudioChunks.isEmpty()) {
                          byte[] old = preRollAudioChunks.poll();
                          if(old != null) preRollAudioBytes -= old.length;
                      }
                  }
              }

              ArrayList<byte[]> takePreRollAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(preRollAudioChunks) {
                      while(!preRollAudioChunks.isEmpty()) {
                          byte[] b = preRollAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      preRollAudioBytes = 0;
                  }
                  return out;
              }

              void sendAudioChunk(byte[] chunk) throws Exception {
                  if(chunk == null || chunk.length == 0 || ws == null) return;
                  JSONObject evt = new JSONObject();
                  evt.put("type", "input_audio_buffer.append");
                  evt.put("audio", Base64.encodeToString(chunk, Base64.NO_WRAP));
                  ws.send(evt.toString());
              }

              byte[] prepareTrailingSilenceChunk(byte[] data, int len) {
                  long now = System.currentTimeMillis();
                  if(trailingSilenceOpen && lastVoiceChunkSentAtMs > 0L && now - lastVoiceChunkSentAtMs <= MAX_TRAILING_SILENCE_SEND_MS) {
                      return new byte[len];
                  }
                  trailingSilenceOpen = false;
                  voiceSendActive = false;
                  return null;
              }

