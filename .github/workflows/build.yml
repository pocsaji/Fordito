              void markMicrophoneUiReady(AudioRecord activeRec) {
                  if(!microphoneStarting || !microphonePcmReady || !streaming || rec != activeRec) return;
                  long waitMs = Math.max(0L, microphoneStartUiEarliestMs - android.os.SystemClock.elapsedRealtime());
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(!microphoneStarting || !microphonePcmReady || !streaming || rec != activeRec) return;
                      microphoneStarting = false;
                      String base = "mikrofon aktív";
                      if(interpreterMode) base += " – " + interpreterRuntimeShortLabel();
                      state.setText(base);
                      scheduleMicLifeSignal();
                      updateButtons();
                  }, waitMs);
              }
          
              void audioLoop() {
                  final int audioSession = sttSessionId;
                  rec = null;
                  Exception lastStartError = null;
                  if(!ensureExternalVadReady()) {
                      connected = false;
                      microphoneStarting = false;
                      microphonePcmReady = false;
                      stopBackgroundForegroundService();
                      runOnUiThread(() -> { state.setText("Silero VAD nem inicializálható"); setInputRouteHeader("BEMENET: HIBA"); updateButtons(); });
                      return;
                  }
          
                  int[] captureRates = { CAPTURE_SAMPLE_RATE, REALTIME_SAMPLE_RATE };
                  for(int sr : captureRates) {
                      int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      int bs = Math.max(min > 0 ? min : 0, sr * 2 * SILERO_FRAME_MS / 1000 * 6);
                      AudioRecord candidate = makeBestAudioRecord(sr, bs);
                      if(candidate == null) continue;
                      try {
                          candidate.startRecording();
                          if(candidate.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING)
                              throw new IllegalStateException("AudioRecord did not enter recording state at " + sr + " Hz");
                          if(!verifyBuiltInMicrophoneRoute(candidate, 1600L))
                              throw new IllegalStateException("A telefon mikrofon útvonala nem igazolható " + sr + " Hz-en");
                          rec = candidate;
                          lastStartError = null;
                          break;
                      } catch(Exception e) {
                          lastStartError = e;
                          android.util.Log.w(LOG_TAG, "Capture candidate failed at " + sr + " Hz", e);
                          try { candidate.stop(); } catch(Exception ignored) {}
                          try { candidate.release(); } catch(Exception releaseError) { android.util.Log.w(LOG_TAG, "AudioRecord candidate release failed", releaseError); }
                      }
                  }
                  if(rec == null) {
                      if(lastStartError != null) android.util.Log.e(LOG_TAG, "All phone microphone capture rates failed", lastStartError);
                      connected = false;
                      microphoneStarting = false;
                      microphonePcmReady = false;
                      closeExternalVad();
                      stopBackgroundForegroundService();
                      runOnUiThread(() -> { state.setText("telefon mikrofon nem inicializálható 48/24 kHz-en"); setInputRouteHeader("BEMENET: HIBA"); updateButtons(); });
                      return;
                  }
          
                  if(audioSession != sttSessionId || !connected) {
                      try { rec.stop(); } catch(Exception ignored) {}
                      try { rec.release(); } catch(Exception ignored) {}
                      rec = null;
                      return;
                  }
          
                  streaming = true;
                  final AudioRecord activeRec = rec;
                  registerActualInputRouteUpdates(activeRec);
                  runOnUiThread(() -> {
                      refreshActualInputRoute(activeRec);
                      setSpeechUiLocked(false);
                      state.setText("mikrofon előkészítés");
                      updateButtons();
                  });
          
                  int captureSamplesPerFrame = Math.max(1, activeCaptureSampleRate * SILERO_FRAME_MS / 1000);
                  int captureFrameBytes = captureSamplesPerFrame * 2;
                  byte[] buf = new byte[captureFrameBytes];
                  clearPreRollAudio();
                  clearPendingSpeechAudio();
                  clearSpeechAudioWindow();
                  voiceSendActive = false;
                  while((streaming || finalizingStop) && activeRec != null && audioSession == sttSessionId) {
                      int read;
                      try {
                          read = activeRec.read(buf, 0, buf.length, AudioRecord.READ_BLOCKING);
                      } catch(Exception e) {
                          android.util.Log.e(LOG_TAG, "AudioRecord read threw", e);
                          runOnUiThread(() -> state.setText("mikrofon olvasási hiba"));
                          break;
                      }
                      if(read > 0) {
                          if(!streaming && !finalizingStop) break;
                          try {
                              ArrayList<PcmFramePair> frames = normalizeCapturedFrames(buf, read);
                              if(frames.isEmpty()) continue;
                              if(!microphonePcmReady) {
                                  microphonePcmReady = true;
                                  markMicrophoneUiReady(activeRec);
                              }
                              for(PcmFramePair frame : frames) {
                                  synchronized(audioProcessingLock) { processVadFrame(frame); }
                              }
                          } catch(Exception e) {
                              android.util.Log.e(LOG_TAG, "Silero/audio processing failed", e);
                              sileroFatalError = true;
                              runOnUiThread(() -> state.setText("Silero VAD feldolgozási hiba"));
                              break;
                          }
                      } else if(read < 0) {
                          final int code = read;
                          android.util.Log.e(LOG_TAG, "AudioRecord read error code=" + code);
                          runOnUiThread(() -> state.setText("mikrofon olvasási hiba: " + code));
                          break;
                      }
                  }
                  if(streaming && !finalizingStop && audioSession == sttSessionId) runOnUiThread(() -> stop(false));
              }
          
              void handleConnectionFailure(Throwable t) {
                  String msg = t == null ? "ismeretlen hiba" : String.valueOf(t.getMessage());
          
                  // V318: lebegő vágólap-fordításnál nincs blokkállapot, csak mini ablak/toast.
                  if(clipboardResponseMode) {
                      clipboardResponseMode = false;
                      pendingClipboardText = "";
                      Toast.makeText(this, "Kapcsolat hiba vágólap-fordítás közben.", Toast.LENGTH_LONG).show();
                      stop(false);
                      return;
                  }
          
                  // V318: kézi fordításnál nincs blokkállapot. Hiba esetén nem írunk semmit az ablakokba.
                  if(manualResponseMode) {
                      manualResponseMode = false;
                      pendingManualText = "";
                      Toast.makeText(this, "Kapcsolat hiba kézi fordítás közben. Próbáld újra a FORDÍT gombbal.", Toast.LENGTH_LONG).show();
                      stop(false);
                      return;
                  }
          
                  // Normál beszéd/élő fordításnál se írjunk hibaüzenetet a fordítási ablakba.
                  Toast.makeText(this, "Kapcsolat hiba: " + msg, Toast.LENGTH_LONG).show();
                  stop(false);
              }
          
              void stop() {
                  stop(true);
              }
          
              void stop(boolean flushRemaining) {
                  if(finalizingStop && flushRemaining) return;
                  streaming = false;
                  connected = false;
                  microphoneStarting = false;
                  microphonePcmReady = false;
                  microphoneStartUiEarliestMs = 0L;
                  cancelMicLifeSignal();
                  ttsMuteUntilMs = 0L;
          
                  AudioRecord stoppingRec = rec;
                  rec = null;
                  setInputRouteHeader("BEMENET: —");
                  try {
                      if(stoppingRec != null) stoppingRec.stop();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "AudioRecord stop failed", e);
                  }
          
                  if(flushRemaining) {
                      finalizingStop = true;
                      stopAudioDrainPending = true;
                      state.setText("utolsó mondat feldolgozása");
                      updateButtons();
                      final int stopSession = sttSessionId;
                      final AudioRecord recorderToRelease = stoppingRec;
                      try {
                          // Ugyanazon az egyszálú executoron fut: csak az audioLoop teljes
                          // kilépése után zárhatja le és küldheti el a maradék hangot.
                          audioExec.submit(() -> runOnUiThread(() -> finalizeGracefulStopAfterAudioLoop(stopSession, recorderToRelease)));
                      } catch(Exception e) {
                          android.util.Log.e(LOG_TAG, "Stop finalizer scheduling failed", e);
                          finalizeGracefulStopAfterAudioLoop(stopSession, recorderToRelease);
                      }
                      return;
                  }
          
                  try { if(stoppingRec != null) stoppingRec.release(); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord release failed", e); }
                  stopAudioDrainPending = false;
                  // Azonnali belső leállításnál a régi HTTP válaszok nem kerülhetnek
                  // egy később induló mikrofonmenet blokkjaiba.
                  resetSttOrderingForNewSession();
                  closeRealtimeTranscriptionSession(false);
                  finishStopCleanup();
              }
          
              void finalizeGracefulStopAfterAudioLoop(int stopSession, AudioRecord recorderToRelease) {
                  try { if(recorderToRelease != null) recorderToRelease.release(); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord delayed release failed", e); }
                  if(stopSession != sttSessionId || !finalizingStop) return;
                  synchronized(audioProcessingLock) {
                      if(!voiceSendActive && pendingSpeechAudioDurationMs() >= MIN_TRUE_SPEECH_AUDIO_MS) {
                          for(PcmFramePair pr : takePreRollAudio()) sendAudioFrame(pr);
                          for(PcmFramePair ps : takePendingSpeechAudio()) sendAudioFrame(ps);
                      }
                      voiceSendActive = false;
                      clearPendingSpeechAudio();
                      clearPreRollAudio();
                      finishSpeechUtterance();
                  }
                  closeExternalVad();
                  stopAudioDrainPending = false;
                  if(sttRequestsInFlight > 0 || speechTranslateMode || pendingSpeechBlockId >= 0 || !speechTranslateQueue.isEmpty()) {
                      state.setText("utolsó mondat feldolgozása");
                      updateButtons();
                  } else {
                      finishStopCleanup();
                  }
              }
          
              void maybeFinishStop() {
                  if(!finalizingStop || stopAudioDrainPending) return;
                  if(sttRequestsInFlight > 0) return;
                  if(speechTranslateMode || pendingSpeechBlockId >= 0 || !speechTranslateQueue.isEmpty()) return;
                  finishStopCleanup();
              }
          
              void finishStopCleanup() {
                  stopAudioDrainPending = false;
                  finalizingStop = false;
                  voiceSendActive = false;
                  clearPreRollAudio();
                  clearPendingSpeechAudio();
                  clearSpeechAudioWindow();
                  resetCapturedFrameState();
                  closeExternalVad();
                  closeRealtimeTranscriptionSession(false);
                  speechTranscriptBuffer = "";
                  firstSpeechHeardAt = 0L;
                  speechBufferStartedAt = 0L;
                  speechIdleFlushToken++;
                  lastSpeechBlockReleasedAt = 0L;
                  firstSpeechBlockReleased = false;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  speechTranslateQueue.clear();
                  manualResponseMode = false;
                  clipboardResponseMode = false;
                  pendingOutput = "";
                  responseInProgress = false;
                  recentSpeechBlockHashes.clear();
                  recentSpeechBlockHashOrder.clear();
                  lastSureSpeechOriginal = "";
                  lastSureSpeechTranslation = "";
                  stopBackgroundForegroundService();
                  runOnUiThread(() -> {
                      state.setText("készenlét");
                      setSpeechUiLocked(false);
                      updateButtons();
                  });
              }
          
              String stripDisplayBlockNumbers(String s) {
                  if(s == null) return "";
                  return s.replaceAll("(?m)^\\s*\\d{3}\\s*\\|\\s*", "").trim();
              }
          
              void manualArrange() {
                  if(uiLockedForSpeech || finalizingStop) return;
                  if(streaming) stop(false);
          
                  EditText source = manualTopSource ? topBox : bottomBox;
                  source.clearFocus();
                  String sourceText = stripDisplayBlockNumbers(source.getText().toString()).trim();
                  if(sourceText.length() == 0) {
                      Toast.makeText(this, manualTopSource ? "A felső ablak üres." : "Az alsó ablak üres.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if(!hasKey()) { showApi(); return; }
          
                  responseInProgress = true;
                  updateButtons();
                  try {
                      JSONObject root = new JSONObject();
                      root.put("model", model);
                      root.put("temperature", 0.1);
                      JSONArray messages = new JSONArray();
                      messages.put(new JSONObject().put("role", "system").put("content", cleanupOnlyInstructions()));
                      messages.put(new JSONObject().put("role", "user").put("content",
                          "SOURCE_TEXT_BEGIN\n" + sourceText + "\nSOURCE_TEXT_END"));
                      root.put("messages", messages);
          
                      OkHttpClient http = client != null ? client : new OkHttpClient.Builder()
                          .connectTimeout(25, TimeUnit.SECONDS).readTimeout(90, TimeUnit.SECONDS).writeTimeout(45, TimeUnit.SECONDS).build();
                      Request req = new Request.Builder().url("https://api.openai.com/v1/chat/completions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .addHeader("Content-Type", "application/json")
                          .post(RequestBody.create(MediaType.parse("application/json; charset=utf-8"), root.toString())).build();
          
                      http.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> { responseInProgress = false; updateButtons(); Toast.makeText(MainActivity.this, "Rendezés kapcsolat hiba.", Toast.LENGTH_LONG).show(); });
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> { responseInProgress = false; updateButtons(); Toast.makeText(MainActivity.this, "Rendezés HTTP " + response.code(), Toast.LENGTH_LONG).show(); });
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String cleaned = normalizeSentenceLineLayout(
                                      obj.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "")
                                  );
                                  if(cleaned.length() == 0) throw new JSONException("Empty cleanup response");
                                  runOnUiThread(() -> {
                                      responseInProgress = false;
                                      programmaticChange = true;
                                      try {
                                          source.setText(cleaned);
                                          source.setSelection(source.getText().length());
                                      } finally {
                                          programmaticChange = false;
                                      }
                                      try {
                                          android.content.ClipboardManager cm = (android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                                          cm.setPrimaryClip(ClipData.newPlainText("rendezett_szoveg", cleaned));
                                      } catch(Exception ignored) {}
                                      updateButtons();
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(() -> { responseInProgress = false; updateButtons(); Toast.makeText(MainActivity.this, "Rendezés válasz hiba.", Toast.LENGTH_LONG).show(); });
                              }
                          }
                      });
                  } catch(Exception e) {
                      responseInProgress = false;
                      updateButtons();
                      Toast.makeText(this, "Rendezés hiba.", Toast.LENGTH_LONG).show();
                  }
              }
          
              void manualTranslate() {
                  if(uiLockedForSpeech || finalizingStop) return;
          
                  // V318: a FORDÍT gomb külön üzemmód.
                  // Először lezárjuk a mikrofont/speech sort, utána az aktív ablak teljes szövegét
                  // egyetlen nagy, kontextusos kézi fordításként kezeljük.
                  if(streaming) {
                      stop(false);
                  }
          
                  EditText source = manualTopSource ? topBox : bottomBox;
                  source.clearFocus();
                  try {
                      InputMethodManager imm = (InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);
                      imm.hideSoftInputFromWindow(source.getWindowToken(), 0);
                  } catch(Exception ignored) {}
          
                  String sourceText = stripDisplayBlockNumbers(source.getText().toString()).trim();
                  if(sourceText.length() == 0) {
                      Toast.makeText(this, manualTopSource ? "A felső ablak üres." : "Az alsó ablak üres.", Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  if(!hasKey()) { showApi(); return; }
          
                  String srcCode = manualTopSource ? code(topLang) : code(bottomLang);
                  String tgtCode = manualTopSource ? code(bottomLang) : code(topLang);
                  String payload = "SOURCE_LANG: " + srcCode + "\n"
                       + "TARGET_LANG: " + tgtCode + "\n"
                       + "TEXT:\n" + sourceText;
          
                  if(client == null) client = new OkHttpClient.Builder().connectTimeout(25, TimeUnit.SECONDS).readTimeout(90, TimeUnit.SECONDS).writeTimeout(45, TimeUnit.SECONDS).build();
                  sendManualText(payload);
              }
          
              void sendManualText(String text) {
                  clipboardResponseMode = false;
                  topActive = manualTopSource;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  speechTranslateQueue.clear();
                  pendingOutput = "";
                  manualResponseMode = true;
                  responseInProgress = true;
                  updateButtons();
                  try {
                      OkHttpClient http = client != null ? client : new OkHttpClient.Builder()
                          .connectTimeout(25, TimeUnit.SECONDS).readTimeout(90, TimeUnit.SECONDS).writeTimeout(45, TimeUnit.SECONDS).build();
                      JSONObject root = new JSONObject();
                      root.put("model", model);
                      root.put("temperature", 0.1);
                      JSONArray messages = new JSONArray();
                      messages.put(new JSONObject().put("role", "system").put("content", manualBlockInstructions(topActive)));
                      messages.put(new JSONObject().put("role", "user").put("content",
                          "SOURCE_TEXT_BEGIN\n" + text + "\nSOURCE_TEXT_END"));
                      root.put("messages", messages);
                      JSONObject manualProps = new JSONObject();
                      manualProps.put("clean_source", new JSONObject().put("type", "string"));
                      manualProps.put("translation", new JSONObject().put("type", "string"));
                      JSONObject manualSchema = new JSONObject()
                          .put("type", "object")
                          .put("properties", manualProps)
                          .put("required", new JSONArray().put("clean_source").put("translation"))
                          .put("additionalProperties", false);
                      root.put("response_format", new JSONObject()
                          .put("type", "json_schema")
                          .put("json_schema", new JSONObject()
                              .put("name", "manual_clean_and_translate")
                              .put("strict", true)
                              .put("schema", manualSchema)));
                      Request req = new Request.Builder().url("https://api.openai.com/v1/chat/completions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .addHeader("Content-Type", "application/json")
                          .post(RequestBody.create(MediaType.parse("application/json; charset=utf-8"), root.toString())).build();
                      http.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> { manualResponseMode = false; responseInProgress = false; Toast.makeText(MainActivity.this, "Kézi fordítás kapcsolat hiba.", Toast.LENGTH_LONG).show(); updateButtons(); });
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> { manualResponseMode = false; responseInProgress = false; Toast.makeText(MainActivity.this, "Kézi fordítás HTTP " + response.code(), Toast.LENGTH_LONG).show(); updateButtons(); });
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String out = obj.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "").trim();
                                  runOnUiThread(() -> { responseInProgress = false; applyManualFullWindowTranslation(out); updateButtons(); });
                              } catch(Exception e) {
                                  runOnUiThread(() -> { manualResponseMode = false; responseInProgress = false; Toast.makeText(MainActivity.this, "Kézi fordítás válasz hiba.", Toast.LENGTH_LONG).show(); updateButtons(); });
                              }
                          }
                      });
                  } catch(Exception e) {
                      manualResponseMode = false;
                      responseInProgress = false;
                      Toast.makeText(this, "Kézi fordítás hiba. Próbáld újra.", Toast.LENGTH_LONG).show();
                      updateButtons();
                  }
              }
          
              void handleTranscriptCompleted(String transcript, boolean finalFlush) {
                  if(transcript == null || transcript.trim().length() == 0) {
                      speechIdleFlushToken++;
                      return;
                  }
          
                  if(isAlreadyReleasedTranscript(transcript)) {
                      speechIdleFlushToken++;
                      return;
                  }
          
                  if(!finalFlush) {
                      // V343: egy lezárt Realtime/Silero audioablak STT-válasza pontosan egy kész blokk.
                      // Nem kerül vissza a második időalapú speechTranscriptBuffer-darabolásba,
                      // ezért ugyanaz az STT-válasz nem tud két-három blokkot egyszerre kiengedni.
                      String b = normalizeAndDeduplicateSpeechBlock(transcript);
                      if(b.length() > 0) {
                          boolean sourceGuessTop = sourceIsTopBySelectedPair(b, topActive);
                          int id = addSourceOnlyBlock(sourceGuessTop, b);
                          if(id >= 0) {
                              firstSpeechBlockReleased = true;
                              speechTranslateQueue.add(id);
                              lastSpeechBlockReleasedAt = System.currentTimeMillis();
                              processNextSpeechTranslation();
                          }
                      }
                      speechTranscriptBuffer = "";
                      firstSpeechHeardAt = 0L;
                      speechBufferStartedAt = 0L;
                      speechIdleFlushToken++;
                      return;
                  }
          
                  // A beszéd végi maradék továbbra is a meglévő
                  // biztonságos lezárási úton kerül kiadásra.
                  speechTranscriptBuffer = transcript;
                  int released = flushReadyTranscriptBlocks(true);
                  if(released > 0) lastSpeechBlockReleasedAt = System.currentTimeMillis();
                  speechIdleFlushToken++;
              }
          
              void resetSpeechRecognitionTimingState() {
                  // V318: beszédfelismerési időzítés váltásakor nem várunk és nem építünk új kaput.
                  // Csak az élő, még le nem zárt transcript állapotot nullázzuk, hogy a régi mód
                  // puffer/időzítője ne zárhasson rá az új mód szabályaira. A már kiadott blokkok
                  // nem tudja újra behozni ugyanazt a mondatot.
                  speechTranscriptBuffer = "";
                  firstSpeechHeardAt = 0L;
                  speechBufferStartedAt = 0L;
                  speechIdleFlushToken++;
                  lastSpeechBlockReleasedAt = 0L;
              }
          
              void applyRecognitionTimingChange() {
                  resetSpeechRecognitionTimingState();
                  
              }
          
              int flushReadyTranscriptBlocks(boolean flushAll) {
                  int releasedCount = 0;
                  // V318: az első élő blokkot nem engedjük ki azonnal 1-2 bizonytalan szóból.
                  // Ez szűri a kezdő "Microfoonprobe / Kazakhstan / UFO" jellegű félrehallást,
                  // de nem nyúl az audiohoz és nem épít új nyelvfelismerőt.
                  if(!firstSpeechBlockReleased && !initialSpeechGateOpen()) return 0;
                  while(true) {
                      String b = popReadySpeechBlock(flushAll);
                      if(b == null || b.trim().length() == 0) break;
          
                      // V318: egyetlen beviteli normalizáló blokk.
                      // Itt történik a tisztítás, a közvetlen ismétlés összehúzása,
                      // az előző blokk végével való átfedés levágása és a biztos duplázás kiszűrése.
                      // Alapelv: ha bizonytalan, átengedjük, nem nyeljük el a beszédet.
                      b = normalizeAndDeduplicateSpeechBlock(b);
                      if(b.length() == 0) continue;
                      // V318: valódi tolmács mód. A nyers STT blokkot nem zárjuk magyarra és
                      // nem dobjuk el helyi nyelvi kapuval. A TOP/BOTTOM forrásnyelvet a meglévő
                      // AI osztályozó + eredeti nyelvű helyreállító + fordító lépés dönti el.
                      // A helyi oldalbecslés csak ideiglenes kijelzési hely, az AI válasz után
                      // a blokk a tényleges SOURCE_LANG szerinti oldalra kerül.
                      boolean sourceGuessTop = sourceIsTopBySelectedPair(b, topActive);
                      int id = addSourceOnlyBlock(sourceGuessTop, b);
                      if(id < 0) continue;
                      firstSpeechBlockReleased = true;
                      speechTranslateQueue.add(id);
                      releasedCount++;
                      lastSpeechBlockReleasedAt = System.currentTimeMillis();
                  }
                  if(releasedCount > 0) {
                      // V318: sikeres kiírás után a régi idle flush már nem zárhat ugyanarra.
                      speechIdleFlushToken++;
                  }
                  // V318: a blokkok sorrendben kerülnek a meglévő egyetlen speech fordítási sorba.
                  // Egyszerre csak egy blokk fordul; a kézi FORDÍT lehetőség változatlanul megmarad.
                  if(releasedCount > 0) processNextSpeechTranslation();
                  return releasedCount;
              }
          
              boolean initialSpeechGateOpen() {
                  String s = speechTranscriptBuffer == null ? "" : speechTranscriptBuffer.trim();
                  if(s.length() == 0) return false;
                  int words = s.split("\\s+").length;
                  long age = firstSpeechHeardAt > 0L ? System.currentTimeMillis() - firstSpeechHeardAt : 0L;
          
                  // V318: nincs külön szótáras nyelvkapu az első blokknál.
                  // Rövid válasz is beszéd. Csak minimális stabilizálást várunk, hogy ne fél karakter menjen fordításra.
                  if(age >= MIN_TRUE_SPEECH_AUDIO_MS && s.length() >= 2 && words >= 1) return true;
                  if(firstHardSentenceEnd(s) >= 0 && words >= 1) return true;
                  if(s.length() >= 18 && words >= 2) return true;
                  return false;
              }
          
              int forceFlushTimedSpeechPrefix() {
                  try {
                      if(!firstSpeechBlockReleased && !initialSpeechGateOpen()) return 0;
                      String s = speechTranscriptBuffer == null ? "" : speechTranscriptBuffer;
                      String t = s.trim();
                      if(t.length() == 0) return 0;
          
                      int cut = safeWholeBufferFlushCut(s);
                      if(cut <= 0 || cut > s.length()) cut = s.length();
          
                      String b = s.substring(0, cut).trim();
                      speechTranscriptBuffer = s.substring(cut).trim();
                      speechBufferStartedAt = speechTranscriptBuffer.length() > 0 ? System.currentTimeMillis() : 0L;
          
                      b = normalizeAndDeduplicateSpeechBlock(b);
                      if(b.length() == 0) return 0;
          
                      boolean sourceGuessTop = sourceIsTopBySelectedPair(b, topActive);
                      int id = addSourceOnlyBlock(sourceGuessTop, b);
                      if(id < 0) return 0;
          
                      firstSpeechBlockReleased = true;
                      speechTranslateQueue.add(id);
                      lastSpeechBlockReleasedAt = System.currentTimeMillis();
                      processNextSpeechTranslation();
                      return 1;
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Timed transcript flush failed", e);
                      return 0;
                  }
              }
          
              boolean isAlreadyReleasedTranscript(String transcript) {
                  if(transcript == null) return false;
                  String b = cleanTranscriptForSelectedPair(transcript);
                  b = collapseAdjacentRepeatedPhrase(b);
                  b = finalizeSpeechBlockText(b);
                  b = applyTinyHungarianTermFixes(b);
                  b = b.trim().replaceAll("\\s+", " ");
                  if(b.length() == 0) return false;
                  String h = normalizeSpeechBlockHash(b);
                  if(h.length() < 8) return false;
                  return matchesVeryRecentReleasedBlock(h);
              }
          
              boolean matchesVeryRecentReleasedBlock(String h) {
                  if(h == null || h.length() < 8) return false;
                  if(recentSpeechBlockHashes.contains(h)) return true;
                  int checked = 0;
                  Iterator<String> it = recentSpeechBlockHashOrder.descendingIterator();
                  while(it.hasNext() && checked < 8) {
                      String old = it.next();
                      checked++;
                      if(old == null || old.length() < 8) continue;
                      int min = Math.min(h.length(), old.length());
                      int max = Math.max(h.length(), old.length());
                      if(min >= 18 && (h.contains(old) || old.contains(h)) && (min * 100 / Math.max(1, max)) >= 82) return true;
                  }
                  return false;
              }
          
              String normalizeAndDeduplicateSpeechBlock(String raw) {
                  if(raw == null) return "";
                  String b = cleanTranscriptForSelectedPair(raw);
          
                  // V318: egyetlen beviteli normalizáló lánc, nem új kapu.
                  // Előbb a blokkon belüli közvetlen ismétlést húzzuk össze bárhol,
                  // nem csak a blokk elején. Ez fogja meg a mondat közepén jelentkező
                  // közvetlen ismétlést is.
                  b = collapseAdjacentRepeatedPhrase(b);
                  b = finalizeSpeechBlockText(b);
                  b = applyTinyHungarianTermFixes(b);
          
                  // Utána csak az előző kész blokk végéből az új blokk elejére átcsúszó
                  // biztos átfedést vágjuk le. Ha bizonytalan, átengedjük.
                  b = trimRecentSpeechBlockOverlap(b);
                  if(b == null) return "";
                  b = b.trim().replaceAll("\\s+", " ");
                  if(b.length() == 0) return "";
                  if(!passesSelectedPairInputGate(b)) return "";
          
                  String h = normalizeSpeechBlockHash(b);
                  if(h.length() < 3) return "";
          
                  // V318: legutolsó lépésként, minden tisztítás után hasonlítunk a közvetlenül
                  // frissen kiadott blokkokhoz. Nem új kapu: ugyanennek a normalizáló blokknak
                  // a vége. Csak teljes vagy majdnem teljes ismétlést dobunk el.
                  if(matchesVeryRecentReleasedBlock(h)) return "";
          
                  rememberSpeechBlockHash(h);
                  return b;
              }
          
              String collapseAdjacentRepeatedPhrase(String raw) {
                  if(raw == null) return "";
                  String t = raw.trim().replaceAll("\\s+", " ");
                  if(t.length() == 0) return t;
                  String[] w = t.split("\\s+");
                  if(w.length < 6) return t;
          
                  ArrayList<String> out = new ArrayList<>();
                  int i = 0;
                  while(i < w.length) {
                      boolean collapsed = false;
                      int maxN = Math.min(10, (w.length - i) / 2);
                      for(int n=maxN; n>=3; n--) {
                          boolean same = true;
                          for(int j=0; j<n; j++) {
                              String a = normalizeSpeechBlockHash(w[i+j]);
                              String b = normalizeSpeechBlockHash(w[i+n+j]);
                              if(a.length() == 0 || !a.equals(b)) { same = false; break; }
                          }
                          if(same) {
                              for(int j=0; j<n; j++) out.add(w[i+j]);
                              i += n * 2;
                              collapsed = true;
                              break;
                          }
                      }
                      if(!collapsed) {
                          out.add(w[i]);
                          i++;
                      }
                  }
          
                  StringBuilder sb = new StringBuilder();
                  for(String x : out) {
                      if(sb.length() > 0) sb.append(' ');
                      sb.append(x);
                  }
                  return sb.toString().trim();
              }
          
              void rememberSpeechBlockHash(String h) {
                  if(h == null || h.length() < 3) return;
                  recentSpeechBlockHashes.add(h);
                  recentSpeechBlockHashOrder.add(h);
                  while(recentSpeechBlockHashOrder.size() > 80) {
                      String old = recentSpeechBlockHashOrder.poll();
                      if(old != null) recentSpeechBlockHashes.remove(old);
                  }
              }
          
              String finalizeSpeechBlockText(String raw) {
                  if(raw == null) return "";
                  String t = raw.trim().replaceAll("\\s+", " ");
                  while(t.startsWith(",") || t.startsWith(";") || t.startsWith(":")) t = t.substring(1).trim();
                  if(t.length() == 0) return "";
                  // V318: vesszőből / pontosvesszőből / kettőspontból nem gyártunk pontot.
                  // Ezek sokszor folytatást jelölnek, a hamis pont pedig rossz blokk- és
                  // nagybetűs mondatkezdést okozott.
                  return t;
              }
          
