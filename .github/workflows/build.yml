                  topLangBtn.setText("FELSŐ: " + code(topLang));
                  bottomLangBtn.setText("ALSÓ: " + code(bottomLang));
                  topLangBtn.setBackgroundColor(topActive ? Color.rgb(60,95,150) : Color.rgb(55,60,70));
                  bottomLangBtn.setBackgroundColor(!topActive ? Color.rgb(60,95,150) : Color.rgb(55,60,70));
                  styleUiState();
              }

              void startClipboardSystemSpeech() {
                  try {
                      if(clipboardSpeechActive) {
                          stopClipboardSystemSpeech(true);
                      } else {
                          startClipboardGoogleSpeech();
                      }
                  } catch(Exception e) {
                      Toast.makeText(this, "Vágólapos diktálás hiba: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              void startClipboardGoogleSpeech() {
                  try {
                      // Ágváltás: a főprogram mikrofonja teljesen álljon le, a vágólapos ág kapja a mikrofont.
                      if(streaming) stop();
                      backgroundScreenAllowed = false;
                      stopBackgroundForegroundService();

                      if(!SpeechRecognizer.isRecognitionAvailable(this)) {
                          Toast.makeText(this, "Google/Android beszédfelismerő nem elérhető ezen a készüléken.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      clipboardSpeechActive = true;
                      if(clipboardMicButton != null) {
                          clipboardMicButton.setText("STOP");
                          clipboardMicButton.setTextSize(13);
                          clipboardMicButton.setBackgroundColor(Color.rgb(150,55,50));
                      }
                      if(clipboardDialog == null || !clipboardDialog.isShowing()) {
                          clipboardForceFieldUpdate = true;
                          showClipboardTranslatorPanel("", "", "");
                      }
                      if(clipboardRawEdit != null) {
                          clipboardRawEdit.requestFocus();
                          clipboardSpeechBaseText = clipboardRawEdit.getText() == null ? "" : clipboardRawEdit.getText().toString().trim();
                      } else {
                          clipboardSpeechBaseText = "";
                      }
                      if(clipboardSpeechBaseText.equalsIgnoreCase("vágólap szövege") || clipboardSpeechBaseText.equalsIgnoreCase("fordítás") || clipboardSpeechBaseText.equalsIgnoreCase("javított vagy fordítandó szöveg")) clipboardSpeechBaseText = "";
                      clipboardSpeechCommittedText = clipboardSpeechBaseText;
                      clipboardSpeechLastPartial = "";

                      if(clipboardSpeechRecognizer == null) {
                          clipboardSpeechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                          clipboardSpeechRecognizer.setRecognitionListener(new RecognitionListener() {
                              @Override public void onReadyForSpeech(Bundle params) {}
                              @Override public void onBeginningOfSpeech() {}
                              @Override public void onRmsChanged(float rmsdB) {}
                              @Override public void onBufferReceived(byte[] buffer) {}
                              @Override public void onEndOfSpeech() {}
                              @Override public void onEvent(int eventType, Bundle params) {}

                              @Override public void onPartialResults(Bundle partialResults) {
                                  if(!clipboardSpeechActive) return;
                                  ArrayList<String> list = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if(list != null && list.size() > 0) showClipboardDictationPartial(list.get(0));
                              }

                              @Override public void onResults(Bundle results) {
                                  if(!clipboardSpeechActive) return;
                                  ArrayList<String> list = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if(list != null && list.size() > 0) commitClipboardDictationResult(list.get(0));
                                  else if(clipboardSpeechLastPartial != null && clipboardSpeechLastPartial.trim().length() > 0) commitClipboardDictationResult(clipboardSpeechLastPartial);
                                  stopClipboardSystemSpeech(false);
                                  autoPrepareClipboardRawText();
                              }

                              @Override public void onError(int error) {
                                  if(!clipboardSpeechActive) return;
                                  if(clipboardSpeechLastPartial != null && clipboardSpeechLastPartial.trim().length() > 0) {
                                      commitClipboardDictationResult(clipboardSpeechLastPartial);
                                  }
                                  stopClipboardSystemSpeech(false);
                                  autoPrepareClipboardRawText();
                                  Toast.makeText(MainActivity.this, "Diktálás vége.", Toast.LENGTH_SHORT).show();
                              }
                          });
                      }

                      clipboardSpeechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      clipboardSpeechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);

                      // V211: hivatalos Android 14+ nyelvfelismerés + nyelvváltás.
                      // Nem adunk EXTRA_LANGUAGE-t, mert az egyik nyelvre rögzítheti a motort.
                      // A felismerés és a váltás csak a főablakban kiválasztott két nyelv között történhet.
                      ArrayList<String> allowedSpeechLanguages = new ArrayList<>();
                      String speechTop = speechBcp47Tag(apiCode(topLang));
                      String speechBottom = speechBcp47Tag(apiCode(bottomLang));
                      if(speechTop.length() > 0 && !speechTop.equalsIgnoreCase("AUTO")) allowedSpeechLanguages.add(speechTop);
                      if(speechBottom.length() > 0 && !speechBottom.equalsIgnoreCase("AUTO") && !speechBottom.equalsIgnoreCase(speechTop)) allowedSpeechLanguages.add(speechBottom);

                      clipboardSpeechIntent.putExtra("android.speech.extra.ENABLE_LANGUAGE_DETECTION", true);
                      clipboardSpeechIntent.putStringArrayListExtra(
                          "android.speech.extra.LANGUAGE_DETECTION_ALLOWED_LANGUAGES",
                          allowedSpeechLanguages
                      );
                      clipboardSpeechIntent.putExtra("android.speech.extra.ENABLE_LANGUAGE_SWITCH", "balanced");
                      clipboardSpeechIntent.putStringArrayListExtra(
                          "android.speech.extra.LANGUAGE_SWITCH_ALLOWED_LANGUAGES",
                          allowedSpeechLanguages
                      );
                      clipboardSpeechIntent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                      clipboardSpeechIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                      clipboardSpeechIntent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 4000);
                      clipboardSpeechIntent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 3000);
                      clipboardSpeechIntent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 8000);

                      clipboardSpeechRecognizer.startListening(clipboardSpeechIntent);
                      Toast.makeText(this, "Vágólapos Google diktálás indul.", Toast.LENGTH_SHORT).show();
                  } catch(Exception e) {
                      stopClipboardSystemSpeech(false);
                      Toast.makeText(this, "A vágólapos Google diktálás nem indítható: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              void stopClipboardSystemSpeech(boolean toast) {
                  boolean wasActive = clipboardSpeechActive;
                  if(toast && wasActive && clipboardSpeechLastPartial != null && clipboardSpeechLastPartial.trim().length() > 0) {
                      commitClipboardDictationResult(clipboardSpeechLastPartial);
                  }
                  clipboardSpeechActive = false;
                  try { if(clipboardSpeechRecognizer != null) clipboardSpeechRecognizer.cancel(); } catch(Exception ignored) {}
                  if(clipboardMicButton != null) {
                      clipboardMicButton.setText("🎙");
                      clipboardMicButton.setTextSize(20);
                      clipboardMicButton.setBackgroundColor(Color.rgb(30,120,75));
                  }
                  if(toast) {
                      Toast.makeText(this, "Vágólapos diktálás leállítva.", Toast.LENGTH_SHORT).show();
                      scheduleClipboardAutoPrepare();
                  }
              }

              String normSpeech(String s) {
                  return s == null ? "" : s.trim().replaceAll("\\s+", " ").toLowerCase(Locale.ROOT);
              }

              String appendSpeechPart(String base, String part) {
                  base = base == null ? "" : base.trim();
                  part = part == null ? "" : part.trim();
                  if(part.length() == 0) return base;
                  if(base.length() == 0) return part;
                  String nb = normSpeech(base);
                  String np = normSpeech(part);
                  if(nb.endsWith(np) || nb.contains(np)) return base;
                  if(np.startsWith(nb)) return part;
                  return base + " " + part;
              }

              boolean sameOrGrowingPartial(String oldPart, String newPart) {
                  String a = normSpeech(oldPart);
                  String b = normSpeech(newPart);
                  if(a.length() == 0 || b.length() == 0) return true;
                  if(b.startsWith(a) || a.startsWith(b)) return true;
                  if(b.contains(a) || a.contains(b)) return true;
                  int n = Math.min(Math.min(a.length(), b.length()), 24);
                  if(n >= 8 && a.substring(0, n).equals(b.substring(0, n))) return true;
                  return false;
              }

              void renderClipboardDictationText(String text) {
                  if(clipboardRawEdit == null) return;
                  clipboardRawEdit.setText(text == null ? "" : text.trim());
                  clipboardRawEdit.requestFocus();
                  clipboardRawEdit.setSelection(clipboardRawEdit.getText().length());
                  clipboardResponseMode = true;
              }

              void showClipboardDictationPartial(String spoken) {
                  spoken = spoken == null ? "" : spoken.trim();
                  if(spoken.length() == 0 || clipboardRawEdit == null) return;

                  // Google partial sajátosság: rövid szünet után néha új részletet kezd,
                  // ami már nem tartalmazza az előző partialt. Ilyenkor az előző partialt
                  // megtartjuk, nem engedjük kitörölni.
                  if(clipboardSpeechLastPartial.length() > 0 && !sameOrGrowingPartial(clipboardSpeechLastPartial, spoken)) {
                      clipboardSpeechCommittedText = appendSpeechPart(clipboardSpeechCommittedText, clipboardSpeechLastPartial);
                  }

                  clipboardSpeechLastPartial = spoken;
                  renderClipboardDictationText(appendSpeechPart(clipboardSpeechCommittedText, clipboardSpeechLastPartial));
              }

              void commitClipboardDictationResult(String spoken) {
                  spoken = spoken == null ? "" : spoken.trim();
                  if(spoken.length() == 0) spoken = clipboardSpeechLastPartial == null ? "" : clipboardSpeechLastPartial.trim();
                  if(spoken.length() == 0 || clipboardRawEdit == null) return;

                  clipboardSpeechCommittedText = appendSpeechPart(clipboardSpeechCommittedText, spoken);
                  clipboardSpeechBaseText = clipboardSpeechCommittedText;
                  clipboardSpeechLastPartial = "";
                  renderClipboardDictationText(clipboardSpeechCommittedText);
              }

              @Override public void onBackPressed() {
                  if(clipboardDialog != null && clipboardDialog.isShowing()) {
                      stopClipboardSystemSpeech(false);
                      try { clipboardDialog.dismiss(); } catch(Exception ignored) {}
                      moveTaskToBack(true);
                      if(floatingTranslatorEnabled) new Handler().postDelayed(() -> ensureFloatingTranslator(), 250);
                      return;
                  }
                  if(floatingTranslatorEnabled) {
                      moveTaskToBack(true);
                      new Handler().postDelayed(() -> ensureFloatingTranslator(), 250);
                      return;
                  }
                  super.onBackPressed();
              }

              @Override public void onPause() {
                  super.onPause();
                  if(streaming && !backgroundScreenAllowed) stop();
                  if(!backgroundScreenAllowed) {
                      // Ha nincs külön engedélyezve, háttérbe kerüléskor marad a régi, biztonságos működés: leáll.
                      finalizingStop = false;
                      setLiveUiLocked(false);
                      try {
                          if(tts != null) tts.stop();
                          ttsSpeaking = false;
                      } catch(Exception ignored) {}
                      updateButtons();
                  }
                  if(floatingTranslatorEnabled) new Handler().postDelayed(() -> ensureFloatingTranslator(), 250);
              }

              @Override public void onResume() {
                  super.onResume();
                  if(!streaming) {
                      finalizingStop = false;
                      setLiveUiLocked(false);
                      updateButtons();
                  }
                  if(floatingTranslatorEnabled) new Handler().postDelayed(() -> ensureFloatingTranslator(), 250);
              }

              @Override public void onDestroy() {
                  hideFloatingTranslator();
                  stopClipboardSystemSpeech(false);
                  try { if(clipboardSpeechRecognizer != null) { clipboardSpeechRecognizer.destroy(); clipboardSpeechRecognizer = null; } } catch(Exception ignored) {}
                  if(streaming) stop();
                  else stopBackgroundForegroundService();
                  try {
                      if(tts != null) {
                          tts.stop();
                          tts.shutdown();
                      }
                  } catch(Exception ignored) {}
                  audioExec.shutdownNow();
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/V211.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/V211.aab
          ls -lah artifact

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: V211
          path: |
            artifact/*.apk
            artifact/*.aab
          if-no-files-found: error
