              void chooseMicLifeSignal() {
                  String current = String.valueOf(micLifeSignalMinutes);
                  chooseFrom("Mikrofon életjel", micLifeSignalModes, current, v -> {
                      try { micLifeSignalMinutes = Integer.parseInt(v); } catch(Exception ignored) { micLifeSignalMinutes = 0; }
                      save();
                      if(streaming) scheduleMicLifeSignal(); else cancelMicLifeSignal();
                  });
              }

              void scheduleMicLifeSignal() {
                  micLifeSignalHandler.removeCallbacks(micLifeSignalRunnable);
                  if(streaming && micLifeSignalMinutes > 0) {
                      micLifeSignalHandler.postDelayed(micLifeSignalRunnable, micLifeSignalMinutes * 60L * 1000L);
                  }
              }

              void cancelMicLifeSignal() {
                  micLifeSignalHandler.removeCallbacks(micLifeSignalRunnable);
              }

              boolean shouldPlayMicLifeSignalNow() {
                  if(!streaming || micLifeSignalMinutes <= 0) return false;
                  boolean screenInteractive = true;
                  boolean keyguardLocked = false;
                  try {
                      PowerManager pm = (PowerManager)getSystemService(POWER_SERVICE);
                      if(pm != null) screenInteractive = pm.isInteractive();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Screen state check failed", e);
                  }
                  try {
                      KeyguardManager km = (KeyguardManager)getSystemService(KEYGUARD_SERVICE);
                      if(km != null) keyguardLocked = km.isKeyguardLocked();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Keyguard state check failed", e);
                  }
                  return !activityInForeground || !screenInteractive || keyguardLocked;
              }

              void playMicLifeSignal() {
                  try {
                      android.os.Vibrator vibrator = (android.os.Vibrator)getSystemService(VIBRATOR_SERVICE);
                      if(vibrator != null && vibrator.hasVibrator()) {
                          long[] pattern = new long[]{0L, 220L, 120L, 300L};
                          if(Build.VERSION.SDK_INT >= 26) {
                              int[] amplitudes = new int[]{0, 220, 0, 255};
                              vibrator.vibrate(android.os.VibrationEffect.createWaveform(pattern, amplitudes, -1));
                          } else {
                              vibrator.vibrate(pattern, -1);
                          }
                      }
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Mic life vibration failed", e);
                  }
                  try {
                      final android.media.ToneGenerator tone = new android.media.ToneGenerator(AudioManager.STREAM_MUSIC, 100);
                      tone.startTone(android.media.ToneGenerator.TONE_PROP_BEEP2, 260);
                      micLifeSignalHandler.postDelayed(() -> {
                          try { tone.startTone(android.media.ToneGenerator.TONE_PROP_BEEP2, 300); }
                          catch(Exception e) { android.util.Log.w(LOG_TAG, "Second mic life beep failed", e); }
                      }, 380L);
                      micLifeSignalHandler.postDelayed(() -> {
                          try { tone.release(); } catch(Exception ignored) {}
                      }, 850L);
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Mic life beep failed", e);
                  }
              }

