              AudioRecord createInitializedAudioRecord(int source, int sampleRate, int requestedBufferBytes) {
                  AudioRecord candidate = null;
                  try {
                      int min = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      int safeMin = min > 0 ? min : CAPTURE_FRAME_BYTES * 8;
                      int bufferBytes = Math.max(requestedBufferBytes, Math.max(safeMin, CAPTURE_FRAME_BYTES * 8));
                      AudioFormat format = new AudioFormat.Builder()
                          .setSampleRate(sampleRate)
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                          .build();
                      candidate = new AudioRecord.Builder()
                          .setAudioSource(source)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(bufferBytes)
                          .build();
                      if(candidate.getState() == AudioRecord.STATE_INITIALIZED) {
                          if(candidate.getSampleRate() != sampleRate || candidate.getChannelCount() != 1) {
                              android.util.Log.e(LOG_TAG, "AudioRecord format mismatch: requested=" + sampleRate + " Hz mono, actual=" + candidate.getSampleRate() + " Hz channels=" + candidate.getChannelCount());
                              try { candidate.release(); } catch(Exception ignored) {}
                              return null;
                          }
                          return candidate;
                      }
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Phone microphone AudioRecord creation failed", e);
                  }
                  if(candidate != null) try { candidate.release(); } catch(Exception ignored) {}
                  return null;
              }
          
              List<AudioDeviceInfo> availableInputDevicesCompat() {
