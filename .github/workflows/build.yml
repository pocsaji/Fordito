              String normalizeAiSourceLangCode(String sourceLang) {
                  if (sourceLang == null) return "";
                  String value = Normalizer.normalize(sourceLang, Normalizer.Form.NFD)
                          .replaceAll("\\p{M}+", "")
                          .toLowerCase(Locale.ROOT)
                          .replace('_', '-')
                          .replaceAll("[^a-z-]", "")
                          .trim();
                  if (value.isEmpty()) return "";
                  if (value.equals("hu") || value.equals("hun") || value.equals("hu-hu") || value.equals("hungarian") || value.equals("magyar")) return "HU";
                  if (value.equals("fr") || value.equals("fra") || value.equals("fre") || value.equals("fr-fr") || value.equals("french") || value.equals("francais")) return "FR";
                  if (value.equals("en") || value.equals("eng") || value.equals("en-us") || value.equals("en-gb") || value.equals("english")) return "EN";
                  if (value.equals("de") || value.equals("deu") || value.equals("ger") || value.equals("de-de") || value.equals("german") || value.equals("deutsch")) return "DE";
                  if (value.equals("it") || value.equals("ita") || value.equals("it-it") || value.equals("italian") || value.equals("italiano")) return "IT";
                  if (value.equals("es") || value.equals("spa") || value.equals("es-es") || value.equals("spanish") || value.equals("espanol")) return "ES";
                  if (value.equals("ro") || value.equals("ron") || value.equals("rum") || value.equals("ro-ro") || value.equals("romanian") || value.equals("romana")) return "RO";
                  if (value.equals("hr") || value.equals("hrv") || value.equals("hr-hr") || value.equals("croatian") || value.equals("hrvatski")) return "HR";
                  if (value.equals("sk") || value.equals("slk") || value.equals("slo") || value.equals("sk-sk") || value.equals("slovak") || value.equals("slovencina")) return "SK";
