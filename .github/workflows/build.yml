              boolean isAlreadyReleased(String transcript) {
                  if (transcript == null) return false;
                  String block = cleanTranscript(transcript);
                  block = collapseAdjacentRepeatedPhrase(block);
                  block = finalizeBlockText(block);
                  block = applyTinyHungarianTermFixes(block);
                  block = block.trim().replaceAll("\\s+", " ");
