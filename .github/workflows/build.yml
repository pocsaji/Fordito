              String audioSourceLabel(int source) {
                  if(source == MediaRecorder.AudioSource.UNPROCESSED) return "UNPROCESSED";
                  if(source == MediaRecorder.AudioSource.VOICE_RECOGNITION) return "VOICE_RECOGNITION";
                  if(source == MediaRecorder.AudioSource.MIC) return "MIC";
                  return "source " + source;
              }
          
              AudioRecord makeBestAudioRecord(int sampleRate, int requestedBufferBytes) {
                  preferredInterpreterInputDevice = findBuiltInInterpreterMic();
                  if(preferredInterpreterInputDevice == null) {
                      android.util.Log.e(LOG_TAG, "No built-in phone microphone was reported by AudioManager");
                      return null;
                  }
                  for(int source : CAPTURE_AUDIO_SOURCES) {
                      AudioRecord candidate = createInitializedAudioRecord(source, sampleRate, requestedBufferBytes);
                      if(candidate == null) continue;
                      boolean accepted = false;
                      try { accepted = candidate.setPreferredDevice(preferredInterpreterInputDevice); }
                      catch(Exception e) { android.util.Log.e(LOG_TAG, "Built-in microphone preference failed for source=" + audioSourceLabel(source), e); }
                      if(!accepted) {
                          try { candidate.release(); } catch(Exception ignored) {}
                          android.util.Log.w(LOG_TAG, "Built-in microphone preference was rejected for source=" + audioSourceLabel(source));
                          continue;
                      }
                      AudioDeviceInfo routed = null;
                      try { routed = candidate.getRoutedDevice(); } catch(Exception ignored) {}
                      if(routed != null && routed.getType() != AudioDeviceInfo.TYPE_BUILTIN_MIC) {
                          try { candidate.release(); } catch(Exception ignored) {}
                          android.util.Log.w(LOG_TAG, "Refusing AudioRecord source=" + audioSourceLabel(source) + " because routed input is " + compactAudioDeviceLabel(routed));
                          continue;
                      }
                      android.util.Log.i(LOG_TAG, "AudioRecord locked to phone microphone, source=" + audioSourceLabel(source));
                      return candidate;
                  }
                  android.util.Log.e(LOG_TAG, "No acceptable built-in microphone AudioRecord could be created");
                  return null;
              }
          
