                      if(w==2) chooseProfile();
                      if(w==3) chooseMode();
                      if(w==4) chooseVad();
                      if(w==5) showDelayDialog();
                      if(w==6) chooseMicGate();
                      if(w==7) chooseInterpreterMode();
                      if(w==8) windowMenu();
                      if(w==9) resetCoreSettings();
                      updateButtons();
                  });
              }

              void windowMenu() {
                  if(uiLockedForLive || finalizingStop) return;
                  CharSequence[] items = {
                      menuItem("Felső ablak másolása", "felső nyelvgomb hosszú", false),
                      menuItem("Alsó ablak másolása", "alsó nyelvgomb hosszú", false),
                      menuItem("Teljes törlés", "mindkét ablak törlése", false),
                      menuItem("Kijelző elrendezés", displayModeLabel(), mirrorBottomMode)
                  };

                  showCenteredMenu("Ablakkezelés", items, (d,w) -> {
                      if(w==0) copyBox(true);
                      if(w==1) copyBox(false);
                      if(w==2) clearBothBoxes();
                      if(w==3) chooseDisplayMode();
                      updateButtons();
                  });
              }

              void clearTopBox() {
                  programmaticChange=true;
                  topBox.setText("");
                  programmaticChange=false;
                  topManualStart=-1;
                  textBlocks.clear();
                  Toast.makeText(this, "Felső ablak törölve.", Toast.LENGTH_SHORT).show();
              }

              void clearBottomBox() {
                  programmaticChange=true;
                  bottomBox.setText("");
                  programmaticChange=false;
                  bottomManualStart=-1;
                  textBlocks.clear();
                  Toast.makeText(this, "Alsó ablak törölve.", Toast.LENGTH_SHORT).show();
              }

              void clearBothBoxes() {
                  if(uiLockedForLive || finalizingStop) return;
                  programmaticChange=true;
                  topBox.setText("");
                  bottomBox.setText("");
                  programmaticChange=false;
                  topManualStart=-1;
                  bottomManualStart=-1;
                  textBlocks.clear();
                  Toast.makeText(this, "Mindkét ablak törölve.", Toast.LENGTH_SHORT).show();
              }

              void copyBox(boolean top) {
                  EditText source = top ? topBox : bottomBox;
                  String text = source.getText().toString();
                  if(text.trim().isEmpty()) {
                      Toast.makeText(this, top ? "A felső ablak üres." : "Az alsó ablak üres.", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  android.content.ClipboardManager cm = (android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  if(cm != null) {
                      cm.setPrimaryClip(android.content.ClipData.newPlainText(top ? "Felső ablak" : "Alsó ablak", text));
                      Toast.makeText(this, top ? "Felső ablak másolva." : "Alsó ablak másolva.", Toast.LENGTH_SHORT).show();
                  }
              }

              CharSequence menuItem(String title, String subtitle, boolean selected) {
                  String main = title == null ? "" : title;
                  String sub = subtitle == null ? "" : subtitle;
                  if(selected && sub.length() == 0) sub = "kiválasztva";
                  String full = sub.length() == 0 ? main : main + "\n" + sub;
                  SpannableString spn = new SpannableString(full);
                  spn.setSpan(new AlignmentSpan.Standard(Layout.Alignment.ALIGN_CENTER), 0, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  spn.setSpan(new RelativeSizeSpan(1.0f), 0, main.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  if(sub.length() > 0) {
                      int st = main.length() + 1;
                      spn.setSpan(new RelativeSizeSpan(0.72f), st, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      spn.setSpan(new ForegroundColorSpan(Color.LTGRAY), st, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  }
                  return spn;
              }

              void showCenteredMenu(String title, CharSequence[] items, DialogInterface.OnClickListener listener) {
                  new AlertDialog.Builder(this).setTitle(title).setItems(items, listener).show();
              }

              void showApi() {
                  EditText input = new EditText(this);
                  input.setSingleLine(true);
                  input.setText(apiKey == null ? "" : apiKey);
                  input.setHint("sk-...");
                  new AlertDialog.Builder(this)
                    .setTitle("OpenAI API kulcs")
                    .setView(input)
                    .setPositiveButton("Mentés", (d,w) -> { apiKey = input.getText().toString().trim(); save(); updateButtons(); })
                    .setNegativeButton("Mégse", null)
                    .show();
              }

              void chooseModel() { chooseFrom("AI modell", models, model, v -> { model = v; save(); restartIfNeeded(); }); }
              void chooseProfile() { chooseFrom("Beszélgetési profil", profiles, profile, v -> { profile = v; save(); sessionUpdateIfConnected(); }); }
              void chooseMode() { chooseFrom("Fordítás stílusa", modes, mode, v -> { mode = v; save(); sessionUpdateIfConnected(); }); }
              void chooseVad() { chooseFrom("Beszéd felismerése", vadModes, vadMode, v -> { vadMode = v; save(); sessionUpdateIfConnected(); }); }
              void chooseMicGate() { chooseFrom("Mikrofon érzékenysége", micGateModes, micGateMode, v -> { micGateMode = v; save(); }); }

              void resetCoreSettings() {
                  new AlertDialog.Builder(this)
                    .setTitle("Alapbeállítások")
                    .setMessage("Visszaállítsam az ajánlott fordítási és beszédfelismerési alapértékeket? Az API kulcs és a nyelvpár nem törlődik.")
                    .setPositiveButton("Igen", (d,w) -> {
                        model = "gpt-realtime-2";
                        profile = "truck_bulk";
                        mode = "natural";
                        vadMode = "low";
                        delayMode = "high";
                        micGateMode = "precise";
                        interpreterMode = false;
                        mirrorBottomMode = false;
                        save();
                        sessionUpdateIfConnected();
                        applyDisplayMode();
                        Toast.makeText(this, "Alapbeállítások visszaállítva.", Toast.LENGTH_SHORT).show();
                        updateButtons();
                    })
                    .setNegativeButton("Mégse", null)
                    .show();
              }

              String interpreterLabel() {
                  return interpreterMode ? "aktív – a kész fordítást felolvassa" : "inaktív – csak szöveges fordítás";
              }

              void chooseInterpreterMode() {
                  String[][] data = {
                      {"Inaktív", "off"},
                      {"Aktív", "on"}
                  };
                  CharSequence[] labels = new CharSequence[data.length];
                  for(int i=0;i<data.length;i++) {
                      boolean selected = interpreterMode ? "on".equals(data[i][1]) : "off".equals(data[i][1]);
                      String sub = "on".equals(data[i][1]) ? "a kész fordítást hangosan felolvassa" : "nem olvas fel, csak kiírja";
                      labels[i] = menuItem(data[i][0], sub + (selected ? " • kiválasztva" : ""), selected);
                  }
                  showCenteredMenu("Tolmács mód", labels, (d,w) -> {
                      interpreterMode = "on".equals(data[w][1]);
                      if(!interpreterMode) {
                          speakQueue.clear();
                          ttsSpeaking = false;
                          try { if(tts != null) tts.stop(); } catch(Exception ignored) {}
                      }
                      save();
                      updateButtons();
                  });
              }

              String displayModeLabel() {
                  return mirrorBottomMode ? "tükör mód – felső ablak fejjel lefelé" : "normál mód – mindkét ablak egy irányba";
              }

              void chooseDisplayMode() {
                  String[][] data = {
                      {"Normál mód", "normal"},
                      {"Tükör mód", "mirror"}
                  };
                  CharSequence[] labels = new CharSequence[data.length];
                  for(int i=0;i<data.length;i++) {
                      boolean selected = mirrorBottomMode ? "mirror".equals(data[i][1]) : "normal".equals(data[i][1]);
                      String sub = "mirror".equals(data[i][1]) ? "a felső ablak 180 fokkal elfordítva" : "mindkét ablak fentről lefelé olvasható";
                      labels[i] = menuItem(data[i][0], sub + (selected ? " • kiválasztva" : ""), selected);
                  }
                  showCenteredMenu("Kijelző elrendezés", labels, (d,w) -> {
                      mirrorBottomMode = "mirror".equals(data[w][1]);
                      applyDisplayMode();
                      save();
                      updateButtons();
                  });
              }

              void applyDisplayMode() {
                  try {
                      if(topBox != null) topBox.setRotation(mirrorBottomMode ? 180f : 0f);
                      if(bottomBox != null) bottomBox.setRotation(0f);
                  } catch(Exception ignored) {}
              }

              interface Setter { void set(String v); }

              void chooseFrom(String title, String[][] data, String current, Setter setter) {
                  CharSequence[] labels = new CharSequence[data.length];
                  for(int i=0;i<data.length;i++) labels[i] = menuItem(data[i][0], data[i][1].equals(current) ? "kiválasztva" : "", data[i][1].equals(current));
                  showCenteredMenu(title, labels, (d,w) -> {
                      setter.set(data[w][1]);
                      updateButtons();
                  });
              }

              void chooseLang(boolean top) {
                  if(uiLockedForLive || finalizingStop) return;
                  String current = top ? topLang : bottomLang;
                  CharSequence[] labels = new CharSequence[langs.length];
                  for(int i=0;i<langs.length;i++) labels[i] = menuItem(langs[i][0], langs[i][1] + (langs[i][2].equals(current) ? " • kiválasztva" : ""), langs[i][2].equals(current));
                  showCenteredMenu(top ? "Felső nyelv" : "Alsó nyelv", labels, (d,w) -> {
                      if(top) topLang = langs[w][2];
                      else bottomLang = langs[w][2];
                      // V56: nyelvválasztás nem jelent forrásablak-választást.
                      // A beszéd következő transcript blokkjánál automatikusan döntünk a felismert nyelv alapján.
                      topBox.clearFocus();
                      bottomBox.clearFocus();
                      save();
                      sessionUpdateIfConnected();
                      updateButtons();
                  });
              }

              void restartIfNeeded() {
                  if(streaming) {
                      stop();
                      new Handler().postDelayed(() -> start(true), 700);
                  }
              }

              void sessionUpdateIfConnected() {
                  if(ws != null && connected) sessionUpdate();
              }

              String profilePrompt() {
                  String base = "Default to natural everyday meaning. The profile is only a light terminology hint, not a forced interpretation. ";
                  if(profile.equals("truck_bulk")) return base + "If clearly relevant, prefer logistics/bulk transport terms such as loaded, unloaded, silo, weighing, site, freight, trailer, loading point and delivery point. Do not force truck meaning onto normal conversation.";
                  if(profile.equals("truck_tarp")) return base + "If clearly relevant, prefer road freight terms such as tarpaulin, straps, pallets, CMR, trailer, loading and unloading. Do not force truck meaning onto normal conversation.";
                  if(profile.equals("truck_general")) return base + "If clearly relevant, prefer transport, dispatcher, route, loading, unloading and site communication terminology. Do not force truck meaning onto normal conversation.";
                  if(profile.equals("logistics")) return base + "If clearly relevant, prefer logistics, warehouse, loading dock, pallet, shipment, sender and recipient terminology.";
                  if(profile.equals("medical")) return base + "Use medical terminology only when the text is clearly about symptoms, examination, medicine or treatment.";
                  if(profile.equals("restaurant")) return base + "Use natural restaurant ordering, food, drinks, payment and service language.";
                  if(profile.equals("tourism")) return base + "Use natural travel, directions, tickets and program vocabulary when relevant.";
                  if(profile.equals("hotel")) return base + "Use accommodation, booking, arrival, departure and payment vocabulary when relevant.";
                  if(profile.equals("bank")) return base + "Use banking, account, card, transfer and identification terms only when relevant.";
                  if(profile.equals("office")) return base + "Use official administration, document and customer service wording when relevant, without becoming overly legalistic.";
                  if(profile.equals("customs")) return base + "Use customs, border, freight document and inspection terminology only when clearly relevant.";
                  if(profile.equals("service")) return base + "Use vehicle service, machine repair, fault, part and repair terminology only when clearly relevant. Do not invent technical details.";
                  if(profile.equals("pharmacy")) return base + "Use pharmacy, medicine, dosage and symptom terminology only when relevant.";
                  return base + "General conversation.";
              }

              String modelLabel() { return labelOf(models, model); }
              String profileLabel() { return labelOf(profiles, profile); }
              String modeLabel() { return labelOf(modes, mode); }
              String vadLabel() { return labelOf(vadModes, vadMode); }

              String labelOf(String[][] arr, String key) {
                  for(String[] x: arr) if(x[1].equals(key)) return x[0];
                  return key;
              }

              String code(String code) {
                  if(code == null || code.isEmpty()) return "AUTO";
                  for(String[] l: langs) if(l[2].equals(code)) return l[1];
                  return code.toUpperCase(Locale.ROOT);
              }

              String apiCode(String code) {
                  if(code == null || code.isEmpty() || code.equals("AUTO")) return "";
                  for(String[] l: langs) {
                      if(l[1].equalsIgnoreCase(code)) return l[2];
                      if(l[2].equalsIgnoreCase(code)) return l[2];
                  }
                  return code.toLowerCase(Locale.ROOT);
              }

              void setLiveUiLocked(boolean locked) {
                  uiLockedForLive = locked;
                  try {
                      // V98: élő mikrofon alatt csak a két veszélyes alsó gomb záródik:
                      // FORDÍT és MENÜ. Az ablakokhoz, scrollhoz, nyelvgombokhoz nem nyúlunk.
                      boolean blocked = locked || finalizingStop;

                      if(translateBtn != null) translateBtn.setEnabled(!blocked);
                      if(menuBtn != null) menuBtn.setEnabled(!blocked);

                      styleUiState();
                  } catch(Exception ignored) {}
              }

              void styleUiState() {
                  try {
                      int active = Color.rgb(65,100,155);
                      int inactive = Color.rgb(75,80,90);
                      int disabled = Color.rgb(55,58,65);
                      int green = Color.rgb(30,140,70);
                      int red = Color.rgb(150,55,50);
                      int orange = Color.rgb(170,105,30);

                      if(topLangBtn != null) topLangBtn.setBackgroundColor(topActive ? active : inactive);
                      if(bottomLangBtn != null) bottomLangBtn.setBackgroundColor(!topActive ? active : inactive);
                      if(manualBtn != null) manualBtn.setBackgroundColor(manualEditMode ? green : red);
                      if(translateBtn != null) translateBtn.setBackgroundColor((uiLockedForLive || finalizingStop) ? disabled : inactive);
                      if(menuBtn != null) menuBtn.setBackgroundColor((uiLockedForLive || finalizingStop) ? disabled : inactive);

                      if(micBtn != null) {
                          micBtn.setEnabled(true);
                          if(finalizingStop) {
                              micBtn.setText("VÁRJ");
                              micBtn.setBackgroundColor(orange);
                          } else if(streaming) {
                              micBtn.setText("STOP");
                              micBtn.setBackgroundColor(green);
                          } else {
                              micBtn.setText("MIKROFON");
                              micBtn.setBackgroundColor(red);
                          }
                      }
                  } catch(Exception ignored) {}
              }

              void stopWithFinalizeDelay() {
                  if(finalizingStop) return;
                  finalizingStop = true;
                  try { stop(); } catch(Exception ignored) {}
                  state.setText("lezárás...");
                  setLiveUiLocked(true);
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {
                      finalizingStop = false;
                      setLiveUiLocked(false);
                      updateButtons();
                  }, 1800);
              }

              void updateButtons() {
                  micBtn.setText(streaming ? "STOP" : "MIKROFON");
                  micBtn.setBackgroundColor(streaming ? Color.rgb(30,130,70) : Color.rgb(90,50,50));
                  translateBtn.setBackgroundColor(Color.rgb(55,60,70));
                  menuBtn.setBackgroundColor(hasKey() ? Color.rgb(55,60,70) : Color.rgb(140,80,30));
                  topLangBtn.setText("FELSŐ: " + code(topLang));
                  bottomLangBtn.setText("ALSÓ: " + code(bottomLang));
                  topLangBtn.setBackgroundColor(topActive ? Color.rgb(60,95,150) : Color.rgb(55,60,70));
                  bottomLangBtn.setBackgroundColor(!topActive ? Color.rgb(60,95,150) : Color.rgb(55,60,70));
                  styleUiState();
              }

              @Override public void onPause() {
                  super.onPause();
                  if(streaming) stop();
                  // V98: ha háttérbe kerül az app, a mikrofon leáll,
                  // de a FORDÍT és MENÜ gombokat is vissza kell engedni.
                  finalizingStop = false;
                  setLiveUiLocked(false);
                  try {
                      if(tts != null) tts.stop();
                      ttsSpeaking = false;
                  } catch(Exception ignored) {}
                  updateButtons();
              }

              @Override public void onResume() {
                  super.onResume();
                  if(!streaming) {
                      finalizingStop = false;
                      setLiveUiLocked(false);
                      updateButtons();
                  }
              }

              @Override public void onDestroy() {
                  if(streaming) stop();
                  try {
                      if(tts != null) {
                          tts.stop();
                          tts.shutdown();
                      }
                  } catch(Exception ignored) {}
                  audioExec.shutdownNow();
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Fordito_V98.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Fordito_V98.aab
          ls -lah artifact

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Fordito_V98
          path: |
            artifact/*.apk
            artifact/*.aab
          if-no-files-found: error
