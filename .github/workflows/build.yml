              String interpreterQuickLabel() {
                  if(!interpreterMode) return "kikapcsolva – csak szöveges fordítás";
                  if("speaker".equals(interpreterAudioMode)) return "KIHANGOSÍTOTT MÓD";
                  return "BLUETOOTH MÓD";
              }

              void disableInterpreterQuick() {
                  interpreterMode = false;
                  interpreterAudioMode = "off";
                  ttsMuteUntilMs = 0L;
                  speakQueue.clear();
                  ttsSpeaking = false;
                  try { if(tts != null) tts.stop(); } catch(Exception ignored) {}
                  save();
                  Toast.makeText(this, "Tolmács mód kikapcsolva.", Toast.LENGTH_SHORT).show();
              }

              void toggleInterpreterQuick() {
                  if(!interpreterMode) {
                      interpreterMode = true;
                      interpreterAudioMode = lastInterpreterAudioMode;
                      if(!"speaker".equals(interpreterAudioMode) && !"headset".equals(interpreterAudioMode)) interpreterAudioMode = "headset";
                  } else {
                      if("headset".equals(interpreterAudioMode)) interpreterAudioMode = "speaker";
                      else interpreterAudioMode = "headset";
                  }
                  if("speaker".equals(interpreterAudioMode) || "headset".equals(interpreterAudioMode)) lastInterpreterAudioMode = interpreterAudioMode;
                  save();
                  Toast.makeText(this, interpreterQuickLabel(), Toast.LENGTH_SHORT).show();
