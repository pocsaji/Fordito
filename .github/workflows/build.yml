              void cleanSameLanguageHttp(String sourceText) {
                  try {
                      OkHttpClient http = new OkHttpClient.Builder()
                          .connectTimeout(25, TimeUnit.SECONDS).readTimeout(70, TimeUnit.SECONDS).writeTimeout(30, TimeUnit.SECONDS).build();
                      JSONObject root = new JSONObject();
                      root.put("model", model);
                      root.put("temperature", 0.1);
                      JSONArray messages = new JSONArray();
                      String instructions =
                          clipboardContextPrompt() +
                          "Work only in the original language. Repair the complete text into clear, coherent, natural native-language writing. " +
                          "Use the full text and selected context profile to correct obvious speech-recognition errors, broken word forms, missing punctuation and misplaced fragments when the intended meaning is clear. " +
                          "Do not translate. Do not invent facts, names, numbers, times, places or intentions. Preserve the speaker's meaning, tone and level of formality. " +
                          "Never censor, mask, redact, soften, sanitize or replace profanity, insults, slang, vulgar, sexual, rude or emotional wording. Write every word in full. " +
                          "Return ONLY the cleaned text, no labels, markdown, quotes or explanation.";
                      messages.put(new JSONObject().put("role","system").put("content",instructions));
                      messages.put(new JSONObject().put("role","user").put("content",sourceText));
                      root.put("messages",messages);
          
                      Request req = new Request.Builder().url("https://api.openai.com/v1/chat/completions")
                          .addHeader("Authorization","Bearer "+apiKey)
                          .addHeader("Content-Type","application/json")
                          .post(RequestBody.create(MediaType.parse("application/json; charset=utf-8"),root.toString())).build();
                      http.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this,"Szövegrendezési hiba: kapcsolat.",Toast.LENGTH_LONG).show());
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw=response.body()==null?"":response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> Toast.makeText(MainActivity.this,"Szövegrendezési hiba: HTTP "+response.code(),Toast.LENGTH_LONG).show());
                                  return;
                              }
                              try {
                                  JSONObject obj=new JSONObject(raw);
                                  String out=obj.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content","").trim();
                                  runOnUiThread(() -> {
                                      if(out.length()==0) { Toast.makeText(MainActivity.this,"Üres válasz érkezett.",Toast.LENGTH_LONG).show(); return; }
                                      setClipboardText(out);
                                      Toast.makeText(MainActivity.this,"Rendbe tett szöveg a vágólapon.",Toast.LENGTH_SHORT).show();
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(() -> Toast.makeText(MainActivity.this,"A válasz nem értelmezhető.",Toast.LENGTH_LONG).show());
                              }
                          }
                      });
                  } catch(Exception e) {
                      Toast.makeText(this,"Szövegrendezési hiba.",Toast.LENGTH_LONG).show();
                  }
              }
          
              android.view.View interpreterFloatingView;
              int interpreterFloatingX = 24;
