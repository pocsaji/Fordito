name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/attila/forditokonzol app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ForditoKonzol"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.6.1" apply false }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins { id("com.android.application") }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          android {
              namespace = "com.attila.forditokonzol"
              compileSdk = 35
              defaultConfig { applicationId = "hu.pocsaji.fordito"; minSdk = 26; targetSdk = 35; versionCode = 100; versionName = "10.0" }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:label="Fordito_V99" android:supportsRtl="true" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/attila/forditokonzol/MainActivity.java <<'EOF'
          package com.attila.forditokonzol;

          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.*;
          import android.media.audiofx.*;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.os.*;
          import android.text.*;
          import android.text.style.*;
          import android.util.Base64;
          import android.view.Gravity;
          import android.text.Layout;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.*;
          import org.json.*;
          import java.util.*;
          import java.util.concurrent.*;
          import okhttp3.*;

          public class MainActivity extends Activity {
              TextView state;
              EditText topBox, bottomBox;
              Button micBtn, translateBtn, menuBtn, topLangBtn, manualBtn, bottomLangBtn;
              SharedPreferences sp;
              OkHttpClient client;
              WebSocket ws;
              AudioRecord rec;
              NoiseSuppressor noiseSuppressor;
              AutomaticGainControl automaticGainControl;
              AcousticEchoCanceler acousticEchoCanceler;
              ExecutorService audioExec = Executors.newSingleThreadExecutor();

              TextToSpeech tts;
              boolean ttsReady = false;
              boolean ttsSpeaking = false;
              int ttsSeq = 0;
              final ArrayDeque<SpeakItem> speakQueue = new ArrayDeque<>();

              static class SpeakItem {
                  String text;
                  String lang;
                  SpeakItem(String text, String lang) {
                      this.text = text;
                      this.lang = lang;
                  }
              }

              boolean connected = false;
              boolean streaming = false;
              boolean topActive = true;
              boolean manualEditMode = true;
              boolean uiLockedForLive = false;
              boolean finalizingStop = false;
              boolean interpreterMode = false;
              boolean mirrorBottomMode = false;
              boolean manualTopSource = true;
              boolean responseInProgress = false;
              long sessionStart = 0L;
              String pendingOutput = "";
              String liveTranscriptBuffer = "";
              boolean liveTranslateMode = false;
              boolean liveHadTranscriptDelta = false;
              long firstSpeechHeardAt = 0L;
              long liveBufferStartedAt = 0L;
              int liveIdleFlushToken = 0;
              boolean firstSpeechBlockReleased = false;
              int pendingLiveBlockId = -1;
              final ArrayDeque<Integer> liveTranslateQueue = new ArrayDeque<>();
              final HashSet<String> recentLiveBlockHashes = new HashSet<>();
              final ArrayDeque<String> recentLiveBlockHashOrder = new ArrayDeque<>();
              String pendingManualText = "";
              boolean manualResponseMode = false;
              boolean programmaticChange = false;
              int topManualStart = -1;
              int bottomManualStart = -1;

              static final int MAX_BLOCK_SENTENCES = 3;
              static final int MAX_BLOCK_CHARS = 260;

              static class TextBlock {
                  String topText = "";
                  String bottomText = "";
                  boolean sourceTop = true;
                  boolean translatedOk = false;
                  int retryCount = 0;
              }

              final ArrayList<TextBlock> textBlocks = new ArrayList<>();
              final ArrayList<int[]> topRanges = new ArrayList<>();
              final ArrayList<int[]> bottomRanges = new ArrayList<>();

              String apiKey = "";
              String model = "gpt-realtime-2";
              String profile = "truck_bulk";
              String mode = "natural";
              String vadMode = "low";
              String delayMode = "high";
              String micGateMode = "precise";
              String topLang = "hu";
              String bottomLang = "fr";

              final String[][] langs = {
                  {"Automatikus","AUTO",""},
                  {"Magyar","HU","hu"},
                  {"Francia","FR","fr"},
                  {"Angol","EN","en"},
                  {"Német","DE","de"},
                  {"Olasz","IT","it"},
                  {"Spanyol","ES","es"},
                  {"Román","RO","ro"},
                  {"Horvát","HR","hr"},
                  {"Szlovák","SK","sk"},
                  {"Szlovén","SL","sl"}
              };

              final String[][] models = {
                  {"fordítási motor","gpt-realtime-2"},
                  {"Fordításra: GPT-Realtime-Translate","gpt-realtime-translate"}
              };

              final String[][] profiles = {
                  {"Általános beszélgetés","general"},
                  {"Turizmus / utazás","tourism"},
                  {"Étterem","restaurant"},
                  {"Szállás","hotel"},
                  {"Kamion – általános","truck_general"},
                  {"Kamion – ponyvás","truck_tarp"},
                  {"Kamion – ömlesztett áru","truck_bulk"},
                  {"Kamion – tartány","truck_tank"},
                  {"Logisztika / rakodás","logistics"},
                  {"Vám / határ","customs"},
                  {"Orvos","medical"},
                  {"Gyógyszertár","pharmacy"},
                  {"Bank","bank"},
                  {"Hivatal","office"},
                  {"Rendőrség","police"},
                  {"Autószerviz / gépjavítás","service"}
              };

              final String[][] modes = {
                  {"Pontos","precise"},
                  {"Természetes","natural"},
                  {"Tolmács","interpreter"}
              };

              final String[][] vadModes = {
                  {"Gyors – hamarabb lezárja a mondatot","high"},
                  {"Normál – ajánlott","medium"},
                  {"Várakozó – hosszabb szünetet is kivár","low"},
                  {"Automatikus","auto"}
              };

              final String[][] micGateModes = {
                  {"Pontos / zajos kabin","precise"},
                  {"Normál","normal"},
                  {"Érzékeny / halk beszéd","sensitive"}
              };

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("settings", MODE_PRIVATE);
                  load();
                  ui();
                  reqMic();
                  initTts();
              }

              void load() {
                  apiKey = sp.getString("apiKey", "");
                  model = sp.getString("model", "gpt-realtime-2");
                  profile = sp.getString("profile", "truck_bulk");
                  mode = sp.getString("mode", "natural");
                  vadMode = sp.getString("vadMode", "low");
                  delayMode = sp.getString("delayMode", "high");
                  micGateMode = sp.getString("micGateMode", "precise");
                  interpreterMode = sp.getBoolean("interpreterMode", false);
                  mirrorBottomMode = sp.getBoolean("mirrorBottomMode", false);
                  topLang = sp.getString("topLang", "fr");
                  bottomLang = sp.getString("bottomLang", "hu");
                  if("normal".equals(vadMode)) vadMode = "high";
              }

              void save() {
                  sp.edit()
                    .putString("apiKey", apiKey)
                    .putString("model", model)
                    .putString("profile", profile)
                    .putString("mode", mode)
                    .putString("vadMode", vadMode)
                    .putString("delayMode", delayMode)
                    .putString("micGateMode", micGateMode)
                    .putBoolean("interpreterMode", interpreterMode)
                    .putBoolean("mirrorBottomMode", mirrorBottomMode)
                    .putString("topLang", topLang)
                    .putString("bottomLang", bottomLang)
                    .apply();
              }

              void ui() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(8,62,8,170);
                  root.setBackgroundColor(Color.rgb(16,19,24));
                  setContentView(root);

                  LinearLayout bar = row();
                  TextView title = label("Fordito_V99");
                  state = label("készenlét");
                  state.setGravity(Gravity.RIGHT);
                  bar.addView(title, new LinearLayout.LayoutParams(0,42,1));
                  bar.addView(state, new LinearLayout.LayoutParams(0,42,1));
                  root.addView(bar);

                  LinearLayout langRow = row();
                  topLangBtn = btn("FELSŐ");
                  manualBtn = btn("MANUÁL");
                  bottomLangBtn = btn("ALSÓ");
                  langRow.addView(topLangBtn, new LinearLayout.LayoutParams(0,64,1));
                  langRow.addView(manualBtn, new LinearLayout.LayoutParams(0,64,1));
                  langRow.addView(bottomLangBtn, new LinearLayout.LayoutParams(0,64,1));
                  root.addView(langRow);

                  topBox = box("FELSŐ ABLAK — átirat / fordítás");
                  bottomBox = box("ALSÓ ABLAK — átirat / fordítás");
                  setManualEditMode(true);
                  root.addView(topBox, new LinearLayout.LayoutParams(-1,0,1));
                  android.view.View divider = new android.view.View(this);
                  divider.setBackgroundColor(Color.rgb(95,100,108));
                  root.addView(divider, new LinearLayout.LayoutParams(-1,8));
                  root.addView(bottomBox, new LinearLayout.LayoutParams(-1,0,1));

                  LinearLayout controls = row();
                  micBtn = btn("MIKROFON");
                  translateBtn = btn("FORDÍT");
                  menuBtn = btn("MENÜ");
                  controls.addView(micBtn, new LinearLayout.LayoutParams(0,74,1));
                  controls.addView(translateBtn, new LinearLayout.LayoutParams(0,74,1));
                  controls.addView(menuBtn, new LinearLayout.LayoutParams(0,74,1));
                  root.addView(controls);

                  topBox.setOnClickListener(v -> enterManualEditMode(true));
                  bottomBox.setOnClickListener(v -> enterManualEditMode(false));
                  topBox.setOnFocusChangeListener((v, hasFocus) -> { if(hasFocus) enterManualEditMode(true); });
                  bottomBox.setOnFocusChangeListener((v, hasFocus) -> { if(hasFocus) enterManualEditMode(false); });
                  topBox.addTextChangedListener(manualWatcher(true));
                  bottomBox.addTextChangedListener(manualWatcher(false));
                  applyDisplayMode();
                  manualBtn.setOnClickListener(v -> { if(!uiLockedForLive && !finalizingStop) toggleManualEditMode(); });
                  topLangBtn.setOnClickListener(v -> { if(!uiLockedForLive && !finalizingStop) chooseLang(true); });
                  bottomLangBtn.setOnClickListener(v -> { if(!uiLockedForLive && !finalizingStop) chooseLang(false); });
                  topLangBtn.setOnLongClickListener(v -> { if(!uiLockedForLive && !finalizingStop) copyBox(true); return true; });
                  bottomLangBtn.setOnLongClickListener(v -> { if(!uiLockedForLive && !finalizingStop) copyBox(false); return true; });
                  micBtn.setOnClickListener(v -> {
                      if(streaming || finalizingStop) {
                          stopWithFinalizeDelay();
                      } else if(!uiLockedForLive) {
                          start(true);
                      }
                  });
                  translateBtn.setOnClickListener(v -> { if(!uiLockedForLive && !finalizingStop) manualTranslate(); });
                  menuBtn.setOnClickListener(v -> { if(!uiLockedForLive && !finalizingStop) menu(); });
                  menuBtn.setOnLongClickListener(v -> { if(!uiLockedForLive && !finalizingStop) clearBothBoxes(); return true; });

                  updateButtons();
              }

              LinearLayout row() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  return l;
              }

              TextView label(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.LTGRAY);
                  t.setTextSize(12);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setTextSize(14);
                  b.setSingleLine(true);
                  b.setPadding(4,2,4,2);
                  return b;
              }

              EditText box(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(Color.GRAY);
                  e.setTextColor(Color.WHITE);
                  e.setTextSize(14);
                  e.setGravity(Gravity.TOP|Gravity.START);
                  e.setSingleLine(false);
                  e.setMinLines(5);
                  e.setVerticalScrollBarEnabled(true);
                  e.setScrollBarStyle(EditText.SCROLLBARS_INSIDE_INSET);
                  e.setScroller(new Scroller(this));
                  e.setBackgroundColor(Color.rgb(27,32,41));
                  e.setPadding(14,14,14,14);
                  e.setFocusable(false);
                  e.setFocusableInTouchMode(false);
                  e.setCursorVisible(false);
                  e.setLongClickable(false);
                  e.setTextIsSelectable(false);
                  return e;
              }

              void setManualEditMode(boolean enabled) {
                  manualEditMode = enabled;
                  try {
                      if(topBox != null) {
                          topBox.setFocusable(enabled);
                          topBox.setFocusableInTouchMode(enabled);
                          topBox.setCursorVisible(enabled);
                          topBox.setLongClickable(enabled);
                          topBox.setTextIsSelectable(enabled);
                      }
                      if(bottomBox != null) {
                          bottomBox.setFocusable(enabled);
                          bottomBox.setFocusableInTouchMode(enabled);
                          bottomBox.setCursorVisible(enabled);
                          bottomBox.setLongClickable(enabled);
                          bottomBox.setTextIsSelectable(enabled);
                      }
                      if(!enabled) {
                          if(topBox != null) topBox.clearFocus();
                          if(bottomBox != null) bottomBox.clearFocus();
                          hideKeyboard();
                      }
                      if(manualBtn != null) {
                          manualBtn.setText(enabled ? "KÉSZ" : "MANUÁL");
                          manualBtn.setBackgroundColor(enabled ? Color.rgb(34,139,34) : Color.rgb(150,55,50));
                      }
                  } catch(Exception ignored) {}
              }

              void toggleManualEditMode() {
                  setManualEditMode(!manualEditMode);
                  if(manualEditMode) {
                      if(streaming) stop();
                      Toast.makeText(this, "Manuális bevitel aktív", Toast.LENGTH_SHORT).show();
                  } else {
                      Toast.makeText(this, "Ablakok lezárva", Toast.LENGTH_SHORT).show();
                  }
              }

              void hideKeyboard() {
                  try {
                      InputMethodManager imm = (InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);
                      android.view.View v = getCurrentFocus();
                      if(imm != null && v != null) imm.hideSoftInputFromWindow(v.getWindowToken(), 0);
                  } catch(Exception ignored) {}
              }

              TextWatcher manualWatcher(final boolean top) {
                  return new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          if(programmaticChange) return;
                          enterManualEditMode(top);
                      }
                      public void afterTextChanged(Editable e) {
                          if(programmaticChange) return;
                                  // V77: nincs kézi blokkállapot.
                          // Gépelés közben nem bontjuk újra a blokkokat.
                          // FORDÍT gombnál a teljes aktív ablak fordul újra a másik ablakba.
                          updateButtons();
                      }
                  };
              }

              void enterManualEditMode(boolean top) {
                  if(!manualEditMode || uiLockedForLive || finalizingStop) return;
                  manualTopSource = top;
                  topActive = top;

                  // V98: kézi szerkesztés és live mikrofon nem futhat egyszerre.
                  // Ha a felhasználó bármelyik ablakba kattint vagy írni kezd,
                  // a mikrofon és minden függő live fordítás leáll. Így a kézi
                  // teljes ablakos fordításba nem írhat vissza későn érkező live válasz.
                  if(streaming) {
                      stop();
                      return;
                  }

                  try {
                      if(ws != null && responseInProgress) {
                          JSONObject cancel = new JSONObject();
                          cancel.put("type", "response.cancel");
                          ws.send(cancel.toString());
                      }
                  } catch(Exception ignored) {}

                  responseInProgress = false;
                  liveTranslateMode = false;
                  pendingLiveBlockId = -1;
                  pendingOutput = "";
                  liveTranslateQueue.clear();
                  updateButtons();
              }

              ArrayList<String> splitTextToBlocks(String text) {
                  ArrayList<String> out = new ArrayList<>();
                  if(text == null) return out;
                  String[] paragraphs = text.split("\\n", -1);
                  for(String paragraph: paragraphs) {
                      String p = paragraph.trim();
                      if(p.length() == 0) continue;
                      StringBuilder block = new StringBuilder();
                      int sentenceCount = 0;
                      for(int i=0;i<p.length();i++) {
                          char ch = p.charAt(i);
                          block.append(ch);
                          if(ch == '.' || ch == '!' || ch == '?' || ch == '…') sentenceCount++;
                          boolean sentenceLimit = sentenceCount >= MAX_BLOCK_SENTENCES;
                          boolean charLimit = block.length() >= MAX_BLOCK_CHARS;
                          boolean softBreak = (sentenceLimit || charLimit) && (i == p.length()-1 || Character.isWhitespace(p.charAt(i+1)));
                          if(softBreak) {
                              addCleanBlock(out, block.toString());
                              block.setLength(0);
                              sentenceCount = 0;
                          }
                      }
                      addCleanBlock(out, block.toString());
                  }
                  return out;
              }

              void addCleanBlock(ArrayList<String> out, String s) {
                  if(s == null) return;
                  String clean = s.trim();
                  if(clean.length() > 0) out.add(clean);
              }

              void renderPeerWindow(boolean editedTop) {
                  // A szerkesztett ablakban a felhasználó éppen gépel: ahhoz nem nyúlunk,
                  // hogy ne ugorjon a kurzor. A másik ablakot viszont azonnal a blokklistából
                  // rajzoljuk újra, így nem marad benne régi/stale fordítás.
                  EditText peer = editedTop ? bottomBox : topBox;
                  int peerScroll = peer.getScrollY();
                  int peerSel = Math.max(0, peer.getSelectionStart());
                  boolean peerHadFocus = peer.hasFocus();

                  StringBuilder sb = new StringBuilder();
                  for(int i=0;i<textBlocks.size();i++) {
                      TextBlock b = textBlocks.get(i);
                      String part = editedTop ? b.bottomText : b.topText;
                      sb.append(part == null ? "" : part);
                      if(i < textBlocks.size()-1) sb.append("\n\n");
                  }

                  programmaticChange = true;
                  try {
                      peer.setText(sb.toString());
                      peer.setSelection(Math.min(peerSel, peer.getText().length()));
                      if(peerHadFocus) peer.requestFocus();
                      peer.post(() -> peer.scrollTo(0, peerScroll));
                  } finally {
                      programmaticChange = false;
                  }
              }

              void addBlock(boolean sourceIsTop, String original, String translation) {
                  ArrayList<String> originals = splitTextToBlocks(original);
                  ArrayList<String> translations = splitTextToBlocks(translation);
                  int count = Math.max(originals.size(), translations.size());
                  if(count == 0) return;
                  for(int i=0;i<count;i++) {
                      TextBlock b = new TextBlock();
                      String o = i < originals.size() ? originals.get(i) : "";
                      String t = i < translations.size() ? translations.get(i) : "";
                      if(sourceIsTop) {
                          b.topText = o;
                          b.bottomText = t;
                      } else {
                          b.topText = t;
                          b.bottomText = o;
                      }
                      String srcSide = sourceIsTop ? b.topText : b.bottomText;
                      String tgtSide = sourceIsTop ? b.bottomText : b.topText;
                      b.sourceTop = sourceIsTop;
                      b.translatedOk = srcSide != null && srcSide.trim().length() > 0 && tgtSide != null && tgtSide.trim().length() > 0;
                      textBlocks.add(b);
                  }
                  renderBlocks();
              }

              void renderBlocks() {
                  renderBlocks(false);
              }

              void renderBlocksKeepView() {
                  // V98: élő fordítás alatt ne őrizze meg a régi scroll pozíciót,
                  // mert ettől nem megy le az ablak az új sorokra.
                  // Kézi/készenléti módban marad a régi nézetmegőrzés.
                  renderBlocks(!(streaming || uiLockedForLive || finalizingStop));
              }

              void renderBlocks(boolean keepView) {
                  int topScroll = topBox.getScrollY();
                  int bottomScroll = bottomBox.getScrollY();
                  int topSel = Math.max(0, topBox.getSelectionStart());
                  int bottomSel = Math.max(0, bottomBox.getSelectionStart());
                  boolean topHadFocus = topBox.hasFocus();
                  boolean bottomHadFocus = bottomBox.hasFocus();

                  StringBuilder top = new StringBuilder();
                  StringBuilder bottom = new StringBuilder();
                  topRanges.clear();
                  bottomRanges.clear();

                  for(int i=0;i<textBlocks.size();i++) {
                      TextBlock b = textBlocks.get(i);

                      int ts = top.length();
                      top.append(b.topText == null ? "" : b.topText);
                      int te = top.length();
                      topRanges.add(new int[]{ts, te});
                      if(i < textBlocks.size()-1) top.append("\n");

                      int bs = bottom.length();
                      bottom.append(b.bottomText == null ? "" : b.bottomText);
                      int be = bottom.length();
                      bottomRanges.add(new int[]{bs, be});
                      if(i < textBlocks.size()-1) bottom.append("\n");
                  }

                  programmaticChange = true;
                  try {
                      topBox.setText(top.toString());
                      bottomBox.setText(bottom.toString());
                      if(keepView) {
                          topBox.setSelection(Math.min(topSel, topBox.getText().length()));
                          bottomBox.setSelection(Math.min(bottomSel, bottomBox.getText().length()));
                          if(topHadFocus) topBox.requestFocus();
                          if(bottomHadFocus) bottomBox.requestFocus();
                          topBox.post(() -> topBox.scrollTo(0, topScroll));
                          bottomBox.post(() -> bottomBox.scrollTo(0, bottomScroll));
                      } else {
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      }
                  } finally {
                      programmaticChange = false;
                  }
              }

              void initTts() {
                  try {
                      tts = new TextToSpeech(this, status -> {
                          ttsReady = status == TextToSpeech.SUCCESS;
                          if(ttsReady && tts != null) {
                              tts.setSpeechRate(1.0f);
                              tts.setPitch(1.0f);
                              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override public void onStart(String utteranceId) {}
                                  @Override public void onDone(String utteranceId) {
                                      runOnUiThread(() -> {
                                          ttsSpeaking = false;
                                          drainSpeakQueue();
                                      });
                                  }
                                  @Override public void onError(String utteranceId) {
                                      runOnUiThread(() -> {
                                          ttsSpeaking = false;
                                          drainSpeakQueue();
                                      });
                                  }
                                  @Override public void onError(String utteranceId, int errorCode) {
                                      runOnUiThread(() -> {
                                          ttsSpeaking = false;
                                          drainSpeakQueue();
                                      });
                                  }
                              });
                              drainSpeakQueue();
                          }
                      });
                  } catch(Exception ignored) {}
              }

              Locale localeForTts(String lang) {
                  String l = lang == null ? "" : lang.toLowerCase(Locale.ROOT);
                  if(l.equals("hu")) return new Locale("hu", "HU");
                  if(l.equals("fr")) return Locale.FRANCE;
                  if(l.equals("en")) return Locale.ENGLISH;
                  if(l.equals("de")) return Locale.GERMAN;
                  if(l.equals("it")) return Locale.ITALIAN;
                  if(l.equals("es")) return new Locale("es", "ES");
                  if(l.equals("ro")) return new Locale("ro", "RO");
                  if(l.equals("hr")) return new Locale("hr", "HR");
                  if(l.equals("sk")) return new Locale("sk", "SK");
                  if(l.equals("sl")) return new Locale("sl", "SI");
                  return Locale.getDefault();
              }

              void enqueueSpeak(String translatedText, String targetLang) {
                  try {
                      if(!interpreterMode) return;
                      if(translatedText == null) return;
                      String s = translatedText.trim();
                      if(s.isEmpty()) return;
                      speakQueue.add(new SpeakItem(s, targetLang));
                      drainSpeakQueue();
                  } catch(Exception ignored) {}
              }

              void drainSpeakQueue() {
                  try {
                      if(!interpreterMode) {
                          speakQueue.clear();
                          ttsSpeaking = false;
                          return;
                      }
                      if(tts == null || !ttsReady || ttsSpeaking || speakQueue.isEmpty()) return;
                      SpeakItem item = speakQueue.poll();
                      if(item == null || item.text == null || item.text.trim().isEmpty()) {
                          drainSpeakQueue();
                          return;
                      }
                      try { tts.setLanguage(localeForTts(item.lang)); } catch(Exception ignored) {}
                      ttsSpeaking = true;
                      Bundle params = new Bundle();
                      String id = "fordito_tts_" + (++ttsSeq);
                      int r = tts.speak(item.text, TextToSpeech.QUEUE_FLUSH, params, id);
                      if(r == TextToSpeech.ERROR) {
                          ttsSpeaking = false;
                          drainSpeakQueue();
                      }
                  } catch(Exception ignored) {
                      ttsSpeaking = false;
                  }
              }

              void reqMic() {
                  if(Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1001);
              }

              boolean hasKey() {
                  return apiKey != null && apiKey.trim().startsWith("sk-");
              }

              void start(boolean withAudio) {
                  if(!hasKey()) { showApi(); return; }
                  if(withAudio && Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) { reqMic(); return; }
                  if(withAudio && sessionStart == 0L) sessionStart = System.currentTimeMillis();
                  if(withAudio && System.currentTimeMillis() - sessionStart > 20L*60L*1000L) { confirm(); return; }

                  state.setText("kapcsolódás");
                  client = new OkHttpClient.Builder().readTimeout(0, TimeUnit.MILLISECONDS).build();
                  Request req = new Request.Builder()
                    .url("wss://api.openai.com/v1/realtime?model=" + model)
                    .addHeader("Authorization", "Bearer " + apiKey.trim())
                    .build();

                  ws = client.newWebSocket(req, new WebSocketListener() {
                      @Override public void onOpen(WebSocket w, Response r) {
                          connected = true;
                          runOnUiThread(() -> {
                              sessionUpdate();
                              if(withAudio) audioLoop();
                              else state.setText("fordítási kapcsolat");
                              updateButtons();
                              if(!withAudio && pendingManualText.length() > 0) {
                                  String p = pendingManualText;
                                  pendingManualText = "";
                                  new Handler().postDelayed(() -> sendManualText(p), 500);
                              }
                          });
                      }

                      @Override public void onMessage(WebSocket w, String s) {
                          event(s);
                      }

                      @Override public void onFailure(WebSocket w, Throwable t, Response r) {
                          runOnUiThread(() -> handleConnectionFailure(t));
                      }

                      @Override public void onClosed(WebSocket w, int c, String reason) {
                          connected = false;
                          runOnUiThread(() -> {
                              state.setText("lezárva");
                              updateButtons();
                          });
                      }
                  });
              }

              void sessionUpdate() {
                  try {
                      JSONObject session = new JSONObject();
                      session.put("type", "realtime");
                      session.put("model", model);
                      session.put("instructions", instructions());
                      session.put("output_modalities", new JSONArray().put("text"));

                      // Speech recognition: use Realtime semantic VAD, not a fixed silence timer.
                      // The client only streams PCM16 audio; the API decides semantic speech boundaries.
                      JSONObject vad = new JSONObject();
                      vad.put("type", "semantic_vad");
                      vad.put("eagerness", vadMode);
                      // V47: a beszédhatárt továbbra is a Realtime dönti el,
                      // de NEM kérünk automatikus nagy válaszblokkot az audio végén.
                      // A fordítás a beérkező transcript-delta szövegblokkokból indul.
                      vad.put("create_response", false);

                      JSONObject input = new JSONObject();
                      JSONObject format = new JSONObject();
                      format.put("type", "audio/pcm");
                      format.put("rate", 24000);
                      input.put("format", format);
                      input.put("turn_detection", vad);

                      // V98: OpenAI Realtime oldali zajszűrés.
                      // Telefon közeli beszédhez near_field való; ez a VAD és a modell előtt szűr.
                      JSONObject nr = new JSONObject();
                      nr.put("type", "near_field");
                      input.put("noise_reduction", nr);

                      JSONObject tr = new JSONObject();
                      tr.put("model", "gpt-realtime-whisper");
                      // V60: Realtime transcription nem támogat prompt paramétert ezen az endpointon.
                      // Ezért itt NEM küldünk promptot; a nyelvpár-döntés az átirat beérkezése után történik.
                      // V56: ne kössük a beszédfelismerést az éppen fókuszos ablak nyelvéhez.
                      // A mikrofon futása közbeni nyelvváltásnál ez keverte össze a felső/alsó ablakot.
                      // A Realtime automatikusan felismeri a beszélt nyelvet, mi pedig a transcript szövege alapján
                      // döntjük el, hogy a két kiválasztott nyelv közül melyik oldal a forrás.
                      tr.put("delay", delayMode);
                      input.put("transcription", tr);

                      JSONObject audio = new JSONObject();
                      audio.put("input", input);

                      session.put("audio", audio);

                      JSONObject evt = new JSONObject();
                      evt.put("type", "session.update");
                      evt.put("session", session);
                      ws.send(evt.toString());
                  } catch(Exception e) {
                      append("\n[session hiba] " + e.getMessage());
                  }
              }

              String pairRules() {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "Selected language pair is locked to exactly these two languages: TOP=" + top + ", BOTTOM=" + bottom + ". " +
                    "Only these two languages exist for this session. Never classify, output, or translate as any third language. " +
                    "If the rough transcript looks like any language other than the selected TOP or BOTTOM language, treat it as a recognition error or background noise. " +
                    "Resolve meaningful speech only as " + top + " or " + bottom + ". If it cannot be reasonably repaired as one of those two selected languages, output nothing for that block. " +
                    "If unsure between the two selected languages, choose the closer of " + top + " and " + bottom + "; do not invent a third option. ";
              }

              String instructions() {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "You are a live two-language interpreter. Output text only. No explanations. " +
                    pairRules() +
                    "The user may switch between TOP and BOTTOM while the microphone is running. Every completed speech block must be classified again using only the selected pair. " +
                    "Do not turn background noise, engine hum, wind, radio, clicks or breathing into speech. If meaningful human speech is not present, output nothing. " +
                    "Do not wait for a long monologue. Treat every complete sentence, short clause, numbered item, or list item as a finished block. " +
                    "For every completed block return exactly three lines: SOURCE_LANG: <" + top + " or " + bottom + "> then ORIGINAL: <clean original in the detected selected language> then TRANSLATION: <natural translation into the other selected language>. " +
                    "Keep ORIGINAL short and readable. Correct only obvious speech recognition mistakes; do not invent missing facts. " +
                    "Conversation profile: " + profilePrompt() + " " +
                    "Translation mode: " + modePrompt();
              }

              String manualBlockInstructions() {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "You are a translation engine for the FULL edited window text. " +
                    "The user message contains SOURCE_LANG, TARGET_LANG and TEXT fields. " +
                    "Translate the entire TEXT from SOURCE_LANG to TARGET_LANG. " +
                    "The selected languages are " + top + " and " + bottom + ". " +
                    "Return ONLY the translated full text. Preserve paragraphs and line breaks where reasonable. " +
                    "Never include labels such as SOURCE_LANG, TARGET_LANG, ORIGINAL, TEXT or TRANSLATION. " +
                    "No markdown, no quotes, no explanation. " +
                    "Keep meaning, context and tone. " + modePrompt();
              }

              String liveBlockInstructions(boolean ignoredSourceIsTop) {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "You are translating ONE already segmented rough speech transcript block. " +
                    pairRules() +
                    "Decide whether TEXT is TOP=" + top + " or BOTTOM=" + bottom + ". " +
                    "Return EXACTLY three lines and nothing else: SOURCE_LANG: <" + top + " or " + bottom + "> then ORIGINAL: <cleaned original text> then TRANSLATION: <natural translation into the other selected language>. " +
                    "If TEXT contains third-language-looking fragments or foreign-script junk, do not preserve them; repair or ignore them using only the selected pair. " +
                    "If TEXT is mostly not one of the two selected languages, return empty ORIGINAL and empty TRANSLATION rather than hallucinating. " +
                    "Do not merge this block with earlier or later speech. Do not invent information. " + modePrompt();
              }

              String modePrompt() {
                  if(mode.equals("precise")) return "Precise mode: stay close to the meaning, do not expand, but always use correct natural grammar.";
                  if(mode.equals("interpreter")) return "Interpreter mode: use context strongly, make the translation sound like a human interpreter, but do not invent facts.";
                  return "Natural mode: translate meaning naturally and fluently, with light correction only.";
              }


              String micGateLabel() { return labelOf(micGateModes, micGateMode); }

              int micGateThreshold() {
                  if("sensitive".equals(micGateMode)) return 0;
                  if("normal".equals(micGateMode)) return 180;
                  return 320;
              }

              int avgAbsPcm16(byte[] data, int len) {
                  if(data == null || len < 2) return 0;
                  long sum = 0;
                  int samples = 0;
                  for(int i=0; i+1<len; i+=2) {
                      int lo = data[i] & 0xff;
                      int hi = data[i+1];
                      int v = (hi << 8) | lo;
                      sum += Math.abs(v);
                      samples++;
                  }
                  if(samples == 0) return 0;
                  return (int)(sum / samples);
              }

              byte[] prepareAudioChunk(byte[] data, int len) {
                  int threshold = micGateThreshold();
                  if(threshold <= 0 || avgAbsPcm16(data, len) >= threshold) return Arrays.copyOf(data, len);
                  // Nem eldobjuk a csendes/zajos részt, hanem nullára húzzuk.
                  // Így a Realtime VAD továbbra is érzékeli a szünetet, de kevesebb kabinzaj jut át.
                  return new byte[len];
              }

              String delayLabel() {
                  if("low".equals(delayMode)) return "Gyors – kisebb késleltetés";
                  if("high".equals(delayMode)) return "Pontos – precízebb hangbevitel";
                  return "Kiegyensúlyozott – ajánlott";
              }

              void showDelayDialog() {
                  final String[] names = {"Gyors", "Kiegyensúlyozott", "Pontos"};
                  final String[] vals = {"low", "medium", "high"};
                  int checked = 1;
                  if("low".equals(delayMode)) checked = 0;
                  else if("high".equals(delayMode)) checked = 2;

                  new AlertDialog.Builder(this)
                      .setTitle("Beszédfelismerés pontossága")
                      .setSingleChoiceItems(names, checked, (d, which) -> {
                          delayMode = vals[which];
                          save();
                          d.dismiss();
                          Toast.makeText(this, "Új kapcsolatnál érvényesül: " + names[which], Toast.LENGTH_SHORT).show();
                      })
                      .setNegativeButton("Mégse", null)
                      .show();
              }

              void enableAndroidAudioEffects() {
                  try {
                      if(rec == null) return;
                      int sid = rec.getAudioSessionId();

                      if(NoiseSuppressor.isAvailable()) {
                          noiseSuppressor = NoiseSuppressor.create(sid);
                          if(noiseSuppressor != null) noiseSuppressor.setEnabled(true);
                      }

                      if(AutomaticGainControl.isAvailable()) {
                          automaticGainControl = AutomaticGainControl.create(sid);
                          if(automaticGainControl != null) automaticGainControl.setEnabled(true);
                      }

                      if(AcousticEchoCanceler.isAvailable()) {
                          acousticEchoCanceler = AcousticEchoCanceler.create(sid);
                          if(acousticEchoCanceler != null) acousticEchoCanceler.setEnabled(true);
                      }
                  } catch(Exception ignored) {}
              }

              void releaseAndroidAudioEffects() {
                  try {
                      if(noiseSuppressor != null) noiseSuppressor.release();
                  } catch(Exception ignored) {}
                  try {
                      if(automaticGainControl != null) automaticGainControl.release();
                  } catch(Exception ignored) {}
                  try {
                      if(acousticEchoCanceler != null) acousticEchoCanceler.release();
                  } catch(Exception ignored) {}

                  noiseSuppressor = null;
                  automaticGainControl = null;
                  acousticEchoCanceler = null;
              }

              void audioLoop() {
                  int sr = 24000;
                  int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  int bs = Math.max(min, 4096);

                  // V98: zajos kabin / ventilátor mellett VOICE_COMMUNICATION jobb,
                  // mert Android oldalon használhat AEC/AGC/NS előfeldolgozást, ha a készülék támogatja.
                  rec = new AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bs);
                  enableAndroidAudioEffects();
                  streaming = true;
                      setLiveUiLocked(true);
                  rec.startRecording();
                  updateButtons();

                  audioExec.submit(() -> {
                      byte[] buf = new byte[bs];
                      while(streaming && connected && ws != null && rec != null) {
                          int read = rec.read(buf, 0, buf.length);
                          if(read > 0) {
                              try {
                                  byte[] chunk = prepareAudioChunk(buf, read);
                                  JSONObject evt = new JSONObject();
                                  evt.put("type", "input_audio_buffer.append");
                                  evt.put("audio", Base64.encodeToString(chunk, Base64.NO_WRAP));
                                  ws.send(evt.toString());
                              } catch(Exception ignored) {}
                          }
                      }
                  });
              }

              void handleConnectionFailure(Throwable t) {
                  String msg = t == null ? "ismeretlen hiba" : String.valueOf(t.getMessage());

                  // V77: kézi fordításnál nincs blokkállapot. Hiba esetén nem írunk semmit az ablakokba.
                  if(manualResponseMode) {
                      manualResponseMode = false;
                      pendingManualText = "";
                      Toast.makeText(this, "Kapcsolat hiba kézi fordítás közben. Próbáld újra a FORDÍT gombbal.", Toast.LENGTH_LONG).show();
                      stop();
                      return;
                  }

                  // Normál beszéd/élő fordításnál se írjunk hibaüzenetet a fordítási ablakba.
                  Toast.makeText(this, "Kapcsolat hiba: " + msg, Toast.LENGTH_LONG).show();
                  stop();
              }

              void stop() {
                  streaming = false;
                  connected = false;
                  releaseAndroidAudioEffects();
                  try { if(rec != null) { rec.stop(); rec.release(); } } catch(Exception ignored) {}
                  rec = null;
                  liveTranscriptBuffer = "";
                  liveHadTranscriptDelta = false;
                  firstSpeechHeardAt = 0L;
                  liveBufferStartedAt = 0L;
                  liveIdleFlushToken++;
                  firstSpeechBlockReleased = false;
                  liveTranslateMode = false;
                  pendingLiveBlockId = -1;
                  liveTranslateQueue.clear();
                  recentLiveBlockHashes.clear();
                  recentLiveBlockHashOrder.clear();
                  try { if(ws != null) ws.close(1000, "stop"); } catch(Exception ignored) {}
                  ws = null;
                  runOnUiThread(() -> {
                      state.setText("készenlét");
                      updateButtons();
                  });
              }

              void event(String s) {
                  try {
                      JSONObject o = new JSONObject(s);
                      String type = o.optString("type", "");

                      if(type.equals("response.created")) {
                          responseInProgress = true;
                      }

                      if(type.equals("response.done")) {
                          responseInProgress = false;
                          // V77: ha egy live fordítás válasz nélkül zárult, a blokk nem számít késznek; később pótolható.
                          if(liveTranslateMode && pendingLiveBlockId >= 0 && pendingOutput.trim().length() == 0) {
                              int missId = pendingLiveBlockId;
                              pendingLiveBlockId = -1;
                              liveTranslateMode = false;
                              runOnUiThread(() -> renderBlocksKeepView());
                          }
                          // V55: élő fordítási sor csak akkor induljon tovább,
                          // amikor az előző response ténylegesen lezárult a szerver szerint.
                          // Különben a következő response.create könnyen "response in progress" hibára fut,
                          // és a fordítás az első blokk után megáll.
                          if(!liveTranslateMode && !liveTranslateQueue.isEmpty()) {
                              runOnUiThread(() -> processNextLiveTranslation());
                          }
                      }

                      if(type.equals("conversation.item.input_audio_transcription.delta")) {
                          String d = o.optString("delta", "");
                          if(!d.isEmpty()) runOnUiThread(() -> handleTranscriptDelta(d));
                      }

                      if(type.equals("conversation.item.input_audio_transcription.completed")) {
                          String tr = o.optString("transcript", "");
                          if(!tr.isEmpty()) runOnUiThread(() -> handleTranscriptCompleted(tr));
                      }

                      if(type.equals("response.text.delta") || type.equals("response.output_text.delta")) {
                          String d = o.optString("delta", "");
                          if(!d.isEmpty()) pendingOutput += d;
                      }

                      if(type.equals("response.output_text.done") || type.equals("response.text.done")) {
                          String out = pendingOutput.trim();
                          pendingOutput = "";
                          if(!out.isEmpty()) runOnUiThread(() -> routeAiOutput(out));
                      }

                      if(type.equals("error")) {
                          JSONObject er = o.optJSONObject("error");
                          String msg = er == null ? o.toString() : er.optString("message", er.toString());
                          if(msg.contains("response in progress")) {
                              responseInProgress = true;
                              // V55: ha live fordítás közben túl korán próbáltunk új választ indítani,
                              // ne nyeljük le végleg a sort: röviden visszarakjuk a blokkot és újrapróbáljuk.
                              if(liveTranslateMode && pendingLiveBlockId >= 0) {
                                  int retryId = pendingLiveBlockId;
                                  pendingLiveBlockId = -1;
                                  liveTranslateMode = false;
                                  liveTranslateQueue.add(retryId);
                                  new Handler().postDelayed(() -> processNextLiveTranslation(), 700);
                              }
                          }
                          if(manualResponseMode) {
                              runOnUiThread(() -> handleConnectionFailure(new RuntimeException(msg)));
                          } else {
                              runOnUiThread(() -> Toast.makeText(this, "API hiba: " + msg, Toast.LENGTH_LONG).show());
                          }
                      }
                  } catch(Exception e) {
                      runOnUiThread(() -> append("\n[event hiba] " + e.getMessage()));
                  }
              }

              void manualTranslate() {
                  if(uiLockedForLive || finalizingStop) return;
                  EditText source = manualTopSource ? topBox : bottomBox;
                  source.clearFocus();
                  try {
                      InputMethodManager imm = (InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);
                      imm.hideSoftInputFromWindow(source.getWindowToken(), 0);
                  } catch(Exception ignored) {}

                  String sourceText = source.getText().toString().trim();
                  if(sourceText.length() == 0) {
                      Toast.makeText(this, manualTopSource ? "A felső ablak üres." : "Az alsó ablak üres.", Toast.LENGTH_LONG).show();
                      return;
                  }

                  if(!hasKey()) { showApi(); return; }

                  String srcCode = manualTopSource ? code(topLang) : code(bottomLang);
                  String tgtCode = manualTopSource ? code(bottomLang) : code(topLang);
                  String payload = "SOURCE_LANG: " + srcCode + "\n"
                       + "TARGET_LANG: " + tgtCode + "\n"
                       + "TEXT:\n" + sourceText;

                  if(ws == null || !connected) {
                      pendingManualText = payload;
                      start(false);
                  } else {
                      sendManualText(payload);
                  }
              }

              void sendManualText(String text) {
                  topActive = manualTopSource;
                  liveTranslateMode = false;
                  pendingLiveBlockId = -1;
                  liveTranslateQueue.clear();
                  pendingOutput = "";
                  updateButtons();
                  if(responseInProgress && ws != null) {
                      try {
                          JSONObject cancel = new JSONObject();
                          cancel.put("type", "response.cancel");
                          ws.send(cancel.toString());
                          responseInProgress = false;
                      } catch(Exception ignored) {}
                  }
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "conversation.item.create");
                      JSONObject item = new JSONObject();
                      item.put("type", "message");
                      item.put("role", "user");
                      JSONArray content = new JSONArray();
                      JSONObject c = new JSONObject();
                      c.put("type", "input_text");
                      manualResponseMode = true;
                      c.put("text", "MANUAL_FULL_WINDOW_TRANSLATION\n" + text + "\n\nReturn ONLY the translated full text. Preserve paragraphs and line breaks where reasonable. Do not write SOURCE_LANG, TARGET_LANG, ORIGINAL, TEXT, TRANSLATION, markdown, quotes or explanation.");
                      content.put(c);
                      item.put("content", content);
                      msg.put("item", item);
                      ws.send(msg.toString());

                      JSONObject resp = new JSONObject();
                      resp.put("type", "response.create");
                      JSONObject response = new JSONObject();
                      response.put("instructions", manualBlockInstructions());
                      resp.put("response", response);
                      responseInProgress = true;
                      ws.send(resp.toString());
                  } catch(Exception e) {
                      manualResponseMode = false;
                      Toast.makeText(this, "Kézi fordítás hiba. Próbáld újra.", Toast.LENGTH_LONG).show();
                  }
              }

              void handleTranscriptDelta(String delta) {
                  if(delta == null || delta.length() == 0) return;
                  liveHadTranscriptDelta = true;
                  long now = System.currentTimeMillis();
                  if(firstSpeechHeardAt == 0L) firstSpeechHeardAt = now;
                  if(liveTranscriptBuffer.trim().length() == 0) liveBufferStartedAt = now;
                  liveTranscriptBuffer += delta;
                  flushReadyTranscriptBlocks(false);

                  // V75: ha csak 2-3 szó hangzott el és utána hosszú csend van,
                  // ne ragadjon a pufferben. Ez nem VAD és nem beszédvégi darabolás,
                  // csak biztonsági utóflush rövid, magára hagyott blokkokhoz.
                  final int token = ++liveIdleFlushToken;
                  topBox.postDelayed(() -> {
                      if(token == liveIdleFlushToken && streaming && liveTranscriptBuffer.trim().length() > 0) {
                          flushReadyTranscriptBlocks(true);
                      }
                  }, 5200);
              }

              void handleTranscriptCompleted(String transcript) {
                  // V51 duplázás-javítás:
                  // A completed esemény sokszor ugyanazt a teljes mondatot küldi újra,
                  // amit a delta eseményekből már kiírtunk és fordítottunk.
                  // Ha volt delta ebben a körben, NEM töltjük vissza a teljes transcriptet,
                  // csak a bufferben maradt befejezetlen részt zárjuk le.
                  if(!liveHadTranscriptDelta && liveTranscriptBuffer.trim().length() == 0 && transcript != null && transcript.trim().length() > 0) {
                      liveBufferStartedAt = System.currentTimeMillis();
                      liveTranscriptBuffer = transcript;
                  }
                  flushReadyTranscriptBlocks(true);
                  liveIdleFlushToken++;
                  liveHadTranscriptDelta = false;
              }

              void flushReadyTranscriptBlocks(boolean flushAll) {
                  // V74: az első élő blokkot nem engedjük ki azonnal 1-2 bizonytalan szóból.
                  // Ez szűri a kezdő "Microfoonprobe / Kazakhstan / UFO" jellegű félrehallást,
                  // de nem nyúl az audiohoz és nem épít új nyelvfelismerőt.
                  if(!firstSpeechBlockReleased && !initialSpeechGateOpen()) return;
                  while(true) {
                      String b = popReadySpeechBlock(flushAll);
                      if(b == null || b.trim().length() == 0) break;
                      b = cleanTranscriptForSelectedPair(b);
                      b = finalizeSpeechBlockText(b);
                      if(b.length() == 0) continue;
                      if(!markLiveBlockQueued(b)) continue;
                      // V71: nem a helyi/fókusz heurisztika dönti el véglegesen a forrásoldalt.
                      // A blokk ideiglenesen az utolsó aktív oldalra kerül, majd a fordító AI
                      // a kiválasztott két nyelv közül címkézi a valódi SOURCE_LANG-et,
                      // és applyLiveTranslation() a blokkot a megfelelő ablakba rendezi.
                      int id = addSourceOnlyBlock(topActive, b);
                      firstSpeechBlockReleased = true;
                      liveTranslateQueue.add(id);
                  }
                  processNextLiveTranslation();
              }

              boolean initialSpeechGateOpen() {
                  String s = liveTranscriptBuffer == null ? "" : liveTranscriptBuffer.trim();
                  if(s.length() == 0) return false;
                  int words = s.split("\\s+").length;
                  long age = firstSpeechHeardAt > 0L ? System.currentTimeMillis() - firstSpeechHeardAt : 0L;

                  // V74: az első blokkot nem engedjük át pusztán azért, mert a bizonytalan STT
                  // tett a végére pontot. Ez fogta meg a Microfoonprobe/Kazakhstan jellegű kezdést.
                  // Ugyanakkor ha a felhasználó tényleg csak 2-3 szót mond és utána hosszú csend van,
                  // 2 mp után fordítjuk, nem nyeljük el.
                  if(age >= 2000 && words >= 2) return true;
                  if(looksLikeObviousThirdLanguageNoise(s) && words < 5) return false;
                  if(firstHardSentenceEnd(s) >= 0 && words >= 4) return true;
                  if(s.length() >= 55 && words >= 5) return true;
                  return false;
              }

              String finalizeSpeechBlockText(String raw) {
                  if(raw == null) return "";
                  String t = raw.trim().replaceAll("\\s+", " ");
                  while(t.startsWith(",") || t.startsWith(";") || t.startsWith(":")) t = t.substring(1).trim();
                  if(t.length() == 0) return "";
                  char last = t.charAt(t.length() - 1);
                  if(last == ',' || last == ';' || last == ':') t = t.substring(0, t.length() - 1).trim() + ".";
                  return t;
              }

              boolean isLikelyNoisyTranscriptBlock(String block) {
        if(block == null) return true;
        String t = block.trim();
        if(t.length() == 0) return true;
        String lower = " " + t.toLowerCase(Locale.ROOT).replaceAll("[^a-záéíóöőúüűàâçèéêëîïôùûüÿñæœß\s]", " ").replaceAll("\s+", " ").trim() + " ";
        int words = lower.trim().length() == 0 ? 0 : lower.trim().split("\s+").length;
        if(words <= 1) return true;

        int foreignHits = 0;
        if(!selectedContains("nl")) {
            String[] nl = {" het ", " een ", " wel ", " geen ", " niet ", " maar ", " jullie ", " reserver ", " gereserveerd ", "wasergadas"};
            for(String w: nl) if(lower.contains(w)) foreignHits++;
        }
        if(!selectedContains("de")) {
            String[] de = {" ich ", " nicht ", " und ", " oder ", " danke ", " bitte ", " aber ", " wasser "};
            for(String w: de) if(lower.contains(w)) foreignHits++;
        }
        if(!selectedContains("en")) {
            String[] en = {" allò ", " hello ", " that ", " this ", " would ", " reserved ", " microphone "};
            for(String w: en) if(lower.contains(w)) foreignHits++;
        }
        // HU/FR párnál tipikus STT-halandzsa: több holland/német/angol darab keveredik magyar szavakkal.
        if(foreignHits >= 3) return true;
        if(words < 6 && foreignHits >= 1) return true;
        return false;
    }

    boolean markLiveBlockQueued(String block) {
                  String h = normalizeLiveBlockHash(block);
                  if(h.length() < 3) return false;
                  if(recentLiveBlockHashes.contains(h)) return false;
                  recentLiveBlockHashes.add(h);
                  recentLiveBlockHashOrder.add(h);
                  while(recentLiveBlockHashOrder.size() > 80) {
                      String old = recentLiveBlockHashOrder.poll();
                      if(old != null) recentLiveBlockHashes.remove(old);
                  }
                  return true;
              }

              String normalizeLiveBlockHash(String block) {
                  if(block == null) return "";
                  return block.toLowerCase(Locale.ROOT)
                          .replaceAll("[\\p{Punct}\\s]+", " ")
                          .trim();
              }

              String popReadySpeechBlock(boolean flushAll) {
                  String s = liveTranscriptBuffer == null ? "" : liveTranscriptBuffer;
                  if(s.trim().length() == 0) { liveTranscriptBuffer = ""; return null; }

                  int cut = firstHardSentenceEnd(s);

                  // V52: kizárólag szöveg-alapú, nyelvi blokkzárás.
                  // Nem időalapú, nem hangerőalapú, nem saját VAD.
                  // Ha nincs végleges írásjel, hosszú élő beszédnél természetes gondolathatárt keresünk.
                  if(cut < 0) cut = smartLinguisticCut(s);

                  if(cut < 0 && shouldFlushShortIdleBlock(s)) cut = s.length();
                  if(cut < 0 && flushAll) cut = s.length();
                  if(cut < 0) return null;

                  String out = s.substring(0, cut).trim();
                  liveTranscriptBuffer = s.substring(cut).trim();
                  liveBufferStartedAt = liveTranscriptBuffer.length() > 0 ? System.currentTimeMillis() : 0L;
                  return out;
              }

              boolean shouldFlushShortIdleBlock(String s) {
                  if(s == null) return false;
                  String t = s.trim();
                  if(t.length() == 0) return false;
                  int words = t.split("\\s+").length;
                  long started = liveBufferStartedAt > 0L ? liveBufferStartedAt : firstSpeechHeardAt;
                  long age = started > 0L ? System.currentTimeMillis() - started : 0L;
                  // V75: 2-3 szavas rövid közlés 2 mp csend után forduljon akkor is,
                  // ha nincs pont vagy hosszú mondathatár. 1 szavas zajt nem engedünk át.
                  return age >= 2000 && words >= 2;
              }

              int firstHardSentenceEnd(String s) {
                  for(int i=0;i<s.length();i++) {
                      char ch = s.charAt(i);
                      if(ch == '.' || ch == '!' || ch == '?' || ch == '…' || ch == '\n') return i + 1;
                  }
                  return -1;
              }

              int smartLinguisticCut(String s) {
                  int len = s.length();
                  if(len < 105) return -1;

                  String lower = s.toLowerCase(Locale.ROOT);
                  int preferredEnd = Math.min(len, 220);
                  int preferredStart = Math.min(len, 95);

                  // V56: V55 alap, de kevésbé engedékeny hosszú blokkoknál.
                  // Nem audio, nem VAD, nem időzítő. Csak a már beérkezett szöveg stabil elejét vágjuk le,
                  // hogy hosszú folyamatos beszédnél se legyen egyetlen óriás blokk.

                  // 1) Erős gondolatváltók. Itt az előző rész általában önállóan is érthető.
                  int cut = lastConnectorCut(lower, preferredStart, preferredEnd, new String[]{
                          ", de ", ", viszont ", ", hanem ", ", tehát ", ", ezért ",
                          ", aztán ", ", majd ", ", utána ", "; ", ": ", " - "
                  });
                  if(cut > 0) return cut;

                  // 2) Feltételes / következő gondolat kezdete. V52-höz képest kicsit bátrabb,
                  // mert a beszélt nyelvben sokszor nincs pont, csak új gondolat kezdődik.
                  cut = lastConnectorCut(lower, 115, preferredEnd, new String[]{
                          ", és akkor ", ", akkor ", ", hogyha ", ", ha ", ", amikor ",
                          ", ahol ", ", amíg ", ", miközben ", ", vagy ", ", illetve "
                  });
                  if(cut > 0) return cut;

                  // 3) Felsorolás vagy hosszú mellékmondat. Vágás vessző után, de csak akkor,
                  // ha már van érdemi hosszúságú, önmagában is olvasható blokk.
                  cut = lastCommaCut(s, 115, Math.min(len, 205));
                  if(cut > 0) return cut;

                  // 4) Ha nincs vessző, de már hosszú a blokk, természetes kötőszavaknál is vágunk.
                  // Ez javítja a hosszú folyamatos monológokat, de továbbra sem időalapú.
                  cut = lastSoftWordCut(lower, 145, Math.min(len, 220), new String[]{
                          " de ", " viszont ", " akkor ", " utána ", " majd ",
                          " és akkor ", " hogyha ", " ha ", " amikor ", " illetve ",
                          " mindenhol ", " szinte ", " na most ", " pedig "
                  });
                  if(cut > 0) return cut;

                  // 5) Stabil prefix vágás: ha a beszéd hosszúra nő és nincs biztos írásjel,
                  // a puffer elejét lezárjuk szóhatáron. A maradék a pufferben marad tovább épülni.
                  // Ez szöveg-alapú biztonsági szelep, nem másodperc- vagy szünetalapú döntés.
                  if(len >= 220) {
                      int spc = s.lastIndexOf(' ', Math.min(len, 200));
                      if(spc >= 145) return spc + 1;
                  }

                  return -1;
              }

              int lastConnectorCut(String lower, int minPos, int maxPos, String[] connectors) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String sep: connectors) {
                      int pos = lower.lastIndexOf(sep, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1; // a vessző/írásjel az előző blokk végén marad
              }

              int lastCommaCut(String s, int minPos, int maxPos) {
                  int end = Math.min(s.length(), maxPos);
                  int pos = s.lastIndexOf(',', end);
                  if(pos >= minPos) return pos + 1;
                  return -1;
              }

              int lastSoftWordCut(String lower, int minPos, int maxPos, String[] words) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String w: words) {
                      int pos = lower.lastIndexOf(w, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1;
              }

              void setDetectedSourceSide(boolean sourceIsTop) {
                  topActive = sourceIsTop;
                  manualTopSource = sourceIsTop;
                  updateButtons();
              }

              String cleanTranscriptForSelectedPair(String text) {
                  if(text == null) return "";
                  // V74: ez továbbra sem saját nagy nyelvfelismerő. Csak biztonsági tisztítás:
                  // idegen írásrendszeres STT-szemét nem kerülhet ki az ablakokba vagy fordításba.
                  String x = text.replaceAll("[^A-Za-z0-9\\u00C0-\\u024F\\p{Punct}\\s]", " ");
                  return x.replaceAll("\\s+", " ").trim();
              }

              boolean selectedContains(String langCode) {
                  String lc = langCode == null ? "" : langCode.toLowerCase(Locale.ROOT);
                  return code(topLang).equalsIgnoreCase(lc) || code(bottomLang).equalsIgnoreCase(lc);
              }

              boolean looksLikeObviousThirdLanguageNoise(String text) {
                  if(text == null) return false;
                  String x = text.toLowerCase(Locale.ROOT).replaceAll("[^a-záéíóöőúüűàâçèéêëîïôùûüÿñæœß\\s]", " ");
                  x = " " + x.replaceAll("\\s+", " ").trim() + " ";
                  // Csak nagyon tipikus, korábbi tesztekben is látott hamis kezdéseket fogunk meg.
                  // Nem általános szótárazás, nem új nyelvdetektor.
                  if(!selectedContains("nl") && (x.contains(" microfoon") || x.contains(" microfoonprobe") || x.contains(" foneprover"))) return true;
                  if(!selectedContains("en") && (x.contains(" that s ") || x.contains(" that's "))) return true;
                  if(!selectedContains("de") && (x.contains(" danke ") || x.contains(" bitte ") || x.contains(" nicht "))) return true;
                  return false;
              }

              boolean isSelectedSourceLang(String sourceLang) {
                  if(sourceLang == null) return false;
                  String s = sourceLang.trim().toLowerCase(Locale.ROOT);
                  String top = code(topLang).toLowerCase(Locale.ROOT);
                  String bottom = code(bottomLang).toLowerCase(Locale.ROOT);
                  return s.equals(top) || s.equals(bottom);
              }

              boolean isStrictValidTriple(String[] trp) {
                  if(trp == null || trp.length < 3) return false;
                  if(!isSelectedSourceLang(trp[0])) return false;
                  String original = trp[1] == null ? "" : cleanTranscriptForSelectedPair(trp[1]).trim();
                  String translation = trp[2] == null ? "" : cleanTranscriptForSelectedPair(cleanOneBlockTranslation(trp[2])).trim();
                  return original.length() > 0 && translation.length() > 0;
              }

              boolean sourceIsTopFromAi(String sourceLang, boolean fallback) {
                  if(sourceLang == null) return fallback;
                  String s = sourceLang.trim().toUpperCase(Locale.ROOT);
                  String top = code(topLang).toUpperCase(Locale.ROOT);
                  String bottom = code(bottomLang).toUpperCase(Locale.ROOT);
                  if(s.equals(top) || s.contains("SOURCE_LANG: " + top) || s.contains("LANG: " + top)) return true;
                  if(s.equals(bottom) || s.contains("SOURCE_LANG: " + bottom) || s.contains("LANG: " + bottom)) return false;
                  return fallback;
              }

              int addSourceOnlyBlock(boolean sourceIsTop, String original) {
                  TextBlock b = new TextBlock();
                  b.sourceTop = sourceIsTop;
                  b.translatedOk = false;
                  if(sourceIsTop) b.topText = original;
                  else b.bottomText = original;
                  textBlocks.add(b);
                  renderBlocksKeepView();
                  return textBlocks.size() - 1;
              }

              void processNextLiveTranslation() {
                  // V49: a live fordítást nem szabad a globális responseInProgress flag miatt megállítani.
                  // A Realtime transcription közben nem fordítási válasz, ezért ez a flag itt könnyen beragadhat.
                  // Élő beszédnél csak a saját liveTranslateMode zárja ki a párhuzamos blokkfordítást.
                  if(liveTranslateMode) return;
                  if(ws == null || !connected) return;
                  responseInProgress = false;
                  Integer idObj = liveTranslateQueue.poll();
                  if(idObj == null) return;
                  int id = idObj.intValue();
                  if(id < 0 || id >= textBlocks.size()) { processNextLiveTranslation(); return; }
                  TextBlock b = textBlocks.get(id);
                  boolean sourceIsTop = b.sourceTop;
                  String src = sourceIsTop ? b.topText : b.bottomText;
                  if(src == null || src.trim().length() == 0) { processNextLiveTranslation(); return; }

                  try {
                      pendingLiveBlockId = id;
                      liveTranslateMode = true;

                      JSONObject msg = new JSONObject();
                      msg.put("type", "conversation.item.create");
                      JSONObject item = new JSONObject();
                      item.put("type", "message");
                      item.put("role", "user");
                      JSONArray content = new JSONArray();
                      JSONObject c = new JSONObject();
                      c.put("type", "input_text");
                      String topCode = code(topLang);
                      String bottomCode = code(bottomLang);
                      c.put("text", "LIVE_PAIR_CLASSIFY_AND_TRANSLATE\nSELECTED_TOP_LANG: " + topCode + "\nSELECTED_BOTTOM_LANG: " + bottomCode + "\nTEXT:\n" + src.trim());
                      content.put(c);
                      item.put("content", content);
                      msg.put("item", item);
                      ws.send(msg.toString());

                      JSONObject resp = new JSONObject();
                      resp.put("type", "response.create");
                      JSONObject response = new JSONObject();
                      response.put("instructions", liveBlockInstructions(sourceIsTop));
                      resp.put("response", response);
                      responseInProgress = true;
                      ws.send(resp.toString());
                  } catch(Exception e) {
                      liveTranslateMode = false;
                      pendingLiveBlockId = -1;
                  }
              }

              void applyLiveTranslation(String out) {
                  int id = pendingLiveBlockId;
                  String speakText = null;
                  String speakLang = null;
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      ArrayList<String[]> triples = parseTriples(out);
                      String[] trp = null;
                      for(String[] cand: triples) {
                          if(isStrictValidTriple(cand)) { trp = cand; break; }
                      }
                      if(trp != null) {
                          String sourceLang = trp[0].trim().toUpperCase(Locale.ROOT);
                          String original = cleanTranscriptForSelectedPair(trp[1].trim());
                          String translation = cleanTranscriptForSelectedPair(cleanOneBlockTranslation(trp[2]));
                          boolean sourceIsTop = sourceIsTopFromAi(sourceLang, b.sourceTop);

                          b.sourceTop = sourceIsTop;
                          if(sourceIsTop) {
                              b.topText = original;
                              b.bottomText = translation;
                              speakText = translation;
                              speakLang = bottomLang;
                          } else {
                              b.bottomText = original;
                              b.topText = translation;
                              speakText = translation;
                              speakLang = topLang;
                          }
                          b.translatedOk = true;
                          b.retryCount = 0;
                          setDetectedSourceSide(sourceIsTop);
                      } else {
                          // V74: live módban nincs laza fallback. Ha a modell nem ad szabályos,
                          // kiválasztott nyelvpárba illeszkedő választ, a blokk marad újrafordítható.
                          b.translatedOk = false;
                          b.retryCount++;
                      }
                      renderBlocksKeepView();
                      enqueueSpeak(speakText, speakLang);
                  }
                  pendingLiveBlockId = -1;
                  liveTranslateMode = false;
                  // V55: nem indítjuk azonnal a következő live fordítást itt.
                  // Megvárjuk a response.done eseményt, mert a text.done után
                  // a szerver oldalon még lehet aktív válasz, és a következő
                  // response.create különben megakaszthatja a sort.
              }

              void routeAiOutput(String out) {
                  if(manualResponseMode) {
                      manualResponseMode = false;
                      applyManualFullWindowTranslation(out);
                      return;
                  }

                  if(liveTranslateMode || pendingLiveBlockId >= 0) {
                      applyLiveTranslation(out);
                      return;
                  }

                  ArrayList<String[]> triples = parseTriples(out);
                  if(!triples.isEmpty()) {
                      boolean any = false;
                      for(String[] trp: triples) {
                          if(!isStrictValidTriple(trp)) continue;
                          String sourceLang = trp[0].trim().toUpperCase(Locale.ROOT);
                          String original = cleanTranscriptForSelectedPair(trp[1]);
                          String translation = cleanTranscriptForSelectedPair(trp[2]);
                          boolean sourceIsTop = sourceIsTopFromAi(sourceLang, manualTopSource);
                          addBlock(sourceIsTop, original, translation);
                          enqueueSpeak(translation, sourceIsTop ? bottomLang : topLang);
                          any = true;
                      }
                      if(any) return;
                  }

                  // V74: nincs laza fallback új blokkra. Címke nélküli vagy rossz nyelvű válasz
                  // nem kerülhet be, mert ez hozta vissza korábban a káoszt.
                  Toast.makeText(this, "Nem szabályos AI-válasz érkezett, a blokk újrafordítható.", Toast.LENGTH_SHORT).show();
              }

              boolean isCleanManualTranslation(String tr) {
                  if(tr == null) return false;
                  String t = tr.trim();
                  if(t.length() == 0) return false;
                  String low = t.toLowerCase(Locale.ROOT);
                  if(low.contains("source_lang") || low.contains("target_lang") || low.contains("original") || low.contains("translation:")) return false;
                  if(low.contains("error") || low.contains("hiba") || low.contains("cannot translate") || low.contains("nem tudom lefordítani")) return false;
                  // Ha az UFO-szűrés mindent kiszedett, ne számítson kész fordításnak.
                  return cleanTranscriptForSelectedPair(t).trim().length() > 0;
              }

              void applyManualFullWindowTranslation(String out) {
                  try {
                      String tr = cleanOneBlockTranslation(out);
                      if(!isCleanManualTranslation(tr)) {
                          Toast.makeText(this, "Nem tiszta fordítás érkezett. Nyomd meg újra a FORDÍT gombot.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      programmaticChange = true;
                      try {
                          if(manualTopSource) bottomBox.setText(tr);
                          else topBox.setText(tr);
                      } finally {
                          programmaticChange = false;
                      }

                      rebuildBlocksFromCurrentBoxes();
                      renderBlocksKeepView();
                      enqueueSpeak(tr, manualTopSource ? bottomLang : topLang);
                      Toast.makeText(this, "Teljes ablak újrafordítva.", Toast.LENGTH_SHORT).show();
                  } catch(Exception e) {
                      Toast.makeText(this, "Kézi fordítás feldolgozási hiba. Próbáld újra.", Toast.LENGTH_LONG).show();
                  }
              }

              void rebuildBlocksFromCurrentBoxes() {
                  TextBlock b = new TextBlock();
                  b.topText = topBox.getText().toString().trim();
                  b.bottomText = bottomBox.getText().toString().trim();
                  b.sourceTop = manualTopSource;
                  b.translatedOk = true;
                  b.retryCount = 0;
                  textBlocks.clear();
                  textBlocks.add(b);
              }

              String cleanOneBlockTranslation(String out) {
                  if(out == null) return "";
                  String s = out.trim();
                  if(s.startsWith("```")) s = s.replace("```", "").trim();

                  String upper = s.toUpperCase(Locale.ROOT);
                  int trPos = upper.lastIndexOf("TRANSLATION:");
                  if(trPos >= 0) {
                      s = s.substring(trPos + "TRANSLATION:".length()).trim();
                  }
                  if(s.toUpperCase(Locale.ROOT).startsWith("FORDÍTÁS:")) s = s.substring("FORDÍTÁS:".length()).trim();

                  // Biztonsági tisztítás: ha a modell mégis címkéket adott vissza,
                  // ne írjuk be őket a fordítási ablakba.
                  StringBuilder clean = new StringBuilder();
                  String[] lines = s.split("\n");
                  for(String line: lines) {
                      String t = line.trim();
                      String u = t.toUpperCase(Locale.ROOT);
                      if(u.startsWith("SOURCE_LANG:") || u.startsWith("TARGET_LANG:") ||
                         u.startsWith("ORIGINAL:") || u.equals("TEXT:") || u.startsWith("TEXT:")) {
                          continue;
                      }
                      if(clean.length() > 0) clean.append("\n");
                      clean.append(line);
                  }
                  return cleanTranscriptForSelectedPair(clean.toString().trim());
              }

              ArrayList<String[]> parseTriples(String out) {
                  ArrayList<String[]> list = new ArrayList<>();
                  if(out == null) return list;
                  String marker = "SOURCE_LANG:";
                  int pos = 0;
                  while(true) {
                      int start = out.indexOf(marker, pos);
                      if(start < 0) break;
                      int next = out.indexOf(marker, start + marker.length());
                      String part = next >= 0 ? out.substring(start, next) : out.substring(start);
                      String sourceLang = extractAfter(part, "SOURCE_LANG:");
                      String original = extractAfter(part, "ORIGINAL:");
                      String translation = extractAfter(part, "TRANSLATION:");
                      if(original.length() > 0 || translation.length() > 0) {
                          list.add(new String[]{sourceLang, original, translation});
                      }
                      if(next < 0) break;
                      pos = next;
                  }
                  return list;
              }

              String extractAfter(String out, String key) {
                  int i = out.indexOf(key);
                  if(i < 0) return "";
                  int start = i + key.length();
                  int end = out.length();
                  String[] keys = {"SOURCE_LANG:", "ORIGINAL:", "TRANSLATION:"};
                  for(String k: keys) {
                      int n = out.indexOf(k, start);
                      if(n >= 0) end = Math.min(end, n);
                  }
                  return out.substring(start, end).trim();
              }

              void appendTo(EditText target, String s) {
                  if(s == null || s.length() == 0) return;
                  programmaticChange = true;
                  try {
                      String old = target.getText().toString();
                      if(old.length() > 0 && !old.endsWith("\n")) target.append("\n");
                      target.append(s);
                      target.setSelection(target.getText().length());
                  } finally {
                      programmaticChange = false;
                  }
              }

              void appendDelta(String s) {
                  EditText target = topActive ? bottomBox : topBox;
                  appendTo(target, s);
              }

              void append(String s) {
                  EditText target = topActive ? bottomBox : topBox;
                  appendTo(target, s);
              }

              void confirm() {
                  new AlertDialog.Builder(this)
                    .setTitle("Folyik még a beszélgetés?")
                    .setMessage("20 perce aktív a rendszer. Folytassuk?")
                    .setPositiveButton("Igen", (d,w) -> { sessionStart = System.currentTimeMillis(); start(true); })
                    .setNegativeButton("Leállítás", (d,w) -> { sessionStart = 0L; stop(); })
                    .show();
              }

