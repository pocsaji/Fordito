              boolean isHalfDuplexSpeakerRoute() { return "speaker_half_duplex".equals(activeInterpreterRoute); }

              void clearForcedCommunicationRoute() {
                  if(audioManager == null) audioManager = (AudioManager)getSystemService(AUDIO_SERVICE);
                  activeCommunicationDeviceId = -1;
                  interpreterCommunicationFallbackActive = false;
                  if(audioManager == null) return;
                  try { if(Build.VERSION.SDK_INT >= 31) audioManager.clearCommunicationDevice(); } catch(Exception ignored) {}
                  try { audioManager.stopBluetoothSco(); } catch(Exception ignored) {}
                  try { audioManager.setBluetoothScoOn(false); } catch(Exception ignored) {}
                  try { audioManager.setSpeakerphoneOn(false); } catch(Exception ignored) {}
                  try { audioManager.setMode(AudioManager.MODE_NORMAL); } catch(Exception ignored) {}
              }

              void configureInterpreterAudioRoute(boolean announce) {
                  if(!interpreterMode) { restoreNormalAudioRoute(); return; }
                  if(audioManager == null) audioManager = (AudioManager)getSystemService(AUDIO_SERVICE);
                  interpreterRouteReconfiguring = true;
                  try {
                      // Semmilyen headset/BT kommunikációs eszközt nem állítunk be bemenetként.
                      // A média-TTS-t az Android a csatlakoztatott kimenetre irányíthatja, a rögzítés ettől független.
                      clearForcedCommunicationRoute();
                      preferredInterpreterInputDevice = findBuiltInInterpreterMic();
                      interpreterCommunicationFallbackActive = false;
                      rejectedInterpreterInputDeviceId = -1;
                      AudioDeviceInfo headsetOutput = findPreferredInterpreterOutputDevice();
                      if(headsetOutput != null) {
                          activeInterpreterRoute = "headset_output_phone_mic";
                          activeCommunicationDeviceLabel = audioDeviceLabel(headsetOutput);
                      } else {
                          activeInterpreterRoute = "speaker_half_duplex";
                          activeCommunicationDeviceLabel = "telefon hangszóró";
                      }
                      applyTtsAudioAttributes();
                      showPlannedInputRoute();
                      refreshInterpreterFloatingButton();
                      refreshOpenInterpreterMenuButton();
                      if(announce) Toast.makeText(this, interpreterLabel(), Toast.LENGTH_SHORT).show();
                  } finally {
                      interpreterRouteReconfiguring = false;
                  }
              }

              void restoreNormalAudioRoute() {
                  clearForcedCommunicationRoute();
                  preferredInterpreterInputDevice = findBuiltInInterpreterMic();
                  interpreterCommunicationFallbackActive = false;
                  activeCommunicationDeviceId = -1;
                  activeInterpreterRoute = "off";
                  activeCommunicationDeviceLabel = "";
                  applyTtsAudioAttributes();
              }

              void beginHalfDuplexTtsGuard() {
                  if(!streaming) return;
                  synchronized(audioProcessingLock) {
                      try {
                          if(voiceSendActive) flushSpeechAudioWindow(true);
                      } catch(Exception e) {
                          android.util.Log.w(LOG_TAG, "Half-duplex pre-TTS flush failed", e);
                      }
                      // A 150 ms alatti maradék sem kapcsolódhat össze a TTS utáni új mondattal.
                      clearSpeechAudioWindow();
                      voiceSendActive = false;
                      clearPendingSpeechAudio();
                      clearPreRollAudio();
                      takeCapturedSttRemainder24k();
                      // A TTS alatt a Silero nem kap kereteket. Ne vigyük tovább a TTS előtti
                      // rekurzív VAD-állapotot a következő beszélő első szavára.
                      closeExternalVad();
                  }
              }

              boolean shouldMuteMicForSpeakerTts() {
                  return interpreterMode && isHalfDuplexSpeakerRoute() &&
                      (ttsPlaybackActive || System.currentTimeMillis() < ttsMuteUntilMs);
              }

              void registerInterpreterAudioDeviceCallback() {
                  if(Build.VERSION.SDK_INT < 23 || audioManager == null || interpreterAudioDeviceCallback != null) return;
                  interpreterAudioDeviceCallback = new AudioDeviceCallback() {
                      @Override public void onAudioDevicesAdded(AudioDeviceInfo[] addedDevices) { scheduleInterpreterRouteRefresh(); }
                      @Override public void onAudioDevicesRemoved(AudioDeviceInfo[] removedDevices) { scheduleInterpreterRouteRefresh(); }
                  };
                  try { audioManager.registerAudioDeviceCallback(interpreterAudioDeviceCallback, interpreterRouteHandler); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "Audio device callback registration failed", e); }
              }

              void unregisterInterpreterAudioDeviceCallback() {
                  interpreterRouteHandler.removeCallbacksAndMessages(null);
                  if(Build.VERSION.SDK_INT >= 23 && audioManager != null && interpreterAudioDeviceCallback != null) {
                      try { audioManager.unregisterAudioDeviceCallback(interpreterAudioDeviceCallback); }
                      catch(Exception e) { android.util.Log.w(LOG_TAG, "Audio device callback unregister failed", e); }
                  }
                  interpreterAudioDeviceCallback = null;
              }

              void scheduleInterpreterRouteRefresh() {
                  if(!interpreterMode || interpreterRouteReconfiguring || finalizingStop) return;
                  interpreterRouteHandler.removeCallbacksAndMessages(null);
                  interpreterRouteHandler.postDelayed(() -> {
                      if(!interpreterMode || interpreterRouteReconfiguring || finalizingStop) return;
                      boolean headsetOutputNow = findPreferredInterpreterOutputDevice() != null;
                      boolean headsetOutputWas = "headset_output_phone_mic".equals(activeInterpreterRoute);
                      if(headsetOutputNow == headsetOutputWas) return;
                      configureInterpreterAudioRoute(false);
                      updateButtons();
                  }, 850L);
              }

              void resetAudioModeState() {
                  streaming = false;
                  microphoneStarting = false;
                  microphonePcmReady = false;
                  microphoneStartUiEarliestMs = 0L;
                  cancelMicLifeSignal();
                  voiceSendActive = false;
                  clearPreRollAudio();
                  clearPendingSpeechAudio();
                  clearSpeechAudioWindow();
                  closeExternalVad();
                  resetCapturedFrameState();
                  activeCaptureSampleRate = CAPTURE_SAMPLE_RATE;
                  activeCaptureChannelCount = 1;
                  resetSttOrderingForNewSession();
                  try { if(rec != null) { rec.stop(); rec.release(); } } catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord reset failed", e); }
                  rec = null;
              }

              void markMicrophoneUiReady(AudioRecord activeRec) {
                  if(!microphoneStarting || !microphonePcmReady || !streaming || rec != activeRec) return;
                  long waitMs = Math.max(0L, microphoneStartUiEarliestMs - android.os.SystemClock.elapsedRealtime());
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(!microphoneStarting || !microphonePcmReady || !streaming || rec != activeRec) return;
                      microphoneStarting = false;
                      String base = "mikrofon aktív";
                      if(interpreterMode) base += " – " + interpreterRuntimeShortLabel();
                      state.setText(base);
                      scheduleMicLifeSignal();
                      updateButtons();
                  }, waitMs);
              }

              void audioLoop() {
                  int sr = CAPTURE_SAMPLE_RATE;
                  int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  int bs = Math.max(min, CAPTURE_FRAME_BYTES * 8);

                  rec = makeBestAudioRecord(sr, bs);
                  if(rec == null) {
                      connected = false;
                      microphoneStarting = false;
                      microphonePcmReady = false;
                      stopBackgroundForegroundService();
                      runOnUiThread(() -> { state.setText("mikrofon nem inicializálható"); setInputRouteHeader("BEMENET: HIBA"); updateButtons(); });
                      return;
                  }
                  try {
                      ensureExternalVadReady();
                      rec.startRecording();
                      if(rec.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING) throw new IllegalStateException("AudioRecord did not enter recording state");
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Microphone start failed", e);
                      connected = false;
                      microphoneStarting = false;
                      microphonePcmReady = false;
                          try { rec.release(); } catch(Exception releaseError) { android.util.Log.w(LOG_TAG, "AudioRecord release failed", releaseError); }
                      rec = null;
                      stopBackgroundForegroundService();
                      runOnUiThread(() -> { state.setText("mikrofon indítási hiba"); setInputRouteHeader("BEMENET: HIBA"); updateButtons(); });
                      return;
                  }

                  streaming = true;
                  final AudioRecord activeRec = rec;
                  registerActualInputRouteUpdates(activeRec);
                  refreshActualInputRoute(activeRec);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(rec == activeRec && streaming) refreshActualInputRoute(activeRec);
                  }, 450L);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(rec == activeRec && streaming) refreshActualInputRoute(activeRec);
                  }, 1400L);
                  setSpeechUiLocked(false);
                  runOnUiThread(() -> {
                      state.setText("mikrofon előkészítés");
                      updateButtons();
                  });

                  audioExec.submit(() -> {
                      // Egyetlen 32 ms-os 48 kHz-es keretet olvasunk egyszerre. Ez csökkenti a
                      // beszédkezdet feldolgozási és az útvonal-ellenőrzési késleltetését.
                      byte[] buf = new byte[CAPTURE_FRAME_BYTES];
                      // V40.20: az előző kód startRecording() után akár 1200 ms-ig NEM olvasott
                      // az AudioRecordból, miközben a kért belső puffer csak kb. 256 ms volt.
                      // Ez a mikrofon indításakor levághatta az első szót. Most az olvasás azonnal
                      // indul; a hang csak akkor kerül feldolgozásra, ha a tényleges útvonalat
                      // TYPE_BUILTIN_MIC-ként már ellenőriztük. Bluetooth/headset bemenet továbbra is tiltott.
                      boolean builtInRouteConfirmed = false;
                      long routeConfirmDeadlineMs = SystemClock.elapsedRealtime() + 1200L;
                      clearPreRollAudio();
                      clearPendingSpeechAudio();
                      clearSpeechAudioWindow();
                      voiceSendActive = false;
                      while((streaming || finalizingStop) && activeRec != null) {
                          int read;
                          try {
                              read = activeRec.read(buf, 0, buf.length, AudioRecord.READ_BLOCKING);
                          } catch(Exception e) {
                              android.util.Log.e(LOG_TAG, "AudioRecord read threw", e);
                              runOnUiThread(() -> state.setText("mikrofon olvasási hiba"));
                              break;
                          }
                          if(read > 0) {
                              if(!streaming && !finalizingStop) break;
                              try {
                                  if(!builtInRouteConfirmed) {
                                      AudioDeviceInfo routed = activeRec.getRoutedDevice();
                                      if(routed != null) {
                                          if(!routed.isSource() || routed.getType() != AudioDeviceInfo.TYPE_BUILTIN_MIC) {
                                              android.util.Log.e(LOG_TAG, "Recording aborted: forbidden input route " + compactAudioDeviceLabel(routed));
                                              runOnUiThread(() -> {
                                                  if(rec == activeRec) {
                                                      state.setText("tiltott mikrofonút – csak telefon mikrofon engedélyezett");
                                                      stop(false);
                                                  }
                                              });
                                              break;
                                          }
                                          builtInRouteConfirmed = true;
                                          refreshActualInputRoute(activeRec);
                                      } else if(SystemClock.elapsedRealtime() > routeConfirmDeadlineMs) {
                                          android.util.Log.e(LOG_TAG, "Recording aborted: built-in phone microphone route could not be verified");
                                          runOnUiThread(() -> {
                                              if(rec == activeRec) {
                                                  state.setText("telefon mikrofon útvonala nem ellenőrizhető");
                                                  stop(false);
                                              }
                                          });
                                          break;
                                      } else {
                                          // Ismeretlen útvonalú mintát nem dolgozunk fel és nem küldünk STT-be.
                                          // A következő read azonnal folytatódik, nincs 40 ms-os polling-alvás.
                                          continue;
                                      }
                                  }
                                  if(!microphonePcmReady) {
                                      microphonePcmReady = true;
                                      markMicrophoneUiReady(activeRec);
                                  }
                                  synchronized(audioProcessingLock) {
                                      processCapturedAudio(buf, read);
                                  }
                              } catch(Exception e) {
                                  android.util.Log.e(LOG_TAG, "Silero/audio processing failed", e);
                                  runOnUiThread(() -> state.setText("Silero VAD / hangfeldolgozási hiba"));
                                  break;
                              }
                          } else if(read < 0) {
                              final int code = read;
                              android.util.Log.e(LOG_TAG, "AudioRecord read error code=" + code);
                              runOnUiThread(() -> state.setText("mikrofon olvasási hiba: " + code));
                              break;
                          }
                      }
                      if(streaming && !finalizingStop) runOnUiThread(() -> stop(false));
                  });
              }

              void handleConnectionFailure(Throwable t) {
                  String msg = t == null ? "ismeretlen hiba" : String.valueOf(t.getMessage());
          
                  // V318: lebegő vágólap-fordításnál nincs blokkállapot, csak mini ablak/toast.
                  if(clipboardResponseMode) {
                      clipboardResponseMode = false;
                      pendingClipboardText = "";
                      Toast.makeText(this, "Kapcsolat hiba vágólap-fordítás közben.", Toast.LENGTH_LONG).show();
                      stop(false);
                      return;
                  }
          
                  // V318: kézi fordításnál nincs blokkállapot. Hiba esetén nem írunk semmit az ablakokba.
                  if(manualResponseMode) {
                      manualResponseMode = false;
                      pendingManualText = "";
                      Toast.makeText(this, "Kapcsolat hiba kézi fordítás közben. Próbáld újra a FORDÍT gombbal.", Toast.LENGTH_LONG).show();
                      stop(false);
                      return;
                  }
          
                  // Normál beszéd/élő fordításnál se írjunk hibaüzenetet a fordítási ablakba.
                  Toast.makeText(this, "Kapcsolat hiba: " + msg, Toast.LENGTH_LONG).show();
                  stop(false);
              }
          
              void stop() {
                  stop(true);
              }

              void stop(boolean flushRemaining) {
                  if(finalizingStop && flushRemaining) return;
                  streaming = false;
                  connected = false;
                  microphoneStarting = false;
                  microphonePcmReady = false;
                  microphoneStartUiEarliestMs = 0L;
                  cancelMicLifeSignal();
                  ttsMuteUntilMs = 0L;

                  AudioRecord stoppingRec = rec;
                  rec = null;
                  setInputRouteHeader("BEMENET: —");
                  try {
                      if(stoppingRec != null) stoppingRec.stop();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "AudioRecord stop failed", e);
                  }

                  if(flushRemaining) {
                      finalizingStop = true;
                      stopAudioDrainPending = true;
                      state.setText("utolsó mondat feldolgozása");
                      updateButtons();
                      final int stopSession = sttSessionId;
                      final AudioRecord recorderToRelease = stoppingRec;
                      try {
                          // Ugyanazon az egyszálú executoron fut: csak az audioLoop teljes
                          // kilépése után zárhatja le és küldheti el a maradék hangot.
                          audioExec.submit(() -> runOnUiThread(() -> finalizeGracefulStopAfterAudioLoop(stopSession, recorderToRelease)));
                      } catch(Exception e) {
                          android.util.Log.e(LOG_TAG, "Stop finalizer scheduling failed", e);
                          finalizeGracefulStopAfterAudioLoop(stopSession, recorderToRelease);
                      }
                      return;
                  }

                  try { if(stoppingRec != null) stoppingRec.release(); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord release failed", e); }
                  stopAudioDrainPending = false;
                  // Azonnali belső leállításnál a régi HTTP válaszok nem kerülhetnek
                  // egy később induló mikrofonmenet blokkjaiba.
                  resetSttOrderingForNewSession();
                  finishStopCleanup();
              }

              void finalizeGracefulStopAfterAudioLoop(int stopSession, AudioRecord recorderToRelease) {
                  try { if(recorderToRelease != null) recorderToRelease.release(); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord delayed release failed", e); }
                  if(stopSession != sttSessionId || !finalizingStop) return;
                  synchronized(audioProcessingLock) {
                      byte[] remainder = takeCapturedSttRemainder24k();
                      if(voiceSendActive && remainder.length > 0) appendSpeechAudioChunk(remainder);
                      if(!voiceSendActive && pendingSpeechAudioDurationMs() > 0) {
                          for(byte[] pr : takePreRollAudio()) appendSpeechAudioChunk(pr);
                          for(byte[] ps : takePendingSpeechAudio()) appendSpeechAudioChunk(ps);
                      }
                      voiceSendActive = false;
                      clearPendingSpeechAudio();
                      clearPreRollAudio();
                      flushSpeechAudioWindow(true);
                  }
                  closeExternalVad();
                  stopAudioDrainPending = false;
                  if(sttRequestsInFlight > 0 || speechTranslateMode || pendingSpeechBlockId >= 0 || !speechTranslateQueue.isEmpty()) {
                      state.setText("utolsó mondat feldolgozása");
                      updateButtons();
                  } else {
                      finishStopCleanup();
                  }
              }

              void maybeFinishStop() {
                  if(!finalizingStop || stopAudioDrainPending) return;
                  if(sttRequestsInFlight > 0) return;
                  if(speechTranslateMode || pendingSpeechBlockId >= 0 || !speechTranslateQueue.isEmpty()) return;
                  finishStopCleanup();
              }

              void finishStopCleanup() {
                  stopAudioDrainPending = false;
                  finalizingStop = false;
                  voiceSendActive = false;
                  clearPreRollAudio();
                  clearPendingSpeechAudio();
                  clearSpeechAudioWindow();
                  resetCapturedFrameState();
                  closeExternalVad();
                  speechTranscriptBuffer = "";
                  firstSpeechHeardAt = 0L;
                  speechBufferStartedAt = 0L;
                  speechIdleFlushToken++;
                  lastSpeechBlockReleasedAt = 0L;
                  firstSpeechBlockReleased = false;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  speechTranslateQueue.clear();
                  manualResponseMode = false;
                  clipboardResponseMode = false;
                  pendingOutput = "";
                  responseInProgress = false;
                  recentSpeechBlockHashes.clear();
                  recentSpeechBlockHashOrder.clear();
                  lastSureSpeechOriginal = "";
                  lastSureSpeechTranslation = "";
                  stopBackgroundForegroundService();
                  runOnUiThread(() -> {
                      state.setText("készenlét");
                      setSpeechUiLocked(false);
                      updateButtons();
                  });
              }

              String stripDisplayBlockNumbers(String s) {
                  if(s == null) return "";
                  return s.replaceAll("(?m)^\\s*\\d{3}\\s*\\|\\s*", "").trim();
              }
          
