              void ensureFloatingTranslator() {
                  if(!floatingTranslatorEnabled) return;
                  if(!canDrawOverlayNow()) { requestOverlayPermission(); return; }
                  if(floatingButtonView != null) return;
                  try {
                      floatingWindowManager = (android.view.WindowManager)getSystemService(WINDOW_SERVICE);
                      Button b = btn("⇄");
                      b.setTextSize(22);
                      b.setTextColor(Color.WHITE);
                      b.setIncludeFontPadding(false);
                      b.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);
                      b.setPadding(0, 0, 0, 0);
                      b.setTranslationY(0f);
                      b.setMinWidth(0);
                      b.setMinimumWidth(0);
                      b.setMinHeight(0);
                      b.setMinimumHeight(0);
                      b.setBackgroundColor(Color.rgb(30,120,75));
                      b.setOnClickListener(v -> floatingTranslatorButtonAction());
                      final android.view.WindowManager.LayoutParams lp = floatingParams(96, 96, Gravity.RIGHT | Gravity.CENTER_VERTICAL);
                      lp.x = floatingButtonX;
                      lp.y = floatingButtonY;
                      final int[] down = new int[4];
                      final boolean[] moved = new boolean[1];
                      final boolean[] longDone = new boolean[1];
                      final Runnable longPressTask = () -> {
                          if(!moved[0]) {
                              longDone[0] = true;
                              try { b.performHapticFeedback(android.view.HapticFeedbackConstants.LONG_PRESS); } catch(Exception ignored) {}
                              openClipboardReplyMode();
                          }
                      };
                      b.setOnTouchListener((v, ev) -> {
                          if(ev.getAction() == android.view.MotionEvent.ACTION_DOWN) {
                              down[0] = lp.x; down[1] = lp.y; down[2] = (int)ev.getRawX(); down[3] = (int)ev.getRawY();
                              moved[0] = false;
                              longDone[0] = false;
                              floatingLongPressHandler.removeCallbacks(longPressTask);
                              floatingLongPressHandler.postDelayed(longPressTask, 450);
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_MOVE) {
                              int dx = (int)ev.getRawX() - down[2];
                              int dy = (int)ev.getRawY() - down[3];
                              if(longDone[0]) return true;
                              if(Math.abs(dx) > 34 || Math.abs(dy) > 34) {
                                  moved[0] = true;
                                  floatingLongPressHandler.removeCallbacks(longPressTask);
                              }
                              if(moved[0]) {
                                  lp.x = Math.max(0, down[0] - dx);
                                  lp.y = down[1] + dy;
                                  try {
                                      android.util.DisplayMetrics dm = getResources().getDisplayMetrics();
                                      int maxY = Math.max(0, dm.heightPixels / 2 - 64);
                                      if(lp.y > maxY) lp.y = maxY;
                                      if(lp.y < -maxY) lp.y = -maxY;
                                      floatingWindowManager.updateViewLayout(b, lp);
                                  } catch(Exception ignored) {}
                              }
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_UP) {
                              floatingLongPressHandler.removeCallbacks(longPressTask);
                              floatingButtonX = lp.x;
                              floatingButtonY = lp.y;
                              save();
                              if(!moved[0] && !longDone[0]) floatingTranslatorButtonAction();
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_CANCEL) {
                              floatingLongPressHandler.removeCallbacks(longPressTask);
                              return true;
                          }
                          return true;
                      });
                      floatingButtonView = b;
                      floatingWindowManager.addView(floatingButtonView, lp);
                  } catch(Exception e) {
                      floatingButtonView = null;
                      Toast.makeText(this, "Lebegő gomb hiba: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              android.view.WindowManager.LayoutParams floatingParams(int w, int h, int gravity) {
                  int type = Build.VERSION.SDK_INT >= 26 ? android.view.WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : android.view.WindowManager.LayoutParams.TYPE_PHONE;
                  android.view.WindowManager.LayoutParams lp = new android.view.WindowManager.LayoutParams(w, h, type,
                      android.view.WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | android.view.WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      android.graphics.PixelFormat.TRANSLUCENT);
                  lp.gravity = gravity;
                  lp.x = 18;
                  lp.y = 0;
                  return lp;
              }

