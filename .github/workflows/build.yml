          package com.attila.forditokonzol;

          import android.app.*;
          import android.content.*;
          import android.os.*;

          public class VoiceForegroundService extends Service {
              static final String CHANNEL_ID = "fordito_voice_background";
              static final int NOTIFICATION_ID = 1101;

              @Override public void onCreate() {
                  super.onCreate();
                  createChannel();
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  startForeground(NOTIFICATION_ID, notification());
                  return START_STICKY;
              }

              Notification notification() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                    ? new Notification.Builder(this, CHANNEL_ID)
                    : new Notification.Builder(this);

                  return b
                    .setContentTitle("Fordító aktív")
                    .setContentText("Háttér / lezárt kijelző engedélyezve – mikrofon használatban")
                    .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                    .setContentIntent(pi)
                    .setOngoing(true)
                    .setCategory(Notification.CATEGORY_SERVICE)
                    .build();
              }

              void createChannel() {
                  if(Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Fordító háttér mód", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("Értesítés, amikor a fordító lezárt kijelzőnél is aktív.");
                      NotificationManager nm = (NotificationManager)getSystemService(NOTIFICATION_SERVICE);
                      if(nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

