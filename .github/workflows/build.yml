              void handleTranscriptCompleted(String transcript, boolean finalFlush) {
                  if(transcript == null || transcript.trim().length() == 0) {
                      speechIdleFlushToken++;
                      return;
                  }
          
                  // V40.22: hangos szótárbevitel ugyanazon elsődleges STT útból.
                  // Itt megállunk a transzkripciónál: nem hozunk létre TextBlockot és nem indítunk fordítást.
                  if(glossaryVoiceCaptureMode) {
                      speechIdleFlushToken++;
                      completeGlossaryVoiceInput(transcript);
                      return;
                  }
          
                  // V40.25+: a szótári hallott/felismert aliasokat még a blokk-képzés előtt
                  // lokálisan kanonikus alakra írjuk. Így pl. Dres / Drêches / Dreches / Drèche
                  // mind DRECHES lesz, és a következő lépés már biztosan védett szótári elemként kezeli.
                  transcript = canonicalizeGlossaryAliases(transcript);
          
                  if(isAlreadyReleasedTranscript(transcript)) {
                      speechIdleFlushToken++;
                      return;
                  }
          
                  if(!finalFlush) {
                      // V343: egy teljes 7 másodperces audioablak STT-válasza pontosan egy kész blokk.
                      // Nem kerül vissza a második időalapú speechTranscriptBuffer-darabolásba,
                      // ezért ugyanaz az STT-válasz nem tud két-három blokkot egyszerre kiengedni.
                      String b = normalizeAndDeduplicateSpeechBlock(transcript);
                      if(b.length() > 0) {
                          boolean sourceGuessTop = sourceIsTopBySelectedPair(b, topActive);
                          int id = addSourceOnlyBlock(sourceGuessTop, b);
                          if(id >= 0) {
                              firstSpeechBlockReleased = true;
                              speechTranslateQueue.add(id);
                              processNextSpeechTranslation();
                          }
                      }
                      speechTranscriptBuffer = "";
                      firstSpeechHeardAt = 0L;
                      speechIdleFlushToken++;
                      return;
                  }
          
                  // A beszéd végi, 7 másodpercnél rövidebb maradék továbbra is a meglévő
                  // biztonságos lezárási úton kerül kiadásra.
                  speechTranscriptBuffer = transcript;
                  int released = flushReadyTranscriptBlocks(true);
                  speechIdleFlushToken++;
              }
          
              int flushReadyTranscriptBlocks(boolean flushAll) {
                  int releasedCount = 0;
                  // V318: az első élő blokkot nem engedjük ki azonnal 1-2 bizonytalan szóból.
                  // Ez szűri a kezdő "Microfoonprobe / Kazakhstan / UFO" jellegű félrehallást,
                  // de nem nyúl az audiohoz és nem épít új nyelvfelismerőt.
                  if(!firstSpeechBlockReleased && !initialSpeechGateOpen()) return 0;
                  while(true) {
                      String b = popReadySpeechBlock(flushAll);
                      if(b == null || b.trim().length() == 0) break;
          
                      // V318: egyetlen beviteli normalizáló blokk.
                      // Itt történik a tisztítás, a közvetlen ismétlés összehúzása,
                      // az előző blokk végével való átfedés levágása és a biztos duplázás kiszűrése.
                      // Alapelv: ha bizonytalan, átengedjük, nem nyeljük el a beszédet.
                      b = normalizeAndDeduplicateSpeechBlock(b);
                      if(b.length() == 0) continue;
                      // V318: valódi tolmács mód. A nyers STT blokkot nem zárjuk magyarra és
                      // nem dobjuk el helyi nyelvi kapuval. A TOP/BOTTOM forrásnyelvet a meglévő
                      // AI osztályozó + eredeti nyelvű helyreállító + fordító lépés dönti el.
                      // A helyi oldalbecslés csak ideiglenes kijelzési hely, az AI válasz után
                      // a blokk a tényleges SOURCE_LANG szerinti oldalra kerül.
                      boolean sourceGuessTop = sourceIsTopBySelectedPair(b, topActive);
                      int id = addSourceOnlyBlock(sourceGuessTop, b);
                      if(id < 0) continue;
                      firstSpeechBlockReleased = true;
                      speechTranslateQueue.add(id);
                      releasedCount++;
                  }
                  if(releasedCount > 0) {
                      // V318: sikeres kiírás után a régi idle flush már nem zárhat ugyanarra.
                      speechIdleFlushToken++;
                  }
                  // V318: a blokkok sorrendben kerülnek a meglévő egyetlen speech fordítási sorba.
                  // Egyszerre csak egy blokk fordul; a kézi FORDÍT lehetőség változatlanul megmarad.
                  if(releasedCount > 0) processNextSpeechTranslation();
                  return releasedCount;
              }
          
              boolean initialSpeechGateOpen() {
                  String s = speechTranscriptBuffer == null ? "" : speechTranscriptBuffer.trim();
                  if(s.length() == 0) return false;
                  int words = s.split("\\s+").length;
                  long age = firstSpeechHeardAt > 0L ? System.currentTimeMillis() - firstSpeechHeardAt : 0L;
          
                  // V318: nincs külön szótáras nyelvkapu az első blokknál.
                  // Rövid válasz is beszéd. Csak minimális stabilizálást várunk, hogy ne fél karakter menjen fordításra.
                  if(age >= MIN_TRUE_SPEECH_AUDIO_MS && s.length() >= 2 && words >= 1) return true;
                  if(firstHardSentenceEnd(s) >= 0 && words >= 1) return true;
                  if(s.length() >= 18 && words >= 2) return true;
                  return false;
              }
          
              boolean isAlreadyReleasedTranscript(String transcript) {
                  if(transcript == null) return false;
                  String b = cleanTranscriptForSelectedPair(transcript);
                  b = collapseAdjacentRepeatedPhrase(b);
                  b = finalizeSpeechBlockText(b);
                  b = applyTinyHungarianTermFixes(b);
                  b = b.trim().replaceAll("\\s+", " ");
                  if(b.length() == 0) return false;
                  String h = normalizeSpeechBlockHash(b);
                  if(h.length() < 8) return false;
                  return matchesVeryRecentReleasedBlock(h);
              }
          
              boolean matchesVeryRecentReleasedBlock(String h) {
                  if(h == null || h.length() < 8) return false;
                  if(recentSpeechBlockHashes.contains(h)) return true;
                  int checked = 0;
                  Iterator<String> it = recentSpeechBlockHashOrder.descendingIterator();
                  while(it.hasNext() && checked < 8) {
                      String old = it.next();
                      checked++;
                      if(old == null || old.length() < 8) continue;
                      int min = Math.min(h.length(), old.length());
                      int max = Math.max(h.length(), old.length());
                      if(min >= 18 && (h.contains(old) || old.contains(h)) && (min * 100 / Math.max(1, max)) >= 82) return true;
                  }
                  return false;
              }
          
              String normalizeAndDeduplicateSpeechBlock(String raw) {
                  if(raw == null) return "";
                  String b = cleanTranscriptForSelectedPair(raw);
          
                  // V318: egyetlen beviteli normalizáló lánc, nem új kapu.
                  // Előbb a blokkon belüli közvetlen ismétlést húzzuk össze bárhol,
                  // nem csak a blokk elején. Ez fogja meg a mondat közepén jelentkező
                  // közvetlen ismétlést is.
                  b = collapseAdjacentRepeatedPhrase(b);
                  b = finalizeSpeechBlockText(b);
                  b = applyTinyHungarianTermFixes(b);
          
                  // Utána csak az előző kész blokk végéből az új blokk elejére átcsúszó
                  // biztos átfedést vágjuk le. Ha bizonytalan, átengedjük.
                  b = trimRecentSpeechBlockOverlap(b);
                  if(b == null) return "";
                  b = b.trim().replaceAll("\\s+", " ");
                  if(b.length() == 0) return "";
          
                  String h = normalizeSpeechBlockHash(b);
                  if(h.length() < 3) return "";
          
                  // V318: legutolsó lépésként, minden tisztítás után hasonlítunk a közvetlenül
                  // frissen kiadott blokkokhoz. Nem új kapu: ugyanennek a normalizáló blokknak
                  // a vége. Csak teljes vagy majdnem teljes ismétlést dobunk el.
                  if(matchesVeryRecentReleasedBlock(h)) return "";
          
                  rememberSpeechBlockHash(h);
                  return b;
              }
          
              String collapseAdjacentRepeatedPhrase(String raw) {
                  if(raw == null) return "";
                  String t = raw.trim().replaceAll("\\s+", " ");
                  if(t.length() == 0) return t;
                  String[] w = t.split("\\s+");
                  if(w.length < 6) return t;
          
                  ArrayList<String> out = new ArrayList<>();
                  int i = 0;
                  while(i < w.length) {
                      boolean collapsed = false;
                      int maxN = Math.min(10, (w.length - i) / 2);
                      for(int n=maxN; n>=3; n--) {
                          boolean same = true;
                          for(int j=0; j<n; j++) {
                              String a = normalizeSpeechBlockHash(w[i+j]);
                              String b = normalizeSpeechBlockHash(w[i+n+j]);
                              if(a.length() == 0 || !a.equals(b)) { same = false; break; }
                          }
                          if(same) {
                              for(int j=0; j<n; j++) out.add(w[i+j]);
                              i += n * 2;
                              collapsed = true;
                              break;
                          }
                      }
                      if(!collapsed) {
                          out.add(w[i]);
                          i++;
                      }
                  }
          
                  StringBuilder sb = new StringBuilder();
                  for(String x : out) {
                      if(sb.length() > 0) sb.append(' ');
                      sb.append(x);
                  }
                  return sb.toString().trim();
              }
          
              void rememberSpeechBlockHash(String h) {
                  if(h == null || h.length() < 3) return;
                  recentSpeechBlockHashes.add(h);
                  recentSpeechBlockHashOrder.add(h);
                  while(recentSpeechBlockHashOrder.size() > 80) {
                      String old = recentSpeechBlockHashOrder.poll();
                      if(old != null) recentSpeechBlockHashes.remove(old);
                  }
              }
          
              String finalizeSpeechBlockText(String raw) {
                  if(raw == null) return "";
                  String t = raw.trim().replaceAll("\\s+", " ");
                  while(t.startsWith(",") || t.startsWith(";") || t.startsWith(":")) t = t.substring(1).trim();
                  if(t.length() == 0) return "";
                  // V318: vesszőből / pontosvesszőből / kettőspontból nem gyártunk pontot.
                  // Ezek sokszor folytatást jelölnek, a hamis pont pedig rossz blokk- és
                  // nagybetűs mondatkezdést okozott.
                  return t;
              }
          
              String applyTinyHungarianTermFixes(String raw) {
                  if(raw == null) return "";
                  String x = raw.trim().replaceAll("\\s+", " ");
                  if(x.length() == 0) return x;
          
                  // V318: NEM általános szótár. Csak pár, tesztben sokszor félrehallott fix kifejezés.
                  x = x.replaceAll("(?iu)\\bblu\\s*t[uú]+t[h]?\\b", "Bluetooth");
                  x = x.replaceAll("(?iu)\\bbluetooth[- ]?ot\\b", "Bluetoothot");
                  x = x.replaceAll("(?iu)\\bbluetooth[- ]?on\\b", "Bluetoothon");
                  x = x.replaceAll("(?iu)\\bblutus\\b", "Bluetooth");
                  x = x.replaceAll("(?iu)\\bblut[uú]sz\\b", "Bluetooth");
                  x = x.replaceAll("(?iu)\\bblue\\s*tooth\\b", "Bluetooth");
          
                  x = x.replaceAll("(?iu)\\bs[íi]r[íi]\\s+csend\\b", "síri csend");
                  x = x.replaceAll("(?iu)\\bs[íi]li\\s+csend\\b", "síri csend");
                  x = x.replaceAll("(?iu)\\bs[íi]r[íi]ts?en\\b", "síri csend");
                  x = x.replaceAll("(?iu)\\bs[íi]ri\\s+csendes\\b", "síri csendes");
          
                  return x.trim().replaceAll("\\s+", " ");
              }
          
              boolean sourceIsTopBySelectedPair(String text, boolean fallback) {
                  String detected = selectedPairLanguageCode(text);
                  if(detected.length() == 0) return fallback;
                  return detected.equalsIgnoreCase(code(topLang));
              }
          
              String selectedPairLanguageCode(String text) {
                  String detected = strongLanguageCode(text);
                  if(detected.length() == 0) return "";
                  if(detected.equalsIgnoreCase(code(topLang)) || detected.equalsIgnoreCase(code(bottomLang))) return detected;
                  return "";
              }
          
              int scoreTextForLanguage(String text, String lang) {
                  if(text == null || lang == null) return 0;
                  String x = text.toLowerCase(Locale.ROOT);
                  String[] words = x.split("[^\\p{L}]+");
                  HashSet<String> tokens = new HashSet<>();
                  for(String w : words) if(w != null && !w.isEmpty()) tokens.add(w);
                  String[][] lex = {
                      {"hu","hogy","nem","igen","és","vagy","van","volt","lesz","akkor","amikor","mennyi","hányan","ember","emberek","jó","napot","uram","tudjuk","lehet","kell","még","már","csak","egy","két","három","itt","ott","ezt","az","meg","köszönöm","kérem","szia","szeretnék","vagyok","vagyunk","voltak","emlékszem","ugye"},
                      {"fr","le","la","les","un","une","des","de","du","dans","sur","avec","pour","pas","ne","est","sont","était","étaient","combien","quand","que","qui","je","tu","il","elle","nous","vous","ils","elles","bonjour","monsieur","merci","oui","non","peux","peut","appeler","officiellement","possible","contrat","club","personnes","présents","souviens"},
                      {"en","the","and","is","are","was","were","you","i","he","she","we","they","can","cannot","not","with","for","from","this","that","hello","thanks","thank","please"},
                      {"de","der","die","das","ein","eine","und","ist","sind","war","waren","nicht","ich","du","er","sie","wir","ihr","mit","für","von","hallo","guten","tag","danke","bitte","können","kann"},
                      {"it","il","lo","la","gli","le","un","una","di","del","della","e","è","sono","non","io","tu","lui","lei","noi","voi","con","per","ciao","buongiorno","grazie","prego"},
                      {"es","el","la","los","las","un","una","de","del","y","es","son","no","yo","tú","usted","nosotros","vosotros","con","para","hola","buenos","días","gracias","por","qué"},
                      {"ro","și","este","sunt","nu","eu","tu","el","ea","noi","voi","cu","pentru","din","bună","ziua","mulțumesc","vă","poate","când","care"},
                      {"hr","i","je","su","nije","ne","ja","ti","on","ona","mi","vi","sa","za","od","dobar","dan","hvala","molim","mogu","može","koliko","kada"},
                      {"sk","a","je","sú","nie","ja","ty","on","ona","my","vy","sa","som","sme","pre","od","dobrý","deň","ďakujem","prosím","môžem","možem","môže","koľko","keď","v"},
                      {"sl","in","je","so","ni","ne","jaz","ti","on","ona","mi","vi","se","smo","za","od","dober","dan","hvala","prosim","lahko","koliko","ko","v"}
                  };
                  int score = 0;
                  for(String[] row : lex) {
                      if(!row[0].equalsIgnoreCase(lang)) continue;
                      for(int i=1;i<row.length;i++) if(tokens.contains(row[i])) score += row[i].length() >= 5 ? 4 : 2;
                      break;
                  }
                  if("hu".equals(lang)) {
                      score += countChars(x, "őű") * 5 + countChars(x, "áéíóöúü") ;
                  } else if("fr".equals(lang)) {
                      score += countChars(x, "çœ") * 4 + countChars(x, "àâæéèêëîïôùûüÿ") ;
                  } else if("de".equals(lang)) {
                      score += countChars(x, "ß") * 6 + countChars(x, "äöü") ;
                  } else if("ro".equals(lang)) {
                      score += countChars(x, "ăâîșşțţ") * 3;
                  } else if("hr".equals(lang)) {
                      score += countChars(x, "čćđšž") * 2;
                  } else if("sk".equals(lang)) {
                      score += countChars(x, "ôľĺŕďťň") * 4 + countChars(x, "čšž") ;
                  } else if("sl".equals(lang)) {
                      score += countChars(x, "čšž") * 2;
                  }
                  return score;
              }
          
              int countChars(String text, String chars) {
                  int count = 0;
                  if(text == null || chars == null) return 0;
                  for(int i=0;i<text.length();i++) if(chars.indexOf(text.charAt(i)) >= 0) count++;
                  return count;
              }
          
              String strongLanguageCode(String text) {
                  String cleaned = cleanTranscriptForSelectedPair(text);
                  if(cleaned.length() < 2) return "";
                  String[] candidates = {"hu","fr","en","de","it","es","ro","hr","sk","sl"};
                  String best = "";
                  int bestScore = 0;
                  int secondScore = 0;
                  for(String lang : candidates) {
                      int score = scoreTextForLanguage(cleaned, lang);
                      if(score > bestScore) {
                          secondScore = bestScore;
                          bestScore = score;
                          best = lang;
                      } else if(score > secondScore) {
                          secondScore = score;
                      }
                  }
                  if(bestScore >= 6 && bestScore >= secondScore + 2) return best;
                  return "";
              }
          
              String strongThirdLanguageCode(String text) {
                  String cleaned = cleanTranscriptForSelectedPair(text);
                  if(cleaned.length() < 2) return "";
                  String top = code(topLang).toLowerCase(Locale.ROOT);
                  String bottom = code(bottomLang).toLowerCase(Locale.ROOT);
                  String[] candidates = {"hu","fr","en","de","it","es","ro","hr","sk","sl"};
                  String bestThird = "";
                  int bestThirdScore = 0;
                  int bestSelectedScore = 0;
                  for(String lang : candidates) {
                      int score = scoreTextForLanguage(cleaned, lang);
                      if(lang.equals(top) || lang.equals(bottom)) {
                          if(score > bestSelectedScore) bestSelectedScore = score;
                      } else if(score > bestThirdScore) {
                          bestThirdScore = score;
                          bestThird = lang;
                      }
                  }
                  if(bestThirdScore >= 8 && bestThirdScore >= bestSelectedScore + 4) return bestThird;
                  return "";
              }
          
              String trimRecentSpeechBlockOverlap(String block) {
                  if(block == null) return "";
                  String raw = block.trim().replaceAll("\\s+", " ");
                  String h = normalizeSpeechBlockHash(raw);
                  if(h.length() < 8) return raw;
                  String[] nw = h.split("\\s+");
                  String[] rawWords = raw.split("\\s+");
          
                  // V40.30: átfedést csak a legutóbbi néhány blokkal keresünk, legújabbtól
                  // visszafelé. A korábbi, akár 80 blokkal ezelőtti azonos mondatrész jogos
                  // ismétlés lehet, ezért nem törölhető automatikusan.
                  int checked = 0;
                  Iterator<String> recentIt = recentSpeechBlockHashOrder.descendingIterator();
                  while(recentIt.hasNext() && checked < 8) {
                      String old = recentIt.next();
                      checked++;
                      if(old == null || old.length() < 8) continue;
                      String[] ow = old.split("\\s+");
                      if(ow.length < 2 || nw.length < 2) continue;
          
                      // Ha a régi blokk teljes egészében az új blokk elején ismétlődik,
                      // csak ezt az eleji ismétlést vágjuk le, az új folytatást megtartjuk.
                      int fullOld = Math.min(ow.length, nw.length);
                      if(fullOld >= 3) {
                          boolean oldAtStart = true;
                          for(int i=0; i<fullOld; i++) {
                              if(!ow[i].equals(nw[i])) { oldAtStart = false; break; }
                          }
                          if(oldAtStart && fullOld < rawWords.length) {
                              StringBuilder sb = new StringBuilder();
                              for(int i=fullOld; i<rawWords.length; i++) {
                                  if(sb.length() > 0) sb.append(' ');
                                  sb.append(rawWords[i]);
                              }
                              return sb.toString().trim();
                          }
                      }
          
                      int maxN = Math.min(10, Math.min(ow.length, nw.length));
                      for(int n=maxN; n>=2; n--) {
                          boolean suffixPrefix = true;
                          for(int i=0; i<n; i++) {
                              if(!ow[ow.length-n+i].equals(nw[i])) { suffixPrefix = false; break; }
                          }
                          if(suffixPrefix) {
                              if(n >= rawWords.length) return "";
                              StringBuilder sb = new StringBuilder();
                              for(int i=n; i<rawWords.length; i++) {
                                  if(sb.length() > 0) sb.append(' ');
                                  sb.append(rawWords[i]);
                              }
                              return sb.toString().trim();
                          }
                      }
                  }
                  return raw;
              }
          
              String normalizeSpeechBlockHash(String block) {
                  if(block == null) return "";
                  return block.toLowerCase(Locale.ROOT)
                          .replaceAll("[\\p{Punct}\\s]+", " ")
                          .trim();
              }
          
              String popReadySpeechBlock(boolean flushAll) {
                  String s = speechTranscriptBuffer == null ? "" : speechTranscriptBuffer;
                  if(s.trim().length() == 0) { speechTranscriptBuffer = ""; return null; }
          
                  int cut = findSpeechBlockCut(s, flushAll);
                  if(cut < 0) return null;
          
                  String out = s.substring(0, cut).trim();
                  speechTranscriptBuffer = s.substring(cut).trim();
                  firstSpeechHeardAt = speechTranscriptBuffer.length() > 0 ? System.currentTimeMillis() : 0L;
                  return out;
              }
          
              int findSpeechBlockCut(String s, boolean flushAll) {
                  if(s == null) return -1;
                  String t = s.trim();
                  if(t.length() == 0) return -1;
          
                  // V318: egyszerű blokkhatár-döntés.
                  // Ha van kész mondatvég, azonnal zár.
                  // Ha nincs, legfeljebb 7 mp folyamatos puffer után szóhatáron zár.
                  // Nincs karakter-, vessző-, szótár- vagy többágú monológlogika.
                  int cut = firstHardSentenceEnd(s);
                  if(cut >= 0) return cut;
          
                  cut = smartLinguisticCut(s);
                  if(cut >= 0) return cut;
          
                  long age = firstSpeechHeardAt > 0L ? System.currentTimeMillis() - firstSpeechHeardAt : 0L;
                  if(age >= MAX_CONTINUOUS_SPEECH_BLOCK_MS) {
                      int forced = safeWholeBufferFlushCut(s);
                      return forced >= 0 ? forced : s.length();
                  }
          
                  if(flushAll) return safeWholeBufferFlushCut(s);
          
                  return -1;
              }
          
              int safeWholeBufferFlushCut(String s) {
                  if(s == null) return -1;
                  String t = s.trim();
                  if(t.length() == 0) return -1;
          
                  // A completed/idle vagy kényszerített flush a teljes megmaradt puffert kiadja.
                  // Itt nincs további tartalmi kapu; a blokkhatárt a hívó dönti el.
                  return s.length();
              }
          
              int firstHardSentenceEnd(String s) {
                  for(int i=0;i<s.length();i++) {
                      char ch = s.charAt(i);
                      if(ch == '.' || ch == '!' || ch == '?' || ch == '…' || ch == '\n') return i + 1;
                  }
                  return -1;
              }
          
              int smartLinguisticCut(String s) {
                  int len = s.length();
                  if(len < 85) return -1;
          
                  String lower = s.toLowerCase(Locale.ROOT);
                  int preferredEnd = Math.min(len, 185);
                  int preferredStart = Math.min(len, 75);
          
                  // V318: V318 alap, de kevésbé engedékeny hosszú blokkoknál.
                  // Nem audio, nem VAD, nem időzítő. Csak a már beérkezett szöveg stabil elejét vágjuk le,
                  // hogy hosszú folyamatos beszédnél se legyen egyetlen óriás blokk.
          
                  // 1) Erős gondolatváltók. Itt az előző rész általában önállóan is érthető.
                  int cut = lastConnectorCut(lower, preferredStart, preferredEnd, new String[]{
                          ", de ", ", viszont ", ", hanem ", ", tehát ", ", ezért ",
                          ", aztán ", ", majd ", ", utána ", "; ", ": ", " - "
                  });
                  if(cut > 0) return cut;
          
                  // 2) Feltételes / következő gondolat kezdete. V318-höz képest kicsit bátrabb,
                  // mert a beszélt nyelvben sokszor nincs pont, csak új gondolat kezdődik.
                  cut = lastConnectorCut(lower, 90, preferredEnd, new String[]{
                          ", és akkor ", ", akkor ", ", hogyha ", ", ha ", ", amikor ",
                          ", ahol ", ", amíg ", ", miközben ", ", vagy ", ", illetve "
                  });
                  if(cut > 0) return cut;
          
                  // 3) Felsorolás vagy hosszú mellékmondat. Vágás vessző után, de csak akkor,
                  // ha már van érdemi hosszúságú, önmagában is olvasható blokk.
                  cut = lastCommaCut(s, 90, Math.min(len, 175));
                  if(cut > 0) return cut;
          
                  // 4) Ha nincs vessző, de már hosszú a blokk, természetes kötőszavaknál is vágunk.
                  // Ez javítja a hosszú folyamatos monológokat, de továbbra sem időalapú.
                  cut = lastSoftWordCut(lower, 110, Math.min(len, 185), new String[]{
                          " de ", " viszont ", " akkor ", " utána ", " majd ",
                          " és akkor ", " hogyha ", " ha ", " amikor ", " illetve ",
                          " mindenhol ", " szinte ", " na most ", " pedig "
                  });
                  if(cut > 0) return cut;
          
                  // 5) Stabil prefix vágás: ha a beszéd hosszúra nő és nincs biztos írásjel,
                  // a puffer elejét lezárjuk szóhatáron. A maradék a pufferben marad tovább épülni.
                  // Ez szöveg-alapú biztonsági szelep, nem másodperc- vagy szünetalapú döntés.
                  if(len >= 190) {
                      int spc = s.lastIndexOf(' ', Math.min(len, 170));
                      if(spc >= 115) return spc + 1;
                  }
          
                  return -1;
              }
          
              int lastConnectorCut(String lower, int minPos, int maxPos, String[] connectors) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String sep: connectors) {
                      int pos = lower.lastIndexOf(sep, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1; // a vessző/írásjel az előző blokk végén marad
              }
          
              int lastCommaCut(String s, int minPos, int maxPos) {
                  int end = Math.min(s.length(), maxPos);
                  int pos = s.lastIndexOf(',', end);
                  if(pos >= minPos) return pos + 1;
                  return -1;
              }
          
              int lastSoftWordCut(String lower, int minPos, int maxPos, String[] words) {
                  int best = -1;
                  int end = Math.min(lower.length(), maxPos);
                  for(String w: words) {
                      int pos = lower.lastIndexOf(w, end);
                      if(pos >= minPos && pos > best) best = pos;
                  }
                  if(best < 0) return -1;
                  return best + 1;
              }
          
              void setDetectedSourceSide(boolean sourceIsTop) {
                  topActive = sourceIsTop;
                  manualTopSource = sourceIsTop;
                  updateButtons();
              }
          
              String cleanTranscriptForSelectedPair(String text) {
                  if(text == null) return "";
                  // V318: ez továbbra sem saját nagy nyelvfelismerő. Csak biztonsági tisztítás:
                  // idegen írásrendszeres STT-szemét nem kerülhet ki az ablakokba vagy fordításba.
                  String x = text.replaceAll("[^A-Za-z0-9\\u00C0-\\u024F\\p{Punct}\\s]", " ");
                  return x.replaceAll("\\s+", " ").trim();
              }
          
              String normalizeAiSourceLangCode(String sourceLang) {
                  if(sourceLang == null) return "";
                  String s = java.text.Normalizer.normalize(sourceLang, java.text.Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "")
                      .toLowerCase(Locale.ROOT).replace('_', '-')
                      .replaceAll("[^a-z-]", "").trim();
                  if(s.length() == 0) return "";
                  if(s.equals("hu") || s.equals("hun") || s.equals("hu-hu") || s.equals("hungarian") || s.equals("magyar")) return "HU";
                  if(s.equals("fr") || s.equals("fra") || s.equals("fre") || s.equals("fr-fr") || s.equals("french") || s.equals("francais")) return "FR";
                  if(s.equals("en") || s.equals("eng") || s.equals("en-us") || s.equals("en-gb") || s.equals("english")) return "EN";
                  if(s.equals("de") || s.equals("deu") || s.equals("ger") || s.equals("de-de") || s.equals("german") || s.equals("deutsch")) return "DE";
                  if(s.equals("it") || s.equals("ita") || s.equals("it-it") || s.equals("italian") || s.equals("italiano")) return "IT";
                  if(s.equals("es") || s.equals("spa") || s.equals("es-es") || s.equals("spanish") || s.equals("espanol")) return "ES";
                  if(s.equals("ro") || s.equals("ron") || s.equals("rum") || s.equals("ro-ro") || s.equals("romanian") || s.equals("romana")) return "RO";
                  if(s.equals("hr") || s.equals("hrv") || s.equals("hr-hr") || s.equals("croatian") || s.equals("hrvatski")) return "HR";
                  if(s.equals("sk") || s.equals("slk") || s.equals("slo") || s.equals("sk-sk") || s.equals("slovak") || s.equals("slovencina")) return "SK";
                  if(s.equals("sl") || s.equals("slv") || s.equals("sl-si") || s.equals("slovenian") || s.equals("slovenscina")) return "SL";
                  return "";
              }
          
              int addSourceOnlyBlock(boolean sourceIsTop, String original) {
                  // V318: gyors visszajelzés. A nyers STT azonnal látható az aktuális oldalon,
                  // ugyanakkor pendingSourceText-ben is megmarad, hogy a valid AI-válasz után
                  // a blokk átkerülhessen a valódi SOURCE_LANG szerinti oldalra.
                  if(isRecentlyDisplayedSourceDuplicate(sourceIsTop, original)) return -1;
          
                  TextBlock b = new TextBlock();
                  b.speechSeq = ++speechSourceBlockSeq;
                  b.sourceTop = sourceIsTop;
                  b.translatedOk = false;
                  b.pendingSourceText = original == null ? "" : original.trim();
                  // V40.3: a nyers STT azonnal látható; az AI-válasz után ugyanennek a blokknak
                  // a forrásoldalát a finoman javított clean_source váltja fel.
                  // A pendingSourceText változatlanul megmarad; az AI nyelvdöntése után a blokk
                  // szükség esetén átkerül a másik oldalra. Fordítási hiba esetén az átirat nem vész el.
                  String visibleSource = userVisibleSpeechTextOrEmpty(b.pendingSourceText);
                  b.topText = sourceIsTop ? visibleSource : "";
                  b.bottomText = sourceIsTop ? "" : visibleSource;
                  textBlocks.add(b);
                  renderBlocksKeepView();
                  return textBlocks.size() - 1;
              }
          
              String userVisibleSpeechTextOrEmpty(String text) {
                  if(text == null) return "";
                  String cleaned = cleanTranscriptForSelectedPair(text).trim();
                  if(cleaned.length() == 0) return "";
                  if(looksLikeInternalLeak(cleaned)) return "";
                  return cleaned;
              }
          
              boolean looksLikeInternalLeak(String text) {
                  if(text == null) return false;
                  String l = text.toLowerCase(Locale.ROOT).replaceAll("\\s+", " ").trim();
                  if(l.length() == 0) return false;
                  String[] bad = {
                      "speech_pair_classify_and_translate", "selected_top_lang", "selected_bottom_lang", "source_lang:",
                      "original:", "translation:", "instructions", "system prompt", "developer message", "context profile:",
                      "domain glossary", "audio_transcription", "chat.completions", "chat.completions", "api request",
                      "api response", "metadata", "metaadat", "prompt", "cannot translate", "can't translate",
                      "nem tudom lefordítani", "nem fordíthatom", "tartalom miatt", "abusive content", "policy"
                  };
                  for(String b: bad) if(l.contains(b)) return true;
                  return false;
              }
          
              boolean isRecentlyDisplayedSourceDuplicate(boolean sourceIsTop, String original) {
                  if(original == null) return true;
                  String h = normalizeSpeechBlockHash(original);
                  if(h.length() < 8) return false;
          
                  int checked = 0;
                  for(int i=textBlocks.size()-1; i>=0 && checked<5; i--) {
                      TextBlock b = textBlocks.get(i);
                      if(b == null || b.sourceTop != sourceIsTop) continue;
                      checked++;
                      String oldText = b.pendingSourceText != null && b.pendingSourceText.trim().length() > 0
                              ? b.pendingSourceText
                              : (sourceIsTop ? b.topText : b.bottomText);
                      String oh = normalizeSpeechBlockHash(oldText);
                      if(oh.length() < 8) continue;
                      if(h.equals(oh)) return true;
          
                      int min = Math.min(h.length(), oh.length());
                      int max = Math.max(h.length(), oh.length());
                      // V318: csak majdnem teljes azonosságot fogunk meg.
                      // A hasonló, de eltérő blokk ne essen ki, mert az beszédvesztéshez vezetett.
                      if(min >= 24 && (h.contains(oh) || oh.contains(h)) && (min * 100 / Math.max(1, max)) >= 92) return true;
                  }
                  return false;
              }
          
              String speechPreviousContextHint() {
                  // V40.9: az előző blokk csak semleges terminológiai támpont.
                  // A korábbi SOURCE_LANG címke hibásan a következő, akár ellenkező nyelvű
                  // mondat felé billentette a nyelvdöntést, ezért irányjelzés nélkül adjuk át.
                  String original = lastSureSpeechOriginal == null ? "" : lastSureSpeechOriginal.trim();
                  String translated = lastSureSpeechTranslation == null ? "" : lastSureSpeechTranslation.trim();
                  if(original.length() == 0) return "";
                  if(original.length() > 320) original = original.substring(original.length() - 320);
                  if(translated.length() > 320) translated = translated.substring(translated.length() - 320);
                  return "PREVIOUS_CONFIRMED_CONTEXT (terminology reference only; it does not indicate the language direction of the new block and must never be copied):\n" +
                      "PREVIOUS_ORIGINAL_TEXT: " + original + "\n" +
                      (translated.length() == 0 ? "" : "PREVIOUS_TRANSLATED_TEXT: " + translated + "\n");
              }
          
              void processNextSpeechTranslation() {
                  if(speechTranslateMode || responseInProgress) return;
                  ensureHttpClient();
                  Integer idObj = speechTranslateQueue.poll();
                  if(idObj == null) { maybeFinishStop(); return; }
                  int id = idObj.intValue();
                  if(id < 0 || id >= textBlocks.size()) { processNextSpeechTranslation(); return; }
                  TextBlock b = textBlocks.get(id);
                  boolean sourceIsTop = b.sourceTop;
                  String src = b.pendingSourceText != null && b.pendingSourceText.trim().length() > 0
                      ? b.pendingSourceText
                      : (sourceIsTop ? b.topText : b.bottomText);
                  if(src == null || src.trim().length() == 0) { processNextSpeechTranslation(); return; }
          
                  try {
                      pendingSpeechBlockId = id;
                      pendingSpeechBlockRevision = b.editRevision;
                      pendingSpeechBlockRef = b;
                      final TextBlock requestBlock = b;
                      pendingSpeechGlossaryProtection = protectGlossaryTerms(src.trim());
                      speechTranslateMode = true;
                      responseInProgress = true;
                      final int requestSession = sttSessionId;
                      JSONObject root = new JSONObject();
                      root.put("model", model);
                      root.put("temperature", 0.1);
                      JSONArray messages = new JSONArray();
                      messages.put(new JSONObject().put("role", "system").put("content", speechBlockInstructions()));
                      String topCode = code(topLang).toUpperCase(Locale.ROOT);
                      String bottomCode = code(bottomLang).toUpperCase(Locale.ROOT);
                      String localLanguageHint = selectedPairLanguageCode(src);
                      String localHintText = localLanguageHint.length() == 0 ? "" :
                          "LOCAL_STRONG_LANGUAGE_EVIDENCE: " + localLanguageHint.toUpperCase(Locale.ROOT) +
                          " (consistency hint only; verify it against RAW_SPEECH_TEXT).\n";
                      messages.put(new JSONObject().put("role", "user").put("content",
                          speechPreviousContextHint() + localHintText +
                          "RAW_SPEECH_TEXT (the only text to clean and translate):\n" + pendingSpeechGlossaryProtection.text));
                      root.put("messages", messages);
          
                      // V341: strict Structured Outputs. A forrásnyelv csak a kiválasztott két kód egyike lehet.
                      JSONObject properties = new JSONObject();
                      properties.put("source_lang", new JSONObject().put("type", "string")
                          .put("enum", new JSONArray().put(topCode).put(bottomCode))
                          .put("description", "The detected source language. It must be exactly one of the two selected language codes."));
                      properties.put("clean_source", new JSONObject().put("type", "string")
                          .put("description", "Corrected transcription entirely in source_lang. No ordinary words from a third language and no target-language mixture. Genuine proper names and protected glossary placeholders/terms may remain unchanged."));
                      properties.put("translation", new JSONObject().put("type", "string")
                          .put("description", "Translation entirely in the other selected language, without ordinary source-language or third-language mixture. Genuine proper names and protected glossary placeholders/terms may remain unchanged."));
                      JSONObject schema = new JSONObject()
                          .put("type", "object").put("properties", properties)
                          .put("required", new JSONArray().put("source_lang").put("clean_source").put("translation"))
                          .put("additionalProperties", false);
                      JSONObject jsonSchema = new JSONObject()
                          .put("name", "speech_clean_and_translate").put("strict", true).put("schema", schema);
                      root.put("response_format", new JSONObject()
                          .put("type", "json_schema").put("json_schema", jsonSchema));
                      Request req = new Request.Builder().url("https://api.openai.com/v1/chat/completions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .addHeader("Content-Type", "application/json")
                          .post(RequestBody.create(MediaType.parse("application/json; charset=utf-8"), root.toString())).build();
                      client.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> {
                                  if(requestSession != sttSessionId || pendingSpeechBlockId != id || pendingSpeechBlockRef != requestBlock) return;
                                  responseInProgress = false;
                                  retrySpeechBlockOrRender(id);
                              });
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> {
                                      if(requestSession != sttSessionId || pendingSpeechBlockId != id || pendingSpeechBlockRef != requestBlock) return;
                                      responseInProgress = false;
                                      retrySpeechBlockOrRender(id);
                                  });
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String out = obj.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "").trim();
                                  runOnUiThread(() -> {
                                      if(requestSession != sttSessionId || pendingSpeechBlockId != id || pendingSpeechBlockRef != requestBlock) return;
                                      responseInProgress = false;
                                      applySpeechTranslation(out);
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(() -> {
                                      if(requestSession != sttSessionId || pendingSpeechBlockId != id || pendingSpeechBlockRef != requestBlock) return;
                                      responseInProgress = false;
                                      retrySpeechBlockOrRender(id);
                                  });
                              }
                          }
                      });
                  } catch(Exception e) {
                      retrySpeechBlockOrRender(id);
                  }
              }
          
              void finishSupersededSpeechTranslation(int id) {
                  // A felhasználó a kérés elküldése után kézzel módosította ugyanazt a blokkot.
                  // A régi AI-válasz szándékosan nem kerül a képernyőre és nem indít új automatikus kérést.
                  responseInProgress = false;
                  speechTranslateMode = false;
                  if(pendingSpeechBlockId == id) pendingSpeechBlockId = -1;
                  pendingSpeechBlockRevision = -1;
                  pendingSpeechBlockRef = null;
                  pendingSpeechGlossaryProtection = GlossaryProtection.empty();
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else maybeFinishStop();
              }
          
              void retrySpeechBlockOrRender(int id) {
                  // 2026-07-09: nincs automatikus második/harmadik AI-kör.
                  // Egy beszédblokk egy fordítási kérést kap. Hibás vagy hiányos válasz nem nyújthatja
                  // 4-9 másodpercre a reakcióidőt újraküldésekkel. Az állapotot feloldjuk, a sor továbblép.
                  responseInProgress = false;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  pendingSpeechBlockRevision = -1;
                  pendingSpeechBlockRef = null;
                  pendingSpeechGlossaryProtection = GlossaryProtection.empty();
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      b.translatedOk = false;
                      b.retryCount = 0;
                  }
          
                  renderBlocksKeepView();
                  state.setText(streaming ? "mikrofon aktív – fordítási hiba" : "fordítási hiba – az átirat megmaradt");
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else maybeFinishStop();
              }
              void applySpeechTranslation(String out) {
                  int id = pendingSpeechBlockId;
                  TextBlock expectedBlock = pendingSpeechBlockRef;
                  String speakText = null;
                  String speakLang = null;
                  if(id < 0 || id >= textBlocks.size() || expectedBlock == null || textBlocks.get(id) != expectedBlock) {
                      responseInProgress = false;
                      invalidateSpeechTranslationStateKeepSession();
                      if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                      else maybeFinishStop();
                      return;
                  }
          
                  TextBlock b = expectedBlock;
                  if(pendingSpeechBlockRevision >= 0 && b.editRevision != pendingSpeechBlockRevision) {
                      finishSupersededSpeechTranslation(id);
                      return;
                  }
                  String sourceLang = "";
                  String original = b.pendingSourceText == null ? "" : b.pendingSourceText.trim();
                  String translation = "";
                  boolean sourceIsTop = b.sourceTop;
          
                  try {
                      JSONObject structured = new JSONObject(out);
                      sourceLang = structured.optString("source_lang", "");
                      original = structured.optString("clean_source", "");
                      translation = structured.optString("translation", "");
                  } catch(Exception parseError) {
                      retrySpeechBlockOrRender(id);
                      return;
                  }
          
                  String normalizedSource = normalizeAiSourceLangCode(sourceLang);
                  String topCode = code(topLang).toUpperCase(Locale.ROOT);
                  String bottomCode = code(bottomLang).toUpperCase(Locale.ROOT);
                  if(!normalizedSource.equals(topCode) && !normalizedSource.equals(bottomCode)) {
                      retrySpeechBlockOrRender(id);
                      return;
                  }
          
                  original = restoreGlossaryTerms(original, pendingSpeechGlossaryProtection);
                  translation = restoreGlossaryTerms(translation, pendingSpeechGlossaryProtection);
                  original = cleanTranscriptForSelectedPair(original);
                  translation = cleanTranscriptForSelectedPair(cleanOneBlockTranslation(translation));
          
                  if(looksLikeInternalLeak(original) || looksLikeInternalLeak(translation) || original.length() == 0 || translation.length() == 0) {
                      retrySpeechBlockOrRender(id);
                      return;
                  }
          
                  // V40.25: a schema csak a source_lang mező értékkészletét tudta lezárni; a szöveg tényleges
                  // nyelvét eddig senki nem ellenőrizte. Csak erős helyi bizonyíték esetén avatkozunk be,
                  // ezért rövid válaszokat és neveket nem dobunk el.
                  String originalThird = strongThirdLanguageCode(original);
                  if(originalThird.length() > 0) {
                      android.util.Log.w(LOG_TAG, "Rejected strong third-language clean_source: " + originalThird);
                      retrySpeechBlockOrRender(id);
                      return;
                  }
                  String originalStrong = strongLanguageCode(original);
                  if(originalStrong.equalsIgnoreCase(code(topLang))) normalizedSource = topCode;
                  else if(originalStrong.equalsIgnoreCase(code(bottomLang))) normalizedSource = bottomCode;
          
                  sourceIsTop = normalizedSource.equals(topCode);
                  String targetCode = sourceIsTop ? bottomCode : topCode;
                  String translationThird = strongThirdLanguageCode(translation);
                  if(translationThird.length() > 0) {
                      android.util.Log.w(LOG_TAG, "Rejected strong third-language translation: " + translationThird);
                      retrySpeechBlockOrRender(id);
                      return;
                  }
                  String translationStrong = strongLanguageCode(translation);
                  if(translationStrong.length() > 0) {
                      String strongUpper = translationStrong.toUpperCase(Locale.ROOT);
                      if(!strongUpper.equals(targetCode)) {
                          android.util.Log.w(LOG_TAG, "Rejected translation in wrong selected language: expected=" + targetCode + ", got=" + strongUpper);
                          retrySpeechBlockOrRender(id);
                          return;
                      }
                  }
          
                  String rawStrong = selectedPairLanguageCode(b.pendingSourceText);
                  if(rawStrong.length() > 0 && originalStrong.length() > 0 && !rawStrong.equalsIgnoreCase(originalStrong)) {
                      android.util.Log.w(LOG_TAG, "Rejected source language flip between STT and clean_source: raw=" + rawStrong + ", clean=" + originalStrong);
                      retrySpeechBlockOrRender(id);
                      return;
                  }
          
                  String no = normalizeSpeechBlockHash(original);
                  String nt = normalizeSpeechBlockHash(translation);
                  if(no.length() >= 12 && no.equals(nt)) {
                      retrySpeechBlockOrRender(id);
                      return;
                  }
          
                  b.sourceTop = sourceIsTop;
                  b.pendingSourceText = "";
                  b.topText = "";
                  b.bottomText = "";
                  if(sourceIsTop) {
                      b.topText = original;
                      b.bottomText = translation;
                      speakText = translation;
                      speakLang = bottomLang;
                  } else {
                      b.bottomText = original;
                      b.topText = translation;
                      speakText = translation;
                      speakLang = topLang;
                  }
                  b.translatedOk = true;
                  b.retryCount = 0;
                  lastSureSpeechOriginal = original;
                  lastSureSpeechTranslation = translation;
                  setDetectedSourceSide(sourceIsTop);
                  renderBlocksKeepView();
                  if(speakText != null && speakLang != null) markFinalTranslationReadyAndSpeak(b, speakText, speakLang);
          
                  pendingSpeechBlockId = -1;
                  pendingSpeechBlockRevision = -1;
                  pendingSpeechBlockRef = null;
                  pendingSpeechGlossaryProtection = GlossaryProtection.empty();
                  speechTranslateMode = false;
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else maybeFinishStop();
              }
          
              void applyManualTranslationResult(String out, GlossaryProtection protection, boolean sourceTop, String sourceSnapshot) {
                  try {
                      GlossaryProtection safeProtection = protection == null ? GlossaryProtection.empty() : protection;
                      JSONObject structured = new JSONObject(out);
                      String tr = normalizeSentenceLineLayout(restoreGlossaryTerms(structured.optString("translation", ""), safeProtection));
                      if(tr.length() == 0) throw new Exception("empty manual translation");
          
                      // V40.30: egy hosszú, többmondatos forrást egy feltűnően rövid, részleges
                      // modellválasz sem írhat felül a célablakban. Ilyenkor inkább megőrizzük
                      // a korábbi célszöveget és hibát jelzünk.
                      String sourceForLengthCheck = stripDisplayBlockNumbers(sourceSnapshot == null ? "" : sourceSnapshot)
                          .replaceAll("\\s+", "");
                      String translationForLengthCheck = tr.replaceAll("\\s+", "");
                      if(sourceForLengthCheck.length() >= 80 && translationForLengthCheck.length() * 5 < sourceForLengthCheck.length())
                          throw new Exception("suspiciously incomplete manual translation");
          
                      EditText source = sourceTop ? topBox : bottomBox;
                      EditText target = sourceTop ? bottomBox : topBox;
                      String currentSource = source == null ? "" : source.getText().toString();
                      if(sourceSnapshot == null || !currentSource.equals(sourceSnapshot)) {
                          pendingManualGlossaryProtection = GlossaryProtection.empty();
                          Toast.makeText(this, "A forrásszöveg közben megváltozott; a régi fordítást nem írtam be.", Toast.LENGTH_LONG).show();
                          return;
                      }
          
                      // Csak a célablak változhat. A kézzel javított forrásablak byte-for-byte
                      // ugyanaz marad, ezért egy hibás/rövid modellválasz sem tudja törölni a munkát.
                      programmaticChange = true;
                      try {
                          target.setText(tr);
                          target.setSelection(target.getText().length());
                          source.setSelection(Math.min(source.getSelectionStart() < 0 ? source.length() : source.getSelectionStart(), source.length()));
                      } finally {
                          programmaticChange = false;
                      }
                      pendingManualGlossaryProtection = GlossaryProtection.empty();
                      rebuildBlocksFromCurrentBoxes(sourceTop);
                      speakManualOnce(tr, sourceTop ? bottomLang : topLang);
                  } catch(Exception e) {
                      pendingManualGlossaryProtection = GlossaryProtection.empty();
                      Toast.makeText(this, "Kézi fordítás válasz hiba.", Toast.LENGTH_LONG).show();
                  }
              }
              void rebuildBlocksFromCurrentBoxes() {
                  rebuildBlocksFromCurrentBoxes(manualTopSource);
              }
          
              void rebuildBlocksFromCurrentBoxes(boolean sourceTop) {
                  TextBlock b = new TextBlock();
                  // V40.30: a kézi ablakok pontos tartalmát őrizzük meg. Az ürességvizsgálat
                  // továbbra is trim()-mel történik, de a modell újraépítése nem vághat le
                  // kézzel beírt sortörést vagy szóközt a forrás elejéről/végéről.
                  b.topText = topBox == null ? "" : topBox.getText().toString();
                  b.bottomText = bottomBox == null ? "" : bottomBox.getText().toString();
                  b.sourceTop = sourceTop;
                  b.pendingSourceText = "";
                  b.translatedOk = b.topText.length() > 0 && b.bottomText.length() > 0;
                  b.retryCount = 0;
                  textBlocks.clear();
                  if(b.topText.length() > 0 || b.bottomText.length() > 0) textBlocks.add(b);
                  renderBlocks(true);
              }
          
              String cleanOneBlockTranslation(String out) {
                  if(out == null) return "";
                  String s = out.trim();
                  if(s.startsWith("```")) s = s.replace("```", "").trim();
          
                  String upper = s.toUpperCase(Locale.ROOT);
                  int trPos = upper.lastIndexOf("TRANSLATION:");
                  if(trPos >= 0) {
                      s = s.substring(trPos + "TRANSLATION:".length()).trim();
                  }
                  if(s.toUpperCase(Locale.ROOT).startsWith("FORDÍTÁS:")) s = s.substring("FORDÍTÁS:".length()).trim();
          
                  // Biztonsági tisztítás: ha a modell mégis címkéket adott vissza,
                  // ne írjuk be őket a fordítási ablakba.
                  StringBuilder clean = new StringBuilder();
                  String[] lines = s.split("\n");
                  for(String line: lines) {
                      String t = line.trim();
                      String u = t.toUpperCase(Locale.ROOT);
                      if(u.startsWith("SOURCE_LANG:") || u.startsWith("TARGET_LANG:") ||
                         u.startsWith("ORIGINAL:") || u.equals("TEXT:") || u.startsWith("TEXT:")) {
                          continue;
                      }
                      if(clean.length() > 0) clean.append("\n");
                      clean.append(line);
                  }
                  return cleanTranscriptForSelectedPair(clean.toString().trim());
              }
          
