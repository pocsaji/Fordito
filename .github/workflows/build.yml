              void resetBluetoothAudio() {
                  if(finalizingStop) return;
                  boolean wasStreaming = streaming;
                  if(wasStreaming) stop(false);
                  try { if(tts != null) tts.stop(); } catch(Exception e) { android.util.Log.w(LOG_TAG, "TTS stop during Bluetooth reset failed", e); }
                  clearSpeakState();
          
                  boolean oldReconfiguring = interpreterRouteReconfiguring;
                  interpreterRouteReconfiguring = true;
                  try {
                      clearForcedCommunicationRoute();
                      preferredInterpreterInputDevice = null;
                                  activeInterpreterRoute = "off";
                      activeCommunicationDeviceLabel = "";
                      applyTtsAudioAttributes();
                  } finally {
                      interpreterRouteReconfiguring = oldReconfiguring;
                  }
          
                  state.setText("Bluetooth hang reset");
                  setInputRouteHeader("BEMENET: reset…");
                  refreshInterpreterFloatingButton();
                  refreshOpenInterpreterMenuButton();
                  updateButtons();
                  Toast.makeText(this, "Bluetooth audioút elengedve, újranyitás folyamatban.", Toast.LENGTH_SHORT).show();
          
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(interpreterMode) configureInterpreterAudioRoute(false);
                      else restoreNormalAudioRoute();
                      if(wasStreaming) start(true);
                      else {
                          state.setText("készenlét");
                          setInputRouteHeader("BEMENET: —");
                          updateButtons();
                      }
                  }, 700L);
              }
          
