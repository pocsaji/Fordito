              Object buildVadByReflection(String mode) throws Exception {
                  if("silero_off".equals(mode) || "silero".equals(mode) || "silero_medium".equals(mode) || "silero_truck".equals(mode)) {
                      Class<?> vadClass = Class.forName("com.konovalov.vad.silero.Vad");
                      Object b = vadClass.getMethod("builder").invoke(null);
                      b.getClass().getMethod("setContext", android.content.Context.class).invoke(b, this);
                      b.getClass().getMethod("setSampleRate", Class.forName("com.konovalov.vad.silero.config.SampleRate")).invoke(b, enumConst("com.konovalov.vad.silero.config.SampleRate", "SAMPLE_RATE_16K"));
                      b.getClass().getMethod("setFrameSize", Class.forName("com.konovalov.vad.silero.config.FrameSize")).invoke(b, enumConst("com.konovalov.vad.silero.config.FrameSize", "FRAME_SIZE_512"));
                      String sileroModeName = "silero_off".equals(mode) ? "OFF"
                          : ("silero".equals(mode) ? "NORMAL"
                          : ("silero_medium".equals(mode) ? "AGGRESSIVE" : "VERY_AGGRESSIVE"));
                      b.getClass().getMethod("setMode", Class.forName("com.konovalov.vad.silero.config.Mode")).invoke(b, enumConst("com.konovalov.vad.silero.config.Mode", sileroModeName));
                      b.getClass().getMethod("setSilenceDurationMs", int.class).invoke(b, VAD_SPEECH_END_SILENCE_MS);
                      b.getClass().getMethod("setSpeechDurationMs", int.class).invoke(b, VAD_SPEECH_START_MS);
                      return b.getClass().getMethod("build").invoke(b);
                  }
                  return null;
              }
          
              void ensureExternalVadReady() throws Exception {
                  if(!"silero_off".equals(vadEngineMode) && !"silero".equals(vadEngineMode) && !"silero_medium".equals(vadEngineMode) && !"silero_truck".equals(vadEngineMode)) {
                      vadEngineMode = "silero";
                  }
                  if(speechVadInstance != null && vadEngineMode.equals(speechVadInstanceMode)) return;
                  closeExternalVad();
                  speechVadInstance = buildVadByReflection(vadEngineMode);
                  speechVadInstanceMode = vadEngineMode;
                  if(speechVadInstance == null) throw new IllegalStateException("Silero VAD builder returned null: " + vadEngineMode);
              }
          
              boolean invokeVadOnExactFrame(byte[] frame) throws Exception {
                  if(speechVadInstance == null) throw new IllegalStateException("Silero VAD instance is null");
                  try {
                      Object r = speechVadInstance.getClass().getMethod("isSpeech", byte[].class).invoke(speechVadInstance, (Object)frame);
                      return Boolean.TRUE.equals(r);
                  } catch(NoSuchMethodException nsme) {
                      short[] sf = new short[frame.length / 2];
                      for(int i=0;i<sf.length;i++) {
                          int lo = frame[i*2] & 0xff;
                          int hi = frame[i*2+1];
                          sf[i] = (short)((hi << 8) | lo);
                      }
                      Object r = speechVadInstance.getClass().getMethod("isSpeech", short[].class).invoke(speechVadInstance, (Object)sf);
                      return Boolean.TRUE.equals(r);
                  }
              }
          
              boolean externalVadOverGate(byte[] exactFrame) throws Exception {
                  ensureExternalVadReady();
                  return invokeVadOnExactFrame(exactFrame);
              }
          
              void processVadFrame(byte[] vad16kFrame, byte[] stt24kFrame) throws Exception {
                  if(vad16kFrame == null || vad16kFrame.length != SILERO_FRAME_BYTES) return;
                  if(stt24kFrame == null || stt24kFrame.length != STT_FRAME_BYTES) return;
                  if(shouldMuteMicForSpeakerTts()) {
                      voiceSendActive = false;
                      clearPendingSpeechAudio();
                      clearPreRollAudio();
                      return;
                  }
          
                  long now = System.currentTimeMillis();
                  boolean overGate = externalVadOverGate(vad16kFrame);
                  if(overGate) {
                      if(!voiceSendActive) {
                          // A Silero nyitása előtt/fel-felvillanásakor felvett 24 kHz-es hang
                          // külön előpufferben marad. A pozitív kereteket csak a megerősítésig
                          // tartjuk pendingben, majd az előpuffer UTÁN, eredeti sorrendben küldjük.
                          rememberPendingSpeechAudio(stt24kFrame, stt24kFrame.length);
                          if(pendingSpeechAudioDurationMs() < VAD_START_CONFIRM_AUDIO_MS) return;
                          if(firstSpeechHeardAt == 0L) firstSpeechHeardAt = now;
                          for(byte[] pr : takePreRollAudio()) sendAudioChunk(pr);
                          for(byte[] ps : takePendingSpeechAudio()) sendAudioChunk(ps);
                      } else {
                          sendAudioChunk(stt24kFrame);
                      }
                      voiceSendActive = true;
                      return;
                  }
          
                  if(voiceSendActive) {
                      voiceSendActive = false;
                      flushSpeechAudioWindow(true);
                  } else if(pendingSpeechAudioDurationMs() > 0) {
                      // V40.20 HIBAJAVÍTÁS: korábban egy rövid VAD-visszaesés az összes
                      // addigi beszédkezdet-keretet törölte. Emiatt az első szó eleje vagy akár
                      // az egész rövid első szó elveszhetett. Most a sikertelenül megerősített
                      // keretek visszakerülnek a gördülő előpufferbe, tehát semmi nem vész el.
                      for(byte[] ps : takePendingSpeechAudio()) rememberPreRollAudio(ps, ps.length);
                  }
                  clearPendingSpeechAudio();
                  rememberPreRollAudio(stt24kFrame, stt24kFrame.length);
              }
          
              short readPcm16Le(byte[] data, int byteOffset) {
                  return (short)(((data[byteOffset + 1] & 0xff) << 8) | (data[byteOffset] & 0xff));
              }
          
              void writePcm16Le(byte[] data, int byteOffset, short sample) {
                  data[byteOffset] = (byte)(sample & 0xff);
                  data[byteOffset + 1] = (byte)((sample >> 8) & 0xff);
              }
          
              short clampToPcm16(int sample) {
                  if(sample > Short.MAX_VALUE) return Short.MAX_VALUE;
                  if(sample < Short.MIN_VALUE) return Short.MIN_VALUE;
                  return (short)sample;
              }
          
              byte[] decimate48kPcm16Le(byte[] pcm48k, int factor, float[] taps, short[] history) {
                  if(pcm48k == null || pcm48k.length < 2) return new byte[0];
                  int inputSamples = pcm48k.length / 2;
                  int historyLen = history.length;
                  short[] work = new short[historyLen + inputSamples];
                  System.arraycopy(history, 0, work, 0, historyLen);
                  for(int i=0; i<inputSamples; i++) work[historyLen + i] = readPcm16Le(pcm48k, i * 2);
                  int outputSamples = inputSamples / factor;
                  byte[] out = new byte[outputSamples * 2];
                  for(int i=0; i<outputSamples; i++) {
                      int n = historyLen + (i * factor);
                      float acc = 0f;
                      for(int k=0; k<taps.length; k++) acc += taps[k] * work[n - k];
                      writePcm16Le(out, i * 2, clampToPcm16(Math.round(acc)));
                  }
                  System.arraycopy(work, work.length - historyLen, history, 0, historyLen);
                  return out;
              }
          
              byte[] downsample48kTo16kDirect(byte[] pcm48k) {
                  return decimate48kPcm16Le(pcm48k, 3, DECIMATE_48K_TO_16K_TAPS, decimate48To16History);
              }
          
              byte[] downsample48kTo24kDirect(byte[] pcm48k) {
                  return decimate48kPcm16Le(pcm48k, 2, DECIMATE_48K_TO_24K_TAPS, decimate48To24History);
              }
          
              void processCapturedAudio(byte[] data, int len) throws Exception {
                  if(data == null || len <= 0) return;
                  ArrayList<byte[]> captureFrames48k = new ArrayList<>();
                  synchronized(capturedFrameLock) {
                      capturedFrameBuffer.write(data, 0, len);
                      byte[] all = capturedFrameBuffer.toByteArray();
                      int pos = 0;
                      while(pos + CAPTURE_FRAME_BYTES <= all.length) {
                          captureFrames48k.add(Arrays.copyOfRange(all, pos, pos + CAPTURE_FRAME_BYTES));
                          pos += CAPTURE_FRAME_BYTES;
                      }
                      capturedFrameBuffer.reset();
                      if(pos < all.length) capturedFrameBuffer.write(all, pos, all.length - pos);
                  }
                  for(byte[] frame48k : captureFrames48k) {
                      // A két ág ugyanabból az eredeti 48 kHz-es 32 ms-os keretből, egymástól függetlenül készül.
                      byte[] vad16k = downsample48kTo16kDirect(frame48k);
                      byte[] stt24k = downsample48kTo24kDirect(frame48k);
                      processVadFrame(vad16k, stt24k);
                  }
              }
          
              byte[] takeCapturedSttRemainder24k() {
                  byte[] raw48k;
                  synchronized(capturedFrameLock) {
                      raw48k = capturedFrameBuffer.toByteArray();
                      capturedFrameBuffer.reset();
                  }
                  return downsample48kTo24kDirect(raw48k);
              }
          
              void clearSpeechAudioWindow() {
                  synchronized(speechAudioWindowLock) {
                      speechAudioWindow.reset();
                      speechAudioWindowFreshBytes = 0;
                  }
              }
          
              void appendSpeechAudioChunk(byte[] chunk) {
                  if(chunk == null || chunk.length == 0 || client == null) return;
                  byte[] ready = null;
                  synchronized(speechAudioWindowLock) {
                      speechAudioWindow.write(chunk, 0, chunk.length);
                      speechAudioWindowFreshBytes += chunk.length;
          
                      int needBytes = STT_SAMPLE_RATE * 2 * BLOCK_WINDOW_MS / 1000;
                      if(speechAudioWindow.size() >= needBytes) {
                          byte[] all = speechAudioWindow.toByteArray();
                          ready = Arrays.copyOf(all, needBytes);
          
                          int keepBytes = STT_SAMPLE_RATE * 2 * BLOCK_OVERLAP_MS / 1000;
                          int excessBytes = Math.max(0, all.length - needBytes);
          
                          speechAudioWindow.reset();
                          int start = Math.max(0, needBytes - keepBytes);
                          speechAudioWindow.write(all, start, needBytes - start);
                          if(all.length > needBytes) {
                              speechAudioWindow.write(all, needBytes, all.length - needBytes);
                          }
          
                          // V40.26: a megtartott overlap már egyszer elküldött hang.
                          // Csak a 7 másodperces határon túli valódi többlet marad friss.
                          speechAudioWindowFreshBytes = excessBytes;
                      }
                  }
                  if(ready != null) transcribeAudioWindow(ready, false);
              }
          
              void flushSpeechAudioWindow(boolean force) {
                  byte[] ready = null;
                  synchronized(speechAudioWindowLock) {
                      int minFreshBytes = STT_SAMPLE_RATE * 2 *
                          (force ? MIN_TRUE_SPEECH_AUDIO_MS : 1200) / 1000;
          
                      if(speechAudioWindowFreshBytes >= minFreshBytes &&
                         speechAudioWindow.size() > 0) {
                          ready = speechAudioWindow.toByteArray();
                          speechAudioWindow.reset();
                          speechAudioWindowFreshBytes = 0;
                      } else if(force) {
                          // V40.26: overlap-only vagy 160 ms-nál rövidebb új hang
                          // nem lehet külön STT-kérés.
                          speechAudioWindow.reset();
                          speechAudioWindowFreshBytes = 0;
                      }
                  }
                  if(ready != null) transcribeAudioWindow(ready, true);
              }
          
              byte[] wavFromPcm24k(byte[] pcm) throws Exception {
                  int dataLen = pcm == null ? 0 : pcm.length;
                  ByteArrayOutputStream out = new ByteArrayOutputStream(44 + dataLen);
                  writeAscii(out, "RIFF"); writeIntLE(out, 36 + dataLen); writeAscii(out, "WAVE");
                  writeAscii(out, "fmt "); writeIntLE(out, 16); writeShortLE(out, 1); writeShortLE(out, 1);
                  writeIntLE(out, STT_SAMPLE_RATE); writeIntLE(out, STT_SAMPLE_RATE * 2); writeShortLE(out, 2); writeShortLE(out, 16);
                  writeAscii(out, "data"); writeIntLE(out, dataLen);
                  if(pcm != null) out.write(pcm);
                  return out.toByteArray();
              }
          
              void writeAscii(ByteArrayOutputStream out, String v) throws Exception { out.write(v.getBytes("US-ASCII")); }
              void writeIntLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); out.write((v >> 16) & 255); out.write((v >> 24) & 255); }
              void writeShortLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); }
          
              synchronized int[] allocateSttRequestOrder() {
                  if(!streaming && !finalizingStop) return null;
                  sttRequestsInFlight++;
                  return new int[]{sttSessionId, ++sttRequestSeq};
              }
          
              void completeSttRequest(int session, int seq, String transcript, boolean finalFlush, String error) {
                  if(session != sttSessionId) return;
                  sttRequestsInFlight = Math.max(0, sttRequestsInFlight - 1);
                  pendingSttResults.put(seq, new SttResult(transcript, finalFlush, error));
                  while(true) {
                      SttResult ready = pendingSttResults.remove(sttDeliverSeq);
                      if(ready == null) break;
                      sttDeliverSeq++;
                      if(ready.transcript.trim().length() > 0) {
                          handleTranscriptCompleted(ready.transcript.trim(), ready.finalFlush);
                      } else if(ready.error.length() > 0) {
                          android.util.Log.e(LOG_TAG, "STT request failed: " + ready.error);
                          state.setText(streaming ? "mikrofon aktív – STT hiba" : "STT hiba – az előző átiratok megmaradtak");
                      }
                  }
                  maybeFinishStop();
              }
          
              synchronized void resetSttOrderingForNewSession() {
                  sttSessionId++;
                  sttRequestSeq = 0;
                  sttDeliverSeq = 1;
                  sttRequestsInFlight = 0;
                  pendingSttResults.clear();
              }
          
              void transcribeAudioWindow(byte[] pcm, boolean finalFlush) {
                  if(pcm == null || pcm.length == 0 || client == null || !hasKey()) return;
                  // Belső, azonnali leállítás után a még futó audio-szál nem indíthat
                  // új STT-kérést. Graceful STOP alatt viszont a maradék még elküldhető.
                  int[] requestOrder = allocateSttRequestOrder();
                  if(requestOrder == null) return;
                  final int session = requestOrder[0];
                  final int seq = requestOrder[1];
                  try {
                      byte[] wav = wavFromPcm24k(pcm);
                      MultipartBody body = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("model", "gpt-4o-mini-transcribe")
                          .addFormDataPart("response_format", "json")
                          .addFormDataPart("temperature", "0")
                          .addFormDataPart("file", "speech.wav", RequestBody.create(MediaType.parse("audio/wav"), wav))
                          .build();
                      Request req = new Request.Builder().url("https://api.openai.com/v1/audio/transcriptions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .post(body).build();
                      client.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "kapcsolat: " + e.getMessage()));
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "HTTP " + response.code()));
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String tr = obj.optString("text", "").trim();
                                  runOnUiThread(() -> completeSttRequest(session, seq, tr, finalFlush, ""));
                              } catch(Exception e) {
                                  runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "válasz nem értelmezhető"));
                              }
                          }
                      });
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "STT preparation failed", e);
                      runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "előkészítés: " + e.getMessage()));
                  }
              }
          
              void sendAudioChunk(byte[] chunk) throws Exception {
