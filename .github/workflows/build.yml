              AudioRecord createInitializedAudioRecord(int source, int sampleRate, int requestedBufferBytes) {
                  AudioRecord candidate = null;
                  try {
                      int min = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      int safeMin = min > 0 ? min : CAPTURE_FRAME_BYTES * 8;
                      int bufferBytes = Math.max(requestedBufferBytes, Math.max(safeMin, CAPTURE_FRAME_BYTES * 8));
                      AudioFormat format = new AudioFormat.Builder()
                          .setSampleRate(sampleRate)
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                          .build();
                      candidate = new AudioRecord.Builder()
                          .setAudioSource(source)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(bufferBytes)
                          .build();
                      if(candidate.getState() == AudioRecord.STATE_INITIALIZED) {
                          if(candidate.getSampleRate() != sampleRate || candidate.getChannelCount() != 1) {
                              android.util.Log.e(LOG_TAG, "AudioRecord format mismatch: requested=" + sampleRate + " Hz mono, actual=" + candidate.getSampleRate() + " Hz channels=" + candidate.getChannelCount());
                              try { candidate.release(); } catch(Exception ignored) {}
                              return null;
                          }
                          return candidate;
                      }
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Phone microphone AudioRecord creation failed", e);
                  }
                  if(candidate != null) try { candidate.release(); } catch(Exception ignored) {}
                  return null;
              }

              List<AudioDeviceInfo> availableInputDevicesCompat() {
                  ArrayList<AudioDeviceInfo> out = new ArrayList<>();
                  if(audioManager == null || Build.VERSION.SDK_INT < 23) return out;
                  try { out.addAll(Arrays.asList(audioManager.getDevices(AudioManager.GET_DEVICES_INPUTS))); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "Input device query failed", e); }
                  return out;
              }

              AudioDeviceInfo findBuiltInInterpreterMic() {
                  for(AudioDeviceInfo d : availableInputDevicesCompat()) {
                      if(d != null && d.isSource() && d.getType() == AudioDeviceInfo.TYPE_BUILTIN_MIC) return d;
                  }
                  return null;
              }

              AudioRecord makeBestAudioRecord(int sampleRate, int requestedBufferBytes) {
                  activeCaptureSampleRate = CAPTURE_SAMPLE_RATE;
                  activeCaptureChannelCount = 1;
                  preferredInterpreterInputDevice = findBuiltInInterpreterMic();
                  if(preferredInterpreterInputDevice == null) {
                      android.util.Log.e(LOG_TAG, "No built-in phone microphone was reported by AudioManager");
                      return null;
                  }
                  AudioRecord candidate = createInitializedAudioRecord(MediaRecorder.AudioSource.MIC, sampleRate, requestedBufferBytes);
                  if(candidate == null) return null;
                  boolean accepted = false;
                  try { accepted = candidate.setPreferredDevice(preferredInterpreterInputDevice); }
                  catch(Exception e) { android.util.Log.e(LOG_TAG, "Built-in microphone preference failed", e); }
                  if(!accepted) {
                      try { candidate.release(); } catch(Exception ignored) {}
                      android.util.Log.e(LOG_TAG, "Built-in microphone preference was rejected; refusing non-phone input fallback");
                      return null;
                  }
                  return candidate;
              }

