              android.view.WindowManager.LayoutParams floatingParams(int w, int h, int gravity) {
                  int type = Build.VERSION.SDK_INT >= 26 ? android.view.WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : android.view.WindowManager.LayoutParams.TYPE_PHONE;
                  android.view.WindowManager.LayoutParams lp = new android.view.WindowManager.LayoutParams(w, h, type,
                      android.view.WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | android.view.WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
