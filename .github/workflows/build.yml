              List<AudioDeviceInfo> availableOutputDevicesCompat() {
                  ArrayList<AudioDeviceInfo> out = new ArrayList<>();
                  if(audioManager == null || Build.VERSION.SDK_INT < 23) return out;
                  try { out.addAll(Arrays.asList(audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS))); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "Output device query failed", e); }
                  return out;
