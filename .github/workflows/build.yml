          final class SpeechTextProcessor {
              private static final int HISTORY_LIMIT = 80;
              private static final int RECENT_MATCH_LIMIT = 8;
          
              private final HashSet<String> recentHashes = new HashSet<>();
              private final ArrayDeque<String> recentHashOrder = new ArrayDeque<>();
          
              void resetHistory() {
                  recentHashes.clear();
                  recentHashOrder.clear();
