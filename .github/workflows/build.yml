              int findCut(String text, boolean flushAll, long bufferedAgeMs, int maximumBlockAgeMs) {
                  if (text == null || text.trim().isEmpty()) return -1;
          
                  int cut = firstHardSentenceEnd(text);
                  if (cut >= 0) return cut;
          
                  cut = smartLinguisticCut(text);
                  if (cut >= 0) return cut;
          
                  if (bufferedAgeMs >= maximumBlockAgeMs || flushAll) return text.length();
                  return -1;
              }
          
              int firstHardSentenceEnd(String text) {
                  if (text == null) return -1;
                  for (int i = 0; i < text.length(); i++) {
                      char ch = text.charAt(i);
                      if (ch == '.' || ch == '!' || ch == '?' || ch == '…' || ch == '\n') return i + 1;
