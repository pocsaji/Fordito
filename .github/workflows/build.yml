name: Build Android APK V312

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/attila/forditokonzol app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } } }
          rootProject.name = "ForditoKonzol"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.6.1" apply false }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins { id("com.android.application") }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          android {
              namespace = "com.attila.forditokonzol"
              compileSdk = 35
              defaultConfig { applicationId = "hu.pocsaji.fordito"; minSdk = 26; targetSdk = 35; versionCode = 312; versionName = "31.2" }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
              implementation("com.github.gkonovalov.android-vad:webrtc:2.0.10")
              implementation("com.github.gkonovalov.android-vad:silero:2.0.10")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <application android:allowBackup="false" android:label="Fordito_V312" android:supportsRtl="true" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VoiceForegroundService"
                      android:exported="false"
                      android:foregroundServiceType="microphone|mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/attila/forditokonzol/VoiceForegroundService.java <<'EOF'
          package com.attila.forditokonzol;

          import android.app.*;
          import android.content.*;
          import android.os.*;

          public class VoiceForegroundService extends Service {
              static final String CHANNEL_ID = "fordito_voice_background";
              static final int NOTIFICATION_ID = 1101;

              @Override public void onCreate() {
                  super.onCreate();
                  createChannel();
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  startForeground(NOTIFICATION_ID, notification());
                  return START_STICKY;
              }

              Notification notification() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                    ? new Notification.Builder(this, CHANNEL_ID)
                    : new Notification.Builder(this);

                  return b
                    .setContentTitle("Fordító aktív")
                    .setContentText("Háttér / lezárt kijelző engedélyezve – mikrofon használatban")
                    .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                    .setContentIntent(pi)
                    .setOngoing(true)
                    .setCategory(Notification.CATEGORY_SERVICE)
                    .build();
              }

              void createChannel() {
                  if(Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Fordító háttér mód", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("Értesítés, amikor a fordító lezárt kijelzőnél is aktív.");
                      NotificationManager nm = (NotificationManager)getSystemService(NOTIFICATION_SERVICE);
                      if(nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

