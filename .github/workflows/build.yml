              boolean isExplicitSupportedLanguage(String value) {
                  if(value == null || value.trim().length() == 0) return false;
                  for(String[] row : langs) {
                      if(row.length >= 3 && row[2] != null && row[2].length() > 0 && row[2].equalsIgnoreCase(value)) return true;
                  }
                  return false;
              }
              void chooseLang(boolean top) {
                  if(finalizingStop) return;
                  String current = top ? topLang : bottomLang;
                  String other = top ? bottomLang : topLang;
                  ArrayList<Integer> choiceIndexes = new ArrayList<>();
                  ArrayList<CharSequence> choiceLabels = new ArrayList<>();
                  for(int i=0;i<langs.length;i++) {
                      String value = langs[i][2];
                      if(value == null || value.length() == 0) continue;
                      if(value.equalsIgnoreCase(other)) continue;
                      choiceIndexes.add(i);
                      choiceLabels.add(menuItem(langs[i][0], langs[i][1] + (value.equalsIgnoreCase(current) ? " • kiválasztva" : ""), value.equalsIgnoreCase(current)));
                  }
                  showCenteredMenu(top ? "Felső nyelv" : "Alsó nyelv", choiceLabels.toArray(new CharSequence[0]), (d,w) -> {
                      if(w < 0 || w >= choiceIndexes.size()) return;
                      int langIndex = choiceIndexes.get(w);
                      String selected = langs[langIndex][2];
                      if(selected.equalsIgnoreCase(current)) return;
                      boolean wasStreaming = streaming;
                      if(wasStreaming) stop(false);
                      invalidateManualWindowRequests();
                      if(top) topLang = selected;
                      else bottomLang = selected;
                      topBox.clearFocus();
                      bottomBox.clearFocus();
                      save();
                      updateButtons();
                      if(wasStreaming && hasKey()) new Handler(Looper.getMainLooper()).postDelayed(() -> start(true), 500L);
                  });
              }
          
              void restartIfNeeded() {
                  if(streaming) {
                      stop(false);
                      resetAudioModeState();
                      new Handler().postDelayed(() -> start(true), 700);
                  }
              }
          
