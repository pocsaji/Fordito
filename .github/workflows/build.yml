              CharSequence menuItem(String title, String subtitle, boolean selected) {
                  String main = title == null ? "" : title;
                  String sub = subtitle == null ? "" : subtitle;
                  if(selected && sub.length() == 0) sub = "kiválasztva";
                  String full = sub.length() == 0 ? main : main + "\n" + sub;
                  SpannableString spn = new SpannableString(full);
                  spn.setSpan(new AlignmentSpan.Standard(Layout.Alignment.ALIGN_CENTER), 0, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  spn.setSpan(new RelativeSizeSpan(1.0f), 0, main.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  if(sub.length() > 0) {
                      int st = main.length() + 1;
                      spn.setSpan(new RelativeSizeSpan(0.72f), st, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      spn.setSpan(new ForegroundColorSpan(Color.LTGRAY), st, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  }
                  return spn;
              }

              void showCenteredMenu(String title, CharSequence[] items, DialogInterface.OnClickListener listener) {
                  new AlertDialog.Builder(this).setTitle(title).setItems(items, listener).show();
              }

              void showApi() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  int pad = (int)(12 * getResources().getDisplayMetrics().density + 0.5f);
                  box.setPadding(pad, pad, pad, pad);

                  TextView note = label(
                      "EN: This is not a login, registration, account creation, membership or subscription screen. " +
                      "The app does not request, collect or store usernames, passwords, PINs, OTPs or user login credentials. " +
                      "The OpenAI API key is only a local technical setting used to access the translation service with the user's own API access. " +
                      "Fordito does not operate a user-account system and does not restrict app access by login.\n\n" +
                      "HU: Ez nem bejelentkezés, nem regisztráció, nem fióklétrehozás, nem tagság és nem előfizetés. " +
                      "Az alkalmazás nem kér, nem gyűjt és nem tárol felhasználónevet, jelszót, PIN-kódot, OTP-t vagy bejelentkezési adatot. " +
                      "Az OpenAI API-kulcs kizárólag helyi technikai beállítás a fordítási szolgáltatás eléréséhez, a felhasználó saját API-hozzáférésével. " +
                      "A Fordito nem működtet felhasználói fiókrendszert, és nem korlátozza az app elérését bejelentkezéssel."
                  );
                  note.setTextSize(11);
                  note.setTextColor(Color.rgb(255, 210, 80));
                  note.setGravity(Gravity.START);
                  note.setLineSpacing(0f, 1.05f);
                  box.addView(note, new LinearLayout.LayoutParams(-1, -2));

                  EditText input = new EditText(this);
                  input.setSingleLine(true);
                  input.setText(apiKey == null ? "" : apiKey);
                  input.setHint("sk-...");
                  input.setSelectAllOnFocus(true);
                  input.setTextSize(14);
                  input.setPadding(8, 8, 8, 8);
                  box.addView(input, new LinearLayout.LayoutParams(-1, -2));

                  Button modelButton = new Button(this);
                  modelButton.setAllCaps(false);
                  modelButton.setText("API modell\n" + modelLabel());
                  modelButton.setOnClickListener(v -> {
                      chooseFrom("API modell", models, model, selected -> {
                          model = selected;
                          save();
                          modelButton.setText("API modell\n" + modelLabel());
                          restartIfNeeded();
                      });
                  });
                  box.addView(modelButton, new LinearLayout.LayoutParams(-1, -2));

                  android.widget.ScrollView scroll = new android.widget.ScrollView(this);
                  scroll.addView(box);

                  AlertDialog dlg = new AlertDialog.Builder(this)
                    .setTitle("OpenAI API kulcs és modell")
                    .setView(scroll)
                    .setPositiveButton("Mentés", (d,w) -> { apiKey = input.getText().toString().trim(); save(); updateButtons(); })
                    .setNeutralButton("Kulcs törlése", null)
                    .setNegativeButton("Mégse", null)
                    .create();
                  dlg.setOnShowListener(di -> {
                      input.requestFocus();
                      input.selectAll();
                      android.view.Window w = dlg.getWindow();
                      if(w != null) w.setLayout((int)(getResources().getDisplayMetrics().widthPixels * 0.96f), -2);
                      dlg.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(v -> {
                          input.setText("");
                          apiKey = "";
                          save();
                          updateButtons();
                          Toast.makeText(this, "API kulcs törölve.", Toast.LENGTH_SHORT).show();
                      });
                  });
                  dlg.show();
              }

              void chooseModel() { chooseFrom("AI modell", models, model, v -> { model = v; save(); restartIfNeeded(); }); }
              void chooseProfile() { chooseFrom("Beszélgetési profil", profiles, profile, v -> { profile = v; save();  }); }
              void chooseMode() { chooseFrom("Tolmácsolás módja", modes, mode, v -> { mode = v; save();  }); }

              void resetCoreSettings() {
                  new AlertDialog.Builder(this)
                    .setTitle("Alapbeállítások")
                    .setMessage("Visszaállítsam az ajánlott fordítási és beszédfelismerési alapértékeket? Az API kulcs és a nyelvpár nem törlődik.")
                    .setPositiveButton("Igen", (d,w) -> {
                        model = "gpt-4o-mini";
                        profile = "general";
                          mode = "natural";
                        interpreterMode = false;
                        interpreterAudioMode = "off";
                        ttsMuteUntilMs = 0L;
                        mirrorBottomMode = false;
                        save();
                        
                        applyDisplayMode();
                        Toast.makeText(this, "Alapbeállítások visszaállítva.", Toast.LENGTH_SHORT).show();
                        updateButtons();
                    })
                    .setNegativeButton("Mégse", null)
