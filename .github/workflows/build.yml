name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/attila/forditokonzol app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ForditoKonzol"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.6.1" apply false }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins { id("com.android.application") }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          android {
              namespace = "com.attila.forditokonzol"
              compileSdk = 35
              defaultConfig { applicationId = "hu.pocsaji.fordito"; minSdk = 26; targetSdk = 35; versionCode = 20; versionName = "2.0" }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:label="Fordító Konzol" android:supportsRtl="true" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/attila/forditokonzol/MainActivity.java <<'EOF'
          package com.attila.forditokonzol;

          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.*;
          import android.os.*;
          import android.text.*;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.*;
          import org.json.*;
          import java.util.*;
          import java.util.concurrent.*;
          import okhttp3.*;

          public class MainActivity extends Activity {
              TextView state;
              EditText topBox, bottomBox;
              Button micBtn, translateBtn, menuBtn, topLangBtn, bottomLangBtn;
              SharedPreferences sp;
              OkHttpClient client;
              WebSocket ws;
              AudioRecord rec;
              ExecutorService audioExec = Executors.newSingleThreadExecutor();

              boolean connected = false;
              boolean streaming = false;
              boolean topActive = true;
              boolean manualTopSource = true;
              boolean responseInProgress = false;
              long sessionStart = 0L;
              String pendingOutput = "";
              String pendingManualText = "";
              boolean manualResponseMode = false;
              boolean programmaticChange = false;
              int topManualStart = -1;
              int bottomManualStart = -1;

              String apiKey = "";
              String model = "gpt-realtime-2";
              String profile = "truck_bulk";
              String mode = "natural";
              String vadMode = "medium";
              String topLang = "hu";
              String bottomLang = "fr";

              final String[][] langs = {
                  {"Automatikus","AUTO",""},
                  {"Magyar","HU","hu"},
                  {"Francia","FR","fr"},
                  {"Angol","EN","en"},
                  {"Német","DE","de"},
                  {"Olasz","IT","it"},
                  {"Spanyol","ES","es"},
                  {"Román","RO","ro"},
                  {"Horvát","HR","hr"},
                  {"Szlovák","SK","sk"},
                  {"Szlovén","SL","sl"}
              };

              final String[][] models = {
                  {"Ajánlott: GPT-Realtime-2","gpt-realtime-2"},
                  {"Fordításra: GPT-Realtime-Translate","gpt-realtime-translate"}
              };

              final String[][] profiles = {
                  {"Általános beszélgetés","general"},
                  {"Turizmus / utazás","tourism"},
                  {"Étterem","restaurant"},
                  {"Szállás","hotel"},
                  {"Kamion – általános","truck_general"},
                  {"Kamion – ponyvás","truck_tarp"},
                  {"Kamion – ömlesztett áru","truck_bulk"},
                  {"Kamion – tartány","truck_tank"},
                  {"Logisztika / rakodás","logistics"},
                  {"Vám / határ","customs"},
                  {"Orvos","medical"},
                  {"Gyógyszertár","pharmacy"},
                  {"Bank","bank"},
                  {"Hivatal","office"},
                  {"Rendőrség","police"},
                  {"Autószerviz / gépjavítás","service"}
              };

              final String[][] modes = {
                  {"Pontos","precise"},
                  {"Természetes","natural"},
                  {"Tolmács","interpreter"}
              };

              final String[][] vadModes = {
                  {"Gyors","low"},
                  {"Normál","medium"},
                  {"Türelmes","high"},
                  {"Automatikus","auto"}
              };

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("settings", MODE_PRIVATE);
                  load();
                  ui();
                  reqMic();
              }

              void load() {
                  apiKey = sp.getString("apiKey", "");
                  model = sp.getString("model", "gpt-realtime-2");
                  profile = sp.getString("profile", "truck_bulk");
                  mode = sp.getString("mode", "natural");
                  vadMode = sp.getString("vadMode", "medium");
                  topLang = sp.getString("topLang", "hu");
                  bottomLang = sp.getString("bottomLang", "fr");
                  if("normal".equals(vadMode)) vadMode = "medium";
              }

              void save() {
                  sp.edit()
                    .putString("apiKey", apiKey)
                    .putString("model", model)
                    .putString("profile", profile)
                    .putString("mode", mode)
                    .putString("vadMode", vadMode)
                    .putString("topLang", topLang)
                    .putString("bottomLang", bottomLang)
                    .apply();
              }

              void ui() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(8,62,8,170);
                  root.setBackgroundColor(Color.rgb(16,19,24));
                  setContentView(root);

                  LinearLayout bar = row();
                  TextView title = label("Fordító Konzol v2.0");
                  state = label("készenlét");
                  state.setGravity(Gravity.RIGHT);
                  bar.addView(title, new LinearLayout.LayoutParams(0,42,1));
                  bar.addView(state, new LinearLayout.LayoutParams(0,42,1));
                  root.addView(bar);

                  LinearLayout langRow = row();
                  topLangBtn = btn("FELSŐ");
                  bottomLangBtn = btn("ALSÓ");
                  langRow.addView(topLangBtn, new LinearLayout.LayoutParams(0,64,1));
                  langRow.addView(bottomLangBtn, new LinearLayout.LayoutParams(0,64,1));
                  root.addView(langRow);

                  topBox = box("FELSŐ ABLAK — átirat / fordítás / kézi bevitel");
                  bottomBox = box("ALSÓ ABLAK — átirat / fordítás / kézi bevitel");
                  root.addView(topBox, new LinearLayout.LayoutParams(-1,0,1));
                  root.addView(bottomBox, new LinearLayout.LayoutParams(-1,0,1));

                  LinearLayout controls = row();
                  micBtn = btn("MIKROFON");
                  translateBtn = btn("FORDÍT");
                  menuBtn = btn("MENÜ");
                  controls.addView(micBtn, new LinearLayout.LayoutParams(0,58,1));
                  controls.addView(translateBtn, new LinearLayout.LayoutParams(0,58,1));
                  controls.addView(menuBtn, new LinearLayout.LayoutParams(0,58,1));
                  root.addView(controls);

                  topBox.setOnClickListener(v -> { manualTopSource = true; updateButtons(); });
                  bottomBox.setOnClickListener(v -> { manualTopSource = false; updateButtons(); });
                  topBox.addTextChangedListener(manualWatcher(true));
                  bottomBox.addTextChangedListener(manualWatcher(false));
                  topLangBtn.setOnClickListener(v -> chooseLang(true));
                  bottomLangBtn.setOnClickListener(v -> chooseLang(false));
                  topLangBtn.setOnLongClickListener(v -> { copyBox(topBox, "Felső ablak másolva"); return true; });
                  bottomLangBtn.setOnLongClickListener(v -> { copyBox(bottomBox, "Alsó ablak másolva"); return true; });
                  micBtn.setOnClickListener(v -> { if(streaming) stop(); else start(true); });
                  translateBtn.setOnClickListener(v -> manualTranslate());
                  menuBtn.setOnClickListener(v -> menu());
                  menuBtn.setOnLongClickListener(v -> { clearBothBoxes(); return true; });

                  updateButtons();
              }

              LinearLayout row() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  return l;
              }

              TextView label(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.LTGRAY);
                  t.setTextSize(12);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setTextSize(14);
                  b.setSingleLine(true);
                  b.setPadding(4,2,4,2);
                  return b;
              }

              EditText box(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(Color.GRAY);
                  e.setTextColor(Color.WHITE);
                  e.setTextSize(14);
                  e.setGravity(Gravity.TOP|Gravity.START);
                  e.setSingleLine(false);
                  e.setMinLines(5);
                  e.setVerticalScrollBarEnabled(true);
                  e.setHorizontalScrollBarEnabled(false);
                  e.setScrollbarFadingEnabled(false);
                  e.setOverScrollMode(EditText.OVER_SCROLL_ALWAYS);
                  e.setBackgroundColor(Color.rgb(27,32,41));
                  e.setPadding(14,14,14,14);
                  return e;
              }

              void copyBox(EditText box, String message) {
                  String s = box.getText().toString();
                  if(s.trim().isEmpty()) {
                      Toast.makeText(this, "Nincs másolható szöveg.", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  ClipboardManager cm = (ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("Fordító Konzol", s));
                  Toast.makeText(this, message, Toast.LENGTH_SHORT).show();
              }

              void clearBothBoxes() {
                  programmaticChange = true;
                  try {
                      topBox.setText("");
                      bottomBox.setText("");
                      topManualStart = -1;
                      bottomManualStart = -1;
                      pendingOutput = "";
                      pendingManualText = "";
                      manualResponseMode = false;
                  } finally {
                      programmaticChange = false;
                  }
                  Toast.makeText(this, "Mindkét ablak törölve.", Toast.LENGTH_SHORT).show();
              }

              TextWatcher manualWatcher(final boolean top) {
                  return new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          if(programmaticChange) return;
                          if(top) {
                              manualTopSource = true;
                              if(topManualStart < 0) topManualStart = Math.max(0, Math.min(start, s.length()));
                          } else {
                              manualTopSource = false;
                              if(bottomManualStart < 0) bottomManualStart = Math.max(0, Math.min(start, s.length()));
                          }
                          updateButtons();
                      }
                      public void afterTextChanged(Editable e) {}
                  };
              }

              void reqMic() {
                  if(Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1001);
              }

              boolean hasKey() {
                  return apiKey != null && apiKey.trim().startsWith("sk-");
              }

              void start(boolean withAudio) {
                  if(!hasKey()) { showApi(); return; }
                  if(withAudio && Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) { reqMic(); return; }
                  if(withAudio && sessionStart == 0L) sessionStart = System.currentTimeMillis();
                  if(withAudio && System.currentTimeMillis() - sessionStart > 20L*60L*1000L) { confirm(); return; }

                  state.setText("kapcsolódás");
                  client = new OkHttpClient.Builder().readTimeout(0, TimeUnit.MILLISECONDS).build();
                  Request req = new Request.Builder()
                    .url("wss://api.openai.com/v1/realtime?model=" + model)
                    .addHeader("Authorization", "Bearer " + apiKey.trim())
                    .build();

                  ws = client.newWebSocket(req, new WebSocketListener() {
                      @Override public void onOpen(WebSocket w, Response r) {
                          connected = true;
                          runOnUiThread(() -> {
                              sessionUpdate();
                              if(withAudio) audioLoop();
                              else state.setText("fordítási kapcsolat");
                              updateButtons();
                              if(!withAudio && pendingManualText.length() > 0) {
                                  String p = pendingManualText;
                                  pendingManualText = "";
                                  new Handler().postDelayed(() -> sendManualText(p), 500);
                              }
                          });
                      }

                      @Override public void onMessage(WebSocket w, String s) {
                          event(s);
                      }

                      @Override public void onFailure(WebSocket w, Throwable t, Response r) {
                          runOnUiThread(() -> {
                              append("\n[kapcsolat hiba] " + t.getMessage());
                              stop();
                          });
                      }

                      @Override public void onClosed(WebSocket w, int c, String reason) {
                          connected = false;
                          runOnUiThread(() -> {
                              state.setText("lezárva");
                              updateButtons();
                          });
                      }
                  });
              }

              void sessionUpdate() {
                  try {
                      JSONObject session = new JSONObject();
                      session.put("type", "realtime");
                      session.put("model", model);
                      session.put("instructions", instructions());
                      session.put("output_modalities", new JSONArray().put("text"));

                      JSONObject vad = new JSONObject();
                      vad.put("type", "semantic_vad");
                      vad.put("eagerness", vadMode);
                      vad.put("create_response", true);

                      JSONObject input = new JSONObject();
                      input.put("turn_detection", vad);

                      JSONObject audio = new JSONObject();
                      audio.put("input", input);

                      session.put("audio", audio);

                      JSONObject evt = new JSONObject();
                      evt.put("type", "session.update");
                      evt.put("session", session);
                      ws.send(evt.toString());
                  } catch(Exception e) {
                      append("\n[session hiba] " + e.getMessage());
                  }
              }

              String instructions() {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "You are a live interpreter. Output text only. No explanations. " +
                    "Work ONLY with these two selected languages: " + top + " and " + bottom + ". " +
                    "Detect whether the current input is " + top + " or " + bottom + ". " +
                    "If the input is " + top + ", translate to " + bottom + ". If the input is " + bottom + ", translate to " + top + ". " +
                    "Ignore other languages and background speech unless it clearly belongs to the active speaker. " +
                    "For every completed thought, output exactly three lines in this format: SOURCE_LANG: <" + top + " or " + bottom + "> then ORIGINAL: <clean source transcript> then TRANSLATION: <natural translation into the other selected language>. " +
                    "Conversation profile: " + profilePrompt() + " " +
                    "Translation mode: " + modePrompt() + " " +
                    "Do not invent missing information. Do not add details that were not said. " +
                    "If the audio is unclear, omit the unclear part or mark it briefly as unclear. " +
                    "Use semantic turn detection. Do not translate every short pause. " +
                    "Wait for a complete sentence or complete thought before outputting translation. " +
                    "The translation must be grammatically natural in the target language. " +
                    "Keep the output readable on a phone screen.";
              }

              String modePrompt() {
                  if(mode.equals("precise")) return "Precise mode: stay close to the meaning, do not expand, but always use correct natural grammar.";
                  if(mode.equals("interpreter")) return "Interpreter mode: use context strongly, make the translation sound like a human interpreter, but do not invent facts.";
                  return "Natural mode: translate meaning naturally and fluently, with light correction only.";
              }

              void audioLoop() {
                  int sr = 24000;
                  int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  int bs = Math.max(min, 4096);

                  rec = new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION, sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bs);
                  streaming = true;
                  rec.startRecording();
                  updateButtons();

                  audioExec.submit(() -> {
                      byte[] buf = new byte[bs];
                      while(streaming && connected && ws != null && rec != null) {
                          int read = rec.read(buf, 0, buf.length);
                          if(read > 0) {
                              try {
                                  byte[] chunk = Arrays.copyOf(buf, read);
                                  JSONObject evt = new JSONObject();
                                  evt.put("type", "input_audio_buffer.append");
                                  evt.put("audio", Base64.encodeToString(chunk, Base64.NO_WRAP));
                                  ws.send(evt.toString());
                              } catch(Exception ignored) {}
                          }
                      }
                  });
              }

              void stop() {
                  streaming = false;
                  connected = false;
                  try { if(rec != null) { rec.stop(); rec.release(); } } catch(Exception ignored) {}
                  rec = null;
                  try { if(ws != null) ws.close(1000, "stop"); } catch(Exception ignored) {}
                  ws = null;
                  runOnUiThread(() -> {
                      state.setText("készenlét");
                      updateButtons();
                  });
              }

              void event(String s) {
                  try {
                      JSONObject o = new JSONObject(s);
                      String type = o.optString("type", "");

                      if(type.equals("response.created")) {
                          responseInProgress = true;
                      }

                      if(type.equals("response.done")) {
                          responseInProgress = false;
                      }

                      if(type.equals("response.text.delta") || type.equals("response.output_text.delta")) {
                          String d = o.optString("delta", "");
                          if(!d.isEmpty()) pendingOutput += d;
                      }

                      if(type.equals("response.output_text.done") || type.equals("response.text.done") || type.equals("response.done")) {
                          String out = pendingOutput.trim();
                          pendingOutput = "";
                          if(!out.isEmpty()) runOnUiThread(() -> routeAiOutput(out));
                      }

                      if(type.equals("error")) {
                          JSONObject er = o.optJSONObject("error");
                          String msg = er == null ? o.toString() : er.optString("message", er.toString());
                          if(msg.contains("response in progress")) responseInProgress = true;
                          runOnUiThread(() -> append("\n[hiba] " + msg));
                      }
                  } catch(Exception e) {
                      runOnUiThread(() -> append("\n[event hiba] " + e.getMessage()));
                  }
              }

              void manualTranslate() {
                  EditText source = manualTopSource ? topBox : bottomBox;
                  String text = manualSourceText(source, manualTopSource).trim();
                  if(text.isEmpty()) {
                      Toast.makeText(this, "Nincs új kézi bevitel. Írj a felső vagy alsó ablakba, utána FORDÍT.", Toast.LENGTH_LONG).show();
                      return;
                  }

                  source.clearFocus();
                  source.setSelection(source.getText().length());
                  try {
                      InputMethodManager imm = (InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);
                      imm.hideSoftInputFromWindow(source.getWindowToken(), 0);
                  } catch(Exception ignored) {}

                  if(!hasKey()) { showApi(); return; }

                  if(ws == null || !connected) {
                      pendingManualText = text;
                      start(false);
                  } else {
                      sendManualText(text);
                  }
              }

              String manualSourceText(EditText source, boolean top) {
                  String all = source.getText().toString();
                  if(all.length() == 0) return "";

                  int start = top ? topManualStart : bottomManualStart;
                  if(start < 0 || start > all.length()) return "";

                  return all.substring(start);
              }

              void clearManualBlock(boolean top) {
                  if(top) topManualStart = -1;
                  else bottomManualStart = -1;
              }

              void sendManualText(String text) {
                  topActive = manualTopSource;
                  updateButtons();
                  if(responseInProgress && ws != null) {
                      try {
                          JSONObject cancel = new JSONObject();
                          cancel.put("type", "response.cancel");
                          ws.send(cancel.toString());
                          responseInProgress = false;
                      } catch(Exception ignored) {}
                  }
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "conversation.item.create");
                      JSONObject item = new JSONObject();
                      item.put("type", "message");
                      item.put("role", "user");
                      JSONArray content = new JSONArray();
                      JSONObject c = new JSONObject();
                      c.put("type", "input_text");
                      String srcCode = manualTopSource ? code(topLang) : code(bottomLang);
                      String tgtCode = manualTopSource ? code(bottomLang) : code(topLang);
                      manualResponseMode = true;
                      c.put("text", "Manual text input. Source language is " + srcCode + ". Target language is " + tgtCode + ". Translate ONLY the following text. Output exactly one line in this format: TRANSLATION: <translation>. Do not repeat the source text. Text:\n" + text);
                      content.put(c);
                      item.put("content", content);
                      msg.put("item", item);
                      ws.send(msg.toString());

                      JSONObject resp = new JSONObject();
                      resp.put("type", "response.create");
                      JSONObject response = new JSONObject();
                      response.put("instructions", instructions());
                      resp.put("response", response);
                      responseInProgress = true;
                      ws.send(resp.toString());
                  } catch(Exception e) {
                      append("\n[kézi fordítás hiba] " + e.getMessage());
                  }
              }

              void routeAiOutput(String out) {
                  String sourceLang = extractAfter(out, "SOURCE_LANG:").toUpperCase(Locale.ROOT);
                  String original = extractAfter(out, "ORIGINAL:");
                  String translation = extractAfter(out, "TRANSLATION:");

                  if(original.length() == 0 && translation.length() == 0) {
                      translation = out;
                  }

                  if(manualResponseMode) {
                      manualResponseMode = false;
                      boolean sourceWasTop = manualTopSource;
                      EditText dstBox = sourceWasTop ? bottomBox : topBox;
                      if(translation.length() > 0) appendTo(dstBox, translation + "\n");
                      clearManualBlock(sourceWasTop);
                      return;
                  }

                  boolean sourceIsTop = sourceLang.contains(code(topLang));
                  boolean sourceIsBottom = sourceLang.contains(code(bottomLang));

                  if(!sourceIsTop && !sourceIsBottom) {
                      sourceIsTop = manualTopSource;
                  }

                  EditText srcBox = sourceIsTop ? topBox : bottomBox;
                  EditText dstBox = sourceIsTop ? bottomBox : topBox;

                  if(original.length() > 0) appendTo(srcBox, original + "\n");
                  if(translation.length() > 0) appendTo(dstBox, translation + "\n");
              }

              String extractAfter(String out, String key) {
                  int i = out.indexOf(key);
                  if(i < 0) return "";
                  int start = i + key.length();
                  int end = out.length();
                  String[] keys = {"SOURCE_LANG:", "ORIGINAL:", "TRANSLATION:"};
                  for(String k: keys) {
                      int n = out.indexOf(k, start);
                      if(n >= 0) end = Math.min(end, n);
                  }
                  return out.substring(start, end).trim();
              }

              void appendTo(EditText target, String s) {
                  if(s == null || s.length() == 0) return;
                  programmaticChange = true;
                  try {
                      String old = target.getText().toString();
                      if(old.length() > 0 && !old.endsWith("\n")) target.append("\n");
                      target.append(s);
                      target.setSelection(target.getText().length());
                  } finally {
                      programmaticChange = false;
                  }
              }

              void appendDelta(String s) {
                  EditText target = topActive ? bottomBox : topBox;
                  appendTo(target, s);
              }

              void append(String s) {
                  EditText target = topActive ? bottomBox : topBox;
                  appendTo(target, s);
              }

              void confirm() {
                  new AlertDialog.Builder(this)
                    .setTitle("Folyik még a beszélgetés?")
                    .setMessage("20 perce aktív a rendszer. Folytassuk?")
                    .setPositiveButton("Igen", (d,w) -> { sessionStart = System.currentTimeMillis(); start(true); })
                    .setNegativeButton("Leállítás", (d,w) -> { sessionStart = 0L; stop(); })
                    .show();
              }

              void menu() {
                  String[] items = {
                      "OpenAI API kulcs",
                      "AI modell: " + modelLabel(),
                      "Beszélgetési profil: " + profileLabel(),
                      "Fordítási mód: " + modeLabel(),
                      "Semantic VAD: " + vadLabel(),
                      "Felső ablak másolása",
                      "Alsó ablak másolása",
                      "Felső ablak törlése",
                      "Alsó ablak törlése",
                      "Mindkét ablak törlése"
                  };

                  new AlertDialog.Builder(this).setTitle("Menü").setItems(items, (d,w) -> {
                      if(w==0) showApi();
                      if(w==1) chooseModel();
                      if(w==2) chooseProfile();
                      if(w==3) chooseMode();
                      if(w==4) chooseVad();
                      if(w==5) copyBox(topBox, "Felső ablak másolva");
                      if(w==6) copyBox(bottomBox, "Alsó ablak másolva");
                      if(w==7) { programmaticChange=true; topBox.setText(""); programmaticChange=false; topManualStart=-1; }
                      if(w==8) { programmaticChange=true; bottomBox.setText(""); programmaticChange=false; bottomManualStart=-1; }
                      if(w==9) clearBothBoxes();
                      updateButtons();
                  }).show();
              }

              void showApi() {
                  EditText input = new EditText(this);
                  input.setSingleLine(true);
                  input.setText(apiKey == null ? "" : apiKey);
                  input.setHint("sk-...");
                  new AlertDialog.Builder(this)
                    .setTitle("OpenAI API kulcs")
                    .setView(input)
                    .setPositiveButton("Mentés", (d,w) -> { apiKey = input.getText().toString().trim(); save(); updateButtons(); })
                    .setNegativeButton("Mégse", null)
                    .show();
              }

              void chooseModel() { chooseFrom("AI modell", models, model, v -> { model = v; save(); restartIfNeeded(); }); }
              void chooseProfile() { chooseFrom("Beszélgetési profil", profiles, profile, v -> { profile = v; save(); sessionUpdateIfConnected(); }); }
              void chooseMode() { chooseFrom("Fordítási mód", modes, mode, v -> { mode = v; save(); sessionUpdateIfConnected(); }); }
              void chooseVad() { chooseFrom("Semantic VAD", vadModes, vadMode, v -> { vadMode = v; save(); sessionUpdateIfConnected(); }); }

              interface Setter { void set(String v); }

              void chooseFrom(String title, String[][] data, String current, Setter setter) {
                  String[] labels = new String[data.length];
                  for(int i=0;i<data.length;i++) labels[i] = data[i][0] + (data[i][1].equals(current) ? " ✓" : "");
                  new AlertDialog.Builder(this).setTitle(title).setItems(labels, (d,w) -> {
                      setter.set(data[w][1]);
                      updateButtons();
                  }).show();
              }

              void chooseLang(boolean top) {
                  String current = top ? topLang : bottomLang;
                  String[] labels = new String[langs.length];
                  for(int i=0;i<langs.length;i++) labels[i] = langs[i][0] + " (" + langs[i][1] + ")" + (langs[i][2].equals(current) ? " ✓" : "");
                  new AlertDialog.Builder(this).setTitle(top ? "Felső nyelv" : "Alsó nyelv").setItems(labels, (d,w) -> {
                      if(top) { topLang = langs[w][2]; topActive = true; manualTopSource = true; }
                      else { bottomLang = langs[w][2]; topActive = false; manualTopSource = false; }
                      save();
                      sessionUpdateIfConnected();
                      updateButtons();
                  }).show();
              }

              void restartIfNeeded() {
                  if(streaming) {
                      stop();
                      new Handler().postDelayed(() -> start(true), 700);
                  }
              }

              void sessionUpdateIfConnected() {
                  if(ws != null && connected) sessionUpdate();
              }

              String profilePrompt() {
                  if(profile.equals("truck_bulk")) return "Two truck drivers are talking about bulk transport, silo loading, unloading, weighing, site logistics and freight.";
                  if(profile.equals("truck_tarp")) return "Truck tarpaulin transport, loading, straps, pallets, CMR and site logistics.";
                  if(profile.equals("truck_general")) return "Truck driving, freight, route, dispatcher, loading and site communication.";
                  if(profile.equals("medical")) return "Doctor-patient conversation, symptoms, examination, medicine and treatment.";
                  if(profile.equals("restaurant")) return "Restaurant ordering, food, drinks, payment and service.";
                  if(profile.equals("tourism")) return "Tourism, travel, directions, tickets and programs.";
                  if(profile.equals("hotel")) return "Accommodation, apartment, booking, arrival, departure and payment.";
                  if(profile.equals("bank")) return "Banking, account, card, transfer and identification.";
                  if(profile.equals("office")) return "Official administration, documents, certificates and customer service.";
                  if(profile.equals("customs")) return "Customs, border, documents, freight and inspection.";
                  if(profile.equals("service")) return "Vehicle service or machine repair, faults, parts and repair.";
                  if(profile.equals("pharmacy")) return "Pharmacy, medicine, dosage and symptoms.";
                  return "General conversation.";
              }

              String modelLabel() { return labelOf(models, model); }
              String profileLabel() { return labelOf(profiles, profile); }
              String modeLabel() { return labelOf(modes, mode); }
              String vadLabel() { return labelOf(vadModes, vadMode); }

              String labelOf(String[][] arr, String key) {
                  for(String[] x: arr) if(x[1].equals(key)) return x[0];
                  return key;
              }

              String code(String code) {
                  if(code == null || code.isEmpty()) return "AUTO";
                  for(String[] l: langs) if(l[2].equals(code)) return l[1];
                  return code.toUpperCase(Locale.ROOT);
              }

              void updateButtons() {
                  micBtn.setText(streaming ? "STOP" : "MIKROFON");
                  micBtn.setBackgroundColor(streaming ? Color.rgb(30,130,70) : Color.rgb(90,50,50));
                  translateBtn.setBackgroundColor(Color.rgb(55,60,70));
                  menuBtn.setBackgroundColor(hasKey() ? Color.rgb(55,60,70) : Color.rgb(140,80,30));
                  topLangBtn.setText("FELSŐ: " + code(topLang));
                  bottomLangBtn.setText("ALSÓ: " + code(bottomLang));
                  topLangBtn.setBackgroundColor(topActive ? Color.rgb(60,95,150) : Color.rgb(55,60,70));
                  bottomLangBtn.setBackgroundColor(!topActive ? Color.rgb(60,95,150) : Color.rgb(55,60,70));
              }

              @Override public void onPause() {
                  super.onPause();
                  if(streaming) stop();
              }

              @Override public void onDestroy() {
                  if(streaming) stop();
                  audioExec.shutdownNow();
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease

      - name: Collect release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/ForditoKonzol-Realtime-v20-release-signed.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/ForditoKonzol-Realtime-v20-release-signed.aab
          ls -lah artifact

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ForditoKonzol-Realtime-v20-release-signed
          path: |
            artifact/*.apk
            artifact/*.aab
          if-no-files-found: error
