              void showFloatingClipboardCollapsed() {
                  try {
                      if(!floatingTranslatorEnabled) return;
                      if(floatingWindowManager == null) floatingWindowManager = (android.view.WindowManager)getSystemService(WINDOW_SERVICE);
                      removeFloatingClipboardViewOnly();
          
                      Button mini = btn("⇄");
                      mini.setTextSize(20);
                      mini.setTextColor(Color.WHITE);
                      mini.setGravity(Gravity.CENTER);
                      mini.setIncludeFontPadding(false);
                      mini.setPadding(0,0,0,0);
                      mini.setTranslationY(-6f);
                      mini.setBackground(roundBg(Color.rgb(30,140,75)));
                      if(android.os.Build.VERSION.SDK_INT >= 21) mini.setBackgroundTintList(null);
          
                      final android.view.WindowManager.LayoutParams lp = floatingParams(72, 72, Gravity.RIGHT | Gravity.CENTER_VERTICAL);
                      lp.x = floatingButtonX;
                      lp.y = floatingButtonY;
          
                      final int[] down = new int[4];
                      final boolean[] moved = new boolean[1];
                      mini.setOnTouchListener((v, ev) -> {
                          if(ev.getAction() == android.view.MotionEvent.ACTION_DOWN) {
                              down[0]=lp.x; down[1]=lp.y; down[2]=(int)ev.getRawX(); down[3]=(int)ev.getRawY();
                              moved[0]=false;
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_MOVE) {
                              int dx=(int)ev.getRawX()-down[2], dy=(int)ev.getRawY()-down[3];
                              if(Math.abs(dx)>16 || Math.abs(dy)>16) moved[0]=true;
                              if(moved[0]) {
                                  lp.x=Math.max(0,down[0]-dx);
                                  lp.y=down[1]+dy;
                                  try { floatingWindowManager.updateViewLayout(mini,lp); } catch(Exception ignored) {}
                              }
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_UP) {
                              floatingButtonX=lp.x; floatingButtonY=lp.y; save();
                              if(!moved[0]) {
                                  try { mini.performHapticFeedback(android.view.HapticFeedbackConstants.KEYBOARD_TAP); } catch(Exception ignored) {}
                                  bringAppToFrontForClipboardRead();
                              }
                              return true;
                          }
                          return true;
                      });
          
                      floatingButtonView = mini;
                      floatingWindowManager.addView(floatingButtonView, lp);
                  } catch(Exception e) {
                      floatingButtonView = null;
                      Toast.makeText(this, "Lebegő gomb hiba: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          
              void hideFloatingTranslator() {
                  removeFloatingClipboardViewOnly();
              }
          
              String getClipboardText() {
                  try {
                      android.content.ClipboardManager cm = (android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                      if(cm == null || !cm.hasPrimaryClip() || cm.getPrimaryClip() == null || cm.getPrimaryClip().getItemCount() == 0) return "";
                      CharSequence cs = cm.getPrimaryClip().getItemAt(0).coerceToText(this);
                      return cs == null ? "" : cs.toString();
                  } catch(Exception ignored) { return ""; }
              }
              void pasteClipboardAtCursor() {
                  String clip = getClipboardText();
                  if(clip == null || clip.length() == 0) {
                      Toast.makeText(this, "A vágólap üres.", Toast.LENGTH_SHORT).show();
                      return;
                  }
          
                  EditText target;
                  if(topBox != null && topBox.hasFocus()) target = topBox;
                  else if(bottomBox != null && bottomBox.hasFocus()) target = bottomBox;
                  else target = manualTopSource ? topBox : bottomBox;
                  if(target == null) return;
          
                  int start = Math.max(0, target.getSelectionStart());
                  int end = Math.max(0, target.getSelectionEnd());
                  if(start > end) { int t = start; start = end; end = t; }
                  start = Math.min(start, target.getText().length());
                  end = Math.min(end, target.getText().length());
                  int before = end - start;
                  boolean targetTop = target == topBox;
                  invalidateManualWindowRequests();
          
                  programmaticChange = true;
                  try {
                      target.getText().replace(start, end, clip);
                      int cursor = Math.min(start + clip.length(), target.getText().length());
                      target.setSelection(cursor);
                      target.requestFocus();
                      manualTopSource = targetTop;
                      topActive = targetTop;
                  } finally {
                      programmaticChange = false;
                  }
                  syncManualEditIntoBlockModel(targetTop, target.getText(), start, before, clip.length());
                  updateButtons();
              }
          
              void bringAppToFrontForClipboardRead() {
                  try {
                      Intent i = new Intent(this, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch(Exception ignored) {}
              }
          
              android.view.View interpreterFloatingView;
