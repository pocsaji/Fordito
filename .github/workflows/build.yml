              String normalizeAiSourceLangCode(String sourceLang) {
                  if(sourceLang == null) return "";
                  String s = java.text.Normalizer.normalize(sourceLang, java.text.Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "")
                      .toLowerCase(Locale.ROOT).replace('_', '-')
                      .replaceAll("[^a-z-]", "").trim();
                  if(s.length() == 0) return "";
                  if(s.equals("hu") || s.equals("hun") || s.equals("hu-hu") || s.equals("hungarian") || s.equals("magyar")) return "HU";
                  if(s.equals("fr") || s.equals("fra") || s.equals("fre") || s.equals("fr-fr") || s.equals("french") || s.equals("francais")) return "FR";
                  if(s.equals("en") || s.equals("eng") || s.equals("en-us") || s.equals("en-gb") || s.equals("english")) return "EN";
                  if(s.equals("de") || s.equals("deu") || s.equals("ger") || s.equals("de-de") || s.equals("german") || s.equals("deutsch")) return "DE";
                  if(s.equals("it") || s.equals("ita") || s.equals("it-it") || s.equals("italian") || s.equals("italiano")) return "IT";
                  if(s.equals("es") || s.equals("spa") || s.equals("es-es") || s.equals("spanish") || s.equals("espanol")) return "ES";
                  if(s.equals("ro") || s.equals("ron") || s.equals("rum") || s.equals("ro-ro") || s.equals("romanian") || s.equals("romana")) return "RO";
                  if(s.equals("hr") || s.equals("hrv") || s.equals("hr-hr") || s.equals("croatian") || s.equals("hrvatski")) return "HR";
                  if(s.equals("sk") || s.equals("slk") || s.equals("slo") || s.equals("sk-sk") || s.equals("slovak") || s.equals("slovencina")) return "SK";
                  if(s.equals("sl") || s.equals("slv") || s.equals("sl-si") || s.equals("slovenian") || s.equals("slovenscina")) return "SL";
                  return "";
              }

              int selectedLanguageMarkerScore(String text, String langCode) {
                  if(text == null || langCode == null) return 0;
                  String lower = text.toLowerCase(Locale.ROOT);
                  String normalized = " " + java.text.Normalizer.normalize(lower, java.text.Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "").replaceAll("[^a-z]+", " ").trim() + " ";
                  int score = 0;
                  String[] words;
                  switch(langCode) {
                      case "HU":
                          if(lower.matches(".*[őű].*")) score += 6;
                          if(lower.matches(".*[áéíóöúü].*")) score += 2;
                          words = new String[]{" hogy "," nem "," van "," vagy "," amit "," mondok "," lenne "," tudom "," hallja "," egy "," es "," az "};
                          break;
                      case "FR":
                          if(lower.matches(".*[àâçéèêëîïôùûüÿœ].*")) score += 3;
                          words = new String[]{" je "," vous "," nous "," pas "," que "," est "," il "," elle "," les "," une "," avec "," beaucoup "," simplement "," bruit "," entendez "};
                          break;
                      case "EN":
                          if(normalized.contains(" hello ") || normalized.contains(" hi ")
                                  || normalized.contains(" thanks ") || normalized.contains(" thank you ")) score += 4;
                          words = new String[]{" the "," is "," are "," you "," i "," we "," not "," that "," what "," have "," this "," with "," yes "," please "};
                          break;
                      case "DE": words = new String[]{" der "," die "," das "," ich "," sie "," nicht "," und "," ist "," mit "," wir "," haben "}; break;
                      case "IT": words = new String[]{" il "," lo "," la "," che "," non "," io "," voi "," con "," una "," sono "," abbiamo "}; break;
                      case "ES": words = new String[]{" el "," la "," que "," no "," yo "," usted "," con "," una "," es "," estamos "," tengo "}; break;
                      case "RO": words = new String[]{" este "," nu "," eu "," dumneavoastra "," cu "," o "," sunt "," avem "," ce "," aceasta "}; break;
                      case "HR": words = new String[]{" je "," nije "," ja "," vi "," sa "," sto "," imamo "," ovo "," mogu "," govorim "}; break;
                      case "SK": words = new String[]{" je "," nie "," som "," ste "," co "," toto "," mame "," mozem "," hovorim "}; break;
                      case "SL": words = new String[]{" je "," ni "," sem "," ste "," kaj "," to "," imamo "," lahko "," govorim "}; break;
                      default: words = new String[0];
                  }
                  for(String w : words) if(normalized.contains(w)) score++;
                  return score;
              }

              String deterministicSelectedSourceLanguage(String transcript, String topCode, String bottomCode) {
                  int topScore = selectedLanguageMarkerScore(transcript, topCode);
                  int bottomScore = selectedLanguageMarkerScore(transcript, bottomCode);
                  if(topScore >= 4 && topScore >= bottomScore + 2) return topCode;
                  if(bottomScore >= 4 && bottomScore >= topScore + 2) return bottomCode;
                  return "";
              }

              boolean clearlyOutsideSelectedLanguages(String transcript, String topCode, String bottomCode) {
                  if(sttWordCount(transcript) > 4 || transcript.length() > 32) return false;
                  int selectedBest = Math.max(
                      selectedLanguageMarkerScore(transcript, topCode),
                      selectedLanguageMarkerScore(transcript, bottomCode));
                  String[] supported = new String[]{"HU","FR","EN","DE","IT","ES","RO","HR","SK","SL"};
                  for(String code : supported) {
                      if(code.equals(topCode) || code.equals(bottomCode)) continue;
                      int other = selectedLanguageMarkerScore(transcript, code);
                      if(other >= 4 && other >= selectedBest + 2) return true;
                  }
                  return false;
              }







              void processNextSpeechTranslation() {
                  clipboardResponseMode = false;
                  if(speechTranslateMode || responseInProgress) return;
                  if(client == null) client = new OkHttpClient.Builder().connectTimeout(25, TimeUnit.SECONDS).readTimeout(90, TimeUnit.SECONDS).writeTimeout(45, TimeUnit.SECONDS).build();
                  Integer idObj = speechTranslateQueue.poll();
                  if(idObj == null) return;
                  int id = idObj.intValue();
                  if(id < 0 || id >= textBlocks.size()) { processNextSpeechTranslation(); return; }
                  TextBlock b = textBlocks.get(id);
                  String transcript = b.autoSttText == null ? "" : b.autoSttText.trim();
                  if(transcript.length() == 0) { processNextSpeechTranslation(); return; }

                  try {
                      pendingSpeechBlockId = id;
                      speechTranslateMode = true;
                      responseInProgress = true;
                      String topCode = b.captureTopLangCode;
                      String bottomCode = b.captureBottomLangCode;
                      if(topCode.length() == 0 || bottomCode.length() == 0 || topCode.equals(bottomCode)) {
                          retrySpeechBlockOrRender(id);
                          return;
                      }

                      JSONObject root = new JSONObject();
                      root.put("model", model);
                      root.put("temperature", 0.0);
                      JSONArray messages = new JSONArray();
                      String deterministicSource = deterministicSelectedSourceLanguage(transcript, topCode, bottomCode);
                      messages.put(new JSONObject().put("role", "system").put("content", speechPairInstructions(topCode, bottomCode)));
                      messages.put(new JSONObject().put("role", "user").put("content",
                          "TOP_LANG: " + topCode + "
          BOTTOM_LANG: " + bottomCode +
                          "
          DETERMINISTIC_SOURCE_HINT: " + (deterministicSource.length() == 0 ? "NONE" : deterministicSource) +
                          "
          AUDIO_TRANSCRIPT:
          " + transcript));
                      root.put("messages", messages);

                      JSONObject properties = new JSONObject();
                      JSONArray sourceEnum = deterministicSource.length() == 0
                          ? new JSONArray().put(topCode).put(bottomCode)
                          : new JSONArray().put(deterministicSource);
                      properties.put("source_lang", new JSONObject().put("type", "string").put("enum", sourceEnum));
                      properties.put("translation", new JSONObject().put("type", "string"));
                      JSONObject schema = new JSONObject()
                          .put("type", "object").put("properties", properties)
                          .put("required", new JSONArray().put("source_lang").put("translation"))
                          .put("additionalProperties", false);
                      root.put("response_format", new JSONObject().put("type", "json_schema")
                          .put("json_schema", new JSONObject().put("name", "speech_pair_translation_v382").put("strict", true).put("schema", schema)));

                      Request req = new Request.Builder().url("https://api.openai.com/v1/chat/completions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .addHeader("Content-Type", "application/json")
                          .post(RequestBody.create(MediaType.parse("application/json; charset=utf-8"), root.toString())).build();
                      client.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> { responseInProgress = false; retrySpeechBlockOrRender(id); });
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> { responseInProgress = false; retrySpeechBlockOrRender(id); });
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String out = obj.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "").trim();
                                  runOnUiThread(() -> { pendingOutput = out; responseInProgress = false; applySpeechTranslation(out); });
                              } catch(Exception e) {
                                  runOnUiThread(() -> { responseInProgress = false; retrySpeechBlockOrRender(id); });
                              }
                          }
                      });
                  } catch(Exception e) {
                      retrySpeechBlockOrRender(id);
                  }
              }



              void retrySpeechBlockOrRender(int id) {
                  responseInProgress = false;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  pendingOutput = "";
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      if(b.retryCount < 1) {
                          b.retryCount++;
                          speechTranslateQueue.addFirst(id);
                          if(streaming) state.setText("mikrofon aktív – blokk újrapróbálása");
                          processNextSpeechTranslation();
                          return;
                      }

                      // A V380 itt lenullázta és eltüntette a már felismert mondatot.
                      // V382-ben a transcript megmarad akkor is, ha a fordítási kérés hibázik.
                      String original = b.autoSttText == null ? "" : b.autoSttText.trim();
                      b.pendingSourceText = "";
                      b.topText = "";
                      b.bottomText = "";
                      if(b.sourceTop) b.topText = original;
                      else b.bottomText = original;
                      b.translatedOk = false;
                  }
                  renderBlocksKeepView();
                  if(streaming) state.setText("mikrofon aktív – eredeti megtartva, fordítási hiba");
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else updateSpeechWorkState();
              }




              void applySpeechTranslation(String out) {
                  int id = pendingSpeechBlockId;
                  String speakText = null;
                  String speakLang = null;
                  if(id >= 0 && id < textBlocks.size()) {
                      TextBlock b = textBlocks.get(id);
                      try {
                          JSONObject structured = new JSONObject(out);
                          String normalizedSource = normalizeAiSourceLangCode(structured.optString("source_lang", ""));
                          String translation = cleanOneBlockTranslation(structured.optString("translation", "")).trim();
                          String original = b.autoSttText == null ? "" : b.autoSttText.trim();
                          String topCode = b.captureTopLangCode;
                          String bottomCode = b.captureBottomLangCode;
                          if((!normalizedSource.equals(topCode) && !normalizedSource.equals(bottomCode))
                                  || original.length() == 0 || translation.length() == 0) {
                              retrySpeechBlockOrRender(id);
                              return;
                          }

                          String sourceCode = normalizedSource;
                          b.sttLanguageCode = sourceCode;
                          boolean sourceIsTop = sourceCode.equals(topCode);
                          b.sourceTop = sourceIsTop;
                          b.pendingSourceText = "";
                          b.topText = "";
                          b.bottomText = "";
                          if(sourceIsTop) {
                              b.topText = original;
                              b.bottomText = translation;
                              speakText = translation;
                              speakLang = apiCode(bottomCode);
                          } else {
                              b.bottomText = original;
                              b.topText = translation;
                              speakText = translation;
                              speakLang = apiCode(topCode);
                          }
                          b.translatedOk = true;
                          b.retryCount = 0;
                          setDetectedSourceSide(sourceIsTop);
                          renderBlocksKeepView();
                          if(speakText != null && speakLang != null) speakFinalBlockOnce(b, speakText, speakLang);
                      } catch(Exception e) {
                          retrySpeechBlockOrRender(id);
                          return;
                      }
                  }
                  pendingSpeechBlockId = -1;
                  speechTranslateMode = false;
                  pendingOutput = "";
                  if(!speechTranslateQueue.isEmpty()) processNextSpeechTranslation();
                  else updateSpeechWorkState();
              }



              void applyManualFullWindowTranslation(String out) {
                  try {
                      JSONObject structured = new JSONObject(out);
                      String cleanSource = structured.optString("clean_source", "").trim();
                      String tr = structured.optString("translation", "").trim();
                      if(cleanSource.length() == 0 || tr.length() == 0) throw new Exception("empty manual result");

                      programmaticChange = true;
                      try {
                          if(manualTopSource) {
                              topBox.setText(cleanSource);
                              bottomBox.setText(tr);
                          } else {
                              bottomBox.setText(cleanSource);
                              topBox.setText(tr);
                          }
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      } finally {
                          programmaticChange = false;
                      }
                      speakManualOnce(tr, manualTopSource ? bottomLang : topLang);
                  } catch(Exception e) {
                      Toast.makeText(this, "Kézi fordítás válasz hiba.", Toast.LENGTH_LONG).show();
                  }
              }


              String cleanOneBlockTranslation(String out) {
                  if(out == null) return "";
                  String s = out.trim();
                  if(s.startsWith("```")) s = s.replace("```", "").trim();

                  String upper = s.toUpperCase(Locale.ROOT);
                  int trPos = upper.lastIndexOf("TRANSLATION:");
                  if(trPos >= 0) {
                      s = s.substring(trPos + "TRANSLATION:".length()).trim();
                  }
                  if(s.toUpperCase(Locale.ROOT).startsWith("FORDÍTÁS:")) s = s.substring("FORDÍTÁS:".length()).trim();

                  // Biztonsági tisztítás: ha a modell mégis címkéket adott vissza,
                  // ne írjuk be őket a fordítási ablakba.
                  StringBuilder clean = new StringBuilder();
                  String[] lines = s.split("\n");
                  for(String line: lines) {
                      String t = line.trim();
                      String u = t.toUpperCase(Locale.ROOT);
                      if(u.startsWith("SOURCE_LANG:") || u.startsWith("TARGET_LANG:") ||
                         u.startsWith("ORIGINAL:") || u.equals("TEXT:") || u.startsWith("TEXT:")) {
                          continue;
                      }
                      if(clean.length() > 0) clean.append("\n");
                      clean.append(line);
                  }
                  return cleanTranscriptForSelectedPair(clean.toString().trim());
              }



              void appendTo(EditText target, String s) {
                  if(s == null || s.length() == 0) return;
                  programmaticChange = true;
                  try {
                      String old = target.getText().toString();
                      if(old.length() > 0 && !old.endsWith("\n")) target.append("\n");
                      target.append(s);
                      target.setSelection(target.getText().length());
                  } finally {
                      programmaticChange = false;
                  }
              }

              void append(String s) {
                  EditText target = topActive ? bottomBox : topBox;
                  appendTo(target, s);
              }

