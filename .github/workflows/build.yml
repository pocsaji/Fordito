              AudioRecord makeAudioRecord(int source, int sr, int bs) {
                  try {
                      AudioRecord r = new AudioRecord(source, sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bs);
                      if(r.getState() == AudioRecord.STATE_INITIALIZED) return r;
                      try { r.release(); } catch(Exception ignored) {}
                  } catch(Exception ignored) {}
                  return null;
              }

              AudioRecord makeBestAudioRecord(int sr, int bs, boolean deepFilterActive) {
                  int[] sources = deepFilterActive
                      ? new int[] {
                          // Elsőként a beszédfelismerésre hangolt út: nem a nyers, halk UNPROCESSED jel.
                          MediaRecorder.AudioSource.VOICE_RECOGNITION,
                          MediaRecorder.AudioSource.UNPROCESSED,
                          MediaRecorder.AudioSource.MIC,
                          MediaRecorder.AudioSource.VOICE_COMMUNICATION
                      }
                      : new int[] {
                          MediaRecorder.AudioSource.VOICE_RECOGNITION,
                          MediaRecorder.AudioSource.VOICE_COMMUNICATION,
                          MediaRecorder.AudioSource.MIC,
                          MediaRecorder.AudioSource.UNPROCESSED
                      };
                  HashSet<Integer> tried = new HashSet<>();
                  for(int source : sources) {
                      if(!tried.add(source)) continue;
                      AudioRecord r = makeAudioRecord(source, sr, bs);
                      if(r != null) {
                          activeAudioSource = source;
                          return r;
                      }
                  }
                  return null;
              }

              boolean shouldMuteMicForSpeakerTts() {
                  return interpreterMode
                      && "speaker".equals(interpreterAudioMode)
                      && (ttsSpeaking || System.currentTimeMillis() < ttsMuteUntilMs);
              }

              void resetAudioModeState() {
                  streaming = false;
                  cancelMicLifeSignal();
                  voiceSendActive = false;
                  clearPreRollAudio();
                  clearPendingSpeechAudio();
                  clearSpeechAudioWindow();
                  closeSpeechVad();
                  activeAudioSource = -1;
                  cancelActiveSttCallsAndResetOrder();
                  audioSessionId++;
                  deepFilterFailureShown = false;
                  lastDeepFilterFailure = "";
                  deepFilterBypass = false;
                  releaseDeepFilterNet();
                  try { if(rec != null) { rec.stop(); rec.release(); } } catch(Exception ignored) {}
                  rec = null;
              }


              String activeAudioSourceLabel() {
                  if(activeAudioSource == MediaRecorder.AudioSource.VOICE_RECOGNITION) return "VOICE_RECOGNITION";
                  if(activeAudioSource == MediaRecorder.AudioSource.UNPROCESSED) return "UNPROCESSED";
                  if(activeAudioSource == MediaRecorder.AudioSource.VOICE_COMMUNICATION) return "VOICE_COMMUNICATION";
                  if(activeAudioSource == MediaRecorder.AudioSource.MIC) return "MIC";
                  return "AUDIO";
              }

              void audioLoop() {
                  final int sr = AUDIO_SAMPLE_RATE;
                  final int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  final int recordBufferBytes = Math.max(min * 2, AUDIO_SAMPLE_RATE * 2 * 500 / 1000);
                  final int readFrameBytes = AUDIO_SAMPLE_RATE * 2 * AUDIO_READ_FRAME_MS / 1000;

                  audioExec.submit(() -> {
                      AudioRecord localRec = null;
                      try {
                          if(!connected) return;
                          deepFilterBypass = !initDeepFilterNet();
                          if(deepFilterBypass) {
                              runOnUiThread(() -> state.setText("DeepFilter hiba – Android hang tartalék"));
                          }
                          if(!ensureSpeechVadReady()) {
                              throw new IllegalStateException("A WebRTC beszéddaraboló nem inicializálható");
                          }
                          if(!connected) { closeSpeechVad(); releaseDeepFilterNet(); return; }

                          localRec = makeBestAudioRecord(sr, recordBufferBytes, !deepFilterBypass);
                          if(localRec == null) throw new IllegalStateException("AudioRecord nem inicializálható 48 kHz-en");
                          rec = localRec;
                          localRec.startRecording();
                          if(localRec.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING) {
                              throw new IllegalStateException("A mikrofon nem indult el");
                          }

                          clearPreRollAudio();
                          clearPendingSpeechAudio();
                          clearSpeechAudioWindow();
                          voiceSendActive = false;
                          streaming = true;
                          runOnUiThread(() -> {
                              setSpeechUiLocked(false);
                              if(deepFilterBypass) state.setText("mikrofon aktív – " + activeAudioSourceLabel() + " + VAD");
                              else state.setText("mikrofon aktív – DeepFilter + " + activeAudioSourceLabel() + " + VAD");
                              scheduleMicLifeSignal();
                              updateButtons();
                          });

                          byte[] buf = new byte[readFrameBytes];
                          while(streaming && connected && rec == localRec) {
                              int read = localRec.read(buf, 0, buf.length, AudioRecord.READ_BLOCKING);
                              if(read == AudioRecord.ERROR_INVALID_OPERATION || read == AudioRecord.ERROR_BAD_VALUE || read == AudioRecord.ERROR_DEAD_OBJECT) {
                                  if(!streaming || !connected) break;
                                  throw new IllegalStateException("AudioRecord olvasási hiba: " + read);
                              }
                              if(read <= 0) continue;
                              if(!streaming || !connected) break;

                              if(shouldMuteMicForSpeakerTts()) {
                                  if(voiceSendActive) flushSpeechAudioWindow(true);
                                  voiceSendActive = false;
                                  clearPendingSpeechAudio();
                                  clearPreRollAudio();
                                  resetVadSegmentationState();
                                  continue;
                              }

                              // A nyers VAD-döntést a DeepFilter előtt sorba tesszük. Ha a DeepFilter
                              // egy részleges AudioRecord-olvasást csak a következő körben tud kiadni,
                              // a döntés akkor sem vész el és nem csúszik el a szűrt hanghoz képest.
                              try {
                                  queueRawVadDecisions(Arrays.copyOf(buf, read));
                              } catch(Throwable vadError) {
                                  closeSpeechVad();
                                  clearPreRollAudio();
                                  voiceSendActive = false;
                                  if(!ensureSpeechVadReady()) {
                                      throw new IllegalStateException("WebRTC VAD kiesett: " + deepFilterRootCause(vadError), vadError);
                                  }
                                  continue;
                              }

                              byte[] filtered48k;
                              if(deepFilterBypass) {
                                  filtered48k = Arrays.copyOf(buf, read);
                              } else {
                                  try {
                                      filtered48k = filterWithDeepFilterNet(buf, read);
                                  } catch(Throwable deepError) {
                                      deepFilterBypass = true;
                                      releaseDeepFilterNet();
                                      filtered48k = Arrays.copyOf(buf, read);
                                      final String reason = deepFilterRootCause(deepError);
                                      runOnUiThread(() -> {
                                          state.setText("DeepFilter kiesett – nyers hang tartalék");
                                          Toast.makeText(MainActivity.this,
                                              "DeepFilter feldolgozási hiba; a mikrofon nyers hanggal tovább működik: " + reason,
                                              Toast.LENGTH_LONG).show();
                                      });
                                  }
                              }
                              if(filtered48k == null || filtered48k.length == 0) continue;

                              try {
                                  // A VAD csak határt jelez; az STT ugyanahhoz az időponthoz tartozó,
                                  // egyszer DeepFilterezett 48 kHz-es PCM-et kapja.
                                  consumeFilteredVadFrames(filtered48k);
                              } catch(Throwable vadError) {
                                  closeSpeechVad();
                                  clearPreRollAudio();
                                  voiceSendActive = false;
                                  if(!ensureSpeechVadReady()) {
                                      throw new IllegalStateException("WebRTC VAD kiesett: " + deepFilterRootCause(vadError), vadError);
                                  }
                                  continue;
                              }
                          }
                      } catch(Throwable e) {
                          if(streaming || connected) {
                              final String reason = deepFilterRootCause(e);
                              streaming = false;
                              connected = false;
                              runOnUiThread(() -> {
                                  state.setText("mikrofon hiba");
                                  Toast.makeText(MainActivity.this, "Mikrofon hiba: " + reason, Toast.LENGTH_LONG).show();
                                  updateButtons();
                              });
                          }
                      } finally {
                          try {
                              if(localRec != null) {
                                  if(localRec.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) localRec.stop();
                                  localRec.release();
                              }
                          } catch(Throwable ignored) {}
                          if(rec == localRec) rec = null;
                          if(!streaming) {
                              cancelMicLifeSignal();
                              voiceSendActive = false;
                              clearPendingSpeechAudio();
                              clearPreRollAudio();
                              closeSpeechVad();
                              releaseDeepFilterNet();
                              stopBackgroundForegroundService();
                          }
                      }
                  });
              }

              void handleConnectionFailure(Throwable t) {
                  String msg = t == null ? "ismeretlen hiba" : String.valueOf(t.getMessage());

                  // V318: lebegő vágólap-fordításnál nincs blokkállapot, csak mini ablak/toast.
                  if(clipboardResponseMode) {
                      clipboardResponseMode = false;
                      pendingClipboardText = "";
                      Toast.makeText(this, "Kapcsolat hiba vágólap-fordítás közben.", Toast.LENGTH_LONG).show();
                      stop();
                      return;
                  }

                  // V318: kézi fordításnál nincs blokkállapot. Hiba esetén nem írunk semmit az ablakokba.
                  if(manualResponseMode) {
                      manualResponseMode = false;
                      pendingManualText = "";
                      Toast.makeText(this, "Kapcsolat hiba kézi fordítás közben. Próbáld újra a FORDÍT gombbal.", Toast.LENGTH_LONG).show();
                      stop();
                      return;
                  }

                  // Normál beszéd/élő fordításnál se írjunk hibaüzenetet a fordítási ablakba.
                  Toast.makeText(this, "Kapcsolat hiba: " + msg, Toast.LENGTH_LONG).show();
                  stop();
              }

              void stop() {
                  streaming = false;
                  connected = false;
                  cancelMicLifeSignal();
                  ttsMuteUntilMs = 0L;
                  voiceSendActive = false;
                  try { if(rec != null) { rec.stop(); rec.release(); } } catch(Exception ignored) {}
                  rec = null;
                  boolean tailQueued = flushSpeechAudioWindow(true);
                  clearPendingSpeechAudio();
                  clearPreRollAudio();
                  closeSpeechVad();
                  releaseDeepFilterNet();
                  stopBackgroundForegroundService();
                  runOnUiThread(() -> {
                      int pending;
                      synchronized(sttOrderLock) { pending = pendingSttRequests; }
                      state.setText(tailQueued || pending > 0 || responseInProgress || speechTranslateMode || !speechTranslateQueue.isEmpty()
                          ? "feldolgozás" : "készenlét");
                      updateButtons();
                  });
              }


