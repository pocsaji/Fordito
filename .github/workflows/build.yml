              void scheduleFloatingClipboardCollapse() {
                  floatingCollapseHandler.removeCallbacksAndMessages(null);
                  floatingCollapseHandler.postDelayed(() -> {
                      if(floatingTranslatorEnabled && floatingButtonView != null && !floatingClipboardCollapsed) {
                          showFloatingClipboardCollapsed();
                      }
                  }, 7000);
              }
          
              void removeFloatingClipboardViewOnly() {
                  try { if(floatingWindowManager != null && floatingButtonView != null) floatingWindowManager.removeView(floatingButtonView); } catch(Exception ignored) {}
                  floatingButtonView = null;
              }
          
              void showFloatingClipboardCollapsed() {
                  try {
                      if(!floatingTranslatorEnabled) return;
                      if(floatingWindowManager == null) floatingWindowManager = (android.view.WindowManager)getSystemService(WINDOW_SERVICE);
                      removeFloatingClipboardViewOnly();
                      floatingClipboardCollapsed = true;
          
                      Button mini = btn("⇄");
                      mini.setTextSize(20);
                      mini.setTextColor(Color.WHITE);
                      mini.setGravity(Gravity.CENTER);
                      mini.setIncludeFontPadding(false);
                      mini.setPadding(0,0,0,0);
                      mini.setTranslationY(-6f);
                      mini.setBackground(roundBg(Color.rgb(30,140,75)));
                      if(android.os.Build.VERSION.SDK_INT >= 21) mini.setBackgroundTintList(null);
          
                      final android.view.WindowManager.LayoutParams lp = floatingParams(72, 72, Gravity.RIGHT | Gravity.CENTER_VERTICAL);
                      lp.x = floatingButtonX;
                      lp.y = floatingButtonY;
          
                      final int[] down = new int[4];
                      final boolean[] moved = new boolean[1];
                      mini.setOnTouchListener((v, ev) -> {
                          if(ev.getAction() == android.view.MotionEvent.ACTION_DOWN) {
                              down[0]=lp.x; down[1]=lp.y; down[2]=(int)ev.getRawX(); down[3]=(int)ev.getRawY();
                              moved[0]=false;
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_MOVE) {
                              int dx=(int)ev.getRawX()-down[2], dy=(int)ev.getRawY()-down[3];
                              if(Math.abs(dx)>16 || Math.abs(dy)>16) moved[0]=true;
                              if(moved[0]) {
                                  lp.x=Math.max(0,down[0]-dx);
                                  lp.y=down[1]+dy;
                                  try { floatingWindowManager.updateViewLayout(mini,lp); } catch(Exception ignored) {}
                              }
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_UP) {
                              floatingButtonX=lp.x; floatingButtonY=lp.y; save();
                              if(!moved[0]) {
                                  try { mini.performHapticFeedback(android.view.HapticFeedbackConstants.KEYBOARD_TAP); } catch(Exception ignored) {}
                                  showFloatingClipboardExpanded();
                              }
                              return true;
                          }
                          return true;
                      });
          
                      floatingButtonView = mini;
                      floatingWindowManager.addView(floatingButtonView, lp);
                  } catch(Exception e) {
                      floatingButtonView = null;
                      Toast.makeText(this, "Lebegő gomb hiba: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          
              void showFloatingClipboardExpanded() {
                  try {
                      if(!floatingTranslatorEnabled) return;
                      if(!canDrawOverlayNow()) { requestOverlayPermission(); return; }
                      if(floatingWindowManager == null) floatingWindowManager = (android.view.WindowManager)getSystemService(WINDOW_SERVICE);
                      removeFloatingClipboardViewOnly();
                      floatingClipboardCollapsed = false;
          
                      LinearLayout group = new LinearLayout(this);
                      group.setOrientation(LinearLayout.VERTICAL);
          
                      Button paste = overlayBtn("BEILLESZT", Color.rgb(30,120,75), 11);
                      Button copy = overlayBtn("MÁSOL\nRENDEZ", Color.rgb(45,95,150), 10);
                      LinearLayout.LayoutParams pasteLp = new LinearLayout.LayoutParams(200,108);
                      pasteLp.setMargins(0,0,0,4);
                      LinearLayout.LayoutParams copyLp = new LinearLayout.LayoutParams(200,108);
                      copyLp.setMargins(0,4,0,0);
                      group.addView(paste, pasteLp);
                      group.addView(copy, copyLp);
          
                      final android.view.WindowManager.LayoutParams lp = floatingParams(200, 224, Gravity.RIGHT | Gravity.CENTER_VERTICAL);
                      lp.x = floatingButtonX;
                      lp.y = floatingButtonY;
          
                      final int[] down = new int[4];
                      final boolean[] moved = new boolean[1];
                      final boolean[] copyLongDone = new boolean[1];
                      final Runnable copyLong = () -> {
                          if(!moved[0]) {
                              copyLongDone[0] = true;
                              try { copy.performHapticFeedback(android.view.HapticFeedbackConstants.LONG_PRESS); } catch(Exception ignored) {}
                              cleanActiveBoxToClipboard();
                              scheduleFloatingClipboardCollapse();
                          }
                      };
          
                      View.OnTouchListener floatingGroupTouch = (v, ev) -> {
                          boolean isCopy = (v == copy);
                          if(ev.getAction() == android.view.MotionEvent.ACTION_DOWN) {
                              down[0]=lp.x; down[1]=lp.y; down[2]=(int)ev.getRawX(); down[3]=(int)ev.getRawY();
                              moved[0]=false;
                              copyLongDone[0]=false;
                              floatingCollapseHandler.removeCallbacksAndMessages(null);
                              floatingLongPressHandler.removeCallbacks(copyLong);
                              if(isCopy) floatingLongPressHandler.postDelayed(copyLong, 650);
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_MOVE) {
                              int dx=(int)ev.getRawX()-down[2], dy=(int)ev.getRawY()-down[3];
                              if(Math.abs(dx)>20 || Math.abs(dy)>20) {
                                  moved[0]=true;
                                  floatingLongPressHandler.removeCallbacks(copyLong);
                              }
                              if(moved[0]) {
                                  lp.x=Math.max(0,down[0]-dx);
                                  lp.y=down[1]+dy;
                                  try { floatingWindowManager.updateViewLayout(group,lp); } catch(Exception ignored) {}
                              }
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_UP) {
                              floatingLongPressHandler.removeCallbacks(copyLong);
                              floatingButtonX=lp.x; floatingButtonY=lp.y; save();
                              if(!moved[0] && !copyLongDone[0]) {
                                  try { ((View)v).performHapticFeedback(android.view.HapticFeedbackConstants.KEYBOARD_TAP); } catch(Exception ignored) {}
                                  if(isCopy) copyActiveBoxToClipboard();
                                  else pasteClipboardToLanguageBox();
                              }
                              scheduleFloatingClipboardCollapse();
                              return true;
                          }
                          if(ev.getAction() == android.view.MotionEvent.ACTION_CANCEL) {
                              floatingLongPressHandler.removeCallbacks(copyLong);
                              scheduleFloatingClipboardCollapse();
                              return true;
                          }
                          return true;
                      };
          
                      group.setOnTouchListener(floatingGroupTouch);
                      paste.setOnTouchListener(floatingGroupTouch);
                      copy.setOnTouchListener(floatingGroupTouch);
          
                      floatingButtonView = group;
                      floatingWindowManager.addView(floatingButtonView, lp);
                      scheduleFloatingClipboardCollapse();
                  } catch(Exception e) {
                      floatingButtonView = null;
                      Toast.makeText(this, "Lebegő gomb hiba: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          
              void hideFloatingTranslator() {
