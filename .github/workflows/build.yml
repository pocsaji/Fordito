              void renderBlocksKeepView() {
                  // V342: normál élő frissítéskor legfeljebb az utolsó két látható blokk változhat.
                  // A régebbi stabil előtaghoz nem nyúlunk. Szerkezeti műveleteknél marad a teljes renderBlocks().
                  renderLastTwoVisibleBlocks(!(streaming || uiLockedForSpeech || finalizingStop));
              }
          
              void renderLastTwoVisibleBlocks(boolean keepView) {
                  ArrayList<TextBlock> visible = new ArrayList<>();
                  for(TextBlock b : textBlocks) {
                      if(b == null) continue;
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
                      if(bt.trim().length() == 0 && bb.trim().length() == 0) continue;
                      visible.add(b);
                  }
          
                  if(visible.size() <= 2 || topRanges.size() < visible.size() - 1 || bottomRanges.size() < visible.size() - 1) {
                      renderBlocks(keepView);
                      return;
                  }
          
                  int firstMutable = visible.size() - 2;
                  if(firstMutable < 0 || firstMutable >= topRanges.size() || firstMutable >= bottomRanges.size()) {
                      renderBlocks(keepView);
                      return;
                  }
          
                  int topCut = topRanges.get(firstMutable)[0];
                  int bottomCut = bottomRanges.get(firstMutable)[0];
                  if(topCut < 0 || topCut > topBox.getText().length() ||
                     bottomCut < 0 || bottomCut > bottomBox.getText().length()) {
                      renderBlocks(keepView);
                      return;
                  }
          
                  StringBuilder topTail = new StringBuilder();
                  StringBuilder bottomTail = new StringBuilder();
                  ArrayList<int[]> newTopTailRanges = new ArrayList<>();
                  ArrayList<int[]> newBottomTailRanges = new ArrayList<>();
          
                  for(int i=firstMutable; i<visible.size(); i++) {
                      TextBlock b = visible.get(i);
                      if(i > firstMutable) {
                          topTail.append("\n");
                          bottomTail.append("\n");
                      }
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
          
                      int ts = topCut + topTail.length();
                      topTail.append(bt);
                      newTopTailRanges.add(new int[]{ts, topCut + topTail.length()});
          
                      int bs = bottomCut + bottomTail.length();
                      bottomTail.append(bb);
                      newBottomTailRanges.add(new int[]{bs, bottomCut + bottomTail.length()});
                  }
          
                  int topScroll = topBox.getScrollY();
                  int bottomScroll = bottomBox.getScrollY();
                  int topSel = Math.max(0, topBox.getSelectionStart());
                  int bottomSel = Math.max(0, bottomBox.getSelectionStart());
                  boolean topHadFocus = topBox.hasFocus();
                  boolean bottomHadFocus = bottomBox.hasFocus();
          
                  programmaticChange = true;
                  try {
                      topBox.getText().replace(topCut, topBox.getText().length(), topTail.toString());
                      bottomBox.getText().replace(bottomCut, bottomBox.getText().length(), bottomTail.toString());
          
                      while(topRanges.size() > firstMutable) topRanges.remove(topRanges.size() - 1);
                      while(bottomRanges.size() > firstMutable) bottomRanges.remove(bottomRanges.size() - 1);
                      topRanges.addAll(newTopTailRanges);
                      bottomRanges.addAll(newBottomTailRanges);
          
                      if(keepView) {
                          topBox.setSelection(Math.min(topSel, topBox.getText().length()));
                          bottomBox.setSelection(Math.min(bottomSel, bottomBox.getText().length()));
                          if(topHadFocus) topBox.requestFocus();
                          if(bottomHadFocus) bottomBox.requestFocus();
                          topBox.post(() -> topBox.scrollTo(0, topScroll));
                          bottomBox.post(() -> bottomBox.scrollTo(0, bottomScroll));
                      } else {
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      }
                  } finally {
                      programmaticChange = false;
                  }
                  applyProvisionalTextStyles();
              }
          
              void renderBlocks(boolean keepView) {
                  int topScroll = topBox.getScrollY();
                  int bottomScroll = bottomBox.getScrollY();
                  int topSel = Math.max(0, topBox.getSelectionStart());
                  int bottomSel = Math.max(0, bottomBox.getSelectionStart());
                  boolean topHadFocus = topBox.hasFocus();
                  boolean bottomHadFocus = bottomBox.hasFocus();
          
                  StringBuilder top = new StringBuilder();
                  StringBuilder bottom = new StringBuilder();
                  topRanges.clear();
                  bottomRanges.clear();
          
                  int visibleIndex = 0;
                  for(int i=0;i<textBlocks.size();i++) {
                      TextBlock b = textBlocks.get(i);
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
                      if(bt.trim().length() == 0 && bb.trim().length() == 0) continue;
          
                      if(visibleIndex > 0) {
                          top.append("\n");
                          bottom.append("\n");
                      }
          
                      int ts = top.length();
                      top.append(bt);
                      int te = top.length();
                      topRanges.add(new int[]{ts, te});
          
                      int bs = bottom.length();
                      bottom.append(bb);
                      int be = bottom.length();
                      bottomRanges.add(new int[]{bs, be});
                      visibleIndex++;
                  }
          
                  programmaticChange = true;
                  try {
                      topBox.setText(top.toString());
                      bottomBox.setText(bottom.toString());
                      if(keepView) {
                          topBox.setSelection(Math.min(topSel, topBox.getText().length()));
                          bottomBox.setSelection(Math.min(bottomSel, bottomBox.getText().length()));
                          if(topHadFocus) topBox.requestFocus();
                          if(bottomHadFocus) bottomBox.requestFocus();
                          topBox.post(() -> topBox.scrollTo(0, topScroll));
                          bottomBox.post(() -> bottomBox.scrollTo(0, bottomScroll));
                      } else {
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      }
                  } finally {
                      programmaticChange = false;
                  }
                  applyProvisionalTextStyles();
              }
          
              void applyProvisionalTextStyles() {
                  if(topBox == null || bottomBox == null) return;
                  Editable top = topBox.getText();
                  Editable bottom = bottomBox.getText();
                  for(ProvisionalTextSpan span : top.getSpans(0, top.length(), ProvisionalTextSpan.class)) top.removeSpan(span);
                  for(ProvisionalTextSpan span : bottom.getSpans(0, bottom.length(), ProvisionalTextSpan.class)) bottom.removeSpan(span);
          
                  int visibleIndex = 0;
                  int gray = Color.rgb(145, 150, 160);
                  for(TextBlock b : textBlocks) {
                      if(b == null) continue;
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
                      if(bt.trim().isEmpty() && bb.trim().isEmpty()) continue;
                      if(b.provisional && visibleIndex < topRanges.size() && visibleIndex < bottomRanges.size()) {
                          int[] range = b.sourceTop ? topRanges.get(visibleIndex) : bottomRanges.get(visibleIndex);
                          Editable target = b.sourceTop ? top : bottom;
                          int start = Math.max(0, Math.min(range[0], target.length()));
                          int end = Math.max(start, Math.min(range[1], target.length()));
                          if(end > start) target.setSpan(new ProvisionalTextSpan(gray), start, end, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      }
                      visibleIndex++;
                  }
              }
          
              void initTts() {
                  try {
                      tts = new TextToSpeech(this, status -> {
                          ttsReady = status == TextToSpeech.SUCCESS;
                          if(ttsReady && tts != null) {
                              tts.setSpeechRate(1.0f);
                              tts.setPitch(1.0f);
                              applyTtsAudioAttributes();
                              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override public void onStart(String utteranceId) {
                                      runOnUiThread(() -> handleTtsStart(utteranceId));
                                  }
                                  @Override public void onDone(String utteranceId) {
                                      runOnUiThread(() -> finishTtsUtterance(utteranceId, true, false));
                                  }
                                  @Override public void onStop(String utteranceId, boolean interrupted) {
                                      runOnUiThread(() -> finishTtsUtterance(utteranceId, false, true));
                                  }
                                  @Override public void onError(String utteranceId) {
                                      runOnUiThread(() -> finishTtsUtterance(utteranceId, false, false));
                                  }
                                  @Override public void onError(String utteranceId, int errorCode) {
                                      runOnUiThread(() -> finishTtsUtterance(utteranceId, false, false));
                                  }
                              });
                          } else {
                              android.util.Log.e(LOG_TAG, "TTS initialization failed, status=" + status);
                          }
                      });
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "TTS creation failed", e);
                      ttsReady = false;
                  }
              }
          
              void applyTtsAudioAttributes() {
                  if(tts == null) return;
                  try {
                      // A headset kizárólag kimenet. Nincs MODE_IN_COMMUNICATION/SCO bemeneti út.
                      AudioAttributes attributes = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build();
                      int result = tts.setAudioAttributes(attributes);
                      if(result != TextToSpeech.SUCCESS) android.util.Log.w(LOG_TAG, "TTS audio attributes rejected: " + result);
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "TTS audio attributes failed", e);
                  }
              }
          
              void handleTtsStart(String utteranceId) {
                  TtsJob job = ttsJobs.get(utteranceId);
                  if(job == null) return;
                  if(job.block == null || !job.block.finalReady || job.block.finalRevision != job.revision ||
                     !job.textHash.equals(job.block.finalTranslationHash) ||
                     (job.block.speechSeq > 0 && !textBlocks.contains(job.block))) {
                      android.util.Log.w(LOG_TAG, "Stale TTS job blocked: " + utteranceId);
                      try { if(tts != null) tts.stop(); } catch(Exception e) { android.util.Log.w(LOG_TAG, "TTS stale stop failed", e); }
                      clearSpeakState();
                      return;
                  }
                  job.started = true;
                  job.block.ttsStartedRevision = job.revision;
                  currentTtsUtteranceId = utteranceId;
                  ttsPlaybackActive = true;
                  ttsSpeaking = true;
                  if(isHalfDuplexSpeakerRoute()) beginHalfDuplexTtsGuard();
              }
          
              void finishTtsUtterance(String utteranceId, boolean completed, boolean stopped) {
                  try {
                      TtsJob job = ttsJobs.remove(utteranceId);
                      if(queuedTtsUtterances > 0) queuedTtsUtterances--;
                      if(job != null && job.block != null) {
                          if(completed && job.started && job.block.finalRevision == job.revision &&
                             job.textHash.equals(job.block.finalTranslationHash)) {
                              job.block.ttsCompletedRevision = job.revision;
                              job.block.ttsQueuedRevision = 0;
                              job.block.ttsSpoken = true;
                          } else if(job.block.ttsQueuedRevision == job.revision) {
                              // Hiba vagy megszakítás után a blokk nem számít felolvasottnak.
                              job.block.ttsQueuedRevision = 0;
                          }
                      }
          
                      if(utteranceId != null && utteranceId.equals(currentTtsUtteranceId)) {
                          currentTtsUtteranceId = "";
                          ttsPlaybackActive = false;
                          if(isHalfDuplexSpeakerRoute()) ttsMuteUntilMs = System.currentTimeMillis() + 450L;
                      }
          
                      if(queuedTtsUtterances <= 0 || ttsJobs.isEmpty()) {
                          queuedTtsUtterances = 0;
                          ttsQueued = false;
                          ttsPlaybackActive = false;
                          ttsSpeaking = false;
                      } else {
                          ttsQueued = true;
                          ttsSpeaking = true;
                      }
          
                      if(!completed && !stopped && job != null) {
                          android.util.Log.e(LOG_TAG, "TTS playback error: " + utteranceId);
                          Toast.makeText(this, "A kész fordítás felolvasása nem sikerült.", Toast.LENGTH_SHORT).show();
                      }
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "TTS completion handling failed", e);
                  }
              }
          
              Locale localeForTts(String lang) {
                  String l = lang == null ? "" : lang.toLowerCase(Locale.ROOT);
                  if(l.equals("hu")) return new Locale("hu", "HU");
                  if(l.equals("fr")) return Locale.FRANCE;
                  if(l.equals("en")) return Locale.ENGLISH;
                  if(l.equals("de")) return Locale.GERMAN;
                  if(l.equals("it")) return Locale.ITALIAN;
                  if(l.equals("es")) return new Locale("es", "ES");
                  if(l.equals("ro")) return new Locale("ro", "RO");
                  if(l.equals("hr")) return new Locale("hr", "HR");
                  if(l.equals("sk")) return new Locale("sk", "SK");
                  if(l.equals("sl")) return new Locale("sl", "SI");
                  return Locale.getDefault();
              }
          
              String ttsFinalHash(String text) {
                  if(text == null) return "";
                  return normalizeSpeechBlockHash(text).trim();
              }
          
              synchronized void markFinalTranslationReadyAndSpeak(TextBlock b, String translatedText, String targetLang) {
                  if(b == null || translatedText == null) return;
                  String finalText = translatedText.trim();
                  if(finalText.isEmpty()) return;
                  b.finalRevision++;
                  b.finalTranslation = finalText;
                  b.finalTargetLang = targetLang == null ? "" : targetLang;
                  b.finalTranslationHash = ttsFinalHash(finalText);
                  b.finalReady = b.translatedOk && b.pendingSourceText.trim().isEmpty() && !b.finalTranslationHash.isEmpty();
                  if(b.finalReady) speakFinalBlockOnce(b);
              }
          
              synchronized void speakFinalBlockOnce(TextBlock b) {
                  try {
                      if(b == null || !interpreterMode || !interpreterSpeechOutputEnabled || !ttsReady || tts == null) return;
                      if(!b.finalReady || !b.translatedOk || !b.pendingSourceText.trim().isEmpty()) return;
                      int revision = b.finalRevision;
                      if(revision <= 0 || b.finalTranslation.trim().isEmpty() || b.finalTranslationHash.isEmpty()) return;
                      if(b.ttsCompletedRevision >= revision || b.ttsQueuedRevision == revision) return;
          
                      try { tts.setLanguage(localeForTts(b.finalTargetLang)); } catch(Exception e) { android.util.Log.w(LOG_TAG, "TTS language selection failed", e); }
                      try { tts.setSpeechRate(("hu".equals(b.finalTargetLang) || "fr".equals(b.finalTargetLang)) ? 1.17f : 1.10f); }
                      catch(Exception e) { android.util.Log.w(LOG_TAG, "TTS speech rate failed", e); }
                      applyTtsAudioAttributes();
          
                      String utteranceId = "fordito_tts_" + (++ttsSeq) + "_b" + b.speechSeq + "_r" + revision;
                      TtsJob job = new TtsJob(b, revision, b.finalTranslation, b.finalTargetLang, b.finalTranslationHash);
                      Bundle params = new Bundle();
                      int result = tts.speak(job.text, TextToSpeech.QUEUE_ADD, params, utteranceId);
                      if(result == TextToSpeech.SUCCESS) {
                          b.ttsQueuedRevision = revision;
                          ttsJobs.put(utteranceId, job);
                          queuedTtsUtterances++;
                          ttsQueued = true;
                          ttsSpeaking = true;
                      } else {
                          android.util.Log.e(LOG_TAG, "TTS queue rejected: " + result);
                          b.ttsQueuedRevision = 0;
                      }
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "TTS queue failed", e);
                      if(b != null) b.ttsQueuedRevision = 0;
                  }
              }
          
              synchronized void speakManualOnce(String translatedText, String targetLang) {
                  TextBlock b = new TextBlock();
                  b.translatedOk = true;
                  b.pendingSourceText = "";
                  markFinalTranslationReadyAndSpeak(b, translatedText, targetLang);
              }
          
              void clearSpeakState() {
                  for(TtsJob job : ttsJobs.values()) {
                      if(job != null && job.block != null && job.block.ttsQueuedRevision == job.revision) job.block.ttsQueuedRevision = 0;
                  }
                  ttsJobs.clear();
                  currentTtsUtteranceId = "";
                  queuedTtsUtterances = 0;
                  ttsQueued = false;
                  ttsPlaybackActive = false;
                  ttsSpeaking = false;
              }
          
