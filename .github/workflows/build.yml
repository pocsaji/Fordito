                  bottomBox.setOnClickListener(v -> selectActiveBox(false));
                  topBox.setOnFocusChangeListener((v, hasFocus) -> { if(hasFocus) selectActiveBox(true); });
                  bottomBox.setOnFocusChangeListener((v, hasFocus) -> { if(hasFocus) selectActiveBox(false); });
                  topBox.addTextChangedListener(manualWatcher(true));
                  bottomBox.addTextChangedListener(manualWatcher(false));
                  applyDisplayMode();
                  
                  topLangBtn.setOnClickListener(v -> { hapticTap(v); chooseLang(true); });
                  bottomLangBtn.setOnClickListener(v -> { hapticTap(v); chooseLang(false); });
                  centerLangBtn.setOnClickListener(v -> { hapticTap(v); pasteClipboardAtCursor(); });
                  topLangBtn.setOnLongClickListener(v -> { hapticTap(v); copyBox(true); return true; });
                  bottomLangBtn.setOnLongClickListener(v -> { hapticTap(v); copyBox(false); return true; });
                  micBtn.setOnClickListener(v -> {
                      hapticTap(v);
                      if(finalizingStop) {
                          Toast.makeText(this, "Az utolsó mondat feldolgozása folyamatban.", Toast.LENGTH_SHORT).show();
                      } else if(streaming) stop();
                      else start(true);
                  });
                  arrangeBtn.setOnClickListener(v -> { hapticTap(v); manualArrange(); });
                  translateBtn.setOnClickListener(v -> { hapticTap(v); manualTranslate(); });
                  menuBtn.setOnClickListener(v -> { hapticTap(v); menu(); });
                  menuBtn.setOnLongClickListener(v -> { hapticTap(v); clearBothBoxes(); return true; });
          
                  updateButtons();
              }
          
