                    .putInt("interpreterFloatingX", interpreterFloatingX)
                    .putInt("interpreterFloatingY", interpreterFloatingY)
                    .putString("topLang", topLang)
                    .putString("bottomLang", bottomLang)
                    .apply();
              }

