                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) return "BT-A2DP kimenet";
                  if(type == AudioDeviceInfo.TYPE_WIRED_HEADSET) return "vezetékes kimenet";
                  if(type == AudioDeviceInfo.TYPE_WIRED_HEADPHONES) return "vezetékes fejhallgató";
                  if(type == AudioDeviceInfo.TYPE_USB_HEADSET || type == AudioDeviceInfo.TYPE_USB_DEVICE) return "USB kimenet";
                  if(type == AudioDeviceInfo.TYPE_HEARING_AID) return "hallókészülék kimenet";
                  if(type == AudioDeviceInfo.TYPE_BUILTIN_MIC) return "telefon mikrofon";
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_HEADSET) return "BLE headset kimenet";
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_SPEAKER) return "BLE hangszóró";
