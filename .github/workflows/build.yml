              void renderBlocks(boolean keepView) {
                  int topScroll = topBox.getScrollY();
                  int bottomScroll = bottomBox.getScrollY();
                  int topSel = Math.max(0, topBox.getSelectionStart());
                  int bottomSel = Math.max(0, bottomBox.getSelectionStart());
                  boolean topHadFocus = topBox.hasFocus();
                  boolean bottomHadFocus = bottomBox.hasFocus();
          
                  StringBuilder top = new StringBuilder();
                  StringBuilder bottom = new StringBuilder();
                  topRanges.clear();
                  bottomRanges.clear();
          
                  int visibleIndex = 0;
                  for(int i=0;i<textBlocks.size();i++) {
                      TextBlock b = textBlocks.get(i);
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
                      if(bt.trim().length() == 0 && bb.trim().length() == 0) continue;
          
                      if(visibleIndex > 0) {
                          top.append("\n");
                          bottom.append("\n");
                      }
          
                      int ts = top.length();
                      top.append(bt);
                      int te = top.length();
                      topRanges.add(new int[]{ts, te});
          
                      int bs = bottom.length();
                      bottom.append(bb);
                      int be = bottom.length();
                      bottomRanges.add(new int[]{bs, be});
                      visibleIndex++;
                  }
          
                  programmaticChange = true;
                  try {
                      topBox.setText(top.toString());
                      bottomBox.setText(bottom.toString());
                      if(keepView) {
                          topBox.setSelection(Math.min(topSel, topBox.getText().length()));
                          bottomBox.setSelection(Math.min(bottomSel, bottomBox.getText().length()));
                          if(topHadFocus) topBox.requestFocus();
                          if(bottomHadFocus) bottomBox.requestFocus();
                          topBox.post(() -> topBox.scrollTo(0, topScroll));
                          bottomBox.post(() -> bottomBox.scrollTo(0, bottomScroll));
                      } else {
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      }
                  } finally {
                      programmaticChange = false;
                  }
              }
          
