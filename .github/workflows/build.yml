              class InterpreterFloatingButton extends View {
                  int bgColor = Color.rgb(150,45,45);
                  boolean headsetMode = true;
          
                  final android.graphics.Paint paint = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
          
                  InterpreterFloatingButton(Context c) {
                      super(c);
                      setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                  }
          
                  void setState(boolean active, boolean headsetModeNow) {
                      bgColor = active ? Color.rgb(30,135,70) : Color.rgb(150,45,45);
                      headsetMode = headsetModeNow;
                      invalidate();
                  }
          
                  @Override protected void onDraw(android.graphics.Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth();
                      float h = getHeight();
                      float cx = w / 2f;
                      float cy = h / 2f;
                      float r = Math.min(w, h) * 0.47f;
          
                      paint.setStyle(android.graphics.Paint.Style.FILL);
                      paint.setColor(bgColor);
                      canvas.drawCircle(cx, cy, r, paint);
                      if(headsetMode) drawBluetoothIcon(canvas, cx, cy, r);
                      else drawSpeakerIcon(canvas, cx, cy, r);
                  }
          
                  void setupWhiteStroke(float r) {
                      paint.setColor(Color.WHITE);
                      paint.setStyle(android.graphics.Paint.Style.STROKE);
                      paint.setStrokeCap(android.graphics.Paint.Cap.ROUND);
                      paint.setStrokeJoin(android.graphics.Paint.Join.ROUND);
                      paint.setStrokeWidth(Math.max(4f, r * 0.105f));
                  }
          
                  void drawBluetoothIcon(android.graphics.Canvas canvas, float cx, float cy, float r) {
                      setupWhiteStroke(r);
                      android.graphics.Path p = new android.graphics.Path();
                      p.moveTo(cx - r * 0.08f, cy - r * 0.72f);
                      p.lineTo(cx + r * 0.36f, cy - r * 0.34f);
                      p.lineTo(cx - r * 0.25f, cy);
                      p.lineTo(cx + r * 0.36f, cy + r * 0.34f);
                      p.lineTo(cx - r * 0.08f, cy + r * 0.72f);
                      p.lineTo(cx - r * 0.08f, cy - r * 0.72f);
                      canvas.drawPath(p, paint);
                      canvas.drawLine(cx - r * 0.42f, cy - r * 0.34f, cx - r * 0.08f, cy, paint);
                      canvas.drawLine(cx - r * 0.42f, cy + r * 0.34f, cx - r * 0.08f, cy, paint);
                  }
          
                  void drawSpeakerIcon(android.graphics.Canvas canvas, float cx, float cy, float r) {
                      setupWhiteStroke(r);
                      paint.setStyle(android.graphics.Paint.Style.FILL);
                      android.graphics.Path body = new android.graphics.Path();
                      body.moveTo(cx - r * 0.62f, cy - r * 0.22f);
                      body.lineTo(cx - r * 0.34f, cy - r * 0.22f);
                      body.lineTo(cx + r * 0.02f, cy - r * 0.52f);
                      body.lineTo(cx + r * 0.02f, cy + r * 0.52f);
                      body.lineTo(cx - r * 0.34f, cy + r * 0.22f);
                      body.lineTo(cx - r * 0.62f, cy + r * 0.22f);
                      body.close();
                      canvas.drawPath(body, paint);
                      paint.setStyle(android.graphics.Paint.Style.STROKE);
                      paint.setStrokeWidth(Math.max(4f, r * 0.09f));
                      canvas.drawArc(new android.graphics.RectF(cx - r * 0.02f, cy - r * 0.38f, cx + r * 0.52f, cy + r * 0.38f), -45, 90, false, paint);
                      canvas.drawArc(new android.graphics.RectF(cx + r * 0.10f, cy - r * 0.62f, cx + r * 0.82f, cy + r * 0.62f), -45, 90, false, paint);
                  }
              }
          
              void ensureInterpreterFloatingButton() {
                  if(!interpreterMode) { hideInterpreterFloatingButton(); return; }
                  if(!canDrawOverlayNow()) { requestOverlayPermission(); return; }
                  if(interpreterFloatingView != null) { refreshInterpreterFloatingButton(); return; }
                  try {
                      if(floatingWindowManager == null) floatingWindowManager=(android.view.WindowManager)getSystemService(WINDOW_SERVICE);
                      InterpreterFloatingButton b = new InterpreterFloatingButton(this);
                      final android.view.WindowManager.LayoutParams lp=floatingParams(116,116,Gravity.LEFT|Gravity.CENTER_VERTICAL);
                      lp.x=interpreterFloatingX; lp.y=interpreterFloatingY;
                      final int[] down=new int[4]; final boolean[] moved=new boolean[1]; final boolean[] longDone=new boolean[1];
                      final Runnable modeLongPress = () -> {
                          if(!moved[0]) {
                              longDone[0] = true;
                              try { b.performHapticFeedback(android.view.HapticFeedbackConstants.LONG_PRESS); } catch(Exception ignored) {}
                              toggleInterpreterAudioModeFromFloating();
                          }
                      };
                      b.setOnTouchListener((v,ev)->{
                          if(ev.getAction()==android.view.MotionEvent.ACTION_DOWN){
                              down[0]=lp.x;down[1]=lp.y;down[2]=(int)ev.getRawX();down[3]=(int)ev.getRawY();moved[0]=false;longDone[0]=false;
                              floatingLongPressHandler.removeCallbacks(modeLongPress);
                              floatingLongPressHandler.postDelayed(modeLongPress,1800);
                              return true;
                          }
                          if(ev.getAction()==android.view.MotionEvent.ACTION_MOVE){
                              int dx=(int)ev.getRawX()-down[2],dy=(int)ev.getRawY()-down[3];
                              if(Math.abs(dx)>24||Math.abs(dy)>24){moved[0]=true;floatingLongPressHandler.removeCallbacks(modeLongPress);}
                              if(moved[0]){lp.x=Math.max(0,down[0]+dx);lp.y=down[1]+dy;try{floatingWindowManager.updateViewLayout(b,lp);}catch(Exception ignored){}}
                              return true;
                          }
                          if(ev.getAction()==android.view.MotionEvent.ACTION_UP){
                              floatingLongPressHandler.removeCallbacks(modeLongPress);
                              interpreterFloatingX=lp.x;interpreterFloatingY=lp.y;save();
                              if(!moved[0] && !longDone[0]) {
                                  try { b.performHapticFeedback(android.view.HapticFeedbackConstants.KEYBOARD_TAP); } catch(Exception ignored) {}
                                  toggleInterpreterFloatingRun();
                              }
                              return true;
                          }
                          if(ev.getAction()==android.view.MotionEvent.ACTION_CANCEL){floatingLongPressHandler.removeCallbacks(modeLongPress);return true;}
                          return true;
                      });
                      interpreterFloatingView=b;
                      floatingWindowManager.addView(interpreterFloatingView,lp);
                      refreshInterpreterFloatingButton();
                  } catch(Exception e) { interpreterFloatingView=null; }
              }
          
              void refreshInterpreterFloatingButton() {
                  if(!(interpreterFloatingView instanceof InterpreterFloatingButton)) return;
                  InterpreterFloatingButton b=(InterpreterFloatingButton)interpreterFloatingView;
                  b.setState(streaming, "headset".equals(interpreterAudioMode));
              }
          
          
