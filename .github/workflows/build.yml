              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("settings", MODE_PRIVATE);
                  load();
                  backgroundScreenAllowed = false;
                  interpreterMode = false;
                  interpreterAudioMode = "off";
                  openAiNoiseMode = "off";
                  applyV109StableDefaultsOnce();
                  ui();
                  reqMic();
                  reqNotifications();
                  initTts();
                  new Handler().postDelayed(() -> { if(floatingTranslatorEnabled) ensureFloatingTranslator(); }, 600);
              }

              void load() {
                  apiKey = sp.getString("apiKey", "");
                  model = sp.getString("model", "gpt-realtime-2");
                  // V117: ehhez a kétirányú FR/HU tolmács-logikához maradunk a standard /v1/realtime + gpt-realtime-2 útvonalon.
                  // A gpt-realtime-translate külön /v1/realtime/translations végpontot és egyirányú target output nyelvet várna,
                  // ezért itt nem engedjük visszatölteni régi mentésből sem.
                  if(!"gpt-realtime-2".equals(model)) model = "gpt-realtime-2";
                  profile = sp.getString("profile", "general");
                  soundProfile = sp.getString("soundProfile", "general");
                  mode = sp.getString("mode", "natural");
                  vadMode = sp.getString("vadMode", "medium");
                  delayMode = sp.getString("delayMode", "xhigh");
                  micGateMode = sp.getString("micGateMode", "gate_low");
                  audioSourceMode = sp.getString("audioSourceMode", "unprocessed");
                  androidEffectsMode = sp.getString("androidEffectsMode", "ns_only");
                  openAiNoiseMode = "off"; // V117: OpenAI zajszűrés fixen kikapcsolva
                  interpreterMode = sp.getBoolean("interpreterMode", false);
                  lastInterpreterAudioMode = sp.getString("lastInterpreterAudioMode", "headset");
                  if(!"speaker".equals(lastInterpreterAudioMode) && !"headset".equals(lastInterpreterAudioMode)) lastInterpreterAudioMode = "headset";
                  interpreterAudioMode = sp.getString("interpreterAudioMode", interpreterMode ? lastInterpreterAudioMode : "off");
                  if("off".equals(interpreterAudioMode)) interpreterMode = false;
                  else {
                      interpreterMode = true;
                      if("speaker".equals(interpreterAudioMode) || "headset".equals(interpreterAudioMode)) lastInterpreterAudioMode = interpreterAudioMode;
                  }
                  mirrorBottomMode = sp.getBoolean("mirrorBottomMode", false);
                  floatingTranslatorEnabled = sp.getBoolean("floatingTranslatorEnabled", false);
                  floatingButtonX = sp.getInt("floatingButtonX", 24);
                  floatingButtonY = sp.getInt("floatingButtonY", 0);
                  topLang = sp.getString("topLang", "fr");
                  bottomLang = sp.getString("bottomLang", "hu");
                  if("normal".equals(vadMode)) vadMode = "medium";
              }

              void applyV109StableDefaultsOnce() {
                  // V117: menü-átszervezés. A V114 beállításokat nem írjuk felül frissítéskor.
                  // Új telepítésnél a korábbi stabil alapok maradnak, a háttér mód továbbra is minden induláskor kikapcsolt.
                  int last = sp.getInt("stableDefaultsVersion", 0);
                  if(last < 114) {
                      profile = "general";
                      soundProfile = "general";
                      mode = "natural";
                      vadMode = "medium";
                      delayMode = "xhigh";
                      micGateMode = "gate_low";
                      audioSourceMode = "unprocessed";
                      androidEffectsMode = "ns_only";
                      openAiNoiseMode = "off";
                      interpreterMode = false;
                      interpreterAudioMode = "off";
                  }
                  if(last < 115) {
                      if(soundProfile == null || soundProfile.length() == 0) soundProfile = "general";
                      sp.edit().putInt("stableDefaultsVersion", 115).apply();
                      save();
                  }
              }

              void save() {
                  sp.edit()
                    .putString("apiKey", apiKey)
                    .putString("model", model)
                    .putString("profile", profile)
                    .putString("soundProfile", soundProfile)
                    .putString("mode", mode)
                    .putString("vadMode", vadMode)
                    .putString("delayMode", delayMode)
                    .putString("micGateMode", micGateMode)
                    .putString("audioSourceMode", audioSourceMode)
                    .putString("androidEffectsMode", androidEffectsMode)
                    .putString("openAiNoiseMode", openAiNoiseMode)
                    .putBoolean("interpreterMode", interpreterMode)
                    .putString("interpreterAudioMode", interpreterAudioMode)
                    .putString("lastInterpreterAudioMode", lastInterpreterAudioMode)
                    .putBoolean("mirrorBottomMode", mirrorBottomMode)
                    .putBoolean("floatingTranslatorEnabled", floatingTranslatorEnabled)
                    .putInt("floatingButtonX", floatingButtonX)
                    .putInt("floatingButtonY", floatingButtonY)
                    .putString("topLang", topLang)
                    .putString("bottomLang", bottomLang)
                    .apply();
              }

