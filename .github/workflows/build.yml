                      menuItem("AI modell", modelLabel(), false),
                      menuItem("Beszélgetési profil", profileLabel(), false),
                      menuItem("Fordítás stílusa", modeLabel(), false),
                      menuItem("Beszéd felismerése", vadLabel(), false),
                      menuItem("Beszédfelismerés pontossága", delayLabel(), false),
                      menuItem("Mikrofon érzékenysége", micGateLabel(), false),
                      menuItem("Tolmács mód", interpreterLabel(), interpreterMode),
                      menuItem("Ablakkezelés", "másolás, teljes törlés, tükör mód", false),
