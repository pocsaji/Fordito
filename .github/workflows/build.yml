          package com.attila.forditokonzol;
          
          import java.util.HashSet;
          import java.util.Set;
          import okhttp3.Call;
          
          final class RequestRegistry {
              private final Set<Call> calls = new HashSet<>();
          
              synchronized Call track(Call call) {
                  if(call != null) calls.add(call);
                  return call;
              }
          
              synchronized void complete(Call call) {
                  if(call != null) calls.remove(call);
              }
          
              synchronized void cancelAll() {
                  Call[] snapshot = calls.toArray(new Call[0]);
                  calls.clear();
                  for(Call call : snapshot) {
                      try { call.cancel(); } catch(Exception ignored) {}
                  }
              }
          }
