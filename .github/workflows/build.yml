              boolean hasKey() {
                  return apiKey != null && apiKey.trim().startsWith("sk-");
              }

              void start(boolean withAudio) {
                  clipboardResponseMode = false;
                  if(!hasKey()) { showApi(); return; }
                  if(withAudio && Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) { reqMic(); return; }
                  if(withAudio && sessionStart == 0L) sessionStart = System.currentTimeMillis();
                  if(withAudio && System.currentTimeMillis() - sessionStart > 20L*60L*1000L) { confirm(); return; }
                  if(withAudio) startBackgroundForegroundServiceIfAllowed();

                  state.setText("kapcsolódás");
                  client = new OkHttpClient.Builder().readTimeout(0, TimeUnit.MILLISECONDS).build();
                  Request req = new Request.Builder()
                    .url("wss://api.openai.com/v1/realtime?model=" + model)
                    .addHeader("Authorization", "Bearer " + apiKey.trim())
                    .build();

                  ws = client.newWebSocket(req, new WebSocketListener() {
                      @Override public void onOpen(WebSocket w, Response r) {
                          connected = true;
                          runOnUiThread(() -> {
                              sessionUpdate();
                              if(withAudio) {
                                  pendingAudioStartAfterSessionUpdate = true;
                                  state.setText("mikrofon előkészítés");
                                  new Handler().postDelayed(() -> {
                                      if(pendingAudioStartAfterSessionUpdate && connected && ws != null && !streaming) {
                                          pendingAudioStartAfterSessionUpdate = false;
                                          audioLoop();
                                      }
                                  }, 1200);
                              } else {
                                  state.setText("fordítási kapcsolat");
                              }
                              updateButtons();
                              if(!withAudio && pendingManualText.length() > 0) {
                                  String p = pendingManualText;
                                  pendingManualText = "";
                                  new Handler().postDelayed(() -> sendManualText(p), 500);
                              }
                          });
                      }

                      @Override public void onMessage(WebSocket w, String s) {
                          event(s);
                      }

                      @Override public void onFailure(WebSocket w, Throwable t, Response r) {
                          runOnUiThread(() -> handleConnectionFailure(t));
                      }

                      @Override public void onClosed(WebSocket w, int c, String reason) {
                          connected = false;
                          runOnUiThread(() -> {
                              state.setText("lezárva");
                              updateButtons();
                          });
                      }
                  });
              }

              String liveTranscriptionPrompt() {
                  String top = code(topLang).toUpperCase(Locale.ROOT);
                  String bottom = code(bottomLang).toUpperCase(Locale.ROOT);
                  return "Transcribe live microphone speech as accurately and verbatim as possible. " +
                      "The speaker may use only these two languages: " + top + " and " + bottom + ". " +
                      "Do not translate here. Do not invent missing words. Keep short replies, fragments, names, places and numbers. " +
                      "If the audio is noisy, prefer the literal heard words and leave uncertainty out rather than hallucinating a full sentence.";
              }

              void sessionUpdate() {
                  try {
                      JSONObject session = new JSONObject();
                      session.put("type", "realtime");
                      session.put("model", model);
                      session.put("instructions", instructions());
                      session.put("output_modalities", new JSONArray().put("text"));

                      // V240: hanglánc-próba: Android hangforrás + Android effektek + OpenAI zajszűrés menüből állítható.
                      // Tapasztalat: kamionfülkében a túl szigorú helyi kapu levágta a beszéd elejét.
                      // Ezért az alapérték érzékenyebb: a beszéd sértetlenül menjen át, az OpenAI VAD dönt.
                      JSONObject vad = new JSONObject();
                      vad.put("type", "server_vad");
                      vad.put("threshold", vadThreshold());
                      vad.put("prefix_padding_ms", 700);
                      vad.put("silence_duration_ms", vadSilenceMs());
                      // Beszédfelismerés/fordítás közben nem kérünk automatikus válaszblokkot.
                      vad.put("create_response", false);

                      JSONObject input = new JSONObject();
                      JSONObject format = new JSONObject();
                      format.put("type", "audio/pcm");
                      format.put("rate", 24000);
                      input.put("format", format);
                      input.put("turn_detection", vad);

                      // V240: OpenAI Realtime oldali zajszűrés menüből.
                      // near_field: telefon/headset közeli beszéd. far_field: távolabb lévő mikrofon.
                      if(!"off".equals(openAiNoiseMode)) {
                          JSONObject nr = new JSONObject();
                          nr.put("type", openAiNoiseMode);
                          input.put("noise_reduction", nr);
                      }

                      // V312: STT átállítva gpt-4o-transcribe modellre.
                      // A teljes lánc változatlan marad: mikrofon -> Realtime input audio -> transcript -> gpt-realtime-2 fordítás.
                      // Nem állítunk fix language mezőt, mert ugyanabban a munkamenetben TOP és BOTTOM nyelv is megszólalhat.
                      // A 4o-transcribe támogat promptot, ezért a kiválasztott nyelvpárt és a szó szerinti STT-fegyelmet itt is megadjuk.
                      // A régi gpt-realtime-whisper-specifikus delay mezőt szándékosan nem küldjük, mert az új modellnél nem erre építünk.
                      JSONObject tr = new JSONObject();
                      tr.put("model", "gpt-4o-transcribe");
                      tr.put("prompt", liveTranscriptionPrompt());
                      input.put("transcription", tr);

                      JSONObject audio = new JSONObject();
                      audio.put("input", input);

                      session.put("audio", audio);

                      JSONObject evt = new JSONObject();
                      evt.put("type", "session.update");
                      evt.put("session", session);
                      ws.send(evt.toString());
                  } catch(Exception e) {
                      android.util.Log.e("Fordito", "session hiba", e);
                  }
              }

              String pairRules() {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "Selected conversation pair is locked to exactly two languages: TOP=" + top + ", BOTTOM=" + bottom + ". " +
                    "For live microphone translation, do not consider or name any third language. " +
                    "Every meaningful input must be resolved as either TOP or BOTTOM, then translated into the other one. " +
                    "Short answers and short questions are valid speech and must be translated. " +
                    "If the transcript is uncertain, repair it only toward the closer of TOP or BOTTOM. " +
                    "Only ignore the block when it is clearly not human speech or has no translatable content. ";
              }

              String mildPreviousLiveContext() {
                  String lang = lastSureLiveSourceLang == null ? "" : lastSureLiveSourceLang.trim().toUpperCase(Locale.ROOT);
                  String prev = lastSureLiveOriginal == null ? "" : lastSureLiveOriginal.trim();
                  String prevTr = lastSureLiveTranslation == null ? "" : lastSureLiveTranslation.trim();
                  if(lang.length() == 0 || prev.length() == 0) return "";
                  if(prev.length() > 220) prev = prev.substring(prev.length() - 220);
                  if(prevTr.length() > 220) prevTr = prevTr.substring(prevTr.length() - 220);
                  prev = prev.replace("\n", " ").replace("\r", " ").replaceAll("\\s+", " ").trim();
                  prevTr = prevTr.replace("\n", " ").replace("\r", " ").replaceAll("\\s+", " ").trim();
                  return "Previous confirmed live block for continuity only: SOURCE_LANG=" + lang + "; ORIGINAL=" + prev +
                         (prevTr.length() > 0 ? "; PREVIOUS_TRANSLATION=" + prevTr : "") + ". " +
                         "Use this to keep pronouns, names, numbers and sentence continuation consistent across short 4-second audio chunks. " +
                         "Do not repeat the previous block. Translate only the current TEXT. The current block may freely switch to the other selected language. ";
              }

              String instructions() {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "Every word must be output in full. Never replace letters with asterisks or symbols. Never mask, redact, soften, sanitize, euphemize, hide, or partially replace any profanity, insult, slang, vulgar, sexual, rude, or emotional wording. If such wording appears in the input or is required by the translation, write the complete word exactly in the target language. " + "You are a live two-language interpreter. Output text only. No explanations. " +
                    pairRules() +
                    "The user may switch between TOP and BOTTOM while the microphone is running. Every completed speech block must be classified again using only the selected pair. " +
                    "Do not turn background noise, engine hum, wind, radio, clicks or breathing into speech. If meaningful human speech is not present, output nothing. " +
                    "Do not wait for a long monologue. Treat every complete sentence, short clause, numbered item, or list item as a finished block. " +
                    "For every completed block return exactly three lines: SOURCE_LANG: <" + top + " or " + bottom + "> then ORIGINAL: <verbatim original text in the detected selected language> then TRANSLATION: <natural translation into the other selected language>. " +
                    "Every word must be output in full. Never replace letters with asterisks or symbols. Do not mask, soften, sanitize, label, bracket, star out, or replace profanity, vulgarity, insults, sexual words, slang, or rude wording. Preserve their meaning directly in ORIGINAL and TRANSLATION. Never output square-bracket category placeholders or asterisk-masked words. " +
                    "Keep ORIGINAL short and readable. Correct only obvious speech recognition mistakes; do not invent missing facts. " +
                    "Conversation profile: " + profilePrompt() + " " +
                    "Translation mode: " + modePrompt();
              }

              String manualBlockInstructions() {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "Every word must be output in full. Never replace letters with asterisks or symbols. Never mask, redact, soften, sanitize, euphemize, hide, or partially replace any profanity, insult, slang, vulgar, sexual, rude, or emotional wording. If such wording appears in the input or is required by the translation, write the complete word exactly in the target language. " +
                    "You are a full-window speech-transcript repair and translation engine. " +
                    "The user message contains SOURCE_LANG, TARGET_LANG and TEXT fields. " +
                    "First interpret the entire TEXT as one complete speech/monologue from the active window. Use the full text to understand who is speaking to whom, the situation, purpose, tone and relationship before translating. " +
                    "Selected context profile: " + clipboardContextPrompt() +
                    "Silently turn the rough transcript into clear, coherent source-language meaning before translation. You may gently repair obvious speech-recognition errors, broken word forms, misplaced fragments and awkward spoken structure when the intended meaning is clear from the whole text, the selected language pair " + top + "/" + bottom + ", and the selected context profile. " +
                    "Then translate the complete repaired meaning from SOURCE_LANG to TARGET_LANG as one coherent, native-sounding text. Translate meaning and communicative intent, not word order. Use the natural conventions, idioms, forms of address, time expressions and sentence structure of the TARGET_LANG, as a native speaker would in the same situation. " +
                    "Keep the original facts and intent unchanged. Preserve paragraphs and line breaks where reasonable. " +
                    "Return ONLY the translated full text. Never include labels such as SOURCE_LANG, TARGET_LANG, ORIGINAL, TEXT or TRANSLATION. " +
                    "Every word must be output in full. Never replace letters with asterisks or symbols. Do not mask, soften, sanitize, label, bracket, star out, or replace profanity, vulgarity, insults, sexual words, slang, or rude wording. Preserve their meaning directly in the translation. Never output square-bracket category placeholders or asterisk-masked words. " +
                    "No markdown, no quotes, no explanation. Keep meaning, context, speaker relationship and tone. " + modePrompt();
              }

              String liveBlockInstructions(boolean ignoredSourceIsTop) {
                  String top = code(topLang);
                  String bottom = code(bottomLang);
                  return "Every word must be output in full. Never replace letters with asterisks or symbols. Never mask, redact, soften, sanitize, euphemize, hide, or partially replace any profanity, insult, slang, vulgar, sexual, rude, or emotional wording. If such wording appears in the input or is required by the translation, write the complete word exactly in the target language. " +
