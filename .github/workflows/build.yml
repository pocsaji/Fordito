              private String collapseAdjacentRepeatedPhrase(String raw) {
                  if (raw == null) return "";
                  String text = raw.trim().replaceAll("\\s+", " ");
                  if (text.isEmpty()) return text;
                  String[] words = text.split("\\s+");
                  if (words.length < 6) return text;
          
                  ArrayList<String> output = new ArrayList<>();
                  int index = 0;
                  while (index < words.length) {
                      boolean collapsed = false;
                      int maximumPhraseLength = Math.min(10, (words.length - index) / 2);
                      for (int phraseLength = maximumPhraseLength; phraseLength >= 3; phraseLength--) {
                          boolean same = true;
                          for (int offset = 0; offset < phraseLength; offset++) {
                              String first = normalizeHash(words[index + offset]);
                              String second = normalizeHash(words[index + phraseLength + offset]);
                              if (first.isEmpty() || !first.equals(second)) {
                                  same = false;
                                  break;
                              }
                          }
                          if (same) {
                              for (int offset = 0; offset < phraseLength; offset++) output.add(words[index + offset]);
                              index += phraseLength * 2;
                              collapsed = true;
                              break;
                          }
