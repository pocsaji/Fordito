              void enterManualEditMode(boolean top) {
                  if(finalizingStop) return;
                  manualTopSource = top;
                  topActive = top;
                  invalidateManualWindowRequests();
          
                  // Kattintás, fókusz és gépelés miatt nem állítjuk le a mikrofont.
                  if(!streaming) {
                      responseInProgress = false;
                      invalidateSpeechTranslationStateKeepSession();
                  }
                  updateButtons();
              }
          
              void renderBlocks() {
