              ArrayList<String> splitTextToBlocks(String text) {
                  ArrayList<String> out = new ArrayList<>();
                  if(text == null) return out;
                  String[] paragraphs = text.split("\\n", -1);
                  for(String paragraph: paragraphs) {
                      String p = paragraph.trim();
                      if(p.length() == 0) continue;
                      StringBuilder block = new StringBuilder();
                      int sentenceCount = 0;
                      for(int i=0;i<p.length();i++) {
                          char ch = p.charAt(i);
                          block.append(ch);
                          if(ch == '.' || ch == '!' || ch == '?' || ch == '…') sentenceCount++;
                          boolean sentenceLimit = sentenceCount >= MAX_BLOCK_SENTENCES;
                          boolean charLimit = block.length() >= MAX_BLOCK_CHARS;
                          boolean softBreak = (sentenceLimit || charLimit) && (i == p.length()-1 || Character.isWhitespace(p.charAt(i+1)));
                          if(softBreak) {
                              addCleanBlock(out, block.toString());
                              block.setLength(0);
                              sentenceCount = 0;
                          }
                      }
                      addCleanBlock(out, block.toString());
                  }
                  return out;
              }

              void addCleanBlock(ArrayList<String> out, String s) {
                  if(s == null) return;
                  String clean = s.trim();
                  if(clean.length() > 0) out.add(clean);
              }

              void renderPeerWindow(boolean editedTop) {
                  // A szerkesztett ablakban a felhasználó éppen gépel: ahhoz nem nyúlunk,
                  // hogy ne ugorjon a kurzor. A másik ablakot viszont azonnal a blokklistából
                  // rajzoljuk újra, így nem marad benne régi/stale fordítás.
                  EditText peer = editedTop ? bottomBox : topBox;
                  int peerScroll = peer.getScrollY();
                  int peerSel = Math.max(0, peer.getSelectionStart());
                  boolean peerHadFocus = peer.hasFocus();

                  StringBuilder sb = new StringBuilder();
                  for(int i=0;i<textBlocks.size();i++) {
                      TextBlock b = textBlocks.get(i);
                      String part = editedTop ? b.bottomText : b.topText;
                      sb.append(part == null ? "" : part);
                      if(i < textBlocks.size()-1) sb.append("\n\n");
                  }

                  programmaticChange = true;
                  try {
                      peer.setText(sb.toString());
                      peer.setSelection(Math.min(peerSel, peer.getText().length()));
                      if(peerHadFocus) peer.requestFocus();
                      peer.post(() -> peer.scrollTo(0, peerScroll));
                  } finally {
                      programmaticChange = false;
                  }
              }

              void addBlock(boolean sourceIsTop, String original, String translation) {
                  ArrayList<String> originals = splitTextToBlocks(original);
                  ArrayList<String> translations = splitTextToBlocks(translation);
                  int count = Math.max(originals.size(), translations.size());
                  if(count == 0) return;
                  for(int i=0;i<count;i++) {
                      TextBlock b = new TextBlock();
                      String o = i < originals.size() ? originals.get(i) : "";
                      String t = i < translations.size() ? translations.get(i) : "";
                      if(sourceIsTop) {
                          b.topText = o;
                          b.bottomText = t;
                      } else {
                          b.topText = t;
                          b.bottomText = o;
                      }
                      String srcSide = sourceIsTop ? b.topText : b.bottomText;
                      String tgtSide = sourceIsTop ? b.bottomText : b.topText;
                      b.sourceTop = sourceIsTop;
                      b.translatedOk = srcSide != null && srcSide.trim().length() > 0 && tgtSide != null && tgtSide.trim().length() > 0;
                      textBlocks.add(b);
                  }
                  renderBlocks();
              }

              void renderBlocks() {
                  renderBlocks(false);
              }

              void renderBlocksKeepView() {
                  // V342: normál élő frissítéskor legfeljebb az utolsó két látható blokk változhat.
                  // A régebbi stabil előtaghoz nem nyúlunk. Szerkezeti műveleteknél marad a teljes renderBlocks().
                  renderLastTwoVisibleBlocks(!(streaming || uiLockedForSpeech || finalizingStop));
              }

              void renderLastTwoVisibleBlocks(boolean keepView) {
                  ArrayList<TextBlock> visible = new ArrayList<>();
                  for(TextBlock b : textBlocks) {
                      if(b == null) continue;
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
                      if(bt.trim().length() == 0 && bb.trim().length() == 0) continue;
                      visible.add(b);
                  }

                  if(visible.size() <= 2 || topRanges.size() < visible.size() - 1 || bottomRanges.size() < visible.size() - 1) {
                      renderBlocks(keepView);
                      return;
                  }

                  int firstMutable = visible.size() - 2;
                  if(firstMutable < 0 || firstMutable >= topRanges.size() || firstMutable >= bottomRanges.size()) {
                      renderBlocks(keepView);
                      return;
                  }

                  int topCut = topRanges.get(firstMutable)[0];
                  int bottomCut = bottomRanges.get(firstMutable)[0];
                  if(topCut < 0 || topCut > topBox.getText().length() ||
                     bottomCut < 0 || bottomCut > bottomBox.getText().length()) {
                      renderBlocks(keepView);
                      return;
                  }

                  StringBuilder topTail = new StringBuilder();
                  StringBuilder bottomTail = new StringBuilder();
                  ArrayList<int[]> newTopTailRanges = new ArrayList<>();
                  ArrayList<int[]> newBottomTailRanges = new ArrayList<>();

                  for(int i=firstMutable; i<visible.size(); i++) {
                      TextBlock b = visible.get(i);
                      if(i > firstMutable) {
                          topTail.append("\n");
                          bottomTail.append("\n");
                      }
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;

                      int ts = topCut + topTail.length();
                      topTail.append(bt);
                      newTopTailRanges.add(new int[]{ts, topCut + topTail.length()});

                      int bs = bottomCut + bottomTail.length();
                      bottomTail.append(bb);
                      newBottomTailRanges.add(new int[]{bs, bottomCut + bottomTail.length()});
                  }

                  int topScroll = topBox.getScrollY();
                  int bottomScroll = bottomBox.getScrollY();
                  int topSel = Math.max(0, topBox.getSelectionStart());
                  int bottomSel = Math.max(0, bottomBox.getSelectionStart());
                  boolean topHadFocus = topBox.hasFocus();
                  boolean bottomHadFocus = bottomBox.hasFocus();

                  programmaticChange = true;
                  try {
                      topBox.getText().replace(topCut, topBox.getText().length(), topTail.toString());
                      bottomBox.getText().replace(bottomCut, bottomBox.getText().length(), bottomTail.toString());

                      while(topRanges.size() > firstMutable) topRanges.remove(topRanges.size() - 1);
                      while(bottomRanges.size() > firstMutable) bottomRanges.remove(bottomRanges.size() - 1);
                      topRanges.addAll(newTopTailRanges);
                      bottomRanges.addAll(newBottomTailRanges);

                      if(keepView) {
                          topBox.setSelection(Math.min(topSel, topBox.getText().length()));
                          bottomBox.setSelection(Math.min(bottomSel, bottomBox.getText().length()));
                          if(topHadFocus) topBox.requestFocus();
                          if(bottomHadFocus) bottomBox.requestFocus();
                          topBox.post(() -> topBox.scrollTo(0, topScroll));
                          bottomBox.post(() -> bottomBox.scrollTo(0, bottomScroll));
                      } else {
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      }
                  } finally {
                      programmaticChange = false;
                  }
              }

              void renderBlocks(boolean keepView) {
                  int topScroll = topBox.getScrollY();
                  int bottomScroll = bottomBox.getScrollY();
                  int topSel = Math.max(0, topBox.getSelectionStart());
                  int bottomSel = Math.max(0, bottomBox.getSelectionStart());
                  boolean topHadFocus = topBox.hasFocus();
                  boolean bottomHadFocus = bottomBox.hasFocus();

                  StringBuilder top = new StringBuilder();
                  StringBuilder bottom = new StringBuilder();
                  topRanges.clear();
                  bottomRanges.clear();

                  int visibleIndex = 0;
                  for(int i=0;i<textBlocks.size();i++) {
                      TextBlock b = textBlocks.get(i);
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
                      if(bt.trim().length() == 0 && bb.trim().length() == 0) continue;

                      if(visibleIndex > 0) {
                          top.append("\n");
                          bottom.append("\n");
                      }

                      int ts = top.length();
                      top.append(bt);
                      int te = top.length();
                      topRanges.add(new int[]{ts, te});

                      int bs = bottom.length();
                      bottom.append(bb);
                      int be = bottom.length();
                      bottomRanges.add(new int[]{bs, be});
                      visibleIndex++;
                  }

                  programmaticChange = true;
                  try {
                      topBox.setText(top.toString());
                      bottomBox.setText(bottom.toString());
                      if(keepView) {
                          topBox.setSelection(Math.min(topSel, topBox.getText().length()));
                          bottomBox.setSelection(Math.min(bottomSel, bottomBox.getText().length()));
                          if(topHadFocus) topBox.requestFocus();
                          if(bottomHadFocus) bottomBox.requestFocus();
                          topBox.post(() -> topBox.scrollTo(0, topScroll));
                          bottomBox.post(() -> bottomBox.scrollTo(0, bottomScroll));
                      } else {
                          topBox.setSelection(topBox.getText().length());
                          bottomBox.setSelection(bottomBox.getText().length());
                      }
                  } finally {
                      programmaticChange = false;
                  }
              }

              void initTts() {
                  try {
                      tts = new TextToSpeech(this, status -> {
                          ttsReady = status == TextToSpeech.SUCCESS;
                          if(ttsReady && tts != null) {
                              tts.setSpeechRate(1.0f);
                              tts.setPitch(1.0f);
                              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override public void onStart(String utteranceId) {}
                                  @Override public void onDone(String utteranceId) {
                                      runOnUiThread(() -> finishTtsUtterance(utteranceId));
                                  }
                                  @Override public void onError(String utteranceId) {
                                      runOnUiThread(() -> finishTtsUtterance(utteranceId));
                                  }
                                  @Override public void onError(String utteranceId, int errorCode) {
                                      runOnUiThread(() -> finishTtsUtterance(utteranceId));
                                  }
                              });
                          }
                      });
                  } catch(Exception ignored) {}
              }

              void finishTtsUtterance(String utteranceId) {
                  try {
                      if(queuedTtsUtterances > 0) queuedTtsUtterances--;
                      if(queuedTtsUtterances <= 0) {
                          queuedTtsUtterances = 0;
                          currentTtsUtteranceId = "";
                          if("speaker".equals(interpreterAudioMode)) {
                              ttsMuteUntilMs = System.currentTimeMillis() + 500L;
                          }
                          ttsSpeaking = false;
                      }
                  } catch(Exception ignored) {}
              }

              Locale localeForTts(String lang) {
                  String l = lang == null ? "" : lang.toLowerCase(Locale.ROOT);
                  if(l.equals("hu")) return new Locale("hu", "HU");
                  if(l.equals("fr")) return Locale.FRANCE;
                  if(l.equals("en")) return Locale.ENGLISH;
                  if(l.equals("de")) return Locale.GERMAN;
                  if(l.equals("it")) return Locale.ITALIAN;
                  if(l.equals("es")) return new Locale("es", "ES");
                  if(l.equals("ro")) return new Locale("ro", "RO");
                  if(l.equals("hr")) return new Locale("hr", "HR");
                  if(l.equals("sk")) return new Locale("sk", "SK");
                  if(l.equals("sl")) return new Locale("sl", "SI");
                  return Locale.getDefault();
              }

              synchronized void speakFinalBlockOnce(TextBlock b, String translatedText, String targetLang) {
                  try {
                      if(b == null) return;
                      if(!interpreterMode || !ttsReady || tts == null) return;
                      if(translatedText == null) return;
                      String s = translatedText.trim();
                      if(s.isEmpty()) return;

                      // V344: élő blokknál kizárólag a speechSeq dönt.
                      // Nem hasonlítunk szöveget, nem várunk hiányzó sorszámra és nem rendezünk.
                      boolean liveSpeechBlock = b.speechSeq > 0;
                      if(liveSpeechBlock) {
                          if(spokenSpeechSeqs.contains(b.speechSeq)) return;
                      } else {
                          // Kézi FORDÍT út: ideiglenes blokk speechSeq nélkül.
                          if(b.ttsSpoken) return;
                      }

                      try { tts.setLanguage(localeForTts(targetLang)); } catch(Exception ignored) {}
                      try { tts.setSpeechRate(("hu".equals(targetLang) || "fr".equals(targetLang)) ? 1.17f : 1.10f); } catch(Exception ignored) {}

                      currentTtsUtteranceId = "fordito_tts_" + (++ttsSeq);
                      ttsSpeaking = true;
                      Bundle params = new Bundle();
                      int r = tts.speak(s, TextToSpeech.QUEUE_ADD, params, currentTtsUtteranceId);
                      if(r == TextToSpeech.SUCCESS) {
                          // Csak sikeres átadás után jelöljük felolvasottnak.
                          if(liveSpeechBlock) spokenSpeechSeqs.add(b.speechSeq);
                          else b.ttsSpoken = true;
                          queuedTtsUtterances++;
                      } else {
                          if(queuedTtsUtterances <= 0) {
                              ttsSpeaking = false;
                              currentTtsUtteranceId = "";
                          }
                      }
                  } catch(Exception ignored) {
                      ttsSpeaking = false;
                      currentTtsUtteranceId = "";
                  }
              }

              synchronized void speakManualOnce(String translatedText, String targetLang) {
                  TextBlock b = new TextBlock();
                  speakFinalBlockOnce(b, translatedText, targetLang);
              }

              void clearSpeakState() {
                  currentTtsUtteranceId = "";
                  queuedTtsUtterances = 0;
                  ttsSpeaking = false;
                  spokenSpeechSeqs.clear();
              }

