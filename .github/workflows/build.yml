              boolean usableClipboardText(String s) {
                  if(s == null) return false;
                  String x = s.trim();
                  if(x.length() == 0) return false;
                  if(x.equalsIgnoreCase("Fordítás folyamatban…")) return false;
                  if(x.equalsIgnoreCase("Értelmezés folyamatban…")) return false;
                  if(x.equalsIgnoreCase("fordítás")) return false;
                  if(x.equalsIgnoreCase("javított vagy fordítandó szöveg")) return false;
                  if(x.equalsIgnoreCase("vágólap szövege")) return false;
                  return true;
              }

              String bestClipboardCopyText() {
                  String tr = clipboardTranslationEdit == null ? "" : clipboardTranslationEdit.getText().toString().trim();
                  if(usableClipboardText(tr)) return tr;
                  String prep = clipboardPreparedEdit == null ? "" : clipboardPreparedEdit.getText().toString().trim();
                  if(usableClipboardText(prep)) return prep;
                  String raw = clipboardRawEdit == null ? "" : clipboardRawEdit.getText().toString().trim();
                  if(usableClipboardText(raw)) return raw;
                  return "";
              }

