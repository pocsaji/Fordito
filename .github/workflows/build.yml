              void clearPreRollAudio() {
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.clear();
                      preRollAudioBytes = 0;
                  }
              }
          
              void rememberPreRollAudio(byte[] data, int len) {
                  if(data == null || len <= 0) return;
                  byte[] copy = Arrays.copyOf(data, len);
                  int maxBytes = Math.max(1, STT_SAMPLE_RATE * 2 * PRE_ROLL_AUDIO_MS / 1000);
                  synchronized(preRollAudioChunks) {
                      preRollAudioChunks.add(copy);
                      preRollAudioBytes += copy.length;
                      while(preRollAudioBytes > maxBytes && !preRollAudioChunks.isEmpty()) {
                          byte[] old = preRollAudioChunks.poll();
                          if(old != null) preRollAudioBytes -= old.length;
                      }
                  }
              }
          
              ArrayList<byte[]> takePreRollAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(preRollAudioChunks) {
                      while(!preRollAudioChunks.isEmpty()) {
                          byte[] b = preRollAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      preRollAudioBytes = 0;
                  }
                  return out;
              }
          
              int pcm16MonoSttMs(int bytes) {
                  if(bytes <= 0) return 0;
                  return Math.max(1, (int)Math.round(bytes * 1000.0 / (STT_SAMPLE_RATE * 2.0)));
              }
          
              void clearPendingSpeechAudio() {
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.clear();
                      pendingSpeechAudioMs = 0;
                  }
              }
          
              void rememberPendingSpeechAudio(byte[] data, int len) {
                  if(data == null || len <= 0) return;
                  synchronized(pendingSpeechAudioChunks) {
                      pendingSpeechAudioChunks.add(Arrays.copyOf(data, len));
                      pendingSpeechAudioMs += pcm16MonoSttMs(len);
                  }
              }
          
              int pendingSpeechAudioDurationMs() {
                  synchronized(pendingSpeechAudioChunks) { return pendingSpeechAudioMs; }
              }
          
              ArrayList<byte[]> takePendingSpeechAudio() {
                  ArrayList<byte[]> out = new ArrayList<>();
                  synchronized(pendingSpeechAudioChunks) {
                      while(!pendingSpeechAudioChunks.isEmpty()) {
                          byte[] b = pendingSpeechAudioChunks.poll();
                          if(b != null) out.add(b);
                      }
                      pendingSpeechAudioMs = 0;
                  }
                  return out;
              }
          
