                  // API kulcsot, kiválasztott nyelvpárt és korábbi beszélgetést nem törlünk.
                  int last = sp.getInt("stableDefaultsVersion", 0);
                  if(last < 282) {
                      profile = "general";
                      soundProfile = "general";
                      mode = "natural";
                      vadEngineMode = "webrtc";
                      applyInputProfileValues();
                      interpreterMode = false;
                      interpreterAudioMode = "off";
                      mirrorBottomMode = false;
                      sp.edit().putInt("stableDefaultsVersion", 282).apply();
                      save();
                  }
              }
          
