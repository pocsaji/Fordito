          package com.attila.forditokonzol

          import android.content.Context
          import com.kaleyra.noise_filter.DeepFilterNet
          import com.rikorose.deepfilternet.NativeDeepFilterNet
          import kotlinx.coroutines.runBlocking
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlin.coroutines.resume

          object DeepFilterNetBridge {
              /**
               * A gyári NativeDeepFilterNetLoader működésével azonos betöltés:
               * a natív példány létrehozása után megvárjuk az onModelLoaded callbacket,
               * és csak a callbackben kapott, teljesen inicializált példányt adjuk vissza.
               */
              @JvmStatic
              fun createReady(context: Context): DeepFilterNet = runBlocking {
                  kotlinx.coroutines.withTimeout(20_000L) {
                      suspendCancellableCoroutine { continuation ->
                          val native = NativeDeepFilterNet(context.applicationContext)
                          native.onModelLoaded { loaded ->
                              if (continuation.isActive) continuation.resume(loaded)
                          }
                          continuation.invokeOnCancellation {
                              runCatching { native.release() }
                          }
                      }
                  }
              }
          }

          EOF

