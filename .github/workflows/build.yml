              void audioLoop() {
                  int sr = 24000;
                  int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  int bs = Math.max(min, 4800);
          
                  // V318: 24 kHz PCM16 mono marad. Buffer cél kb. 100 ms.
                  rec = makeBestAudioRecord(sr, bs);
                  if(rec == null) { runOnUiThread(() -> state.setText("mikrofon hiba")); return; }
                  streaming = true;
                  setSpeechUiLocked(false);
                  rec.startRecording();
                  runOnUiThread(() -> state.setText("mikrofon aktív"));
                  updateButtons();
          
                  audioExec.submit(() -> {
                      byte[] buf = new byte[bs];
                      clearPreRollAudio();
                      voiceSendActive = false;
                      trailingSilenceOpen = false;
                      lastVoiceChunkSentAtMs = 0L;
                      while(streaming && connected && rec != null) {
                          int read = rec.read(buf, 0, buf.length);
                          if(read > 0) {
                              try {
                                  // Tolmács mód nem módosíthatja a bemeneti beszédfelismerést.
                                  // Egyetlen kivétel: kihangosított telefon módnál TTS közben a mikrofon nem küld hangot,
                                  // hogy a saját felolvasott fordítás ne kerüljön vissza bemenetként.
                                  // A pre-rollt nem töröljük, és TTS alatti hangot sem pufferezzük,
                                  // így a saját felolvasás nem kerülhet vissza később bemenetként.
                                  if(shouldMuteMicForSpeakerTts()) {
                                      trailingSilenceOpen = false;
                                      voiceSendActive = false;
                                      continue;
                                  }
          
                                  long now = System.currentTimeMillis();
                                  boolean overGate = externalVadOverGate(buf, read);
                                  if(overGate) {
                                      if(!voiceSendActive) {
                                          rememberPendingSpeechAudio(buf, read);
                                          if(pendingSpeechAudioDurationMs() < MIN_TRUE_SPEECH_AUDIO_MS) {
                                              continue;
                                          }
                                          if(firstSpeechHeardAt == 0L) firstSpeechHeardAt = now;
                                          for(byte[] pr : takePreRollAudio()) sendAudioChunk(pr);
                                          for(byte[] ps : takePendingSpeechAudio()) sendAudioChunk(ps);
                                      } else {
                                          sendAudioChunk(Arrays.copyOf(buf, read));
                                      }
                                      voiceSendActive = true;
                                      trailingSilenceOpen = true;
                                      lastVoiceChunkSentAtMs = now;
                                      continue;
                                  }
          
                                  if(voiceSendActive) {
                                      byte[] tail = prepareTrailingSilenceChunk(buf, read);
                                      if(tail != null) {
                                          sendAudioChunk(tail);
                                          continue;
                                      } else {
                                      // 2026-07-09: csend utáni STT-küldés gyorsítása.
                                      // Előtte: flushSpeechAudioWindow(false) futott, ami 1200 ms minimum audioablakot kért.
                                      // Tünet: beszéd befejezése után kb. 2-3 mp késéssel jelent meg a felismert szöveg.
                                      // Most: true -> 400 ms minimum audioablak elég, ezért hamarabb küldjük STT-re.
                                      // Ha később túl korai vágás, rövid töredék vagy rosszabb felismerés jelentkezik,
                                      // ezt az egy sort kell visszaállítani false értékre.
                                      flushSpeechAudioWindow(true);
                                      }
                                  }
          
                                  clearPendingSpeechAudio();
                                  rememberPreRollAudio(buf, read);
                              } catch(Exception ignored) {}
                          }
                      }
                  });
              }
          
              void handleConnectionFailure(Throwable t) {
                  String msg = t == null ? "ismeretlen hiba" : String.valueOf(t.getMessage());
          
                  // V318: lebegő vágólap-fordításnál nincs blokkállapot, csak mini ablak/toast.
                  if(clipboardResponseMode) {
