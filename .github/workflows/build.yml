              void refreshActualInputRoute(AudioRecord recorder) {
                  if(recorder == null) { setInputRouteHeader("BEMENET: —"); return; }
                  try {
                      AudioDeviceInfo routed = recorder.getRoutedDevice();
                      if(routed != null && routed.getType() == AudioDeviceInfo.TYPE_BUILTIN_MIC) {
                          String suffix = activeInterpreterOutputLabel == null || activeInterpreterOutputLabel.isEmpty()
                              ? "" : " • kimenet: " + activeInterpreterOutputLabel;
                          setInputRouteHeader("BEMENET: " + compactAudioDeviceLabel(routed) + " • 48 kHz" + suffix);
                      } else if(routed != null) {
                          setInputRouteHeader("BEMENET TILTVA: " + compactAudioDeviceLabel(routed));
                          android.util.Log.e(LOG_TAG, "Forbidden non-phone microphone route detected: " + compactAudioDeviceLabel(routed));
                          if(streaming && rec == recorder) runOnUiThread(() -> stop(false));
                      } else {
                          setInputRouteHeader("BEMENET: telefon mikrofon ellenőrzése…");
                      }
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Actual input route query failed", e);
                      setInputRouteHeader("BEMENET: ellenőrzési hiba");
                      if(streaming && rec == recorder) runOnUiThread(() -> stop(false));
