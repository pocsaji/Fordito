                  };

                  showCenteredMenu("Ablakkezelés", items, (d,w) -> {
                      if(w==0) copyBox(true);
                      if(w==1) copyBox(false);
                      if(w==2) clearTopBox();
                      if(w==3) clearBottomBox();
                      if(w==4) clearBothBoxes();
