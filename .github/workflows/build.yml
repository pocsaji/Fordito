              TextWatcher manualWatcher(final boolean top) {
                  return new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          if(programmaticChange) return;
                          enterManualEditMode(top);
                          syncManualEditIntoBlockModel(top, s, start, before, count);
                      }
                      public void afterTextChanged(Editable e) {
                          if(programmaticChange) return;
                          // A kézi javítás már az onTextChanged alatt bekerült ugyanabba a TextBlockba,
                          // ezért egy későbbi élő render nem tudja a régi szöveget visszaírni.
                          // FORDÍT gombnál továbbra is a teljes aktív ablak fordul újra.
                          updateButtons();
                      }
                  };
              }
          
              void invalidateManualWindowRequests() {
                  manualWindowRequestToken++;
                  if(manualWindowRequestActive) responseInProgress = false;
                  manualWindowRequestActive = false;
                  pendingManualGlossaryProtection = GlossaryProtection.empty();
              }
          
              int beginManualWindowRequest() {
                  invalidateManualWindowRequests();
                  manualWindowRequestActive = true;
                  responseInProgress = true;
                  return manualWindowRequestToken;
              }
          
              boolean isManualWindowRequestCurrent(int token) {
                  return manualWindowRequestActive && token == manualWindowRequestToken;
              }
          
              void finishManualWindowRequest(int token) {
                  if(!isManualWindowRequestCurrent(token)) return;
                  manualWindowRequestActive = false;
                  responseInProgress = false;
              }
          
              void invalidateSpeechTranslationStateKeepSession() {
                  if(speechTranslateMode || pendingSpeechBlockId >= 0) responseInProgress = false;
                  speechTranslateMode = false;
                  pendingSpeechBlockId = -1;
                  pendingSpeechBlockRevision = -1;
                  pendingSpeechBlockRef = null;
                  speechTranslateQueue.clear();
                  pendingSpeechGlossaryProtection = GlossaryProtection.empty();
              }
          
              void initializeManualBlockModelFromBoxes(boolean sourceTop) {
                  TextBlock b = new TextBlock();
                  b.topText = topBox == null ? "" : topBox.getText().toString();
                  b.bottomText = bottomBox == null ? "" : bottomBox.getText().toString();
                  b.sourceTop = sourceTop;
                  b.pendingSourceText = (sourceTop ? b.topText : b.bottomText).trim();
                  b.translatedOk = b.topText.trim().length() > 0 && b.bottomText.trim().length() > 0;
                  b.editRevision = 1;
                  textBlocks.clear();
                  textBlocks.add(b);
                  topRanges.clear();
                  bottomRanges.clear();
                  topRanges.add(new int[]{0, b.topText.length()});
                  bottomRanges.add(new int[]{0, b.bottomText.length()});
              }
              void syncManualEditIntoBlockModel(boolean top, CharSequence currentText, int start, int before, int count) {
                  if(programmaticChange || currentText == null) return;
                  if(textBlocks.isEmpty()) {
                      initializeManualBlockModelFromBoxes(top);
                      return;
                  }
                  ArrayList<int[]> ranges = top ? topRanges : bottomRanges;
                  if(ranges == null || ranges.isEmpty()) {
                      // V40.30: ha a tartománytérkép már nem használható, a látható kézi szöveg
                      // az elsődleges adat. Nem hagyjuk, hogy egy későbbi render régi blokkadatot írjon vissza.
                      invalidateSpeechTranslationStateKeepSession();
                      initializeManualBlockModelFromBoxes(top);
                      return;
                  }
          
                  ArrayList<TextBlock> visible = new ArrayList<>();
                  for(TextBlock b : textBlocks) {
                      if(b == null) continue;
                      String bt = b.topText == null ? "" : b.topText;
                      String bb = b.bottomText == null ? "" : b.bottomText;
                      if(bt.trim().length() == 0 && bb.trim().length() == 0) continue;
                      visible.add(b);
                  }
                  if(visible.size() != ranges.size()) {
                      // V40.30: szerkezeti eltérésnél egyetlen, aktuális kézi blokkmodellre váltunk.
                      invalidateSpeechTranslationStateKeepSession();
                      initializeManualBlockModelFromBoxes(top);
                      return;
                  }
          
                  int oldEditEnd = start + Math.max(0, before);
                  int rangeIndex = -1;
                  for(int i=0;i<ranges.size();i++) {
                      int[] r = ranges.get(i);
                      if(r == null || r.length < 2) continue;
                      int rs = r[0];
                      int re = r[1];
                      boolean localInsertion = before == 0 && start >= rs && start <= re;
                      boolean localReplaceOrDelete = before > 0 && start >= rs && oldEditEnd <= re;
                      if(localInsertion || localReplaceOrDelete) { rangeIndex = i; break; }
                  }
          
                  // V40.30: több blokk határát érintő törlés/beillesztés esetén nem hagyunk
                  // elavult blokkokat a háttérben. A két látható ablak pillanatnyi tartalma lesz
                  // az új egyetlen kézi blokkmodell, így későbbi render nem tud szöveget visszatörölni.
                  if(rangeIndex < 0 || rangeIndex >= visible.size()) {
                      invalidateSpeechTranslationStateKeepSession();
                      initializeManualBlockModelFromBoxes(top);
                      return;
                  }
          
                  int[] r = ranges.get(rangeIndex);
                  int delta = count - before;
                  int newEnd = r[1] + delta;
                  if(r[0] < 0 || newEnd < r[0] || newEnd > currentText.length()) return;
          
                  String edited = currentText.subSequence(r[0], newEnd).toString();
                  TextBlock block = visible.get(rangeIndex);
                  if(top) block.topText = edited;
                  else block.bottomText = edited;
                  if(block.sourceTop == top) block.pendingSourceText = edited.trim();
                  block.editRevision++;
          
                  r[1] = newEnd;
                  for(int i=rangeIndex+1;i<ranges.size();i++) {
                      int[] next = ranges.get(i);
                      if(next == null || next.length < 2) continue;
                      next[0] += delta;
                      next[1] += delta;
                  }
              }
          
              void selectActiveBox(boolean top) {
