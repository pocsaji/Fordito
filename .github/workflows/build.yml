                  if(profile.equals("restaurant")) return "restaurant ordering, dishes, ingredients, drinks, service, reservation and payment";
                  if(profile.equals("hotel")) return "accommodation, booking, room, arrival, departure, facilities and payment";
                  if(profile.equals("truck_general")) return "international road freight, dispatcher communication, route, loading, unloading, delivery site, trailer and transport documents";
                  if(profile.equals("truck_tarp")) return "tarpaulin trailer road freight, pallets, straps, curtains, CMR, loading dock, loading and unloading";
                  if(profile.equals("truck_bulk")) return "bulk road transport, silo, hopper, weighing, loading point, unloading point, freight, trailer and delivery site";
                  if(profile.equals("truck_tank")) return "road tanker transport, tank, compartment, hose, pump, valve, seal, loading, unloading, wash certificate and delivery documents";
                  if(profile.equals("logistics")) return "logistics, warehouse, loading dock, ramp, pallet, shipment, sender, recipient, loading and unloading";
                  if(profile.equals("customs")) return "customs, border crossing, freight documents, declaration, inspection, seal, transit and clearance";
                  if(profile.equals("medical")) return "doctor visit, symptoms, examination, diagnosis, treatment and medical history";
                  if(profile.equals("pharmacy")) return "pharmacy, medicine, active ingredient, dosage, prescription, contraindication and symptoms";
                  if(profile.equals("bank")) return "banking, account, bank card, cash withdrawal, transfer, identification and fees";
                  if(profile.equals("office")) return "official administration, forms, documents, appointment, identification and customer service";
                  if(profile.equals("police")) return "police contact, identity check, traffic control, statement, report, offence and official procedure";
