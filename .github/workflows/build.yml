                  final String[] typeLabels = {"Név / hely / cég", "Védett árumegnevezés", "Gyakori szakmai szó"};
                  final String[] typeValues = {GLOSSARY_TYPE_NAME, GLOSSARY_TYPE_PROTECTED, GLOSSARY_TYPE_VOCABULARY};
                  Spinner typeSpinner = new Spinner(this);
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, typeLabels);
                  typeSpinner.setAdapter(adapter);
                  String initialType = existing ? normalizeGlossaryType(oldEntry.type) : GLOSSARY_TYPE_NAME;
                  int initialPos = GLOSSARY_TYPE_NAME.equals(initialType) ? 0 : (GLOSSARY_TYPE_PROTECTED.equals(initialType) ? 1 : 2);
                  typeSpinner.setSelection(initialPos);
                  box.addView(typeSpinner, new LinearLayout.LayoutParams(-1, -2));
          
                  CheckBox enabledBox = new CheckBox(this);
                  enabledBox.setText("Aktív");
                  enabledBox.setChecked(!existing || oldEntry.enabled);
                  box.addView(enabledBox, new LinearLayout.LayoutParams(-1, -2));
          
                  TextView help = label(
                      "A felső mező a kanonikus alak. Az alias mezőbe vesszővel, pontosvesszővel vagy új sorral add meg azokat az alakokat, amelyeket a beszédfelismerő várhatóan hall/ír.\n" +
                      "Név/hely/cég: felismerési segítség, kanonikus írásmód, nem fordítandó.\n" +
                      "Védett árumegnevezés: felismerési segítség, a fordításban is pontosan változatlan marad.\n" +
                      "Gyakori szakmai szó: felismerési segítség, normálisan fordítható."
                  );
                  help.setTextSize(11);
                  help.setTextColor(Color.LTGRAY);
                  box.addView(help, new LinearLayout.LayoutParams(-1, -2));
          
                  AlertDialog.Builder builder = new AlertDialog.Builder(this)
                      .setTitle(existing ? "Szótári bejegyzés szerkesztése" : "Új szótári bejegyzés")
                      .setView(box)
                      .setPositiveButton("Mentés", null)
                      .setNegativeButton("Mégse", null);
                  if(existing) builder.setNeutralButton("Törlés", null);
                  AlertDialog dlg = builder.create();
                  dlg.setOnDismissListener(d -> stopGlossaryVoiceInput());
                  dlg.setOnShowListener(d -> {
                      dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
                          String term = sanitizeGlossaryTerm(termInput.getText().toString());
                          if(term.length() == 0) {
                              Toast.makeText(this, "A kifejezés nem lehet üres.", Toast.LENGTH_SHORT).show();
                              return;
                          }
                          for(int i=0;i<glossaryEntries.size();i++) {
                              if(i == index) continue;
                              if(sanitizeGlossaryTerm(glossaryEntries.get(i).text).equalsIgnoreCase(term)) {
                                  Toast.makeText(this, "Ez a kifejezés már szerepel a szótárban.", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                          }
                          String type = typeValues[Math.max(0, Math.min(typeSpinner.getSelectedItemPosition(), typeValues.length - 1))];
                          ArrayList<String> aliases = new ArrayList<>();
                          String rawAliases = aliasesInput.getText().toString();
                          for(String aliasPart : rawAliases.split("[,;\n\r]+")) {
                              String alias = sanitizeGlossaryTerm(aliasPart);
                              if(alias.length() > 0 && !containsIgnoreCase(aliases, alias)) aliases.add(alias);
                          }
                          if(existing) {
                              glossaryEntries.set(index, new GlossaryEntry(term, type, enabledBox.isChecked(), aliases));
                          } else {
                              glossaryEntries.add(new GlossaryEntry(term, type, enabledBox.isChecked(), aliases));
                          }
                          save();
                          stopGlossaryVoiceInput();
                          dlg.dismiss();
                          new Handler(Looper.getMainLooper()).post(this::glossaryMenu);
                      });
                      if(existing) {
                          dlg.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(v -> {
                              glossaryEntries.remove(index);
                              save();
                              stopGlossaryVoiceInput();
                              dlg.dismiss();
                              new Handler(Looper.getMainLooper()).post(this::glossaryMenu);
                          });
                      }
                  });
                  dlg.show();
              }
          
              void startGlossaryVoiceInput(EditText target, Button button) {
                  if(streaming || microphoneStarting || finalizingStop) {
                      Toast.makeText(this, "A szótár hangos felviteléhez előbb állítsd le a fő mikrofont. A kézi bevitel közben is használható.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if(!hasKey()) { showApi(); return; }
                  if(Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      reqMic();
                      Toast.makeText(this, "Engedélyezd a mikrofont, majd nyomd meg újra a bediktálást.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  stopGlossaryVoiceInput();
                  glossaryVoiceTarget = target;
                  glossaryVoiceButton = button;
                  glossaryVoiceCaptureMode = true;
                  button.setText("🎤 Mondd ki a kifejezést…");
                  start(true);
              }
          
              void completeGlossaryVoiceInput(String transcript) {
                  if(!glossaryVoiceCaptureMode) return;
                  String heard = sanitizeGlossaryTerm(transcript);
                  heard = heard.replaceAll("[\\.!?,;:]+$", "").trim();
                  EditText target = glossaryVoiceTarget;
                  Button button = glossaryVoiceButton;
                  glossaryVoiceCaptureMode = false;
                  glossaryVoiceTarget = null;
                  glossaryVoiceButton = null;
                  if(streaming || microphoneStarting) stop(false);
                  if(target != null && heard.length() > 0) {
                      target.setText(heard);
                      target.setSelection(target.getText().length());
                  }
                  if(button != null) button.setText("🎤 Bediktálás – utána ellenőrizd és javítsd");
              }
          
              void stopGlossaryVoiceInput() {
                  boolean wasCapture = glossaryVoiceCaptureMode;
                  glossaryVoiceCaptureMode = false;
                  glossaryVoiceTarget = null;
                  Button button = glossaryVoiceButton;
                  glossaryVoiceButton = null;
                  if(wasCapture && (streaming || microphoneStarting)) stop(false);
                  if(button != null) button.setText("🎤 Bediktálás – utána ellenőrizd és javítsd");
              }
          
