                      pendingSpeechAudioFrames.add(copyFramePair(frame));
                      pendingSpeechAudioMs += SILERO_FRAME_MS;
                  }
              }
          
              int pendingSpeechAudioDurationMs() {
                  synchronized(pendingSpeechAudioFrames) { return pendingSpeechAudioMs; }
              }
          
              ArrayList<PcmFramePair> takePendingSpeechAudio() {
                  ArrayList<PcmFramePair> out = new ArrayList<>();
