              void translateClipboardFullHttp(String sourceText, String targetCode) {
                  try {
                      OkHttpClient http = new OkHttpClient.Builder()
                          .connectTimeout(25, TimeUnit.SECONDS)
                          .readTimeout(70, TimeUnit.SECONDS)
                          .writeTimeout(30, TimeUnit.SECONDS)
                          .build();

                      JSONObject root = new JSONObject();
                      root.put("model", "gpt-4o-mini");
                      root.put("temperature", 0.1);
                      JSONArray messages = new JSONArray();
                      messages.put(new JSONObject().put("role", "system").put("content", clipboardFullInstructions()));
                      messages.put(new JSONObject().put("role", "user").put("content",
                          "SOURCE_LANG: AUTO\nTARGET_LANG: " + targetCode + "\nTEXT:\n" + sourceText));
                      root.put("messages", messages);

                      MediaType mt = MediaType.parse("application/json; charset=utf-8");
                      RequestBody body = RequestBody.create(root.toString(), mt);
                      Request req = new Request.Builder()
                          .url("https://api.openai.com/v1/chat/completions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .addHeader("Content-Type", "application/json")
                          .post(body)
                          .build();

                      http.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> showClipboardTranslatorPanel(sourceText, "", "Vágólap-fordítási hiba: kapcsolat nem sikerült."));
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> showClipboardTranslatorPanel(sourceText, "", "Vágólap-fordítási hiba: HTTP " + response.code()));
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  JSONArray choices = obj.optJSONArray("choices");
                                  String out = "";
                                  if(choices != null && choices.length() > 0) {
                                      JSONObject msg = choices.getJSONObject(0).optJSONObject("message");
                                      if(msg != null) out = msg.optString("content", "");
                                  }
                                  final String modelOut = out;
                                  runOnUiThread(() -> applyClipboardFullResult(sourceText, modelOut));
                              } catch(Exception ex) {
                                  runOnUiThread(() -> showClipboardTranslatorPanel(sourceText, "", "Vágólap-fordítási hiba: nem értelmezhető válasz."));
                              }
                          }
                      });
                  } catch(Exception e) {
                      showClipboardTranslatorPanel(sourceText, "", "Vágólap-fordítási hiba: " + e.getMessage());
                  }
              }

              String clipboardPrepareOnlyInstructions() {
                  return clipboardContextPrompt() + "Never censor, mask, redact, soften, sanitize or replace any word, including profanity, vulgarity, insults, sexual language, slang or rude wording. Preserve every such word in full, with its original spelling and meaning. Never use asterisks, partial masking, euphemisms, square-bracket placeholders or category labels. " + "You repair raw dictated or clipboard text for the middle field of a 3-window translator. Return ONLY the corrected source-language text, no labels, no markdown, no quotes, no explanation. " +
                    "The user may provide text in either one of the selected language pair. You must keep the ORIGINAL input language. In this middle step translation is strictly forbidden. " +
                    "Make the original-language source message natural and culturally well-formed: punctuation, capitalization, accents, sentence boundaries, grammar, broken sentence structure and clear speech-recognition errors. " +
                    "Preserve the speaker's meaning, intent, facts and tone, but do not behave like a literal transcript. Remove obvious dictation noise, accidental filler words, false starts, repeated fragments, self-corrections and words that clearly do not belong when the surrounding context makes that clear. " +
                    "You may rewrite awkward wording naturally when this does not change meaning. Do NOT invent facts, explanations, opinions or new content. If an unusual or test word could be intentional, keep it. If genuinely ambiguous, prefer the closest plausible wording rather than guessing a new meaning. " +
                    "Do not add comments or explain the text. Preserve vulgarity, intimacy, friendliness and official or informal register.";
              }

