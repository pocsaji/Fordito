name: Build Android APK V337

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/attila/forditokonzol app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } } }
          rootProject.name = "ForditoKonzol"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.6.1" apply false }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins { id("com.android.application") }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          android {
              namespace = "com.attila.forditokonzol"
              compileSdk = 35
              defaultConfig { applicationId = "hu.pocsaji.fordito"; minSdk = 26; targetSdk = 35; versionCode = 337; versionName = "33.7" }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
              implementation("com.github.gkonovalov.android-vad:webrtc:2.0.10")
              implementation("com.github.gkonovalov.android-vad:silero:2.0.10")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
