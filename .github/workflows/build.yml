              void applyV318StableDefaultsOnce() {
                  // V318: telepítés/frissítés után egyszer visszaállítjuk az élő hanglánc ajánlott alapját.
                  // API kulcsot, kiválasztott nyelvpárt és korábbi beszélgetést nem törlünk.
                  int last = sp.getInt("stableDefaultsVersion", 0);
                  if(last < 400) {
                      // Csak a hanglánc dokumentált alapját migráljuk; a felhasználó többi
                      // beállítását (nyelvek, profil, tolmács mód) nem írjuk felül.
                      vadEngineMode = "silero";
                      audioSourceMode = "phone_mic_48k";
                      sp.edit().putInt("stableDefaultsVersion", 400).apply();
                      save();
                  }
                  if(last < 404) {
                      // A korábbi kézi headset/hangszóró választás V40.4-től automatikus útvonalra migrál.
                      interpreterAudioMode = interpreterMode ? "auto" : "off";
                      lastInterpreterAudioMode = "auto";
                      sp.edit().putInt("stableDefaultsVersion", 404).apply();
                      save();
                  }
                  if(last < 408) {
                      // Régi hangforrás-beállítás migrációja; a V40.19 később kötelezően fix telefonmikrofonra állít.
                      audioSourceMode = "phone_mic_48k";
                      sp.edit().putInt("stableDefaultsVersion", 408).apply();
                      save();
                  }
                  if(last < 412) {
                      // V40.12: telepítés/frissítés után egyszer bekapcsoljuk a 2 perces mikrofon-életjelzést.
                      // Ezután a felhasználó továbbra is szabadon átállíthatja vagy kikapcsolhatja.
                      micLifeSignalMinutes = 2;
                      sp.edit().putInt("stableDefaultsVersion", 412).apply();
                      save();
                  }
                  if(last < 419) {
                      // V40.19: kötelező, fix hangút. Telefon mikrofon 48 kHz; Silero 16 kHz; STT 24 kHz.
                      // A Bluetooth/headset bemenetet és minden kommunikációs bemeneti fallbacket felülírjuk.
                      vadEngineMode = "silero";
                      audioSourceMode = "phone_mic_48k";
                      interpreterCommunicationFallbackActive = false;
                      rejectedInterpreterInputDeviceId = -1;
                      sp.edit().putInt("stableDefaultsVersion", 419).apply();
                      save();
                  }
              }
          
