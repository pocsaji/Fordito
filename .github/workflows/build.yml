              void runClipboardPanelTranslate() {
                  String raw = clipboardRawEdit == null ? "" : clipboardRawEdit.getText().toString().trim();
                  String prep = clipboardPreparedEdit == null ? "" : clipboardPreparedEdit.getText().toString().trim();
                  String tr = clipboardTranslationEdit == null ? "" : clipboardTranslationEdit.getText().toString().trim();
