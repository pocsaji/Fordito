              boolean shouldPlayMicLifeSignalNow() {
                  if(!streaming || micLifeSignalMinutes <= 0) return false;
                  boolean screenInteractive = true;
                  boolean keyguardLocked = false;
                  try {
                      PowerManager pm = (PowerManager)getSystemService(POWER_SERVICE);
                      if(pm != null) screenInteractive = pm.isInteractive();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Screen state check failed", e);
                  }
                  try {
                      KeyguardManager km = (KeyguardManager)getSystemService(KEYGUARD_SERVICE);
                      if(km != null) keyguardLocked = km.isKeyguardLocked();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Keyguard state check failed", e);
                  }
                  return !activityInForeground || !screenInteractive || keyguardLocked;
              }
          
              void playMicLifeSignal() {
                  try {
                      android.os.Vibrator vibrator = (android.os.Vibrator)getSystemService(VIBRATOR_SERVICE);
                      if(vibrator != null && vibrator.hasVibrator()) {
                          long[] pattern = new long[]{0L, 220L, 120L, 300L};
                          if(Build.VERSION.SDK_INT >= 26) {
                              int[] amplitudes = new int[]{0, 220, 0, 255};
                              vibrator.vibrate(android.os.VibrationEffect.createWaveform(pattern, amplitudes, -1));
                          } else {
                              vibrator.vibrate(pattern, -1);
                          }
                      }
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Mic life vibration failed", e);
                  }
                  try {
                      final android.media.ToneGenerator tone = new android.media.ToneGenerator(AudioManager.STREAM_MUSIC, 100);
                      tone.startTone(android.media.ToneGenerator.TONE_PROP_BEEP2, 260);
                      micLifeSignalHandler.postDelayed(() -> {
                          try { tone.startTone(android.media.ToneGenerator.TONE_PROP_BEEP2, 300); }
                          catch(Exception e) { android.util.Log.w(LOG_TAG, "Second mic life beep failed", e); }
                      }, 380L);
                      micLifeSignalHandler.postDelayed(() -> {
                          try { tone.release(); } catch(Exception ignored) {}
                      }, 850L);
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Mic life beep failed", e);
                  }
              }
          
              String interpreterRuntimeShortLabel() {
                  if("headset_output_phone_mic".equals(activeInterpreterRoute)) return "headset kimenet – telefon mikrofon";
                  if("headset_direct".equals(activeInterpreterRoute)) return "headset – közvetlen bemenet";
                  if("headset_communication_fallback".equals(activeInterpreterRoute)) return "headset – kommunikációs tartalék";
                  if("speaker_half_duplex".equals(activeInterpreterRoute)) return "hangszóró – váltott";
                  return "automatikus tolmács";
              }
          
              void restartAfterInterpreterSettingChange(boolean wasStreaming) {
                  if(wasStreaming) new Handler(Looper.getMainLooper()).postDelayed(() -> startMicrophone(), 500L);
              }
          
              void disableInterpreterQuick() {
                  boolean wasStreaming = streaming;
                  if(wasStreaming) stop(false);
                  interpreterMode = false;
                  interpreterAudioMode = "off";
                  ttsController.resetMuteGuard();
                  ttsController.stop();
                  restoreNormalAudioRoute();
                  hideInterpreterFloatingButton();
                  save();
                  refreshOpenInterpreterMenuButton();
                  restartAfterInterpreterSettingChange(wasStreaming);
                  Toast.makeText(this, "Tolmács mód kikapcsolva.", Toast.LENGTH_SHORT).show();
              }
          
              void enableInterpreterQuick() {
                  boolean wasStreaming = streaming;
                  if(wasStreaming) stop(false);
                  interpreterMode = true;
                  interpreterAudioMode = "auto";
                  interpreterSpeechOutputEnabled = true;
                  rejectedInterpreterInputDeviceId = -1;
                  configureInterpreterAudioRoute(false);
                  save();
                  ensureInterpreterFloatingButton();
                  refreshOpenInterpreterMenuButton();
                  restartAfterInterpreterSettingChange(wasStreaming);
                  Toast.makeText(this, interpreterLabel(), Toast.LENGTH_SHORT).show();
              }
          
              void toggleInterpreterEnabled() {
                  if(interpreterMode) disableInterpreterQuick();
                  else enableInterpreterQuick();
                  refreshOpenInterpreterMenuButton();
                  updateButtons();
              }
          
              void recheckInterpreterAudioRoute(boolean announce) {
                  if(!interpreterMode || finalizingStop) return;
                  boolean wasStreaming = streaming;
                  if(wasStreaming) stop(false);
                  rejectedInterpreterInputDeviceId = -1;
                  configureInterpreterAudioRoute(false);
                  restartAfterInterpreterSettingChange(wasStreaming);
                  refreshInterpreterFloatingButton();
                  refreshOpenInterpreterMenuButton();
                  updateButtons();
                  if(announce) Toast.makeText(this, interpreterLabel(), Toast.LENGTH_SHORT).show();
              }
          
              // Régi hivatkozások kompatibilitása: módváltás helyett automatikus újraellenőrzés.
              void toggleDisplayModeQuick() {
                  mirrorBottomMode = !mirrorBottomMode;
                  applyDisplayMode();
                  save();
                  Toast.makeText(this, displayModeLabel(), Toast.LENGTH_SHORT).show();
                  updateButtons();
              }
          
              void clearBothBoxes() {
                  if(finalizingStop) return;
                  requestRegistry.cancelAll();
                  sttCoordinator.reset();
                  conversation.clearBlocksAndInvalidate();
                  pendingSpeechBlockId = -1L;
                  speechTranslateMode = false;
                  responseInProgress = false;
                  speechTranscriptBuffer = "";
                  firstSpeechHeardAt = 0L;
                  firstSpeechBlockReleased = false;
                  speechIdleFlushToken++;
                  speechTextProcessor.resetHistory();
                  lastSureSpeechOriginal = "";
                  lastSureSpeechTranslation = "";
          
                  programmaticChange = true;
                  topBox.setText("");
                  bottomBox.setText("");
                  programmaticChange = false;
                  Toast.makeText(this, "Mindkét ablak törölve.", Toast.LENGTH_SHORT).show();
                  updateButtons();
              }
          
              void copyBox(boolean top) {
                  EditText source = top ? topBox : bottomBox;
                  String text = source.getText().toString();
                  if(text.trim().isEmpty()) {
                      Toast.makeText(this, top ? "A felső ablak üres." : "Az alsó ablak üres.", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  android.content.ClipboardManager cm = (android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  if(cm != null) {
                      cm.setPrimaryClip(android.content.ClipData.newPlainText(top ? "Felső ablak" : "Alsó ablak", text));
                      Toast.makeText(this, top ? "Felső ablak másolva." : "Alsó ablak másolva.", Toast.LENGTH_SHORT).show();
                  }
              }
          
              CharSequence menuItem(String title, String subtitle, boolean selected) {
                  String main = title == null ? "" : title;
                  String sub = subtitle == null ? "" : subtitle;
                  if(selected && sub.length() == 0) sub = "kiválasztva";
                  String full = sub.length() == 0 ? main : main + "\n" + sub;
                  SpannableString spn = new SpannableString(full);
                  spn.setSpan(new AlignmentSpan.Standard(Layout.Alignment.ALIGN_CENTER), 0, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  spn.setSpan(new RelativeSizeSpan(1.0f), 0, main.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  if(sub.length() > 0) {
                      int st = main.length() + 1;
                      spn.setSpan(new RelativeSizeSpan(0.72f), st, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      spn.setSpan(new ForegroundColorSpan(Color.LTGRAY), st, full.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  }
                  return spn;
              }
          
              void showCenteredMenu(String title, CharSequence[] items, DialogInterface.OnClickListener listener) {
                  new AlertDialog.Builder(this).setTitle(title).setItems(items, listener).show();
              }
          
              void showApi() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  int pad = (int)(12 * getResources().getDisplayMetrics().density + 0.5f);
                  box.setPadding(pad, pad, pad, pad);
          
                  TextView note = label(
                      "EN: This is not a login, registration, account creation, membership or subscription screen. " +
                      "The app does not request, collect or store usernames, passwords, PINs, OTPs or user login credentials. " +
                      "The OpenAI API key is only a local technical setting used to access the translation service with the user's own API access. " +
                      "Fordito does not operate a user-account system and does not restrict app access by login.\n\n" +
                      "HU: Ez nem bejelentkezés, nem regisztráció, nem fióklétrehozás, nem tagság és nem előfizetés. " +
                      "Az alkalmazás nem kér, nem gyűjt és nem tárol felhasználónevet, jelszót, PIN-kódot, OTP-t vagy bejelentkezési adatot. " +
                      "Az OpenAI API-kulcs kizárólag helyi technikai beállítás a fordítási szolgáltatás eléréséhez, a felhasználó saját API-hozzáférésével. " +
                      "A Fordito nem működtet felhasználói fiókrendszert, és nem korlátozza az app elérését bejelentkezéssel."
                  );
                  note.setTextSize(11);
                  note.setTextColor(Color.rgb(255, 210, 80));
                  note.setGravity(Gravity.START);
                  note.setLineSpacing(0f, 1.05f);
                  box.addView(note, new LinearLayout.LayoutParams(-1, -2));
          
                  EditText input = new EditText(this);
                  input.setSingleLine(true);
                  input.setText(apiKey == null ? "" : apiKey);
                  input.setHint("sk-...");
                  input.setSelectAllOnFocus(true);
                  input.setTextSize(14);
                  input.setPadding(8, 8, 8, 8);
                  box.addView(input, new LinearLayout.LayoutParams(-1, -2));
          
                  Button modelButton = new Button(this);
                  modelButton.setAllCaps(false);
                  modelButton.setText("API modell\n" + AppCatalog.labelOf(models, model));
                  modelButton.setOnClickListener(v -> {
                      chooseFrom("API modell", models, model, selected -> {
                          applyTranslationConfigurationChange(() -> model = selected, false);
                          modelButton.setText("API modell\n" + AppCatalog.labelOf(models, model));
                      });
                  });
                  box.addView(modelButton, new LinearLayout.LayoutParams(-1, -2));
          
                  android.widget.ScrollView scroll = new android.widget.ScrollView(this);
                  scroll.addView(box);
          
                  AlertDialog dlg = new AlertDialog.Builder(this)
                    .setTitle("OpenAI API kulcs és modell")
                    .setView(scroll)
                    .setPositiveButton("Mentés", (d,w) ->
                        applyTranslationConfigurationChange(() -> apiKey = input.getText().toString().trim(), false))
                    .setNeutralButton("Kulcs törlése", null)
