              int interpreterHeadsetOutputPriority(AudioDeviceInfo d) {
                  if(d == null || !d.isSink()) return -1;
                  int type = d.getType();
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_HEADSET) return 100;
                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) return 95;
                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) return 90;
                  if(type == AudioDeviceInfo.TYPE_WIRED_HEADSET || type == AudioDeviceInfo.TYPE_WIRED_HEADPHONES) return 80;
                  if(type == AudioDeviceInfo.TYPE_USB_HEADSET || type == AudioDeviceInfo.TYPE_USB_DEVICE) return 70;
                  if(type == AudioDeviceInfo.TYPE_HEARING_AID) return 60;
                  return -1;
              }
          
              AudioDeviceInfo findPreferredInterpreterOutputDevice() {
                  AudioDeviceInfo best = null;
                  int bestPriority = -1;
                  for(AudioDeviceInfo d : availableOutputDevicesCompat()) {
                      int priority = interpreterHeadsetOutputPriority(d);
                      if(priority > bestPriority) {
                          best = d;
                          bestPriority = priority;
                      }
                  }
                  return best;
              }
          
              int headsetInputPriority(AudioDeviceInfo d) {
                  if(d == null || !d.isSource()) return -1;
                  int type = d.getType();
                  if(Build.VERSION.SDK_INT >= 31 && type == AudioDeviceInfo.TYPE_BLE_HEADSET) return 100;
                  if(type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) return 90;
                  if(type == AudioDeviceInfo.TYPE_WIRED_HEADSET) return 80;
                  if(type == AudioDeviceInfo.TYPE_USB_HEADSET) return 70;
                  if(type == AudioDeviceInfo.TYPE_USB_DEVICE) return 60;
                  if(type == AudioDeviceInfo.TYPE_HEARING_AID) return 50;
                  return -1;
              }
          
              boolean isInputDeviceIdPresent(int deviceId) {
                  if(deviceId < 0) return false;
                  for(AudioDeviceInfo d : availableInputDevicesCompat()) {
                      if(d != null && d.getId() == deviceId) return true;
                  }
                  return false;
              }
          
              AudioDeviceInfo findPreferredInterpreterInputDevice() {
                  AudioDeviceInfo best = null;
                  int bestPriority = -1;
                  for(AudioDeviceInfo d : availableInputDevicesCompat()) {
                      if(d == null || d.getId() == rejectedInterpreterInputDeviceId) continue;
                      int priority = headsetInputPriority(d);
                      if(priority > bestPriority) {
                          best = d;
                          bestPriority = priority;
                      }
                  }
                  return best;
              }
          
              List<AudioDeviceInfo> availableCommunicationDevicesCompat() {
                  ArrayList<AudioDeviceInfo> out = new ArrayList<>();
                  if(audioManager == null) return out;
                  try {
                      if(Build.VERSION.SDK_INT >= 31) out.addAll(audioManager.getAvailableCommunicationDevices());
                      else out.addAll(Arrays.asList(audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS)));
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Communication device query failed", e);
                  }
                  return out;
              }
          
              AudioDeviceInfo findCommunicationHeadset() {
                  AudioDeviceInfo fallback = null;
                  for(AudioDeviceInfo d : availableCommunicationDevicesCompat()) {
                      if(d == null || !isHeadsetOutputDeviceType(d.getType())) continue;
                      if(d.getType() == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                         (Build.VERSION.SDK_INT >= 31 && d.getType() == AudioDeviceInfo.TYPE_BLE_HEADSET) ||
                         d.getType() == AudioDeviceInfo.TYPE_WIRED_HEADSET || d.getType() == AudioDeviceInfo.TYPE_USB_HEADSET) return d;
                      if(fallback == null) fallback = d;
                  }
                  return fallback;
              }
          
              boolean isHeadsetInterpreterRoute() { return activeInterpreterRoute != null && activeInterpreterRoute.startsWith("headset"); }
              boolean isHalfDuplexSpeakerRoute() { return "speaker_half_duplex".equals(activeInterpreterRoute); }
          
              void clearForcedCommunicationRoute() {
                  if(audioManager == null) audioManager = (AudioManager)getSystemService(AUDIO_SERVICE);
                  activeCommunicationDeviceId = -1;
                  if(audioManager == null) return;
                  try {
                      if(Build.VERSION.SDK_INT >= 31) audioManager.clearCommunicationDevice();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "Communication device clear failed", e);
                  }
                  try { audioManager.stopBluetoothSco(); } catch(Exception ignored) {}
                  try { audioManager.setBluetoothScoOn(false); } catch(Exception ignored) {}
                  try { audioManager.setSpeakerphoneOn(false); } catch(Exception ignored) {}
                  try { audioManager.setMode(AudioManager.MODE_NORMAL); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "MODE_NORMAL restore failed", e); }
              }
          
              boolean waitForCommunicationDeviceActivation(long timeoutMs) {
                  if(!interpreterCommunicationFallbackActive || Build.VERSION.SDK_INT < 31 || audioManager == null || activeCommunicationDeviceId < 0)
                      return true;
                  long deadline = SystemClock.elapsedRealtime() + Math.max(0L, timeoutMs);
                  while(SystemClock.elapsedRealtime() < deadline) {
                      try {
                          AudioDeviceInfo current = audioManager.getCommunicationDevice();
                          if(current != null && current.getId() == activeCommunicationDeviceId) return true;
                      } catch(Exception e) {
                          android.util.Log.w(LOG_TAG, "Communication route status query failed", e);
                          return false;
                      }
                      SystemClock.sleep(60L);
                  }
                  android.util.Log.w(LOG_TAG, "Communication device activation timed out, deviceId=" + activeCommunicationDeviceId);
                  return false;
              }
          
              boolean activateInterpreterCommunicationFallback() {
                  if(!interpreterMode) return false;
                  if(audioManager == null) audioManager = (AudioManager)getSystemService(AUDIO_SERVICE);
                  if(audioManager == null) return false;
                  AudioDeviceInfo headset = findCommunicationHeadset();
                  if(headset == null) return false;
          
                  boolean oldReconfiguring = interpreterRouteReconfiguring;
                  interpreterRouteReconfiguring = true;
                  boolean accepted = false;
                  try {
                      clearForcedCommunicationRoute();
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      if(Build.VERSION.SDK_INT >= 31) {
                          accepted = audioManager.setCommunicationDevice(headset);
                      } else {
                          if(headset.getType() == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) {
                              try { audioManager.startBluetoothSco(); } catch(Exception e) { android.util.Log.w(LOG_TAG, "Bluetooth SCO start failed", e); }
                              try { audioManager.setBluetoothScoOn(true); } catch(Exception e) { android.util.Log.w(LOG_TAG, "Bluetooth SCO route failed", e); }
                          }
                          try { audioManager.setSpeakerphoneOn(false); } catch(Exception ignored) {}
                          accepted = true;
                      }
          
                      if(accepted) {
                          preferredInterpreterInputDevice = null;
                          interpreterCommunicationFallbackActive = true;
                          activeInterpreterRoute = "headset_communication_fallback";
                          activeCommunicationDeviceLabel = audioDeviceLabel(headset);
                          activeCommunicationDeviceId = headset.getId();
                          ttsController.refreshAudioAttributes();
                          refreshInterpreterFloatingButton();
                          refreshOpenInterpreterMenuButton();
                          return true;
                      }
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Communication fallback activation failed", e);
                  } finally {
                      interpreterRouteReconfiguring = oldReconfiguring;
                  }
          
                  clearForcedCommunicationRoute();
                  interpreterCommunicationFallbackActive = false;
                  activeCommunicationDeviceId = -1;
                  return false;
              }
          
              void configureInterpreterAudioRoute(boolean announce) {
                  if(!interpreterMode) {
                      restoreNormalAudioRoute();
                      return;
                  }
                  if(audioManager == null) audioManager = (AudioManager)getSystemService(AUDIO_SERVICE);
                  if(audioManager == null) {
                      activeInterpreterRoute = "speaker_half_duplex";
                      activeCommunicationDeviceLabel = "audioút nem érhető el";
                      preferredInterpreterInputDevice = null;
                      interpreterCommunicationFallbackActive = false;
                      return;
                  }
          
                  interpreterRouteReconfiguring = true;
                  try {
                      clearForcedCommunicationRoute();
                      AudioDeviceInfo headsetOutput = findPreferredInterpreterOutputDevice();
                      AudioDeviceInfo phoneMic = findBuiltInInterpreterMic();
                      preferredInterpreterInputDevice = null;
                      interpreterCommunicationFallbackActive = false;
          
                      // V40.11: külső beszélgetésnél a headset csak kimenet. A telefon mikrofonja
                      // szélesebb térből vesz, ezért nem nyomja el a másik személyt vagy a tesztként
                      // használt tablet hangszóróját úgy, mint a Buds közelbeszélő mikrofonlánca.
                      if(headsetOutput != null && phoneMic != null) {
                          preferredInterpreterInputDevice = phoneMic;
                          activeInterpreterRoute = "headset_output_phone_mic";
                          activeCommunicationDeviceLabel = audioDeviceLabel(headsetOutput);
                      } else {
                          preferredInterpreterInputDevice = findPreferredInterpreterInputDevice();
                          if(preferredInterpreterInputDevice != null) {
                              activeInterpreterRoute = "headset_direct";
                              activeCommunicationDeviceLabel = audioDeviceLabel(preferredInterpreterInputDevice);
                          } else if(!activateInterpreterCommunicationFallback()) {
                              activeInterpreterRoute = "speaker_half_duplex";
                              activeCommunicationDeviceLabel = "telefon mikrofon / hangszóró";
                          }
                      }
          
                      ttsController.refreshAudioAttributes();
                      showPlannedInputRoute();
                      refreshInterpreterFloatingButton();
                      refreshOpenInterpreterMenuButton();
                      if(announce) Toast.makeText(this, interpreterLabel(), Toast.LENGTH_SHORT).show();
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Interpreter audio route configuration failed", e);
                      clearForcedCommunicationRoute();
                      preferredInterpreterInputDevice = null;
                      interpreterCommunicationFallbackActive = false;
                      activeInterpreterRoute = "speaker_half_duplex";
                      activeCommunicationDeviceLabel = "biztonságos váltott mód";
                      ttsController.refreshAudioAttributes();
                  } finally {
                      interpreterRouteReconfiguring = false;
                  }
              }
          
              void restoreNormalAudioRoute() {
                  clearForcedCommunicationRoute();
                  preferredInterpreterInputDevice = null;
                  interpreterCommunicationFallbackActive = false;
                  activeCommunicationDeviceId = -1;
                  activeInterpreterRoute = "off";
                  activeCommunicationDeviceLabel = "";
                  ttsController.refreshAudioAttributes();
              }
          
              void beginHalfDuplexTtsGuard() {
                  if(!streaming) return;
                  synchronized(audioProcessingLock) {
                      try {
                          if(voiceSendActive) flushSpeechAudioWindow(true);
                      } catch(Exception e) {
                          android.util.Log.w(LOG_TAG, "Half-duplex pre-TTS flush failed", e);
                      }
                      // A 150 ms alatti maradék sem kapcsolódhat össze a TTS utáni új mondattal.
                      clearSpeechAudioWindow();
                      voiceSendActive = false;
                      clearPendingSpeechAudio();
                      clearPreRollAudio();
                      takeCapturedRemainder();
                      fallbackSpeechHangoverMs = 0;
                  }
              }
          
              boolean shouldMuteMicForSpeakerTts() {
                  return interpreterMode && isHalfDuplexSpeakerRoute() &&
                      ttsController.shouldMuteMicrophone();
              }
          
              void registerInterpreterAudioDeviceCallback() {
                  if(Build.VERSION.SDK_INT < 23 || audioManager == null || interpreterAudioDeviceCallback != null) return;
                  interpreterAudioDeviceCallback = new AudioDeviceCallback() {
                      @Override public void onAudioDevicesAdded(AudioDeviceInfo[] addedDevices) { scheduleInterpreterRouteRefresh(); }
                      @Override public void onAudioDevicesRemoved(AudioDeviceInfo[] removedDevices) { scheduleInterpreterRouteRefresh(); }
                  };
                  try { audioManager.registerAudioDeviceCallback(interpreterAudioDeviceCallback, interpreterRouteHandler); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "Audio device callback registration failed", e); }
              }
          
              void unregisterInterpreterAudioDeviceCallback() {
                  interpreterRouteHandler.removeCallbacksAndMessages(null);
                  if(Build.VERSION.SDK_INT >= 23 && audioManager != null && interpreterAudioDeviceCallback != null) {
                      try { audioManager.unregisterAudioDeviceCallback(interpreterAudioDeviceCallback); }
                      catch(Exception e) { android.util.Log.w(LOG_TAG, "Audio device callback unregister failed", e); }
                  }
                  interpreterAudioDeviceCallback = null;
              }
          
              void scheduleInterpreterRouteRefresh() {
                  if(!interpreterMode || interpreterRouteReconfiguring || finalizingStop) return;
                  interpreterRouteHandler.removeCallbacksAndMessages(null);
                  interpreterRouteHandler.postDelayed(() -> {
                      if(!interpreterMode || interpreterRouteReconfiguring || finalizingStop) return;
                      if(rejectedInterpreterInputDeviceId >= 0 && !isInputDeviceIdPresent(rejectedInterpreterInputDeviceId))
                          rejectedInterpreterInputDeviceId = -1;
                      boolean headsetOutputNow = findPreferredInterpreterOutputDevice() != null;
                      boolean phoneMicHeadsetWas = "headset_output_phone_mic".equals(activeInterpreterRoute);
                      boolean directNow = !headsetOutputNow && findPreferredInterpreterInputDevice() != null;
                      boolean directWas = "headset_direct".equals(activeInterpreterRoute);
                      boolean anyHeadsetNow = headsetOutputNow || directNow || findCommunicationHeadset() != null;
                      boolean anyHeadsetWas = isHeadsetInterpreterRoute();
                      if(headsetOutputNow == phoneMicHeadsetWas && directNow == directWas && anyHeadsetNow == anyHeadsetWas) return;
                      boolean wasStreaming = streaming;
                      if(wasStreaming) stop(false);
                      configureInterpreterAudioRoute(false);
                      if(wasStreaming) new Handler(Looper.getMainLooper()).postDelayed(() -> startMicrophone(), 500L);
                      updateButtons();
                  }, 850L);
              }
          
              void resetAudioModeState() {
                  streaming = false;
                  microphoneStarting = false;
                  microphonePcmReady = false;
                  microphoneStartUiEarliestMs = 0L;
                  cancelMicLifeSignal();
                  voiceSendActive = false;
                  clearPreRollAudio();
                  clearPendingSpeechAudio();
                  clearSpeechAudioWindow();
                  closeExternalVad();
                  resetCapturedFrameState();
                  synchronized(captureRateRemainder) { captureRateRemainder.reset(); }
                  activeCaptureSampleRate = AUDIO_SAMPLE_RATE;
                  activeCaptureChannelCount = 1;
                  directBleCaptureActive = false;
                  directBleDigitalSilenceMs = 0L;
                  directBleFallbackRequested = false;
                  resetSttOrderingForNewSession();
                  try { if(rec != null) { rec.stop(); rec.release(); } } catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord reset failed", e); }
                  rec = null;
              }
          
              byte[] normalizeCapturedPcmTo16k(byte[] data, int len) {
                  if(data == null || len <= 0) return new byte[0];
                  synchronized(captureRateRemainder) {
                      captureRateRemainder.write(data, 0, len);
                      byte[] all = captureRateRemainder.toByteArray();
                      int rateRatio = activeCaptureSampleRate == 32000 ? 2 : 1;
                      int channels = Math.max(1, activeCaptureChannelCount);
                      int inputGroupBytes = rateRatio * channels * 2;
                      int usable = all.length - (all.length % inputGroupBytes);
                      if(usable <= 0) return new byte[0];
          
                      ByteArrayOutputStream out = new ByteArrayOutputStream(usable / (rateRatio * channels));
                      for(int i=0;i<usable;i+=inputGroupBytes) {
                          long sum = 0L;
                          int sampleCount = rateRatio * channels;
                          int pos = i;
                          for(int n=0;n<sampleCount;n++) {
                              short sample = (short)(((all[pos+1] & 0xff) << 8) | (all[pos] & 0xff));
                              sum += sample;
                              pos += 2;
                          }
                          int avg = (int)(sum / Math.max(1, sampleCount));
                          out.write(avg & 0xff);
                          out.write((avg >> 8) & 0xff);
                      }
                      captureRateRemainder.reset();
                      if(usable < all.length) captureRateRemainder.write(all, usable, all.length - usable);
                      return out.toByteArray();
                  }
              }
          
              void monitorDirectBleSignal(byte[] pcm16k, int len) {
                  if(!directBleCaptureActive || directBleFallbackRequested || !interpreterMode ||
                     !"headset_direct".equals(activeInterpreterRoute) || pcm16k == null || len < 2) return;
                  int maxAbs = 0;
                  for(int i=0;i+1<len;i+=2) {
                      short sample = (short)(((pcm16k[i+1] & 0xff) << 8) | (pcm16k[i] & 0xff));
                      int abs = Math.abs((int)sample);
                      if(abs > maxAbs) maxAbs = abs;
                  }
                  int ms = pcm16Mono16kMs(len);
                  if(maxAbs <= 2) directBleDigitalSilenceMs += ms;
                  else directBleDigitalSilenceMs = 0L;
                  if(directBleDigitalSilenceMs < 5000L) return;
          
                  directBleFallbackRequested = true;
                  final int rejectedId = preferredInterpreterInputDevice == null ? -1 : preferredInterpreterInputDevice.getId();
                  android.util.Log.w(LOG_TAG, "Direct BLE route produced digital silence; switching to communication fallback, deviceId=" + rejectedId);
                  runOnUiThread(() -> {
                      if(!streaming || !interpreterMode || !"headset_direct".equals(activeInterpreterRoute)) return;
                      stop(false);
                      if(rejectedId >= 0) rejectedInterpreterInputDeviceId = rejectedId;
                      state.setText("headset bemenet néma – tartalék út");
                      setInputRouteHeader("BEMENET: kommunikációs váltás…");
                      new Handler(Looper.getMainLooper()).postDelayed(() -> {
                          if(interpreterMode && !streaming && !finalizingStop) startMicrophone();
                      }, 850L);
                  });
              }
          
              void markMicrophoneUiReady(AudioRecord activeRec) {
                  if(!microphoneStarting || !microphonePcmReady || !streaming || rec != activeRec) return;
                  long waitMs = Math.max(0L, microphoneStartUiEarliestMs - android.os.SystemClock.elapsedRealtime());
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(!microphoneStarting || !microphonePcmReady || !streaming || rec != activeRec) return;
                      microphoneStarting = false;
                      String base = vadFallbackActive ? "mikrofon aktív – VAD tartalék mód" : "mikrofon aktív";
                      if(interpreterMode) base += " – " + interpreterRuntimeShortLabel();
                      state.setText(base);
                      scheduleMicLifeSignal();
                      updateButtons();
                  }, waitMs);
              }
          
              void audioLoop() {
                  int sr = AUDIO_SAMPLE_RATE;
                  int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  int bs = Math.max(min, 4800);
          
                  rec = makeBestAudioRecord(sr, bs);
                  if(rec == null) {
                      microphoneStarting = false;
                      microphonePcmReady = false;
                      stopBackgroundForegroundService();
                      runOnUiThread(() -> { state.setText("mikrofon nem inicializálható"); setInputRouteHeader("BEMENET: HIBA"); updateButtons(); });
                      return;
                  }
                  try {
                      ensureExternalVadReady();
                      rec.startRecording();
                      if(rec.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING) throw new IllegalStateException("AudioRecord did not enter recording state");
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Microphone start failed", e);
                      microphoneStarting = false;
                      microphonePcmReady = false;
                          try { rec.release(); } catch(Exception releaseError) { android.util.Log.w(LOG_TAG, "AudioRecord release failed", releaseError); }
                      rec = null;
                      stopBackgroundForegroundService();
                      runOnUiThread(() -> { state.setText("mikrofon indítási hiba"); setInputRouteHeader("BEMENET: HIBA"); updateButtons(); });
                      return;
                  }
          
                  streaming = true;
                  final AudioRecord activeRec = rec;
                  registerActualInputRouteUpdates(activeRec);
                  refreshActualInputRoute(activeRec);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(rec == activeRec && streaming) refreshActualInputRoute(activeRec);
                  }, 450L);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if(rec == activeRec && streaming) refreshActualInputRoute(activeRec);
                  }, 1400L);
                  styleUiState();
                  runOnUiThread(() -> {
                      state.setText("mikrofon előkészítés");
                      updateButtons();
                  });
          
                  audioExec.submit(() -> {
                      int rateRatio = activeCaptureSampleRate == 32000 ? 2 : 1;
                      int captureFrameBytes = SILERO_FRAME_BYTES * rateRatio * Math.max(1, activeCaptureChannelCount);
                      byte[] buf = new byte[captureFrameBytes];
                      clearPreRollAudio();
                      clearPendingSpeechAudio();
                      clearSpeechAudioWindow();
                      voiceSendActive = false;
                      while((streaming || finalizingStop) && activeRec != null) {
                          int read;
                          try {
                              read = activeRec.read(buf, 0, buf.length, AudioRecord.READ_BLOCKING);
                          } catch(Exception e) {
                              android.util.Log.e(LOG_TAG, "AudioRecord read threw", e);
                              runOnUiThread(() -> state.setText("mikrofon olvasási hiba"));
                              break;
                          }
                          if(read > 0) {
                              if(!streaming && !finalizingStop) break;
                              try {
                                  byte[] pcm16k = normalizeCapturedPcmTo16k(buf, read);
                                  if(pcm16k.length == 0) continue;
                                  if(!microphonePcmReady) {
                                      microphonePcmReady = true;
                                      markMicrophoneUiReady(activeRec);
                                  }
                                  monitorDirectBleSignal(pcm16k, pcm16k.length);
                                  synchronized(audioProcessingLock) {
                                      processCapturedAudio(pcm16k, pcm16k.length);
                                  }
                              } catch(Exception e) {
                                  android.util.Log.e(LOG_TAG, "Audio processing failed", e);
                                  activateVadFallback("Audio processing failure", e);
                              }
                          } else if(read < 0) {
                              final int code = read;
                              android.util.Log.e(LOG_TAG, "AudioRecord read error code=" + code);
                              runOnUiThread(() -> state.setText("mikrofon olvasási hiba: " + code));
                              break;
                          }
                      }
                      if(streaming && !finalizingStop) runOnUiThread(() -> stop(false));
                  });
              }
          
              void stop() {
                  stop(true);
              }
          
              void stop(boolean flushRemaining) {
                  if(finalizingStop && flushRemaining) return;
                  streaming = false;
                  microphoneStarting = false;
                  microphonePcmReady = false;
                  microphoneStartUiEarliestMs = 0L;
                  cancelMicLifeSignal();
                  ttsController.resetMuteGuard();
          
                  AudioRecord stoppingRec = rec;
                  rec = null;
                  setInputRouteHeader("BEMENET: —");
                  try {
                      if(stoppingRec != null) stoppingRec.stop();
                  } catch(Exception e) {
                      android.util.Log.w(LOG_TAG, "AudioRecord stop failed", e);
                  }
          
                  if(flushRemaining) {
                      finalizingStop = true;
                      stopAudioDrainPending = true;
                      state.setText("utolsó mondat feldolgozása");
                      updateButtons();
                      final long stopSession = sttCoordinator.sessionId();
                      final AudioRecord recorderToRelease = stoppingRec;
                      try {
                          // Ugyanazon az egyszálú executoron fut: csak az audioLoop teljes
                          // kilépése után zárhatja le és küldheti el a maradék hangot.
                          audioExec.submit(() -> runOnUiThread(() -> finalizeGracefulStopAfterAudioLoop(stopSession, recorderToRelease)));
                      } catch(Exception e) {
                          android.util.Log.e(LOG_TAG, "Stop finalizer scheduling failed", e);
                          finalizeGracefulStopAfterAudioLoop(stopSession, recorderToRelease);
                      }
                      return;
                  }
          
                  try { if(stoppingRec != null) stoppingRec.release(); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord release failed", e); }
                  stopAudioDrainPending = false;
                  // Azonnali belső leállításnál a régi HTTP válaszok nem kerülhetnek
                  // egy később induló mikrofonmenet blokkjaiba.
                  resetSttOrderingForNewSession();
                  finishStopCleanup();
              }
          
              void finalizeGracefulStopAfterAudioLoop(long stopSession, AudioRecord recorderToRelease) {
                  try { if(recorderToRelease != null) recorderToRelease.release(); }
                  catch(Exception e) { android.util.Log.w(LOG_TAG, "AudioRecord delayed release failed", e); }
                  if(stopSession != sttCoordinator.sessionId() || !finalizingStop) return;
                  synchronized(audioProcessingLock) {
                      byte[] remainder = takeCapturedRemainder();
                      if(voiceSendActive && remainder.length > 0) appendSpeechAudioChunk(remainder);
                      if(!voiceSendActive && pendingSpeechAudioDurationMs() > 0) {
                          for(byte[] pr : takePreRollAudio()) appendSpeechAudioChunk(pr);
                          for(byte[] ps : takePendingSpeechAudio()) appendSpeechAudioChunk(ps);
                      }
                      voiceSendActive = false;
                      clearPendingSpeechAudio();
                      clearPreRollAudio();
                      flushSpeechAudioWindow(true);
                  }
                  closeExternalVad();
                  stopAudioDrainPending = false;
                  if(sttCoordinator.requestsInFlight() > 0 || speechTranslateMode || pendingSpeechBlockId >= 0 || conversation.hasQueuedTranslations()) {
                      state.setText("utolsó mondat feldolgozása");
                      updateButtons();
                  } else {
                      finishStopCleanup();
                  }
              }
          
              void maybeFinishStop() {
                  if(!finalizingStop || stopAudioDrainPending) return;
                  if(sttCoordinator.requestsInFlight() > 0) return;
                  if(speechTranslateMode || pendingSpeechBlockId >= 0 || conversation.hasQueuedTranslations()) return;
                  finishStopCleanup();
              }
          
