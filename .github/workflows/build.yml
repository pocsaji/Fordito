              Object buildVadByReflection(String mode) throws Exception {
                  if(!"silero".equals(mode) && !"silero_medium".equals(mode)) mode = "silero";
                  Class<?> vadClass = Class.forName("com.konovalov.vad.silero.Vad");
                  Object b = vadClass.getMethod("builder").invoke(null);
                  b.getClass().getMethod("setContext", android.content.Context.class).invoke(b, this);
                  b.getClass().getMethod("setSampleRate", Class.forName("com.konovalov.vad.silero.config.SampleRate")).invoke(b, enumConst("com.konovalov.vad.silero.config.SampleRate", "SAMPLE_RATE_16K"));
                  b.getClass().getMethod("setFrameSize", Class.forName("com.konovalov.vad.silero.config.FrameSize")).invoke(b, enumConst("com.konovalov.vad.silero.config.FrameSize", "FRAME_SIZE_512"));
                  String sileroModeName = "silero_medium".equals(mode) ? "AGGRESSIVE" : "NORMAL";
                  b.getClass().getMethod("setMode", Class.forName("com.konovalov.vad.silero.config.Mode")).invoke(b, enumConst("com.konovalov.vad.silero.config.Mode", sileroModeName));
                  b.getClass().getMethod("setSilenceDurationMs", int.class).invoke(b, VAD_SPEECH_END_SILENCE_MS);
                  b.getClass().getMethod("setSpeechDurationMs", int.class).invoke(b, VAD_SPEECH_START_MS);
                  return b.getClass().getMethod("build").invoke(b);
              }
          
              boolean ensureExternalVadReady() {
                  if(!"silero".equals(vadEngineMode) && !"silero_medium".equals(vadEngineMode)) vadEngineMode = "silero";
                  if(speechVadInstance != null && vadEngineMode.equals(speechVadInstanceMode)) return true;
                  closeExternalVad();
                  try {
                      speechVadInstance = buildVadByReflection(vadEngineMode);
                      speechVadInstanceMode = vadEngineMode;
                      sileroFatalError = speechVadInstance == null;
                      return !sileroFatalError;
                  } catch(Exception e) {
                      sileroFatalError = true;
                      android.util.Log.e(LOG_TAG, "Silero VAD initialization failed: " + vadEngineMode, e);
                      closeExternalVad();
                      return false;
                  }
              }
          
              int activeVadFrameBytes() {
                  return SILERO_FRAME_BYTES;
              }
          
              int frameDurationMs(int frameBytes) {
                  return Math.max(1, pcm16Mono16kMs(frameBytes));
              }
          
              boolean invokeVadOnExactFrame(byte[] frame) throws Exception {
                  if(speechVadInstance == null) throw new IllegalStateException("VAD instance is null");
                  try {
                      Object r = speechVadInstance.getClass().getMethod("isSpeech", byte[].class).invoke(speechVadInstance, (Object)frame);
                      return Boolean.TRUE.equals(r);
                  } catch(NoSuchMethodException nsme) {
                      short[] sf = new short[frame.length / 2];
                      for(int i=0;i<sf.length;i++) {
                          int lo = frame[i*2] & 0xff;
                          int hi = frame[i*2+1];
                          sf[i] = (short)((hi << 8) | lo);
                      }
                      Object r = speechVadInstance.getClass().getMethod("isSpeech", short[].class).invoke(speechVadInstance, (Object)sf);
                      return Boolean.TRUE.equals(r);
                  }
              }
          
              boolean externalVadOverGate(byte[] exactFrame) throws Exception {
                  if(!ensureExternalVadReady()) throw new IllegalStateException("Silero VAD nem inicializálható");
                  try {
                      return invokeVadOnExactFrame(exactFrame);
                  } catch(Exception e) {
                      sileroFatalError = true;
                      closeExternalVad();
                      throw new IllegalStateException("Silero VAD futási hiba", e);
                  }
              }
          
              void abortCurrentSpeechTurn() {
                  voiceSendActive = false;
                  clearPendingSpeechAudio();
                  clearPreRollAudio();
                  clearSpeechAudioWindow();
                  sendRealtimeClearBuffer();
              }
          
              void processVadFrame(PcmFramePair frame) throws Exception {
                  if(frame == null || frame.pcm16k.length == 0) return;
                  if(shouldMuteMicForSpeakerTts()) {
                      abortCurrentSpeechTurn();
                      return;
                  }
          
                  long now = System.currentTimeMillis();
                  boolean overGate = externalVadOverGate(frame.pcm16k);
                  if(overGate) {
                      if(!voiceSendActive) {
                          rememberPendingSpeechAudio(frame);
                          if(pendingSpeechAudioDurationMs() < MIN_TRUE_SPEECH_AUDIO_MS) return;
                          if(firstSpeechHeardAt == 0L) firstSpeechHeardAt = now;
                          for(PcmFramePair pr : takePreRollAudio()) sendAudioFrame(pr);
                          for(PcmFramePair ps : takePendingSpeechAudio()) sendAudioFrame(ps);
                      } else {
                          sendAudioFrame(frame);
                      }
                      voiceSendActive = true;
                      return;
                  }
          
                  if(voiceSendActive) {
                      voiceSendActive = false;
                      finishSpeechUtterance();
                  }
                  clearPendingSpeechAudio();
                  rememberPreRollAudio(frame);
              }
          
              short[] decodeCapturedMono(byte[] raw, int offset, int frameBytes) {
                  int channels = Math.max(1, activeCaptureChannelCount);
                  int samples = frameBytes / (2 * channels);
                  short[] mono = new short[samples];
                  int pos = offset;
                  for(int i=0;i<samples;i++) {
                      long sum = 0L;
                      for(int c=0;c<channels;c++) {
                          short v = (short)(((raw[pos+1] & 0xff) << 8) | (raw[pos] & 0xff));
                          sum += v;
                          pos += 2;
                      }
                      mono[i] = (short)(sum / channels);
                  }
                  return mono;
              }
          
              byte[] encodeMonoPcm16(short[] input) {
                  if(input == null || input.length == 0) return new byte[0];
                  byte[] out = new byte[input.length * 2];
                  for(int i=0;i<input.length;i++) {
                      int value = input[i];
                      out[i*2] = (byte)(value & 0xff);
                      out[i*2+1] = (byte)((value >> 8) & 0xff);
                  }
                  return out;
              }
          
              byte[] downsampleIntegerRatioPcm16(short[] input, int ratio) {
                  if(input == null || input.length == 0 || ratio <= 0 || input.length % ratio != 0) return new byte[0];
                  int outputSamples = input.length / ratio;
                  byte[] out = new byte[outputSamples * 2];
                  for(int i=0;i<outputSamples;i++) {
                      long sum = 0L;
                      int base = i * ratio;
                      for(int j=0;j<ratio;j++) sum += input[base + j];
                      int value = (int)Math.round(sum / (double)ratio);
                      value = Math.max(Short.MIN_VALUE, Math.min(Short.MAX_VALUE, value));
                      out[i*2] = (byte)(value & 0xff);
                      out[i*2+1] = (byte)((value >> 8) & 0xff);
                  }
                  return out;
              }
          
              byte[] resampleMonoPcm16(short[] input, int outputSamples) {
                  if(input == null || input.length == 0 || outputSamples <= 0) return new byte[0];
                  if(input.length == outputSamples) return encodeMonoPcm16(input);
                  byte[] out = new byte[outputSamples * 2];
                  double ratio = input.length / (double)outputSamples;
                  for(int i=0;i<outputSamples;i++) {
                      // Mintaközéppont-alapú leképezés: nem húzza szét a két végpontot és nem okoz periodikus driftet.
                      double src = (i + 0.5) * ratio - 0.5;
                      if(src < 0.0) src = 0.0;
                      if(src > input.length - 1.0) src = input.length - 1.0;
                      int a = (int)Math.floor(src);
                      int b = Math.min(input.length - 1, a + 1);
                      double f = src - a;
                      int value = (int)Math.round(input[a] * (1.0 - f) + input[b] * f);
                      value = Math.max(Short.MIN_VALUE, Math.min(Short.MAX_VALUE, value));
                      out[i*2] = (byte)(value & 0xff);
                      out[i*2+1] = (byte)((value >> 8) & 0xff);
                  }
                  return out;
              }
          
              byte[] resampleDownByAreaPcm16(short[] input, int outputSamples) {
                  if(input == null || input.length == 0 || outputSamples <= 0) return new byte[0];
                  if(input.length == outputSamples) return encodeMonoPcm16(input);
                  if(outputSamples > input.length) return resampleMonoPcm16(input, outputSamples);
                  byte[] out = new byte[outputSamples * 2];
                  double scale = input.length / (double)outputSamples;
                  for(int i=0;i<outputSamples;i++) {
                      double start = i * scale;
                      double end = (i + 1) * scale;
                      int first = (int)Math.floor(start);
                      int last = (int)Math.ceil(end) - 1;
                      double weighted = 0.0;
                      double weightSum = 0.0;
                      for(int j=first;j<=last;j++) {
                          int idx = Math.max(0, Math.min(input.length - 1, j));
                          double overlap = Math.min(end, j + 1.0) - Math.max(start, j);
                          if(overlap > 0.0) {
                              weighted += input[idx] * overlap;
                              weightSum += overlap;
                          }
                      }
                      int value = weightSum > 0.0 ? (int)Math.round(weighted / weightSum) : 0;
                      value = Math.max(Short.MIN_VALUE, Math.min(Short.MAX_VALUE, value));
                      out[i*2] = (byte)(value & 0xff);
                      out[i*2+1] = (byte)((value >> 8) & 0xff);
                  }
                  return out;
              }
          
              ArrayList<PcmFramePair> normalizeCapturedFrames(byte[] data, int len) {
                  ArrayList<PcmFramePair> out = new ArrayList<>();
                  if(data == null || len <= 0) return out;
                  synchronized(captureRateRemainder) {
                      captureRateRemainder.write(data, 0, len);
                      byte[] all = captureRateRemainder.toByteArray();
                      int channels = Math.max(1, activeCaptureChannelCount);
                      int inputSamples = Math.max(1, activeCaptureSampleRate * SILERO_FRAME_MS / 1000);
                      int inputFrameBytes = inputSamples * channels * 2;
                      int pos = 0;
                      while(pos + inputFrameBytes <= all.length) {
                          short[] mono = decodeCapturedMono(all, pos, inputFrameBytes);
                          byte[] pcm16;
                          byte[] pcm24;
                          if(activeCaptureSampleRate == CAPTURE_SAMPLE_RATE && mono.length == SILERO_FRAME_SAMPLES * 3) {
                              pcm16 = downsampleIntegerRatioPcm16(mono, 3); // 48 -> 16 kHz
                              pcm24 = downsampleIntegerRatioPcm16(mono, 2); // 48 -> 24 kHz
                          } else if(activeCaptureSampleRate == REALTIME_SAMPLE_RATE && mono.length == REALTIME_SAMPLE_RATE * SILERO_FRAME_MS / 1000) {
                              pcm16 = resampleDownByAreaPcm16(mono, SILERO_FRAME_SAMPLES); // 24 -> 16 kHz tartalék, aluláteresztő átlagolással
                              pcm24 = encodeMonoPcm16(mono);                       // 24 kHz változatlan
                          } else {
                              pcm16 = resampleMonoPcm16(mono, SILERO_FRAME_SAMPLES);
                              pcm24 = resampleMonoPcm16(mono, REALTIME_SAMPLE_RATE * SILERO_FRAME_MS / 1000);
                          }
                          if(pcm16.length == SILERO_FRAME_BYTES && pcm24.length == REALTIME_SAMPLE_RATE * SILERO_FRAME_MS / 1000 * 2)
                              out.add(new PcmFramePair(pcm16, pcm24));
                          pos += inputFrameBytes;
                      }
                      captureRateRemainder.reset();
                      if(pos < all.length) captureRateRemainder.write(all, pos, all.length - pos);
                  }
                  return out;
              }
          
              void processCapturedAudio(byte[] data, int len) throws Exception {
                  for(PcmFramePair frame : normalizeCapturedFrames(data, len)) processVadFrame(frame);
              }
          
              byte[] takeCapturedRemainder() {
                  synchronized(captureRateRemainder) {
                      byte[] out = captureRateRemainder.toByteArray();
                      captureRateRemainder.reset();
                      return out;
                  }
              }
          
              void clearSpeechAudioWindow() {
                  RealtimeUtterance abandoned;
                  synchronized(speechAudioWindowLock) {
                      abandoned = activeRealtimeUtterance;
                      speechAudioWindow.reset();
                      currentTurnRealtimeEligible = false;
                      currentTurnRealtimeBytes = 0;
                      currentTurnNewAudioMs = 0;
                      realtimeOverlapFrames.clear();
                      realtimeOverlapMs = 0;
                      activeRealtimeUtterance = null;
                  }
                  if(abandoned != null && !abandoned.finalized) runOnUiThread(() -> removeRealtimeUtteranceBlock(abandoned));
              }
          
              int speechAudioWindowMs() {
                  synchronized(speechAudioWindowLock) { return pcm16Mono16kMs(speechAudioWindow.size()); }
              }
          
              boolean sendRealtimeAudio(byte[] pcm24k) {
                  if(pcm24k == null || pcm24k.length == 0 || !realtimeSessionReady) return false;
                  try {
                      JSONObject event = new JSONObject()
                          .put("type", "input_audio_buffer.append")
                          .put("audio", Base64.encodeToString(pcm24k, Base64.NO_WRAP));
                      return sendRealtimeJson(event);
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Realtime audio append failed", e);
                      return false;
                  }
              }
          
              void rememberRealtimeOverlapLocked(PcmFramePair frame) {
                  realtimeOverlapFrames.add(copyFramePair(frame));
                  realtimeOverlapMs += SILERO_FRAME_MS;
                  while(realtimeOverlapMs > REALTIME_OVERLAP_MS && !realtimeOverlapFrames.isEmpty()) {
                      realtimeOverlapFrames.poll();
                      realtimeOverlapMs = Math.max(0, realtimeOverlapMs - SILERO_FRAME_MS);
                  }
              }
          
              ArrayList<PcmFramePair> copyRealtimeOverlapLocked() {
                  ArrayList<PcmFramePair> out = new ArrayList<>();
                  for(PcmFramePair frame : realtimeOverlapFrames) out.add(copyFramePair(frame));
                  return out;
              }
          
              RealtimeUtterance ensureRealtimeUtteranceLocked() {
                  if(activeRealtimeUtterance == null || activeRealtimeUtterance.session != sttSessionId || activeRealtimeUtterance.endRequested)
                      activeRealtimeUtterance = new RealtimeUtterance(sttSessionId, ++realtimeUtteranceSeq);
                  return activeRealtimeUtterance;
              }
          
              void appendSpeechAudioFrame(PcmFramePair frame) {
                  if(frame == null || frame.pcm16k.length == 0 || client == null) return;
                  boolean previewCommit;
                  synchronized(speechAudioWindowLock) {
                      ensureRealtimeUtteranceLocked();
                      if(speechAudioWindow.size() == 0) {
                          currentTurnRealtimeEligible = realtimeSessionReady;
                          currentTurnRealtimeBytes = 0;
                          currentTurnNewAudioMs = 0;
                      }
                      speechAudioWindow.write(frame.pcm16k, 0, frame.pcm16k.length);
                      currentTurnNewAudioMs += SILERO_FRAME_MS;
                      rememberRealtimeOverlapLocked(frame);
                      if(currentTurnRealtimeEligible) {
                          if(sendRealtimeAudio(frame.pcm24k)) currentTurnRealtimeBytes += frame.pcm24k.length;
                          else currentTurnRealtimeEligible = false;
                      }
                      previewCommit = currentTurnNewAudioMs >= REALTIME_PREVIEW_COMMIT_MS;
                  }
                  if(previewCommit) commitRealtimeAudioChunk(false);
              }
          
              void primeNextRealtimeChunk(ArrayList<PcmFramePair> overlap) {
                  if(overlap == null || overlap.isEmpty()) return;
                  synchronized(speechAudioWindowLock) {
                      if(activeRealtimeUtterance == null || activeRealtimeUtterance.endRequested) return;
                      currentTurnRealtimeEligible = realtimeSessionReady;
                      currentTurnRealtimeBytes = 0;
                      currentTurnNewAudioMs = 0;
                      for(PcmFramePair frame : overlap) {
                          speechAudioWindow.write(frame.pcm16k, 0, frame.pcm16k.length);
                          if(currentTurnRealtimeEligible) {
                              if(sendRealtimeAudio(frame.pcm24k)) currentTurnRealtimeBytes += frame.pcm24k.length;
                              else currentTurnRealtimeEligible = false;
                          }
                      }
                  }
              }
          
              void commitRealtimeAudioChunk(boolean finalChunk) {
                  byte[] ready = null;
                  boolean useRealtime = false;
                  RealtimeUtterance utterance;
                  ArrayList<PcmFramePair> overlap = new ArrayList<>();
                  synchronized(speechAudioWindowLock) {
                      utterance = activeRealtimeUtterance;
                      if(utterance == null) return;
                      int requiredNewMs = finalChunk ? REALTIME_MIN_FINAL_NEW_AUDIO_MS : REALTIME_PREVIEW_COMMIT_MS;
                      if(currentTurnNewAudioMs >= requiredNewMs && speechAudioWindow.size() > 0) {
                          ready = speechAudioWindow.toByteArray();
                          useRealtime = currentTurnRealtimeEligible && currentTurnRealtimeBytes > 0 && realtimeSessionReady;
                          if(!finalChunk) overlap = copyRealtimeOverlapLocked();
                      }
                      speechAudioWindow.reset();
                      currentTurnRealtimeEligible = false;
                      currentTurnRealtimeBytes = 0;
                      currentTurnNewAudioMs = 0;
                      if(finalChunk) {
                          realtimeOverlapFrames.clear();
                          realtimeOverlapMs = 0;
                          activeRealtimeUtterance = null;
                      }
                  }
          
                  if(ready != null) submitRealtimeTurn(ready, utterance, finalChunk, useRealtime);
                  else if(finalChunk) {
                      synchronized(utterance) { utterance.endRequested = true; }
                      runOnUiThread(() -> maybeFinalizeRealtimeUtterance(utterance));
                  }
          
                  if(!finalChunk) primeNextRealtimeChunk(overlap);
              }
          
              void finishSpeechUtterance() {
                  commitRealtimeAudioChunk(true);
              }
          
              byte[] wavFromPcm16k(byte[] pcm) throws Exception {
                  int dataLen = pcm == null ? 0 : pcm.length;
                  ByteArrayOutputStream out = new ByteArrayOutputStream(44 + dataLen);
                  writeAscii(out, "RIFF"); writeIntLE(out, 36 + dataLen); writeAscii(out, "WAVE");
                  writeAscii(out, "fmt "); writeIntLE(out, 16); writeShortLE(out, 1); writeShortLE(out, 1);
                  writeIntLE(out, AUDIO_SAMPLE_RATE); writeIntLE(out, AUDIO_SAMPLE_RATE * 2); writeShortLE(out, 2); writeShortLE(out, 16);
                  writeAscii(out, "data"); writeIntLE(out, dataLen);
                  if(pcm != null) out.write(pcm);
                  return out.toByteArray();
              }
          
              void writeAscii(ByteArrayOutputStream out, String v) throws Exception { out.write(v.getBytes("US-ASCII")); }
              void writeIntLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); out.write((v >> 16) & 255); out.write((v >> 24) & 255); }
              void writeShortLE(ByteArrayOutputStream out, int v) { out.write(v & 255); out.write((v >> 8) & 255); }
          
              synchronized int[] allocateSttRequestOrder() {
                  if(!streaming && !finalizingStop) return null;
                  sttRequestsInFlight++;
                  return new int[]{sttSessionId, ++sttRequestSeq};
              }
          
              void completeSttRequest(int session, int seq, String transcript, boolean finalFlush, String error) {
                  if(session != sttSessionId) return;
                  sttRequestsInFlight = Math.max(0, sttRequestsInFlight - 1);
                  pendingSttResults.put(seq, new SttResult(transcript, finalFlush, error));
                  while(true) {
                      SttResult ready = pendingSttResults.remove(sttDeliverSeq);
                      if(ready == null) break;
                      sttDeliverSeq++;
                      if(ready.transcript.trim().length() > 0) {
                          handleTranscriptCompleted(ready.transcript.trim(), ready.finalFlush);
                      } else if(ready.error.length() > 0) {
                          android.util.Log.e(LOG_TAG, "STT request failed: " + ready.error);
                          state.setText(streaming ? "mikrofon aktív – STT hiba" : "STT hiba – az előző átiratok megmaradtak");
                      }
                  }
                  maybeFinishStop();
              }
          
              synchronized void resetSttOrderingForNewSession() {
                  sttSessionId++;
                  sttRequestSeq = 0;
                  sttDeliverSeq = 1;
                  sttRequestsInFlight = 0;
                  pendingSttResults.clear();
              }
          
              void transcribeAudioWindow(byte[] pcm, boolean finalFlush) {
                  if(pcm == null || pcm.length == 0 || client == null || !hasKey()) return;
                  // Belső, azonnali leállítás után a még futó audio-szál nem indíthat
                  // új STT-kérést. Graceful STOP alatt viszont a maradék még elküldhető.
                  int[] requestOrder = allocateSttRequestOrder();
                  if(requestOrder == null) return;
                  final int session = requestOrder[0];
                  final int seq = requestOrder[1];
                  try {
                      byte[] wav = wavFromPcm16k(pcm);
                      MultipartBody body = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("model", "gpt-4o-mini-transcribe")
                          .addFormDataPart("response_format", "json")
                          .addFormDataPart("prompt", speechTranscriptionPrompt())
                          .addFormDataPart("file", "speech.wav", RequestBody.create(MediaType.parse("audio/wav"), wav))
                          .build();
                      Request req = new Request.Builder().url("https://api.openai.com/v1/audio/transcriptions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .post(body).build();
                      client.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "kapcsolat: " + e.getMessage()));
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "HTTP " + response.code()));
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  String tr = obj.optString("text", "").trim();
                                  runOnUiThread(() -> completeSttRequest(session, seq, tr, finalFlush, ""));
                              } catch(Exception e) {
                                  runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "válasz nem értelmezhető"));
                              }
                          }
                      });
                  } catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "STT preparation failed", e);
                      runOnUiThread(() -> completeSttRequest(session, seq, "", finalFlush, "előkészítés: " + e.getMessage()));
                  }
              }
          
              void sendAudioFrame(PcmFramePair frame) {
                  appendSpeechAudioFrame(frame);
              }
          
              String realtimeDelaySetting() {
                  if("minimal".equals(delayMode) || "low".equals(delayMode) || "medium".equals(delayMode) || "high".equals(delayMode) || "xhigh".equals(delayMode)) return delayMode;
                  return "low";
              }
          
              void startRealtimeTranscriptionSession() {
                  closeRealtimeTranscriptionSession(false);
                  if(!hasKey()) return;
                  final int generation;
                  synchronized(realtimeLock) {
                      generation = ++realtimeGeneration;
                      realtimeSocketOpen = false;
                      realtimeSessionReady = false;
                  }
                  realtimeClient = new OkHttpClient.Builder()
                      .connectTimeout(20, TimeUnit.SECONDS)
                      .readTimeout(0, TimeUnit.MILLISECONDS)
                      .writeTimeout(30, TimeUnit.SECONDS)
                      .pingInterval(20, TimeUnit.SECONDS)
                      .build();
                  Request request = new Request.Builder()
                      .url("wss://api.openai.com/v1/realtime?model=gpt-realtime-whisper")
                      .addHeader("Authorization", "Bearer " + apiKey.trim())
                      .build();
                  realtimeSocket = realtimeClient.newWebSocket(request, new WebSocketListener() {
                      @Override public void onOpen(WebSocket webSocket, Response response) {
                          synchronized(realtimeLock) {
                              if(generation != realtimeGeneration || realtimeSocket != webSocket) {
                                  webSocket.close(1000, "stale");
                                  return;
                              }
                              realtimeSocketOpen = true;
                          }
                          try {
                              // A GA gpt-realtime-whisper nem fogad prompt mezőt; ezért itt csak a
                              // támogatott modell és delay kerül a sessionbe. A nyelvpár-szűrés a completed
                              // eredmény utáni helyi kapuban és az egyetlen tisztítás+fordítás körben történik.
                              JSONObject transcription = new JSONObject()
                                  .put("model", "gpt-realtime-whisper")
                                  .put("delay", realtimeDelaySetting());
                              JSONObject input = new JSONObject()
                                  .put("format", new JSONObject().put("type", "audio/pcm").put("rate", REALTIME_SAMPLE_RATE))
                                  // A telefon mikrofonja a beszélő közelében, de nem száj előtt dolgozik:
                                  // az OpenAI gyári FAR_FIELD előszűrése erre a mikrofontípusra való.
                                  .put("noise_reduction", new JSONObject().put("type", "far_field"))
                                  .put("transcription", transcription)
                                  .put("turn_detection", JSONObject.NULL);
                              JSONObject session = new JSONObject()
                                  .put("type", "transcription")
                                  .put("audio", new JSONObject().put("input", input));
                              sendRealtimeJson(new JSONObject().put("type", "session.update").put("session", session));
                          } catch(Exception e) {
                              handleRealtimeTransportFailure(generation, "session beállítás", e);
                          }
                      }
          
                      @Override public void onMessage(WebSocket webSocket, String text) {
                          try {
                              JSONObject event = new JSONObject(text);
                              runOnUiThread(() -> handleRealtimeEvent(generation, event));
                          } catch(Exception e) {
                              android.util.Log.e(LOG_TAG, "Realtime event parse failed", e);
                          }
                      }
          
                      @Override public void onFailure(WebSocket webSocket, Throwable t, Response response) {
                          handleRealtimeTransportFailure(generation, "kapcsolat", t);
                      }
          
                      @Override public void onClosed(WebSocket webSocket, int code, String reason) {
                          handleRealtimeTransportFailure(generation, "lezárva " + code, null);
                      }
                  });
              }
          
              boolean sendRealtimeJson(JSONObject event) {
                  if(event == null) return false;
                  WebSocket ws;
                  synchronized(realtimeLock) {
                      ws = realtimeSocket;
                      if(ws == null || !realtimeSocketOpen) return false;
                  }
                  try { return ws.send(event.toString()); }
                  catch(Exception e) {
                      android.util.Log.e(LOG_TAG, "Realtime send failed", e);
                      return false;
                  }
              }
          
              void sendRealtimeClearBuffer() {
                  if(!realtimeSocketOpen) return;
                  try { sendRealtimeJson(new JSONObject().put("type", "input_audio_buffer.clear")); }
                  catch(Exception ignored) {}
              }
          
              void closeRealtimeTranscriptionSession(boolean fallbackPending) {
                  ArrayList<RealtimeTurn> pending = new ArrayList<>();
                  WebSocket ws;
                  OkHttpClient rc;
                  synchronized(realtimeLock) {
                      realtimeGeneration++;
                      realtimeSocketOpen = false;
                      realtimeSessionReady = false;
                      realtimeReconnectScheduled = false;
                      ws = realtimeSocket;
                      rc = realtimeClient;
                      realtimeSocket = null;
                      realtimeClient = null;
                      if(fallbackPending) {
                          LinkedHashSet<RealtimeTurn> unique = new LinkedHashSet<>();
                          unique.addAll(realtimeAwaitingCommitAck);
                          unique.addAll(realtimeTurnsByItem.values());
                          for(RealtimeTurn t : unique) if(t != null && !t.completed) pending.add(t);
                      }
                      realtimeAwaitingCommitAck.clear();
                      realtimeTurnsByItem.clear();
                      realtimeOrphanDeltas.clear();
                      realtimeOrphanFinals.clear();
                  }
                  try { if(ws != null) ws.close(1000, "app"); } catch(Exception ignored) {}
                  try { if(rc != null) rc.dispatcher().executorService().shutdown(); } catch(Exception ignored) {}
                  if(fallbackPending) for(RealtimeTurn t : pending) startRealtimeTurnFallback(t, "élő STT megszakadt");
              }
          
              void handleRealtimeTransportFailure(int generation, String reason, Throwable error) {
                  synchronized(realtimeLock) {
                      if(generation != realtimeGeneration) return;
                      realtimeSocketOpen = false;
                      realtimeSessionReady = false;
                  }
                  if(error == null) android.util.Log.w(LOG_TAG, "Realtime " + reason);
                  else android.util.Log.e(LOG_TAG, "Realtime " + reason, error);
                  runOnUiThread(() -> {
                      fallbackPendingRealtimeTurns("élő STT kapcsolat");
                      scheduleRealtimeReconnect();
                  });
              }
          
              void scheduleRealtimeReconnect() {
                  synchronized(realtimeLock) {
                      if(realtimeReconnectScheduled || !streaming || !hasKey()) return;
                      realtimeReconnectScheduled = true;
                  }
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      synchronized(realtimeLock) { realtimeReconnectScheduled = false; }
                      if(streaming && !finalizingStop && hasKey() && !realtimeSessionReady) startRealtimeTranscriptionSession();
                  }, 1500L);
              }
          
              void handleRealtimeEvent(int generation, JSONObject event) {
                  synchronized(realtimeLock) { if(generation != realtimeGeneration) return; }
                  String type = event.optString("type", "");
                  if("session.updated".equals(type)) {
                      realtimeSessionReady = true;
                      if(streaming && !microphoneStarting) state.setText("mikrofon aktív – élő STT");
                      return;
                  }
                  if("input_audio_buffer.committed".equals(type)) {
                      assignRealtimeItem(event.optString("item_id", ""));
                      return;
                  }
                  if("conversation.item.input_audio_transcription.delta".equals(type)) {
                      applyRealtimeDelta(event.optString("item_id", ""), event.optString("delta", ""));
                      return;
                  }
                  if("conversation.item.input_audio_transcription.completed".equals(type)) {
                      applyRealtimeCompleted(event.optString("item_id", ""), event.optString("transcript", ""));
                      return;
                  }
                  if("conversation.item.input_audio_transcription.failed".equals(type) || "error".equals(type)) {
                      String itemId = event.optString("item_id", "");
                      String message = event.optJSONObject("error") == null ? type : event.optJSONObject("error").optString("message", type);
                      if(itemId.length() > 0) failRealtimeItem(itemId, message);
                      else {
                          android.util.Log.e(LOG_TAG, "Realtime API error: " + message);
                          fallbackPendingRealtimeTurns(message);
                      }
                  }
              }
          
              synchronized RealtimeTurn registerRealtimeTurn(byte[] pcm16k, RealtimeUtterance utterance, boolean finalChunk, boolean awaitCommitAck) {
                  RealtimeTurn turn = new RealtimeTurn(sttSessionId, ++realtimeTurnSeq, Arrays.copyOf(pcm16k, pcm16k.length), utterance, finalChunk);
                  sttRequestsInFlight++;
                  if(utterance != null) {
                      synchronized(utterance) {
                          utterance.pendingTurns++;
                          utterance.turnOrder.add(turn.seq);
                          if(finalChunk) utterance.endRequested = true;
                      }
                  }
                  if(awaitCommitAck) {
                      turn.awaitingCommitAck = true;
                      synchronized(realtimeLock) { realtimeAwaitingCommitAck.add(turn); }
                      new Handler(Looper.getMainLooper()).postDelayed(() -> {
                          if(turn.session == sttSessionId && !turn.completed) {
                              // Az ACK-sorban marad, hogy egy későn érkező committed esemény ne a
                              // következő mikroblokkhoz legyen tévesen hozzárendelve.
                              startRealtimeTurnFallback(turn, "élő STT időtúllépés");
                          }
                      }, 15000L);
                  }
                  return turn;
              }
          
              void submitRealtimeTurn(byte[] pcm16k, RealtimeUtterance utterance, boolean finalChunk, boolean useRealtime) {
                  if(pcm16k == null || pcm16k.length == 0 || utterance == null) return;
                  RealtimeTurn turn = registerRealtimeTurn(pcm16k, utterance, finalChunk, useRealtime);
                  if(!useRealtime) {
                      sendRealtimeClearBuffer();
                      startRealtimeTurnFallback(turn, "élő STT nem kész");
                      return;
                  }
                  boolean sent;
                  try { sent = sendRealtimeJson(new JSONObject().put("type", "input_audio_buffer.commit")); }
                  catch(Exception e) { sent = false; }
                  if(!sent) {
                      synchronized(realtimeLock) { realtimeAwaitingCommitAck.remove(turn); }
                      turn.awaitingCommitAck = false;
                      startRealtimeTurnFallback(turn, "commit nem küldhető");
                  }
              }
          
              void assignRealtimeItem(String itemId) {
                  if(itemId == null || itemId.length() == 0) return;
                  RealtimeTurn turn;
                  String orphanDelta = "";
                  String orphanFinal = null;
                  synchronized(realtimeLock) {
                      turn = realtimeAwaitingCommitAck.poll();
                      if(turn == null) return;
                      turn.awaitingCommitAck = false;
                      turn.itemId = itemId;
                      StringBuilder d = realtimeOrphanDeltas.remove(itemId);
                      if(d != null) orphanDelta = d.toString();
                      orphanFinal = realtimeOrphanFinals.remove(itemId);
                      if(!turn.completed) realtimeTurnsByItem.put(itemId, turn);
                  }
                  if(turn.completed) return;
                  if(orphanDelta.length() > 0) updateRealtimePartial(turn, orphanDelta);
                  if(orphanFinal != null) finishRealtimeTurn(turn, orphanFinal, "");
              }
          
              void applyRealtimeDelta(String itemId, String delta) {
                  if(itemId == null || itemId.length() == 0 || delta == null || delta.length() == 0) return;
                  RealtimeTurn turn;
                  synchronized(realtimeLock) {
                      turn = realtimeTurnsByItem.get(itemId);
                      if(turn == null) {
                          realtimeOrphanDeltas.computeIfAbsent(itemId, k -> new StringBuilder()).append(delta);
                          return;
                      }
                  }
                  updateRealtimePartial(turn, turn.partialText + delta);
              }
          
              String normalizeRealtimeWord(String word) {
                  if(word == null) return "";
                  return java.text.Normalizer.normalize(word, java.text.Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "")
                      .toLowerCase(Locale.ROOT)
                      .replaceAll("[^a-z0-9]", "");
              }
          
              String mergeRealtimeTranscript(String base, String next) {
                  String a = base == null ? "" : base.trim().replaceAll("\\s+", " ");
                  String b = next == null ? "" : next.trim().replaceAll("\\s+", " ");
                  if(a.length() == 0) return b;
                  if(b.length() == 0) return a;
                  String na = normalizeSpeechBlockHash(a);
                  String nb = normalizeSpeechBlockHash(b);
                  if(na.equals(nb)) return a.length() >= b.length() ? a : b;
                  if(nb.startsWith(na + " ")) return b;
                  if(na.endsWith(" " + nb) || na.equals(nb)) return a;
          
                  String[] aw = a.split("\\s+");
                  String[] bw = b.split("\\s+");
                  int best = 0;
                  int max = Math.min(12, Math.min(aw.length, bw.length));
                  for(int n=max; n>=1; n--) {
                      boolean same = true;
                      for(int i=0;i<n;i++) {
                          String left = normalizeRealtimeWord(aw[aw.length - n + i]);
                          String right = normalizeRealtimeWord(bw[i]);
                          if(left.length() == 0 || !left.equals(right)) { same = false; break; }
                      }
                      if(same) { best = n; break; }
                  }
                  if(best >= bw.length) return a;
                  StringBuilder out = new StringBuilder(a);
                  for(int i=best;i<bw.length;i++) {
                      if(out.length() > 0 && out.charAt(out.length()-1) != ' ') out.append(' ');
                      out.append(bw[i]);
                  }
                  return out.toString().trim().replaceAll("\\s+", " ");
              }
          
              String buildRealtimeUtterancePreview(RealtimeUtterance utterance) {
                  if(utterance == null) return "";
                  synchronized(utterance) {
                      String visible = "";
                      for(Integer seq : utterance.turnOrder) {
                          if(seq == null) continue;
                          if(utterance.finalByTurn.containsKey(seq)) {
                              String part = utterance.finalByTurn.get(seq);
                              if(part != null && part.trim().length() > 0)
                                  visible = mergeRealtimeTranscript(visible, part);
                              // Egy sikertelen, üresre lezárt mikroblokkot átugrunk: a 192 ms-os
                              // átfedés miatt a következő blokk rendszerint visszahozza a szöveget.
                              continue;
                          }
                          String part = utterance.partialByTurn.get(seq);
                          if(part == null || part.trim().length() == 0) break;
                          visible = mergeRealtimeTranscript(visible, part);
                          // Egy még részleges blokk után későbbi blokkot nem jelenítünk meg,
                          // így a később érkező események nem cserélik fel a mondat elejét-végét.
                          break;
                      }
                      return visible;
                  }
              }
          
              void updateRealtimeUtterancePreview(RealtimeUtterance utterance) {
                  if(utterance == null || utterance.finalized) return;
                  String visible = cleanTranscriptForSelectedPair(buildRealtimeUtterancePreview(utterance)).trim();
                  if(visible.length() == 0 || looksLikeObviousThirdLanguageNoise(visible)) return;
                  String detected = selectedPairLanguageCode(visible);
                  // Bizonytalan vagy harmadik nyelvű rész soha nem kerül ideiglenesen sem a magyar/forrás oldalra.
                  if(detected.isEmpty()) return;
                  boolean sourceTop = detected.equalsIgnoreCase(code(topLang));
                  if(utterance.partialBlock == null) {
                      utterance.partialBlock = new TextBlock();
                      utterance.partialBlock.translatedOk = false;
                      utterance.partialBlock.provisional = true;
                      textBlocks.add(utterance.partialBlock);
                  }
                  TextBlock b = utterance.partialBlock;
                  b.sourceTop = sourceTop;
                  b.provisional = true;
                  b.pendingSourceText = visible;
                  b.topText = sourceTop ? visible : "";
                  b.bottomText = sourceTop ? "" : visible;
                  renderBlocksKeepView();
              }
          
              void updateRealtimePartial(RealtimeTurn turn, String text) {
                  if(turn == null || turn.completed || turn.session != sttSessionId || turn.utterance == null) return;
                  String partial = text == null ? "" : text.trim();
                  turn.partialText = partial;
                  if(partial.length() == 0) return;
                  synchronized(turn.utterance) { turn.utterance.partialByTurn.put(turn.seq, partial); }
                  updateRealtimeUtterancePreview(turn.utterance);
              }
          
              void applyRealtimeCompleted(String itemId, String transcript) {
                  if(itemId == null || itemId.length() == 0) return;
                  RealtimeTurn turn;
                  synchronized(realtimeLock) {
                      turn = realtimeTurnsByItem.get(itemId);
                      if(turn == null) {
                          realtimeOrphanFinals.put(itemId, transcript == null ? "" : transcript);
                          return;
                      }
                  }
                  finishRealtimeTurn(turn, transcript, "");
              }
          
              void failRealtimeItem(String itemId, String error) {
                  RealtimeTurn turn;
                  synchronized(realtimeLock) { turn = realtimeTurnsByItem.get(itemId); }
                  if(turn != null) startRealtimeTurnFallback(turn, error);
              }
          
              void removeRealtimeUtteranceBlock(RealtimeUtterance utterance) {
                  if(utterance == null || utterance.partialBlock == null) return;
                  textBlocks.remove(utterance.partialBlock);
                  utterance.partialBlock = null;
                  renderBlocksKeepView();
              }
          
              void removeRealtimePartialBlock(RealtimeTurn turn) {
                  if(turn != null) removeRealtimeUtteranceBlock(turn.utterance);
              }
          
              void finishRealtimeTurn(RealtimeTurn turn, String transcript, String error) {
                  if(turn == null || turn.completed || turn.session != sttSessionId) return;
                  turn.completed = true;
                  turn.finalText = transcript == null ? "" : transcript.trim();
                  turn.error = error == null ? "" : error;
                  if(turn.utterance != null) {
                      synchronized(turn.utterance) {
                          turn.utterance.partialByTurn.remove(turn.seq);
                          turn.utterance.finalByTurn.put(turn.seq, turn.finalText);
                      }
                      updateRealtimeUtterancePreview(turn.utterance);
                  }
                  synchronized(realtimeLock) {
                      if(turn.itemId.length() > 0) realtimeTurnsByItem.remove(turn.itemId);
                      if(!turn.awaitingCommitAck) realtimeAwaitingCommitAck.remove(turn);
                  }
                  realtimeCompletedTurns.put(turn.seq, turn);
                  drainRealtimeTurnsInOrder();
              }
          
              void drainRealtimeTurnsInOrder() {
                  while(true) {
                      RealtimeTurn turn = realtimeCompletedTurns.remove(realtimeDeliverSeq);
                      if(turn == null) break;
                      realtimeDeliverSeq++;
                      sttRequestsInFlight = Math.max(0, sttRequestsInFlight - 1);
                      RealtimeUtterance utterance = turn.utterance;
                      if(utterance != null) {
                          synchronized(utterance) {
                              utterance.pendingTurns = Math.max(0, utterance.pendingTurns - 1);
                              if(turn.finalChunk) utterance.endRequested = true;
                          }
                          if(turn.finalText.length() > 0) {
                              utterance.committedText = mergeRealtimeTranscript(utterance.committedText, turn.finalText);
                              updateRealtimeUtteranceCommittedPreview(utterance);
                          } else if(turn.error.length() > 0) {
                              android.util.Log.e(LOG_TAG, "Realtime STT chunk failed: " + turn.error);
                          }
                          maybeFinalizeRealtimeUtterance(utterance);
                      }
                  }
                  maybeFinishStop();
              }
          
              void updateRealtimeUtteranceCommittedPreview(RealtimeUtterance utterance) {
                  updateRealtimeUtterancePreview(utterance);
              }
          
              void maybeFinalizeRealtimeUtterance(RealtimeUtterance utterance) {
                  if(utterance == null || utterance.session != sttSessionId) return;
                  synchronized(utterance) {
                      if(utterance.finalized || !utterance.endRequested || utterance.pendingTurns > 0) return;
                      utterance.finalized = true;
                  }
                  String cleaned = normalizeAndDeduplicateSpeechBlock(utterance.committedText);
                  if(cleaned.length() == 0 || looksLikeObviousThirdLanguageNoise(cleaned)) {
                      removeRealtimeUtteranceBlock(utterance);
                      return;
                  }
          
                  String detected = selectedPairLanguageCode(cleaned);
                  boolean sourceTop = detected.isEmpty() ? topActive : detected.equalsIgnoreCase(code(topLang));
                  TextBlock b = utterance.partialBlock;
                  int id;
                  if(b != null && textBlocks.contains(b)) {
                      utterance.partialBlock = null;
                      b.speechSeq = b.speechSeq > 0 ? b.speechSeq : ++speechSourceBlockSeq;
                      b.sourceTop = sourceTop;
                      b.provisional = true;
                      b.translatedOk = false;
                      b.pendingSourceText = cleaned;
                      String visible = detected.isEmpty() ? "" : userVisibleSpeechTextOrEmpty(cleaned);
                      b.topText = sourceTop ? visible : "";
                      b.bottomText = sourceTop ? "" : visible;
                      id = textBlocks.indexOf(b);
                      renderBlocksKeepView();
                  } else {
                      id = addSourceOnlyBlock(sourceTop, cleaned);
                  }
                  if(id >= 0) {
                      firstSpeechBlockReleased = true;
                      speechTranslateQueue.add(id);
                      lastSpeechBlockReleasedAt = System.currentTimeMillis();
                      processNextSpeechTranslation();
                  }
              }
          
              void startRealtimeTurnFallback(RealtimeTurn turn, String reason) {
                  if(Looper.myLooper() != Looper.getMainLooper()) {
                      runOnUiThread(() -> startRealtimeTurnFallback(turn, reason));
                      return;
                  }
                  if(turn == null || turn.completed || turn.fallbackStarted || turn.session != sttSessionId) return;
                  turn.fallbackStarted = true;
                  // Egy mikroblokk tartalék STT-je nem törölheti az ugyanahhoz a mondathoz
                  // már megjelent stabil szürke előnézetet.
                  if(turn.fallbackPcm16k.length == 0 || client == null || !hasKey()) {
                      finishRealtimeTurn(turn, "", reason);
                      return;
                  }
                  try {
                      byte[] wav = wavFromPcm16k(turn.fallbackPcm16k);
                      MultipartBody body = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("model", "gpt-4o-mini-transcribe")
                          .addFormDataPart("response_format", "json")
                          .addFormDataPart("prompt", speechTranscriptionPrompt())
                          .addFormDataPart("file", "speech.wav", RequestBody.create(MediaType.parse("audio/wav"), wav))
                          .build();
                      Request req = new Request.Builder().url("https://api.openai.com/v1/audio/transcriptions")
                          .addHeader("Authorization", "Bearer " + apiKey.trim())
                          .post(body).build();
                      client.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(Call call, java.io.IOException e) {
                              runOnUiThread(() -> finishRealtimeTurn(turn, "", reason + ": " + e.getMessage()));
                          }
                          @Override public void onResponse(Call call, Response response) throws java.io.IOException {
                              String raw = response.body() == null ? "" : response.body().string();
                              if(!response.isSuccessful()) {
                                  runOnUiThread(() -> finishRealtimeTurn(turn, "", "HTTP " + response.code()));
                                  return;
                              }
                              try {
                                  String text = new JSONObject(raw).optString("text", "").trim();
                                  runOnUiThread(() -> finishRealtimeTurn(turn, text, text.length() == 0 ? reason : ""));
                              } catch(Exception e) {
                                  runOnUiThread(() -> finishRealtimeTurn(turn, "", "tartalék válasz nem értelmezhető"));
                              }
                          }
                      });
                  } catch(Exception e) {
                      finishRealtimeTurn(turn, "", reason + ": " + e.getMessage());
                  }
              }
          
              void fallbackPendingRealtimeTurns(String reason) {
                  ArrayList<RealtimeTurn> pending = new ArrayList<>();
                  synchronized(realtimeLock) {
                      LinkedHashSet<RealtimeTurn> unique = new LinkedHashSet<>();
                      unique.addAll(realtimeAwaitingCommitAck);
                      unique.addAll(realtimeTurnsByItem.values());
                      for(RealtimeTurn t : unique) if(t != null && !t.completed) pending.add(t);
                      realtimeAwaitingCommitAck.clear();
                      realtimeTurnsByItem.clear();
                      realtimeOrphanDeltas.clear();
                      realtimeOrphanFinals.clear();
                  }
                  for(RealtimeTurn t : pending) startRealtimeTurnFallback(t, reason);
              }
          
              void resetRealtimeTurnState() {
                  ArrayList<RealtimeTurn> turnsToRemove = new ArrayList<>();
                  synchronized(realtimeLock) {
                      LinkedHashSet<RealtimeTurn> unique = new LinkedHashSet<>();
                      unique.addAll(realtimeAwaitingCommitAck);
                      unique.addAll(realtimeTurnsByItem.values());
                      unique.addAll(realtimeCompletedTurns.values());
                      turnsToRemove.addAll(unique);
                  }
                  closeRealtimeTranscriptionSession(false);
                  for(RealtimeTurn turn : turnsToRemove) removeRealtimePartialBlock(turn);
                  realtimeCompletedTurns.clear();
                  realtimeTurnSeq = 0;
                  realtimeUtteranceSeq = 0;
                  realtimeDeliverSeq = 1;
              }
          
