                      int st = title.length() + 1;
                      ss.setSpan(new AbsoluteSizeSpan(12, true), st, text.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      ss.setSpan(new ForegroundColorSpan(Color.rgb(230,230,230)), st, text.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  }
