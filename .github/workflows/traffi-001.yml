      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > release-key.jks
            cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are missing; debug APK will still be produced."
          fi

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/Traffi-001-debug.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk artifact/Traffi-001-release.apk
          fi
          if [[ -f app/build/outputs/bundle/release/app-release.aab ]]; then
            cp app/build/outputs/bundle/release/app-release.aab artifact/Traffi-001-release.aab
          fi
          cp README.md artifact/README.md
          find artifact -maxdepth 1 -type f -printf "%f\n"

      - name: Upload APK and project notes
        uses: actions/upload-artifact@v4
        with:
          name: Traffi-001-build
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
