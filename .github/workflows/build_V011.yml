name: Build TomTom Kiszolgalo V011

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out V010 source
        uses: actions/checkout@v4

      - name: Create TomTom Kiszolgalo V011 project from V010
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path(".github/workflows/build_V010.yml")
          if not source_path.exists():
              raise SystemExit("Missing source file: .github/workflows/build_V010.yml")

          workflow = source_path.read_text(encoding="utf-8")
          lines = workflow.splitlines()

          start = None
          for index, line in enumerate(lines):
              if line.strip() == "- name: Create TomTom Kiszolgalo V010 one-tap project":
                  for candidate in range(index + 1, min(index + 6, len(lines))):
                      if lines[candidate].strip() == "run: |":
                          start = candidate + 1
                          break
                  break

          if start is None:
              raise SystemExit("The V010 project-generation step was not found.")

          block = []
          for line in lines[start:]:
              if line.startswith("      - name:"):
                  break
              block.append(line)

          script = textwrap.dedent("\n".join(block)).rstrip() + "\n"

          def replace_required(old, new, minimum=1, maximum=None):
              global script
              count = script.count(old)
              if count < minimum:
                  raise SystemExit(f"Required V010 block not found: {old[:120]!r}")
              if maximum is not None and count > maximum:
                  raise SystemExit(
                      f"Unexpected duplicate V010 block ({count}): {old[:120]!r}"
                  )
              script = script.replace(old, new)

          # Every version identifier is raised by exactly one.
          script = script.replace("V010", "V011")
          replace_required("versionCode = 10", "versionCode = 11", maximum=1)
          replace_required('versionName = "010"', 'versionName = "011"', maximum=1)

          # MainActivity and service share these preference keys.
          replace_required(
              '    private static final String KEY_ROUTE_POINTS = "route_points";\n'
              '    private static final String ACTION_START_ROUTE =',
              '    private static final String KEY_ROUTE_POINTS = "route_points";\n'
              '    private static final String KEY_PENDING_MAP_QUERY = "pending_map_query";\n'
              '    private static final String KEY_PENDING_MAP_INDEX = "pending_map_index";\n'
              '    private static final String ACTION_START_ROUTE =',
              minimum=2,
              maximum=2,
          )

          # A manually opened Google Maps search must not reuse an old unresolved point.
          replace_required(
              "    private void openGoogleMaps() {\n"
              "        saveEditor();",
              "    private void openGoogleMaps() {\n"
              "        getSharedPreferences(PREFS, MODE_PRIVATE).edit()\n"
              "                .remove(KEY_PENDING_MAP_QUERY)\n"
              "                .remove(KEY_PENDING_MAP_INDEX)\n"
              "                .apply();\n"
              "        saveEditor();",
              maximum=1,
          )

          # Imports needed for clipboard copy and a pre-filled Google Maps search.
          replace_required(
              "import android.content.BroadcastReceiver;\n",
              "import android.content.ActivityNotFoundException;\n"
              "import android.content.BroadcastReceiver;\n"
              "import android.content.ClipData;\n"
              "import android.content.ClipboardManager;\n",
              maximum=1,
          )
          replace_required(
              "import android.os.Build;\n",
              "import android.net.Uri;\n"
              "import android.os.Build;\n",
              maximum=1,
          )

          # TomTom decimal coordinates: latitude SPACE longitude.
          replace_required(
              '    private static final Pattern COORDINATE = Pattern.compile(\n'
              '            "(?<![\\\\d.])([+-]?\\\\d{1,2}\\\\.\\\\d{4,8})\\\\s*[,;]\\\\s*" +\n'
              '                    "([+-]?\\\\d{1,3}\\\\.\\\\d{4,8})(?![\\\\d.])");',
              '    private static final Pattern COORDINATE = Pattern.compile(\n'
              '            "(?<![\\\\d.])([+-]?\\\\d{1,2}\\\\.\\\\d{4,8})(?:\\\\s*[,;]\\\\s*|\\\\s+)" +\n'
              '                    "([+-]?\\\\d{1,3}\\\\.\\\\d{4,8})(?![\\\\d.])");',
              maximum=1,
          )
          replace_required(
              '                return matcher.group(1) + "," + matcher.group(2);',
              '                return matcher.group(1) + " " + matcher.group(2);',
              maximum=1,
          )

          # A Maps result resolves the pending bad address in its original route position.
          replace_required(
              "            appendRoutePoints(Collections.singletonList(exactCoordinate));",
              "            addResolvedMapPoint(exactCoordinate);",
              maximum=1,
          )
          replace_required(
              "            appendRoutePoints(Collections.singletonList(address));",
              "            addResolvedMapPoint(address);",
              maximum=1,
          )

          old_route_capture = '''    List<String> addresses = AddressExtractor.findRouteAddresses(lines);
          if (addresses.isEmpty()) {
          Toast.makeText(this,
                "Nem találtam használható felrakó- vagy lerakócímet ezen a képernyőn.",
                Toast.LENGTH_LONG).show();
          finishProcessing();
          return false;
          }
          appendRoutePoints(addresses);
          Toast.makeText(this,
            addresses.size() + " fuvarcím bekerült az útvonallistába.",
            Toast.LENGTH_LONG).show();
          openEditor();
          finishProcessing();
          return true;'''

          new_route_capture = '''    AddressExtractor.RouteCaptureResult capture =
            AddressExtractor.analyzeRoute(lines);
          if (capture.addresses.isEmpty() &&
            (capture.unresolvedQuery == null || capture.unresolvedQuery.isBlank())) {
          Toast.makeText(this,
                "Nem találtam használható felrakó- vagy lerakócímet ezen a képernyőn.",
                Toast.LENGTH_LONG).show();
          finishProcessing();
          return false;
          }

          int insertionIndex = storedPointCount() +
            Math.max(0, capture.unresolvedIndex);
          if (!capture.addresses.isEmpty()) {
          appendRoutePoints(capture.addresses);
          }

          if (capture.unresolvedQuery != null &&
            !capture.unresolvedQuery.isBlank()) {
          String query = capture.unresolvedQuery;
          storePendingMapResolution(query, insertionIndex);
          finishProcessing();

          if (openGoogleMapsSearch(query)) {
            Toast.makeText(this,
                    "Hiányos cím. A Google Maps keresése megnyílt: " + query,
                    Toast.LENGTH_LONG).show();
            return true;
          }

          clearPendingMapResolution();
          Toast.makeText(this,
                "A Google Maps nem nyitható meg. A hibás cím a vágólapra került: " + query,
                Toast.LENGTH_LONG).show();
          openEditor();
          return false;
          }

          Toast.makeText(this,
            capture.addresses.size() + " fuvarcím bekerült az útvonallistába.",
            Toast.LENGTH_LONG).show();
          openEditor();
          finishProcessing();
          return true;'''

          replace_required(old_route_capture, new_route_capture, maximum=1)

          service_helpers = r'''
          private void addResolvedMapPoint(String point) {
          if (point == null || point.isBlank()) return;

          SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
          List<String> combined = parseStoredPoints(
                preferences.getString(KEY_ROUTE_POINTS, ""));
          int pendingIndex = preferences.getInt(KEY_PENDING_MAP_INDEX, -1);

          if (pendingIndex >= 0 && pendingIndex <= combined.size()) {
            combined.add(pendingIndex, point.trim());
          } else {
            combined.add(point.trim());
          }

          combined = uniquePoints(combined);
          preferences.edit()
                .putString(KEY_ROUTE_POINTS, String.join("\n", combined))
                .remove(KEY_PENDING_MAP_QUERY)
                .remove(KEY_PENDING_MAP_INDEX)
                .apply();
          }

          private int storedPointCount() {
          return parseStoredPoints(
                getSharedPreferences(PREFS, MODE_PRIVATE)
                        .getString(KEY_ROUTE_POINTS, "")).size();
          }

          private void storePendingMapResolution(String query, int insertionIndex) {
          getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                .putString(KEY_PENDING_MAP_QUERY, query == null ? "" : query.trim())
                .putInt(KEY_PENDING_MAP_INDEX, Math.max(0, insertionIndex))
                .apply();
          }

          private void clearPendingMapResolution() {
          getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                .remove(KEY_PENDING_MAP_QUERY)
                .remove(KEY_PENDING_MAP_INDEX)
                .apply();
          }

          private boolean openGoogleMapsSearch(String query) {
          String cleanQuery = query == null
                ? ""
                : query.replaceAll("\\s+", " ").trim();
          if (cleanQuery.isEmpty()) return false;

          ClipboardManager clipboard =
                (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
          if (clipboard != null) {
            clipboard.setPrimaryClip(
                    ClipData.newPlainText("Hiányos fuvarcím", cleanQuery));
          }

          Intent searchIntent = new Intent(
                Intent.ACTION_VIEW,
                Uri.parse("geo:0,0?q=" + Uri.encode(cleanQuery)));
          searchIntent.setPackage(GOOGLE_MAPS_PACKAGE);
          searchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                Intent.FLAG_ACTIVITY_CLEAR_TOP |
                Intent.FLAG_ACTIVITY_SINGLE_TOP);

          try {
            startActivity(searchIntent);
            return true;
          } catch (ActivityNotFoundException | SecurityException ignored) {
          }

          Intent launchIntent =
                getPackageManager().getLaunchIntentForPackage(GOOGLE_MAPS_PACKAGE);
          if (launchIntent == null) return false;
          launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                Intent.FLAG_ACTIVITY_CLEAR_TOP |
                Intent.FLAG_ACTIVITY_SINGLE_TOP);
          try {
            startActivity(launchIntent);
            return true;
          } catch (RuntimeException ignored) {
            return false;
          }
          }
          '''

          replace_required(
              "\n    private void openEditor() {",
              service_helpers + "\n    private void openEditor() {",
              maximum=1,
          )

          old_find_route = '''        static List<String> findRouteAddresses(List<String> originalLines) {
            List<String> lines = cleanLines(originalLines);
            if (lines.isEmpty()) return Collections.emptyList();

            int pickupIndex = findMarkerIndex(lines, PICKUP_MARKERS, 0);
            int deliveryIndex = findMarkerIndex(lines, DELIVERY_MARKERS, 0);
            List<String> result = new ArrayList<>();

            if (pickupIndex >= 0) {
                int end = deliveryIndex > pickupIndex ? deliveryIndex : lines.size();
                String pickup = extractRouteBlock(lines, pickupIndex + 1, end);
                if (pickup != null) result.add(pickup);
            }

            if (deliveryIndex >= 0) {
                int nextPickup = findMarkerIndex(lines, PICKUP_MARKERS, deliveryIndex + 1);
                int end = nextPickup > deliveryIndex ? nextPickup : lines.size();
                String delivery = extractRouteBlock(lines, deliveryIndex + 1, end);
                if (delivery != null && !containsNormalized(result, delivery)) {
                    result.add(delivery);
                }
            }

            return result;
          }'''

          new_find_route = '''        static List<String> findRouteAddresses(List<String> originalLines) {
            return analyzeRoute(originalLines).addresses;
          }

          static RouteCaptureResult analyzeRoute(List<String> originalLines) {
            List<String> lines = cleanLines(originalLines);
            if (lines.isEmpty()) {
                return new RouteCaptureResult(
                        Collections.emptyList(), null, -1);
            }

            int pickupIndex = findMarkerIndex(lines, PICKUP_MARKERS, 0);
            int deliveryIndex = findMarkerIndex(lines, DELIVERY_MARKERS, 0);
            List<String> result = new ArrayList<>();
            String unresolvedQuery = null;
            int unresolvedIndex = -1;

            if (pickupIndex >= 0) {
                int end = deliveryIndex > pickupIndex ? deliveryIndex : lines.size();
                String pickup = extractRouteBlock(lines, pickupIndex + 1, end);
                if (pickup != null) {
                    result.add(pickup);
                } else {
                    unresolvedQuery =
                            extractRouteSearchQuery(lines, pickupIndex + 1, end);
                    unresolvedIndex = result.size();
                }
            }

            if (deliveryIndex >= 0) {
                int nextPickup =
                        findMarkerIndex(lines, PICKUP_MARKERS, deliveryIndex + 1);
                int end = nextPickup > deliveryIndex ? nextPickup : lines.size();
                String delivery =
                        extractRouteBlock(lines, deliveryIndex + 1, end);
                if (delivery != null &&
                        !containsNormalized(result, delivery)) {
                    result.add(delivery);
                } else if (delivery == null && unresolvedQuery == null) {
                    unresolvedQuery =
                            extractRouteSearchQuery(lines, deliveryIndex + 1, end);
                    unresolvedIndex = result.size();
                }
            }

            return new RouteCaptureResult(
                    result, unresolvedQuery, unresolvedIndex);
          }'''

          replace_required(old_find_route, new_find_route, maximum=1)

          # Complete addresses must not carry a company name into TomTom.
          replace_required(
              "            String joined = joinParts(parts);\n"
              "            if (isUsableRouteAddress(joined)) return normalizeAddress(joined);",
              "            String joined = stripLeadingCompany(joinParts(parts));\n"
              "            if (isUsableRouteAddress(joined)) return normalizeAddress(joined);",
              maximum=1,
          )

          search_query_method = r'''
          private static String extractRouteSearchQuery(
                List<String> lines,
                int start,
                int end) {
            List<String> parts = new ArrayList<>();
            int safeStart = Math.max(0, start);
            int safeEnd = Math.min(lines.size(), Math.max(safeStart, end));

            for (int i = safeStart; i < safeEnd && parts.size() < 6; i++) {
                String raw = clean(lines.get(i));
                String normalized = normalize(raw);
                if (raw.isEmpty()) continue;
                if (isMarker(normalized)) {
                    if (!parts.isEmpty()) break;
                    continue;
                }
                if (isHardRouteStop(raw, normalized)) {
                    if (!parts.isEmpty()) break;
                    continue;
                }
                if (isGeneralNoise(normalized)) continue;
                parts.add(raw);
            }

            String query = joinParts(parts);
            return query.length() >= 4 ? query : null;
          }
          '''

          replace_required(
              "\n        private static Candidate findBestRouteCandidate(",
              search_query_method +
              "\n        private static Candidate findBestRouteCandidate(",
              maximum=1,
          )

          replace_required(
              "        private static Candidate scoreRouteAddress(String raw, int distance) {\n"
              "            String value = normalizeAddress(raw);",
              "        private static Candidate scoreRouteAddress(String raw, int distance) {\n"
              "            String value = stripLeadingCompany(normalizeAddress(raw));",
              maximum=1,
          )

          strip_company_method = r'''
          private static String stripLeadingCompany(String value) {
            String cleanValue = normalizeAddress(value == null ? "" : value);
            if (cleanValue.isEmpty()) return cleanValue;

            String coordinate = coordinateFromText(cleanValue);
            if (coordinate != null) return coordinate;

            Pattern streetStart = Pattern.compile(
                    "(?iu)\\b(?:route|rue|avenue|av\\.?|boulevard|chemin|impasse|"
                            + "quai|place|all[ée]e|voie|street|road|lane|drive|"
                            + "strasse|stra[ßs]e|weg|platz|gasse|ring|"
                            + "straat|laan|weg|via|viale|corso|piazza|"
                            + "utca|[úu]t|[úu]tja|t[ée]r|k[öo]r[úu]t)\\b");
            Matcher matcher = streetStart.matcher(cleanValue);
            if (!matcher.find()) return cleanValue;

            int start = matcher.start();
            String prefix = cleanValue.substring(0, start).trim();
            Matcher houseBeforeStreet =
                    Pattern.compile("(\\d{1,5}[A-Za-z]?)\\s*$").matcher(prefix);
            if (houseBeforeStreet.find()) {
                start = houseBeforeStreet.start();
            }

            return normalizeAddress(cleanValue.substring(start));
          }
          '''

          replace_required(
              "\n        private static boolean isUsableRouteAddress(String value) {",
              strip_company_method +
              "\n        private static boolean isUsableRouteAddress(String value) {",
              maximum=1,
          )

          replace_required(
              '            return hasPostal && (hasCountry || hasStreet || value.contains(","));',
              "            return hasPostal && hasStreet;",
              maximum=1,
          )

          route_result_class = '''        private static final class RouteCaptureResult {
            final List<String> addresses;
            final String unresolvedQuery;
            final int unresolvedIndex;

            RouteCaptureResult(
                    List<String> addresses,
                    String unresolvedQuery,
                    int unresolvedIndex) {
                this.addresses = new ArrayList<>(addresses);
                this.unresolvedQuery = unresolvedQuery;
                this.unresolvedIndex = unresolvedIndex;
            }
          }

          '''

          replace_required(
              "        private static final class Candidate {",
              route_result_class +
              "        private static final class Candidate {",
              maximum=1,
          )

          Path("/tmp/create_v011.sh").write_text(script, encoding="utf-8")
          PY

          bash /tmp/create_v011.sh

      - name: Verify V011 fixes and identifiers
        run: |
          grep -F 'rootProject.name = "TomTomKiszolgaloV011"' settings.gradle.kts
          grep -F 'versionCode = 11' app/build.gradle.kts
          grep -F 'versionName = "011"' app/build.gradle.kts
          grep -F 'TomTom Kiszolgáló V011' app/src/main/AndroidManifest.xml
          grep -F 'private static final String VERSION = "V011";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java
          grep -F 'private static final String VERSION = "V011";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'return matcher.group(1) + " " + matcher.group(2);' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'openGoogleMapsSearch' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'KEY_PENDING_MAP_INDEX' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'return hasPostal && hasStreet;' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'stripLeadingCompany' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V011 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V011 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V011.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V011.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V011
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V011
          path: |
            artifact/TomTom_Kiszolgalo_V011.apk
            artifact/TomTom_Kiszolgalo_V011.aab
          if-no-files-found: error
