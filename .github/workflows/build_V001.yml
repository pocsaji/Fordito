name: Build TomTom Kiszolgalo V001

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create TomTom Kiszolgalo V001 project
        run: |
          mkdir -p app/src/main/java/hu/pocsaji/tomtomkiszolgalo
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TomTomKiszolgaloV001"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins {
              id("com.android.application")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          android {
              namespace = "hu.pocsaji.tomtomkiszolgalo"
              compileSdk = 36

              defaultConfig {
                  applicationId = "hu.pocsaji.tomtomkiszolgalo"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 1
                  versionName = "001"
              }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2C74D6</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_map.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#17365F"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,29L43,21L65,29L84,21L84,78L65,86L43,78L24,86ZM43,29L31,34L31,75L43,70ZM50,30L50,70L62,76L62,36ZM69,35L69,76L77,73L77,32Z" />
              <path
                  android:fillColor="#E53935"
                  android:pathData="M63,22C52,22 44,30 44,41C44,55 63,74 63,74C63,74 82,55 82,41C82,30 74,22 63,22ZM63,48A7,7 0,1 1,63 34A7,7 0,1 1,63 48Z" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="tomtom.intent.action.IMPORT_SINGLE_ROUTE" />
                      <data android:mimeType="application/gpx+xml" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:mimeType="application/gpx+xml" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SEND" />
                      <data android:mimeType="application/gpx+xml" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="TomTom Kiszolgáló V001"
                  android:icon="@drawable/ic_launcher_map"
                  android:roundIcon="@drawable/ic_launcher_map"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.time.Instant;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public final class MainActivity extends Activity {
              private static final String VERSION = "V001";
              private static final String PREFS = "tomtom_kiszolgalo_v001";
              private static final String PREF_API_KEY = "tomtom_api_key";

              private final ExecutorService worker = Executors.newSingleThreadExecutor();

              private EditText apiKeyInput;
              private EditText startInput;
              private EditText viaInput;
              private EditText destinationInput;
              private Button createButton;
              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(createUi());
              }

              private View createUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(16, 19, 24));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(24), dp(18), dp(30));
                  scroll.addView(root, new ScrollView.LayoutParams(
                          ScrollView.LayoutParams.MATCH_PARENT,
                          ScrollView.LayoutParams.WRAP_CONTENT));

                  TextView title = text("TomTom Kiszolgáló " + VERSION, 24, true);
                  title.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(title, matchWrap(dp(0)));

                  TextView help = text(
                          "Három pontból kamionos tesztútvonal készül.\n\n" +
                          "A cím formája lehet például:\n" +
                          "BE, 8870 Izegem, utca, házszám\n\n" +
                          "Koordináta is megadható:\n" +
                          "50.83510, 3.26040",
                          15,
                          false);
                  help.setTextColor(Color.rgb(190, 198, 210));
                  root.addView(help, matchWrap(dp(18)));

                  apiKeyInput = input("TomTom API-kulcs");
                  apiKeyInput.setSingleLine(true);
                  apiKeyInput.setInputType(InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD);
                  apiKeyInput.setText(getSharedPreferences(PREFS, MODE_PRIVATE)
                          .getString(PREF_API_KEY, ""));
                  root.addView(apiKeyInput, matchWrap(dp(10)));

                  startInput = input("Indulási cím vagy koordináta");
                  root.addView(startInput, matchWrap(dp(10)));

                  viaInput = input("Köztes pont címe vagy koordinátája");
                  root.addView(viaInput, matchWrap(dp(10)));

                  destinationInput = input("Célállomás címe vagy koordinátája");
                  root.addView(destinationInput, matchWrap(dp(16)));

                  createButton = new Button(this);
                  createButton.setText("ÚTVONAL LÉTREHOZÁSA");
                  createButton.setTextSize(17);
                  createButton.setTextColor(Color.WHITE);
                  createButton.setAllCaps(false);
                  createButton.setPadding(dp(12), dp(14), dp(12), dp(14));
                  createButton.setBackgroundColor(Color.rgb(44, 116, 214));
                  createButton.setOnClickListener(v -> createRoute());
                  root.addView(createButton, matchWrap(dp(16)));

                  statusText = text("Készen áll.", 15, false);
                  statusText.setTextColor(Color.rgb(190, 198, 210));
                  root.addView(statusText, matchWrap(dp(0)));

                  TextView footer = text(
                          "A GPX fájl ide kerül:\nLetöltések / TomTom_Kiszolgalo",
                          13,
                          false);
                  footer.setTextColor(Color.rgb(130, 140, 155));
                  root.addView(footer, matchWrap(dp(24)));

                  return scroll;
              }

              private void createRoute() {
                  String apiKey = value(apiKeyInput);
                  String start = value(startInput);
                  String via = value(viaInput);
                  String destination = value(destinationInput);

                  if (apiKey.isEmpty()) {
                      showError("A TomTom API-kulcs nincs megadva.");
                      return;
                  }
                  if (start.isEmpty() || via.isEmpty() || destination.isEmpty()) {
                      showError("Mindhárom útvonalpontot meg kell adni.");
                      return;
                  }

                  getSharedPreferences(PREFS, MODE_PRIVATE)
                          .edit()
                          .putString(PREF_API_KEY, apiKey)
                          .apply();

                  setBusy(true, "1/4 – Címek ellenőrzése...");

                  worker.execute(() -> {
                      try {
                          Point p1 = resolvePoint(start, apiKey, "Indulás");
                          updateStatus("2/4 – Köztes pont ellenőrzése...");
                          Point p2 = resolvePoint(via, apiKey, "Köztes pont");
                          updateStatus("3/4 – Célállomás ellenőrzése...");
                          Point p3 = resolvePoint(destination, apiKey, "Cél");

                          List<Point> stops = new ArrayList<>();
                          stops.add(p1);
                          stops.add(p2);
                          stops.add(p3);

                          updateStatus("4/4 – Kamionos útvonal számítása...");
                          RouteResult route = calculateTruckRoute(stops, apiKey);
                          String gpx = createGpx(stops, route.geometry);
                          Uri fileUri = saveGpx(gpx);

                          runOnUiThread(() -> {
                              setBusy(false,
                                      "Elkészült: " + route.distanceText +
                                      ", becsült idő: " + route.durationText +
                                      "\nFájl: Letöltések/TomTom_Kiszolgalo/TomTom_Kiszolgalo_V001.gpx");
                              openWithTomTom(fileUri);
                          });
                      } catch (Exception error) {
                          runOnUiThread(() -> setBusy(false, "HIBA: " + cleanError(error)));
                      }
                  });
              }

              private Point resolvePoint(String input, String apiKey, String label) throws Exception {
                  Point coordinate = parseCoordinate(input, label);
                  if (coordinate != null) {
                      return coordinate;
                  }

                  String encodedAddress = URLEncoder
                          .encode(input, StandardCharsets.UTF_8.name())
                          .replace("+", "%20");
                  String encodedKey = URLEncoder.encode(apiKey, StandardCharsets.UTF_8.name());
                  String requestUrl = "https://api.tomtom.com/search/2/geocode/" +
                          encodedAddress +
                          ".json?key=" + encodedKey +
                          "&limit=1&language=hu-HU";

                  JSONObject response = getJson(requestUrl);
                  JSONArray results = response.optJSONArray("results");
                  if (results == null || results.length() == 0) {
                      throw new IllegalStateException(label + ": a TomTom nem talált megfelelő címet.");
                  }

                  JSONObject result = results.getJSONObject(0);
                  JSONObject position = result.getJSONObject("position");
                  JSONObject address = result.optJSONObject("address");
                  String matched = address == null
                          ? input
                          : address.optString("freeformAddress", input);

                  return new Point(
                          position.getDouble("lat"),
                          position.getDouble("lon"),
                          label,
                          matched);
              }

              private Point parseCoordinate(String input, String label) {
                  String normalized = input.trim().replace(';', ',');
                  String[] parts = normalized.contains(",")
                          ? normalized.split(",")
                          : normalized.split("\\s+");
                  if (parts.length != 2) {
                      return null;
                  }
                  try {
                      double lat = Double.parseDouble(parts[0].trim());
                      double lon = Double.parseDouble(parts[1].trim());
                      if (Math.abs(lat) > 90 || Math.abs(lon) > 180) {
                          return null;
                      }
                      return new Point(lat, lon, label, input.trim());
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }

              private RouteResult calculateTruckRoute(List<Point> stops, String apiKey) throws Exception {
                  StringBuilder locations = new StringBuilder();
                  for (Point point : stops) {
                      if (locations.length() > 0) locations.append(':');
                      locations.append(String.format(Locale.US, "%.7f,%.7f", point.lat, point.lon));
                  }

                  String encodedKey = URLEncoder.encode(apiKey, StandardCharsets.UTF_8.name());
                  String requestUrl = "https://api.tomtom.com/routing/1/calculateRoute/" +
                          locations +
                          "/json?key=" + encodedKey +
                          "&travelMode=truck" +
                          "&routeType=fastest" +
                          "&traffic=true" +
                          "&routeRepresentation=polyline";

                  JSONObject response = getJson(requestUrl);
                  JSONArray routes = response.optJSONArray("routes");
                  if (routes == null || routes.length() == 0) {
                      throw new IllegalStateException("A TomTom nem tudott kamionos útvonalat számítani.");
                  }

                  JSONObject route = routes.getJSONObject(0);
                  JSONObject summary = route.optJSONObject("summary");
                  int distanceMeters = summary == null ? 0 : summary.optInt("lengthInMeters", 0);
                  int durationSeconds = summary == null ? 0 : summary.optInt("travelTimeInSeconds", 0);

                  List<Point> geometry = new ArrayList<>();
                  JSONArray legs = route.optJSONArray("legs");
                  if (legs != null) {
                      for (int i = 0; i < legs.length(); i++) {
                          JSONArray points = legs.getJSONObject(i).optJSONArray("points");
                          if (points == null) continue;
                          for (int j = 0; j < points.length(); j++) {
                              JSONObject point = points.getJSONObject(j);
                              geometry.add(new Point(
                                      point.getDouble("latitude"),
                                      point.getDouble("longitude"),
                                      "",
                                      ""));
                          }
                      }
                  }

                  if (geometry.isEmpty()) {
                      geometry.addAll(stops);
                  }

                  return new RouteResult(
                          geometry,
                          formatDistance(distanceMeters),
                          formatDuration(durationSeconds));
              }

              private JSONObject getJson(String requestUrl) throws Exception {
                  HttpURLConnection connection = (HttpURLConnection) new URL(requestUrl).openConnection();
                  connection.setRequestMethod("GET");
                  connection.setConnectTimeout(15000);
                  connection.setReadTimeout(30000);
                  connection.setRequestProperty("Accept", "application/json");

                  int status = connection.getResponseCode();
                  InputStream stream = status >= 200 && status < 300
                          ? connection.getInputStream()
                          : connection.getErrorStream();
                  String body = readAll(stream);
                  connection.disconnect();

                  if (status < 200 || status >= 300) {
                      String message = "TomTom API hiba (HTTP " + status + ")";
                      try {
                          JSONObject error = new JSONObject(body);
                          message = error.optString("detailedError", error.optString("errorText", message));
                      } catch (Exception ignored) {
                      }
                      throw new IllegalStateException(message);
                  }

                  return new JSONObject(body);
              }

              private String readAll(InputStream stream) throws Exception {
                  if (stream == null) return "";
                  StringBuilder result = new StringBuilder();
                  try (BufferedReader reader = new BufferedReader(
                          new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = reader.readLine()) != null) {
                          result.append(line);
                      }
                  }
                  return result.toString();
              }

              private String createGpx(List<Point> stops, List<Point> geometry) {
                  StringBuilder xml = new StringBuilder(geometry.size() * 55 + 1500);
                  xml.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
                  xml.append("<gpx version=\"1.1\" creator=\"TomTom Kiszolgalo V001\" ")
                          .append("xmlns=\"http://www.topografix.com/GPX/1/1\" ")
                          .append("xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" ")
                          .append("xsi:schemaLocation=\"http://www.topografix.com/GPX/1/1 ")
                          .append("http://www.topografix.com/GPX/1/1/gpx.xsd\">\n");
                  xml.append("  <metadata><name>TomTom Kiszolgáló V001 tesztútvonal</name><time>")
                          .append(Instant.now())
                          .append("</time></metadata>\n");

                  for (Point stop : stops) {
                      xml.append("  <wpt lat=\"")
                              .append(format(stop.lat))
                              .append("\" lon=\"")
                              .append(format(stop.lon))
                              .append("\"><name>")
                              .append(escapeXml(stop.label))
                              .append("</name><desc>")
                              .append(escapeXml(stop.address))
                              .append("</desc></wpt>\n");
                  }

                  xml.append("  <rte><name>TomTom Kiszolgáló V001</name>\n");
                  for (Point stop : stops) {
                      xml.append("    <rtept lat=\"")
                              .append(format(stop.lat))
                              .append("\" lon=\"")
                              .append(format(stop.lon))
                              .append("\"><name>")
                              .append(escapeXml(stop.label))
                              .append("</name><desc>")
                              .append(escapeXml(stop.address))
                              .append("</desc></rtept>\n");
                  }
                  xml.append("  </rte>\n");

                  xml.append("  <trk><name>TomTom Kiszolgáló V001 kamionos útvonal</name><trkseg>\n");
                  for (Point point : geometry) {
                      xml.append("    <trkpt lat=\"")
                              .append(format(point.lat))
                              .append("\" lon=\"")
                              .append(format(point.lon))
                              .append("\"/>\n");
                  }
                  xml.append("  </trkseg></trk>\n");
                  xml.append("</gpx>\n");
                  return xml.toString();
              }

              private Uri saveGpx(String gpx) throws Exception {
                  ContentValues values = new ContentValues();
                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, "TomTom_Kiszolgalo_V001.gpx");
                  values.put(MediaStore.MediaColumns.MIME_TYPE, "application/gpx+xml");
                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/TomTom_Kiszolgalo");
                  values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                  Uri uri = getContentResolver().insert(
                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          values);
                  if (uri == null) {
                      throw new IllegalStateException("A GPX fájl nem hozható létre.");
                  }

                  try (OutputStream output = getContentResolver().openOutputStream(uri, "w")) {
                      if (output == null) {
                          throw new IllegalStateException("A GPX fájl nem írható.");
                      }
                      output.write(gpx.getBytes(StandardCharsets.UTF_8));
                      output.flush();
                  } catch (Exception error) {
                      getContentResolver().delete(uri, null, null);
                      throw error;
                  }

                  ContentValues ready = new ContentValues();
                  ready.put(MediaStore.MediaColumns.IS_PENDING, 0);
                  getContentResolver().update(uri, ready, null, null);
                  return uri;
              }

              private void openWithTomTom(Uri fileUri) {
                  Intent tomTomIntent = new Intent("tomtom.intent.action.IMPORT_SINGLE_ROUTE");
                  tomTomIntent.addCategory(Intent.CATEGORY_DEFAULT);
                  tomTomIntent.setDataAndType(fileUri, "application/gpx+xml");
                  tomTomIntent.setClipData(ClipData.newRawUri("TomTom útvonal", fileUri));
                  tomTomIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);

                  try {
                      startActivity(tomTomIntent);
                      Toast.makeText(this, "Átadás a TomTom alkalmazásnak...", Toast.LENGTH_LONG).show();
                      return;
                  } catch (ActivityNotFoundException ignored) {
                  }

                  Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                  viewIntent.setDataAndType(fileUri, "application/gpx+xml");
                  viewIntent.setClipData(ClipData.newRawUri("TomTom útvonal", fileUri));
                  viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);

                  try {
                      startActivity(Intent.createChooser(viewIntent, "GPX útvonal megnyitása"));
                      return;
                  } catch (ActivityNotFoundException ignored) {
                  }

                  Intent sendIntent = new Intent(Intent.ACTION_SEND);
                  sendIntent.setType("application/gpx+xml");
                  sendIntent.putExtra(Intent.EXTRA_STREAM, fileUri);
                  sendIntent.setClipData(ClipData.newRawUri("TomTom útvonal", fileUri));
                  sendIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(Intent.createChooser(sendIntent, "GPX útvonal megosztása"));
              }

              private EditText input(String hint) {
                  EditText editText = new EditText(this);
                  editText.setHint(hint);
                  editText.setHintTextColor(Color.rgb(135, 145, 160));
                  editText.setTextColor(Color.WHITE);
                  editText.setTextSize(16);
                  editText.setSingleLine(false);
                  editText.setMinLines(1);
                  editText.setMaxLines(3);
                  editText.setPadding(dp(12), dp(11), dp(12), dp(11));
                  editText.setBackgroundColor(Color.rgb(38, 43, 52));
                  return editText;
              }

              private TextView text(String value, int sizeSp, boolean bold) {
                  TextView textView = new TextView(this);
                  textView.setText(value);
                  textView.setTextSize(sizeSp);
                  textView.setTextColor(Color.WHITE);
                  if (bold) textView.setTypeface(textView.getTypeface(), android.graphics.Typeface.BOLD);
                  return textView;
              }

              private LinearLayout.LayoutParams matchWrap(int topMargin) {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);
                  params.topMargin = topMargin;
                  return params;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private String value(EditText input) {
                  return input.getText() == null ? "" : input.getText().toString().trim();
              }

              private void updateStatus(String message) {
                  runOnUiThread(() -> statusText.setText(message));
              }

              private void setBusy(boolean busy, String message) {
                  createButton.setEnabled(!busy);
                  createButton.setAlpha(busy ? 0.55f : 1.0f);
                  statusText.setText(message);
              }

              private void showError(String message) {
                  statusText.setText("HIBA: " + message);
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
              }

              private String format(double value) {
                  return String.format(Locale.US, "%.7f", value);
              }

              private String formatDistance(int meters) {
                  if (meters <= 0) return "ismeretlen távolság";
                  if (meters < 1000) return meters + " m";
                  return String.format(Locale.forLanguageTag("hu-HU"), "%.1f km", meters / 1000.0);
              }

              private String formatDuration(int seconds) {
                  if (seconds <= 0) return "ismeretlen";
                  int hours = seconds / 3600;
                  int minutes = (seconds % 3600) / 60;
                  if (hours == 0) return minutes + " perc";
                  return hours + " óra " + minutes + " perc";
              }

              private String escapeXml(String value) {
                  if (value == null) return "";
                  return value
                          .replace("&", "&amp;")
                          .replace("<", "&lt;")
                          .replace(">", "&gt;")
                          .replace("\"", "&quot;")
                          .replace("'", "&apos;");
              }

              private String cleanError(Exception error) {
                  String message = error.getMessage();
                  if (message == null || message.trim().isEmpty()) {
                      return error.getClass().getSimpleName();
                  }
                  return message;
              }

              @Override
              protected void onDestroy() {
                  worker.shutdownNow();
                  super.onDestroy();
              }

              private static final class Point {
                  final double lat;
                  final double lon;
                  final String label;
                  final String address;

                  Point(double lat, double lon, String label, String address) {
                      this.lat = lat;
                      this.lon = lon;
                      this.label = label;
                      this.address = address;
                  }
              }

              private static final class RouteResult {
                  final List<Point> geometry;
                  final String distanceText;
                  final String durationText;

                  RouteResult(List<Point> geometry, String distanceText, String durationText) {
                      this.geometry = geometry;
                      this.distanceText = distanceText;
                      this.durationText = durationText;
                  }
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V001 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V001 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V001.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V001.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V001
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V001
          path: |
            artifact/TomTom_Kiszolgalo_V001.apk
            artifact/TomTom_Kiszolgalo_V001.aab
          if-no-files-found: error
