              private WindowManager windowManager;
              private TextView floatingButton;
              private WindowManager.LayoutParams floatingParams;
              private TextRecognizer textRecognizer;
              private final AtomicBoolean processing = new AtomicBoolean(false);
              private final Handler handler = new Handler(Looper.getMainLooper());
          
              private int captureMode = CAPTURE_ROUTE;
              private String foregroundPackage = "";
              private boolean routeReceiverRegistered;
          
              private String pendingAddress;
              private String pendingPostalCode;
              private List<String> pendingAddressTokens = Collections.emptyList();
              private final List<String> routePoints = new ArrayList<>();
              private int nextStopIndex = -1;
              private boolean addingStop;
              private int automationStage = STAGE_NONE;
              private int automationAttempts;
              private long automationDeadline;
              private boolean automationScheduled;
              private boolean imeEnterSent;
          
              private final BroadcastReceiver routeReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent != null && ACTION_START_ROUTE.equals(intent.getAction())) {
                          startStoredRouteAutomation();
                      }
                  }
              };
          
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event != null && event.getPackageName() != null) {
                      String packageName = event.getPackageName().toString();
                      if (!getPackageName().equals(packageName) &&
                              !"com.android.systemui".equals(packageName)) {
                          foregroundPackage = packageName;
                          updateFloatingMode();
                      }
                  }
                  if (pendingAddress != null) scheduleAutomationStep(220);
              }
          
              @Override
              public void onInterrupt() {
                  cancelAutomation(null);
              }
          
              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  textRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                  registerRouteReceiver();
                  showFloatingButton();
                  Toast.makeText(this,
                          "TomTom Kiszolgáló " + VERSION + " aktív.",
                          Toast.LENGTH_SHORT).show();
              }
          
              @Override
              public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (routeReceiverRegistered) {
                      try {
                          unregisterReceiver(routeReceiver);
                      } catch (RuntimeException ignored) {
                      }
                      routeReceiverRegistered = false;
                  }
                  removeFloatingButton();
                  if (textRecognizer != null) {
                      textRecognizer.close();
                      textRecognizer = null;
                  }
                  super.onDestroy();
              }
          
              private void registerRouteReceiver() {
                  if (routeReceiverRegistered) return;
                  IntentFilter filter = new IntentFilter(ACTION_START_ROUTE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(routeReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(routeReceiver, filter);
                  }
                  routeReceiverRegistered = true;
              }
          
              private void showFloatingButton() {
                  if (floatingButton != null) return;
          
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  floatingButton = new TextView(this);
                  floatingButton.setText("TT");
                  floatingButton.setContentDescription("Útvonalpont felismerése");
                  floatingButton.setTextColor(Color.WHITE);
                  floatingButton.setTextSize(20);
                  floatingButton.setGravity(Gravity.CENTER);
                  floatingButton.setTypeface(
                          floatingButton.getTypeface(),
                          android.graphics.Typeface.BOLD);
                  floatingButton.setElevation(dp(12));
                  setButtonColor(Color.rgb(0, 150, 75));
          
                  floatingParams = new WindowManager.LayoutParams(
                          dp(64),
                          dp(64),
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  floatingParams.gravity = Gravity.TOP | Gravity.END;
                  floatingParams.x = dp(10);
                  floatingParams.y = dp(180);
          
                  floatingButton.setOnTouchListener(new FloatingTouchListener());
                  windowManager.addView(floatingButton, floatingParams);
                  updateFloatingMode();
              }
          
              private void updateFloatingMode() {
                  if (floatingButton == null || processing.get() || pendingAddress != null) return;
                  boolean maps = GOOGLE_MAPS_PACKAGE.equals(foregroundPackage);
                  floatingButton.setText(maps ? "+" : "TT");
                  floatingButton.setContentDescription(maps
                          ? "Google Maps hely hozzáadása az útvonalhoz"
                          : "Fuvarfeladat felrakó és lerakó címének felismerése");
                  setButtonColor(maps ? Color.rgb(44, 116, 214) : Color.rgb(0, 150, 75));
              }
          
              private void setButtonColor(int color) {
                  if (floatingButton == null) return;
                  GradientDrawable background = new GradientDrawable();
                  background.setShape(GradientDrawable.OVAL);
                  background.setColor(color);
                  background.setStroke(dp(2), Color.WHITE);
                  floatingButton.setBackground(background);
              }
          
              private void removeFloatingButton() {
                  if (windowManager != null && floatingButton != null) {
                      try {
                          windowManager.removeView(floatingButton);
                      } catch (RuntimeException ignored) {
                      }
                  }
                  floatingButton = null;
                  floatingParams = null;
              }
          
              private void handleFloatingClick() {
                  if (GOOGLE_MAPS_PACKAGE.equals(foregroundPackage)) {
                      processVisibleMapAddress();
                  } else {
                      processVisibleRouteAddresses();
                  }
              }
          
              private void processVisibleRouteAddresses() {
                  captureMode = CAPTURE_ROUTE;
                  startScreenRecognition("Felrakó és lerakó felismerése…");
              }
          
              private void processVisibleMapAddress() {
                  captureMode = CAPTURE_MAP;
                  List<String> visibleLines = readVisibleLinesSafely(GOOGLE_MAPS_PACKAGE);
                  String exactCoordinate = AddressExtractor.findCoordinate(visibleLines);
                  if (exactCoordinate != null) {
                      addResolvedMapPoint(exactCoordinate);
                      Toast.makeText(this, "Hozzáadva: " + exactCoordinate, Toast.LENGTH_LONG).show();
                      openEditor();
                      return;
                  }
                  startScreenRecognition("Google Maps koordináta vagy cím felismerése…");
              }
          
              private void startScreenRecognition(String message) {
                  if (!processing.compareAndSet(false, true)) return;
                  floatingButton.setText("…");
                  setButtonColor(Color.rgb(230, 145, 35));
                  Toast.makeText(this, message, Toast.LENGTH_SHORT).show();
          
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      processAccessibilityFallback(
                              "A képernyőkép-felismeréshez Android 11 vagy újabb szükséges.");
                      return;
                  }
          
                  takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          getMainExecutor(),
                          new TakeScreenshotCallback() {
                              @Override
                              public void onSuccess(ScreenshotResult screenshot) {
                                  recognizeScreenshot(screenshot);
                              }
          
                              @Override
                              public void onFailure(int errorCode) {
                                  processAccessibilityFallback(
                                          "A képernyőkép nem olvasható (hiba: " + errorCode + ").");
                              }
                          });
              }
          
              private void recognizeScreenshot(ScreenshotResult screenshot) {
                  HardwareBuffer buffer = screenshot.getHardwareBuffer();
                  Bitmap hardwareBitmap = null;
                  Bitmap bitmap = null;
                  try {
                      hardwareBitmap = Bitmap.wrapHardwareBuffer(buffer, screenshot.getColorSpace());
                      if (hardwareBitmap != null) {
                          bitmap = hardwareBitmap.copy(Bitmap.Config.ARGB_8888, false);
                      }
                  } catch (RuntimeException ignored) {
                  } finally {
                      if (hardwareBitmap != null) hardwareBitmap.recycle();
                      buffer.close();
                  }
          
                  if (bitmap == null) {
                      processAccessibilityFallback("A képernyő képe nem alakítható szöveggé.");
                      return;
                  }
          
                  final Bitmap finalBitmap = bitmap;
                  InputImage image = InputImage.fromBitmap(finalBitmap, 0);
                  textRecognizer.process(image)
                          .addOnSuccessListener(this::handleRecognizedText)
                          .addOnFailureListener(error ->
                                  processAccessibilityFallback("A szövegfelismerés nem sikerült."))
                          .addOnCompleteListener(task -> finalBitmap.recycle());
              }
          
              private void handleRecognizedText(Text visionText) {
                  List<OcrLine> positionedLines = new ArrayList<>();
                  for (Text.TextBlock block : visionText.getTextBlocks()) {
                      for (Text.Line line : block.getLines()) {
                          String value = line.getText() == null ? "" : line.getText().trim();
                          Rect box = line.getBoundingBox();
                          if (!value.isEmpty() && box != null) {
                              positionedLines.add(new OcrLine(value, box.top, box.left));
                          }
                      }
                  }
          
                  positionedLines.sort((a, b) -> {
                      int verticalTolerance = dp(12);
                      if (Math.abs(a.top - b.top) <= verticalTolerance) {
                          return Integer.compare(a.left, b.left);
                      }
                      return Integer.compare(a.top, b.top);
                  });
          
                  List<String> lines = new ArrayList<>();
                  for (OcrLine line : positionedLines) lines.add(line.text);
                  handleCapturedLines(lines);
              }
          
              private void processAccessibilityFallback(String failureMessage) {
                  String packageFilter = captureMode == CAPTURE_MAP ? GOOGLE_MAPS_PACKAGE : null;
                  List<String> visibleLines = readVisibleLinesSafely(packageFilter);
                  if (!visibleLines.isEmpty()) {
                      handleCapturedLines(visibleLines);
                      return;
                  }
                  Toast.makeText(this, failureMessage, Toast.LENGTH_LONG).show();
                  finishProcessing();
              }
          
              private boolean handleCapturedLines(List<String> lines) {
                  if (captureMode == CAPTURE_MAP) {
                      String address = AddressExtractor.findMapAddress(lines);
                      if (address == null || address.isBlank()) {
                          Toast.makeText(this,
                                  "Nem találtam használható címet. Nyisd meg a hely adatlapját, majd nyomd meg újra a + gombot.",
                                  Toast.LENGTH_LONG).show();
                          finishProcessing();
                          return false;
                      }
                      addResolvedMapPoint(address);
                      Toast.makeText(this, "Hozzáadva: " + address, Toast.LENGTH_LONG).show();
                      openEditor();
                      finishProcessing();
                      return true;
                  }
          
                  AddressExtractor.RouteCaptureResult capture =
                          AddressExtractor.analyzeRoute(lines);
                  if (capture.addresses.isEmpty() &&
                          (capture.unresolvedQuery == null || capture.unresolvedQuery.isBlank())) {
                      Toast.makeText(this,
                              "Nem találtam használható felrakó- vagy lerakócímet ezen a képernyőn.",
                              Toast.LENGTH_LONG).show();
                      finishProcessing();
                      return false;
                  }
          
                  int insertionIndex = storedPointCount() +
                          Math.max(0, capture.unresolvedIndex);
                  if (!capture.addresses.isEmpty()) {
                      appendRoutePoints(capture.addresses);
                  }
          
                  if (capture.unresolvedQuery != null &&
                          !capture.unresolvedQuery.isBlank()) {
                      String query = capture.unresolvedQuery;
                      storePendingMapResolution(query, insertionIndex);
                      finishProcessing();
          
                      if (openGoogleMapsSearch(query)) {
                          Toast.makeText(this,
                                  "Hiányos cím. A Google Maps keresése megnyílt: " + query,
                                  Toast.LENGTH_LONG).show();
                          return true;
                      }
          
                      clearPendingMapResolution();
                      Toast.makeText(this,
                              "A Google Maps nem nyitható meg. A hibás cím a vágólapra került: " + query,
                              Toast.LENGTH_LONG).show();
                      openEditor();
                      return false;
                  }
          
                  Toast.makeText(this,
                          capture.addresses.size() + " fuvarcím bekerült az útvonallistába.",
                          Toast.LENGTH_LONG).show();
                  openEditor();
                  finishProcessing();
                  return true;
              }
          
              private void appendRoutePoints(List<String> additions) {
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  List<String> combined = parseStoredPoints(
                          preferences.getString(KEY_ROUTE_POINTS, ""));
                  combined.addAll(additions);
                  combined = uniquePoints(combined);
                  preferences.edit()
                          .putString(KEY_ROUTE_POINTS, String.join("\n", combined))
                          .apply();
              }
          
              private void addResolvedMapPoint(String point) {
                  if (point == null || point.isBlank()) return;
          
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  List<String> combined = parseStoredPoints(
                          preferences.getString(KEY_ROUTE_POINTS, ""));
                  int pendingIndex = preferences.getInt(KEY_PENDING_MAP_INDEX, -1);
          
                  if (pendingIndex >= 0 && pendingIndex <= combined.size()) {
                      combined.add(pendingIndex, point.trim());
                  } else {
                      combined.add(point.trim());
                  }
          
                  combined = uniquePoints(combined);
                  preferences.edit()
                          .putString(KEY_ROUTE_POINTS, String.join("\n", combined))
                          .remove(KEY_PENDING_MAP_QUERY)
                          .remove(KEY_PENDING_MAP_INDEX)
                          .apply();
              }
          
              private int storedPointCount() {
                  return parseStoredPoints(
                          getSharedPreferences(PREFS, MODE_PRIVATE)
                                  .getString(KEY_ROUTE_POINTS, "")).size();
              }
          
              private void storePendingMapResolution(String query, int insertionIndex) {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putString(KEY_PENDING_MAP_QUERY, query == null ? "" : query.trim())
                          .putInt(KEY_PENDING_MAP_INDEX, Math.max(0, insertionIndex))
                          .apply();
              }
          
              private void clearPendingMapResolution() {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .remove(KEY_PENDING_MAP_QUERY)
                          .remove(KEY_PENDING_MAP_INDEX)
                          .apply();
              }
          
              private boolean openGoogleMapsSearch(String query) {
                  String cleanQuery = query == null
                          ? ""
                          : query.replaceAll("\\s+", " ").trim();
                  if (cleanQuery.isEmpty()) return false;
          
                  ClipboardManager clipboard =
                          (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                  if (clipboard != null) {
                      clipboard.setPrimaryClip(
                              ClipData.newPlainText("Hiányos fuvarcím", cleanQuery));
                  }
          
                  Intent searchIntent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0?q=" + Uri.encode(cleanQuery)));
                  searchIntent.setPackage(GOOGLE_MAPS_PACKAGE);
                  searchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
          
                  try {
                      startActivity(searchIntent);
                      return true;
                  } catch (ActivityNotFoundException | SecurityException ignored) {
                  }
          
                  Intent launchIntent =
                          getPackageManager().getLaunchIntentForPackage(GOOGLE_MAPS_PACKAGE);
                  if (launchIntent == null) return false;
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  try {
                      startActivity(launchIntent);
                      return true;
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }
          
              private void openEditor() {
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(intent);
              }
          
              private void startStoredRouteAutomation() {
                  List<String> stored = parseStoredPoints(
                          getSharedPreferences(PREFS, MODE_PRIVATE)
                                  .getString(KEY_ROUTE_POINTS, ""));
                  if (stored.isEmpty()) {
                      Toast.makeText(this, "Nincs megadva útvonalpont.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  startRouteAutomation(stored);
              }
          
              private void startRouteAutomation(List<String> points) {
                  cancelAutomation(null);
                  routePoints.clear();
                  routePoints.addAll(uniquePoints(points));
                  if (routePoints.isEmpty()) return;
          
                  nextStopIndex = routePoints.size() - 2;
                  addingStop = false;
                  setPendingAddress(routePoints.get(routePoints.size() - 1));
                  automationStage = STAGE_OPEN_SEARCH;
                  automationAttempts = 0;
                  automationDeadline = SystemClock.uptimeMillis() +
                          Math.max(90000L, routePoints.size() * 45000L);
                  automationScheduled = false;
                  imeEnterSent = false;
                  processing.set(true);
          
                  floatingButton.setText("→");
                  setButtonColor(Color.rgb(45, 105, 205));
                  Toast.makeText(this,
                          routePoints.size() + " pontból álló útvonal felépítése…",
                          Toast.LENGTH_LONG).show();
          
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(TOMTOM_PACKAGE);
                  if (launchIntent == null) {
                      cancelAutomation("A TomTom GO nincs telepítve vagy nem indítható.");
                      return;
                  }
          
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  try {
                      startActivity(launchIntent);
                      scheduleAutomationStep(900);
                  } catch (RuntimeException error) {
                      cancelAutomation("A TomTom GO nem nyitható meg.");
                  }
              }
          
              private void setPendingAddress(String address) {
                  pendingAddress = address;
                  pendingPostalCode = extractPostalCode(address);
                  pendingAddressTokens = buildAddressTokens(address);
                  imeEnterSent = false;
              }
          
              private void scheduleAutomationStep(long delayMs) {
                  if (pendingAddress == null || automationScheduled) return;
                  automationScheduled = true;
                  handler.postDelayed(() -> {
                      automationScheduled = false;
                      runAutomationStep();
                  }, delayMs);
              }
          
              private void moveToStage(int stage, long delayMs) {
                  automationStage = stage;
                  automationAttempts = 0;
                  imeEnterSent = false;
                  scheduleAutomationStep(delayMs);
              }
          
              private void runAutomationStep() {
                  if (pendingAddress == null) return;
                  if (SystemClock.uptimeMillis() > automationDeadline) {
                      cancelAutomation("A TomTom útvonal felépítése nem fejeződött be.");
                      return;
                  }
          
                  AccessibilityNodeInfo root = findTomTomRoot();
                  if (root == null) {
                      scheduleAutomationStep(450);
                      return;
                  }
          
                  automationAttempts++;
                  try {
                      if (automationStage == STAGE_OPEN_SEARCH) {
                          AccessibilityNodeInfo editable = findBestEditable(root);
                          if (editable != null) {
                              moveToStage(STAGE_ENTER_ADDRESS, 80);
                              return;
                          }
          
                          AccessibilityNodeInfo searchControl = findSearchControl(root);
                          if (searchControl != null && clickNodeOrAncestor(searchControl)) {
                              moveToStage(STAGE_ENTER_ADDRESS, 650);
                              return;
                          }
          
                          if (automationAttempts >= 4) {
                              tapTomTomSearchArea();
                              moveToStage(STAGE_ENTER_ADDRESS, 700);
                              return;
                          }
                      } else if (automationStage == STAGE_ENTER_ADDRESS) {
                          AccessibilityNodeInfo editable = findBestEditable(root);
                          if (editable != null && setNodeText(editable, pendingAddress)) {
                              moveToStage(STAGE_SELECT_RESULT, 900);
                              Toast.makeText(this,
                                      "Cím beírva: " + pendingAddress,
                                      Toast.LENGTH_SHORT).show();
                              return;
                          }
          
                          AccessibilityNodeInfo searchControl = findSearchControl(root);
                          if (searchControl != null) clickNodeOrAncestor(searchControl);
                          if (automationAttempts >= 4) tapTomTomSearchArea();
                      } else if (automationStage == STAGE_SELECT_RESULT) {
                          AccessibilityNodeInfo result = findBestAddressResult(root);
                          if (result != null && clickNodeOrAncestor(result)) {
                              moveToStage(addingStop ? STAGE_CONFIRM_ADD_STOP : STAGE_CONFIRM_DRIVE, 850);
                              return;
                          }
          
                          AccessibilityNodeInfo editable = findBestEditable(root);
                          if (!imeEnterSent && automationAttempts >= 3 && editable != null) {
                              imeEnterSent = performImeEnter(editable);
                              if (imeEnterSent) {
                                  scheduleAutomationStep(900);
                                  return;
                              }
                          }
                      } else if (automationStage == STAGE_CONFIRM_DRIVE) {
                          AccessibilityNodeInfo drive = findControlByKeywords(root,
                                  "DRIVE", "UTVONAL", "MENJ", "INDITAS", "NAVIGATE",
                                  "ROUTE", "LET'S GO", "LOS", "ALLER", "GUIDAGE");
                          if (drive != null && clickNodeOrAncestor(drive)) {
                              afterFinalDestinationReady(1500);
                              return;
                          }
                          if (automationAttempts >= 5) {
                              afterFinalDestinationReady(700);
                              return;
                          }
                      } else if (automationStage == STAGE_OPEN_MENU) {
                          AccessibilityNodeInfo menu = findMenuControl(root);
                          if (menu != null && clickNodeOrAncestor(menu)) {
                              moveToStage(STAGE_OPEN_CURRENT_ROUTE, 650);
                              return;
                          }
                          if (automationAttempts >= 4) {
                              tapTomTomMenuArea();
                              moveToStage(STAGE_OPEN_CURRENT_ROUTE, 650);
                              return;
                          }
                      } else if (automationStage == STAGE_OPEN_CURRENT_ROUTE) {
                          AccessibilityNodeInfo currentRoute = findControlByKeywords(root,
                                  "CURRENT ROUTE", "JELENLEGI UTVONAL", "AKTIV UTVONAL",
                                  "ITINERAIRE ACTUEL", "PARCOURS ACTUEL", "AKTUELLE ROUTE",
                                  "ROUTE ACTUELLE", "HUIDIGE ROUTE");
                          if (currentRoute != null && clickNodeOrAncestor(currentRoute)) {
                              moveToStage(STAGE_ADD_STOP, 650);
                              return;
                          }
                      } else if (automationStage == STAGE_ADD_STOP) {
                          AccessibilityNodeInfo editable = findBestEditable(root);
                          if (editable != null) {
                              prepareNextStop();
                              moveToStage(STAGE_ENTER_ADDRESS, 80);
                              return;
                          }
          
                          AccessibilityNodeInfo addStop = findControlByKeywords(root,
                                  "ADD STOP", "ADD A STOP", "MEGALLO HOZZAADASA",
                                  "STOP HOZZAADASA", "UJ MEGALLO", "AJOUTER UN ARRET",
                                  "AJOUTER UNE ETAPE", "HALT HINZUFUGEN", "ZWISCHENZIEL",
                                  "VOEG STOP TOE", "AGGIUNGI FERMATA", "ANADIR PARADA");
                          if (addStop != null && clickNodeOrAncestor(addStop)) {
                              prepareNextStop();
                              moveToStage(STAGE_ENTER_ADDRESS, 650);
                              return;
                          }
                      } else if (automationStage == STAGE_CONFIRM_ADD_STOP) {
                          AccessibilityNodeInfo add = findControlByKeywords(root,
                                  "ADD STOP", "ADD TO ROUTE", "HOZZAADAS MEGALLOKENT",
                                  "HOZZAADAS AZ UTVONALHOZ", "AJOUTER AU PARCOURS",
                                  "AJOUTER COMME ETAPE", "ZUR ROUTE HINZUFUGEN",
                                  "ALS STOP TOEVOEGEN", "AGGIUNGI AL PERCORSO");
                          if (add != null && clickNodeOrAncestor(add)) {
                              afterStopAdded(1200);
                              return;
                          }
                          if (automationAttempts >= 5) {
                              afterStopAdded(800);
                              return;
                          }
                      }
                  } finally {
                      root.recycle();
                  }
          
                  scheduleAutomationStep(450);
              }
          
              private void afterFinalDestinationReady(long delayMs) {
                  if (nextStopIndex >= 0) {
                      moveToStage(STAGE_OPEN_MENU, delayMs);
                  } else {
                      completeRouteAutomation();
                  }
              }
          
              private void prepareNextStop() {
                  if (nextStopIndex < 0) return;
                  addingStop = true;
                  setPendingAddress(routePoints.get(nextStopIndex));
              }
          
              private void afterStopAdded(long delayMs) {
                  nextStopIndex--;
                  addingStop = false;
                  if (nextStopIndex >= 0) {
                      moveToStage(STAGE_OPEN_MENU, delayMs);
                  } else {
                      completeRouteAutomation();
                  }
              }
          
              private AccessibilityNodeInfo findTomTomRoot() {
                  try {
                      List<AccessibilityWindowInfo> windows = new ArrayList<>(getWindows());
                      windows.sort(Comparator.comparingInt(AccessibilityWindowInfo::getLayer).reversed());
                      for (AccessibilityWindowInfo window : windows) {
                          AccessibilityNodeInfo root = window.getRoot();
                          if (root == null) continue;
                          CharSequence packageName = root.getPackageName();
                          if (packageName != null && TOMTOM_PACKAGE.contentEquals(packageName)) {
                              return root;
                          }
                          root.recycle();
                      }
                  } catch (RuntimeException ignored) {
                  }
                  return null;
              }
          
              private AccessibilityNodeInfo findBestEditable(AccessibilityNodeInfo root) {
                  List<AccessibilityNodeInfo> nodes = new ArrayList<>();
                  collectNodes(root, nodes, 0);
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MIN_VALUE;
                  for (AccessibilityNodeInfo node : nodes) {
                      if (!node.isVisibleToUser()) continue;
                      String className = textOf(node.getClassName());
                      boolean editable = node.isEditable() || className.contains("EditText") ||
                              node.getActionList().contains(
                                      AccessibilityNodeInfo.AccessibilityAction.ACTION_SET_TEXT);
                      if (!editable) continue;
          
                      String descriptor = normalize(nodeDescriptor(node));
                      int score = 10;
                      if (containsAny(descriptor,
                              "SEARCH", "KERES", "DESTINATION", "PLACE", "WHERE", "HOVA", "CIM",
                              "RECHERCH", "SUCH", "CERCA", "BUSCAR")) score += 12;
                      if (node.isFocused()) score += 6;
                      if (node.isClickable()) score += 2;
                      if (score > bestScore) {
                          bestScore = score;
                          best = node;
                      }
                  }
                  return best;
              }
          
              private AccessibilityNodeInfo findSearchControl(AccessibilityNodeInfo root) {
                  return findControlByKeywords(root,
                          "SEARCH", "KERES", "HELY KERESE", "HOVA", "DESTINATION", "WHERE TO",
                          "PLACE", "ZOEK", "RECHERCH", "SUCH", "CERCA", "BUSCAR");
              }
          
              private AccessibilityNodeInfo findMenuControl(AccessibilityNodeInfo root) {
                  List<AccessibilityNodeInfo> nodes = new ArrayList<>();
                  collectNodes(root, nodes, 0);
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MIN_VALUE;
                  for (AccessibilityNodeInfo node : nodes) {
                      if (!node.isVisibleToUser()) continue;
                      String descriptor = normalize(nodeDescriptor(node));
                      String viewId = textOf(node.getViewIdResourceName()).toLowerCase(Locale.ROOT);
                      int score = 0;
                      if (containsAny(descriptor, "MENU", "FOMENU", "MAIN MENU")) score += 20;
                      if (viewId.contains("menu")) score += 16;
                      if (node.isClickable()) score += 5;
                      if (hasClickableAncestor(node)) score += 2;
                      if (score > bestScore) {
                          bestScore = score;
                          best = node;
                      }
                  }
                  return bestScore >= 15 ? best : null;
              }
          
              private AccessibilityNodeInfo findControlByKeywords(
                      AccessibilityNodeInfo root,
                      String... keywords) {
                  List<AccessibilityNodeInfo> nodes = new ArrayList<>();
                  collectNodes(root, nodes, 0);
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MIN_VALUE;
                  for (AccessibilityNodeInfo node : nodes) {
                      if (!node.isVisibleToUser()) continue;
                      String descriptor = normalize(nodeDescriptor(node));
                      if (descriptor.isEmpty()) continue;
          
                      int score = 0;
                      for (String keyword : keywords) {
                          String normalizedKeyword = normalize(keyword);
                          if (descriptor.equals(normalizedKeyword)) score += 30;
                          else if (descriptor.contains(normalizedKeyword)) score += 18;
                      }
                      if (node.isClickable()) score += 5;
                      if (hasClickableAncestor(node)) score += 2;
                      if (score > bestScore) {
                          bestScore = score;
                          best = node;
                      }
                  }
                  return bestScore >= 18 ? best : null;
              }
          
              private AccessibilityNodeInfo findBestAddressResult(AccessibilityNodeInfo root) {
                  List<AccessibilityNodeInfo> nodes = new ArrayList<>();
                  collectNodes(root, nodes, 0);
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MIN_VALUE;
                  for (AccessibilityNodeInfo node : nodes) {
                      if (!node.isVisibleToUser() || node.isEditable()) continue;
                      String descriptor = normalize(nodeDescriptor(node));
                      if (descriptor.length() < 3) continue;
          
                      int score = 0;
                      if (pendingPostalCode != null && descriptor.contains(pendingPostalCode)) score += 30;
                      for (String token : pendingAddressTokens) {
                          if (descriptor.contains(token)) score += token.matches("\\d{4,5}") ? 12 : 4;
                      }
                      if (node.isClickable()) score += 6;
                      if (hasClickableAncestor(node)) score += 3;
                      if (containsAny(descriptor,
                              "RECENT", "LEGUTOBBI", "CURRENT LOCATION", "AKTUALIS HELY")) score -= 20;
          
                      if (score > bestScore) {
                          bestScore = score;
                          best = node;
                      }
                  }
                  return bestScore >= 12 ? best : null;
              }
          
              private void collectNodes(
                      AccessibilityNodeInfo node,
                      List<AccessibilityNodeInfo> output,
                      int depth) {
                  if (node == null || depth > 70) return;
                  output.add(node);
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) collectNodes(child, output, depth + 1);
                  }
              }
          
              private boolean setNodeText(AccessibilityNodeInfo node, String value) {
                  try {
                      node.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                      node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      Bundle arguments = new Bundle();
                      arguments.putCharSequence(
                              AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                              value);
                      return node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments);
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }
          
              private boolean performImeEnter(AccessibilityNodeInfo editable) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return false;
                  try {
                      return editable.performAction(
                              AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId());
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }
          
              private boolean clickNodeOrAncestor(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node;
                  for (int level = 0; current != null && level < 8; level++) {
                      try {
                          if (current.isVisibleToUser() && current.isClickable() &&
                                  current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                              return true;
                          }
                          AccessibilityNodeInfo parent = current.getParent();
                          if (current != node) current.recycle();
                          current = parent;
                      } catch (RuntimeException ignored) {
                          break;
                      }
                  }
                  if (current != null && current != node) current.recycle();
                  return false;
              }
          
              private boolean hasClickableAncestor(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node.getParent();
                  for (int level = 0; current != null && level < 6; level++) {
                      if (current.isClickable()) {
                          current.recycle();
                          return true;
                      }
                      AccessibilityNodeInfo parent = current.getParent();
                      current.recycle();
                      current = parent;
                  }
                  return false;
              }
          
              private void tapTomTomSearchArea() {
                  if (windowManager == null) return;
                  android.util.DisplayMetrics metrics = new android.util.DisplayMetrics();
                  windowManager.getDefaultDisplay().getRealMetrics(metrics);
                  float x = metrics.widthPixels * 0.50f;
                  float y = Math.max(dp(76), metrics.heightPixels * 0.085f);
                  dispatchTap(x, y);
              }
          
              private void tapTomTomMenuArea() {
                  if (windowManager == null) return;
                  android.util.DisplayMetrics metrics = new android.util.DisplayMetrics();
                  windowManager.getDefaultDisplay().getRealMetrics(metrics);
                  dispatchTap(metrics.widthPixels * 0.08f, metrics.heightPixels * 0.91f);
              }
          
              private void dispatchTap(float x, float y) {
                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(path, 0, 80);
                  GestureDescription gesture = new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();
                  dispatchGesture(gesture, null, null);
              }
          
              private String nodeDescriptor(AccessibilityNodeInfo node) {
                  StringBuilder builder = new StringBuilder();
                  append(builder, node.getText());
                  append(builder, node.getContentDescription());
                  append(builder, node.getHintText());
                  append(builder, node.getPaneTitle());
                  append(builder, node.getViewIdResourceName());
                  return builder.toString();
              }
          
              private void append(StringBuilder builder, CharSequence value) {
                  if (value == null || value.length() == 0) return;
                  if (builder.length() > 0) builder.append(' ');
                  builder.append(value);
              }
          
              private String textOf(CharSequence value) {
                  return value == null ? "" : value.toString();
              }
          
              private boolean containsAny(String value, String... needles) {
                  for (String needle : needles) {
                      if (value.contains(normalize(needle))) return true;
                  }
                  return false;
              }
          
              private String extractPostalCode(String address) {
                  Matcher matcher = POSTAL_CODE.matcher(address);
                  return matcher.find() ? matcher.group() : null;
              }
          
              private List<String> buildAddressTokens(String address) {
                  String normalized = normalize(address);
                  List<String> tokens = new ArrayList<>();
                  for (String token : normalized.split("[^A-Z0-9]+")) {
                      if (token.length() >= 3 && !COUNTRY_CODES.contains(token)) tokens.add(token);
                  }
                  return tokens;
              }
          
