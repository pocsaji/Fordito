              private List<String> readVisibleLinesSafely(String requiredPackage) {
                  try {
                      List<AccessibilityWindowInfo> windows = new ArrayList<>(getWindows());
                      windows.sort(Comparator.comparingInt(AccessibilityWindowInfo::getLayer).reversed());
                      for (AccessibilityWindowInfo window : windows) {
                          AccessibilityNodeInfo root = window.getRoot();
                          if (root == null) continue;
                          try {
                              CharSequence packageName = root.getPackageName();
                              String packageText = packageName == null ? "" : packageName.toString();
                              if (requiredPackage != null && !requiredPackage.equals(packageText)) continue;
                              if (getPackageName().equals(packageText) ||
                                      "com.android.systemui".equals(packageText) ||
                                      TOMTOM_PACKAGE.equals(packageText)) {
                                  continue;
                              }
                              List<String> lines = new ArrayList<>();
                              collectVisibleText(root, lines, 0);
                              if (!lines.isEmpty()) return deduplicateAdjacent(lines);
                          } finally {
                              root.recycle();
                          }
                      }
                  } catch (RuntimeException ignored) {
                  }
                  return Collections.emptyList();
              }
          
              private void collectVisibleText(
                      AccessibilityNodeInfo node,
                      List<String> output,
                      int depth) {
                  if (node == null || depth > 80) return;
                  if (node.isVisibleToUser()) {
                      addText(node.getText(), output);
                      if (node.getText() == null || node.getText().length() == 0) {
                          addText(node.getContentDescription(), output);
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          try {
                              collectVisibleText(child, output, depth + 1);
                          } finally {
                              child.recycle();
                          }
                      }
                  }
              }
          
              private void addText(CharSequence value, List<String> output) {
                  if (value == null) return;
                  String text = value.toString().replace('\u00A0', ' ').trim();
                  if (text.isEmpty()) return;
                  for (String part : text.split("\\r?\\n")) {
                      String clean = part.replaceAll("\\s+", " ").trim();
                      if (!clean.isEmpty()) output.add(clean);
                  }
              }
          
              private List<String> deduplicateAdjacent(List<String> source) {
                  List<String> result = new ArrayList<>();
                  String previous = null;
                  for (String value : source) {
                      if (!value.equals(previous)) result.add(value);
                      previous = value;
                  }
                  return result;
              }
          
              private List<String> parseStoredPoints(String stored) {
                  List<String> points = new ArrayList<>();
                  if (stored == null) return points;
                  for (String line : stored.split("\\r?\\n")) {
                      String clean = line.replaceFirst("^\\s*\\d{1,3}[.)-]\\s+", "")
                              .replaceAll("\\s+", " ")
                              .trim();
                      if (!clean.isEmpty()) points.add(clean);
                  }
                  return uniquePoints(points);
              }
          
              private List<String> uniquePoints(List<String> source) {
                  Set<String> values = new LinkedHashSet<>();
                  for (String value : source) {
                      if (value != null && !value.isBlank()) values.add(value.trim());
                  }
                  return new ArrayList<>(values);
              }
          
              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          
              private static String normalize(String value) {
                  if (value == null) return "";
                  String decomposed = Normalizer.normalize(
                          value.toUpperCase(Locale.ROOT),
                          Normalizer.Form.NFD);
                  return decomposed.replaceAll("\\p{M}+", "")
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private final class FloatingTouchListener implements View.OnTouchListener {
                  private int startX;
                  private int startY;
                  private float startRawX;
                  private float startRawY;
                  private long downTime;
                  private boolean dragging;
          
                  @Override
                  public boolean onTouch(View view, MotionEvent event) {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              startX = floatingParams.x;
                              startY = floatingParams.y;
                              startRawX = event.getRawX();
                              startRawY = event.getRawY();
                              downTime = SystemClock.uptimeMillis();
                              dragging = false;
                              return true;
          
                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - startRawX;
                              float dy = event.getRawY() - startRawY;
                              long held = SystemClock.uptimeMillis() - downTime;
                              if (!dragging && held >= 450 &&
                                      (Math.abs(dx) > dp(24) || Math.abs(dy) > dp(24))) {
                                  dragging = true;
                              }
                              if (dragging) {
                                  floatingParams.x = Math.max(0, startX - Math.round(dx));
                                  floatingParams.y = Math.max(0, startY + Math.round(dy));
                                  windowManager.updateViewLayout(floatingButton, floatingParams);
                              }
                              return true;
          
                          case MotionEvent.ACTION_UP:
                              if (!dragging) handleFloatingClick();
                              return true;
          
                          case MotionEvent.ACTION_CANCEL:
                              dragging = false;
                              return true;
          
                          default:
                              return true;
                      }
                  }
              }
          
              private static final class OcrLine {
                  final String text;
                  final int top;
                  final int left;
          
                  OcrLine(String text, int top, int left) {
                      this.text = text;
                      this.top = top;
                      this.left = left;
                  }
              }
          
              private static final class AddressExtractor {
                  private static final String[] ROUTE_STOP_WORDS = {
                          "AUTRE", "COMPTE", "TEL", "TELEPHONE", "DOUANE",
                          "PULPE", "MARCHANDISE", "PRODUIT", "GOODS", "WARE",
                          "REFERENCE", "REF ", "KULDET ESEIM", "UJ KULDETES",
                          "BEALLITASOK", "TAMOGATAS"
                  };
          
                  private static final String[] MAP_UI_WORDS = {
                          "UTVONALTERV", "INDULAS", "MENTES", "MENTVE", "NEVJEGY",
                          "SZERKESZTES", "HIANYZO HELY", "TAVOLSAGMERES",
                          "GOMBOSTU ELHELYEZVE", "HIBABEJELENTES", "DIJMENTESEN",
                          "KOZELEBEN", "GOOGLE MAPS", "MENTETT HELYEK", "SAVED PLACES"
                  };
          
                  private AddressExtractor() {
                  }
          
                  static List<String> findRouteAddresses(List<String> originalLines) {
                      return analyzeRoute(originalLines).addresses;
                  }
          
                  static RouteCaptureResult analyzeRoute(List<String> originalLines) {
                      List<String> lines = cleanLines(originalLines);
                      if (lines.isEmpty()) {
                          return new RouteCaptureResult(
                                  Collections.emptyList(), null, -1);
                      }
          
                      int pickupIndex = findMarkerIndex(lines, PICKUP_MARKERS, 0);
                      int deliveryIndex = findMarkerIndex(lines, DELIVERY_MARKERS, 0);
                      List<String> result = new ArrayList<>();
                      String unresolvedQuery = null;
                      int unresolvedIndex = -1;
          
                      if (pickupIndex >= 0) {
                          int end = deliveryIndex > pickupIndex ? deliveryIndex : lines.size();
                          String pickup = extractRouteBlock(lines, pickupIndex + 1, end);
                          if (pickup != null) {
                              result.add(pickup);
                          } else {
                              unresolvedQuery =
                                      extractRouteSearchQuery(lines, pickupIndex + 1, end);
                              unresolvedIndex = result.size();
                          }
                      }
          
                      if (deliveryIndex >= 0) {
                          int nextPickup =
                                  findMarkerIndex(lines, PICKUP_MARKERS, deliveryIndex + 1);
                          int end = nextPickup > deliveryIndex ? nextPickup : lines.size();
                          String delivery =
                                  extractRouteBlock(lines, deliveryIndex + 1, end);
                          if (delivery != null &&
                                  !containsNormalized(result, delivery)) {
                              result.add(delivery);
                          } else if (delivery == null && unresolvedQuery == null) {
                              unresolvedQuery =
                                      extractRouteSearchQuery(lines, deliveryIndex + 1, end);
                              unresolvedIndex = result.size();
                          }
                      }
          
                      return new RouteCaptureResult(
                              result, unresolvedQuery, unresolvedIndex);
                  }
          
                  static String findCoordinate(List<String> originalLines) {
                      if (originalLines == null) return null;
                      for (String line : originalLines) {
                          String coordinate = coordinateFromText(clean(line));
                          if (coordinate != null) return coordinate;
                      }
                      return coordinateFromText(String.join(" ", originalLines));
                  }
          
                  static String findMapAddress(List<String> originalLines) {
                      String coordinate = findCoordinate(originalLines);
                      if (coordinate != null) return coordinate;
          
                      List<String> lines = cleanLines(originalLines);
                      if (lines.isEmpty()) return null;
          
                      Candidate best = null;
                      for (int i = 0; i < lines.size(); i++) {
                          for (int count = 1; count <= 3 && i + count <= lines.size(); count++) {
                              String joined = joinMapLines(lines, i, count);
                              Candidate candidate = scoreMapAddress(joined, i);
                              if (candidate != null &&
                                      (best == null || candidate.score > best.score)) {
                                  best = candidate;
                              }
                          }
                      }
                      return best == null ? null : best.address;
                  }
          
                  private static String extractRouteBlock(List<String> lines, int start, int end) {
                      List<String> parts = new ArrayList<>();
                      int safeStart = Math.max(0, start);
                      int safeEnd = Math.min(lines.size(), Math.max(safeStart, end));
          
                      for (int i = safeStart; i < safeEnd && parts.size() < 6; i++) {
                          String raw = clean(lines.get(i));
                          String normalized = normalize(raw);
                          if (raw.isEmpty()) continue;
                          if (isMarker(normalized)) {
                              if (!parts.isEmpty()) break;
                              continue;
                          }
                          if (isHardRouteStop(raw, normalized)) {
                              if (!parts.isEmpty()) break;
                              continue;
                          }
                          if (isGeneralNoise(normalized)) continue;
                          parts.add(raw);
                      }
          
                      String joined = stripLeadingCompany(joinParts(parts));
                      if (isUsableRouteAddress(joined)) return normalizeAddress(joined);
          
                      Candidate fallback = findBestRouteCandidate(lines, safeStart, safeEnd);
                      return fallback == null ? null : fallback.address;
                  }
          
                  private static String extractRouteSearchQuery(
                          List<String> lines,
                          int start,
                          int end) {
                      List<String> parts = new ArrayList<>();
                      int safeStart = Math.max(0, start);
                      int safeEnd = Math.min(lines.size(), Math.max(safeStart, end));
          
                      for (int i = safeStart; i < safeEnd && parts.size() < 6; i++) {
                          String raw = clean(lines.get(i));
                          String normalized = normalize(raw);
                          if (raw.isEmpty()) continue;
                          if (isMarker(normalized)) {
                              if (!parts.isEmpty()) break;
                              continue;
                          }
                          if (isHardRouteStop(raw, normalized)) {
                              if (!parts.isEmpty()) break;
                              continue;
                          }
                          if (isGeneralNoise(normalized)) continue;
                          parts.add(raw);
                      }
          
                      String query = joinParts(parts);
                      return query.length() >= 4 ? query : null;
                  }
          
                  private static Candidate findBestRouteCandidate(
                          List<String> lines,
                          int start,
                          int end) {
                      Candidate best = null;
                      for (int i = start; i < end; i++) {
                          for (int count = 1; count <= 5 && i + count <= end; count++) {
                              String joined = joinRouteLines(lines, i, count);
                              Candidate candidate = scoreRouteAddress(joined, i - start);
                              if (candidate != null &&
                                      (best == null || candidate.score > best.score)) {
                                  best = candidate;
                              }
                          }
                      }
                      return best;
                  }
          
                  private static String joinRouteLines(List<String> lines, int start, int count) {
                      List<String> parts = new ArrayList<>();
                      int end = Math.min(lines.size(), start + count);
                      for (int i = start; i < end; i++) {
                          String raw = clean(lines.get(i));
                          String normalized = normalize(raw);
                          if (raw.isEmpty() || isMarker(normalized) || isGeneralNoise(normalized)) continue;
                          if (isHardRouteStop(raw, normalized)) break;
                          parts.add(raw);
                      }
                      return joinParts(parts);
                  }
          
                  private static String joinMapLines(List<String> lines, int start, int count) {
                      List<String> parts = new ArrayList<>();
                      int end = Math.min(lines.size(), start + count);
                      for (int i = start; i < end; i++) {
                          String raw = clean(lines.get(i));
                          String normalized = normalize(raw);
                          if (raw.isEmpty() || isMapUiNoise(normalized) || hasTimeOrDate(raw)) break;
                          parts.add(raw);
                      }
                      return joinParts(parts);
                  }
          
                  private static String joinParts(List<String> parts) {
                      StringBuilder builder = new StringBuilder();
                      String previousRaw = null;
                      String previousNormalized = null;
                      for (String part : parts) {
                          String current = clean(part);
                          if (current.isEmpty()) continue;
                          String currentNormalized = normalize(current);
                          if (currentNormalized.equals(previousNormalized)) continue;
                          if (isRepeatedContinuation(previousRaw, current)) {
                              while (builder.length() > 0 &&
                                      (builder.charAt(builder.length() - 1) == '-' ||
                                              Character.isWhitespace(builder.charAt(builder.length() - 1)))) {
                                  builder.setLength(builder.length() - 1);
                              }
                              previousRaw = current;
                              previousNormalized = currentNormalized;
                              continue;
                          }
          
                          if (builder.length() > 0) {
                              builder.append(continuesPreviousLine(previousRaw, current)
                                      ? " "
                                      : ", ");
                          }
                          builder.append(current);
                          previousRaw = current;
                          previousNormalized = currentNormalized;
                      }
                      return normalizeAddress(builder.toString());
                  }
          
                  private static boolean isRepeatedContinuation(String previous, String current) {
                      if (previous == null || current == null) return false;
                      String previousCore = normalize(previous).replaceAll("[^A-Z0-9]+$", "");
                      String currentCore = normalize(current).replaceAll("[^A-Z0-9]+$", "");
                      return currentCore.length() >= 4 && previousCore.endsWith(currentCore);
                  }
          
                  private static boolean continuesPreviousLine(String previous, String current) {
                      if (previous == null || current == null) return false;
                      String previousNormalized = normalize(previous);
                      String currentNormalized = normalize(current);
                      if (previous.trim().endsWith("-")) return true;
                      return POSTAL_CODE.matcher(previous).find() &&
                              !containsCountryCode(previousNormalized) &&
                              containsCountryCode(currentNormalized);
                  }
          
                  private static Candidate scoreRouteAddress(String raw, int distance) {
                      String value = stripLeadingCompany(normalizeAddress(raw));
                      if (!isUsableRouteAddress(value) || hasTimeOrDate(value)) return null;
          
                      String normalized = normalize(value);
                      int score = 20;
                      if (POSTAL_CODE.matcher(value).find()) score += 12;
                      if (containsCountryCode(normalized)) score += 10;
                      if (containsStreetHint(normalized)) score += 8;
                      if (value.contains(",")) score += 4;
                      score -= Math.min(distance, 10);
                      return new Candidate(value, score);
                  }
          
                  private static Candidate scoreMapAddress(String raw, int distance) {
                      String value = normalizeAddress(raw);
                      if (value.length() < 4 || value.length() > 180 || hasTimeOrDate(value)) return null;
          
                      String normalized = normalize(value);
                      if (isMapUiNoise(normalized) || isGeneralNoise(normalized)) return null;
          
                      boolean hasPostal = POSTAL_CODE.matcher(value).find();
                      boolean hasCountry = containsCountryCode(normalized);
                      boolean hasStreet = containsStreetHint(normalized);
                      boolean hasHouse = HOUSE_NUMBER.matcher(value).find();
                      if (!hasPostal && !(hasStreet && hasHouse)) return null;
          
                      int score = 0;
                      if (hasPostal) score += 16;
                      if (hasCountry) score += 8;
                      if (hasStreet) score += 7;
                      if (hasHouse) score += 3;
                      if (value.contains(",")) score += 2;
                      score -= Math.min(distance, 12);
                      return new Candidate(value, score);
                  }
          
                  private static String stripLeadingCompany(String value) {
                      String cleanValue = normalizeAddress(value == null ? "" : value);
                      if (cleanValue.isEmpty()) return cleanValue;
          
                      String coordinate = coordinateFromText(cleanValue);
                      if (coordinate != null) return coordinate;
          
                      Pattern streetStart = Pattern.compile(
                              "(?iu)\\b(?:route|rue|avenue|av\\.?|boulevard|chemin|impasse|"
                                      + "quai|place|all[ée]e|voie|street|road|lane|drive|"
                                      + "strasse|stra[ßs]e|weg|platz|gasse|ring|"
                                      + "straat|laan|weg|via|viale|corso|piazza|"
                                      + "utca|[úu]t|[úu]tja|t[ée]r|k[öo]r[úu]t)\\b");
                      Matcher matcher = streetStart.matcher(cleanValue);
                      if (!matcher.find()) return cleanValue;
          
                      int start = matcher.start();
                      String prefix = cleanValue.substring(0, start).trim();
                      Matcher houseBeforeStreet =
                              Pattern.compile("(\\d{1,5}[A-Za-z]?)\\s*$").matcher(prefix);
                      if (houseBeforeStreet.find()) {
                          start = houseBeforeStreet.start();
                      }
          
                      return normalizeAddress(cleanValue.substring(start));
                  }
          
                  private static boolean isUsableRouteAddress(String value) {
                      if (value == null || value.length() < 7 || value.length() > 240) return false;
                      String coordinate = coordinateFromText(value);
                      if (coordinate != null) return true;
          
                      String normalized = normalize(value);
                      boolean hasPostal = POSTAL_CODE.matcher(value).find();
                      boolean hasCountry = containsCountryCode(normalized);
                      boolean hasStreet = containsStreetHint(normalized);
                      return hasPostal && hasStreet;
                  }
          
                  private static String coordinateFromText(String value) {
                      if (value == null || value.isBlank()) return null;
                      Matcher matcher = COORDINATE.matcher(value.replace('−', '-'));
                      while (matcher.find()) {
                          try {
                              double latitude = Double.parseDouble(matcher.group(1));
                              double longitude = Double.parseDouble(matcher.group(2));
                              if (latitude >= -90.0 && latitude <= 90.0 &&
                                      longitude >= -180.0 && longitude <= 180.0) {
                                  return matcher.group(1) + " " + matcher.group(2);
                              }
                          } catch (NumberFormatException ignored) {
                          }
                      }
                      return null;
                  }
          
                  private static List<String> cleanLines(List<String> originalLines) {
                      if (originalLines == null || originalLines.isEmpty()) {
                          return Collections.emptyList();
                      }
                      List<String> lines = new ArrayList<>();
                      for (String line : originalLines) {
                          String clean = clean(line);
                          if (!clean.isEmpty() &&
                                  !"TT".equalsIgnoreCase(clean) &&
                                  !"+".equals(clean) &&
                                  !"…".equals(clean)) {
                              lines.add(clean);
                          }
                      }
                      return lines;
                  }
          
                  private static int findMarkerIndex(
                          List<String> lines,
                          List<String> markers,
                          int start) {
                      for (int i = Math.max(0, start); i < lines.size(); i++) {
                          String normalized = normalize(lines.get(i));
                          for (String marker : markers) {
                              if (normalized.equals(marker) ||
                                      normalized.startsWith(marker + " ") ||
                                      normalized.contains(" " + marker + " ")) {
                                  return i;
                              }
                          }
                      }
                      return -1;
                  }
          
                  private static boolean isMarker(String normalized) {
                      for (String marker : PICKUP_MARKERS) {
                          if (normalized.equals(marker) || normalized.startsWith(marker + " ")) return true;
                      }
                      for (String marker : DELIVERY_MARKERS) {
                          if (normalized.equals(marker) || normalized.startsWith(marker + " ")) return true;
                      }
                      return false;
                  }
          
                  private static boolean isHardRouteStop(String raw, String normalized) {
                      if (hasTimeOrDate(raw)) return true;
                      for (String word : ROUTE_STOP_WORDS) {
                          if (normalized.equals(word) || normalized.startsWith(word + " ") ||
                                  normalized.contains(" " + word + " ")) {
                              return true;
                          }
                      }
                      return false;
                  }
          
                  private static boolean hasTimeOrDate(String value) {
                      return TIME_VALUE.matcher(value).find() || YEAR_VALUE.matcher(value).find();
                  }
          
                  private static boolean isGeneralNoise(String normalized) {
                      return normalized.isEmpty() ||
                              normalized.contains("BEFEJEZETT") ||
                              normalized.contains("FOLYAMATBAN") ||
                              normalized.contains("FRISSITES") ||
                              normalized.contains("KULDETESEIM") ||
                              normalized.contains("UJ KULDETES") ||
                              normalized.contains("BEALLITASOK") ||
                              normalized.contains("TAMOGATAS");
                  }
          
                  private static boolean isMapUiNoise(String normalized) {
                      if (isGeneralNoise(normalized)) return true;
                      for (String word : MAP_UI_WORDS) {
                          if (normalized.equals(word) || normalized.startsWith(word + " ") ||
                                  normalized.contains(" " + word + " ")) {
                              return true;
                          }
                      }
                      return false;
                  }
          
                  private static boolean containsNormalized(List<String> values, String candidate) {
                      String normalizedCandidate = normalize(candidate);
                      for (String value : values) {
                          if (normalize(value).equals(normalizedCandidate)) return true;
                      }
                      return false;
                  }
          
                  private static boolean containsCountryCode(String normalized) {
                      String[] tokens = normalized.split("[^A-Z]+");
                      for (int i = tokens.length - 1; i >= 0; i--) {
                          if (tokens[i].isEmpty()) continue;
                          return COUNTRY_CODES.contains(tokens[i]);
                      }
                      return false;
                  }
          
                  private static boolean containsStreetHint(String normalized) {
                      String padded = " " + normalized + " ";
                      String[] hints = {
                              " RUE ", " AVENUE ", " ROUTE ", " CHEMIN ", " QUAI ", " IMPASSE ",
                              " STRASSE ", " STR. ", " WEG ", " PLATZ ", " GASSE ", " ALLEE ",
                              " UTCA ", " UT ", " TER ", " KORUT ", " TANYA ",
                              " STREET ", " ROAD ", " LANE ", " DRIVE ",
                              " KAAI ", " LAAN ", " STRAAT ", " VIA ", " PIAZZA "
                      };
                      for (String hint : hints) {
                          if (padded.contains(hint)) return true;
                      }
                      return false;
                  }
          
                  private static String normalizeAddress(String value) {
                      return clean(value)
                              .replaceAll("\\s*,\\s*", ", ")
                              .replaceAll("(?:,\\s*){2,}", ", ")
                              .replaceAll("^[,;: -]+|[,;: -]+$", "")
                              .trim();
                  }
          
                  private static String clean(String value) {
                      if (value == null) return "";
                      return value.replace('\u00A0', ' ')
                              .replaceAll("\\s+", " ")
                              .trim();
                  }
          
                  private static final class RouteCaptureResult {
                      final List<String> addresses;
                      final String unresolvedQuery;
                      final int unresolvedIndex;
          
                      RouteCaptureResult(
                              List<String> addresses,
                              String unresolvedQuery,
                              int unresolvedIndex) {
                          this.addresses = new ArrayList<>(addresses);
                          this.unresolvedQuery = unresolvedQuery;
                          this.unresolvedIndex = unresolvedIndex;
                      }
                  }
          
                  private static final class Candidate {
                      final String address;
                      final int score;
          
                      Candidate(String address, int score) {
                          this.address = address;
                          this.score = score;
                      }
                  }
              }
          }
          EOF

      - name: Verify V017 TomTom project
        run: |
          grep -F 'rootProject.name = "TomTomKiszolgaloV017"' settings.gradle.kts
          grep -F 'versionCode = 17' app/build.gradle.kts
          grep -F 'versionName = "017"' app/build.gradle.kts
          grep -F 'TomTom Kiszolgáló V017' app/src/main/AndroidManifest.xml
          grep -F 'private static final String VERSION = "V017";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java
          grep -F 'private static final String VERSION = "V017";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'return matcher.group(1) + " " + matcher.group(2);' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'openGoogleMapsSearch' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'stripLeadingCompany' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          test "$(grep -R -F -c 'replaceFirst("^\\s*\\d{1,3}[.)-]\\s+", "")' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/*.java | awk -F: '{s+=$2} END {print s+0}')" -eq 2
          ! grep -R -F 'replaceAll("^\\s*\\d+[.)-]?\\s*", "")' app/src/main/java/hu/pocsaji/tomtomkiszolgalo
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V017 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V017 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V017.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V017.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V017
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V017
          path: |
            artifact/TomTom_Kiszolgalo_V017.apk
            artifact/TomTom_Kiszolgalo_V017.aab
          if-no-files-found: error
