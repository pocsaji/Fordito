          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Set;
          
          public final class MainActivity extends Activity {
              private static final String VERSION = "V017";
              private static final String GOOGLE_MAPS_PACKAGE = "com.google.android.apps.maps";
              private static final String PREFS = "route_editor";
              private static final String KEY_ROUTE_POINTS = "route_points";
              private static final String KEY_PENDING_MAP_QUERY = "pending_map_query";
              private static final String KEY_PENDING_MAP_INDEX = "pending_map_index";
              private static final String ACTION_START_ROUTE =
                      "hu.pocsaji.tomtomkiszolgalo.action.START_ROUTE";
          
              private TextView statusText;
              private EditText routeEditor;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(16, 19, 24));
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(20), dp(28), dp(20), dp(28));
                  scroll.addView(root, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));
          
                  TextView title = new TextView(this);
                  title.setText("TomTom Kiszolgáló " + VERSION);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(27);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(title.getTypeface(), android.graphics.Typeface.BOLD);
                  root.addView(title, matchWrap());
          
                  TextView description = new TextView(this);
                  description.setText(
                          "Útvonalpontok sorrendben. Minden sor egy külön cím.\n\n" +
                          "A fuvarfeladat képernyőjén a lebegő TT gomb felismeri a felrakót és a lerakót. " +
                          "A Google Mapsban a lebegő + gomb elsőként a koordinátát, ennek hiányában a normál címet adja hozzá. " +
                          "A mező kézzel is javítható vagy bővíthető.");
                  description.setTextColor(Color.rgb(220, 225, 232));
                  description.setTextSize(18);
                  description.setLineSpacing(0f, 1.12f);
                  description.setPadding(0, dp(22), 0, dp(18));
                  root.addView(description, matchWrap());
          
                  TextView fieldLabel = new TextView(this);
                  fieldLabel.setText("SZERKESZTETT ÚTVONALPONTOK");
                  fieldLabel.setTextColor(Color.rgb(150, 190, 245));
                  fieldLabel.setTextSize(16);
                  fieldLabel.setTypeface(fieldLabel.getTypeface(), android.graphics.Typeface.BOLD);
                  root.addView(fieldLabel, matchWrap());
          
                  routeEditor = new EditText(this);
                  routeEditor.setHint("1. felrakócím\n2. köztes cím vagy koordináta\n3. lerakócím");
                  routeEditor.setHintTextColor(Color.rgb(125, 133, 145));
                  routeEditor.setTextColor(Color.WHITE);
                  routeEditor.setTextSize(19);
                  routeEditor.setGravity(Gravity.TOP | Gravity.START);
                  routeEditor.setInputType(InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_FLAG_MULTI_LINE |
                          InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
                  routeEditor.setSingleLine(false);
                  routeEditor.setMinLines(7);
                  routeEditor.setPadding(dp(14), dp(14), dp(14), dp(14));
                  routeEditor.setBackgroundColor(Color.rgb(35, 41, 50));
                  LinearLayout.LayoutParams editorParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(250));
                  editorParams.topMargin = dp(8);
                  root.addView(routeEditor, editorParams);
          
                  TextView editorNote = new TextView(this);
                  editorNote.setText("A sorrend felülről lefelé érvényes. Egy cím mindig egy sor legyen.");
                  editorNote.setTextColor(Color.rgb(175, 182, 193));
                  editorNote.setTextSize(15);
                  editorNote.setPadding(0, dp(8), 0, dp(8));
                  root.addView(editorNote, matchWrap());
          
                  Button mapsButton = createPrimaryButton("GOOGLE MAPS – ÚJ PONT");
                  mapsButton.setOnClickListener(v -> openGoogleMaps());
                  root.addView(mapsButton, buttonParams());
          
                  Button finishButton = createPrimaryButton("KÉSZ – ÚTVONAL A TOMTOMBA");
                  finishButton.setBackgroundColor(Color.rgb(0, 145, 75));
                  finishButton.setOnClickListener(v -> sendRouteToService());
                  root.addView(finishButton, buttonParams());
          
                  Button clearButton = createPrimaryButton("LISTA TÖRLÉSE");
                  clearButton.setBackgroundColor(Color.rgb(120, 45, 45));
                  clearButton.setOnClickListener(v -> {
                      routeEditor.setText("");
                      saveEditor();
                  });
                  root.addView(clearButton, buttonParams());
          
                  statusText = new TextView(this);
                  statusText.setTextSize(17);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(dp(12), dp(18), dp(12), dp(10));
                  root.addView(statusText, matchWrap());
          
                  Button settingsButton = createPrimaryButton("EGYSZERI BEÁLLÍTÁS");
                  settingsButton.setBackgroundColor(Color.rgb(70, 80, 95));
                  settingsButton.setOnClickListener(v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  root.addView(settingsButton, buttonParams());
          
                  TextView note = new TextView(this);
                  note.setText(
                          "Fuvarfeladatnál: TT = felrakó és lerakó felismerése.\n" +
                          "Google Mapsnál: + = koordináta, ennek hiányában normál cím hozzáadása.\n" +
                          "A Kész gomb a teljes listát adja át a TomTomnak.");
                  note.setTextColor(Color.rgb(170, 178, 190));
                  note.setTextSize(15);
                  note.setPadding(0, dp(20), 0, 0);
                  root.addView(note, matchWrap());
          
                  setContentView(scroll);
                  handleIncomingShare(getIntent());
              }
          
              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIncomingShare(intent);
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  loadEditor();
                  updateStatus();
              }
          
              @Override
              protected void onPause() {
                  saveEditor();
                  super.onPause();
              }
          
              private Button createPrimaryButton(String text) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(18);
                  button.setTextColor(Color.WHITE);
                  button.setBackgroundColor(Color.rgb(44, 116, 214));
                  button.setMinHeight(dp(68));
                  return button;
              }
          
              private void openGoogleMaps() {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .remove(KEY_PENDING_MAP_QUERY)
                          .remove(KEY_PENDING_MAP_INDEX)
                          .apply();
                  saveEditor();
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(GOOGLE_MAPS_PACKAGE);
                  if (launchIntent == null) {
                      Toast.makeText(this, "A Google Maps nincs telepítve.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(launchIntent);
                  Toast.makeText(this,
                          "Válassz ki egy helyet, majd nyomd meg a lebegő + gombot.",
                          Toast.LENGTH_LONG).show();
              }
          
              private void sendRouteToService() {
                  List<String> points = parseLines(routeEditor.getText().toString());
                  if (points.isEmpty()) {
                      Toast.makeText(this, "Nincs megadva útvonalpont.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  routeEditor.setText(String.join("\n", points));
                  saveEditor();
          
                  Intent command = new Intent(ACTION_START_ROUTE);
                  command.setPackage(getPackageName());
                  sendBroadcast(command);
                  Toast.makeText(this,
                          points.size() + " útvonalpont átadása a TomTomnak…",
                          Toast.LENGTH_LONG).show();
                  moveTaskToBack(true);
              }
          
              private void handleIncomingShare(Intent intent) {
                  if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
                  if (!"text/plain".equals(intent.getType())) return;
                  String shared = intent.getStringExtra(Intent.EXTRA_TEXT);
                  if (shared == null || shared.isBlank()) return;
          
                  String candidate = extractReadableShare(shared);
                  if (candidate.isBlank()) return;
          
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  List<String> points = parseLines(preferences.getString(KEY_ROUTE_POINTS, ""));
                  points.add(candidate);
                  points = unique(points);
                  preferences.edit().putString(KEY_ROUTE_POINTS, String.join("\n", points)).apply();
                  if (routeEditor != null) routeEditor.setText(String.join("\n", points));
              }
          
              private String extractReadableShare(String shared) {
                  List<String> readable = new ArrayList<>();
                  for (String line : shared.split("\\r?\\n")) {
                      String clean = line.trim();
                      if (clean.isEmpty()) continue;
                      if (clean.startsWith("http://") || clean.startsWith("https://")) continue;
                      readable.add(clean);
                  }
                  return String.join(", ", readable).replaceAll("\\s+", " ").trim();
              }
          
              private void loadEditor() {
                  String stored = getSharedPreferences(PREFS, MODE_PRIVATE)
                          .getString(KEY_ROUTE_POINTS, "");
                  if (!stored.equals(routeEditor.getText().toString())) {
                      routeEditor.setText(stored);
                      routeEditor.setSelection(routeEditor.length());
                  }
              }
          
              private void saveEditor() {
                  if (routeEditor == null) return;
                  List<String> points = parseLines(routeEditor.getText().toString());
                  String stored = String.join("\n", points);
                  getSharedPreferences(PREFS, MODE_PRIVATE)
                          .edit()
                          .putString(KEY_ROUTE_POINTS, stored)
                          .apply();
              }
          
              private List<String> parseLines(String source) {
                  List<String> result = new ArrayList<>();
                  if (source == null) return result;
                  for (String line : source.split("\\r?\\n")) {
                      String clean = line.replaceFirst("^\\s*\\d{1,3}[.)-]\\s+", "")
                              .replaceAll("\\s+", " ")
                              .trim();
                      if (!clean.isEmpty()) result.add(clean);
                  }
                  return unique(result);
              }
          
              private List<String> unique(List<String> source) {
                  Set<String> values = new LinkedHashSet<>();
                  for (String value : source) {
                      if (value != null && !value.isBlank()) values.add(value.trim());
                  }
                  return new ArrayList<>(values);
              }
          
              private void updateStatus() {
                  boolean enabled = isAccessibilityServiceEnabled();
                  statusText.setText(enabled
                          ? "AKTÍV – a lebegő TT / + gomb használható"
                          : "NINCS BEKAPCSOLVA – egyszeri beállítás szükséges");
                  statusText.setTextColor(enabled
                          ? Color.rgb(85, 210, 120)
                          : Color.rgb(255, 170, 70));
              }
          
              private boolean isAccessibilityServiceEnabled() {
                  ComponentName expected = new ComponentName(this, TomTomAccessibilityService.class);
                  String enabledServices = Settings.Secure.getString(
                          getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (TextUtils.isEmpty(enabledServices)) return false;
          
                  TextUtils.SimpleStringSplitter splitter = new TextUtils.SimpleStringSplitter(':');
                  splitter.setString(enabledServices);
                  while (splitter.hasNext()) {
                      ComponentName enabled = ComponentName.unflattenFromString(splitter.next());
                      if (expected.equals(enabled)) return true;
                  }
                  return false;
              }
          
              private LinearLayout.LayoutParams matchWrap() {
                  return new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
              }
          
              private LinearLayout.LayoutParams buttonParams() {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(68));
                  params.topMargin = dp(12);
                  return params;
              }
          
              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
          EOF

          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java <<'EOF'
