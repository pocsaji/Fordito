name: Build Driver Assist V065

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: driver-assist-v065
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Driver Assist V065 from frozen V061 source
        run: |
          set -euo pipefail
          git show bc9d2deeed47206f60ea3e1e32e9c49efbb6fb5e:.github/workflows/build_V061.yml > /tmp/build_V061.yml
          test -s /tmp/build_V061.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/build_V061.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = None
          for index, line in enumerate(lines):
              if line.strip() == '- name: Create Driver Assist V061 minimal-permission project':
                  for candidate in range(index + 1, min(index + 6, len(lines))):
                      if lines[candidate].strip() == 'run: |':
                          start = candidate + 1
                          break
                  break
          if start is None:
              raise SystemExit('V061 project-generation step not found.')

          block = []
          for line in lines[start:]:
              if line.startswith('      - name:'):
                  break
              block.append(line)
          script = textwrap.dedent('\n'.join(block)).rstrip() + '\n'

          required = {
              'V061': 'V065',
              'versionCode = 61': 'versionCode = 65',
              'versionName = "061"': 'versionName = "065"',
          }
          for old, new in required.items():
              if old not in script:
                  raise SystemExit(f'Missing V061 identifier: {old}')
              script = script.replace(old, new)

          Path('/tmp/create_v065.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/create_v065.sh

