      - name: Verify Driver Assist V065 source and simplified logic
        run: |
          set -euo pipefail
          MAIN='app/src/main/java/hu/pocsaji/driverassist/MainActivity.java'
          SERVICE='app/src/main/java/hu/pocsaji/driverassist/DriverAssistAccessibilityService.java'
          GPX='app/src/main/java/hu/pocsaji/driverassist/TomTomGpxWriter.java'
          MANIFEST='app/src/main/AndroidManifest.xml'
          CONFIG='app/src/main/res/xml/accessibility_service_config.xml'

          STORE='app/src/main/java/hu/pocsaji/driverassist/RouteStateStore.java'

          grep -F 'rootProject.name = "DriverAssistV065"' settings.gradle.kts
          grep -F 'versionCode = 65' app/build.gradle.kts
          grep -F 'versionName = "065"' app/build.gradle.kts
          grep -F 'Driver Assist V065' "$MANIFEST"
          grep -F 'ÚTVONAL FELTÖLTÉSE A TOMTOMBA' "$MAIN"
          grep -F 'KEY_FLOATING_CAPTURE_ENABLED' "$MAIN"
          grep -F 'TextWatcher' "$MAIN"
          grep -F 'Kézi koordináta' "$MAIN"
          grep -F 'KEY_PICKUP_REVISION' "$MAIN"
          grep -F 'KEY_PENDING_TOKEN' "$MAIN"
          grep -F 'isEndpointRequestCurrent' "$MAIN"
          grep -F 'PendingTargetSnapshot' "$MAIN"
          grep -F 'migrateRouteStateV064' "$MAIN"
          grep -F 'KEY_PENDING_TOKEN' "$STORE"
          grep -F 'removeOverlayButton();' "$SERVICE"
          grep -F 'Adj meg legalább egy koordinátás útvonalpontot.' "$MAIN"
          grep -F 'return Math.max(1, Integer.parseInt(raw.trim()));' "$MAIN"
          grep -F 'coordinates.isEmpty()' "$GPX"
          ! grep -F 'waypointLimit = 10' "$MAIN"
          ! grep -F 'totalPointCount <= 10' "$MAIN"
          ! grep -F 'points.size() < 2' "$MAIN"
          ! grep -F 'postDelayed(endpointResolveRunnable' "$MAIN"
          ! grep -F 'startOverlayWatchdog();' "$SERVICE"
          ! grep -F 'getSharedPreferences(PREFS, MODE_PRIVATE).edit().clear()' "$MAIN"
          grep -F 'GOMB ELREJTÉSE' "$MAIN"
          grep -F 'A kisegítő szolgáltatás bekapcsolva maradt.' "$MAIN"
          grep -F 'KEY_TOMTOM_UPLOAD_ACTIVE' "$MAIN"
          grep -F 'https://plan.tomtom.com/hu/route/plan' "$MAIN"
          grep -F 'requestTomTomUpload()' "$SERVICE"
          grep -F 'TT_STAGE_PICK_FILE' "$SERVICE"
          grep -F 'gpx-fájl importálása' "$SERVICE"
          grep -F 'útvonal szinkronizálása' "$SERVICE"
          grep -F 'typeWindowContentChanged' "$CONFIG"
          grep -F 'com.android.chrome' "$MANIFEST"
          grep -F '<type>TT_HARD</type>' "$GPX"
          grep -F '<rtept lat=' "$GPX"
          ! grep -F '<trk>' "$GPX"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          java_files = list(Path('app/src/main/java/hu/pocsaji/driverassist').glob('*.java'))
          assert len(java_files) == 11, java_files
          for path in java_files:
              source = path.read_text(encoding='utf-8')
              assert source.count('{') == source.count('}'), path
              assert '\t' not in source, path
              in_string = False
              escaped = False
              in_char = False
              for index, char in enumerate(source):
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                      elif char == '\n':
                          raise AssertionError(f'unescaped newline in Java string: {path}:{index}')
                  elif in_char:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == "'":
                          in_char = False
                  elif char == '"':
                      in_string = True
                  elif char == "'":
                      in_char = True
              assert not in_string, f'unclosed Java string: {path}'
              assert not in_char, f'unclosed Java char: {path}'
          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          print('DRIVER_ASSIST_V065_SIMPLIFIED_LOGIC_AUDIT_OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test GPX generation
        run: |
          set -euo pipefail
          mkdir -p puretest/hu/pocsaji/driverassist puretest-classes
          cp app/src/main/java/hu/pocsaji/driverassist/CoordinateTools.java puretest/hu/pocsaji/driverassist/
          cp app/src/main/java/hu/pocsaji/driverassist/TomTomGpxWriter.java puretest/hu/pocsaji/driverassist/
          cat > puretest/hu/pocsaji/driverassist/V065LogicTest.java <<'EOF_LOGIC_TEST'
          package hu.pocsaji.driverassist;
          import java.util.Arrays;
          public final class V065LogicTest {
              public static void main(String[] args) {
                  String gpx = TomTomGpxWriter.build(
                          "Driver Assist V065",
                          "Teszt útvonal",
                          Arrays.asList(
                                  "47.881111 6.383921",
                                  "47.916832 5.997116",
                                  "47.683506 6.517227"));
                  if (!gpx.contains("<name>Teszt útvonal</name>") ||
                          count(gpx, "<rtept lat=") != 3 ||
                          count(gpx, "<type>TT_HARD</type>") != 3 ||
                          gpx.contains("<trk>")) {
                      throw new AssertionError("A TomTom GPX felépítése hibás.");
                  }
                  String onePoint = TomTomGpxWriter.build(
                          "Driver Assist V065",
                          "Egy pont",
                          Arrays.asList("47.881111 6.383921"));
                  if (count(onePoint, "<rtept lat=") != 1) {
                      throw new AssertionError("Az egypontos GPX-et a program indokolatlanul letiltotta.");
                  }
                  System.out.println("DRIVER_ASSIST_V065_LOGIC_TEST_OK");
              }

              private static int count(String value, String token) {
                  int count = 0;
                  int index = 0;
                  while ((index = value.indexOf(token, index)) >= 0) {
                      count++;
                      index += token.length();
                  }
                  return count;
              }
          }
          EOF_LOGIC_TEST
          javac -encoding UTF-8 -d puretest-classes $(find puretest -name '*.java')
          java -cp puretest-classes hu.pocsaji.driverassist.V065LogicTest

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF_KEYSTORE
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF_KEYSTORE

      - name: Build signed Driver Assist V065 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect Driver Assist V065 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V065.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V065.aab
          ls -lah artifact

      - name: Upload Driver Assist V065
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V065
          path: |
            artifact/Driver_Assist_V065.apk
            artifact/Driver_Assist_V065.aab
          if-no-files-found: error
