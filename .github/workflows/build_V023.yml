name: Build TomTom Kiszolgalo V023

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create TomTom Kiszolgalo V023 one-tap project
        run: |
          mkdir -p app/src/main/java/hu/pocsaji/tomtomkiszolgalo
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TomTomKiszolgaloV023"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties
          
          plugins {
              id("com.android.application")
          }
          
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }
          
          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          
          android {
              namespace = "hu.pocsaji.tomtomkiszolgalo"
              compileSdk = 36
          
              defaultConfig {
                  applicationId = "hu.pocsaji.tomtomkiszolgalo"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 23
                  versionName = "023"
              }
          
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2C74D6</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">TomTom Kiszolgáló V023</string>
              <string name="accessibility_service_description">Felrakó és lerakó teljes címének beolvasása, kötelező Google Maps koordináta-ellenőrzés, köztes pontok kezelése és az útvonal megnyitása a Plan.TomTom.com oldalon.</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_map.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#17365F"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,29L43,21L65,29L84,21L84,78L65,86L43,78L24,86ZM43,29L31,34L31,75L43,70ZM50,30L50,70L62,76L62,36ZM69,35L69,76L77,73L77,32Z" />
              <path
                  android:fillColor="#E53935"
                  android:pathData="M63,22C52,22 44,30 44,41C44,55 63,74 63,74C63,74 82,55 82,41C82,30 74,22 63,22ZM63,48A7,7 0,1 1,63 34A7,7 0,1 1,63 48Z" />
          </vector>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <package android:name="com.tomtom.gplay.navapp" />
                  <package android:name="com.google.android.apps.maps" />
                  <package android:name="com.android.chrome" />
                  <package android:name="com.sec.android.app.sbrowser" />
              </queries>
          
              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="TomTom Kiszolgáló V023"
                  android:icon="@drawable/ic_launcher_map"
                  android:roundIcon="@drawable/ic_launcher_map"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".PlanTomTomActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize" />
          
                  <service
                      android:name=".TomTomAccessibilityService"
                      android:exported="false"
                      android:label="TomTom Kiszolgáló V023"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class MainActivity extends Activity {
              private static final String VERSION = "V023";
              private static final String GOOGLE_MAPS_PACKAGE = "com.google.android.apps.maps";

              static final String PREFS = "route_editor_v023";
              static final String KEY_PICKUP = "pickup";
              static final String KEY_DELIVERY = "delivery";
              static final String KEY_WAYPOINTS = "waypoints";
              static final String KEY_PENDING_TARGET = "pending_target";
              static final String KEY_PENDING_INDEX = "pending_index";

              static final String TARGET_PICKUP = "pickup";
              static final String TARGET_DELIVERY = "delivery";
              static final String TARGET_WAYPOINT = "waypoint";

              private static final Pattern COORDINATE_PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");

              private EditText pickupEditor;
              private EditText deliveryEditor;
              private EditText waypointEditor;
              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(16, 19, 24));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(28));
                  scroll.addView(root, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView title = new TextView(this);
                  title.setText("TomTom Kiszolgáló " + VERSION);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(27);
                  title.setTypeface(title.getTypeface(), android.graphics.Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, matchWrap());

                  TextView description = new TextView(this);
                  description.setText(
                          "Új, sorrendhelyes működés:\n" +
                          "1. A lebegő TT gomb beolvassa a felrakót és a lerakót.\n" +
                          "2. Ha valamelyik nem koordináta, a program a TELJES címet és cégnevet " +
                          "megnyitja a Google Maps keresőjében.\n" +
                          "3. A pontos találatnál a lebegő + gomb kizárólag a koordinátát menti vissza.\n" +
                          "4. Köztes pont csak a két végpont ellenőrzése után adható hozzá.\n" +
                          "5. A TomTom csak ellenőrzött koordinátákat kap.");
                  description.setTextColor(Color.rgb(220, 225, 232));
                  description.setTextSize(17);
                  description.setLineSpacing(0f, 1.1f);
                  description.setPadding(0, dp(18), 0, dp(18));
                  root.addView(description, matchWrap());

                  root.addView(createLabel("FELRAKÓ"), matchWrap());
                  pickupEditor = createPointEditor(
                          "A fuvarfeladatból beolvasott teljes felrakócím vagy koordináta");
                  root.addView(pickupEditor, editorParams());

                  root.addView(createLabel("LERAKÓ"), matchWrap());
                  deliveryEditor = createPointEditor(
                          "A fuvarfeladatból beolvasott teljes lerakócím vagy koordináta");
                  root.addView(deliveryEditor, editorParams());

                  TextView waypointLabel = createLabel("KÖZTES PONTOK – csak koordináta, soronként egy");
                  root.addView(waypointLabel, matchWrap());

                  waypointEditor = new EditText(this);
                  waypointEditor.setHint("Példa:\n48.123456 7.654321");
                  waypointEditor.setHintTextColor(Color.rgb(125, 133, 145));
                  waypointEditor.setTextColor(Color.WHITE);
                  waypointEditor.setTextSize(18);
                  waypointEditor.setGravity(Gravity.TOP | Gravity.START);
                  waypointEditor.setInputType(InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_FLAG_MULTI_LINE);
                  waypointEditor.setSingleLine(false);
                  waypointEditor.setMinLines(4);
                  waypointEditor.setPadding(dp(14), dp(14), dp(14), dp(14));
                  waypointEditor.setBackgroundColor(Color.rgb(35, 41, 50));
                  LinearLayout.LayoutParams waypointParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(180));
                  waypointParams.bottomMargin = dp(14);
                  root.addView(waypointEditor, waypointParams);

                  Button resolveButton = createButton("CÍMEK ELLENŐRZÉSE / FOLYTATÁS",
                          Color.rgb(44, 116, 214));
                  resolveButton.setOnClickListener(v -> resolveNextUnverifiedPoint());
                  root.addView(resolveButton, buttonParams());

                  Button waypointButton = createButton("GOOGLE MAPS – KÖZTES PONT",
                          Color.rgb(44, 116, 214));
                  waypointButton.setOnClickListener(v -> openNewWaypoint());
                  root.addView(waypointButton, buttonParams());

                  Button finishButton = createButton("KÉSZ – ÚTVONAL MEGNYITÁSA",
                          Color.rgb(0, 145, 75));
                  finishButton.setOnClickListener(v -> openVerifiedRoute());
                  root.addView(finishButton, buttonParams());

                  Button clearButton = createButton("MINDEN TÖRLÉSE",
                          Color.rgb(120, 45, 45));
                  clearButton.setOnClickListener(v -> clearAll());
                  root.addView(clearButton, buttonParams());

                  statusText = new TextView(this);
                  statusText.setTextSize(17);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(dp(12), dp(18), dp(12), dp(10));
                  root.addView(statusText, matchWrap());

                  Button settingsButton = createButton("EGYSZERI BEÁLLÍTÁS",
                          Color.rgb(70, 80, 95));
                  settingsButton.setOnClickListener(v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  root.addView(settingsButton, buttonParams());

                  setContentView(scroll);
              }

              private EditText createPointEditor(String hint) {
                  EditText editor = new EditText(this);
                  editor.setHint(hint);
                  editor.setHintTextColor(Color.rgb(125, 133, 145));
                  editor.setTextColor(Color.WHITE);
                  editor.setTextSize(18);
                  editor.setGravity(Gravity.TOP | Gravity.START);
                  editor.setInputType(InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_FLAG_MULTI_LINE |
                          InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
                  editor.setSingleLine(false);
                  editor.setMinLines(3);
                  editor.setPadding(dp(14), dp(14), dp(14), dp(14));
                  editor.setBackgroundColor(Color.rgb(35, 41, 50));
                  return editor;
              }

              private LinearLayout.LayoutParams editorParams() {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  params.bottomMargin = dp(14);
                  return params;
              }

              private TextView createLabel(String text) {
                  TextView label = new TextView(this);
                  label.setText(text);
                  label.setTextColor(Color.rgb(150, 190, 245));
                  label.setTextSize(16);
                  label.setTypeface(label.getTypeface(), android.graphics.Typeface.BOLD);
                  label.setPadding(0, dp(6), 0, dp(7));
                  return label;
              }

              private Button createButton(String text, int color) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(18);
                  button.setTextColor(Color.WHITE);
                  button.setBackgroundColor(color);
                  button.setMinHeight(dp(68));
                  return button;
              }

              private LinearLayout.LayoutParams buttonParams() {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  params.topMargin = dp(6);
                  params.bottomMargin = dp(6);
                  return params;
              }

              private LinearLayout.LayoutParams matchWrap() {
                  return new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  loadState();
                  updateStatus();
              }

              @Override
              protected void onPause() {
                  saveState();
                  super.onPause();
              }

              private void loadState() {
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  setEditorText(pickupEditor, preferences.getString(KEY_PICKUP, ""));
                  setEditorText(deliveryEditor, preferences.getString(KEY_DELIVERY, ""));
                  setEditorText(waypointEditor, preferences.getString(KEY_WAYPOINTS, ""));
              }

              private void setEditorText(EditText editor, String value) {
                  String safe = value == null ? "" : value;
                  if (!safe.equals(editor.getText().toString())) {
                      editor.setText(safe);
                      editor.setSelection(editor.length());
                  }
              }

              private void saveState() {
                  if (pickupEditor == null) return;
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putString(KEY_PICKUP, cleanQuery(pickupEditor.getText().toString()))
                          .putString(KEY_DELIVERY, cleanQuery(deliveryEditor.getText().toString()))
                          .putString(KEY_WAYPOINTS,
                                  String.join("\n", parseWaypointLines(
                                          waypointEditor.getText().toString(), false)))
                          .apply();
              }

              private void resolveNextUnverifiedPoint() {
                  saveState();

                  String pickup = cleanQuery(pickupEditor.getText().toString());
                  String delivery = cleanQuery(deliveryEditor.getText().toString());

                  if (pickup.isEmpty()) {
                      Toast.makeText(this, "A felrakó üres.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (!isCoordinate(pickup)) {
                      openMapsForResolution(TARGET_PICKUP, -1, pickup);
                      return;
                  }

                  if (delivery.isEmpty()) {
                      Toast.makeText(this, "A lerakó üres.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (!isCoordinate(delivery)) {
                      openMapsForResolution(TARGET_DELIVERY, -1, delivery);
                      return;
                  }

                  Toast.makeText(this,
                          "A felrakó és a lerakó ellenőrzött koordináta. " +
                          "Most adhatsz hozzá köztes pontot vagy megnyithatod az útvonalat.",
                          Toast.LENGTH_LONG).show();
                  updateStatus();
              }

              private void openNewWaypoint() {
                  saveState();
                  if (!endpointsVerified()) {
                      Toast.makeText(this,
                              "Előbb ellenőrizd a felrakót és a lerakót.",
                              Toast.LENGTH_LONG).show();
                      resolveNextUnverifiedPoint();
                      return;
                  }

                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putString(KEY_PENDING_TARGET, TARGET_WAYPOINT)
                          .putInt(KEY_PENDING_INDEX, -1)
                          .apply();

                  Intent launchIntent =
                          getPackageManager().getLaunchIntentForPackage(GOOGLE_MAPS_PACKAGE);
                  if (launchIntent == null) {
                      Toast.makeText(this, "A Google Maps nincs telepítve.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(launchIntent);
                  Toast.makeText(this,
                          "Válaszd ki a köztes helyet, majd nyomd meg a lebegő + gombot.",
                          Toast.LENGTH_LONG).show();
              }

              private void openVerifiedRoute() {
                  saveState();

                  String pickup = normalizeCoordinate(
                          cleanQuery(pickupEditor.getText().toString()));
                  if (pickup == null) {
                      resolveNextUnverifiedPoint();
                      return;
                  }

                  String delivery = normalizeCoordinate(
                          cleanQuery(deliveryEditor.getText().toString()));
                  if (delivery == null) {
                      resolveNextUnverifiedPoint();
                      return;
                  }

                  List<String> waypoints =
                          parseWaypointLines(waypointEditor.getText().toString(), true);
                  if (waypoints == null) return;

                  ArrayList<String> ordered = new ArrayList<>();
                  ordered.add(pickup);
                  ordered.addAll(waypoints);
                  ordered.add(delivery);

                  Intent intent = new Intent(this, PlanTomTomActivity.class);
                  intent.putStringArrayListExtra(
                          PlanTomTomActivity.EXTRA_ROUTE_POINTS, ordered);
                  startActivity(intent);
              }

              private List<String> parseWaypointLines(String source, boolean showErrors) {
                  ArrayList<String> result = new ArrayList<>();
                  if (source == null || source.isBlank()) return result;

                  String[] lines = source.split("\\r?\\n");
                  for (int index = 0; index < lines.length; index++) {
                      String clean = cleanQuery(lines[index]);
                      if (clean.isEmpty()) continue;

                      String coordinate = normalizeCoordinate(clean);
                      if (coordinate == null) {
                          if (showErrors) {
                              openMapsForResolution(
                                      TARGET_WAYPOINT, result.size(), clean);
                              Toast.makeText(this,
                                      "A " + (index + 1) +
                                      ". köztes pont nem koordináta. " +
                                      "A teljes szöveget megnyitottam a Google Mapsban.",
                                      Toast.LENGTH_LONG).show();
                              return null;
                          }
                          result.add(clean);
                      } else {
                          result.add(coordinate);
                      }
                  }
                  return result;
              }

              private void openMapsForResolution(
                      String target,
                      int index,
                      String fullQuery) {
                  String query = cleanQuery(fullQuery);
                  if (query.isEmpty()) return;

                  saveState();
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putString(KEY_PENDING_TARGET, target)
                          .putInt(KEY_PENDING_INDEX, index)
                          .apply();

                  Intent intent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0?q=" + Uri.encode(query)));
                  intent.setPackage(GOOGLE_MAPS_PACKAGE);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);

                  try {
                      startActivity(intent);
                      Toast.makeText(this,
                              "A teljes cím került a Google Maps keresőjébe:\n" +
                              query +
                              "\nVálaszd ki a pontos helyet, majd nyomd meg a lebegő + gombot.",
                              Toast.LENGTH_LONG).show();
                  } catch (ActivityNotFoundException | SecurityException error) {
                      Toast.makeText(this,
                              "A Google Maps nem nyitható meg.",
                              Toast.LENGTH_LONG).show();
                  }
              }

              private boolean endpointsVerified() {
                  return normalizeCoordinate(
                          cleanQuery(pickupEditor.getText().toString())) != null &&
                          normalizeCoordinate(
                                  cleanQuery(deliveryEditor.getText().toString())) != null;
              }

              private boolean isCoordinate(String value) {
                  return normalizeCoordinate(value) != null;
              }

              private String normalizeCoordinate(String value) {
                  if (value == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(value);
                  if (!matcher.matches()) return null;
                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (latitude < -90.0 || latitude > 90.0 ||
                              longitude < -180.0 || longitude > 180.0) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }

              private String plain(double value) {
                  return BigDecimal.valueOf(value)
                          .setScale(6, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }

              private String cleanQuery(String value) {
                  if (value == null) return "";
                  return value.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();
              }

              private void clearAll() {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit().clear().apply();
                  pickupEditor.setText("");
                  deliveryEditor.setText("");
                  waypointEditor.setText("");
                  updateStatus();
              }

              private void updateStatus() {
                  boolean enabled = isAccessibilityServiceEnabled();
                  String pickupState = normalizeCoordinate(
                          cleanQuery(pickupEditor.getText().toString())) != null
                          ? "FELRAKÓ: koordináta kész"
                          : "FELRAKÓ: cím ellenőrzendő";
                  String deliveryState = normalizeCoordinate(
                          cleanQuery(deliveryEditor.getText().toString())) != null
                          ? "LERAKÓ: koordináta kész"
                          : "LERAKÓ: cím ellenőrzendő";

                  statusText.setText(
                          (enabled
                                  ? "AKTÍV – a lebegő TT / + gomb használható"
                                  : "INAKTÍV – engedélyezd az akadálymentesítési szolgáltatást") +
                          "\n" + pickupState + "\n" + deliveryState);
                  statusText.setTextColor(enabled
                          ? Color.rgb(75, 210, 115)
                          : Color.rgb(235, 105, 95));
              }

              private boolean isAccessibilityServiceEnabled() {
                  String expected = new ComponentName(
                          this, TomTomAccessibilityService.class).flattenToString();
                  String enabled = Settings.Secure.getString(
                          getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (enabled == null) return false;

                  TextUtils.SimpleStringSplitter splitter =
                          new TextUtils.SimpleStringSplitter(':');
                  splitter.setString(enabled);
                  while (splitter.hasNext()) {
                      if (expected.equalsIgnoreCase(splitter.next())) return true;
                  }
                  return false;
              }

