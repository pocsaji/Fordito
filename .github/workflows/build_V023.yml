          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class PlanTomTomActivity extends Activity {
              public static final String EXTRA_ROUTE_POINTS =
                      "hu.pocsaji.tomtomkiszolgalo.extra.ROUTE_POINTS";

              private static final String VERSION = "V023";
              private static final int MAX_ROUTE_POINTS = 30;
              private static final Pattern COORDINATE_PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");

              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showProgress();

                  ArrayList<String> incoming =
                          getIntent().getStringArrayListExtra(EXTRA_ROUTE_POINTS);
                  if (incoming == null || incoming.size() < 2) {
                      fail("Az útvonalhoz legalább felrakó és lerakó szükséges.");
                      return;
                  }

                  openRoute(incoming);
              }

              private void showProgress() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(dp(28), dp(28), dp(28), dp(28));
                  root.setBackgroundColor(Color.rgb(16, 19, 24));

                  ProgressBar progress = new ProgressBar(this);
                  root.addView(progress, new LinearLayout.LayoutParams(
                          dp(64), dp(64)));

                  statusText = new TextView(this);
                  statusText.setText("Ellenőrzött koordináták átadása a Plan.TomTom oldalnak…");
                  statusText.setTextColor(Color.WHITE);
                  statusText.setTextSize(19);
                  statusText.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams statusParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  statusParams.topMargin = dp(22);
                  root.addView(statusText, statusParams);

                  setContentView(root);
              }

              private void openRoute(List<String> incoming) {
                  ArrayList<Coordinate> coordinates = new ArrayList<>();

                  for (String raw : incoming) {
                      Coordinate coordinate = parseCoordinate(raw);
                      if (coordinate == null) {
                          fail("Hibás pont maradt az útvonalban:\n" + raw);
                          return;
                      }
                      if (coordinates.isEmpty() ||
                              !coordinates.get(coordinates.size() - 1).sameAs(coordinate)) {
                          coordinates.add(coordinate);
                      }
                  }

                  if (coordinates.size() < 2) {
                      fail("Legalább két különböző koordináta szükséges.");
                      return;
                  }

                  if (coordinates.size() > MAX_ROUTE_POINTS) {
                      coordinates = new ArrayList<>(
                              coordinates.subList(0, MAX_ROUTE_POINTS));
                  }

                  Uri routeUri = buildRouteUri(coordinates);
                  int count = coordinates.size();

                  if (openInBrowser(routeUri)) {
                      Toast.makeText(this,
                              count + " koordinátapontos teherautós útvonal megnyitva.",
                              Toast.LENGTH_LONG).show();
                  }
                  finish();
              }

              private Coordinate parseCoordinate(String raw) {
                  if (raw == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(raw);
                  if (!matcher.matches()) return null;

                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (latitude < -90.0 || latitude > 90.0 ||
                              longitude < -180.0 || longitude > 180.0) {
                          return null;
                      }
                      return new Coordinate(latitude, longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }

              private Uri buildRouteUri(List<Coordinate> coordinates) {
                  StringBuilder sorted = new StringBuilder();
                  double latitudeSum = 0.0;
                  double longitudeSum = 0.0;

                  for (int index = 0; index < coordinates.size(); index++) {
                      Coordinate coordinate = coordinates.get(index);
                      if (index > 0) sorted.append(',');

                      sorted.append('h')
                              .append(encodeSignedNumber(coordinate.latitude))
                              .append("~J")
                              .append(encodeSignedNumber(coordinate.longitude))
                              .append("~Vaddr~J")
                              .append(index == 0
                                      ? "Felrako"
                                      : (index == coordinates.size() - 1
                                              ? "Lerako"
                                              : "Koztes_" + index));

                      latitudeSum += coordinate.latitude;
                      longitudeSum += coordinate.longitude;
                  }

                  String routeState =
                          "(costModel:FASTEST," +
                          "routingProvider:GLOBAL," +
                          "sorted:(" + sorted + ")," +
                          "travelMode:TRUCK," +
                          "vehicleParameters:(" +
                          "axleWeight:-+," +
                          "height:-+," +
                          "length:-+," +
                          "maxSpeed:-+," +
                          "vehicleModelId:-+," +
                          "weight:-+," +
                          "width:-+))";

                  String mapPosition =
                          plain(latitudeSum / coordinates.size()) + "," +
                          plain(longitudeSum / coordinates.size()) + ",6.5z";

                  return new Uri.Builder()
                          .scheme("https")
                          .authority("plan.tomtom.com")
                          .appendPath("hu")
                          .appendPath("route")
                          .appendPath("plan")
                          .appendQueryParameter("p", mapPosition)
                          .appendQueryParameter("r", routeState)
                          .build();
              }

              private String encodeSignedNumber(double value) {
                  return (value < 0.0 ? "~F" : "~V") +
                          plain(Math.abs(value));
              }

              private String plain(double value) {
                  return BigDecimal.valueOf(value)
                          .setScale(6, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }

              private boolean openInBrowser(Uri routeUri) {
                  Intent base = new Intent(Intent.ACTION_VIEW, routeUri);
                  base.addCategory(Intent.CATEGORY_BROWSABLE);
                  base.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                  String[] preferred = {
                          "com.android.chrome",
                          "com.sec.android.app.sbrowser"
                  };

                  for (String packageName : preferred) {
                      Intent intent = new Intent(base);
                      intent.setPackage(packageName);
                      try {
                          startActivity(intent);
                          return true;
                      } catch (ActivityNotFoundException | SecurityException ignored) {
                      }
                  }

                  try {
                      startActivity(base);
                      return true;
                  } catch (ActivityNotFoundException error) {
                      fail("Nem található használható böngésző.");
                      return false;
                  }
              }

              private void fail(String message) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
                  finish();
              }

              private int dp(int value) {
                  return Math.round(value *
                          getResources().getDisplayMetrics().density);
              }

              private static final class Coordinate {
                  final double latitude;
                  final double longitude;

                  Coordinate(double latitude, double longitude) {
                      this.latitude = latitude;
                      this.longitude = longitude;
                  }

                  boolean sameAs(Coordinate other) {
                      return other != null &&
                              Math.abs(latitude - other.latitude) < 0.0000001 &&
                              Math.abs(longitude - other.longitude) < 0.0000001;
                  }
              }
          }
