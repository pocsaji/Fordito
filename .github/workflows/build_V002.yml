name: Build TomTom Kiszolgalo V002

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create TomTom Kiszolgalo V002 diagnostic project
        run: |
          mkdir -p app/src/main/java/hu/pocsaji/tomtomkiszolgalo
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TomTomKiszolgaloV002"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins {
              id("com.android.application")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          android {
              namespace = "hu.pocsaji.tomtomkiszolgalo"
              compileSdk = 36

              defaultConfig {
                  applicationId = "hu.pocsaji.tomtomkiszolgalo"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 2
                  versionName = "002"
              }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2C74D6</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_map.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#17365F"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,29L43,21L65,29L84,21L84,78L65,86L43,78L24,86ZM43,29L31,34L31,75L43,70ZM50,30L50,70L62,76L62,36ZM69,35L69,76L77,73L77,32Z" />
              <path
                  android:fillColor="#E53935"
                  android:pathData="M63,22C52,22 44,30 44,41C44,55 63,74 63,74C63,74 82,55 82,41C82,30 74,22 63,22ZM63,48A7,7 0,1 1,63 34A7,7 0,1 1,63 48Z" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="TomTom Kiszolgáló V002"
                  android:icon="@drawable/ic_launcher_map"
                  android:roundIcon="@drawable/ic_launcher_map"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.ConsoleMessage;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public final class MainActivity extends Activity {
              private static final String VERSION = "V002";
              private static final String START_URL = "https://plan.tomtom.com/hu/route";
              private static final int MAX_LOG_CHARS = 250000;

              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final StringBuilder logBuffer = new StringBuilder();
              private final SimpleDateFormat timeFormat =
                      new SimpleDateFormat("HH:mm:ss.SSS", Locale.ROOT);

              private WebView webView;
              private LinearLayout logPanel;
              private ScrollView logScroll;
              private TextView logText;
              private Button logToggleButton;

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(16, 19, 24));

                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  LinearLayout toolbar = createToolbar();
                  FrameLayout.LayoutParams toolbarParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(52),
                          Gravity.TOP);
                  root.addView(toolbar, toolbarParams);

                  logPanel = createLogPanel();
                  FrameLayout.LayoutParams logParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(290),
                          Gravity.BOTTOM);
                  root.addView(logPanel, logParams);

                  setContentView(root);
                  configureWebView();

                  appendLog("APP", "TomTom Kiszolgáló " + VERSION + " diagnosztika elindult.");
                  appendLog("APP", "Kezdő URL: " + START_URL);
                  appendLog("APP", "User-Agent: " + webView.getSettings().getUserAgentString());

                  webView.loadUrl(START_URL);
              }

              private LinearLayout createToolbar() {
                  LinearLayout toolbar = new LinearLayout(this);
                  toolbar.setOrientation(LinearLayout.HORIZONTAL);
                  toolbar.setGravity(Gravity.CENTER_VERTICAL);
                  toolbar.setPadding(dp(6), dp(4), dp(6), dp(4));
                  toolbar.setBackgroundColor(Color.argb(232, 16, 19, 24));
                  toolbar.setElevation(dp(6));

                  TextView title = new TextView(this);
                  title.setText("TomTom " + VERSION);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(16);
                  title.setTypeface(title.getTypeface(), android.graphics.Typeface.BOLD);
                  title.setPadding(dp(8), 0, dp(6), 0);
                  toolbar.addView(title, new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f));

                  Button snapshotButton = smallButton("DOM");
                  snapshotButton.setOnClickListener(v -> requestDomSnapshot());
                  toolbar.addView(snapshotButton);

                  Button reloadButton = smallButton("FRISSÍT");
                  reloadButton.setOnClickListener(v -> {
                      appendLog("APP", "Kézi oldalfrissítés.");
                      webView.reload();
                  });
                  toolbar.addView(reloadButton);

                  logToggleButton = smallButton("NAPLÓ ▼");
                  logToggleButton.setOnClickListener(v -> toggleLogPanel());
                  toolbar.addView(logToggleButton);

                  return toolbar;
              }

              private LinearLayout createLogPanel() {
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setBackgroundColor(Color.argb(245, 21, 25, 32));
                  panel.setPadding(dp(8), dp(6), dp(8), dp(8));
                  panel.setElevation(dp(10));

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  TextView label = new TextView(this);
                  label.setText("DIAGNOSZTIKAI NAPLÓ");
                  label.setTextColor(Color.WHITE);
                  label.setTextSize(14);
                  label.setTypeface(label.getTypeface(), android.graphics.Typeface.BOLD);
                  header.addView(label, new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f));

                  Button clearButton = smallButton("TÖRLÉS");
                  clearButton.setOnClickListener(v -> clearLog());
                  header.addView(clearButton);

                  Button copyButton = smallButton("MÁSOLÁS");
                  copyButton.setOnClickListener(v -> copyLog());
                  header.addView(copyButton);

                  panel.addView(header, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(42)));

                  logScroll = new ScrollView(this);
                  logScroll.setFillViewport(true);
                  logScroll.setBackgroundColor(Color.rgb(11, 14, 18));

                  logText = new TextView(this);
                  logText.setTextColor(Color.rgb(218, 224, 232));
                  logText.setTextSize(11);
                  logText.setTextIsSelectable(true);
                  logText.setPadding(dp(8), dp(8), dp(8), dp(12));
                  logText.setTypeface(android.graphics.Typeface.MONOSPACE);
                  logScroll.addView(logText, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  panel.addView(logScroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f));

                  return panel;
              }

              private Button smallButton(String text) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(11);
                  button.setTextColor(Color.WHITE);
                  button.setAllCaps(false);
                  button.setMinWidth(0);
                  button.setMinimumWidth(0);
                  button.setMinHeight(0);
                  button.setMinimumHeight(0);
                  button.setPadding(dp(9), dp(5), dp(9), dp(5));
                  button.setBackgroundColor(Color.rgb(44, 116, 214));

                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          dp(36));
                  params.leftMargin = dp(4);
                  button.setLayoutParams(params);
                  return button;
              }

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              private void configureWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(true);
                  settings.setMediaPlaybackRequiresUserGesture(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setBackgroundColor(Color.WHITE);
                  webView.setWebChromeClient(new DiagnosticChromeClient());
                  webView.setWebViewClient(new DiagnosticWebViewClient());
                  webView.addJavascriptInterface(new DiagnosticBridge(), "TomTomDiagnostic");
              }

              private void injectDiagnostics() {
                  webView.evaluateJavascript(DIAGNOSTIC_SCRIPT, result ->
                          appendLog("JS", "Diagnosztikai script eredmény: " + trim(result, 500)));
              }

              private void requestDomSnapshot() {
                  appendLog("APP", "Kézi DOM-pillanatkép kérve.");
                  webView.evaluateJavascript(
                          "(function(){if(window.__ttdiagSnapshot){window.__ttdiagSnapshot('MANUAL');return 'OK';}return 'NINCS_HID';})();",
                          result -> appendLog("JS", "DOM-pillanatkép: " + trim(result, 300)));
              }

              private void toggleLogPanel() {
                  boolean show = logPanel.getVisibility() != View.VISIBLE;
                  logPanel.setVisibility(show ? View.VISIBLE : View.GONE);
                  logToggleButton.setText(show ? "NAPLÓ ▼" : "NAPLÓ ▲");
              }

              private void clearLog() {
                  synchronized (logBuffer) {
                      logBuffer.setLength(0);
                  }
                  logText.setText("");
                  appendLog("APP", "A napló törölve.");
              }

              private void copyLog() {
                  String value;
                  synchronized (logBuffer) {
                      value = logBuffer.toString();
                  }

                  ClipboardManager clipboard =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  clipboard.setPrimaryClip(ClipData.newPlainText(
                          "TomTom Kiszolgáló " + VERSION + " diagnosztikai napló",
                          value));
                  Toast.makeText(this, "A diagnosztikai napló a vágólapra került.",
                          Toast.LENGTH_LONG).show();
              }

              private void appendLog(String category, String message) {
                  if (Looper.myLooper() != Looper.getMainLooper()) {
                      mainHandler.post(() -> appendLog(category, message));
                      return;
                  }

                  String safeMessage = message == null ? "null" : trim(message, 7000);
                  String line = timeFormat.format(new Date()) +
                          " [" + category + "] " +
                          safeMessage.replace('\r', ' ') +
                          "\n";

                  synchronized (logBuffer) {
                      logBuffer.append(line);
                      if (logBuffer.length() > MAX_LOG_CHARS) {
                          int removeTarget = logBuffer.length() - MAX_LOG_CHARS;
                          int newline = logBuffer.indexOf("\n", removeTarget);
                          logBuffer.delete(0, newline >= 0 ? newline + 1 : removeTarget);
                      }
                      logText.setText(logBuffer.toString());
                  }

                  logScroll.post(() -> logScroll.fullScroll(View.FOCUS_DOWN));
              }

              private String trim(String value, int maxLength) {
                  if (value == null) return "";
                  if (value.length() <= maxLength) return value;
                  return value.substring(0, maxLength) + "…";
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      appendLog("NAV", "Visszalépés a WebView előzményeiben.");
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  CookieManager.getInstance().flush();
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  CookieManager.getInstance().flush();
                  if (webView != null) {
                      webView.removeJavascriptInterface("TomTomDiagnostic");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }

              private final class DiagnosticBridge {
                  @JavascriptInterface
                  public void log(String message) {
                      appendLog("DOM", message);
                  }
              }

              private final class DiagnosticChromeClient extends WebChromeClient {
                  @Override
                  public boolean onConsoleMessage(ConsoleMessage consoleMessage) {
                      appendLog(
                              "CONSOLE",
                              consoleMessage.messageLevel() +
                                      " " + consoleMessage.sourceId() +
                                      ":" + consoleMessage.lineNumber() +
                                      " — " + consoleMessage.message());
                      return true;
                  }
              }

              private final class DiagnosticWebViewClient extends WebViewClient {
                  @Override
                  public void onPageStarted(WebView view, String url,
                                            android.graphics.Bitmap favicon) {
                      appendLog("NAV", "Oldal betöltése elkezdődött: " + url);
                  }

                  @Override
                  public void onPageFinished(WebView view, String url) {
                      appendLog("NAV", "Oldal betöltve: " + url);
                      CookieManager.getInstance().flush();
                      mainHandler.postDelayed(MainActivity.this::injectDiagnostics, 350);
                  }

                  @Override
                  public void doUpdateVisitedHistory(WebView view, String url,
                                                     boolean isReload) {
                      appendLog("NAV", "Előzmény/frissítés: " + url +
                              " reload=" + isReload);
                  }

                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view,
                                                          WebResourceRequest request) {
                      Uri uri = request.getUrl();
                      String scheme = uri.getScheme();
                      appendLog("NAV", "Navigációs kérés: " + uri +
                              " mainFrame=" + request.isForMainFrame());

                      if ("http".equalsIgnoreCase(scheme) ||
                              "https".equalsIgnoreCase(scheme)) {
                          return false;
                      }

                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                      } catch (ActivityNotFoundException error) {
                          appendLog("ERROR", "Nincs kezelő alkalmazás ehhez: " + uri);
                      }
                      return true;
                  }

                  @Override
                  public void onReceivedError(WebView view,
                                              WebResourceRequest request,
                                              WebResourceError error) {
                      appendLog(
                              "ERROR",
                              "WebView hiba code=" + error.getErrorCode() +
                                      " url=" + request.getUrl() +
                                      " leírás=" + error.getDescription());
                  }
              }

              private static final String DIAGNOSTIC_SCRIPT = """
                  (function () {
                    'use strict';

                    const BRIDGE = window.TomTomDiagnostic;
                    const MAX_TEXT = 120;
                    const MAX_INVENTORY = 300;

                    function clip(value, max) {
                      const text = String(value == null ? '' : value);
                      return text.length <= max ? text : text.slice(0, max) + '…';
                    }

                    function emit(type, data) {
                      try {
                        if (BRIDGE && typeof BRIDGE.log === 'function') {
                          BRIDGE.log(JSON.stringify({
                            time: new Date().toISOString(),
                            type: type,
                            url: location.href,
                            data: data || {}
                          }));
                        }
                      } catch (error) {
                        try {
                          console.error('TomTomDiagnostic bridge error', error);
                        } catch (_) {}
                      }
                    }

                    function attr(element, name) {
                      try {
                        return element && element.getAttribute
                          ? clip(element.getAttribute(name) || '', MAX_TEXT)
                          : '';
                      } catch (_) {
                        return '';
                      }
                    }

                    function describe(element) {
                      if (!element || element.nodeType !== 1) {
                        return { node: element ? element.nodeName : 'null' };
                      }

                      const tag = (element.tagName || '').toLowerCase();
                      const inputLike =
                        tag === 'input' || tag === 'textarea' || tag === 'select';

                      let text = '';
                      if (!inputLike) {
                        text = clip(
                          (element.innerText || element.textContent || '')
                            .replace(/\\s+/g, ' ')
                            .trim(),
                          MAX_TEXT
                        );
                      }

                      let valueLength = null;
                      if (inputLike && 'value' in element) {
                        try {
                          valueLength = String(element.value || '').length;
                        } catch (_) {}
                      }

                      return {
                        tag: tag,
                        id: clip(element.id || '', MAX_TEXT),
                        class: clip(
                          typeof element.className === 'string'
                            ? element.className
                            : '',
                          MAX_TEXT
                        ),
                        name: attr(element, 'name'),
                        type: attr(element, 'type'),
                        placeholder: attr(element, 'placeholder'),
                        autocomplete: attr(element, 'autocomplete'),
                        role: attr(element, 'role'),
                        ariaLabel: attr(element, 'aria-label'),
                        ariaExpanded: attr(element, 'aria-expanded'),
                        ariaControls: attr(element, 'aria-controls'),
                        href: tag === 'a' ? clip(element.href || '', MAX_TEXT) : '',
                        text: text,
                        valueLength: valueLength
                      };
                    }

                    function eventTarget(event) {
                      const path = typeof event.composedPath === 'function'
                        ? event.composedPath()
                        : [];
                      return path.length ? path[0] : event.target;
                    }

                    function snapshot(reason) {
                      try {
                        const selector =
                          'input,textarea,select,button,a,[role],[aria-label],[contenteditable="true"]';
                        const elements = Array.from(document.querySelectorAll(selector))
                          .slice(0, MAX_INVENTORY)
                          .map(describe);

                        const chunkSize = 30;
                        for (let index = 0; index < elements.length; index += chunkSize) {
                          emit('DOM_INVENTORY', {
                            reason: reason,
                            total: elements.length,
                            offset: index,
                            elements: elements.slice(index, index + chunkSize)
                          });
                        }

                        emit('ACTIVE_ELEMENT', {
                          reason: reason,
                          element: describe(document.activeElement)
                        });
                      } catch (error) {
                        emit('SNAPSHOT_ERROR', {
                          message: clip(error && error.message, 500)
                        });
                      }
                    }

                    window.__ttdiagSnapshot = snapshot;

                    if (window.__ttdiagInstalled) {
                      emit('REINJECT', { message: 'A diagnosztika már aktív.' });
                      snapshot('REINJECT');
                      return 'ALREADY_INSTALLED';
                    }
                    window.__ttdiagInstalled = true;

                    emit('INSTALL', {
                      title: document.title,
                      readyState: document.readyState,
                      userAgent: navigator.userAgent,
                      viewport: {
                        width: window.innerWidth,
                        height: window.innerHeight,
                        devicePixelRatio: window.devicePixelRatio
                      }
                    });

                    document.addEventListener('click', function (event) {
                      emit('CLICK', { element: describe(eventTarget(event)) });
                    }, true);

                    document.addEventListener('touchstart', function (event) {
                      const touch = event.touches && event.touches[0];
                      emit('TOUCH_START', {
                        element: describe(eventTarget(event)),
                        x: touch ? Math.round(touch.clientX) : null,
                        y: touch ? Math.round(touch.clientY) : null,
                        touches: event.touches ? event.touches.length : 0
                      });
                    }, true);

                    document.addEventListener('focusin', function (event) {
                      emit('FOCUS_IN', { element: describe(eventTarget(event)) });
                    }, true);

                    document.addEventListener('focusout', function (event) {
                      emit('FOCUS_OUT', { element: describe(eventTarget(event)) });
                    }, true);

                    document.addEventListener('input', function (event) {
                      emit('INPUT', {
                        element: describe(eventTarget(event)),
                        inputType: clip(event.inputType || '', 80),
                        dataLength: event.data == null ? null : String(event.data).length
                      });
                    }, true);

                    document.addEventListener('change', function (event) {
                      emit('CHANGE', { element: describe(eventTarget(event)) });
                    }, true);

                    document.addEventListener('keydown', function (event) {
                      emit('KEYDOWN', {
                        element: describe(eventTarget(event)),
                        key: event.key && event.key.length === 1 ? 'CHAR' : clip(event.key || '', 40),
                        code: clip(event.code || '', 40),
                        ctrl: !!event.ctrlKey,
                        alt: !!event.altKey,
                        shift: !!event.shiftKey,
                        meta: !!event.metaKey
                      });
                    }, true);

                    document.addEventListener('submit', function (event) {
                      emit('SUBMIT', { element: describe(eventTarget(event)) });
                    }, true);

                    window.addEventListener('error', function (event) {
                      emit('JS_ERROR', {
                        message: clip(event.message || '', 500),
                        source: clip(event.filename || '', 500),
                        line: event.lineno,
                        column: event.colno
                      });
                    }, true);

                    window.addEventListener('unhandledrejection', function (event) {
                      emit('UNHANDLED_REJECTION', {
                        reason: clip(
                          event.reason && (event.reason.stack || event.reason.message || event.reason),
                          1000
                        )
                      });
                    });

                    const nativeFetch = window.fetch;
                    if (typeof nativeFetch === 'function') {
                      window.fetch = function () {
                        const args = arguments;
                        let url = '';
                        let method = 'GET';

                        try {
                          const request = args[0];
                          url = typeof request === 'string'
                            ? request
                            : request && request.url
                              ? request.url
                              : '';
                          method =
                            (args[1] && args[1].method) ||
                            (request && request.method) ||
                            'GET';
                        } catch (_) {}

                        emit('FETCH_START', {
                          method: clip(method, 20),
                          url: clip(url, 1000)
                        });

                        return nativeFetch.apply(this, args).then(function (response) {
                          emit('FETCH_END', {
                            method: clip(method, 20),
                            url: clip(url, 1000),
                            status: response.status,
                            ok: response.ok,
                            redirected: response.redirected,
                            responseUrl: clip(response.url || '', 1000)
                          });
                          return response;
                        }).catch(function (error) {
                          emit('FETCH_ERROR', {
                            method: clip(method, 20),
                            url: clip(url, 1000),
                            message: clip(error && error.message, 500)
                          });
                          throw error;
                        });
                      };
                    }

                    const xhrOpen = XMLHttpRequest.prototype.open;
                    const xhrSend = XMLHttpRequest.prototype.send;

                    XMLHttpRequest.prototype.open = function (method, url) {
                      this.__ttdiagMethod = method;
                      this.__ttdiagUrl = url;
                      return xhrOpen.apply(this, arguments);
                    };

                    XMLHttpRequest.prototype.send = function () {
                      const xhr = this;
                      emit('XHR_START', {
                        method: clip(xhr.__ttdiagMethod || 'GET', 20),
                        url: clip(xhr.__ttdiagUrl || '', 1000)
                      });

                      xhr.addEventListener('loadend', function () {
                        emit('XHR_END', {
                          method: clip(xhr.__ttdiagMethod || 'GET', 20),
                          url: clip(xhr.__ttdiagUrl || '', 1000),
                          status: xhr.status,
                          responseUrl: clip(xhr.responseURL || '', 1000)
                        });
                      }, { once: true });

                      return xhrSend.apply(this, arguments);
                    };

                    function wrapHistory(methodName) {
                      const original = history[methodName];
                      if (typeof original !== 'function') return;

                      history[methodName] = function () {
                        const before = location.href;
                        const result = original.apply(this, arguments);
                        emit('HISTORY_' + methodName.toUpperCase(), {
                          before: before,
                          after: location.href,
                          target: clip(arguments[2] || '', 1000)
                        });
                        return result;
                      };
                    }

                    wrapHistory('pushState');
                    wrapHistory('replaceState');

                    window.addEventListener('popstate', function () {
                      emit('POPSTATE', {});
                    });

                    window.addEventListener('hashchange', function (event) {
                      emit('HASHCHANGE', {
                        oldUrl: clip(event.oldURL || '', 1000),
                        newUrl: clip(event.newURL || '', 1000)
                      });
                    });

                    let lastUrl = location.href;
                    setInterval(function () {
                      if (location.href !== lastUrl) {
                        emit('URL_CHANGE', {
                          before: lastUrl,
                          after: location.href
                        });
                        lastUrl = location.href;
                      }
                    }, 400);

                    let mutationTimer = 0;
                    let added = [];
                    let removed = [];
                    let attributes = [];

                    function queueMutationFlush() {
                      if (mutationTimer) return;
                      mutationTimer = setTimeout(function () {
                        mutationTimer = 0;
                        emit('DOM_MUTATION', {
                          added: added.slice(0, 35),
                          removed: removed.slice(0, 20),
                          attributes: attributes.slice(0, 35),
                          addedCount: added.length,
                          removedCount: removed.length,
                          attributeCount: attributes.length
                        });
                        added = [];
                        removed = [];
                        attributes = [];
                      }, 250);
                    }

                    const observer = new MutationObserver(function (mutations) {
                      mutations.forEach(function (mutation) {
                        if (mutation.type === 'childList') {
                          mutation.addedNodes.forEach(function (node) {
                            if (node.nodeType === 1) {
                              added.push(describe(node));
                              try {
                                Array.from(node.querySelectorAll(
                                  'input,textarea,select,button,a,[role],[aria-label]'
                                )).slice(0, 10).forEach(function (child) {
                                  added.push(describe(child));
                                });
                              } catch (_) {}
                            }
                          });

                          mutation.removedNodes.forEach(function (node) {
                            if (node.nodeType === 1) {
                              removed.push(describe(node));
                            }
                          });
                        } else if (mutation.type === 'attributes') {
                          attributes.push({
                            attribute: mutation.attributeName,
                            element: describe(mutation.target)
                          });
                        }
                      });

                      if (added.length || removed.length || attributes.length) {
                        queueMutationFlush();
                      }
                    });

                    if (document.documentElement) {
                      observer.observe(document.documentElement, {
                        subtree: true,
                        childList: true,
                        attributes: true,
                        attributeFilter: [
                          'id',
                          'class',
                          'name',
                          'type',
                          'placeholder',
                          'role',
                          'aria-label',
                          'aria-expanded',
                          'aria-controls',
                          'autocomplete'
                        ]
                      });
                    }

                    snapshot('INSTALL');
                    setTimeout(function () { snapshot('AFTER_1S'); }, 1000);
                    setTimeout(function () { snapshot('AFTER_3S'); }, 3000);

                    return 'INSTALLED';
                  })();
                  """;
          }
          EOF

      - name: Verify V002 identifiers
        run: |
          grep -F 'rootProject.name = "TomTomKiszolgaloV002"' settings.gradle.kts
          grep -F 'versionCode = 2' app/build.gradle.kts
          grep -F 'versionName = "002"' app/build.gradle.kts
          grep -F 'TomTom Kiszolgáló V002' app/src/main/AndroidManifest.xml
          grep -F 'private static final String VERSION = "V002";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V002 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V002 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V002.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V002.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V002
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V002
          path: |
            artifact/TomTom_Kiszolgalo_V002.apk
            artifact/TomTom_Kiszolgalo_V002.aab
          if-no-files-found: error
