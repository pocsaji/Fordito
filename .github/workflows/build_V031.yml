                  editor.setMinLines(3);
                  editor.setPadding(dp(14), dp(14), dp(14), dp(14));
                  editor.setBackgroundColor(Color.rgb(35, 41, 50));
                  return editor;
              }
          
              private TextView createStatusBox() {
