              private static final Pattern COORDINATE_PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");
          
              private static final Pattern URL_PATTERN = Pattern.compile(
                      "https?://[^\\s<>\"]+",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern DATA_COORDINATE_PATTERN = Pattern.compile(
                      "!3d([+-]?\\d{1,2}(?:\\.\\d+)?)!4d([+-]?\\d{1,3}(?:\\.\\d+)?)",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern AT_COORDINATE_PATTERN = Pattern.compile(
                      "@([+-]?\\d{1,2}(?:\\.\\d+)?),([+-]?\\d{1,3}(?:\\.\\d+)?)",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern QUERY_COORDINATE_PATTERN = Pattern.compile(
                      "(?:[?&]|\\b)(?:q|query|ll|destination|origin)=" +
                      "([+-]?\\d{1,2}(?:\\.\\d+)?)(?:%2C|,|%20|\\+|\\s)+" +
                      "([+-]?\\d{1,3}(?:\\.\\d+)?)",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern POSTAL_CITY_PATTERN = Pattern.compile(
                      "\\b(?:[A-Z]{1,3}-)?\\d{4,6}\\s+([^,\\n]+)",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
          
              private static final Pattern POSTAL_CODE_PATTERN = Pattern.compile(
                      "\\b((?:[A-Z]{1,3}-)?\\d{4,6})\\b",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
          
              private static final Pattern INLINE_METADATA_PATTERN = Pattern.compile(
                      "(?i)(?:^|[,;])\\s*(?:AUTRE|OTHER|SONSTIGE|PRODUIT|PRODUCT|" +
                      "MARCHANDISE|GOODS|WARE|ARTICLE|COMMODITY|PULPE|BETTERAVE|" +
                      "COMPTE|ACCOUNT|KONTO|REFERENCE|REF|TELEPHONE|TEL|NOTE|" +
                      "COMMENT|MEGJEGYZES)\\b.*$");
          
              private static final Pattern COUNTRY_TOKEN_PATTERN = Pattern.compile(
                      "(?i)^(?:FR|FRANCE|FRANCIAORSZAG|" +
                      "CH|SUISSE|SCHWEIZ|SWITZERLAND|SVAJC|" +
                      "BE|BELGIQUE|BELGIUM|" +
                      "DE|DEUTSCHLAND|GERMANY|NEMETORSZAG|" +
                      "NL|NEDERLAND|NETHERLANDS|HOLLANDIA|" +
                      "LU|LUXEMBOURG|AT|AUSTRIA|OSTERREICH|AUSZTRIA|" +
                      "IT|ITALIA|ITALY|OLASZORSZAG|" +
                      "ES|ESPANA|SPAIN|SPANYOLORSZAG|" +
                      "HU|HUNGARY|MAGYARORSZAG|" +
                      "PL|POLAND|POLSKA|LENGYELORSZAG|" +
                      "CZ|CZECHIA|CESKO|CSEHORSZAG|" +
                      "SK|SLOVAKIA|SLOVENSKO|SZLOVAKIA|" +
                      "SI|SLOVENIA|SLOVENIJA|HR|CROATIA|HRVATSKA|" +
                      "RO|ROMANIA|BG|BULGARIA|DK|DENMARK|DANIA|" +
