                  waypointEditor.setSingleLine(false);
                  waypointEditor.setMinLines(3);
                  waypointEditor.setPadding(dp(14), dp(14), dp(14), dp(14));
                  waypointEditor.setBackgroundColor(Color.rgb(35, 41, 50));
                  LinearLayout.LayoutParams waypointParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(150));
                  waypointParams.bottomMargin = dp(8);
                  root.addView(waypointEditor, waypointParams);
          
                  waypointStatus = createStatusBox();
                  root.addView(waypointStatus, matchWrap());
          
                  Button resolveButton = createButton(
                          "CÍMEK ELLENŐRZÉSE / FOLYTATÁS",
                          Color.rgb(44, 116, 214));
                  resolveButton.setOnClickListener(v -> resolveNextUnverifiedPoint());
                  root.addView(resolveButton, buttonParams());
          
                  Button waypointButton = createButton(
                          "GOOGLE MAPS – KÖZTES PONT",
                          Color.rgb(44, 116, 214));
                  waypointButton.setOnClickListener(v -> openNewWaypoint());
                  root.addView(waypointButton, buttonParams());
          
                  finishButton = createButton(
                          "KÉSZ – ELLENŐRZÖTT ÚTVONAL MEGNYITÁSA",
