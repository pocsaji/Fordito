              static final String KEY_PICKUP_LABEL = "pickup_label";
          
              static final String KEY_DELIVERY_QUERY = "delivery_query";
              static final String KEY_DELIVERY_COORD = "delivery_coord";
              static final String KEY_DELIVERY_LABEL = "delivery_label";
          
