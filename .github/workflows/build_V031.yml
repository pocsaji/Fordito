                          "2. Áru, termék, megjegyzés, telefonszám, referencia és számlanév nem kerül a keresésbe.\n" +
                          "3. A megtisztított cím kerül a Google Maps keresőjébe.\n" +
                          "4. A pontos hely adatlapján a + gomb először a Google Maps keresőmezőben " +
                          "látható teljes koordinátát veszi át. Csak ennek hiányában használja a Megosztást.\n" +
                          "5. Eltérő irányítószám vagy város esetén a pontot nem menti el.");
                  description.setTextColor(Color.rgb(220, 225, 232));
                  description.setTextSize(16);
                  description.setLineSpacing(0f, 1.08f);
                  description.setPadding(0, dp(16), 0, dp(16));
                  root.addView(description, matchWrap());
          
                  root.addView(createLabel("FELRAKÓ – megtisztított cím"), matchWrap());
                  pickupEditor = createPointEditor(
