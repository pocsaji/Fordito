              private void openRoute(
                      List<String> incoming,
                      List<String> incomingLabels) {
                  ArrayList<Coordinate> coordinates = new ArrayList<>();
                  ArrayList<String> labels = new ArrayList<>();
          
                  for (int index = 0; index < incoming.size(); index++) {
                      String raw = incoming.get(index);
                      Coordinate coordinate = parseCoordinate(raw);
                      if (coordinate == null) {
                          fail("Hibás koordináta maradt az útvonalban:\n" + raw);
                          return;
                      }
          
                      String label = incomingLabels != null &&
                              index < incomingLabels.size()
                              ? incomingLabels.get(index)
                              : defaultLabel(index, incoming.size());
          
                      if (coordinates.isEmpty() ||
                              !coordinates.get(coordinates.size() - 1).sameAs(coordinate)) {
                          coordinates.add(coordinate);
                          labels.add(label);
                      }
                  }
          
                  if (coordinates.size() < 2) {
                      fail("Legalább két különböző koordináta szükséges.");
                      return;
                  }
          
                  if (coordinates.size() > MAX_ROUTE_POINTS) {
                      coordinates = new ArrayList<>(
