              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
                  loadState();
                  handleIncomingIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIncomingIntent(intent);
              }

              private void handleIncomingIntent(Intent intent) {
                  if (intent == null) return;

                  if (ACTION_IMPORT_MAPS_CLIPBOARD.equals(intent.getAction())) {
                      intent.setAction(null);
                      new Handler(Looper.getMainLooper()).postDelayed(
                              this::importMapsLinkFromClipboard,
                              500L);
                      return;
                  }

                  handleIncomingShare(intent);
              }

              private void importMapsLinkFromClipboard() {
                  ClipboardManager clipboard =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);

                  if (clipboard == null || !clipboard.hasPrimaryClip()) {
                      Toast.makeText(this,
                              "A Google Maps nem másolt helylinket. " +
                              "Nyisd meg újra a pontos helyet, majd nyomd meg a + gombot.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  ClipData clip = clipboard.getPrimaryClip();
                  if (clip == null || clip.getItemCount() == 0) {
                      Toast.makeText(this,
                              "A vágólapon nincs feldolgozható Google Maps link.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  CharSequence value = clip.getItemAt(0).coerceToText(this);
                  String shared = value == null ? "" : value.toString().trim();

                  if (shared.isEmpty()) {
                      Toast.makeText(this,
                              "A Google Maps üres linket másolt.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  Toast.makeText(this,
                          "A Google Maps koordináta beolvasása folyamatban…",
                          Toast.LENGTH_LONG).show();

                  new Thread(() -> resolveSharedPlace(
                          shared, ""), "maps-clipboard-resolver").start();
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  loadState();
              }
          
              @Override
              protected void onPause() {
                  saveQueriesAndWaypoints();
                  super.onPause();
              }
          
              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(16, 19, 24));
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(28));
                  scroll.addView(root, new ScrollView.LayoutParams(
