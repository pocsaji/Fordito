          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class MainActivity extends Activity {
              private static final String VERSION = "V004";
              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(24), dp(40), dp(24), dp(24));
                  root.setBackgroundColor(Color.rgb(16, 19, 24));

                  TextView title = new TextView(this);
                  title.setText("TomTom Kiszolgáló " + VERSION);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(title.getTypeface(), android.graphics.Typeface.BOLD);
                  root.addView(title, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView description = new TextView(this);
                  description.setText(
                          "Napi használat: nyisd meg a fuvarfeladatot, majd nyomd meg az egyetlen lebegő TT gombot.\n\n" +
                          "A program kiolvassa a látható SZÁLLÍTÁS címet, és közvetlenül megnyitja vele a TomTom GO Expertet.\n\n" +
                          "Nincs gépelés, másolás, beillesztés, Chrome vagy weboldal.");
                  description.setTextColor(Color.rgb(220, 225, 232));
                  description.setTextSize(19);
                  description.setLineSpacing(0f, 1.15f);
                  description.setPadding(0, dp(28), 0, dp(28));
                  root.addView(description, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  statusText = new TextView(this);
                  statusText.setTextSize(18);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(dp(12), dp(18), dp(12), dp(18));
                  root.addView(statusText, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  Button settingsButton = new Button(this);
                  settingsButton.setText("EGYSZERI BEÁLLÍTÁS MEGNYITÁSA");
                  settingsButton.setTextSize(18);
                  settingsButton.setTextColor(Color.WHITE);
                  settingsButton.setBackgroundColor(Color.rgb(44, 116, 214));
                  settingsButton.setMinHeight(dp(72));
                  settingsButton.setOnClickListener(v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  LinearLayout.LayoutParams buttonParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(72));
                  buttonParams.topMargin = dp(14);
                  root.addView(settingsButton, buttonParams);

                  TextView note = new TextView(this);
                  note.setText(
                          "A beállításokban egyszer kapcsold be a „TomTom Kiszolgáló V004” szolgáltatást. " +
                          "Ezután megjelenik a kis lebegő TT gomb, és a napi használat egyetlen érintés.");
                  note.setTextColor(Color.rgb(170, 178, 190));
                  note.setTextSize(15);
                  note.setPadding(0, dp(24), 0, 0);
                  root.addView(note, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateStatus();
              }

              private void updateStatus() {
                  boolean enabled = isAccessibilityServiceEnabled();
                  statusText.setText(enabled
                          ? "AKTÍV – a lebegő TT gomb használható"
                          : "NINCS BEKAPCSOLVA – egyszeri beállítás szükséges");
                  statusText.setTextColor(enabled
                          ? Color.rgb(85, 210, 120)
                          : Color.rgb(255, 170, 70));
              }

              private boolean isAccessibilityServiceEnabled() {
                  ComponentName expected = new ComponentName(this, TomTomAccessibilityService.class);
                  String enabledServices = Settings.Secure.getString(
                          getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (TextUtils.isEmpty(enabledServices)) return false;

                  TextUtils.SimpleStringSplitter splitter =
                          new TextUtils.SimpleStringSplitter(':');
                  splitter.setString(enabledServices);
                  while (splitter.hasNext()) {
                      ComponentName enabled = ComponentName.unflattenFromString(splitter.next());
                      if (expected.equals(enabled)) return true;
                  }
                  return false;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
          EOF

          cat > app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java <<'EOF'
          package hu.pocsaji.tomtomkiszolgalo;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.Normalizer;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class TomTomAccessibilityService extends AccessibilityService {
              private static final String VERSION = "V004";
              private static final String TOMTOM_PACKAGE = "com.tomtom.gplay.navapp";
              private static final Pattern POSTAL_CODE = Pattern.compile("(?<!\\d)\\d{4,5}(?!\\d)");
              private static final Pattern HOUSE_NUMBER = Pattern.compile("\\b\\d{1,5}[A-Za-z]?\\b");
              private static final Set<String> COUNTRY_CODES = new HashSet<>(Arrays.asList(
                      "AT", "BE", "BG", "CH", "CZ", "DE", "DK", "EE", "ES", "FI", "FR",
                      "GR", "HR", "HU", "IE", "IT", "LT", "LU", "LV", "NL", "NO", "PL",
                      "PT", "RO", "RS", "SE", "SI", "SK", "UK"));
              private static final List<String> DELIVERY_MARKERS = Arrays.asList(
                      "SZALLITAS", "DELIVERY", "LIVRAISON", "LIEFERUNG", "CONSEGNA",
                      "LEVERING", "ENTREGA", "DOSTAWA");

              private WindowManager windowManager;
              private TextView floatingButton;
              private WindowManager.LayoutParams floatingParams;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // A működés szándékosan csak a felhasználó TT-gombnyomására indul.
              }

              @Override
              public void onInterrupt() {
                  // Nincs folyamatos művelet.
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  showFloatingButton();
                  Toast.makeText(this,
                          "TomTom Kiszolgáló " + VERSION + " aktív.",
                          Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onDestroy() {
                  removeFloatingButton();
                  super.onDestroy();
              }

              private void showFloatingButton() {
                  if (floatingButton != null) return;

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  floatingButton = new TextView(this);
                  floatingButton.setText("TT");
                  floatingButton.setTextColor(Color.WHITE);
                  floatingButton.setTextSize(20);
                  floatingButton.setGravity(Gravity.CENTER);
                  floatingButton.setTypeface(
                          floatingButton.getTypeface(),
                          android.graphics.Typeface.BOLD);
                  floatingButton.setElevation(dp(12));

                  GradientDrawable background = new GradientDrawable();
                  background.setShape(GradientDrawable.OVAL);
                  background.setColor(Color.rgb(0, 150, 75));
                  background.setStroke(dp(2), Color.WHITE);
                  floatingButton.setBackground(background);

                  floatingParams = new WindowManager.LayoutParams(
                          dp(64),
                          dp(64),
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  floatingParams.gravity = Gravity.TOP | Gravity.END;
                  floatingParams.x = dp(10);
                  floatingParams.y = dp(180);

                  floatingButton.setOnTouchListener(new FloatingTouchListener());
                  windowManager.addView(floatingButton, floatingParams);
              }

              private void removeFloatingButton() {
                  if (windowManager != null && floatingButton != null) {
                      try {
                          windowManager.removeView(floatingButton);
                      } catch (RuntimeException ignored) {
                      }
                  }
                  floatingButton = null;
                  floatingParams = null;
              }

              private void processVisibleDeliveryAddress() {
                  List<String> visibleLines = readVisibleLines();
                  String address = AddressExtractor.findDeliveryAddress(visibleLines);

                  if (address == null || address.isBlank()) {
                      Toast.makeText(this,
                              "Nem találtam használható SZÁLLÍTÁS címet ezen a képernyőn.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  Toast.makeText(this,
                          "TomTom: " + address,
                          Toast.LENGTH_LONG).show();
                  openTomTom(address);
              }

              private List<String> readVisibleLines() {
                  List<AccessibilityWindowInfo> windows = new ArrayList<>(getWindows());
                  windows.sort(Comparator.comparingInt(AccessibilityWindowInfo::getLayer).reversed());

                  for (AccessibilityWindowInfo window : windows) {
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;

                      CharSequence packageName = root.getPackageName();
                      String packageText = packageName == null ? "" : packageName.toString();
                      if (getPackageName().equals(packageText) ||
                              "com.android.systemui".equals(packageText) ||
                              TOMTOM_PACKAGE.equals(packageText)) {
                          root.recycle();
                          continue;
                      }

                      List<String> lines = new ArrayList<>();
                      collectVisibleText(root, lines);
                      root.recycle();
                      if (!lines.isEmpty()) return deduplicateAdjacent(lines);
                  }

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return Collections.emptyList();
                  List<String> lines = new ArrayList<>();
                  collectVisibleText(root, lines);
                  root.recycle();
                  return deduplicateAdjacent(lines);
              }

              private void collectVisibleText(AccessibilityNodeInfo node, List<String> output) {
                  if (node == null) return;

                  if (node.isVisibleToUser()) {
                      addText(node.getText(), output);
                      if (node.getText() == null || node.getText().length() == 0) {
                          addText(node.getContentDescription(), output);
                      }
                  }

                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          collectVisibleText(child, output);
                          child.recycle();
                      }
                  }
              }

              private void addText(CharSequence value, List<String> output) {
                  if (value == null) return;
                  String text = value.toString().replace('\u00A0', ' ').trim();
                  if (text.isEmpty()) return;
                  for (String part : text.split("\\r?\\n")) {
                      String clean = part.replaceAll("\\s+", " ").trim();
                      if (!clean.isEmpty()) output.add(clean);
                  }
              }

              private List<String> deduplicateAdjacent(List<String> source) {
                  List<String> result = new ArrayList<>();
                  String previous = null;
                  for (String value : source) {
                      if (!value.equals(previous)) result.add(value);
                      previous = value;
                  }
                  return result;
              }

              private void openTomTom(String address) {
                  Intent navigationIntent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("google.navigation:q=" + Uri.encode(address)));
                  navigationIntent.setPackage(TOMTOM_PACKAGE);
                  navigationIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  try {
                      startActivity(navigationIntent);
                      return;
                  } catch (ActivityNotFoundException ignored) {
                  }

                  Intent geoIntent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0?q=" + Uri.encode(address)));
                  geoIntent.setPackage(TOMTOM_PACKAGE);
                  geoIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  try {
                      startActivity(geoIntent);
                  } catch (ActivityNotFoundException error) {
                      Toast.makeText(this,
                              "A TomTom GO Expert nem található vagy nem fogadta a címet.",
                              Toast.LENGTH_LONG).show();
                  }
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private final class FloatingTouchListener implements View.OnTouchListener {
                  private int startX;
                  private int startY;
                  private float startRawX;
                  private float startRawY;
                  private long downTime;
                  private boolean moved;

                  @Override
                  public boolean onTouch(View view, MotionEvent event) {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              startX = floatingParams.x;
                              startY = floatingParams.y;
                              startRawX = event.getRawX();
                              startRawY = event.getRawY();
                              downTime = SystemClock.uptimeMillis();
                              moved = false;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - startRawX;
                              float dy = event.getRawY() - startRawY;
                              if (Math.abs(dx) > dp(6) || Math.abs(dy) > dp(6)) {
                                  moved = true;
                              }
                              floatingParams.x = Math.max(0, startX - Math.round(dx));
                              floatingParams.y = Math.max(0, startY + Math.round(dy));
                              windowManager.updateViewLayout(floatingButton, floatingParams);
                              return true;

                          case MotionEvent.ACTION_UP:
                              long duration = SystemClock.uptimeMillis() - downTime;
                              if (!moved && duration < 700) {
                                  processVisibleDeliveryAddress();
                              }
                              return true;

                          default:
                              return false;
                      }
                  }
              }

              private static final class AddressExtractor {
                  private AddressExtractor() {
                  }

                  static String findDeliveryAddress(List<String> originalLines) {
                      if (originalLines == null || originalLines.isEmpty()) return null;

                      List<String> lines = new ArrayList<>();
                      for (String line : originalLines) {
                          String clean = clean(line);
                          if (!clean.isEmpty()) lines.add(clean);
                      }
                      if (lines.isEmpty()) return null;

                      int deliveryIndex = -1;
                      for (int i = 0; i < lines.size(); i++) {
                          String normalized = normalize(lines.get(i));
                          for (String marker : DELIVERY_MARKERS) {
                              if (normalized.equals(marker) || normalized.startsWith(marker + " ")) {
                                  deliveryIndex = i;
                              }
                          }
                      }

                      Candidate best = null;
                      int start = deliveryIndex >= 0 ? deliveryIndex + 1 : 0;
                      int end = deliveryIndex >= 0
                              ? Math.min(lines.size(), deliveryIndex + 14)
                              : lines.size();

                      for (int i = start; i < end; i++) {
                          for (int count = 1; count <= 3 && i + count <= end; count++) {
                              String joined = join(lines, i, count);
                              Candidate candidate = score(joined, deliveryIndex >= 0, i - start);
                              if (candidate != null && (best == null || candidate.score > best.score)) {
                                  best = candidate;
                              }
                          }
                      }

                      if (best == null && deliveryIndex >= 0) {
                          for (int i = 0; i < lines.size(); i++) {
                              Candidate candidate = score(lines.get(i), false, i);
                              if (candidate != null && (best == null || candidate.score > best.score)) {
                                  best = candidate;
                              }
                          }
                      }

                      return best == null ? null : best.address;
                  }

                  private static Candidate score(String raw, boolean afterDelivery, int distance) {
                      String value = clean(raw);
                      if (value.length() < 8 || value.length() > 180) return null;

                      String normalized = normalize(value);
                      if (isNoise(normalized)) return null;

                      Matcher postalMatcher = POSTAL_CODE.matcher(value);
                      boolean hasPostal = postalMatcher.find();
                      boolean hasCountry = containsCountryCode(normalized);
                      boolean hasHouse = HOUSE_NUMBER.matcher(value).find();
                      boolean hasStreetHint = containsStreetHint(normalized);

                      if (!hasPostal || (!hasCountry && !hasStreetHint)) return null;

                      int score = 0;
                      if (afterDelivery) score += 8;
                      if (hasPostal) score += 6;
                      if (hasCountry) score += 5;
                      if (hasHouse) score += 3;
                      if (hasStreetHint) score += 3;
                      if (value.contains(",")) score += 2;
                      score -= Math.min(distance, 8);

                      return new Candidate(normalizeAddress(value), score);
                  }

                  private static boolean containsCountryCode(String normalized) {
                      for (String token : normalized.split("[^A-Z]+")) {
                          if (COUNTRY_CODES.contains(token)) return true;
                      }
                      return false;
                  }

                  private static boolean containsStreetHint(String normalized) {
                      String padded = " " + normalized + " ";
                      String[] hints = {
                              " RUE ", " AVENUE ", " ROUTE ", " CHEMIN ", " QUAI ",
                              " STRASSE ", " STR. ", " WEG ", " PLATZ ", " GASSE ",
                              " UTCA ", " UT ", " TER ", " KORUT ",
                              " STREET ", " ROAD ", " LANE ", " DRIVE ",
                              " KAAI ", " LAAN ", " STRAAT ", "WEG "
                      };
                      for (String hint : hints) {
                          if (padded.contains(hint)) return true;
                      }
                      return false;
                  }

                  private static boolean isNoise(String normalized) {
                      return normalized.matches(".*\\b(20\\d{2}|19\\d{2})\\.?.*") &&
                              normalized.matches(".*\\b\\d{1,2}:\\d{2}\\b.*") ||
                              normalized.contains("BEFEJEZETT") ||
                              normalized.contains("FOLYAMATBAN") ||
                              normalized.contains("BEGYUJTES") ||
                              normalized.contains("COMPTE") ||
                              normalized.contains("TEL ") ||
                              normalized.contains("MAIS") ||
                              normalized.contains("AUTRE");
                  }

                  private static String normalizeAddress(String value) {
                      return value
                              .replaceAll("\\s*,\\s*", ", ")
                              .replaceAll("\\s+", " ")
                              .replaceAll("^[,;: -]+|[,;: -]+$", "")
                              .trim();
                  }

                  private static String join(List<String> lines, int start, int count) {
                      StringBuilder builder = new StringBuilder();
                      for (int i = 0; i < count; i++) {
                          if (builder.length() > 0) builder.append(", ");
                          builder.append(lines.get(start + i));
                      }
                      return builder.toString();
                  }

                  private static String clean(String value) {
                      if (value == null) return "";
                      return value.replace('\u00A0', ' ')
                              .replaceAll("\\s+", " ")
                              .trim();
                  }

                  private static String normalize(String value) {
                      String decomposed = Normalizer.normalize(
                              value.toUpperCase(Locale.ROOT),
                              Normalizer.Form.NFD);
                      return decomposed.replaceAll("\\p{M}+", "")
                              .replaceAll("\\s+", " ")
                              .trim();
                  }

                  private static final class Candidate {
                      final String address;
                      final int score;

                      Candidate(String address, int score) {
                          this.address = address;
                          this.score = score;
                      }
                  }
              }
          }
          EOF

      - name: Verify V004 identifiers and removed WebView code
        run: |
          grep -F 'rootProject.name = "TomTomKiszolgaloV004"' settings.gradle.kts
          grep -F 'versionCode = 4' app/build.gradle.kts
          grep -F 'versionName = "004"' app/build.gradle.kts
          grep -F 'TomTom Kiszolgáló V004' app/src/main/AndroidManifest.xml
          grep -F 'private static final String VERSION = "V004";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java
          grep -F 'private static final String VERSION = "V004";' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'google.navigation:q=' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          grep -F 'com.tomtom.gplay.navapp' app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java
          ! grep -R -F 'WebView' app/src/main || exit 1
          ! grep -R -F 'plan.tomtom.com' app/src/main || exit 1
          ! grep -R -F 'GPX' app/src/main || exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V004 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V004 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V004.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V004.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V004
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V004
          path: |
            artifact/TomTom_Kiszolgalo_V004.apk
            artifact/TomTom_Kiszolgalo_V004.aab
          if-no-files-found: error
