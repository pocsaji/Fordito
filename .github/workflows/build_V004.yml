name: Build TomTom Kiszolgalo V004

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create TomTom Kiszolgalo V004 one-tap project
        run: |
          mkdir -p app/src/main/java/hu/pocsaji/tomtomkiszolgalo
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TomTomKiszolgaloV004"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins {
              id("com.android.application")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          android {
              namespace = "hu.pocsaji.tomtomkiszolgalo"
              compileSdk = 36

              defaultConfig {
                  applicationId = "hu.pocsaji.tomtomkiszolgalo"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 4
                  versionName = "004"
              }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2C74D6</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">TomTom Kiszolgáló V004</string>
              <string name="accessibility_service_description">A képernyőn látható szállítási cím felismerése és egyetlen érintéssel történő átadása a TomTom GO Expertnek.</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_map.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#17365F"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,29L43,21L65,29L84,21L84,78L65,86L43,78L24,86ZM43,29L31,34L31,75L43,70ZM50,30L50,70L62,76L62,36ZM69,35L69,76L77,73L77,32Z" />
              <path
                  android:fillColor="#E53935"
                  android:pathData="M63,22C52,22 44,30 44,41C44,55 63,74 63,74C63,74 82,55 82,41C82,30 74,22 63,22ZM63,48A7,7 0,1 1,63 34A7,7 0,1 1,63 48Z" />
          </vector>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
