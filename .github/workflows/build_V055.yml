          package hu.pocsaji.driverassist;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import com.sygic.sdk.remoteapi.Api;
          import com.sygic.sdk.remoteapi.ApiCallback;
          import com.sygic.sdk.remoteapi.ApiItinerary;
          import com.sygic.sdk.remoteapi.ApiNavigation;
          import com.sygic.sdk.remoteapi.exception.GeneralException;
          import com.sygic.sdk.remoteapi.model.GpsPosition;
          import com.sygic.sdk.remoteapi.model.StopOffPoint;
          
          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          /**
           * Hivatalos, helyi IPC-kapcsolaton keresztül adja át a teljes útvonalat
           * a telefonon telepített Sygic GPS Truck Navigation alkalmazásnak.
           * Nincs képernyő-automatizálás, nincs fájlimport és nincs nem dokumentált felhőhívás.
           */
          public final class PlanSygicActivity extends Activity implements ApiCallback {
              public static final String EXTRA_ROUTE_POINTS =
                      "hu.pocsaji.driverassist.extra.SYGIC_ROUTE_POINTS";
              public static final String EXTRA_ROUTE_LABELS =
                      "hu.pocsaji.driverassist.extra.SYGIC_ROUTE_LABELS";
          
              private static final String VERSION = "V055";
              private static final String SYGIC_PACKAGE = "com.sygic.truck";
              private static final String ITINERARY_NAME =
                      "DA_ROUTE";
              private static final int MAX_ROUTE_POINTS = 10;
              private static final int API_TIMEOUT_MS = 30000;
              private static final long CONNECTION_ATTEMPT_TIMEOUT_MS = 10000L;
              private static final int MAX_CONNECTION_ATTEMPTS = 3;
          
              private static final Pattern COORDINATE_PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");
          
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final AtomicBoolean routeSubmissionStarted = new AtomicBoolean(false);
              private final AtomicBoolean completed = new AtomicBoolean(false);
              private TextView statusText;
              private ArrayList<String> routePoints;
              private ArrayList<String> routeLabels;
              private boolean apiInitialized;
              private int connectionAttempt;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showProgress();
          
                  routePoints = getIntent().getStringArrayListExtra(EXTRA_ROUTE_POINTS);
                  routeLabels = getIntent().getStringArrayListExtra(EXTRA_ROUTE_LABELS);
          
                  if (routePoints == null || routePoints.isEmpty()) {
                      fail("Az útvonalhoz legalább egy felrakó, lerakó vagy célpont szükséges.");
                      return;
                  }
                  if (routePoints.size() > MAX_ROUTE_POINTS) {
                      fail("A Sygic Trucknak legfeljebb " + MAX_ROUTE_POINTS +
                              " útvonalpont adható át. Egyetlen pontot sem hagytam el.");
                      return;
                  }
                  if (getPackageManager().getLaunchIntentForPackage(SYGIC_PACKAGE) == null) {
                      fail("A Sygic GPS Truck Navigation nincs telepítve vagy nem indítható.");
                      return;
                  }
          
                  startSygicAndConnect();
              }
          
              /**
               * Az init önmagában nem minden Remote API-verziónál indítja el a bindot.
               * Ezért az init után explicit connect() hívás történik, majd legfeljebb
               * három rövid újracsatlakozási kísérlet.
               */
              private void startSygicAndConnect() {
                  Intent launch = getPackageManager().getLaunchIntentForPackage(SYGIC_PACKAGE);
                  if (launch == null) {
                      fail("A Sygic GPS Truck Navigation nincs telepítve vagy nem indítható.");
                      return;
                  }
                  statusText.setText("A helyi Sygic Truck indítása…");
                  launch.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(launch);
                  handler.postDelayed(this::connectToSygic, 1800L);
              }
          
              private void connectToSygic() {
                  if (completed.get() || routeSubmissionStarted.get()) return;
                  connectionAttempt++;
                  final int thisAttempt = connectionAttempt;
          
                  runOnUiThread(() -> statusText.setText(
                          "Kapcsolódás a Sygic Truckhoz… (" + thisAttempt + "/" +
                                  MAX_CONNECTION_ATTEMPTS + ")"));
          
                  try {
                      if (!apiInitialized) {
                          Api.init(getApplicationContext(),
                                  SYGIC_PACKAGE,
                                  Api.CLASS_TRUCK,
                                  this);
                          apiInitialized = true;
                      }
                      // A 6.4.1 Remote API-ban a tényleges szolgáltatáskapcsolat
                      // külön connect() hívást igényelhet.
                      Api.getInstance().connect();
                  } catch (RuntimeException error) {
                      if (thisAttempt >= MAX_CONNECTION_ATTEMPTS) {
                          fail("A telepített Sygic Truck nem engedte a hivatalos " +
                                  "Remote API-kapcsolatot. Hiba: " +
                                  error.getClass().getSimpleName());
                          return;
                      }
                  }
          
                  handler.postDelayed(() -> {
                      if (completed.get() || routeSubmissionStarted.get()) return;
                      if (thisAttempt != connectionAttempt) return;
          
                      if (connectionAttempt < MAX_CONNECTION_ATTEMPTS) {
                          try {
                              Api.getInstance().disconnect();
                          } catch (RuntimeException ignored) {
                          }
                          handler.postDelayed(this::connectToSygic, 500L);
                      } else {
                          fail("A Sygic Truck 30 másodperc alatt sem fogadta a " +
                                  "hivatalos Remote API-kapcsolatot. Ez nem " +
                                  "koordinátahiba, hanem a Sygic szolgáltatáskapcsolata nem elérhető.");
                      }
                  }, CONNECTION_ATTEMPT_TIMEOUT_MS);
              }
          
              private void showProgress() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(dp(28), dp(28), dp(28), dp(28));
                  root.setBackgroundColor(Color.rgb(16, 19, 24));
          
                  ProgressBar progress = new ProgressBar(this);
                  root.addView(progress, new LinearLayout.LayoutParams(dp(64), dp(64)));
          
                  statusText = new TextView(this);
                  statusText.setText(
                          "A teljes útvonal átadása a Sygic GPS Truck Navigation alkalmazásnak…");
                  statusText.setTextColor(Color.WHITE);
                  statusText.setTextSize(18);
                  statusText.setGravity(Gravity.CENTER);
          
                  LinearLayout.LayoutParams statusParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  statusParams.topMargin = dp(22);
                  root.addView(statusText, statusParams);
                  setContentView(root);
              }
          
              @Override
              public void onServiceConnected() {
                  if (!routeSubmissionStarted.compareAndSet(false, true)) return;
                  runOnUiThread(() -> statusText.setText(
                          "Sygic Truck csatlakoztatva. " + routePoints.size() +
                                  " útvonalpont átadása…"));
                  new Thread(() -> {
                      try {
                          if (!Api.isApplicationRunning(5000)) {
                              Api.getInstance().show(true);
                              Thread.sleep(1200L);
                          }
                      } catch (Exception ignored) {
                          // A helyi alkalmazást már külön elindítottuk; a route-hívás ad végleges eredményt.
                      }
                      submitRoute();
                  }, "sygic-route-submit").start();
              }
          
              private void submitRoute() {
                  String stage = "koordináták előkészítése";
                  try {
                      ArrayList<Coordinate> coordinates = parseRouteCoordinates(routePoints);
          
                      // Új útvonal betöltése előtt a már futó navigációt szabályosan leállítjuk.
                      stage = "korábbi navigáció leállítása";
                      try {
                          ApiNavigation.stopNavigation(5000);
                      } catch (Exception ignored) {
                          // Nincs aktív útvonal: ez normális állapot.
                      }
          
                      stage = "korábbi útiterv törlése";
                      try {
                          ApiItinerary.deleteItinerary(ITINERARY_NAME, 5000);
                      } catch (Exception ignored) {
                          // Első használatkor még nincs törölhető útvonal.
                      }
          
                      // A START az aktuális GPS-hely. Az alkalmazás a MainActivityben
                      // már a kívánt sorrendben adja át az egy vagy két végpontot és a
                      // köztes pontokat; az utolsó átadott pont lesz a FINISH.
                      // Ha pillanatnyilag nincs GPS-fix, az első átadott pont lesz a START.
                      stage = "indulási GPS-pont lekérése";
                      Coordinate currentPosition = null;
                      try {
                          GpsPosition gps = ApiNavigation.getActualGpsPosition(false, 5000);
                          if (gps != null &&
                                  (gps.getLatitude() != 0 || gps.getLongitude() != 0)) {
                              currentPosition = new Coordinate(
                                      gps.getLatitude(), gps.getLongitude());
                          }
                      } catch (Exception ignored) {
                          // GPS-fix nélkül az első átadott pont lesz az útiterv START pontja.
                      }
          
                      stage = "teljes útiterv létrehozása";
                      ArrayList<StopOffPoint> itinerary = new ArrayList<>();
                      int lastIndex = coordinates.size() - 1;
          
                      if (currentPosition != null) {
                          itinerary.add(createStopOffPoint(
                                  currentPosition,
                                  StopOffPoint.PointType.START,
                                  "Aktuális hely"));
                          for (int index = 0; index < lastIndex; index++) {
                              itinerary.add(createStopOffPoint(
                                      coordinates.get(index),
                                      StopOffPoint.PointType.VIAPOINT,
                                      safeCaption(routeLabels != null && index < routeLabels.size()
                                              ? routeLabels.get(index) : null, index)));
                          }
                      } else {
                          if (coordinates.size() == 1) {
                              throw new IllegalStateException(
                                      "Az egyetlen célponthoz a Sygic nem adott aktuális GPS-helyet. " +
                                      "Várj GPS-jelre, majd küldd el újra az útvonalat.");
                          }
                          itinerary.add(createStopOffPoint(
                                  coordinates.get(0),
                                  StopOffPoint.PointType.START,
                                  safeCaption(routeLabels != null && !routeLabels.isEmpty()
                                          ? routeLabels.get(0) : null, 0)));
                          for (int index = 1; index < lastIndex; index++) {
                              itinerary.add(createStopOffPoint(
                                      coordinates.get(index),
                                      StopOffPoint.PointType.VIAPOINT,
                                      safeCaption(routeLabels != null && index < routeLabels.size()
                                              ? routeLabels.get(index) : null, index)));
                          }
                      }
          
                      itinerary.add(createStopOffPoint(
                              coordinates.get(lastIndex),
                              StopOffPoint.PointType.FINISH,
                              safeCaption(routeLabels != null && lastIndex < routeLabels.size()
                                      ? routeLabels.get(lastIndex) : null, lastIndex)));
          
                      ApiItinerary.addItinerary(
                              itinerary,
                              ITINERARY_NAME,
                              API_TIMEOUT_MS);
          
                      stage = "átadott útvonal ellenőrzése";
                      ArrayList<StopOffPoint> accepted =
                              ApiItinerary.getItineraryList(ITINERARY_NAME, API_TIMEOUT_MS);
                      if (accepted == null || accepted.size() != itinerary.size()) {
                          int received = accepted == null ? 0 : accepted.size();
                          throw new IllegalStateException(
                                  "A Sygic " + itinerary.size() + " pontból csak " +
                                          received + " pontot tárolt el.");
                      }
          
                      stage = "útvonal kiszámítása";
                      ApiItinerary.setRoute(
                              ITINERARY_NAME,
                              0,
                              API_TIMEOUT_MS);
                      Api.getInstance().show(false);
          
                      completed.set(true);
                      runOnUiThread(() -> {
                          statusText.setText(
                                  routePoints.size() +
                                          " útvonalpont sikeresen átadva. A Sygic Truck megnyílik.");
                          Toast.makeText(this,
                                  "A teljes útvonal átadva a Sygic Trucknak.",
                                  Toast.LENGTH_LONG).show();
                          handler.postDelayed(this::finish, 1800L);
                      });
                  } catch (GeneralException error) {
                      String detail = error.getMessage();
                      if (detail == null || detail.isBlank()) detail = "nincs részletes leírás";
                      failFromWorker(
                              "A Sygic az alábbi lépést utasította el: " + stage +
                                      ". Hibakód: " + error.getCode() +
                                      ". Részlet: " + detail);
                  } catch (Exception error) {
                      String detail = error.getMessage();
                      if (detail == null || detail.isBlank()) {
                          detail = error.getClass().getSimpleName();
                      }
                      failFromWorker(
                              "Az útvonalátadás az alábbi lépésnél állt meg: " + stage +
                                      ". Hiba: " + detail);
                  }
              }
          
              private ArrayList<Coordinate> parseRouteCoordinates(List<String> points) {
                  ArrayList<Coordinate> result = new ArrayList<>();
                  for (String point : points) {
                      Coordinate coordinate = parseCoordinate(point);
                      if (coordinate == null) {
                          throw new IllegalArgumentException("Hibás koordináta: " + point);
                      }
                      result.add(coordinate);
                  }
                  return result;
              }
          
              private StopOffPoint createStopOffPoint(
                      Coordinate coordinate,
                      int type,
                      String caption) {
                  return new StopOffPoint(
                          false,
                          false,
                          type,
                          coordinate.longitude,
                          coordinate.latitude,
                          -1,
                          0,
                          "",
                          caption,
                          "");
              }
          
              private Coordinate parseCoordinate(String raw) {
                  if (raw == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(raw.replace('−', '-'));
                  if (!matcher.matches()) return null;
          
                  BigDecimal latitude = new BigDecimal(matcher.group(1));
                  BigDecimal longitude = new BigDecimal(matcher.group(2));
                  int latitudeE5 = latitude.multiply(new BigDecimal("100000"))
                          .setScale(0, RoundingMode.HALF_UP)
                          .intValueExact();
                  int longitudeE5 = longitude.multiply(new BigDecimal("100000"))
                          .setScale(0, RoundingMode.HALF_UP)
                          .intValueExact();
                  return new Coordinate(latitudeE5, longitudeE5);
              }
          
              private String safeCaption(String value, int index) {
                  String fallback;
                  if (index == 0) {
                      fallback = "Felrakó";
                  } else if (routePoints != null && index == routePoints.size() - 1) {
                      fallback = "Lerakó";
                  } else {
                      fallback = "Köztes " + index;
                  }
                  String cleaned = value == null ? "" : value.replace('\n', ' ').trim();
                  if (cleaned.isEmpty()) cleaned = fallback;
                  return cleaned.length() > 120 ? cleaned.substring(0, 120) : cleaned;
              }
          
              @Override
              public void onEvent(int event, String data) {
                  // Az útvonalátadás blokkoló API-hívása adja a siker/hiba eredményét.
              }
          
              @Override
              public void onServiceDisconnected() {
                  if (!completed.get() && routeSubmissionStarted.get()) {
                      failFromWorker("A Sygic kapcsolat megszakadt az útvonal átadása közben.");
                  }
              }
          
              private void failFromWorker(String message) {
                  runOnUiThread(() -> fail(message));
              }
          
              private void fail(String message) {
                  if (!completed.compareAndSet(false, true)) return;
                  if (statusText != null) statusText.setText(message);
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
                  handler.postDelayed(this::finish, 2400L);
              }
          
              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (apiInitialized) {
                      try {
                          Api.getInstance().disconnect();
                      } catch (RuntimeException ignored) {
                      }
                  }
                  super.onDestroy();
              }
          
              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          
              private static final class Coordinate {
                  final int latitude;
                  final int longitude;
          
                  Coordinate(int latitude, int longitude) {
                      this.latitude = latitude;
                      this.longitude = longitude;
                  }
              }
          }
