      - name: Test completed pickup and coordinate-prefix duplicate filtering
        run: |
          set -euo pipefail
          mkdir -p puretest/hu/pocsaji/driverassist puretest-classes
          cp app/src/main/java/hu/pocsaji/driverassist/RouteCaptureParser.java puretest/hu/pocsaji/driverassist/
          cp app/src/main/java/hu/pocsaji/driverassist/CoordinateTools.java puretest/hu/pocsaji/driverassist/
          cat > puretest/hu/pocsaji/driverassist/V055LogicTest.java <<'EOF_LOGIC_TEST'
          package hu.pocsaji.driverassist;
          import java.util.Arrays;
          public final class V055LogicTest {
              public static void main(String[] args) {
                  RouteCaptureParser.Result result = RouteCaptureParser.extract(Arrays.asList(
                          "Felrakó", "ABC Farm", "Befejezett",
                          "Lerakó", "Granovit AG", "9201 Gossau", "CH"));
                  if (!result.pickupCompleted || result.pickup != null ||
                          result.delivery == null || !result.delivery.contains("Gossau")) {
                      throw new AssertionError("A befejezett felrakó kezelése hibás.");
                  }
                  if (!CoordinateTools.containsSameRoundedCoordinate(
                          Arrays.asList("47.0000123 8.0000456"),
                          "47.0000199 8.0000499", 4)) {
                      throw new AssertionError("Az azonos koordináta-előtag szűrése hibás.");
                  }
                  if (CoordinateTools.containsSameRoundedCoordinate(
                          Arrays.asList("47.0000123 8.0000456"),
                          "47.0001123 8.0000456", 4)) {
                      throw new AssertionError("Eltérő koordinátát dobott el.");
                  }
                  System.out.println("DRIVER_ASSIST_V055_LOGIC_TEST_OK");
              }
          }
          EOF_LOGIC_TEST
          javac -encoding UTF-8 -d puretest-classes $(find puretest -name '*.java')
          java -cp puretest-classes hu.pocsaji.driverassist.V055LogicTest

