              private void requestScreenCapture() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("image/*");
                  intent.putExtra(Intent.EXTRA_MIME_TYPES,
                          new String[] {"image/png", "image/jpeg", "image/webp"});
                  try {
                      startActivityForResult(
                              Intent.createChooser(intent, "Képernyőkép kiválasztása"),
                              REQUEST_SCREENSHOT_IMAGE);
                      Toast.makeText(this,
                              "Válaszd ki a telefonon elkészített képernyőképet. " +
                              "A Driver Assist ehhez nem kér kisegítő vagy tárhelyengedélyt.",
                              Toast.LENGTH_LONG).show();
                  } catch (ActivityNotFoundException error) {
                      Toast.makeText(this,
                              "Nem található képkiválasztó alkalmazás.",
                              Toast.LENGTH_LONG).show();
                  }
              }
          
              private void launchCameraCapture() {
                  Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                  if (intent.resolveActivity(getPackageManager()) == null) {
                      Toast.makeText(this, "Nem található fényképezőgép alkalmazás.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  try {
                      File directory = new File(getCacheDir(), "freight_camera");
                      if (!directory.exists() && !directory.mkdirs()) {
                          throw new IOException("A kamera gyorsítótára nem hozható létre.");
                      }
                      pendingCameraFile = new File(directory,
                              "freight_" + System.currentTimeMillis() + ".jpg");
                      Uri output = FileProvider.getUriForFile(
                              this, getPackageName() + ".fileprovider", pendingCameraFile);
                      intent.putExtra(MediaStore.EXTRA_OUTPUT, output);
                      intent.setClipData(ClipData.newRawUri("fuvarfotó", output));
                      intent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                              Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivityForResult(intent, REQUEST_CAMERA_CAPTURE);
                  } catch (Exception error) {
                      pendingCameraFile = null;
                      Toast.makeText(this,
                              "A fényképezőgép nem indítható: " + cleanQuery(error.getMessage()),
                              Toast.LENGTH_LONG).show();
                  }
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
          
                  if (requestCode == REQUEST_SCREENSHOT_IMAGE) {
                      if (resultCode != RESULT_OK || data == null || data.getData() == null) {
                          Toast.makeText(this,
                                  "Nem választottál feldolgozható képernyőképet.",
                                  Toast.LENGTH_LONG).show();
                          return;
                      }
                      processImportedImage(data.getData(), "A képernyőkép");
                      return;
                  }
          
                  if (requestCode != REQUEST_CAMERA_CAPTURE) return;
                  if (resultCode != RESULT_OK || pendingCameraFile == null ||
                          !pendingCameraFile.isFile()) {
                      if (pendingCameraFile != null) pendingCameraFile.delete();
                      pendingCameraFile = null;
                      Toast.makeText(this, "Nem készült feldolgozható fénykép.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  File capturedFile = pendingCameraFile;
                  pendingCameraFile = null;
                  Bitmap bitmap = decodeCameraBitmap(capturedFile);
                  capturedFile.delete();
                  if (bitmap == null) {
                      Toast.makeText(this, "A fénykép nem olvasható.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  processCapturedBitmap(bitmap);
              }
          
              private void processImportedImage(Uri uri, String sourceName) {
                  Bitmap bitmap = decodeImageUri(uri);
                  if (bitmap == null) {
                      Toast.makeText(this,
                              sourceName + " nem olvasható.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  processCapturedBitmap(bitmap);
              }
          
              private void processCapturedBitmap(Bitmap bitmap) {
                  // FUTURE MODULE: itt ágazik majd el a teljes fuvarmegbízást értelmező AI-feldolgozás.
                  FreightImageProcessor.process(bitmap, dp(12), new FreightImageProcessor.Callback() {
                      @Override
                      public void onSuccess(RouteCaptureParser.Result result) {
                          bitmap.recycle();
                          handleCapturedResult(result);
                      }
          
                      @Override
                      public void onFailure(String message) {
                          bitmap.recycle();
                          Toast.makeText(MainActivity.this, message, Toast.LENGTH_LONG).show();
                      }
                  });
              }
          
              private Bitmap decodeImageUri(Uri uri) {
                  if (uri == null) return null;
                  Bitmap bitmap;
                  try (InputStream stream = getContentResolver().openInputStream(uri)) {
                      bitmap = BitmapFactory.decodeStream(stream);
                  } catch (IOException | SecurityException error) {
                      return null;
                  }
                  if (bitmap == null) return null;
                  try (InputStream stream = getContentResolver().openInputStream(uri)) {
                      if (stream == null) return bitmap;
                      ExifInterface exif = new ExifInterface(stream);
                      int orientation = exif.getAttributeInt(
                              ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                      int degrees = 0;
                      if (orientation == ExifInterface.ORIENTATION_ROTATE_90) degrees = 90;
                      else if (orientation == ExifInterface.ORIENTATION_ROTATE_180) degrees = 180;
                      else if (orientation == ExifInterface.ORIENTATION_ROTATE_270) degrees = 270;
                      if (degrees != 0) {
                          Matrix matrix = new Matrix();
                          matrix.postRotate(degrees);
                          Bitmap rotated = Bitmap.createBitmap(
                                  bitmap, 0, 0, bitmap.getWidth(), bitmap.getHeight(), matrix, true);
                          if (rotated != bitmap) bitmap.recycle();
                          bitmap = rotated;
                      }
                  } catch (IOException | SecurityException ignored) {
                  }
                  return bitmap;
              }
          
              private Bitmap decodeCameraBitmap(File file) {
                  Bitmap bitmap = BitmapFactory.decodeFile(file.getAbsolutePath());
                  if (bitmap == null) return null;
                  try (FileInputStream stream = new FileInputStream(file)) {
                      ExifInterface exif = new ExifInterface(stream);
                      int orientation = exif.getAttributeInt(
                              ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                      int degrees = 0;
                      if (orientation == ExifInterface.ORIENTATION_ROTATE_90) degrees = 90;
                      else if (orientation == ExifInterface.ORIENTATION_ROTATE_180) degrees = 180;
                      else if (orientation == ExifInterface.ORIENTATION_ROTATE_270) degrees = 270;
                      if (degrees != 0) {
                          Matrix matrix = new Matrix();
                          matrix.postRotate(degrees);
                          Bitmap rotated = Bitmap.createBitmap(
                                  bitmap, 0, 0, bitmap.getWidth(), bitmap.getHeight(), matrix, true);
                          if (rotated != bitmap) bitmap.recycle();
                          bitmap = rotated;
                      }
                  } catch (IOException ignored) {
                  }
                  return bitmap;
              }
          
              private void handleCapturedResult(RouteCaptureParser.Result result) {
                  if (result.pickup == null && result.delivery == null &&
                          !result.pickupCompleted) {
                      Toast.makeText(this,
                              "A fényképen nem találtam felrakó vagy lerakó blokkot.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  RouteStateStore.applyCapture(this, result);
                  loadState();
                  Toast.makeText(this,
                          result.pickupCompleted
                                  ? "A felrakó befejezett; a lerakó feldolgozása indul."
                                  : "A fuvarfeladat beolvasva; a koordinátakeresés indul.",
                          Toast.LENGTH_LONG).show();
                  autoGeocodeMissingPoints();
              }
          
              // ===== BLOCK 3: HELYI ÚTVONALÁLLAPOT =====
              private void loadState() {
                  if (pickupEditor == null) return;
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  setEditorText(pickupEditor, preferences.getString(KEY_PICKUP_QUERY, ""));
                  setEditorText(deliveryEditor, preferences.getString(KEY_DELIVERY_QUERY, ""));
                  updateStatus(preferences);
              }
          
              private void setEditorText(EditText editor, String value) {
                  String safe = value == null ? "" : value;
                  if (!safe.equals(editor.getText().toString())) {
                      editor.setText(safe);
                      editor.setSelection(editor.length());
                  }
              }
          
              private void saveQueriesAndWaypoints() {
                  if (pickupEditor == null) return;
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String pickup = cleanAddressQuery(pickupEditor.getText().toString());
                  String delivery = cleanAddressQuery(deliveryEditor.getText().toString());
                  String oldPickup = preferences.getString(KEY_PICKUP_QUERY, "");
                  String oldDelivery = preferences.getString(KEY_DELIVERY_QUERY, "");
          
                  SharedPreferences.Editor editor = preferences.edit()
                          .putString(KEY_PICKUP_QUERY, pickup)
                          .putString(KEY_DELIVERY_QUERY, delivery);
          
                  if (!pickup.equals(oldPickup)) {
                      editor.putBoolean(KEY_PICKUP_COMPLETED, false)
                              .remove(KEY_PICKUP_COORD)
                              .remove(KEY_PICKUP_LABEL)
                              .remove(KEY_PICKUP_WARNING)
                              .putInt(KEY_REVIEW_CURSOR, 0);
                  }
                  if (!delivery.equals(oldDelivery)) {
                      editor.remove(KEY_DELIVERY_COORD)
                              .remove(KEY_DELIVERY_LABEL)
                              .remove(KEY_DELIVERY_WARNING)
                              .putInt(KEY_REVIEW_CURSOR, 0);
                  }
                  editor.putString(KEY_WAYPOINT_ORDERS,
                          String.join("\n", collectWaypointOrders(preferences))).apply();
              }
          
              private void updateStatus(SharedPreferences preferences) {
                  boolean pickupCompleted = preferences.getBoolean(KEY_PICKUP_COMPLETED, false);
                  String pickupQuery = preferences.getString(KEY_PICKUP_QUERY, "");
                  String pickupCoord = preferences.getString(KEY_PICKUP_COORD, "");
                  String pickupLabelValue = preferences.getString(KEY_PICKUP_LABEL, "");
                  String pickupWarning = preferences.getString(KEY_PICKUP_WARNING, "");
          
                  String deliveryQuery = preferences.getString(KEY_DELIVERY_QUERY, "");
                  String deliveryCoord = preferences.getString(KEY_DELIVERY_COORD, "");
                  String deliveryLabelValue = preferences.getString(KEY_DELIVERY_LABEL, "");
                  String deliveryWarning = preferences.getString(KEY_DELIVERY_WARNING, "");
          
                  boolean pickupReady = !pickupCompleted &&
                          normalizeCoordinate(pickupCoord) != null;
                  boolean deliveryReady = normalizeCoordinate(deliveryCoord) != null;
          
                  if (pickupCompleted) {
                      pickupStatus.setText("Felrakó – BEFEJEZETT\nA navigáció az aktuális GPS-helytől folytatódik.");
                      pickupStatus.setTextColor(Color.rgb(70, 210, 115));
                      pickupEditor.setHint("Befejezett felrakó – nincs szükség új címre");
                  } else {
                      pickupEditor.setHint("Beolvasott felrakócím");
                      pickupStatus.setText(endpointStatus(
                              "Felrakó", pickupQuery, pickupLabelValue, pickupCoord, pickupWarning));
                      pickupStatus.setTextColor(pickupWarning.isBlank()
                              ? Color.rgb(220, 225, 232)
                              : Color.rgb(255, 75, 75));
                  }
          
                  deliveryStatus.setText(endpointStatus(
                          "Lerakó", deliveryQuery, deliveryLabelValue, deliveryCoord, deliveryWarning));
                  deliveryStatus.setTextColor(deliveryWarning.isBlank()
                          ? Color.rgb(220, 225, 232)
                          : Color.rgb(255, 75, 75));
          
                  if (!pickupCompleted && !pickupReady && deliveryReady) {
                      pickupStatus.setText(pickupQuery.isBlank()
                              ? "Felrakó – nincs adat.\nA lerakóval és a köztes pontokkal az útvonal küldhető."
                              : "Felrakó – nincs használható koordináta.\nA lerakóval és a köztes pontokkal az útvonal ettől még küldhető.");
                  }
                  if (!deliveryReady && pickupReady) {
                      deliveryStatus.setText(deliveryQuery.isBlank()
                              ? "Lerakó – nincs adat.\nA felrakóval és a köztes pontokkal az útvonal küldhető."
                              : "Lerakó – nincs használható koordináta.\nA felrakóval és a köztes pontokkal az útvonal ettől még küldhető.");
                  }
          
                  List<String> waypoints = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> labels = cleanLines(preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  List<String> orders = normalizedWaypointOrders(preferences, waypoints.size());
                  rebuildWaypointRows(waypoints, labels, orders);
                  waypointStatus.setText(waypoints.isEmpty()
                          ? "Nincs köztes pont."
                          : "A köztes pontok a kis sorszámok növekvő sorrendjében kerülnek átadásra.");
          
                  int endpointCount = (pickupReady ? 1 : 0) + (deliveryReady ? 1 : 0);
                  boolean hasEndpoint = endpointCount > 0;
                  boolean withinPointLimit = waypoints.size() + endpointCount <= 10;
                  boolean ready = hasEndpoint && allCoordinates(waypoints) && withinPointLimit;
                  finishButton.setEnabled(ready);
                  finishButton.setAlpha(ready ? 1f : 0.45f);
                  if (!withinPointLimit) {
                      finishButton.setText("TÚL SOK PONT – TÖRÖLJ KÖZTES PONTOT");
                  } else if (pickupReady && deliveryReady) {
                      finishButton.setText("ÚTVONAL KÜLDÉSE A SYGIC TRUCKBA");
                  } else if (pickupReady) {
                      finishButton.setText("ÚTVONAL KÜLDÉSE – LERAKÓ NÉLKÜL");
                  } else if (deliveryReady) {
                      finishButton.setText("ÚTVONAL KÜLDÉSE – FELRAKÓ NÉLKÜL");
                  } else {
                      finishButton.setText("ÚTVONAL KÜLDÉSE A SYGIC TRUCKBA");
                  }
          
                  boolean uncertain = (pickupReady && !pickupWarning.isBlank()) ||
                          (deliveryReady && !deliveryWarning.isBlank());
                  if (ready && uncertain) {
                      statusText.setTextColor(Color.rgb(255, 65, 65));
                      statusText.setText("⚠ BIZONYTALAN KOORDINÁTA – KÉZI GOOGLE MAPS ELLENŐRZÉS SZÜKSÉGES!\n" +
                              (pickupReady && !pickupWarning.isBlank() ? "Felrakó: " + pickupWarning + "\n" : "") +
                              (deliveryReady && !deliveryWarning.isBlank() ? "Lerakó: " + deliveryWarning + "\n" : "") +
                              "\nSygic-sorrend:\n" + routePreview(preferences));
                  } else if (ready) {
                      statusText.setTextColor(Color.rgb(70, 210, 115));
                      statusText.setText("ELLENŐRIZVE – Sygic-sorrend:\n" + routePreview(preferences));
                  } else {
                      statusText.setTextColor(Color.rgb(235, 190, 85));
                      statusText.setText("Legalább egy Google-koordinátás felrakó vagy lerakó szükséges.");
                  }
          
                  boolean multiMode = preferences.getBoolean(KEY_WAYPOINT_MULTI_MODE, false);
                  waypointModeButton.setText(multiMode ? "＋ TOVÁBBI PONT" : "＋ PONTOK");
              }
          
              private String endpointStatus(
                      String role,
                      String query,
                      String label,
                      String coordinate,
                      String warning) {
                  String normalized = normalizeCoordinate(coordinate);
                  if (normalized != null) {
                      String safeLabel = label.isBlank()
                              ? summarizeQuery(query)
                              : label;
                      if (warning != null && !warning.isBlank()) {
                          return "⚠ " + role + " – BIZONYTALAN TALÁLAT\n" +
                                  warning + "\nKÉZI ELLENŐRZÉS SZÜKSÉGES\n" +
                                  safeLabel + "\n" + normalized;
                      }
                      return role + " – " + safeLabel + "\n" + normalized;
                  }
                  if (query.isBlank()) {
                      return role + " – nincs adat.";
                  }
                  return role + " – ellenőrzésre vár\n" + summarizeQuery(query);
              }
          
              private String routePreview(SharedPreferences preferences) {
                  ArrayList<String> lines = new ArrayList<>();
                  lines.add("Indulás – aktuális GPS-hely");
                  boolean pickupCompleted = preferences.getBoolean(KEY_PICKUP_COMPLETED, false);
                  boolean pickupReady = !pickupCompleted && normalizeCoordinate(
                          preferences.getString(KEY_PICKUP_COORD, "")) != null;
                  boolean deliveryReady = normalizeCoordinate(
                          preferences.getString(KEY_DELIVERY_COORD, "")) != null;
                  List<String> waypoints = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> labels = cleanLines(preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  List<String> orders = normalizedWaypointOrders(preferences, waypoints.size());
          
                  if (pickupReady && deliveryReady) {
                      lines.add("Felrakó – " + safeLabel(
                              preferences.getString(KEY_PICKUP_LABEL, ""),
                              preferences.getString(KEY_PICKUP_QUERY, ""),
                              "Felrakó"));
                  }
                  for (int index : orderedWaypointIndices(orders)) {
                      String label = index < labels.size() ? labels.get(index) : "Köztes " + (index + 1);
                      lines.add(orders.get(index) + ". köztes – " + compactWaypointLabel(label));
                  }
                  if (pickupReady && !deliveryReady) {
                      lines.add("Felrakó – " + safeLabel(
                              preferences.getString(KEY_PICKUP_LABEL, ""),
                              preferences.getString(KEY_PICKUP_QUERY, ""),
                              "Felrakó"));
                  }
                  if (deliveryReady) {
                      lines.add("Lerakó – " + safeLabel(
                              preferences.getString(KEY_DELIVERY_LABEL, ""),
                              preferences.getString(KEY_DELIVERY_QUERY, ""),
                              "Lerakó"));
                  }
                  return String.join("\n", lines);
              }
          
              private void resolveNextUnverifiedPoint() {
                  String apiKey = getSavedGoogleApiKey();
                  if (GOOGLE_API_KEY_PATTERN.matcher(apiKey).matches()) {
                      autoGeocodeMissingPoints();
                  } else {
                      openNextPointForReview();
                  }
              }
          
              // BLOCK: CÍM → KOORDINÁTA.
              // FUTURE MODULE: helyi adatbázis-keresés közvetlenül a Google-hívás előtt.
              private void autoGeocodeMissingPoints() {
                  if (geocodingInProgress) return;
                  String apiKey = getSavedGoogleApiKey();
                  if (!GOOGLE_API_KEY_PATTERN.matcher(apiKey).matches()) return;
          
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
          
                  boolean pickupCompleted = preferences.getBoolean(KEY_PICKUP_COMPLETED, false);
                  String pickupCoord = normalizeCoordinate(
                          preferences.getString(KEY_PICKUP_COORD, ""));
                  String pickupQuery = preferences.getString(KEY_PICKUP_QUERY, "");
                  if (!pickupCompleted && pickupCoord == null && !pickupQuery.isBlank()) {
                      geocodeAddressWithGoogle(TARGET_PICKUP, pickupQuery, apiKey);
                      return;
                  }
          
                  String deliveryCoord = normalizeCoordinate(
                          preferences.getString(KEY_DELIVERY_COORD, ""));
                  String deliveryQuery = preferences.getString(KEY_DELIVERY_QUERY, "");
                  if (deliveryCoord == null && !deliveryQuery.isBlank()) {
                      geocodeAddressWithGoogle(TARGET_DELIVERY, deliveryQuery, apiKey);
                  }
              }
          
              private void geocodeAddressWithGoogle(
                      String target,
                      String rawQuery,
                      String apiKey) {
                  String query = cleanAddressQuery(rawQuery);
                  if (query.isBlank()) return;
                  geocodingInProgress = true;
          
                  new Thread(() -> {
                      try {
                          GooglePlaceResolver.Resolution resolution =
                                  GooglePlaceResolver.resolve(query, apiKey);
                          PlaceData place = resolution.place;
                          saveGeocodedEndpoint(target, place, resolution.warning);
                          runOnUiThread(() -> {
                              geocodingInProgress = false;
                              loadState();
                              Toast.makeText(
                                      MainActivity.this,
                                      (TARGET_PICKUP.equals(target) ? "Felrakó" : "Lerakó") +
                                              (resolution.warning.isBlank()
                                                      ? " helye elkészült:\n"
                                                      : " helye BIZONYTALAN – kézi ellenőrzés kell:\n") +
                                              place.label + "\n" + place.coordinate,
                                      resolution.warning.isBlank()
                                              ? Toast.LENGTH_SHORT
                                              : Toast.LENGTH_LONG).show();
                              autoGeocodeMissingPoints();
                          });
                      } catch (Exception error) {
                          runOnUiThread(() -> {
                              geocodingInProgress = false;
                              loadState();
                              Toast.makeText(
                                      MainActivity.this,
                                      cleanQuery(error.getMessage()) +
                                              "\nA Google Maps gombbal kézzel is kiválasztható a hely.",
                                      Toast.LENGTH_LONG).show();
                          });
                      }
                  }, "google-place-resolution").start();
              }
          
              // ===== BLOCK 4: GOOGLE PLACES ÉS GEOCODING =====
          
          
              private void saveGeocodedEndpoint(
                      String target,
                      PlaceData place,
                      String warning) {
                  SharedPreferences.Editor editor =
                          getSharedPreferences(PREFS, MODE_PRIVATE).edit();
                  if (TARGET_PICKUP.equals(target)) {
                      editor.putString(KEY_PICKUP_COORD, place.coordinate)
                              .putString(KEY_PICKUP_LABEL, place.label)
                              .putString(KEY_PICKUP_WARNING, warning == null ? "" : warning);
                  } else if (TARGET_DELIVERY.equals(target)) {
                      editor.putString(KEY_DELIVERY_COORD, place.coordinate)
                              .putString(KEY_DELIVERY_LABEL, place.label)
                              .putString(KEY_DELIVERY_WARNING, warning == null ? "" : warning);
                  }
                  editor.apply();
              }
          
              // ===== BLOCK 5: GOOGLE MAPS KÉZI ELLENŐRZÉS =====
              private void openEndpointInMaps(boolean pickup) {
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String target = pickup ? TARGET_PICKUP : TARGET_DELIVERY;
                  String role = pickup ? "Felrakó" : "Lerakó";
                  String query = preferences.getString(
                          pickup ? KEY_PICKUP_QUERY : KEY_DELIVERY_QUERY, "");
                  String coordinate = normalizeCoordinate(preferences.getString(
                          pickup ? KEY_PICKUP_COORD : KEY_DELIVERY_COORD, ""));
          
                  ReviewPoint point = new ReviewPoint(
                          target, -1, role, query, coordinate == null ? "" : coordinate);
                  if (coordinate != null) {
                      openMapsForPoint(point, coordinate, true);
                      return;
                  }
                  String cleanQuery = cleanAddressQuery(query);
                  if (!cleanQuery.isBlank()) {
                      openMapsForPoint(point, cleanQuery, false);
                      return;
                  }
          
                  preferences.edit()
                          .putString(KEY_PENDING_TARGET, target)
                          .putInt(KEY_PENDING_INDEX, -1)
                          .remove(KEY_PENDING_QUERY)
                          .apply();
                  Intent launchIntent = getPackageManager()
                          .getLaunchIntentForPackage(GOOGLE_MAPS_PACKAGE);
                  if (launchIntent == null) {
                      Toast.makeText(this,
                              "A Google Maps nincs telepítve.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(launchIntent);
                  Toast.makeText(this,
                          role + ": válaszd ki a helyet, majd Megosztás → Driver Assist. " +
                                  "A megosztott helylinkből a koordináta automatikusan bekerül.",
                          Toast.LENGTH_LONG).show();
              }
          
              private void openNextPointForReview() {
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
          
                  ArrayList<ReviewPoint> points = new ArrayList<>();
                  if (!preferences.getBoolean(KEY_PICKUP_COMPLETED, false)) {
                      points.add(new ReviewPoint(
                              TARGET_PICKUP,
                              -1,
                              "Felrakó",
                              preferences.getString(KEY_PICKUP_QUERY, ""),
                              preferences.getString(KEY_PICKUP_COORD, "")));
                  }
          
                  List<String> waypoints = cleanLines(
                          preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> waypointLabels = cleanLines(
                          preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  for (int index = 0; index < waypoints.size(); index++) {
                      points.add(new ReviewPoint(
                              TARGET_WAYPOINT,
                              index,
                              index < waypointLabels.size()
                                      ? waypointLabels.get(index)
                                      : "Köztes " + (index + 1),
                              waypoints.get(index),
                              waypoints.get(index)));
                  }
          
                  points.add(new ReviewPoint(
                          TARGET_DELIVERY,
                          -1,
                          "Lerakó",
                          preferences.getString(KEY_DELIVERY_QUERY, ""),
                          preferences.getString(KEY_DELIVERY_COORD, "")));
          
                  ArrayList<ReviewPoint> usable = new ArrayList<>();
                  for (ReviewPoint point : points) {
                      if (!cleanQuery(point.query).isBlank() ||
                              normalizeCoordinate(point.coordinate) != null) {
                          usable.add(point);
                      }
                  }
          
                  if (usable.isEmpty()) {
                      Toast.makeText(this,
                              "Nincs ellenőrizhető cím.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  int cursor = preferences.getInt(KEY_REVIEW_CURSOR, 0);
                  if (cursor < 0 || cursor >= usable.size()) cursor = 0;
                  ReviewPoint point = usable.get(cursor);
                  preferences.edit()
                          .putInt(KEY_REVIEW_CURSOR, (cursor + 1) % usable.size())
                          .apply();
          
                  String coordinate = normalizeCoordinate(point.coordinate);
                  if (coordinate != null) {
                      openMapsForPoint(point, coordinate, true);
                  } else {
                      openMapsForPoint(point, cleanAddressQuery(point.query), false);
                  }
              }
          
              private void openMapsForPoint(
                      ReviewPoint point,
                      String value,
                      boolean exactCoordinate) {
                  if (value == null || value.isBlank()) return;
          
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putString(KEY_PENDING_TARGET, point.target)
                          .putInt(KEY_PENDING_INDEX, point.index)
                          .putString(KEY_PENDING_QUERY, cleanAddressQuery(point.query))
                          .apply();
          
                  String mapsQuery = exactCoordinate
                          ? value.replace(' ', ',')
                          : value;
                  Intent intent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0?q=" + Uri.encode(mapsQuery)));
                  intent.setPackage(GOOGLE_MAPS_PACKAGE);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
          
                  try {
                      startActivity(intent);
                      Toast.makeText(this,
                              exactCoordinate
                                      ? point.label +
                                              ": a Sygicnek küldendő koordinátát nyitottam meg."
                                      : point.label +
                                              ": még nincs koordináta, ezért a címet kerestem meg.",
                              Toast.LENGTH_LONG).show();
                  } catch (ActivityNotFoundException | SecurityException error) {
                      Toast.makeText(this,
                              "A Google Maps nem nyitható meg.",
                              Toast.LENGTH_LONG).show();
                  }
              }
          
              private void openNewWaypoint() {
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  boolean pickupCompleted = preferences.getBoolean(KEY_PICKUP_COMPLETED, false);
                  boolean pickupReady = !pickupCompleted && normalizeCoordinate(
                          preferences.getString(KEY_PICKUP_COORD, "")) != null;
                  boolean deliveryReady = normalizeCoordinate(
                          preferences.getString(KEY_DELIVERY_COORD, "")) != null;
                  int endpointCount = (pickupReady ? 1 : 0) + (deliveryReady ? 1 : 0);
                  if (endpointCount == 0) {
                      Toast.makeText(this,
                              "Előbb adj meg legalább egy felrakót vagy lerakót a TÉRKÉP gombbal.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  List<String> current = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                  int waypointLimit = 10 - endpointCount;
                  if (current.size() >= waypointLimit) {
                      Toast.makeText(this,
                              "Ennél az útvonalnál legfeljebb " + waypointLimit +
                                      " köztes pont adható meg.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  preferences.edit()
                          .putBoolean(KEY_WAYPOINT_MULTI_MODE, true)
                          .putString(KEY_PENDING_TARGET, TARGET_WAYPOINT)
                          .putInt(KEY_PENDING_INDEX, -1)
                          .remove(KEY_PENDING_QUERY)
                          .apply();
          
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(GOOGLE_MAPS_PACKAGE);
                  if (launchIntent == null) {
                      stopWaypointMode();
                      Toast.makeText(this, "A Google Maps nincs telepítve.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(launchIntent);
                  Toast.makeText(this,
                          "Válaszd ki a helyet a Google Mapsban, majd Megosztás → Driver Assist. Több pont egymás után hozzáadható.",
                          Toast.LENGTH_LONG).show();
              }
          
          
              // BLOCK: ELLENŐRZÖTT ÚTVONAL ÁTADÁSA.
              // FUTURE MODULE: másik Driver Assist készülékre küldés itt ágazik majd el.
              private void openVerifiedRoute() {
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  boolean pickupCompleted = preferences.getBoolean(KEY_PICKUP_COMPLETED, false);
                  String pickup = normalizeCoordinate(preferences.getString(KEY_PICKUP_COORD, ""));
                  String delivery = normalizeCoordinate(preferences.getString(KEY_DELIVERY_COORD, ""));
                  boolean pickupReady = !pickupCompleted && pickup != null;
                  boolean deliveryReady = delivery != null;
          
                  if (!pickupReady && !deliveryReady) {
                      Toast.makeText(this,
                              "Legalább egy Google-koordinátás felrakó vagy lerakó szükséges.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  List<String> waypoints = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                  if (!allCoordinates(waypoints)) {
                      Toast.makeText(this,
                              "A köztes pontok között hibás koordináta maradt.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  List<String> waypointLabels = cleanLines(
                          preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  List<String> orders = normalizedWaypointOrders(preferences, waypoints.size());
          
                  int endpointCount = (pickupReady ? 1 : 0) + (deliveryReady ? 1 : 0);
                  if (waypoints.size() + endpointCount > 10) {
                      Toast.makeText(this,
                              "A Sygicnek legfeljebb 10 pont adható át. Törölj köztes pontot.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  ArrayList<String> points = new ArrayList<>();
                  ArrayList<String> labels = new ArrayList<>();
          
                  if (pickupReady && deliveryReady) {
                      points.add(pickup);
                      labels.add("Felrakó – " + safeLabel(
                              preferences.getString(KEY_PICKUP_LABEL, ""),
                              preferences.getString(KEY_PICKUP_QUERY, ""),
                              "Felrakó"));
                  }
          
                  for (int index : orderedWaypointIndices(orders)) {
                      points.add(normalizeCoordinate(waypoints.get(index)));
                      String waypointLabel = index < waypointLabels.size()
                              ? waypointLabels.get(index)
                              : "Köztes " + (index + 1);
                      labels.add("Köztes " + orders.get(index) + " – " + waypointLabel);
                  }
          
                  if (pickupReady && !deliveryReady) {
                      points.add(pickup);
                      labels.add("Felrakó – " + safeLabel(
                              preferences.getString(KEY_PICKUP_LABEL, ""),
                              preferences.getString(KEY_PICKUP_QUERY, ""),
                              "Felrakó"));
                  }
                  if (deliveryReady) {
                      points.add(delivery);
                      labels.add("Lerakó – " + safeLabel(
                              preferences.getString(KEY_DELIVERY_LABEL, ""),
                              preferences.getString(KEY_DELIVERY_QUERY, ""),
                              "Lerakó"));
                  }
          
                  Intent intent = new Intent(this, PlanSygicActivity.class);
                  intent.putStringArrayListExtra(PlanSygicActivity.EXTRA_ROUTE_POINTS, points);
                  intent.putStringArrayListExtra(PlanSygicActivity.EXTRA_ROUTE_LABELS, labels);
                  startActivity(intent);
              }
          
              private void handleIncomingShare(Intent intent) {
                  if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
          
                  String type = intent.getType();
                  if (type != null && type.startsWith("image/")) {
                      Uri imageUri = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                      intent.setAction(null);
                      if (imageUri == null) {
                          Toast.makeText(this,
                                  "A megosztott kép nem olvasható.",
                                  Toast.LENGTH_LONG).show();
                          return;
                      }
                      processImportedImage(imageUri, "A megosztott kép");
                      return;
                  }
          
                  if (!"text/plain".equals(type)) return;
          
                  String shared = intent.getStringExtra(Intent.EXTRA_TEXT);
                  String subject = intent.getStringExtra(Intent.EXTRA_SUBJECT);
                  intent.setAction(null);
          
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String target = preferences.getString(KEY_PENDING_TARGET, "");
                  if (!TARGET_PICKUP.equals(target) &&
                          !TARGET_DELIVERY.equals(target) &&
                          !TARGET_WAYPOINT.equals(target)) {
                      Toast.makeText(this,
                              "Nincs kijelölt felrakó, lerakó vagy köztes pont. " +
                              "Indítsd a címellenőrzést a programból.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  if (shared == null || shared.isBlank()) {
                      Toast.makeText(this,
                              "A Google Maps nem adott át használható helylinket.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  Toast.makeText(this,
                          "A Google Maps helylink ellenőrzése folyamatban…",
                          Toast.LENGTH_LONG).show();
          
                  final String sharedText = shared;
                  final String sharedSubject = subject == null ? "" : subject;
                  new Thread(() -> resolvePlaceData(
                          sharedText, sharedSubject), "maps-link-resolver").start();
              }
          
              private void resolvePlaceData(
                      String sharedText,
                      String sharedSubject) {
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String pendingQuery = preferences.getString(KEY_PENDING_QUERY, "");
                  try {
                      String directCoordinate = coordinateFromAnyText(sharedText);
                      String finalUrl = "";
                      String body = "";
          
                      if (directCoordinate == null) {
                          List<String> urls = extractUrls(sharedText);
                          for (String rawUrl : urls) {
                              ResolvedUrl resolved = resolveUrl(rawUrl);
                              if (resolved == null) continue;
          
                              finalUrl = resolved.finalUrl;
                              body = resolved.body;
          
                              directCoordinate = coordinateFromAnyText(finalUrl);
                              if (directCoordinate == null) {
                                  directCoordinate = coordinateFromAnyText(body);
                              }
                              if (directCoordinate != null) break;
                          }
                      }
          
                      if (directCoordinate == null) {
                          runOnUiThread(() -> Toast.makeText(
                                  MainActivity.this,
                                  "A megosztott Google Maps linkből nem sikerült biztos koordinátát kiolvasni. " +
                                  "Ne mentsd el a pontot: válassz másik találatot, majd oszd meg újra.",
                                  Toast.LENGTH_LONG).show());
                          return;
                      }
          
                      PlaceData place = buildPlaceData(
                              sharedText, sharedSubject, finalUrl, directCoordinate);
          
                      PlaceValidation validation = GooglePlaceResolver.validate(place, pendingQuery);
                      if (validation.reject) {
                          runOnUiThread(() -> Toast.makeText(
                                  MainActivity.this,
                                  validation.message +
                                          "\nA másik országban lévő koordinátát NEM mentettem.",
                                  Toast.LENGTH_LONG).show());
                          return;
                      }
          
                      boolean saved = saveResolvedPlace(place, validation.warning);
                      if (!saved) return;
          
                      runOnUiThread(() -> {
                          loadState();
                          Toast.makeText(
                                  MainActivity.this,
                                  (validation.warning.isBlank()
                                          ? "Ellenőrzött Google Maps hely mentve:\n"
                                          : "⚠ BIZONYTALAN Google Maps hely mentve. Kézi ellenőrzés szükséges:\n") +
                                  place.label + "\n" + place.coordinate,
                                  Toast.LENGTH_LONG).show();
                          if (getSharedPreferences(PREFS, MODE_PRIVATE)
                                  .getBoolean(KEY_WAYPOINT_MULTI_MODE, false)) {
                              reopenGoogleMapsForMoreWaypoints();
                          }
                      });
                  } catch (Exception error) {
                      runOnUiThread(() -> Toast.makeText(
                              MainActivity.this,
                              "A Google Maps helylink feldolgozása sikertelen: " +
                              cleanQuery(error.getMessage()),
                              Toast.LENGTH_LONG).show());
                  }
              }
          
              private boolean saveResolvedPlace(PlaceData place, String warning) {
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String target = preferences.getString(KEY_PENDING_TARGET, "");
                  int index = preferences.getInt(KEY_PENDING_INDEX, -1);
                  boolean multiMode = preferences.getBoolean(KEY_WAYPOINT_MULTI_MODE, false);
                  SharedPreferences.Editor editor = preferences.edit();
                  boolean keepMapMode = false;
          
                  if (TARGET_PICKUP.equals(target)) {
                      editor.putBoolean(KEY_PICKUP_COMPLETED, false)
                              .putString(KEY_PICKUP_QUERY, place.query)
                              .putString(KEY_PICKUP_COORD, place.coordinate)
                              .putString(KEY_PICKUP_LABEL, place.label)
                              .putString(KEY_PICKUP_WARNING, warning == null ? "" : warning);
                  } else if (TARGET_DELIVERY.equals(target)) {
                      editor.putString(KEY_DELIVERY_QUERY, place.query)
                              .putString(KEY_DELIVERY_COORD, place.coordinate)
                              .putString(KEY_DELIVERY_LABEL, place.label)
                              .putString(KEY_DELIVERY_WARNING, warning == null ? "" : warning);
                  } else if (TARGET_WAYPOINT.equals(target)) {
                      List<String> coordinates = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                      List<String> labels = cleanLines(preferences.getString(KEY_WAYPOINT_LABELS, ""));
                      List<String> orders = normalizedWaypointOrders(preferences, coordinates.size());
                      while (labels.size() < coordinates.size()) labels.add("Köztes " + (labels.size() + 1));
          
                      if (index < 0 && CoordinateTools.containsSameRoundedCoordinate(
                              coordinates, place.coordinate, WAYPOINT_DUPLICATE_DECIMALS)) {
                          runOnUiThread(() -> Toast.makeText(this,
                                  "Ez a koordináta már szerepel az útvonalban.",
                                  Toast.LENGTH_LONG).show());
                          return false;
                      }
                      if (index >= 0 && index < coordinates.size()) {
                          coordinates.set(index, place.coordinate);
                          labels.set(index, place.label);
                      } else {
                          int waypointLimit = preferences.getBoolean(KEY_PICKUP_COMPLETED, false)
                                  ? 9 : 8;
                          if (coordinates.size() >= waypointLimit) {
                              int finalLimit = waypointLimit;
                              runOnUiThread(() -> Toast.makeText(this,
                                      "Legfeljebb " + finalLimit + " köztes pont adható meg.",
                                      Toast.LENGTH_LONG).show());
                              return false;
                          }
                          coordinates.add(place.coordinate);
                          labels.add(place.label);
                          orders.add(String.valueOf(coordinates.size()));
                      }
                      editor.putString(KEY_WAYPOINTS, String.join("\n", coordinates))
                              .putString(KEY_WAYPOINT_LABELS, String.join("\n", labels))
                              .putString(KEY_WAYPOINT_ORDERS, String.join("\n", orders));
                      keepMapMode = multiMode && index < 0;
                  } else {
                      return false;
                  }
          
                  if (keepMapMode) {
                      editor.putString(KEY_PENDING_TARGET, TARGET_WAYPOINT)
                              .putInt(KEY_PENDING_INDEX, -1)
                              .remove(KEY_PENDING_QUERY);
                  } else {
                      editor.remove(KEY_PENDING_TARGET)
                              .remove(KEY_PENDING_INDEX)
                              .remove(KEY_PENDING_QUERY);
                  }
                  editor.apply();
                  return true;
              }
          
              private PlaceData buildPlaceData(
                      String sharedText,
                      String subject,
                      String finalUrl,
                      String coordinate) {
                  List<String> contentLines = new ArrayList<>();
                  for (String line : sharedText.split("\\r?\\n")) {
                      String clean = cleanQuery(line);
                      if (clean.isBlank() || URL_PATTERN.matcher(clean).find()) continue;
                      contentLines.add(clean);
                  }
          
                  String name = cleanQuery(subject);
                  if (name.isBlank() && !contentLines.isEmpty()) {
                      name = contentLines.get(0);
                  }
          
                  String address = "";
                  for (String line : contentLines) {
                      if (!line.equals(name) && GooglePlaceResolver.looksLikeAddress(line)) {
                          address = line;
                          break;
                      }
                  }
                  if (address.isBlank() && contentLines.size() > 1) {
                      address = contentLines.get(1);
                  }
          
                  String city = GooglePlaceResolver.extractCity(address);
                  if (city.isBlank()) {
                      city = GooglePlaceResolver.extractCity(sharedText);
                  }
          
                  String label;
                  if (!name.isBlank() && !city.isBlank() &&
                          !normalized(name).contains(normalized(city))) {
                      label = name + " – " + city;
                  } else if (!name.isBlank()) {
                      label = name;
                  } else if (!city.isBlank()) {
                      label = city;
                  } else {
                      label = "Google Maps hely";
                  }
          
                  String query = !name.isBlank() && !address.isBlank()
                          ? name + ", " + address
                          : (!address.isBlank()
                                  ? address
                                  : (!name.isBlank() ? name : finalUrl));
          
                  String countrySource = address.isBlank() ? sharedText : address;
                  return new PlaceData(
                          cleanQuery(label),
                          cleanQuery(query),
                          coordinate,
                          city,
                          GooglePlaceResolver.extractPostalCode(countrySource),
                          GooglePlaceResolver.extractCountryCode(countrySource));
              }
          
              // ===== BLOCK 6: TALÁLATBIZTONSÁG ÉS ORSZÁG/CÍM ELLENŐRZÉS =====
          
          
              private String cleanAddressQuery(String value) {
                  String clean = cleanQuery(value);
                  if (clean.isBlank()) return "";
          
                  Matcher metadata = INLINE_METADATA_PATTERN.matcher(clean);
                  if (metadata.find()) {
                      clean = cleanQuery(clean.substring(0, metadata.start()));
                  }
          
                  return clean.replaceAll("\\s+,", ",")
                          .replaceAll(",\\s*,+", ", ")
                          .replaceAll("[,;\\s]+$", "")
                          .trim();
              }
          
              private List<String> extractUrls(String value) {
                  ArrayList<String> urls = new ArrayList<>();
                  Matcher matcher = URL_PATTERN.matcher(value == null ? "" : value);
                  while (matcher.find()) {
                      String url = matcher.group();
                      while (url.endsWith(".") || url.endsWith(",") ||
                              url.endsWith(")") || url.endsWith("]")) {
                          url = url.substring(0, url.length() - 1);
                      }
                      urls.add(url);
                  }
                  return urls;
              }
          
              private ResolvedUrl resolveUrl(String rawUrl) throws IOException {
                  URL current = new URL(rawUrl);
                  String body = "";
          
                  for (int attempt = 0; attempt < 10; attempt++) {
                      HttpURLConnection connection =
                              (HttpURLConnection) current.openConnection();
                      connection.setInstanceFollowRedirects(false);
                      connection.setConnectTimeout(10000);
                      connection.setReadTimeout(10000);
                      connection.setRequestProperty(
                              "User-Agent",
                              "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 " +
                              "(KHTML, like Gecko) Chrome/138.0 Mobile Safari/537.36");
                      connection.setRequestProperty("Accept-Language", "hu-HU,hu;q=0.9,en;q=0.7");
          
                      int status = connection.getResponseCode();
                      if (status == 301 || status == 302 || status == 303 ||
                              status == 307 || status == 308) {
                          String location = connection.getHeaderField("Location");
                          connection.disconnect();
                          if (location == null || location.isBlank()) break;
                          current = new URL(current, location);
                          continue;
                      }
          
                      InputStream stream = status >= 400
                              ? connection.getErrorStream()
                              : connection.getInputStream();
                      body = readLimited(stream, 524288);
                      String finalUrl = current.toString();
                      connection.disconnect();
                      return new ResolvedUrl(finalUrl, body);
                  }
          
                  return new ResolvedUrl(current.toString(), body);
              }
          
              private String readLimited(InputStream stream, int maxChars)
                      throws IOException {
                  if (stream == null) return "";
                  StringBuilder result = new StringBuilder();
                  try (BufferedReader reader = new BufferedReader(
                          new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                      char[] buffer = new char[4096];
                      int count;
                      while ((count = reader.read(buffer)) >= 0 &&
                              result.length() < maxChars) {
                          int allowed = Math.min(count, maxChars - result.length());
                          result.append(buffer, 0, allowed);
                      }
                  }
                  return result.toString()
                          .replace("\\u003d", "=")
                          .replace("\\u0026", "&")
                          .replace("\\/", "/");
              }
          
              private String coordinateFromAnyText(String value) {
                  if (value == null || value.isBlank()) return null;
                  String decoded = Uri.decode(value.replace('−', '-'));
          
                  Matcher dataMatcher = DATA_COORDINATE_PATTERN.matcher(decoded);
                  if (dataMatcher.find()) {
                      return normalizeCoordinate(
                              dataMatcher.group(1) + " " + dataMatcher.group(2));
                  }
          
                  Matcher queryMatcher = QUERY_COORDINATE_PATTERN.matcher(decoded);
                  if (queryMatcher.find()) {
                      return normalizeCoordinate(
                              queryMatcher.group(1) + " " + queryMatcher.group(2));
                  }
          
                  Matcher atMatcher = AT_COORDINATE_PATTERN.matcher(decoded);
                  if (atMatcher.find()) {
                      return normalizeCoordinate(
                              atMatcher.group(1) + " " + atMatcher.group(2));
                  }
          
                  for (String line : decoded.split("\\r?\\n")) {
                      String coordinate = normalizeCoordinate(cleanQuery(line));
                      if (coordinate != null) return coordinate;
                  }
                  return null;
              }
          
              private boolean allCoordinates(List<String> values) {
                  for (String value : values) {
                      if (normalizeCoordinate(value) == null) return false;
                  }
                  return true;
              }
          
              private String normalizeCoordinate(String value) {
                  if (value == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          value.replace('−', '-'));
                  if (!matcher.matches()) return null;
          
                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (latitude < -90.0 || latitude > 90.0 ||
                              longitude < -180.0 || longitude > 180.0) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }
          
              private String plain(double value) {
                  return BigDecimal.valueOf(value)
                          .setScale(6, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }
          
              private List<String> cleanLines(String source) {
                  ArrayList<String> result = new ArrayList<>();
                  if (source == null || source.isBlank()) return result;
                  for (String line : source.split("\\r?\\n")) {
                      String clean = cleanQuery(line);
                      if (!clean.isBlank()) result.add(clean);
                  }
                  return result;
              }
          
              private String summarizeQuery(String query) {
                  String clean = cleanAddressQuery(query);
                  if (clean.isBlank()) return "";
                  String company = clean.split(",")[0].trim();
                  String city = GooglePlaceResolver.extractCity(clean);
                  if (!company.isBlank() && !city.isBlank() &&
                          !normalized(company).contains(normalized(city))) {
                      return company + " – " + city;
                  }
                  return company.isBlank() ? clean : company;
              }
          
              private String safeLabel(
                      String label,
                      String query,
                      String fallback) {
                  String cleanLabel = cleanQuery(label);
                  if (!cleanLabel.isBlank()) return cleanLabel;
                  String summarized = summarizeQuery(query);
                  return summarized.isBlank() ? fallback : summarized;
              }
          
              private String normalized(String value) {
                  return Normalizer.normalize(
                                  value == null ? "" : value,
                                  Normalizer.Form.NFD)
                          .replaceAll("\\p{M}+", "")
                          .toLowerCase(Locale.ROOT)
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private String cleanQuery(String value) {
                  if (value == null) return "";
                  return value.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private List<String> collectWaypointOrders(SharedPreferences preferences) {
                  List<String> coordinates = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> existing = normalizedWaypointOrders(preferences, coordinates.size());
                  ArrayList<String> result = new ArrayList<>();
                  HashSet<Integer> used = new HashSet<>();
                  for (int index = 0; index < coordinates.size(); index++) {
                      int value = parseOrder(index < waypointOrderEditors.size()
                              ? waypointOrderEditors.get(index).getText().toString()
                              : (index < existing.size() ? existing.get(index) : ""), index + 1);
                      if (used.contains(value)) {
                          for (int candidate = 1; candidate <= 9; candidate++) {
                              if (!used.contains(candidate)) {
                                  value = candidate;
                                  break;
                              }
                          }
                      }
                      used.add(value);
                      result.add(String.valueOf(value));
                      if (index < waypointOrderEditors.size()) {
                          waypointOrderEditors.get(index).setText(String.valueOf(value));
                      }
                  }
                  return result;
              }
          
              private List<String> normalizedWaypointOrders(
                      SharedPreferences preferences, int count) {
                  List<String> raw = cleanLines(preferences.getString(KEY_WAYPOINT_ORDERS, ""));
                  ArrayList<String> result = new ArrayList<>();
                  HashSet<Integer> used = new HashSet<>();
                  for (int index = 0; index < count; index++) {
                      int value = parseOrder(index < raw.size() ? raw.get(index) : "", index + 1);
                      if (used.contains(value)) {
                          for (int candidate = 1; candidate <= 9; candidate++) {
                              if (!used.contains(candidate)) {
                                  value = candidate;
                                  break;
                              }
                          }
                      }
                      used.add(value);
                      result.add(String.valueOf(value));
                  }
                  return result;
              }
          
              private int parseOrder(String raw, int fallback) {
                  try {
                      int value = Integer.parseInt(raw.trim());
                      return Math.max(1, Math.min(9, value));
                  } catch (Exception ignored) {
                      return Math.max(1, Math.min(9, fallback));
                  }
              }
          
              private List<Integer> orderedWaypointIndices(List<String> orders) {
                  ArrayList<Integer> indices = new ArrayList<>();
                  for (int index = 0; index < orders.size(); index++) indices.add(index);
                  indices.sort(Comparator
                          .comparingInt((Integer index) -> parseOrder(orders.get(index), index + 1))
                          .thenComparingInt(index -> index));
                  return indices;
              }
          
              private void rebuildWaypointRows(
                      List<String> coordinates, List<String> labels, List<String> orders) {
                  waypointRows.removeAllViews();
                  waypointOrderEditors.clear();
                  if (coordinates.isEmpty()) {
                      TextView empty = new TextView(this);
                      empty.setText("Nincs felvett pont.");
                      empty.setTextColor(Color.rgb(160, 168, 178));
                      empty.setTextSize(13);
                      empty.setPadding(dp(6), dp(6), dp(6), dp(6));
                      waypointRows.addView(empty, matchWrap());
                      return;
                  }
                  for (int index = 0; index < coordinates.size(); index++) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(3), 0, dp(3));
          
                      EditText order = new EditText(this);
                      order.setText(index < orders.size() ? orders.get(index) : String.valueOf(index + 1));
                      order.setTextColor(Color.WHITE);
                      order.setTextSize(16);
                      order.setGravity(Gravity.CENTER);
                      order.setSingleLine(true);
                      order.setInputType(InputType.TYPE_CLASS_NUMBER);
                      order.setSelectAllOnFocus(true);
                      order.setBackgroundColor(Color.rgb(55, 63, 74));
                      row.addView(order, new LinearLayout.LayoutParams(dp(42), dp(42)));
                      waypointOrderEditors.add(order);
          
                      TextView description = new TextView(this);
                      String label = index < labels.size() ? labels.get(index) : "Köztes " + (index + 1);
                      description.setText(compactWaypointLabel(label) + "\n" + coordinates.get(index));
                      description.setTextColor(Color.rgb(225, 229, 235));
                      description.setTextSize(13);
                      description.setPadding(dp(9), 0, dp(5), 0);
                      LinearLayout.LayoutParams descriptionParams = new LinearLayout.LayoutParams(
                              0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                      row.addView(description, descriptionParams);
          
                      Button delete = createButton("×", Color.rgb(120, 45, 45));
                      final int pointIndex = index;
                      delete.setOnClickListener(v -> deleteWaypoint(pointIndex));
                      row.addView(delete, new LinearLayout.LayoutParams(dp(42), dp(42)));
                      waypointRows.addView(row, matchWrap());
                  }
              }
          
              private String compactWaypointLabel(String label) {
                  String clean = cleanQuery(label);
                  if (clean.isBlank()) return "Köztes pont";
                  return clean.length() > 72 ? clean.substring(0, 72) + "…" : clean;
              }
          
              private void deleteWaypoint(int index) {
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  List<String> coordinates = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> labels = cleanLines(preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  List<String> orders = normalizedWaypointOrders(preferences, coordinates.size());
                  if (index < 0 || index >= coordinates.size()) return;
                  coordinates.remove(index);
                  if (index < labels.size()) labels.remove(index);
                  if (index < orders.size()) orders.remove(index);
                  preferences.edit()
                          .putString(KEY_WAYPOINTS, String.join("\n", coordinates))
                          .putString(KEY_WAYPOINT_LABELS, String.join("\n", labels))
                          .putString(KEY_WAYPOINT_ORDERS, String.join("\n", orders))
                          .apply();
                  loadState();
              }
          
              private void stopWaypointMode() {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putBoolean(KEY_WAYPOINT_MULTI_MODE, false)
                          .remove(KEY_PENDING_TARGET)
                          .remove(KEY_PENDING_INDEX)
                          .remove(KEY_PENDING_QUERY)
                          .apply();
                  loadState();
                  Toast.makeText(this, "A köztes pontok felvétele befejeződött.", Toast.LENGTH_SHORT).show();
              }
          
              private void reopenGoogleMapsForMoreWaypoints() {
                  Intent launch = getPackageManager().getLaunchIntentForPackage(GOOGLE_MAPS_PACKAGE);
                  if (launch == null) return;
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(launch);
              }
          
              private void resolveMissingWaypointLabels() {
                  if (waypointLabelingInProgress) return;
                  String apiKey = getSavedGoogleApiKey();
                  if (!GOOGLE_API_KEY_PATTERN.matcher(apiKey).matches()) return;
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  List<String> coordinates = cleanLines(preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> labels = cleanLines(preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  while (labels.size() < coordinates.size()) labels.add("");
                  int target = -1;
                  for (int index = 0; index < coordinates.size(); index++) {
                      String label = labels.get(index);
                      if (label.isBlank() || label.matches("(?i)^Köztes \\d+$")) {
                          target = index;
                          break;
                      }
                  }
                  if (target < 0) return;
                  final int index = target;
                  final List<String> mutableLabels = new ArrayList<>(labels);
                  waypointLabelingInProgress = true;
                  new Thread(() -> {
                      try {
                          PlaceData place = GooglePlaceResolver.reverseGeocode(
                                  coordinates.get(index), apiKey);
                          if (place != null) {
                              mutableLabels.set(index, place.label);
                              preferences.edit()
                                      .putString(KEY_WAYPOINT_LABELS, String.join("\n", mutableLabels))
                                      .apply();
                          }
                      } catch (Exception ignored) {
                      }
                      runOnUiThread(() -> {
                          waypointLabelingInProgress = false;
                          loadState();
                          resolveMissingWaypointLabels();
                      });
                  }, "waypoint-reverse-geocode").start();
              }
          
              private void clearAll() {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit().clear().apply();
                  pickupEditor.setText("");
                  deliveryEditor.setText("");
                  loadState();
                  Toast.makeText(this,
                          "Minden cím, címke és koordináta törölve.",
                          Toast.LENGTH_SHORT).show();
              }
          
              private int dp(int value) {
                  return Math.round(value *
                          getResources().getDisplayMetrics().density);
              }
          
              private static final class ReviewPoint {
                  final String target;
                  final int index;
                  final String label;
                  final String query;
                  final String coordinate;
          
                  ReviewPoint(
                          String target,
                          int index,
                          String label,
                          String query,
                          String coordinate) {
                      this.target = target;
                      this.index = index;
                      this.label = label == null ? "Hely" : label;
                      this.query = query == null ? "" : query;
                      this.coordinate = coordinate == null ? "" : coordinate;
                  }
              }
          
              private static final class ResolvedUrl {
                  final String finalUrl;
                  final String body;
          
                  ResolvedUrl(String finalUrl, String body) {
