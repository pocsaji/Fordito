          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF_KEYSTORE
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF_KEYSTORE

      - name: Build signed Driver Assist V055 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect Driver Assist V055 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V055.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V055.aab
          ls -lah artifact

      - name: Upload Driver Assist V055
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V055
          path: |
            artifact/Driver_Assist_V055.apk
            artifact/Driver_Assist_V055.aab
          if-no-files-found: error
