          grep -F 'FUTURE MODULE: helyi adatbázis-keresés' "$MAIN"
          grep -F 'FUTURE MODULE: másik Driver Assist készülékre küldés' "$MAIN"
          grep -F 'pickupCompleted' "$PARSER"
          grep -F 'reverseGeocode' "$RESOLVER"
          grep -F 'Api.isApplicationRunning(5000)' "$PLAN"
          grep -F 'routePoints.isEmpty()' "$PLAN"
          ! grep -R -E 'TomTom|PlanTomTom|V054' app/src/main app/build.gradle.kts settings.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          java_files = list(Path('app/src/main/java/hu/pocsaji/driverassist').glob('*.java'))
          assert len(java_files) == 8, java_files
          for path in java_files:
              source = path.read_text(encoding='utf-8')
              assert source.count('{') == source.count('}'), path
              assert '\t' not in source, path
              in_string = False
              escaped = False
              for index, char in enumerate(source):
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                      elif char == '\n':
                          raise AssertionError(f'unescaped newline in Java string: {path}:{index}')
                  elif char == '"':
                      in_string = True
              assert not in_string, f'unclosed Java string: {path}'
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert manifest.count('<uses-permission') == 1
          assert 'android.permission.INTERNET' in manifest
          forbidden = ['BIND_ACCESSIBILITY_SERVICE','SYSTEM_ALERT_WINDOW','android.permission.CAMERA',
                       'READ_MEDIA_IMAGES','READ_EXTERNAL_STORAGE','WRITE_EXTERNAL_STORAGE']
          for value in forbidden:
              assert value not in manifest, value
          print('DRIVER_ASSIST_V055_MINIMAL_PERMISSION_AUDIT_OK')
          PY

