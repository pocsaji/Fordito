          cat > app/src/main/java/hu/pocsaji/driverassist/CoordinateTools.java <<'EOF_APP_SRC_MAIN_JAVA_HU_POCSAJI_DRIVERASSIST_COORDINATETOOLS_JAVA'
          package hu.pocsaji.driverassist;
          
          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          /** BLOCK: koordináták normalizálása és egyszerű, tizedesjegy-alapú duplikációszűrése. */
          final class CoordinateTools {
              private static final Pattern PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");
          
              private CoordinateTools() { }
          
              static String normalize(String raw) {
                  if (raw == null) return null;
                  Matcher matcher = PATTERN.matcher(raw.replace('−', '-'));
                  if (!matcher.matches()) return null;
                  try {
                      BigDecimal latitude = new BigDecimal(matcher.group(1));
                      BigDecimal longitude = new BigDecimal(matcher.group(2));
                      if (latitude.abs().compareTo(BigDecimal.valueOf(90)) > 0 ||
                              longitude.abs().compareTo(BigDecimal.valueOf(180)) > 0) return null;
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }
          
              static boolean containsSameRoundedCoordinate(
                      List<String> coordinates,
                      String candidate,
                      int decimals) {
                  String candidateKey = comparisonKey(candidate, decimals);
                  if (candidateKey == null || coordinates == null) return false;
                  for (String coordinate : coordinates) {
                      String existingKey = comparisonKey(coordinate, decimals);
                      if (candidateKey.equals(existingKey)) return true;
                  }
                  return false;
              }
          
              private static String comparisonKey(String raw, int decimals) {
                  String normalized = normalize(raw);
                  if (normalized == null) return null;
                  String[] parts = normalized.split(" ");
                  if (parts.length != 2) return null;
                  try {
                      BigDecimal latitude = new BigDecimal(parts[0])
                              .setScale(decimals, RoundingMode.DOWN);
                      BigDecimal longitude = new BigDecimal(parts[1])
                              .setScale(decimals, RoundingMode.DOWN);
                      return latitude.toPlainString() + " " + longitude.toPlainString();
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }
          
              private static String plain(BigDecimal value) {
                  return value.setScale(7, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }
          }
          EOF_APP_SRC_MAIN_JAVA_HU_POCSAJI_DRIVERASSIST_COORDINATETOOLS_JAVA

          cat > app/src/main/java/hu/pocsaji/driverassist/FreightImageProcessor.java <<'EOF_APP_SRC_MAIN_JAVA_HU_POCSAJI_DRIVERASSIST_FREIGHTIMAGEPROCESSOR_JAVA'
          package hu.pocsaji.driverassist;
          
          import android.graphics.Bitmap;
          import android.graphics.Rect;
          
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          
          import java.util.ArrayList;
          import java.util.List;
          
          /** BLOCK: papíros fuvarfotó helyi OCR-feldolgozása. */
          final class FreightImageProcessor {
              interface Callback {
                  void onSuccess(RouteCaptureParser.Result result);
                  void onFailure(String message);
              }
          
              private FreightImageProcessor() { }
          
              static void process(Bitmap bitmap, int lineTolerancePixels, Callback callback) {
                  if (bitmap == null) {
                      callback.onFailure("A fénykép nem olvasható.");
                      return;
                  }
                  TextRecognizer recognizer = TextRecognition.getClient(
                          TextRecognizerOptions.DEFAULT_OPTIONS);
                  InputImage image = InputImage.fromBitmap(bitmap, 0);
                  recognizer.process(image)
                          .addOnSuccessListener(text -> {
                              RouteCaptureParser.Result result = RouteCaptureParser.extract(
                                      sortedLines(text, Math.max(4, lineTolerancePixels)));
                              callback.onSuccess(result);
                          })
                          .addOnFailureListener(error -> callback.onFailure(
                                  error.getMessage() == null
                                          ? "A fénykép szövegfelismerése sikertelen."
                                          : error.getMessage()))
                          .addOnCompleteListener(done -> recognizer.close());
              }
          
              private static List<String> sortedLines(Text visionText, int tolerance) {
                  ArrayList<OcrLine> positioned = new ArrayList<>();
                  for (Text.TextBlock block : visionText.getTextBlocks()) {
                      for (Text.Line line : block.getLines()) {
                          String value = clean(line.getText());
                          Rect box = line.getBoundingBox();
                          if (!value.isEmpty() && box != null) {
                              positioned.add(new OcrLine(value, box.top, box.left));
                          }
                      }
                  }
                  positioned.sort((left, right) -> {
                      if (Math.abs(left.top - right.top) <= tolerance) {
                          return Integer.compare(left.left, right.left);
                      }
                      return Integer.compare(left.top, right.top);
                  });
                  ArrayList<String> lines = new ArrayList<>();
                  for (OcrLine line : positioned) lines.add(line.text);
                  return lines;
              }
          
              private static String clean(String value) {
                  return value == null ? "" : value
                          .replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private static final class OcrLine {
                  final String text;
                  final int top;
                  final int left;
          
                  OcrLine(String text, int top, int left) {
                      this.text = text;
                      this.top = top;
                      this.left = left;
                  }
              }
          }
          EOF_APP_SRC_MAIN_JAVA_HU_POCSAJI_DRIVERASSIST_FREIGHTIMAGEPROCESSOR_JAVA

          cat > app/src/main/java/hu/pocsaji/driverassist/GooglePlaceResolver.java <<'EOF_APP_SRC_MAIN_JAVA_HU_POCSAJI_DRIVERASSIST_GOOGLEPLACERESOLVER_JAVA'
          package hu.pocsaji.driverassist;
          
          import android.net.Uri;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.text.Normalizer;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          /** BLOCK: Google Places/Geocoding keresés és a találatok biztonsági ellenőrzése. */
          final class GooglePlaceResolver {
              private static final Pattern COORDINATE_PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");
              private static final Pattern POSTAL_CITY_PATTERN = Pattern.compile(
                      "\\b(?:[A-Z]{1,3}-)?\\d{4,6}\\s+([^,\\n]+)",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
              private static final Pattern POSTAL_CODE_PATTERN = Pattern.compile(
                      "\\b((?:[A-Z]{1,3}-)?\\d{4,6})\\b",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
              private static final Pattern INLINE_METADATA_PATTERN = Pattern.compile(
                      "(?i)(?:^|[,;])\\s*(?:AUTRE|OTHER|SONSTIGE|PRODUIT|PRODUCT|" +
                      "MARCHANDISE|GOODS|WARE|ARTICLE|COMMODITY|PULPE|BETTERAVE|" +
                      "COMPTE|ACCOUNT|KONTO|REFERENCE|REF|TELEPHONE|TEL|NOTE|" +
                      "COMMENT|MEGJEGYZES)\\b.*$");
              private static final Pattern COUNTRY_TOKEN_PATTERN = Pattern.compile(
                      "(?i)^(?:FR|FRANCE|FRANCIAORSZAG|CH|SUISSE|SCHWEIZ|SWITZERLAND|SVAJC|" +
                      "BE|BELGIQUE|BELGIUM|DE|DEUTSCHLAND|GERMANY|NEMETORSZAG|" +
                      "NL|NEDERLAND|NETHERLANDS|HOLLANDIA|LU|LUXEMBOURG|AT|AUSTRIA|" +
                      "OSTERREICH|AUSZTRIA|IT|ITALIA|ITALY|OLASZORSZAG|ES|ESPANA|SPAIN|" +
                      "SPANYOLORSZAG|HU|HUNGARY|MAGYARORSZAG|PL|POLAND|POLSKA|LENGYELORSZAG|" +
                      "CZ|CZECHIA|CESKO|CSEHORSZAG|SK|SLOVAKIA|SLOVENSKO|SZLOVAKIA|" +
                      "SI|SLOVENIA|SLOVENIJA|HR|CROATIA|HRVATSKA|RO|ROMANIA|BG|BULGARIA|" +
                      "DK|DENMARK|DANIA|SE|SWEDEN|SVERIGE|NO|NORWAY|NORGE|FI|FINLAND|SUOMI|" +
                      "GB|UK|UNITED KINGDOM)$");
          
              private GooglePlaceResolver() { }
          
              static final class Resolution {
                  final PlaceData place;
                  final String warning;
                  Resolution(PlaceData place, String warning) {
                      this.place = place;
                      this.warning = warning == null ? "" : warning;
                  }
              }
          
              static Resolution resolve(String rawQuery, String apiKey) throws Exception {
                  String query = cleanAddressQuery(rawQuery);
                  PlaceData place = null;
                  Exception placesError = null;
                  try { place = searchPlaceWithGooglePlaces(query, apiKey); }
                  catch (Exception error) { placesError = error; }
                  if (place == null && hasStreetAddressEvidence(query)) {
                      place = geocodeStreetAddressWithGoogle(addressOnlyQuery(query), apiKey, query);
                  }
                  if (place == null) {
                      String detail = placesError == null ? "" : cleanQuery(placesError.getMessage());
                      throw new IOException("A Google Places nem talált biztos céget vagy telephelyet." +
                              (detail.isBlank() ? "" : "\n" + detail));
                  }
                  PlaceValidation validation = validateSelectedPlace(place, query);
                  if (validation.reject) {
                      throw new IOException(validation.message +
                              "\nA másik országban lévő koordinátát NEM mentettem.");
                  }
                  return new Resolution(place, validation.warning);
              }
          
              static PlaceValidation validate(PlaceData place, String expected) {
                  return validateSelectedPlace(place, expected);
              }
          
              static PlaceData reverseGeocode(String rawCoordinate, String apiKey) throws Exception {
                  String coordinate = normalizeCoordinate(rawCoordinate);
                  if (coordinate == null) return null;
                  String[] parts = coordinate.split(" ");
                  URL url = new URL(
                          "https://maps.googleapis.com/maps/api/geocode/json" +
                          "?latlng=" + Uri.encode(parts[0] + "," + parts[1]) +
                          "&language=hu&key=" + Uri.encode(apiKey));
                  HttpURLConnection connection = (HttpURLConnection) url.openConnection();
                  connection.setConnectTimeout(12000);
                  connection.setReadTimeout(12000);
                  connection.setRequestProperty("Accept", "application/json");
                  int httpStatus = connection.getResponseCode();
                  InputStream stream = httpStatus >= 400
                          ? connection.getErrorStream()
                          : connection.getInputStream();
                  String body = readLimited(stream, 262144);
                  connection.disconnect();
          
                  JSONObject root = new JSONObject(body);
                  if (httpStatus >= 400 || !"OK".equals(root.optString("status", ""))) {
                      return null;
                  }
                  JSONArray results = root.optJSONArray("results");
                  if (results == null || results.length() == 0) return null;
                  JSONObject result = results.optJSONObject(0);
                  if (result == null) return null;
          
                  String route = googleAddressComponent(result, "route");
                  String city = googleAddressComponent(
                          result, "locality", "postal_town", "administrative_area_level_3");
                  String postal = googleAddressComponent(result, "postal_code");
                  String country = googleAddressComponentShort(result, "country");
                  String formatted = cleanQuery(result.optString("formatted_address", ""));
                  String label;
                  if (!route.isBlank() && !city.isBlank()) label = route + " – " + city;
                  else if (!route.isBlank()) label = route;
                  else if (!city.isBlank()) label = city;
                  else label = formatted.isBlank() ? "Köztes pont" : formatted;
                  return new PlaceData(label, formatted, coordinate, city, postal, country);
              }
          
              private static PlaceData searchPlaceWithGooglePlaces(
                      String query,
                      String apiKey) throws Exception {
                  URL url = new URL(
                          "https://places.googleapis.com/v1/places:searchText");
                  HttpURLConnection connection =
                          (HttpURLConnection) url.openConnection();
                  connection.setRequestMethod("POST");
                  connection.setDoOutput(true);
                  connection.setConnectTimeout(12000);
                  connection.setReadTimeout(12000);
                  connection.setRequestProperty(
                          "Content-Type", "application/json; charset=UTF-8");
                  connection.setRequestProperty("Accept", "application/json");
                  connection.setRequestProperty("X-Goog-Api-Key", apiKey);
                  connection.setRequestProperty(
                          "X-Goog-FieldMask",
                          "places.displayName,places.formattedAddress," +
                          "places.location,places.addressComponents,places.types");
          
                  JSONObject request = new JSONObject();
                  request.put("textQuery", query);
                  request.put("pageSize", 10);
                  String expectedCountry = extractCountryCode(query);
                  if (!expectedCountry.isBlank()) {
                      request.put("regionCode", expectedCountry);
                  }
          
                  byte[] payload = request.toString()
                          .getBytes(StandardCharsets.UTF_8);
                  connection.setFixedLengthStreamingMode(payload.length);
                  connection.getOutputStream().write(payload);
          
                  int httpStatus = connection.getResponseCode();
                  InputStream stream = httpStatus >= 400
                          ? connection.getErrorStream()
                          : connection.getInputStream();
                  String body = readLimited(stream, 524288);
                  connection.disconnect();
          
                  JSONObject root = new JSONObject(body);
                  if (httpStatus >= 400) {
                      JSONObject error = root.optJSONObject("error");
                      String detail = error == null
                              ? "HTTP " + httpStatus
                              : cleanQuery(error.optString(
                                      "message", "HTTP " + httpStatus));
                      throw new IOException("Google Places: " + detail);
                  }
          
                  JSONArray places = root.optJSONArray("places");
                  if (places == null || places.length() == 0) return null;
          
                  PlaceData best = null;
                  int bestScore = Integer.MIN_VALUE;
          
                  for (int index = 0; index < places.length(); index++) {
                      JSONObject result = places.optJSONObject(index);
                      if (result == null) continue;
          
                      JSONObject location = result.optJSONObject("location");
                      if (location == null ||
                              !location.has("latitude") ||
                              !location.has("longitude")) {
                          continue;
                      }
          
                      String coordinate = normalizeCoordinate(
                              location.optDouble("latitude") + " " +
                              location.optDouble("longitude"));
                      if (coordinate == null) continue;
          
                      String country = placesAddressComponentShort(
                              result, "country");
                      if (!expectedCountry.isBlank() &&
                              !country.isBlank() &&
                              !expectedCountry.equals(country)) {
                          continue;
                      }
          
                      String city = placesAddressComponent(
                              result,
                              "locality",
                              "postal_town",
                              "administrative_area_level_3");
                      String postal = placesAddressComponent(
                              result, "postal_code");
                      JSONObject displayNameObject =
                              result.optJSONObject("displayName");
                      String displayName = displayNameObject == null
                              ? ""
                              : cleanQuery(displayNameObject.optString("text", ""));
                      String formatted = cleanQuery(
                              result.optString("formattedAddress", ""));
          
                      String label = displayName;
                      if (label.isBlank()) label = formatted;
                      if (!label.isBlank() && !city.isBlank() &&
                              !normalized(label).contains(normalized(city))) {
                          label = label + " – " + city;
                      }
                      if (label.isBlank()) label = summarizeQuery(query);
          
                      PlaceData candidate = new PlaceData(
                              label,
                              query,
                              coordinate,
                              city,
                              postal,
                              country);
          
                      int score = placeMatchScore(
                              result, candidate, query, displayName, formatted);
                      if (score > bestScore) {
                          bestScore = score;
                          best = candidate;
                      }
                  }
          
                  return best;
              }
          
              private static PlaceData geocodeStreetAddressWithGoogle(
                      String addressQuery,
                      String apiKey,
                      String originalQuery) throws Exception {
                  if (addressQuery.isBlank()) return null;
          
                  URL url = new URL(
                          "https://maps.googleapis.com/maps/api/geocode/json" +
                          "?address=" + Uri.encode(addressQuery) +
                          "&language=hu&key=" + Uri.encode(apiKey));
                  HttpURLConnection connection =
                          (HttpURLConnection) url.openConnection();
                  connection.setConnectTimeout(12000);
                  connection.setReadTimeout(12000);
                  connection.setRequestProperty("Accept", "application/json");
          
                  int httpStatus = connection.getResponseCode();
                  InputStream stream = httpStatus >= 400
                          ? connection.getErrorStream()
                          : connection.getInputStream();
                  String body = readLimited(stream, 262144);
                  connection.disconnect();
          
                  JSONObject root = new JSONObject(body);
                  String status = root.optString("status", "UNKNOWN_ERROR");
                  if (!"OK".equals(status)) {
                      String detail = cleanQuery(
                              root.optString("error_message", ""));
                      throw new IOException(
                              "Google Geocoding: " + status +
                              (detail.isBlank() ? "" : " – " + detail));
                  }
          
                  JSONArray results = root.optJSONArray("results");
                  if (results == null || results.length() == 0) return null;
          
                  JSONObject result = results.getJSONObject(0);
                  JSONObject location = result
                          .getJSONObject("geometry")
                          .getJSONObject("location");
                  String coordinate = normalizeCoordinate(
                          location.getDouble("lat") + " " +
                          location.getDouble("lng"));
                  if (coordinate == null) return null;
          
                  String city = googleAddressComponent(result,
                          "locality", "postal_town",
                          "administrative_area_level_3");
                  String postal = googleAddressComponent(result, "postal_code");
                  String country = googleAddressComponentShort(result, "country");
                  String formatted = cleanQuery(
                          result.optString("formatted_address", addressQuery));
                  String company = extractCompanyHint(originalQuery);
                  String label = company.isBlank()
                          ? formatted
                          : (city.isBlank()
                                  ? company
                                  : company + " – " + city);
          
                  return new PlaceData(
                          label,
                          originalQuery,
                          coordinate,
                          city,
                          postal,
                          country);
              }
          
              private static int placeMatchScore(
                      JSONObject result,
                      PlaceData candidate,
                      String query,
                      String displayName,
                      String formattedAddress) {
                  int score = 0;
                  String expectedCountry = extractCountryCode(query);
                  String expectedPostal = extractPostalCode(query);
                  String expectedCity = extractCity(query);
                  String company = extractCompanyHint(query);
          
                  if (!expectedCountry.isBlank() &&
                          expectedCountry.equals(candidate.countryCode)) {
                      score += 180;
                  }
          
                  if (!expectedPostal.isBlank() &&
                          !candidate.postalCode.isBlank()) {
                      score += postalCodesCompatible(
                              expectedPostal, candidate.postalCode) ? 90 : -25;
                  }
          
                  if (!expectedCity.isBlank() && !candidate.city.isBlank()) {
                      score += sameCity(expectedCity, candidate.city) ? 65 : -15;
                  }
          
                  if (!company.isBlank() && !displayName.isBlank()) {
                      String expectedName = normalized(company);
                      String foundName = normalized(displayName);
                      if (expectedName.equals(foundName)) {
                          score += 260;
                      } else if (expectedName.contains(foundName) ||
                              foundName.contains(expectedName)) {
                          score += 210;
                      } else {
                          score += tokenOverlapScore(company, displayName) * 35;
                      }
                  }
          
                  score += tokenOverlapScore(
                          query, displayName + " " + formattedAddress) * 5;
          
                  if (isAdministrativeOnlyPlace(result)) {
                      score -= 300;
                  }
          
                  return score;
              }
          
              private static int tokenOverlapScore(String expected, String found) {
                  String left = normalized(expected);
                  String right = normalized(found);
                  if (left.isBlank() || right.isBlank()) return 0;
          
                  int score = 0;
                  for (String token : left.split(" ")) {
                      if (token.length() < 3 ||
                              token.matches("\\d+") ||
                              COUNTRY_TOKEN_PATTERN.matcher(
                                      token.toUpperCase(Locale.ROOT)).matches()) {
                          continue;
                      }
                      if ((" " + right + " ").contains(" " + token + " ") ||
                              right.contains(token)) {
                          score++;
                      }
                  }
                  return score;
              }
          
              private static boolean isAdministrativeOnlyPlace(JSONObject result) {
                  JSONArray types = result.optJSONArray("types");
                  if (types == null || types.length() == 0) return false;
          
                  boolean administrative = false;
                  for (int index = 0; index < types.length(); index++) {
                      String type = types.optString(index, "");
                      if (type.equals("locality") ||
                              type.equals("postal_code") ||
                              type.equals("sublocality") ||
                              type.startsWith("sublocality_level_") ||
                              type.startsWith("administrative_area_level_")) {
                          administrative = true;
                          continue;
                      }
                      if (!type.equals("political") &&
                              !type.equals("geocode")) {
                          return false;
                      }
                  }
                  return administrative;
              }
          
              private static String extractCompanyHint(String query) {
                  String clean = cleanAddressQuery(query);
                  if (clean.isBlank()) return "";
          
                  String first = cleanQuery(clean.split(",", 2)[0]);
                  if (first.isBlank() ||
                          POSTAL_CODE_PATTERN.matcher(first).find()) {
                      return "";
                  }
          
                  String normalizedFirst = normalized(first);
                  if (normalizedFirst.matches("^\\d+.*") ||
                          containsStreetWord(normalizedFirst)) {
                      return "";
                  }
                  return first;
              }
          
              private static String addressOnlyQuery(String query) {
                  String clean = cleanAddressQuery(query);
                  String company = extractCompanyHint(clean);
                  if (company.isBlank()) return clean;
          
                  int comma = clean.indexOf(',');
                  if (comma < 0 || comma + 1 >= clean.length()) return clean;
                  return cleanQuery(clean.substring(comma + 1));
              }
          
              private static boolean hasStreetAddressEvidence(String query) {
                  String address = addressOnlyQuery(query);
                  String withoutPostal = POSTAL_CODE_PATTERN.matcher(address)
                          .replaceAll(" ");
                  if (withoutPostal.matches(".*\\b\\d{1,5}[A-Za-z]?\\b.*")) {
                      return true;
                  }
                  return containsStreetWord(normalized(withoutPostal));
              }
          
              private static boolean containsStreetWord(String normalizedValue) {
                  String padded = " " + normalizedValue + " ";
                  String[] words = {
                          " route ", " rue ", " chemin ", " avenue ",
                          " boulevard ", " impasse ", " quai ", " place ",
                          " street ", " road ", " lane ", " drive ",
                          " strasse ", " straße ", " platz ", " weg ",
                          " gasse ", " allee ", " allée ", " laan ",
                          " straat ", " ulica ", " ul ", " utca ", " ut "
                  };
                  for (String word : words) {
                      if (padded.contains(word)) return true;
                  }
                  return false;
              }
          
