          package hu.pocsaji.tomtomkiszolgalo;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          public final class PlanTomTomActivity extends Activity {
              public static final String EXTRA_ROUTE_POINTS =
                      "hu.pocsaji.tomtomkiszolgalo.extra.ROUTE_POINTS";
              public static final String EXTRA_ROUTE_LABELS =
                      "hu.pocsaji.tomtomkiszolgalo.extra.ROUTE_LABELS";
              static final String EXTRA_REQUEST_ID =
                      "hu.pocsaji.tomtomkiszolgalo.extra.REQUEST_ID";
          
              static final String ACTION_START_TOMTOM_AUTOMATION =
                      "hu.pocsaji.tomtomkiszolgalo.action.START_TOMTOM_AUTOMATION";
              static final String AUTOMATION_PREFS = "tomtom_automation_v037";
              static final String KEY_PENDING_ROUTE = "pending_route";
              static final String KEY_PENDING_REQUEST_ID = "pending_request_id";
          
              private static final String TOMTOM_PACKAGE = "com.tomtom.gplay.navapp";
              private static final String VERSION = "V042";
              private static final int MAX_ROUTE_POINTS = 30;
          
              private static final Pattern COORDINATE_PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");
          
              private TextView statusText;
              private final Handler handler = new Handler(Looper.getMainLooper());
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showProgress();
          
                  ArrayList<String> incoming =
                          getIntent().getStringArrayListExtra(EXTRA_ROUTE_POINTS);
                  if (incoming == null || incoming.size() < 2) {
                      fail("Az útvonalhoz legalább felrakó és lerakó szükséges.");
                      return;
                  }
          
                  startTomTomAutomation(incoming);
              }
          
              private void showProgress() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(dp(28), dp(28), dp(28), dp(28));
                  root.setBackgroundColor(Color.rgb(16, 19, 24));
          
                  ProgressBar progress = new ProgressBar(this);
                  root.addView(progress, new LinearLayout.LayoutParams(
                          dp(64), dp(64)));
          
                  statusText = new TextView(this);
                  statusText.setText(
                          "A pontos koordináták átadása a TomTom GO Expert alkalmazásnak…");
                  statusText.setTextColor(Color.WHITE);
                  statusText.setTextSize(18);
                  statusText.setGravity(Gravity.CENTER);
          
                  LinearLayout.LayoutParams statusParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  statusParams.topMargin = dp(22);
                  root.addView(statusText, statusParams);
          
                  setContentView(root);
              }
          
              private void startTomTomAutomation(List<String> incoming) {
                  ArrayList<String> coordinates = new ArrayList<>();
          
                  for (String raw : incoming) {
                      String exact = exactCoordinate(raw);
                      if (exact == null) {
                          fail("Hibás koordináta maradt az útvonalban:\n" + raw);
                          return;
                      }
                      coordinates.add(exact);
                  }
          
                  if (coordinates.size() < 2) {
                      fail("Legalább két koordinátapont szükséges.");
                      return;
                  }
          
                  if (coordinates.size() > MAX_ROUTE_POINTS) {
                      fail("Legfeljebb " + MAX_ROUTE_POINTS +
                              " koordinátapont adható át. Egyetlen pontot sem hagytam el.");
                      return;
                  }
          
                  if (!isAccessibilityServiceEnabled()) {
                      statusText.setText(
                              "Kapcsold be a TomTom Kiszolgáló kisegítő szolgáltatását.");
                      Toast.makeText(this,
                              "A TomTom Kiszolgáló kisegítő szolgáltatása nincs bekapcsolva.",
                              Toast.LENGTH_LONG).show();
                      try {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      } catch (RuntimeException ignored) {
                      }
                      handler.postDelayed(this::finish, 1200L);
                      return;
                  }
          
                  Intent launchIntent =
                          getPackageManager().getLaunchIntentForPackage(TOMTOM_PACKAGE);
                  if (launchIntent == null) {
                      clearPendingRequest();
                      fail("A TomTom GO Expert nincs telepítve vagy nem indítható.");
                      return;
                  }
          
                  String requestId = Long.toString(System.currentTimeMillis());
                  storePendingRequest(coordinates, requestId);
          
                  Intent command = new Intent(ACTION_START_TOMTOM_AUTOMATION);
                  command.setPackage(getPackageName());
                  command.putStringArrayListExtra(EXTRA_ROUTE_POINTS, coordinates);
                  command.putExtra(EXTRA_REQUEST_ID, requestId);
                  sendBroadcast(command);
          
                  launchIntent.addFlags(
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  try {
                      startActivity(launchIntent);
                  } catch (RuntimeException error) {
                      clearPendingRequest();
                      fail("A TomTom GO Expert nem nyitható meg.");
                      return;
                  }
          
                  statusText.setText(
                          coordinates.size() +
                          " koordinátapont átadva. A TomTom kezelése automatikusan indul.");
                  handler.postDelayed(this::finish, 1800L);
              }
          
              private void storePendingRequest(
                      List<String> coordinates,
                      String requestId) {
                  StringBuilder serialized = new StringBuilder();
                  for (String coordinate : coordinates) {
                      if (serialized.length() > 0) serialized.append('\n');
                      serialized.append(coordinate);
                  }
          
                  getSharedPreferences(AUTOMATION_PREFS, MODE_PRIVATE)
                          .edit()
                          .putString(KEY_PENDING_ROUTE, serialized.toString())
                          .putString(KEY_PENDING_REQUEST_ID, requestId)
                          .apply();
              }
          
              private void clearPendingRequest() {
                  getSharedPreferences(AUTOMATION_PREFS, MODE_PRIVATE)
                          .edit()
                          .remove(KEY_PENDING_ROUTE)
                          .remove(KEY_PENDING_REQUEST_ID)
                          .apply();
              }
          
              /*
               * Nem alakítjuk double-lé és nem kerekítjük a két számot.
               * A TomTom koordinátamezőjének megfelelően egy szóközzel választjuk el őket.
               */
              private String exactCoordinate(String raw) {
                  if (raw == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          raw.replace('−', '-'));
                  if (!matcher.matches()) return null;
                  return matcher.group(1) + " " + matcher.group(2);
              }
          
              private boolean isAccessibilityServiceEnabled() {
                  int enabled = Settings.Secure.getInt(
                          getContentResolver(),
                          Settings.Secure.ACCESSIBILITY_ENABLED,
                          0);
                  if (enabled != 1) return false;
          
                  String enabledServices = Settings.Secure.getString(
                          getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (TextUtils.isEmpty(enabledServices)) return false;
          
                  ComponentName expected = new ComponentName(
                          this, TomTomAccessibilityService.class);
                  TextUtils.SimpleStringSplitter splitter =
                          new TextUtils.SimpleStringSplitter(':');
                  splitter.setString(enabledServices);
                  while (splitter.hasNext()) {
                      ComponentName enabledService =
                              ComponentName.unflattenFromString(splitter.next());
                      if (expected.equals(enabledService)) return true;
                  }
                  return false;
              }
          
              private void fail(String message) {
                  if (statusText != null) statusText.setText(message);
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
                  handler.postDelayed(this::finish, 1400L);
              }
          
              private int dp(int value) {
                  return Math.round(value *
                          getResources().getDisplayMetrics().density);
              }
          }
