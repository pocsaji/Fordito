          grep -F 'StopOffPoint.PointType.VIAPOINT' "$PLAN"
          grep -F 'StopOffPoint.PointType.FINISH' "$PLAN"
          grep -F 'Hibakód: ' "$PLAN"
          grep -F 'new BigDecimal("100000")' "$PLAN"
