          grep -F 'private static final String VERSION = "V042";' "$SERVICE"
          grep -F 'flagIncludeNotImportantViews' app/src/main/res/xml/accessibility_service_config.xml
          grep -F 'android:canTakeScreenshot="true"' app/src/main/res/xml/accessibility_service_config.xml

          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('app/src/main/java').rglob('*.java'))
          assert files
          for path in files:
              source = path.read_text(encoding='utf-8')
              assert source.count('{') == source.count('}'), path
              assert '\t' not in source, path
          main = Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java').read_text(encoding='utf-8')
          plan = Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/PlanSygicActivity.java').read_text(encoding='utf-8')
          assert 'PlanSygicActivity.class' in main
          assert 'SYGIC_PREFS = "sygic_settings"' in main
          assert 'GOOGLE_PREFS = "google_maps_settings"' in main
          assert 'KEY_GOOGLE_API_KEY = "google_maps_api_key"' in main
          assert 'maps.googleapis.com/maps/api/geocode/json' in main
