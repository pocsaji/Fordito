              private void handleTomTomWaitStop(
                      AccessibilityNodeInfo root) {
                  AccessibilityNodeInfo addAgain =
                          findBestTomTomControl(root, TT_ADD_TO_ROUTE_LABELS);
                  if (addAgain != null) {
                      addAgain.recycle();
                      tomTomStableGuidanceChecks = 0;
                      return;
                  }
          
                  AccessibilityNodeInfo editable = findTomTomEditable(root);
                  if (editable != null) {
                      editable.recycle();
                      tomTomStableGuidanceChecks = 0;
                      return;
                  }
          
                  AccessibilityNodeInfo menu =
                          findBestTomTomControl(root, TT_MAIN_MENU_LABELS);
                  AccessibilityNodeInfo currentRoute =
                          findBestTomTomControl(root, TT_CURRENT_ROUTE_LABELS);
                  AccessibilityNodeInfo search =
                          findBestTomTomControl(root, TT_SEARCH_LABELS);
                  boolean routeEvidence =
                          menu != null || currentRoute != null || search != null;
                  if (menu != null) menu.recycle();
                  if (currentRoute != null) currentRoute.recycle();
                  if (search != null) search.recycle();
          
                  if (!routeEvidence) {
                      tomTomStableGuidanceChecks = 0;
                      return;
                  }
          
                  tomTomStableGuidanceChecks++;
                  if (tomTomStableGuidanceChecks < 2) return;
          
                  tomTomConfirmedPointCount++;
                  tomTomNextStopIndex--;
                  tomTomAddingStop = false;
          
                  if (tomTomNextStopIndex >= 0) {
                      moveTomTomToStage(TT_STAGE_OPEN_MENU, 350L);
