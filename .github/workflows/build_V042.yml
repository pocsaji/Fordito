              private static final Pattern GOOGLE_API_KEY_PATTERN =
                      Pattern.compile("^[A-Za-z0-9_-]{20,}$");
          
              static final String KEY_PICKUP_QUERY = "pickup_query";
              static final String KEY_PICKUP_COORD = "pickup_coord";
