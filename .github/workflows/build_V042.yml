              private void completeTomTomAutomation() {
                  int count = tomTomRoutePoints.size();
                  clearStoredTomTomRequest();
                  resetTomTomRuntimeState();
                  finishProcessing();
                  Toast.makeText(this,
                          count +
                                  " koordinátapont bevitele és ellenőrzése befejeződött.",
