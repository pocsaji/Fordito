name: Build Sygic Kiszolgalo V042

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Sygic Kiszolgalo V042 one-tap project
        run: |
          mkdir -p app/src/main/java/hu/pocsaji/tomtomkiszolgalo
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://public.repo.sygic.com/repository/maven-sygic-releases/") }
              }
          }
          rootProject.name = "SygicKiszolgaloV042"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties
          
          plugins {
              id("com.android.application")
          }
          
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }
          
          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.sygic.fleet:remote-api:6.4.1")
          }
          
          android {
              namespace = "hu.pocsaji.tomtomkiszolgalo"
              compileSdk = 36
          
              defaultConfig {
                  applicationId = "hu.pocsaji.tomtomkiszolgalo"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 42
                  versionName = "042"
              }
          
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2C74D6</item>
                  <item name="android:navigationBarColor">#101318</item>
                  <item name="android:statusBarColor">#101318</item>
                  <item name="android:windowBackground">#101318</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Sygic Kiszolgáló V042</string>
              <string name="accessibility_service_description">Felrakó és lerakó teljes címének beolvasása, kötelező Google Maps koordináta-ellenőrzés, köztes pontok kezelése és a teljes útvonal közvetlen átadása a Sygic GPS Truck Navigation alkalmazásnak.</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_map.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#17365F"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,29L43,21L65,29L84,21L84,78L65,86L43,78L24,86ZM43,29L31,34L31,75L43,70ZM50,30L50,70L62,76L62,36ZM69,35L69,76L77,73L77,32Z" />
              <path
                  android:fillColor="#E53935"
                  android:pathData="M63,22C52,22 44,30 44,41C44,55 63,74 63,74C63,74 82,55 82,41C82,30 74,22 63,22ZM63,48A7,7 0,1 1,63 34A7,7 0,1 1,63 48Z" />
          </vector>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged|typeViewClicked|typeViewFocused|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="150" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <package android:name="com.tomtom.gplay.navapp" />
                  <package android:name="com.sygic.truck" />
                  <package android:name="com.google.android.apps.maps" />
                  <package android:name="com.android.chrome" />
                  <package android:name="com.sec.android.app.sbrowser" />
              </queries>
          
              <application
