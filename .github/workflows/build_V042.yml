          assert plan.index('PointType.VIAPOINT') < plan.index('PointType.FINISH')
          assert 'coordinate.longitude' in plan and 'coordinate.latitude' in plan
          assert 'RoundingMode.HALF_UP' in plan
          assert 'com.sygic.sdk.remoteapi.ApiItinerary' in plan
          assert 'ApiItinerary.addEntryToItinerary' in plan
          assert 'ApiItinerary.getItineraryList' in plan
          assert 'ApiNavigation.stopNavigation' in plan
          assert 'error.getCode()' in plan
          assert 'index + 1' not in plan
          assert 'Api.getInstance().connect();' in plan
          assert 'MAX_CONNECTION_ATTEMPTS = 3' in plan
          assert 'ACTION_VIEW' not in plan
          print('V042_GOOGLE_GEOCODING_AND_SYGIC_AUDIT_OK')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed Sygic Kiszolgalo V042 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V042 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Sygic_Kiszolgalo_V042.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Sygic_Kiszolgalo_V042.aab
          ls -lah artifact

      - name: Upload Sygic Kiszolgalo V042
        uses: actions/upload-artifact@v4
        with:
          name: Sygic_Kiszolgalo_V042
          path: |
            artifact/Sygic_Kiszolgalo_V042.apk
            artifact/Sygic_Kiszolgalo_V042.aab
          if-no-files-found: error
