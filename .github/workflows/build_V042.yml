              private final BroadcastReceiver tomTomRouteReceiver =
                      new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent == null ||
                              !ACTION_START_TOMTOM_AUTOMATION.equals(
                                      intent.getAction())) {
                          return;
                      }
                      ArrayList<String> points =
                              intent.getStringArrayListExtra(
                                      PlanTomTomActivity.EXTRA_ROUTE_POINTS);
                      String requestId = intent.getStringExtra(
                              PlanTomTomActivity.EXTRA_REQUEST_ID);
                      startTomTomRouteAutomation(points, requestId);
                  }
              };
          
              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  AccessibilityServiceInfo info = getServiceInfo();
                  if (info != null) {
                      info.flags |= AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS |
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS;
                      setServiceInfo(info);
                  }
                  textRecognizer = TextRecognition.getClient(
                          TextRecognizerOptions.DEFAULT_OPTIONS);
                  registerTomTomRouteReceiver();
                  loadPendingTomTomRequest();
                  removeFloatingButton();
                  createFloatingButton();
              }
          
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null || event.getPackageName() == null) return;
          
                  String packageName = event.getPackageName().toString();
                  if (GOOGLE_MAPS_PACKAGE.equals(packageName)) {
                      foregroundPackage = packageName;
                  } else if (!hasPendingMapTarget() &&
                          (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                           event.getEventType() == AccessibilityEvent.TYPE_WINDOWS_CHANGED)) {
                      foregroundPackage = packageName;
                  }
          
                  updateFloatingButton();
                  if (tomTomStage != TT_STAGE_NONE &&
                          (TOMTOM_PACKAGE.equals(packageName) ||
                           isGoogleVoicePackage(packageName))) {
                      scheduleTomTomStep(90L);
                  }
                  if (shareCopyActive) {
                      scheduleShareCopySelection(180L);
                  }
              }
          
              @Override
              public void onInterrupt() {
                  // A visszajelzés megszakítása nem jelenti a szolgáltatás leállását.
              }
          
              @Override
              public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  shareCopyActive = false;
                  if (tomTomReceiverRegistered) {
                      try {
                          unregisterReceiver(tomTomRouteReceiver);
                      } catch (RuntimeException ignored) {
                      }
                      tomTomReceiverRegistered = false;
                  }
                  resetTomTomRuntimeState();
                  removeFloatingButton();
                  if (textRecognizer != null) textRecognizer.close();
                  super.onDestroy();
              }
          
              private void createFloatingButton() {
                  if (floatingButton != null) return;
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
          
                  floatingButton = new Button(this);
                  floatingButton.setText("SG");
                  floatingButton.setTextSize(18);
                  floatingButton.setTextColor(Color.WHITE);
                  floatingButton.setAllCaps(false);
                  setButtonColor(Color.rgb(0, 150, 75));
          
                  floatingParams = new WindowManager.LayoutParams(
                          dp(74),
                          dp(74),
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  floatingParams.gravity = Gravity.END | Gravity.CENTER_VERTICAL;
                  floatingParams.x = dp(14);
                  floatingParams.y = 0;
          
                  floatingButton.setOnClickListener(v -> handleFloatingClick());
                  floatingButton.setOnTouchListener(new DragTouchListener());
          
                  try {
                      windowManager.addView(floatingButton, floatingParams);
                  } catch (RuntimeException error) {
                      floatingButton = null;
                  }
              }
          
              private void removeFloatingButton() {
                  if (windowManager != null && floatingButton != null) {
                      try {
                          windowManager.removeView(floatingButton);
                      } catch (RuntimeException ignored) {
                      }
                  }
                  floatingButton = null;
                  floatingParams = null;
              }
          
              private void updateFloatingButton() {
                  if (floatingButton == null) return;
          
                  if (processing.get()) {
                      floatingButton.setText("…");
                      setButtonColor(Color.rgb(230, 145, 35));
                      return;
                  }
          
                  boolean mapsMode = hasPendingMapTarget() ||
                          GOOGLE_MAPS_PACKAGE.equals(foregroundPackage) ||
                          isGoogleMapsWindowVisible();
          
                  floatingButton.setText(mapsMode ? "+" : "SG");
                  floatingButton.setContentDescription(mapsMode
                          ? "A Google Maps kiválasztott helyének megosztása a Sygic Kiszolgálóval"
                          : "Felrakó és lerakó címének felismerése");
                  setButtonColor(mapsMode
                          ? Color.rgb(44, 116, 214)
                          : Color.rgb(0, 150, 75));
              }
          
              private boolean hasPendingMapTarget() {
                  String target = getSharedPreferences(
                          MainActivity.PREFS, MODE_PRIVATE)
                          .getString(MainActivity.KEY_PENDING_TARGET, "");
                  return MainActivity.TARGET_PICKUP.equals(target) ||
                          MainActivity.TARGET_DELIVERY.equals(target) ||
                          MainActivity.TARGET_WAYPOINT.equals(target);
              }
          
              private boolean isGoogleMapsWindowVisible() {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return false;
          
                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;
                      try {
                          CharSequence packageName = root.getPackageName();
                          if (packageName != null &&
                                  GOOGLE_MAPS_PACKAGE.contentEquals(packageName)) {
                              return true;
                          }
                      } finally {
                          root.recycle();
                      }
                  }
                  return false;
              }
          
              private void setButtonColor(int color) {
                  if (floatingButton == null) return;
                  android.graphics.drawable.GradientDrawable background =
                          new android.graphics.drawable.GradientDrawable();
                  background.setShape(
                          android.graphics.drawable.GradientDrawable.OVAL);
                  background.setColor(color);
                  background.setStroke(dp(2), Color.WHITE);
                  floatingButton.setBackground(background);
              }
          
              private void handleFloatingClick() {
                  boolean pendingMap = hasPendingMapTarget();
                  boolean mapsVisible = isGoogleMapsWindowVisible();
          
                  if (pendingMap) {
                      if (!mapsVisible) {
                          Toast.makeText(this,
                                  "Térj vissza a Google Maps pontos helyadatlapjára, " +
                                  "majd nyomd meg a + gombot.",
                                  Toast.LENGTH_LONG).show();
                          return;
                      }
          
                      String directCoordinate =
                              findCoordinateInGoogleMapsSearchField();
                      if (directCoordinate != null) {
                          if (!processing.compareAndSet(false, true)) return;
                          updateFloatingButton();
                          savePendingCoordinateDirect(directCoordinate);
                          finishProcessing();
                          return;
                      }
          
                      startMapShareFlow();
                      return;
                  }
          
                  if (!processing.compareAndSet(false, true)) return;
          
                  captureMode = CAPTURE_ROUTE;
                  captureToken++;
                  final int token = captureToken;
                  updateFloatingButton();
          
                  handler.postDelayed(() -> {
                      if (processing.get() && captureToken == token) {
                          Toast.makeText(this,
                                  "A fuvarfeladat beolvasása nem fejeződött be. " +
                                  "Az SG gombot visszaállítottam.",
                                  Toast.LENGTH_LONG).show();
                          finishProcessing();
                      }
                  }, 10000L);
          
                  if (floatingButton != null) {
                      floatingButton.setVisibility(View.INVISIBLE);
                  }
                  handler.postDelayed(this::captureScreenshot, 180L);
              }
          
              private String findCoordinateInGoogleMapsSearchField() {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return null;
          
                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;
          
                      try {
                          CharSequence packageName = root.getPackageName();
                          if (packageName == null ||
                                  !GOOGLE_MAPS_PACKAGE.contentEquals(packageName)) {
                              continue;
                          }
          
                          String coordinate = findCoordinateInSearchNode(root);
                          if (coordinate != null) return coordinate;
                      } finally {
                          root.recycle();
                      }
                  }
                  return null;
              }
          
              private String findCoordinateInSearchNode(
                      AccessibilityNodeInfo node) {
                  if (node == null) return null;
          
                  CharSequence className = node.getClassName();
                  String viewId = node.getViewIdResourceName();
                  boolean searchField = node.isEditable() ||
                          (className != null &&
                           className.toString().contains("EditText")) ||
                          (viewId != null &&
                           viewId.toLowerCase(Locale.ROOT).contains("search"));
          
                  if (searchField) {
                      String coordinate = exactCoordinate(node.getText());
                      if (coordinate == null) {
                          coordinate = exactCoordinate(
                                  node.getContentDescription());
                      }
                      if (coordinate != null) return coordinate;
                  }
          
                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          String coordinate = findCoordinateInSearchNode(child);
                          if (coordinate != null) return coordinate;
                      } finally {
                          child.recycle();
                      }
                  }
                  return null;
              }
          
              private String exactCoordinate(CharSequence value) {
                  if (value == null) return null;
                  String candidate = value.toString()
                          .replace('−', '-')
                          .trim();
                  if (candidate.isEmpty()) return null;
          
                  Matcher matcher = COORDINATE_PATTERN.matcher(candidate);
                  if (!matcher.find()) return null;
                  if (!candidate.substring(0, matcher.start()).trim().isEmpty() ||
                          !candidate.substring(matcher.end()).trim().isEmpty()) {
                      return null;
                  }
          
                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (Math.abs(latitude) > 90d ||
                              Math.abs(longitude) > 180d) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }
          
              private void savePendingCoordinateDirect(String coordinate) {
                  SharedPreferences preferences =
                          getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);
                  String target = preferences.getString(
                          MainActivity.KEY_PENDING_TARGET, "");
                  int pendingIndex = preferences.getInt(
                          MainActivity.KEY_PENDING_INDEX, -1);
          
                  SharedPreferences.Editor editor = preferences.edit();
          
                  if (MainActivity.TARGET_PICKUP.equals(target)) {
                      editor.putString(
                                      MainActivity.KEY_PICKUP_COORD, coordinate)
                              .remove(MainActivity.KEY_PICKUP_LABEL);
                  } else if (MainActivity.TARGET_DELIVERY.equals(target)) {
                      editor.putString(
                                      MainActivity.KEY_DELIVERY_COORD, coordinate)
                              .remove(MainActivity.KEY_DELIVERY_LABEL);
                  } else if (MainActivity.TARGET_WAYPOINT.equals(target)) {
                      List<String> coordinates = cleanStoredLines(
                              preferences.getString(
                                      MainActivity.KEY_WAYPOINTS, ""));
                      List<String> labels = cleanStoredLines(
                              preferences.getString(
                                      MainActivity.KEY_WAYPOINT_LABELS, ""));
          
                      while (labels.size() < coordinates.size()) {
                          labels.add("Köztes " + (labels.size() + 1));
                      }
          
                      if (pendingIndex >= 0 &&
                              pendingIndex < coordinates.size()) {
                          coordinates.set(pendingIndex, coordinate);
                      } else {
                          coordinates.add(coordinate);
                          labels.add("Köztes " + coordinates.size());
                      }
          
                      editor.putString(
                                      MainActivity.KEY_WAYPOINTS,
                                      String.join("\n", coordinates))
                              .putString(
                                      MainActivity.KEY_WAYPOINT_LABELS,
                                      String.join("\n", labels));
                  } else {
                      Toast.makeText(this,
                              "Nincs kijelölt felrakó, lerakó vagy köztes pont.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  editor.remove(MainActivity.KEY_PENDING_TARGET)
                          .remove(MainActivity.KEY_PENDING_INDEX)
                          .remove(MainActivity.KEY_PENDING_QUERY)
                          .putInt(MainActivity.KEY_REVIEW_CURSOR, 0)
                          .apply();
          
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(intent);
          
                  Toast.makeText(this,
                          "Koordináta beillesztve: " + coordinate,
                          Toast.LENGTH_LONG).show();
              }
          
              private List<String> cleanStoredLines(String value) {
                  ArrayList<String> lines = new ArrayList<>();
                  if (value == null || value.isBlank()) return lines;
          
                  for (String line : value.split("\\r?\\n")) {
                      String clean = line.trim();
                      if (!clean.isEmpty()) lines.add(clean);
                  }
                  return lines;
              }
          
