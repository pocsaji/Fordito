              private void cancelTomTomAutomation(
                      String message) {
                  boolean active = tomTomStage != TT_STAGE_NONE;
                  clearStoredTomTomRequest();
                  resetTomTomRuntimeState();
                  if (active) finishProcessing();
                  if (message != null &&
                          !message.trim().isEmpty()) {
