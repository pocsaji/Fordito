              private void recognizeTomTomActionScreenshot(
                      ScreenshotResult screenshot,
                      String[] labels,
                      int expectedStage,
                      int generation,
                      Runnable onClicked) {
                  HardwareBuffer buffer = screenshot.getHardwareBuffer();
                  Bitmap hardwareBitmap = null;
                  Bitmap bitmap = null;
                  try {
                      hardwareBitmap = Bitmap.wrapHardwareBuffer(
                              buffer, screenshot.getColorSpace());
                      if (hardwareBitmap != null) {
                          bitmap = hardwareBitmap.copy(
                                  Bitmap.Config.ARGB_8888, false);
                      }
                  } catch (RuntimeException ignored) {
                  } finally {
                      if (hardwareBitmap != null) hardwareBitmap.recycle();
                      buffer.close();
                  }
          
                  if (bitmap == null) {
                      tomTomOcrPending = false;
                      scheduleTomTomStep(350L);
                      return;
                  }
          
                  final Bitmap finalBitmap = bitmap;
                  InputImage image = InputImage.fromBitmap(
                          finalBitmap, 0);
                  textRecognizer.process(image)
                          .addOnSuccessListener(text -> {
                              if (generation != tomTomGeneration ||
                                      tomTomStage != expectedStage) {
                                  return;
                              }
                              TomTomOcrTarget target =
                                      findTomTomOcrTarget(text, labels);
                              if (target == null) {
                                  scheduleTomTomStep(350L);
                                  return;
                              }
                              dispatchTomTomTapAt(
                                      target.x,
                                      target.y,
                                      generation,
                                      expectedStage,
                                      onClicked);
                          })
                          .addOnFailureListener(error ->
                                  scheduleTomTomStep(350L))
                          .addOnCompleteListener(done -> {
                              tomTomOcrPending = false;
                              finalBitmap.recycle();
                          });
              }
          
              private TomTomOcrTarget findTomTomOcrTarget(
                      Text text,
                      String[] labels) {
                  TomTomOcrTarget best = null;
                  for (Text.TextBlock block : text.getTextBlocks()) {
                      for (Text.Line line : block.getLines()) {
                          Rect box = line.getBoundingBox();
                          if (box == null || box.isEmpty()) continue;
          
                          String normalizedText =
                                  normalized(line.getText());
                          int score = tomTomPhraseScore(
                                  normalizedText, labels);
                          if (score <= 0) continue;
                          score += Math.min(300, box.width() / 2);
                          if (best == null || score > best.score) {
                              best = new TomTomOcrTarget(
                                      box.exactCenterX(),
                                      box.exactCenterY(),
                                      score);
                          }
                      }
                  }
                  return best;
              }
          
              private void dispatchTomTomTapAt(
                      float x,
                      float y,
                      int generation,
                      int expectedStage,
                      Runnable onClicked) {
                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path, 0, 80);
                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();
          
                  boolean dispatched = dispatchGesture(
                          gesture,
                          new GestureResultCallback() {
                              @Override
                              public void onCompleted(
                                      GestureDescription gestureDescription) {
                                  if (generation == tomTomGeneration &&
                                          expectedStage == tomTomStage) {
                                      onClicked.run();
                                  }
                              }
          
                              @Override
                              public void onCancelled(
                                      GestureDescription gestureDescription) {
                                  scheduleTomTomStep(350L);
                              }
                          },
                          handler);
                  if (!dispatched) {
                      scheduleTomTomStep(350L);
                  }
              }
          
