              private AccessibilityNodeInfo findTomTomEditable(
                      AccessibilityNodeInfo root) {
                  TomTomNodeScore best = new TomTomNodeScore();
                  collectBestTomTomEditable(root, best, 0);
                  return best.node;
              }
          
              private void collectBestTomTomEditable(
                      AccessibilityNodeInfo node,
                      TomTomNodeScore best,
                      int depth) {
                  if (node == null || depth > 70) return;
          
                  if (node.isVisibleToUser() && node.isEnabled()) {
                      String className = node.getClassName() == null
                              ? ""
                              : node.getClassName().toString();
                      boolean editable = node.isEditable() ||
                              className.contains("EditText") ||
                              hasTomTomAction(
                                      node,
                                      AccessibilityNodeInfo.ACTION_SET_TEXT);
                      if (editable) {
                          Rect bounds = new Rect();
                          node.getBoundsInScreen(bounds);
                          int score = Math.max(0, bounds.width()) +
                                  Math.max(0, bounds.height()) * 2;
                          if (node.isFocused()) score += 1200;
                          if (node.isEditable()) score += 800;
                          if (bounds.top < getResources()
                                  .getDisplayMetrics().heightPixels / 2) {
                              score += 400;
                          }
                          updateTomTomBest(best, node, score);
                      }
                  }
          
                  for (int index = 0;
                       index < node.getChildCount();
                       index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          collectBestTomTomEditable(
                                  child, best, depth + 1);
                      } finally {
                          child.recycle();
                      }
                  }
              }
          
              private AccessibilityNodeInfo findBestTomTomControl(
                      AccessibilityNodeInfo root,
                      String[] labels) {
                  TomTomNodeScore best = new TomTomNodeScore();
                  collectBestTomTomControl(root, labels, best, 0);
                  return best.node;
              }
          
              private void collectBestTomTomControl(
                      AccessibilityNodeInfo node,
                      String[] labels,
                      TomTomNodeScore best,
                      int depth) {
                  if (node == null || depth > 70) return;
          
                  if (node.isVisibleToUser() && node.isEnabled() &&
                          !node.isEditable()) {
                      String descriptor = normalized(
                              tomTomNodeDescriptor(node));
                      int phraseScore = tomTomPhraseScore(
                              descriptor, labels);
                      if (phraseScore > 0) {
                          int score = phraseScore;
                          if (node.isClickable() ||
                                  hasTomTomAction(
                                          node,
                                          AccessibilityNodeInfo.ACTION_CLICK)) {
                              score += 600;
                          }
                          Rect bounds = new Rect();
                          node.getBoundsInScreen(bounds);
                          score += Math.min(
                                  300, Math.max(0, bounds.width()) / 3);
                          updateTomTomBest(best, node, score);
                      }
                  }
          
                  for (int index = 0;
                       index < node.getChildCount();
                       index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          collectBestTomTomControl(
                                  child, labels, best, depth + 1);
                      } finally {
                          child.recycle();
                      }
                  }
              }
          
              private int tomTomPhraseScore(
                      String descriptor,
                      String[] labels) {
                  if (descriptor == null || descriptor.isEmpty()) return 0;
                  int best = 0;
                  for (String label : labels) {
                      String normalizedLabel = normalized(label);
                      if (normalizedLabel.isEmpty()) continue;
                      if (descriptor.equals(normalizedLabel)) {
                          best = Math.max(best, 2200);
                      } else if (descriptor.startsWith(
                              normalizedLabel + " ") ||
                              descriptor.endsWith(
                                      " " + normalizedLabel)) {
                          best = Math.max(best, 1700);
                      } else if (descriptor.contains(
                              " " + normalizedLabel + " ")) {
                          best = Math.max(best, 1300);
                      } else if (normalizedLabel.length() >= 6 &&
                              descriptor.contains(normalizedLabel)) {
                          best = Math.max(best, 900);
                      }
                  }
                  return best;
              }
          
              private String findVisibleLabel(
                      AccessibilityNodeInfo root,
                      String[] labels) {
                  AccessibilityNodeInfo node =
                          findBestTomTomControl(root, labels);
                  if (node == null) return null;
                  try {
                      String text = clean(tomTomNodeDescriptor(node));
                      return text.isEmpty() ? labels[0] : text;
                  } finally {
                      node.recycle();
                  }
              }
          
              private boolean isGoogleVoicePackage(String packageName) {
                  return "com.google.android.googlequicksearchbox".equals(packageName) ||
                          "com.google.android.inputmethod.latin".equals(packageName) ||
                          "com.google.android.as".equals(packageName);
              }

              private boolean dismissGoogleVoiceErrorDialogIfPresent() {
                  if (tomTomVoiceDialogDismissals >= 2) return false;
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return false;

                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;
                      try {
                          CharSequence packageValue = root.getPackageName();
                          String packageName = packageValue == null
                                  ? ""
                                  : packageValue.toString();
                          if (!isGoogleVoicePackage(packageName)) continue;
                          if (!containsAnyTomTomLabel(
                                  root, TT_VOICE_ERROR_LABELS, 0)) {
                              continue;
                          }
                          tomTomVoiceDialogDismissals++;
                          return performGlobalAction(GLOBAL_ACTION_BACK);
                      } finally {
                          root.recycle();
                      }
                  }
                  return false;
              }

              private boolean containsAnyTomTomLabel(
                      AccessibilityNodeInfo node,
                      String[] labels,
                      int depth) {
                  if (node == null || depth > 70) return false;
                  if (node.isVisibleToUser() &&
                          tomTomPhraseScore(
                                  normalized(tomTomNodeDescriptor(node)),
                                  labels) > 0) {
                      return true;
                  }
                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          if (containsAnyTomTomLabel(
                                  child, labels, depth + 1)) {
                              return true;
                          }
                      } finally {
                          child.recycle();
                      }
                  }
                  return false;
              }

              private boolean scrollTomTomForward(
                      AccessibilityNodeInfo root) {
                  TomTomNodeScore best = new TomTomNodeScore();
                  collectBestTomTomScrollable(root, best, 0);
                  AccessibilityNodeInfo scrollable = best.node;
                  if (scrollable == null) return false;
                  try {
                      return scrollable.performAction(
                              AccessibilityNodeInfo.ACTION_SCROLL_FORWARD);
                  } catch (RuntimeException ignored) {
                      return false;
                  } finally {
                      scrollable.recycle();
                  }
              }

              private void collectBestTomTomScrollable(
                      AccessibilityNodeInfo node,
                      TomTomNodeScore best,
                      int depth) {
                  if (node == null || depth > 70) return;
                  if (node.isVisibleToUser() && node.isEnabled() &&
                          (node.isScrollable() ||
                           hasTomTomAction(
                                   node,
                                   AccessibilityNodeInfo.ACTION_SCROLL_FORWARD))) {
                      Rect bounds = new Rect();
                      node.getBoundsInScreen(bounds);
                      int score = Math.max(0, bounds.width()) +
                              Math.max(0, bounds.height()) * 2;
                      updateTomTomBest(best, node, score);
                  }
                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          collectBestTomTomScrollable(
                                  child, best, depth + 1);
                      } finally {
                          child.recycle();
                      }
                  }
              }

              private boolean looksLikeCoordinateEditor(
                      AccessibilityNodeInfo root) {
                  AccessibilityNodeInfo editable = findTomTomEditable(root);
                  if (editable == null) return false;
                  try {
                      String descriptor = normalized(
                              tomTomNodeDescriptor(editable));
                      return tomTomPhraseScore(
                              descriptor, TT_LAT_LONG_LABELS) > 0 ||
                              descriptor.contains("49.5000") ||
                              descriptor.contains("123.5000") ||
                              descriptor.contains("GPS");
                  } finally {
                      editable.recycle();
                  }
              }
          
              private AccessibilityNodeInfo findTomTomCoordinateSuggestion(
                      AccessibilityNodeInfo root,
                      AccessibilityNodeInfo editable) {
                  Rect editBounds = new Rect();
                  if (editable != null) {
                      editable.getBoundsInScreen(editBounds);
                  } else {
                      editBounds.set(0, 0,
                              getResources().getDisplayMetrics().widthPixels,
                              dp(160));
                  }
          
                  TomTomNodeScore best = new TomTomNodeScore();
                  collectTomTomCoordinateSuggestion(
                          root, editBounds, best, 0);
                  return best.node;
              }
          
              private void collectTomTomCoordinateSuggestion(
                      AccessibilityNodeInfo node,
                      Rect editBounds,
                      TomTomNodeScore best,
                      int depth) {
                  if (node == null || depth > 70) return;
          
                  if (node.isVisibleToUser() && node.isEnabled() &&
                          !node.isEditable()) {
                      Rect bounds = new Rect();
                      node.getBoundsInScreen(bounds);
                      String descriptor = clean(
                              tomTomNodeDescriptor(node));
                      String normalizedDescriptor =
                              normalized(descriptor);
          
                      boolean actionable = node.isClickable() ||
                              hasTomTomAction(
                                      node,
                                      AccessibilityNodeInfo.ACTION_CLICK);
                      boolean belowEditor =
                              bounds.top >= editBounds.bottom - dp(4);
                      boolean sensibleSize =
                              bounds.width() >= getResources()
                                      .getDisplayMetrics().widthPixels / 3 &&
                              bounds.height() >= dp(28);
                      boolean excluded =
                              tomTomPhraseScore(
                                      normalizedDescriptor,
                                      TT_SEARCH_TYPE_LABELS) > 0 ||
                              tomTomPhraseScore(
                                      normalizedDescriptor,
                                      TT_LAT_LONG_LABELS) > 0 ||
                              tomTomPhraseScore(
                                      normalizedDescriptor,
                                      TT_SEARCH_LABELS) > 0 ||
                              tomTomPhraseScore(
                                      normalizedDescriptor,
                                      TT_DRIVE_LABELS) > 0;
          
                      boolean coordinateMatch =
                              coordinateTextEquivalent(
                                      descriptor, tomTomPendingCoordinate);
                      if (actionable && belowEditor &&
                              sensibleSize && !descriptor.isEmpty() &&
                              !excluded && coordinateMatch) {
                          int score = 3500 -
                                  Math.min(900,
                                          Math.max(0,
                                                  bounds.top - editBounds.bottom));
                          if (normalizedDescriptor.contains("GPS") ||
                                  normalizedDescriptor.contains("COORD") ||
                                  normalizedDescriptor.contains("LATITUDE") ||
                                  normalizedDescriptor.contains("LONGITUDE")) {
                              score += 500;
                          }
                          updateTomTomBest(best, node, score);
                      }
                  }
          
                  for (int index = 0;
                       index < node.getChildCount();
                       index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          collectTomTomCoordinateSuggestion(
                                  child, editBounds, best, depth + 1);
                      } finally {
                          child.recycle();
                      }
                  }
              }
          
              private boolean coordinateTextEquivalent(
                      String visibleText,
                      String expected) {
                  BigDecimal[] visible = parseTomTomCoordinatePair(visibleText);
                  BigDecimal[] target = parseTomTomCoordinatePair(expected);
                  return visible != null && target != null &&
                          visible[0].compareTo(target[0]) == 0 &&
                          visible[1].compareTo(target[1]) == 0;
              }
          
              private BigDecimal[] parseTomTomCoordinatePair(String value) {
                  if (value == null) return null;
                  String safe = value
                          .replace('−', '-')
                          .replace('\u00A0', ' ');
          
                  Matcher matcher = COORDINATE_PATTERN.matcher(safe);
                  if (matcher.find()) {
                      try {
                          return new BigDecimal[] {
                                  new BigDecimal(matcher.group(1)),
                                  new BigDecimal(matcher.group(2))
                          };
                      } catch (NumberFormatException ignored) {
                          return null;
                      }
                  }
          
                  Matcher commaMatcher =
                          COORDINATE_COMMA_DECIMAL_PATTERN.matcher(safe);
                  if (!commaMatcher.find()) return null;
                  try {
                      return new BigDecimal[] {
                              new BigDecimal(
                                      commaMatcher.group(1).replace(',', '.')),
                              new BigDecimal(
                                      commaMatcher.group(2).replace(',', '.'))
                      };
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }
          
              private String tomTomNodeText(
                      AccessibilityNodeInfo node) {
                  CharSequence text = node.getText();
                  return text == null ? "" : text.toString();
              }
          
              private String tomTomNodeDescriptor(
                      AccessibilityNodeInfo node) {
                  StringBuilder result = new StringBuilder();
                  appendTomTomDescriptor(result, node.getText());
                  appendTomTomDescriptor(
                          result, node.getContentDescription());
                  appendTomTomDescriptor(result, node.getHintText());
                  appendTomTomDescriptor(
                          result, node.getViewIdResourceName());
                  return result.toString();
              }
          
              private void appendTomTomDescriptor(
                      StringBuilder result,
                      CharSequence value) {
                  if (value == null || value.length() == 0) return;
                  if (result.length() > 0) result.append(' ');
                  result.append(value);
              }
          
              private boolean setTomTomNodeText(
                      AccessibilityNodeInfo node,
                      String value) {
                  try {
                      node.performAction(
                              AccessibilityNodeInfo.ACTION_FOCUS);
                      node.performAction(
                              AccessibilityNodeInfo.ACTION_CLICK);
                      Bundle arguments = new Bundle();
                      arguments.putCharSequence(
                              AccessibilityNodeInfo
                                      .ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                              value);
                      return node.performAction(
                              AccessibilityNodeInfo.ACTION_SET_TEXT,
                              arguments);
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }
          
              private boolean performTomTomImeEnter(
                      AccessibilityNodeInfo editable) {
                  if (Build.VERSION.SDK_INT <
                          Build.VERSION_CODES.R) {
                      return false;
                  }
                  try {
                      if (!editable.isEditable() || !editable.isFocused() ||
                              !hasTomTomAction(
                                      editable,
                                      AccessibilityNodeInfo.AccessibilityAction
                                              .ACTION_IME_ENTER.getId())) {
                          return false;
                      }
                      return editable.performAction(
                              AccessibilityNodeInfo.AccessibilityAction
                                      .ACTION_IME_ENTER.getId());
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }
          
              private boolean clickTomTomNode(
                      AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current =
                          AccessibilityNodeInfo.obtain(node);
                  try {
                      for (int depth = 0;
                           depth < 10 && current != null;
                           depth++) {
                          if (current.isVisibleToUser() &&
                                  current.isEnabled() &&
                                  (current.isClickable() ||
                                   hasTomTomAction(
                                           current,
                                           AccessibilityNodeInfo.ACTION_CLICK)) &&
                                  current.performAction(
                                          AccessibilityNodeInfo.ACTION_CLICK)) {
                              return true;
                          }
                          AccessibilityNodeInfo parent =
                                  current.getParent();
                          current.recycle();
                          current = parent;
                      }
                      return false;
                  } finally {
                      if (current != null) current.recycle();
                  }
              }
          
              private boolean hasTomTomAction(
                      AccessibilityNodeInfo node,
                      int actionId) {
                  for (AccessibilityNodeInfo.AccessibilityAction action :
                          node.getActionList()) {
                      if (action != null &&
                              action.getId() == actionId) {
                          return true;
                      }
                  }
                  return false;
              }
          
              private void updateTomTomBest(
                      TomTomNodeScore best,
                      AccessibilityNodeInfo node,
                      int score) {
                  if (score <= best.score) return;
                  if (best.node != null) best.node.recycle();
                  best.node = AccessibilityNodeInfo.obtain(node);
                  best.score = score;
              }
          
              private void requestTomTomCoordinateOcrClick(
                      int expectedStage,
                      Runnable onClicked) {
                  if (tomTomOcrPending ||
                          Build.VERSION.SDK_INT < Build.VERSION_CODES.R ||
                          textRecognizer == null ||
                          tomTomStage != expectedStage ||
                          tomTomPendingCoordinate == null) {
                      return;
                  }

                  tomTomOcrPending = true;
                  final int generation = tomTomGeneration;
                  takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          getMainExecutor(),
                          new TakeScreenshotCallback() {
                              @Override
                              public void onSuccess(
                                      ScreenshotResult screenshot) {
                                  HardwareBuffer buffer =
                                          screenshot.getHardwareBuffer();
                                  Bitmap hardwareBitmap = null;
                                  Bitmap bitmap = null;
                                  try {
                                      hardwareBitmap = Bitmap.wrapHardwareBuffer(
                                              buffer,
                                              screenshot.getColorSpace());
                                      if (hardwareBitmap != null) {
                                          bitmap = hardwareBitmap.copy(
                                                  Bitmap.Config.ARGB_8888,
                                                  false);
                                      }
                                  } catch (RuntimeException ignored) {
                                  } finally {
                                      if (hardwareBitmap != null) {
                                          hardwareBitmap.recycle();
                                      }
                                      buffer.close();
                                  }

                                  if (bitmap == null) {
                                      tomTomOcrPending = false;
                                      scheduleTomTomStep(350L);
                                      return;
                                  }

                                  final Bitmap finalBitmap = bitmap;
                                  textRecognizer.process(
                                          InputImage.fromBitmap(finalBitmap, 0))
                                          .addOnSuccessListener(text -> {
                                              if (generation != tomTomGeneration ||
                                                      tomTomStage != expectedStage) {
                                                  return;
                                              }
                                              TomTomOcrTarget target =
                                                      findTomTomCoordinateOcrTarget(text);
                                              if (target == null) {
                                                  scheduleTomTomStep(350L);
                                                  return;
                                              }
                                              dispatchTomTomTapAt(
                                                      target.x,
                                                      target.y,
                                                      generation,
                                                      expectedStage,
                                                      onClicked);
                                          })
                                          .addOnFailureListener(error ->
                                                  scheduleTomTomStep(350L))
                                          .addOnCompleteListener(done -> {
                                              tomTomOcrPending = false;
                                              finalBitmap.recycle();
                                          });
                              }

                              @Override
                              public void onFailure(int errorCode) {
                                  tomTomOcrPending = false;
                                  scheduleTomTomStep(350L);
                              }
                          });
              }

              private TomTomOcrTarget findTomTomCoordinateOcrTarget(
                      Text text) {
                  TomTomOcrTarget best = null;
                  for (Text.TextBlock block : text.getTextBlocks()) {
                      for (Text.Line line : block.getLines()) {
                          Rect box = line.getBoundingBox();
                          if (box == null || box.isEmpty()) continue;
                          if (!coordinateTextEquivalent(
                                  line.getText(),
                                  tomTomPendingCoordinate)) {
                              continue;
                          }
                          int score = 3000 + Math.min(500, box.width());
                          if (best == null || score > best.score) {
                              best = new TomTomOcrTarget(
                                      box.exactCenterX(),
                                      box.exactCenterY(),
                                      score);
                          }
                      }
                  }
                  return best;
              }

