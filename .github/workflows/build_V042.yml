              private void promptForGoogleApiKeyIfMissing() {
                  if (googleApiPromptShown) return;
                  String current = getSavedGoogleApiKey();
                  if (!current.isEmpty()) {
                      refreshGoogleApiButton();
                      promptForSygicDeviceIdIfMissing();
                      return;
                  }
                  googleApiPromptShown = true;
                  showGoogleApiKeyDialog(true);
              }

              private String getSavedGoogleApiKey() {
                  String value = getSharedPreferences(GOOGLE_PREFS, MODE_PRIVATE)
                          .getString(KEY_GOOGLE_API_KEY, "");
                  return value == null ? "" : value.trim();
              }

              private void refreshGoogleApiButton() {
                  if (googleApiButton == null) return;
                  String key = getSavedGoogleApiKey();
                  if (key.isEmpty()) {
                      googleApiButton.setText("GOOGLE API-KULCS MEGADÁSA");
                  } else {
                      googleApiButton.setText("GOOGLE API-KULCS: BEÁLLÍTVA – MÓDOSÍTÁS");
                  }
              }

              private void showGoogleApiKeyDialog(boolean firstSetup) {
                  EditText input = new EditText(this);
                  input.setSingleLine(true);
                  input.setTextSize(18);
                  input.setTextColor(Color.WHITE);
                  input.setHintTextColor(Color.rgb(125, 133, 145));
                  input.setHint("AIza…");
                  input.setInputType(InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD |
                          InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  input.setPadding(dp(14), dp(12), dp(14), dp(12));
                  input.setBackgroundColor(Color.rgb(35, 41, 50));

                  String current = getSavedGoogleApiKey();
                  if (!current.isEmpty()) {
                      input.setText(current);
                      input.setSelection(input.length());
                  }

                  LinearLayout holder = new LinearLayout(this);
                  holder.setPadding(dp(20), dp(4), dp(20), 0);
                  holder.addView(input, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  AlertDialog dialog = new AlertDialog.Builder(this)
                          .setTitle("Google Maps API-kulcs")
                          .setMessage(
                                  "Egyszer kell megadni. A kulcs csak ezen a telefonon, " +
                                  "helyben kerül elmentésre, és később módosítható.")
                          .setView(holder)
                          .setPositiveButton("MENTÉS", null)
                          .setNegativeButton(firstSetup ? "KÉSŐBB" : "MÉGSE",
                                  (closed, which) -> {
                                      if (firstSetup) {
                                          promptForSygicDeviceIdIfMissing();
                                      }
                                  })
                          .create();

                  dialog.setOnShowListener(shown -> dialog
                          .getButton(AlertDialog.BUTTON_POSITIVE)
                          .setOnClickListener(v -> {
                              String value = input.getText().toString().trim();
                              if (!GOOGLE_API_KEY_PATTERN.matcher(value).matches()) {
