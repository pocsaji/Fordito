              private void handleTomTomWaitGuidance(
                      AccessibilityNodeInfo root) {
                  if (hasSearchOrRoutePlanningControls(root)) {
                      tomTomStableGuidanceChecks = 0;
                      return;
                  }
          
                  tomTomStableGuidanceChecks++;
                  if (tomTomStableGuidanceChecks >= 3 &&
                          tomTomConfirmedPointCount ==
                                  tomTomRoutePoints.size()) {
                      completeTomTomAutomation();
                  }
              }
          
              private boolean hasSearchOrRoutePlanningControls(
                      AccessibilityNodeInfo root) {
                  AccessibilityNodeInfo editable = findTomTomEditable(root);
                  if (editable != null) {
                      editable.recycle();
                      return true;
                  }
                  AccessibilityNodeInfo add =
                          findBestTomTomControl(root, TT_ADD_TO_ROUTE_LABELS);
                  if (add != null) {
                      add.recycle();
                      return true;
                  }
                  AccessibilityNodeInfo drive =
                          findBestTomTomControl(root, TT_DRIVE_LABELS);
                  if (drive != null) {
                      drive.recycle();
                      return true;
                  }
                  return false;
              }
          
