                      menu.recycle();
                      if (clicked) {
                          moveTomTomToStage(
                                  TT_STAGE_OPEN_CURRENT_ROUTE, 500L);
                          return;
                      }
                  }
          
                  /*
                   * A GO Expert Androidon az első Vezetés a route selection
                   * képernyőt nyitja meg, a második indítja az útmutatást.
                   * Ha ezen a köztes képernyőn még nincs Főmenü, belépünk az
                   * útmutatás nézetbe; onnan az Aktuális útvonal menü elérhető.
                   */
                  AccessibilityNodeInfo drive =
                          findBestTomTomControl(root, TT_DRIVE_LABELS);
                  if (drive != null && tomTomAttempts >= 3) {
                      boolean clicked = clickTomTomNode(drive);
                      drive.recycle();
                      if (clicked) {
