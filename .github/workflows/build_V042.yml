              static final String KEY_DELIVERY_QUERY = "delivery_query";
              static final String KEY_DELIVERY_COORD = "delivery_coord";
              static final String KEY_DELIVERY_LABEL = "delivery_label";
          
              static final String KEY_WAYPOINTS = "waypoints";
              static final String KEY_WAYPOINT_LABELS = "waypoint_labels";
          
              static final String KEY_PENDING_TARGET = "pending_target";
              static final String KEY_PENDING_INDEX = "pending_index";
              static final String KEY_PENDING_QUERY = "pending_query";
              static final String KEY_REVIEW_CURSOR = "review_cursor";
          
              static final String TARGET_PICKUP = "pickup";
              static final String TARGET_DELIVERY = "delivery";
              static final String TARGET_WAYPOINT = "waypoint";
          
              private static final Pattern COORDINATE_PATTERN = Pattern.compile(
                      "^\\s*([+-]?(?:90(?:\\.0+)?|(?:[0-8]?\\d)(?:\\.\\d+)?))" +
                      "[\\s,;]+" +
                      "([+-]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|\\d?\\d)(?:\\.\\d+)?))\\s*$");
          
              private static final Pattern URL_PATTERN = Pattern.compile(
                      "https?://[^\\s<>\"]+",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern DATA_COORDINATE_PATTERN = Pattern.compile(
                      "!3d([+-]?\\d{1,2}(?:\\.\\d+)?)!4d([+-]?\\d{1,3}(?:\\.\\d+)?)",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern AT_COORDINATE_PATTERN = Pattern.compile(
                      "@([+-]?\\d{1,2}(?:\\.\\d+)?),([+-]?\\d{1,3}(?:\\.\\d+)?)",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern QUERY_COORDINATE_PATTERN = Pattern.compile(
                      "(?:[?&]|\\b)(?:q|query|ll|destination|origin)=" +
                      "([+-]?\\d{1,2}(?:\\.\\d+)?)(?:%2C|,|%20|\\+|\\s)+" +
                      "([+-]?\\d{1,3}(?:\\.\\d+)?)",
                      Pattern.CASE_INSENSITIVE);
          
              private static final Pattern POSTAL_CITY_PATTERN = Pattern.compile(
                      "\\b(?:[A-Z]{1,3}-)?\\d{4,6}\\s+([^,\\n]+)",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
          
              private static final Pattern POSTAL_CODE_PATTERN = Pattern.compile(
                      "\\b((?:[A-Z]{1,3}-)?\\d{4,6})\\b",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
          
              private static final Pattern INLINE_METADATA_PATTERN = Pattern.compile(
                      "(?i)(?:^|[,;])\\s*(?:AUTRE|OTHER|SONSTIGE|PRODUIT|PRODUCT|" +
                      "MARCHANDISE|GOODS|WARE|ARTICLE|COMMODITY|PULPE|BETTERAVE|" +
                      "COMPTE|ACCOUNT|KONTO|REFERENCE|REF|TELEPHONE|TEL|NOTE|" +
                      "COMMENT|MEGJEGYZES)\\b.*$");
          
              private static final Pattern COUNTRY_TOKEN_PATTERN = Pattern.compile(
                      "(?i)^(?:FR|FRANCE|FRANCIAORSZAG|" +
                      "CH|SUISSE|SCHWEIZ|SWITZERLAND|SVAJC|" +
                      "BE|BELGIQUE|BELGIUM|" +
                      "DE|DEUTSCHLAND|GERMANY|NEMETORSZAG|" +
                      "NL|NEDERLAND|NETHERLANDS|HOLLANDIA|" +
                      "LU|LUXEMBOURG|AT|AUSTRIA|OSTERREICH|AUSZTRIA|" +
                      "IT|ITALIA|ITALY|OLASZORSZAG|" +
                      "ES|ESPANA|SPAIN|SPANYOLORSZAG|" +
                      "HU|HUNGARY|MAGYARORSZAG|" +
                      "PL|POLAND|POLSKA|LENGYELORSZAG|" +
                      "CZ|CZECHIA|CESKO|CSEHORSZAG|" +
                      "SK|SLOVAKIA|SLOVENSKO|SZLOVAKIA|" +
                      "SI|SLOVENIA|SLOVENIJA|HR|CROATIA|HRVATSKA|" +
                      "RO|ROMANIA|BG|BULGARIA|DK|DENMARK|DANIA|" +
                      "SE|SWEDEN|SVERIGE|NO|NORWAY|NORGE|" +
                      "FI|FINLAND|SUOMI|GB|UK|UNITED KINGDOM)$");
          
              private EditText pickupEditor;
              private EditText deliveryEditor;
              private EditText waypointEditor;
          
              private TextView pickupStatus;
              private TextView deliveryStatus;
              private TextView waypointStatus;
              private TextView statusText;
          
              private Button finishButton;
              private Button sygicIdButton;
              private Button googleApiButton;
              private boolean sygicIdPromptShown;
              private boolean googleApiPromptShown;
              private boolean geocodingInProgress;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
                  loadState();
                  handleIncomingIntent(getIntent());
                  new Handler(Looper.getMainLooper()).postDelayed(
                          this::promptForGoogleApiKeyIfMissing, 350L);
              }
          
              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIncomingIntent(intent);
              }
          
              private void handleIncomingIntent(Intent intent) {
                  if (intent == null) return;
          
                  if (ACTION_IMPORT_MAPS_CLIPBOARD.equals(intent.getAction())) {
                      intent.setAction(null);
                      new Handler(Looper.getMainLooper()).postDelayed(
                              this::importMapsLinkFromClipboard,
                              500L);
                      return;
                  }
          
                  handleIncomingShare(intent);
              }
          
              private void importMapsLinkFromClipboard() {
                  ClipboardManager clipboard =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
          
                  if (clipboard == null || !clipboard.hasPrimaryClip()) {
                      Toast.makeText(this,
                              "A Google Maps nem másolt helylinket. " +
                              "Nyisd meg újra a pontos helyet, majd nyomd meg a + gombot.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  ClipData clip = clipboard.getPrimaryClip();
                  if (clip == null || clip.getItemCount() == 0) {
                      Toast.makeText(this,
                              "A vágólapon nincs feldolgozható Google Maps link.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  CharSequence value = clip.getItemAt(0).coerceToText(this);
                  String shared = value == null ? "" : value.toString().trim();
          
                  if (shared.isEmpty()) {
                      Toast.makeText(this,
                              "A Google Maps üres linket másolt.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  Toast.makeText(this,
                          "A Google Maps koordináta beolvasása folyamatban…",
                          Toast.LENGTH_LONG).show();
          
                  new Thread(() -> resolveSharedPlace(
                          shared, ""), "maps-clipboard-resolver").start();
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  loadState();
                  new Handler(Looper.getMainLooper()).postDelayed(
                          this::autoGeocodeMissingPoints, 250L);
              }
          
              @Override
              protected void onPause() {
                  saveQueriesAndWaypoints();
                  super.onPause();
              }
          
