          assert 'a Sygic sorrendje és feliratai' in main
          assert 'KEY_SYGIC_DEVICE_ID = "sygic_device_id"' in main
          assert 'showSygicDeviceIdDialog(true)' in main
          assert 'CONFIGURED_DEVICE_ID' not in plan
