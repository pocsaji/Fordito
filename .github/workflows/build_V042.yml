              }
          
              private List<String> readVisibleLines(String packageFilter) {
                  AccessibilityNodeInfo root = findPackageRoot(packageFilter);
                  if (root == null) return Collections.emptyList();
          
                  ArrayList<String> lines = new ArrayList<>();
                  try {
                      collectText(root, packageFilter, lines);
                  } finally {
                      root.recycle();
                  }
                  return lines;
              }
          
              private AccessibilityNodeInfo findPackageRoot(String packageFilter) {
                  if (packageFilter != null) {
                      List<AccessibilityWindowInfo> windows = getWindows();
                      if (windows != null) {
                          for (AccessibilityWindowInfo window : windows) {
                              if (window == null) continue;
                              AccessibilityNodeInfo root = window.getRoot();
                              if (root == null) continue;
          
                              CharSequence packageName = root.getPackageName();
                              if (packageName != null &&
                                      packageFilter.contentEquals(packageName)) {
                                  return root;
                              }
                              root.recycle();
                          }
                      }
                  }
          
                  AccessibilityNodeInfo active = getRootInActiveWindow();
                  if (active == null) return null;
                  if (packageFilter == null) return active;
          
                  CharSequence packageName = active.getPackageName();
                  if (packageName != null &&
                          packageFilter.contentEquals(packageName)) {
                      return active;
                  }
                  active.recycle();
                  return null;
              }
          
              private void collectText(
                      AccessibilityNodeInfo node,
                      String packageFilter,
                      List<String> output) {
                  if (node == null) return;
          
                  CharSequence packageName = node.getPackageName();
                  boolean packageAllowed = packageFilter == null ||
                          packageName == null ||
                          packageFilter.contentEquals(packageName);
          
                  if (packageAllowed) {
                      addText(output, node.getText());
                      addText(output, node.getContentDescription());
                      addText(output, node.getHintText());
                  }
          
                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          collectText(child, packageFilter, output);
                      } finally {
                          child.recycle();
                      }
                  }
              }
          
              private void addText(List<String> output, CharSequence value) {
                  String clean = clean(value == null ? "" : value.toString());
                  if (!clean.isEmpty()) output.add(clean);
              }
          
              private String findCoordinate(List<String> lines) {
                  if (lines == null || lines.isEmpty()) return null;
          
                  for (String line : lines) {
                      String coordinate = normalizeCoordinate(line);
                      if (coordinate != null) return coordinate;
                  }
          
                  String joined = String.join(" ", lines);
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          joined.replace('−', '-'));
                  while (matcher.find()) {
                      String coordinate = normalizeCoordinate(
                              matcher.group(1) + " " + matcher.group(2));
                      if (coordinate != null) return coordinate;
                  }
                  return null;
              }
          
              private static String normalizeCoordinate(String value) {
                  if (value == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          value.replace('−', '-'));
                  if (!matcher.matches()) return null;
                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (latitude < -90.0 || latitude > 90.0 ||
                              longitude < -180.0 || longitude > 180.0) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }
          
              private static String plain(double value) {
                  return BigDecimal.valueOf(value)
                          .setScale(6, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }
          
              private static List<String> parseLines(String source) {
                  ArrayList<String> result = new ArrayList<>();
                  if (source == null || source.isBlank()) return result;
                  for (String line : source.split("\\r?\\n")) {
                      String clean = clean(line);
                      if (!clean.isEmpty()) result.add(clean);
                  }
                  return result;
              }
          
              private static List<String> unique(List<String> source) {
                  LinkedHashSet<String> result = new LinkedHashSet<>();
                  for (String value : source) {
                      String clean = clean(value);
                      if (!clean.isEmpty()) result.add(clean);
                  }
                  return new ArrayList<>(result);
              }
          
              private void finishProcessing() {
                  captureMode = CAPTURE_NONE;
                  captureToken++;
                  processing.set(false);
                  if (floatingButton != null) {
                      floatingButton.setVisibility(View.VISIBLE);
                      floatingButton.setEnabled(true);
                  }
                  updateFloatingButton();
              }
          
              private static String clean(String value) {
                  if (value == null) return "";
                  return value.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private static String normalized(String value) {
                  String noAccent = Normalizer.normalize(
                          clean(value), Normalizer.Form.NFD)
                          .replaceAll("\\p{M}+", "");
                  return noAccent.toUpperCase(Locale.ROOT)
                          .replaceAll("[^A-Z0-9]+", " ")
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private int dp(int value) {
                  return Math.round(value *
                          getResources().getDisplayMetrics().density);
              }
          
          
          
              private void registerTomTomRouteReceiver() {
                  if (tomTomReceiverRegistered) return;
                  IntentFilter filter =
                          new IntentFilter(ACTION_START_TOMTOM_AUTOMATION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(
                              tomTomRouteReceiver,
                              filter,
                              Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(tomTomRouteReceiver, filter);
                  }
                  tomTomReceiverRegistered = true;
              }
          
              private void loadPendingTomTomRequest() {
                  SharedPreferences preferences = getSharedPreferences(
                          PlanTomTomActivity.AUTOMATION_PREFS, MODE_PRIVATE);
                  String serialized = preferences.getString(
                          PlanTomTomActivity.KEY_PENDING_ROUTE, "");
                  String requestId = preferences.getString(
                          PlanTomTomActivity.KEY_PENDING_REQUEST_ID, "");
                  if (serialized == null || serialized.trim().isEmpty() ||
                          requestId == null || requestId.trim().isEmpty()) {
                      return;
                  }
          
                  ArrayList<String> points = new ArrayList<>();
                  for (String line : serialized.split("\\n")) {
                      String coordinate = line.trim();
                      if (!coordinate.isEmpty()) points.add(coordinate);
                  }
                  if (points.size() >= 2) {
                      startTomTomRouteAutomation(points, requestId);
                  }
              }
          
              private void startTomTomRouteAutomation(
                      List<String> points,
                      String requestId) {
                  if (points == null || points.size() < 2 ||
                          points.size() > 30) {
                      clearStoredTomTomRequest();
                      Toast.makeText(this,
                              "A koordinátapontok száma 2 és 30 között lehet.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  String safeRequestId = requestId == null ? "" : requestId.trim();
                  if (tomTomStage != TT_STAGE_NONE &&
                          safeRequestId.equals(tomTomRequestId)) {
                      return;
                  }
          
                  /*
                   * Az új útvonalparancs mindig felülírja a korábban félbemaradt
                   * képernyő- vagy TomTom-műveletet. A generációs azonosító minden
                   * régi késleltetett és OCR-visszahívást érvénytelenít.
                   */
                  if (tomTomStage != TT_STAGE_NONE) {
                      resetTomTomRuntimeState();
                      finishProcessing();
                  } else if (processing.get()) {
                      finishProcessing();
                  }
                  if (!processing.compareAndSet(false, true)) {
                      Toast.makeText(this,
                              "A TomTom automatizálása most nem indítható.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  resetTomTomRuntimeState();
                  tomTomRoutePoints.addAll(points);
                  tomTomRequestId = safeRequestId;
                  /*
                   * A TomTom többmegállós tervezése a végcéllal indul, majd a
                   * köztes pontokat fordított sorrendben kell hozzáadni.
                   * Így a legutoljára hozzáadott felrakó lesz az első megálló.
                   */
                  tomTomNextStopIndex = tomTomRoutePoints.size() - 2;
                  tomTomAddingStop = false;
                  tomTomConfirmedPointCount = 0;
                  setTomTomPendingCoordinate(
                          tomTomRoutePoints.get(tomTomRoutePoints.size() - 1));
                  tomTomDeadline = SystemClock.uptimeMillis() +
                          Math.max(150000L, tomTomRoutePoints.size() * 55000L);
                  moveTomTomToStage(TT_STAGE_WAIT_APP, 300L);
          
                  if (floatingButton != null) {
                      floatingButton.setText("→");
                      setButtonColor(Color.rgb(45, 105, 205));
                  }
          
                  Toast.makeText(this,
                          tomTomRoutePoints.size() +
                                  " koordinátapont ellenőrzött bevitele indul.",
                          Toast.LENGTH_LONG).show();
              }
          
              private void setTomTomPendingCoordinate(String coordinate) {
                  tomTomPendingCoordinate = coordinate == null
                          ? null
                          : coordinate.trim();
                  tomTomImeEnterSent = false;
              }
          
              private void scheduleTomTomStep(long delayMs) {
                  if (tomTomStage == TT_STAGE_NONE || tomTomStepScheduled) return;
          
                  final int generation = tomTomGeneration;
                  tomTomStepScheduled = true;
                  handler.postDelayed(() -> {
                      if (generation != tomTomGeneration) return;
                      tomTomStepScheduled = false;
                      runTomTomAutomationStep();
                  }, Math.max(50L, delayMs));
              }
          
              private void moveTomTomToStage(int stage, long delayMs) {
                  tomTomStage = stage;
                  tomTomAttempts = 0;
                  tomTomImeEnterSent = false;
                  tomTomStageStartedAt = SystemClock.uptimeMillis();
                  tomTomStableGuidanceChecks = 0;
                  if (stage == TT_STAGE_SELECT_LAT_LONG) {
                      tomTomSearchTypeScrolls = 0;
                  }
                  scheduleTomTomStep(delayMs);
              }
          
              private void runTomTomAutomationStep() {
                  if (tomTomStage == TT_STAGE_NONE) return;
          
                  long now = SystemClock.uptimeMillis();
                  if (now > tomTomDeadline) {
                      cancelTomTomAutomation(
                              "A TomTom automatikus kitöltése túllépte a teljes időkeretet.");
                      return;
                  }
                  if (tomTomAttempts >= TT_MAX_RETRIES ||
                          now - tomTomStageStartedAt > TT_STAGE_TIMEOUT_MS) {
                      cancelTomTomAutomation(
                              "A TomTom képernyője nem a várt állapotba került: " +
                                      tomTomStageName(tomTomStage) + ".");
                      return;
                  }
          
                  if (dismissGoogleVoiceErrorDialogIfPresent()) {
                      scheduleTomTomStep(550L);
                      return;
                  }

                  AccessibilityNodeInfo root = findPackageRoot(TOMTOM_PACKAGE);
                  if (root == null) {
                      scheduleTomTomStep(450L);
                      return;
                  }
          
                  tomTomAttempts++;
                  try {
                      String blocking = findVisibleLabel(root, TT_BLOCKING_LABELS);
                      if (blocking != null) {
                          cancelTomTomAutomation(
                                  "A TomTom első beállítását kézzel kell befejezni: " +
                                          blocking + ".");
                          return;
                      }
          
                      String error = findVisibleLabel(root, TT_ERROR_LABELS);
                      if (error != null) {
                          cancelTomTomAutomation(
                                  "A TomTom hibát jelzett: " + error + ".");
                          return;
                      }
          
                      switch (tomTomStage) {
                          case TT_STAGE_WAIT_APP:
                              handleTomTomWaitApp(root);
                              break;
                          case TT_STAGE_RESET_OPEN_MENU:
                              handleTomTomResetOpenMenu(root);
                              break;
                          case TT_STAGE_RESET_INSPECT_MENU:
                              handleTomTomResetInspectMenu(root);
                              break;
                          case TT_STAGE_RESET_CLEAR_ROUTE:
                              handleTomTomResetClearRoute(root);
                              break;
                          case TT_STAGE_OPEN_SEARCH:
                              handleTomTomOpenSearch(root);
                              break;
                          case TT_STAGE_OPEN_SEARCH_TYPE:
                              handleTomTomOpenSearchType(root);
                              break;
                          case TT_STAGE_SELECT_LAT_LONG:
                              handleTomTomSelectLatLong(root);
                              break;
                          case TT_STAGE_ENTER_COORDINATE:
                              handleTomTomEnterCoordinate(root);
                              break;
                          case TT_STAGE_SELECT_SUGGESTION:
                              handleTomTomSelectSuggestion(root);
                              break;
                          case TT_STAGE_CONFIRM_POINT:
                              handleTomTomConfirmPoint(root);
                              break;
                          case TT_STAGE_WAIT_ROUTE:
                              handleTomTomWaitRoute(root);
                              break;
                          case TT_STAGE_OPEN_MENU:
                              handleTomTomOpenMenu(root);
                              break;
                          case TT_STAGE_OPEN_CURRENT_ROUTE:
                              handleTomTomOpenCurrentRoute(root);
                              break;
                          case TT_STAGE_SELECT_ADD_STOP:
                              handleTomTomSelectAddStop(root);
                              break;
                          case TT_STAGE_WAIT_STOP:
                              handleTomTomWaitStop(root);
                              break;
                          case TT_STAGE_START_NAVIGATION:
                              handleTomTomStartNavigation(root);
                              break;
                          case TT_STAGE_WAIT_GUIDANCE:
                              handleTomTomWaitGuidance(root);
                              break;
                          default:
                              cancelTomTomAutomation(
                                      "Ismeretlen TomTom automatizálási állapot.");
                              return;
                      }
                  } finally {
                      root.recycle();
                  }
          
                  scheduleTomTomStep(TT_STEP_INTERVAL_MS);
              }
          
              private void handleTomTomWaitApp(AccessibilityNodeInfo root) {
                  AccessibilityNodeInfo latLong =
                          findBestTomTomControl(root, TT_LAT_LONG_LABELS);
                  if (latLong != null) {
                      latLong.recycle();
                      moveTomTomToStage(TT_STAGE_SELECT_LAT_LONG, 80L);
                      return;
                  }

                  AccessibilityNodeInfo searchType =
                          findBestTomTomControl(root, TT_SEARCH_TYPE_LABELS);
                  AccessibilityNodeInfo editable = findTomTomEditable(root);
                  if (editable != null && searchType != null) {
                      editable.recycle();
                      searchType.recycle();
                      moveTomTomToStage(TT_STAGE_OPEN_SEARCH_TYPE, 80L);
                      return;
                  }
                  if (searchType != null) searchType.recycle();
                  if (editable != null) {
                      boolean coordinateEditor = looksLikeCoordinateEditor(root);
                      editable.recycle();
                      if (coordinateEditor) {
                          moveTomTomToStage(TT_STAGE_ENTER_COORDINATE, 80L);
                      } else {
                          performGlobalAction(GLOBAL_ACTION_BACK);
                          moveTomTomToStage(TT_STAGE_RESET_OPEN_MENU, 500L);
                      }
                      return;
                  }
          
                  AccessibilityNodeInfo currentRoute =
                          findBestTomTomControl(root, TT_CURRENT_ROUTE_LABELS);
                  if (currentRoute != null) {
                      currentRoute.recycle();
                      moveTomTomToStage(TT_STAGE_RESET_INSPECT_MENU, 80L);
                      return;
                  }
          
                  AccessibilityNodeInfo menu =
                          findBestTomTomControl(root, TT_MAIN_MENU_LABELS);
                  if (menu != null) {
                      menu.recycle();
                      moveTomTomToStage(TT_STAGE_RESET_OPEN_MENU, 80L);
                      return;
                  }
          
                  AccessibilityNodeInfo search =
                          findBestTomTomControl(root, TT_SEARCH_LABELS);
                  if (search != null) {
                      search.recycle();
                      moveTomTomToStage(TT_STAGE_OPEN_SEARCH, 80L);
                      return;
                  }
          
                  if (tomTomAttempts >= 8) {
                      moveTomTomToStage(TT_STAGE_OPEN_SEARCH, 100L);
                  }
